name: Joomla 5/6 current season gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  act-season:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate current season module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_act_season
          manifest="$module/mod_sportsmanagement_act_season.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/ActSeasonHelper.php"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/ActSeasonHelper.php"
          php -l "$module/mod_sportsmanagement_act_season.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementActSeason</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q "getLanguage()->load('com_sportsmanagement'" "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'getDBConnection' "$module/src/Helper/ActSeasonHelper.php"
          grep -q "btn btn-default'" "$module/tmpl/default.php"
          grep -q "btn btn-secondary'" "$module/tmpl/default.php"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'Current season manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/ActSeasonHelper.php" \
            "$module/mod_sportsmanagement_act_season.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php"; then
            echo 'Current season module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
