name: Joomla 5/6 administrator age groups migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/views/agegroups/**'
      - 'admin/tmpl/agegroups/**'
      - 'admin/src/View/Agegroups/**'
      - 'admin/src/Model/AgegroupsModel.php'
      - 'admin/src/Model/DatabasetoolModel.php'
      - '.github/workflows/joomla5-6-admin-agegroups.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/views/agegroups/**'
      - 'admin/tmpl/agegroups/**'
      - 'admin/src/View/Agegroups/**'
      - 'admin/src/Model/AgegroupsModel.php'
      - 'admin/src/Model/DatabasetoolModel.php'
      - '.github/workflows/joomla5-6-admin-agegroups.yml'

jobs:
  agegroups:
    name: Native age groups view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate age groups migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/views/agegroups/view.html.php
            admin/views/agegroups/tmpl/default.php
            admin/tmpl/agegroups/default.php
            admin/src/View/Agegroups/HtmlView.php
            admin/src/Model/AgegroupsModel.php
            admin/src/Model/DatabasetoolModel.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          legacy_view=admin/views/agegroups/view.html.php
          legacy_template=admin/views/agegroups/tmpl/default.php
          native_view=admin/src/View/Agegroups/HtmlView.php
          native_template=admin/tmpl/agegroups/default.php

          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewagegroups')" "$legacy_view"
          grep -q 'components/com_sportsmanagement/tmpl/agegroups/default.php' "$legacy_template"

          grep -q 'final class HtmlView extends BaseHtmlView' "$native_view"
          grep -q 'instanceof AgegroupsModel' "$native_view"
          grep -q "bootComponent('com_sportsmanagement')->getMVCFactory()" "$native_view"
          grep -q "createModel('Databasetool', 'Administrator')" "$native_view"
          grep -q 'insertAgegroup' "$native_view"
          grep -q "ToolbarHelper::apply('agegroups.saveshort')" "$native_view"
          grep -q "ToolbarHelper::custom('agegroups.import'" "$native_view"
          grep -q "ToolbarHelper::archiveList('agegroup.export'" "$native_view"

          grep -q 'class AgegroupsModel extends SportsManagementListModel' admin/src/Model/AgegroupsModel.php
          grep -q '#__sportsmanagement_agegroup' admin/src/Model/AgegroupsModel.php
          grep -q 'final class DatabasetoolModel extends BaseDatabaseModel' admin/src/Model/DatabasetoolModel.php
          grep -q 'function insertAgegroup' admin/src/Model/DatabasetoolModel.php
          grep -q "HTMLHelper::_('form.token')" "$native_template"

          if grep -E -- 'JSMCountries::|JHtmlSelect::|BaseDatabaseModel::getInstance\(|Table::getInstance\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getContainer\(|->getDbo\(|->setDbo\(|JLoader::import\(|jimport\(|JError::|jexit\(|joomla_version' "$legacy_view" "$legacy_template" "$native_view" "$native_template"; then
            echo 'Age groups active view stack regressed to a removed/deprecated Joomla or legacy API' >&2
            exit 1
          fi
