name: Joomla 5/6 administrator Ajax migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  ajax:
    name: Native administrator Ajax model/controller checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ajax migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/AjaxModel.php
            admin/src/Controller/AjaxController.php
            admin/models/ajax.php
            admin/controllers/ajax.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class AjaxModel extends BaseDatabaseModel' admin/src/Model/AjaxModel.php
          grep -q 'class AjaxController extends BaseController' admin/src/Controller/AjaxController.php
          grep -q "class_alias(AjaxModel::class, 'sportsmanagementModelAjax')" admin/models/ajax.php
          grep -q "class_alias(AjaxController::class, 'sportsmanagementControllerAjax')" admin/controllers/ajax.php

          model_methods=(
            getPredictionId
            addGlobalSelectElement
            getPredictionPj
            getPredictionGroups
            getpersoncontactid
            getcountryleagueoptions
            getcountryclubagegroupoptions
            getassociationsoptions
            getseasons
            getsportstypes
            getlocationzipcodeoptions
            getCcountryName
            getCcountryAlpha2
            getcountryzipcodeoptions
            getProjectRoundOptions
            getpersonpositionoptions
            getpersonagegroupoptions
            getpredictionmembersoptions
            getpersonlistoptions
            getpersonlistoptionsprojectteam
            getProjectDivisionsOptions
            getProjectTeamsByDivisionOptions
            getProjectsByClubOptions
            getProjects
            getProjectTeamOptions
            getProjectPlayerOptions
            getProjectStaffOptions
            getProjectClubOptions
            getProjectEventsOptions
            getProjectStatsOptions
            getProjectStatOptions
            getMatchesOptions
            getProjectTreenodeOptions
            getProjectsBySportsTypesOptions
            getAgeGroupsBySportsTypesOptions
            getProjectTeamPtidOptions
            getRefereesOptions
          )

          for method in "${model_methods[@]}"; do
            grep -q "function ${method}" admin/src/Model/AjaxModel.php
          done

          controller_methods=(
            predictionid
            predictiongroups
            predictionpj
            locationzipcodeoptions
            countryleagueoptions
            countryzipcodeoptions
            personcontactid
            projects
            seasons
            personlistoptions
            personlistoptionsprojectteam
            personpositionoptions
            personagegroupoptions
            predictionmembersoptions
            projectdivisionsoptions
            projecteventsoptions
            projectteamsbydivisionoptions
            projectsbysportstypesoptions
            agegroupsbysportstypesoptions
            projectsbycluboptions
            projectteamoptions
            projectteamsptidoptions
            projectplayeroptions
            projectstaffoptions
            projectcluboptions
            projectstatsoptions
            matchesoptions
            refereesoptions
            projectroundoptions
            projecttreenodeoptions
            sportstypesoptions
          )

          for method in "${controller_methods[@]}"; do
            grep -q "function ${method}" admin/src/Controller/AjaxController.php
          done

          grep -q "respondModel('getpersonlistoptionsprojectteam'" admin/src/Controller/AjaxController.php
          grep -q "respondProjectOption('getProjectStatsOptions'" admin/src/Controller/AjaxController.php
          grep -q "getModel('Ajax', 'Administrator'" admin/src/Controller/AjaxController.php
          grep -q "setMimeEncoding('application/json')" admin/src/Controller/AjaxController.php
          grep -q "getBool('required')" admin/src/Controller/AjaxController.php
          grep -q "getBool('slug')" admin/src/Controller/AjaxController.php
          grep -q "getBool('dbase')" admin/src/Controller/AjaxController.php

          grep -q 'sportsmanagementHelper::getDBConnection' admin/src/Model/AjaxModel.php
          grep -q 'DatabaseInterface::class' admin/src/Model/AjaxModel.php
          grep -q "a.sportstype_id" admin/src/Model/AjaxModel.php
          grep -q 'function applyIdFilter' admin/src/Model/AjaxModel.php
          grep -q 'function ids' admin/src/Model/AjaxModel.php
          grep -q 'function loadOptions' admin/src/Model/AjaxModel.php

          if grep -q 'a.sports_type_id' admin/src/Model/AjaxModel.php; then
            echo 'Ajax age-group query regressed to the wrong sports_type_id column' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getVar\(|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Administrator Ajax migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
