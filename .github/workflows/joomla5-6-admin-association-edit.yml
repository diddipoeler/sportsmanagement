name: Joomla 5/6 administrator association migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  associations:
    name: Native association model/controller/import checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate association migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/JlextassociationModel.php
            admin/src/Model/JlextassociationsModel.php
            admin/src/Controller/JlextassociationController.php
            admin/src/Controller/JlextassociationsController.php
            admin/models/jlextassociation.php
            admin/models/jlextassociations.php
            admin/controllers/jlextassociation.php
            admin/controllers/jlextassociations.php
            admin/views/jlextassociation/view.html.php
            admin/views/jlextassociations/view.html.php
            admin/views/jlextassociations/tmpl/default.php
            admin/views/jlextassociations/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/jlextassociation.xml
          test -f admin/helpers/xml_files/associations.xml

          grep -q 'class JlextassociationModel extends SportsManagementAdminModel' admin/src/Model/JlextassociationModel.php
          grep -q 'models/forms' admin/src/Model/JlextassociationModel.php
          grep -q "getTable(\$type = 'jlextassociation'" admin/src/Model/JlextassociationModel.php
          grep -q 'function prepareSportsManagementData' admin/src/Model/JlextassociationModel.php
          grep -q 'founded_timestamp' admin/src/Model/JlextassociationModel.php
          grep -q 'dissolved_timestamp' admin/src/Model/JlextassociationModel.php

          grep -q 'class JlextassociationsModel extends SportsManagementListModel' admin/src/Model/JlextassociationsModel.php
          for method in getAssociations checkAssociations getListQuery; do
            grep -q "function ${method}" admin/src/Model/JlextassociationsModel.php
          done
          grep -q "quoteName('#__sportsmanagement_associations'" admin/src/Model/JlextassociationsModel.php
          grep -q 'cfg_country_associations' admin/src/Model/JlextassociationsModel.php
          grep -q 'simplexml_load_file' admin/src/Model/JlextassociationsModel.php
          grep -q 'transactionStart' admin/src/Model/JlextassociationsModel.php
          grep -q 'transactionCommit' admin/src/Model/JlextassociationsModel.php
          grep -q 'transactionRollback' admin/src/Model/JlextassociationsModel.php
          grep -q 'insertObject' admin/src/Model/JlextassociationsModel.php
          grep -q 'updateObject' admin/src/Model/JlextassociationsModel.php

          grep -q 'class JlextassociationController extends SportsManagementFormController' admin/src/Controller/JlextassociationController.php
          grep -q 'class JlextassociationsController extends SportsManagementAdminController' admin/src/Controller/JlextassociationsController.php
          grep -q "getModel(\$name = 'Jlextassociation'" admin/src/Controller/JlextassociationsController.php
          grep -q 'function import' admin/src/Controller/JlextassociationsController.php
          grep -q 'checkToken' admin/src/Controller/JlextassociationsController.php
          grep -q "parent::getModel('Jlextassociations'" admin/src/Controller/JlextassociationsController.php

          grep -q "class_alias(JlextassociationModel::class, 'sportsmanagementModeljlextassociation')" admin/models/jlextassociation.php
          grep -q "class_alias(JlextassociationsModel::class, 'sportsmanagementModeljlextassociations')" admin/models/jlextassociations.php
          grep -q "class_alias(JlextassociationController::class, 'sportsmanagementControllerjlextassociation')" admin/controllers/jlextassociation.php
          grep -q "class_alias(JlextassociationsController::class, 'sportsmanagementControllerjlextassociations')" admin/controllers/jlextassociations.php

          grep -q '\$this->app->getInput()' admin/views/jlextassociation/view.html.php
          grep -q '\$this->model->getAssociations' admin/views/jlextassociations/view.html.php
          grep -q "HTMLHelper::_('select.genericlist'" admin/views/jlextassociations/view.html.php
          grep -q "HTMLHelper::_('form.token')" admin/views/jlextassociations/tmpl/default.php
          grep -q 'Session::getFormToken' admin/views/jlextassociations/tmpl/default_data.php
          grep -q 'is_file' admin/views/jlextassociations/tmpl/default_data.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|JHtmlSelect::|sportsmanagementModeldatabasetool|Joomla\\CMS\\Filesystem\\File|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Association migration regressed to a removed Joomla or legacy MVC/database API' >&2
            exit 1
          fi
