name: Joomla 5/6 admin base and AJAX bridge batch 21

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/controllers/ajaxcalls.php'
      - 'admin/src/Controller/SportsManagementAdminController.php'
      - 'admin/src/Controller/SportsManagementFormController.php'
      - '.github/workflows/joomla5-6-admin-base-ajax-batch21.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/controllers/ajaxcalls.php'
      - 'admin/src/Controller/SportsManagementAdminController.php'
      - 'admin/src/Controller/SportsManagementFormController.php'
      - '.github/workflows/joomla5-6-admin-base-ajax-batch21.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 controller metadata and bridges
        shell: bash
        run: |
          set -euo pipefail

          php_files=(
            admin/controllers/ajaxcalls.php
            admin/src/Controller/SportsManagementAdminController.php
            admin/src/Controller/SportsManagementFormController.php
          )

          for file in "${php_files[@]}"; do
            test -f "$file"
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          if grep -En 'JFactory::|JRequest::|Factory::getApplication\(\)|extends[[:space:]]+JController|extends[[:space:]]+JSMController' "${php_files[@]}"; then
            echo 'Deprecated Joomla controller API found in batch 21 files.' >&2
            exit 1
          fi

          grep -Fq 'abstract class SportsManagementAdminController extends AdminController' admin/src/Controller/SportsManagementAdminController.php
          grep -Fq 'class SportsManagementFormController extends FormController' admin/src/Controller/SportsManagementFormController.php
          grep -Fq "class_alias(MatchesController::class, 'sportsmanagementControllerajaxcalls');" admin/controllers/ajaxcalls.php
