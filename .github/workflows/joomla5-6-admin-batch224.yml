name: Joomla 5/6 admin batch 224

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/View/Projectteam/HtmlView.php'
      - 'admin/src/View/Round/HtmlView.php'
      - 'admin/src/View/Smextxmleditor/HtmlView.php'
      - 'admin/src/View/Smextxmleditors/HtmlView.php'
      - '.github/workflows/joomla5-6-admin-batch224.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/View/Projectteam/HtmlView.php'
      - 'admin/src/View/Round/HtmlView.php'
      - 'admin/src/View/Smextxmleditor/HtmlView.php'
      - 'admin/src/View/Smextxmleditors/HtmlView.php'
      - '.github/workflows/joomla5-6-admin-batch224.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/View/Projectteam/HtmlView.php
            admin/src/View/Round/HtmlView.php
            admin/src/View/Smextxmleditor/HtmlView.php
            admin/src/View/Smextxmleditors/HtmlView.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done
      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Round/HtmlView.php
          ! grep -Fq -- 'Factory::getApplication()' admin/src/View/Round/HtmlView.php
          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Smextxmleditor/HtmlView.php
          ! grep -Fq -- 'Factory::getApplication()' admin/src/View/Smextxmleditor/HtmlView.php
          echo 'Joomla 5/6 batch 224 contracts OK.'
