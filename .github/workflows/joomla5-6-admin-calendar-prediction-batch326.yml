name: Joomla 5/6 admin calendar prediction batch 326

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/predictiongame.php'
      - 'admin/models/predictionmember.php'
      - 'admin/models/updates.php'
      - 'admin/models/jsmgcalendar.php'
      - 'admin/models/jsmgcalendars.php'
      - 'admin/models/jsmgcalendarimport.php'
      - '.github/workflows/joomla5-6-admin-calendar-prediction-batch326.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/predictiongame.php'
      - 'admin/models/predictionmember.php'
      - 'admin/models/updates.php'
      - 'admin/models/jsmgcalendar.php'
      - 'admin/models/jsmgcalendars.php'
      - 'admin/models/jsmgcalendarimport.php'
      - '.github/workflows/joomla5-6-admin-calendar-prediction-batch326.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate admin compatibility bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/predictiongame.php
            admin/models/predictionmember.php
            admin/models/updates.php
            admin/models/jsmgcalendar.php
            admin/models/jsmgcalendars.php
            admin/models/jsmgcalendarimport.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
            grep -Fq -- 'class_alias(' "$file"
          done
