name: Joomla 5/6 administrator calendar table loaders batch 446

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tables/jsmgcalendar.php'
      - 'admin/tables/jsmgcalendarap.php'
      - 'admin/tables/jsmgcalendarcomment.php'
      - 'admin/tables/jsmgcalendarimport.php'
      - '.github/workflows/joomla5-6-admin-calendar-table-loaders-batch446.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/tables/jsmgcalendar.php'
      - 'admin/tables/jsmgcalendarap.php'
      - 'admin/tables/jsmgcalendarcomment.php'
      - 'admin/tables/jsmgcalendarimport.php'
      - '.github/workflows/joomla5-6-admin-calendar-table-loaders-batch446.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator calendar table loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(admin/tables/jsmgcalendar.php admin/tables/jsmgcalendarap.php admin/tables/jsmgcalendarcomment.php admin/tables/jsmgcalendarimport.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do grep -Fq -- "$tag" "$file"; done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'is_file($nativeTable)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
            ! grep -Fq -- 'require_once JPATH_ADMINISTRATOR' "$file"
          done
