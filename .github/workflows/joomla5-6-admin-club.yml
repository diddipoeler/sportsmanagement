name: Joomla 5/6 administrator club migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Controller/ClubController.php'
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - 'admin/src/Helper/LocationHelper.php'
      - 'admin/src/Helper/SportsManagementDateHelper.php'
      - 'admin/src/Model/ClubModel.php'
      - 'admin/src/Model/SeasonsModel.php'
      - 'admin/src/Model/JlextassociationsModel.php'
      - 'admin/src/Table/ClubTable.php'
      - 'admin/tables/club.php'
      - 'admin/views/clubs/view.html.php'
      - '.github/workflows/joomla5-6-admin-club.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Controller/ClubController.php'
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - 'admin/src/Helper/LocationHelper.php'
      - 'admin/src/Helper/SportsManagementDateHelper.php'
      - 'admin/src/Model/ClubModel.php'
      - 'admin/src/Model/SeasonsModel.php'
      - 'admin/src/Model/JlextassociationsModel.php'
      - 'admin/src/Table/ClubTable.php'
      - 'admin/tables/club.php'
      - 'admin/views/clubs/view.html.php'
      - '.github/workflows/joomla5-6-admin-club.yml'

jobs:
  club:
    name: Native club model checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate club migration
        shell: bash
        run: |
          set -euo pipefail

          controller=admin/src/Controller/ClubController.php
          model=admin/src/Model/ClubModel.php
          table=admin/src/Table/ClubTable.php
          bridge=admin/tables/club.php
          view=admin/src/View/Clubs/HtmlView.php
          legacyview=admin/views/clubs/view.html.php
          extrahelper=admin/src/Helper/ExtraFieldsSaveHelper.php
          datehelper=admin/src/Helper/SportsManagementDateHelper.php
          locationhelper=admin/src/Helper/LocationHelper.php
          files=("$controller" "$model" "$table" "$bridge" "$view" "$legacyview" "$extrahelper" "$datehelper" "$locationhelper")

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class ClubController extends SportsManagementFormController' "$controller"
          grep -Fq '$this->getApplication()->getInput()' "$controller"
          grep -Fq '$input->post->get' "$controller"
          grep -Fq '$input->post->set' "$controller"

          grep -q 'final class ClubModel extends SportsManagementAdminModel' "$model"
          # Joomla 5.4 and Joomla 6 recommend createQuery(), not getQuery(true).
          grep -Fq 'createQuery()' "$model"
          grep -q 'ExtraFieldsSaveHelper' "$model"
          grep -q 'SportsManagementDateHelper' "$model"
          grep -q 'LocationHelper' "$model"
          # Geocoding and remote image writes have been extracted from the
          # ClubModel into bounded native helpers.
          grep -q 'RemoteImageDownloadHelper' "$model"
          grep -q 'LocationHelper' "$model"
          for method in getlogohistory getuserextrafieldvalue saveshort teamsofclub; do
            grep -q "function ${method}" "$model"
          done
          grep -q '#__sportsmanagement_club_logos' "$model"
          grep -q '#__sportsmanagement_user_extra_fields_values' "$model"
          grep -q '#__sportsmanagement_countries_plz' "$model"

          grep -q 'final class LocationHelper' "$locationhelper"
          grep -q 'Joomla\\Http\\HttpFactory' "$locationhelper"
          grep -Fq 'https://nominatim.openstreetmap.org/search' "$locationhelper"
          grep -Fq 'HttpFactory::getHttp()->get' "$locationhelper"
          grep -Fq 'getStatusCode()' "$locationhelper"
          grep -Fq 'getBody()' "$locationhelper"
          grep -Fq 'FILTER_VALIDATE_FLOAT' "$locationhelper"
          grep -q "'latitude'" "$locationhelper"
          grep -q "'longitude'" "$locationhelper"

          grep -q 'final class ClubTable extends SportsManagementTable' "$table"
          grep -q 'OutputFilter::stringURLSafe' "$table"
          grep -q "class_alias(ClubTable::class, 'sportsmanagementTableClub')" "$bridge"

          grep -Fq "bootComponent('com_sportsmanagement')->getMVCFactory()" "$view"
          grep -Fq "createModel('Club', 'Administrator')" "$view"
          grep -Fq "createModel('Seasons', 'Administrator')" "$view"
          grep -Fq "createModel('Jlextassociations', 'Administrator')" "$view"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewClubs')" "$legacyview"
          grep -Fq 'new ClubTable($model->getSportsManagementDatabase())' "$view"
          grep -Fq "'select.genericlist'," "$view"

          if grep -E -- 'Joomla\\CMS\\Filesystem\\|mkdir\(|file_put_contents\(' "$model"; then
            echo 'Club model regressed to CMS filesystem classes or raw filesystem writes' >&2
            exit 1
          fi

          if grep -E -- 'JHtmlSelect::|getQuery\(true\)|Joomla\\CMS\\Http\\|sportsmanagementHelper::|helpers/sportsmanagement\.php|JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Table::getInstance\(|->input|JDatabaseDriver::|JDatabase::' "${files[@]}"; then
            echo 'Club migration regressed to deprecated getQuery(true), JHtml/model/table factories, obsolete CMS HTTP package, or legacy helper/database API' >&2
            exit 1
          fi
