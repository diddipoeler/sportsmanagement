name: Joomla 5/6 administrator clubs migration gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/clubs/**'
      - 'admin/tmpl/clubs/**'
      - 'admin/src/View/Clubs/**'
      - 'admin/src/Model/ClubsModel.php'
      - '.github/workflows/joomla5-6-admin-clubs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/views/clubs/**'
      - 'admin/tmpl/clubs/**'
      - 'admin/src/View/Clubs/**'
      - 'admin/src/Model/ClubsModel.php'
      - '.github/workflows/joomla5-6-admin-clubs.yml'

jobs:
  native-admin-clubs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint native clubs stack
        shell: bash
        run: |
          set -euo pipefail
          for file in admin/views/clubs/view.html.php admin/views/clubs/tmpl/default.php admin/src/View/Clubs/HtmlView.php admin/src/Model/ClubsModel.php admin/tmpl/clubs/default.php; do
            test -f "$file"
            php -l "$file"
          done
      - name: Validate native clubs contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          legacy_view = Path('admin/views/clubs/view.html.php').read_text(encoding='utf-8')
          legacy_template = Path('admin/views/clubs/tmpl/default.php').read_text(encoding='utf-8')
          native_view = Path('admin/src/View/Clubs/HtmlView.php').read_text(encoding='utf-8')
          native_template = Path('admin/tmpl/clubs/default.php').read_text(encoding='utf-8')
          checks = {
              'legacy alias': (legacy_view, "class_alias(HtmlView::class, 'sportsmanagementViewClubs')"),
              'legacy template bridge': (legacy_template, 'components/com_sportsmanagement/tmpl/clubs/default.php'),
              'native view': (native_view, 'final class HtmlView extends BaseHtmlView'),
              'native model': (native_view, 'instanceof ClubsModel'),
              'database': (native_view, 'new ClubTable($model->getDatabase())'),
              'country filter': (native_view, 'CountryOptionsHelper::getOptions($model->getDatabase())'),
              'season filter': (native_view, "'filter_season'"),
              'association filter': (native_view, "'filter_search_association'"),
              'saveshort': (native_view, "ToolbarHelper::apply('clubs.saveshort')"),
              'import': (native_view, "ToolbarHelper::custom('club.import'"),
              'export': (native_view, "ToolbarHelper::archiveList('club.export'"),
              'template season': (native_template, "$this->lists['seasons']"),
              'template nation': (native_template, "$this->lists['nation2']"),
              'template association': (native_template, "$this->lists['association']"),
              'token': (native_template, "HTMLHelper::_('form.token')"),
          }
          for name, (text, needle) in checks.items():
              if needle not in text: raise SystemExit(f'{name} contract missing: {needle}')
          forbidden = ('Factory::getContainer()', 'Factory::getDbo()', 'Factory::getDBO()', 'BaseDatabaseModel::getInstance(', 'Table::getInstance(', 'JLoader::import(', 'jimport(', 'JError::', 'jexit(', 'joomla_version')
          for name, text in {'legacy view': legacy_view, 'legacy template': legacy_template, 'native view': native_view, 'native template': native_template}.items():
              for needle in forbidden:
                  if needle in text: raise SystemExit(f'{name} deprecated API regression: {needle}')
          print('Native administrator clubs contracts OK')
          PY
