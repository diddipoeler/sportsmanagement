name: Joomla 5/6 administrator color and help fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/GooglecolorchooserField.php'
      - 'admin/src/Field/JlgcolorField.php'
      - 'admin/src/Field/SywonlinehelpField.php'
      - 'admin/models/fields/googlecolorchooser.php'
      - 'admin/models/fields/jlgcolor.php'
      - 'admin/models/fields/sywonlinehelp.php'
      - '.github/workflows/joomla5-6-admin-color-help-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/GooglecolorchooserField.php'
      - 'admin/src/Field/JlgcolorField.php'
      - 'admin/src/Field/SywonlinehelpField.php'
      - 'admin/models/fields/googlecolorchooser.php'
      - 'admin/models/fields/jlgcolor.php'
      - 'admin/models/fields/sywonlinehelp.php'
      - '.github/workflows/joomla5-6-admin-color-help-fields.yml'

jobs:
  color-help-fields:
    name: Administrator color and help field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          google=admin/src/Field/GooglecolorchooserField.php
          google_bridge=admin/models/fields/googlecolorchooser.php
          jlg=admin/src/Field/JlgcolorField.php
          jlg_bridge=admin/models/fields/jlgcolor.php
          help=admin/src/Field/SywonlinehelpField.php
          help_bridge=admin/models/fields/sywonlinehelp.php
          files=("$google" "$google_bridge" "$jlg" "$jlg_bridge" "$help" "$help_bridge")

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class GooglecolorchooserField extends FormField' "$google"
          grep -q 'private const COLORS' "$google"
          grep -q "'A32929'" "$google"
          grep -q "'8D6F47'" "$google"
          grep -q 'getWebAssetManager()->addInlineScript' "$google"
          grep -q 'jsm-google-color' "$google"
          grep -q "class_alias(GooglecolorchooserField::class, 'JFormFieldGoogleColorChooser')" "$google_bridge"

          grep -q 'final class JlgcolorField extends ColorField' "$jlg"
          grep -q "class_alias(JlgcolorField::class, 'JFormFieldJLGColor')" "$jlg_bridge"

          grep -q 'final class SywonlinehelpField extends FormField' "$help"
          grep -q 'noopener noreferrer' "$help"
          grep -q 'btn btn-info btn-sm' "$help"
          grep -q "class_alias(SywonlinehelpField::class, 'JFormFieldSYWOnlineHelp')" "$help_bridge"

          if grep -E -- 'jscolor\.js|301a\.js|document\.id\(|overlib\(|jQuery|Factory::getDocument\(|btn-mini|btn-xs|jimport\(|JLoader::|class JFormField(GoogleColorChooser|JLGColor|SYWOnlineHelp) extends' "${files[@]}"; then
            echo 'Administrator color/help field regressed to legacy JavaScript, markup or duplicated global implementation' >&2
            exit 1
          fi
