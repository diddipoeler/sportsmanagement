name: Joomla 5/6 admin controller bridges batch 386

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/controllers/jlextassociations.php'
      - 'admin/controllers/jlextindividualsport.php'
      - 'admin/controllers/jlextindividualsportes.php'
      - 'admin/controllers/joomleagueimport.php'
      - '.github/workflows/joomla5-6-admin-controller-bridges-batch386.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/controllers/jlextassociations.php'
      - 'admin/controllers/jlextindividualsport.php'
      - 'admin/controllers/jlextindividualsportes.php'
      - 'admin/controllers/joomleagueimport.php'
      - '.github/workflows/joomla5-6-admin-controller-bridges-batch386.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator controller bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/controllers/jlextassociations.php
            admin/controllers/jlextindividualsport.php
            admin/controllers/jlextindividualsportes.php
            admin/controllers/joomleagueimport.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
            grep -Fq -- 'class_alias(' "$file"
            grep -Fq -- 'throw new \\RuntimeException' "$file"
          done
