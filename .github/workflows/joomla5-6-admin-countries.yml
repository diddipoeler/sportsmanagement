name: Joomla 5/6 administrator countries migration gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/jlextcountries/**'
      - 'admin/src/Model/JlextcountriesModel.php'
      - 'admin/src/Table/JlextcountryTable.php'
      - 'admin/tables/jlextcountry.php'
      - '.github/workflows/joomla5-6-admin-countries.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/views/jlextcountries/**'
      - 'admin/src/Model/JlextcountriesModel.php'
      - 'admin/src/Table/JlextcountryTable.php'
      - 'admin/tables/jlextcountry.php'
      - '.github/workflows/joomla5-6-admin-countries.yml'

jobs:
  countries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate countries slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/views/jlextcountries/view.html.php
            admin/src/Model/JlextcountriesModel.php
            admin/src/Table/JlextcountryTable.php
            admin/tables/jlextcountry.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class JlextcountriesModel extends SportsManagementListModel' admin/src/Model/JlextcountriesModel.php
          grep -q 'final class JlextcountryTable extends SportsManagementTable' admin/src/Table/JlextcountryTable.php
          grep -q "class_alias(JlextcountryTable::class, 'sportsmanagementTablejlextcountry')" admin/tables/jlextcountry.php
          grep -Fq '$this->model->getFederation()' admin/views/jlextcountries/view.html.php

          if grep -E -- 'BaseDatabaseModel::getInstance\(|Table::getInstance\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|JLoader::import\(|jimport\(|JError::|jexit\(' "${files[@]}"; then
            echo 'Countries slice regressed to a removed/deprecated Joomla MVC/database API' >&2
            exit 1
          fi

          if grep -E -- 'new JlextcountryTable\(|Administrator\\Table\\JlextcountryTable' admin/views/jlextcountries/view.html.php; then
            echo 'Countries list view must not construct an unused table instance.' >&2
            exit 1
          fi
