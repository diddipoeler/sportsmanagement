name: Joomla 5/6 native cPanel target views batch 62

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/View/Extensions/HtmlView.php'
      - 'admin/src/View/Projects/HtmlView.php'
      - 'admin/src/View/Specialextensions/HtmlView.php'
      - 'admin/src/View/Predictiongames/HtmlView.php'
      - 'admin/src/View/Currentseasons/HtmlView.php'
      - 'admin/src/View/Jsmgcalendars/HtmlView.php'
      - '.github/workflows/joomla5-6-admin-cpanel-native-views-batch62.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/View/Extensions/HtmlView.php'
      - 'admin/src/View/Projects/HtmlView.php'
      - 'admin/src/View/Specialextensions/HtmlView.php'
      - 'admin/src/View/Predictiongames/HtmlView.php'
      - 'admin/src/View/Currentseasons/HtmlView.php'
      - 'admin/src/View/Jsmgcalendars/HtmlView.php'
      - '.github/workflows/joomla5-6-admin-cpanel-native-views-batch62.yml'

jobs:
  php-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          php -l admin/src/View/Extensions/HtmlView.php
          php -l admin/src/View/Projects/HtmlView.php
          php -l admin/src/View/Specialextensions/HtmlView.php
          php -l admin/src/View/Predictiongames/HtmlView.php
          php -l admin/src/View/Currentseasons/HtmlView.php
          php -l admin/src/View/Jsmgcalendars/HtmlView.php
      - name: Required migration metadata
        run: |
          files=(
            admin/src/View/Extensions/HtmlView.php
            admin/src/View/Projects/HtmlView.php
            admin/src/View/Specialextensions/HtmlView.php
            admin/src/View/Predictiongames/HtmlView.php
            admin/src/View/Currentseasons/HtmlView.php
            admin/src/View/Jsmgcalendars/HtmlView.php
          )
          for file in "${files[@]}"; do
            grep -F '@version    5.6.0' "$file"
            grep -F '@author     diddipoeler' "$file"
            grep -F '@copyright  Copyright (C) diddipoeler' "$file"
            grep -F '@license    GNU General Public License version 2 or later; see LICENSE.txt' "$file"
          done
      - name: Native view assertions
        run: |
          grep -F 'final class HtmlView extends BaseHtmlView' admin/src/View/Extensions/HtmlView.php
          grep -F 'instanceof ProjectsModel' admin/src/View/Projects/HtmlView.php
          grep -F 'instanceof SpecialextensionsModel' admin/src/View/Specialextensions/HtmlView.php
          grep -F 'instanceof PredictiongamesModel' admin/src/View/Predictiongames/HtmlView.php
          grep -F 'instanceof CurrentseasonsModel' admin/src/View/Currentseasons/HtmlView.php
          grep -F 'instanceof JsmgcalendarsModel' admin/src/View/Jsmgcalendars/HtmlView.php
      - name: Reject stale metadata
        run: |
          ! grep -R '@version[[:space:]]\+5\.6\.0 sportsmanagement' \
            admin/src/View/Extensions/HtmlView.php \
            admin/src/View/Projects/HtmlView.php \
            admin/src/View/Specialextensions/HtmlView.php \
            admin/src/View/Predictiongames/HtmlView.php \
            admin/src/View/Currentseasons/HtmlView.php \
            admin/src/View/Jsmgcalendars/HtmlView.php
