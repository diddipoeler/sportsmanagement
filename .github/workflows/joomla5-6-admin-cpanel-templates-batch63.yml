name: Joomla 5/6 admin cPanel templates batch 63

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tmpl/extensions/default.php'
      - 'admin/tmpl/projects/default.php'
      - 'admin/tmpl/specialextensions/default.php'
      - 'admin/tmpl/jsmgcalendars/default.php'
      - '.github/workflows/joomla5-6-admin-cpanel-templates-batch63.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/tmpl/extensions/default.php'
      - 'admin/tmpl/projects/default.php'
      - 'admin/tmpl/specialextensions/default.php'
      - 'admin/tmpl/jsmgcalendars/default.php'
      - '.github/workflows/joomla5-6-admin-cpanel-templates-batch63.yml'

jobs:
  php-lint-and-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          php -l admin/tmpl/extensions/default.php
          php -l admin/tmpl/projects/default.php
          php -l admin/tmpl/specialextensions/default.php
          php -l admin/tmpl/jsmgcalendars/default.php
      - name: Required file metadata
        run: |
          for file in \
            admin/tmpl/extensions/default.php \
            admin/tmpl/projects/default.php \
            admin/tmpl/specialextensions/default.php \
            admin/tmpl/jsmgcalendars/default.php; do
            grep -Fq '@version    5.6.0' "$file"
            grep -Fq '@author     diddipoeler' "$file"
            grep -Fq '@copyright  Copyright (C) diddipoeler' "$file"
            grep -Fq '@license    GNU General Public License version 2 or later; see LICENSE.txt' "$file"
          done
      - name: Reject stale metadata
        run: |
          ! grep -R '@version    5.6.0 sportsmanagement' \
            admin/tmpl/extensions/default.php \
            admin/tmpl/projects/default.php \
            admin/tmpl/specialextensions/default.php \
            admin/tmpl/jsmgcalendars/default.php
          ! grep -R '@version    4.24' \
            admin/tmpl/extensions/default.php \
            admin/tmpl/projects/default.php \
            admin/tmpl/specialextensions/default.php \
            admin/tmpl/jsmgcalendars/default.php
