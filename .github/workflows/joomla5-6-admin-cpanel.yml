name: Joomla 5/6 administrator cpanel migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-cpanel:
    name: Native administrator cpanel checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate cpanel migration
        shell: bash
        run: |
          set -euo pipefail

          model=admin/src/Model/CpanelModel.php
          model_bridge=admin/models/cpanel.php
          controller=admin/src/Controller/CpanelController.php
          controller_bridge=admin/controllers/cpanel.php

          for file in "$model" "$model_bridge" "$controller" "$controller_bridge"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class CpanelModel extends SportsManagementListModel' "$model"
          grep -q "class_alias(CpanelModel::class, 'sportsmanagementModelcpanel')" "$model_bridge"
          grep -q "class_alias(CpanelController::class, 'sportsmanagementControllercpanel')" "$controller_bridge"

          for method in getVersion getGithubRequests toAscii getJSON processData getInstalledPlugin checkcountry checksporttype; do
            grep -q "function ${method}" "$model"
          done

          grep -q 'HttpFactory::getHttp()->get' "$model"
          grep -q "str_starts_with(\$url, 'https://api.github.com/')" "$model"
          grep -q 'Factory::getContainer()->get(DatabaseInterface::class)' "$model"
          grep -Fq 'use Joomla\Database\ParameterType;' "$model"
          grep -Fq -- "->bind(':element', \$element, ParameterType::STRING)" "$model"
          grep -Fq -- "->bind(':search', \$pattern, ParameterType::STRING)" "$model"
          grep -q '#__extensions' "$model"
          grep -q '#__sportsmanagement_countries' "$model"
          grep -q '#__sportsmanagement_sports_type' "$model"

          if grep -E -- 'curl_init\(|CURLOPT_SSL_VERIFYPEER|Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|jimport\(|JLoader::import\(|disconnect\(|extends JSMModelLegacy|new HttpFactory\(' "$model" "$model_bridge"; then
            echo 'Cpanel migration regressed to an insecure HTTP, removed Joomla or legacy model API' >&2
            exit 1
          fi

          if grep -Fq '$db->quote($element)' "$model" || grep -Fq '$db->escape($search' "$model"; then
            echo 'Cpanel query binding regressed to manual SQL quoting.' >&2
            exit 1
          fi
