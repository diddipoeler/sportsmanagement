name: Joomla 5/6 admin current seasons

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/CurrentseasonsModel.php'
      - 'admin/src/View/Currentseasons/HtmlView.php'
      - 'admin/tmpl/currentseasons/**'
      - 'admin/views/currentseasons/view.html.php'
      - '.github/workflows/joomla5-6-admin-currentseasons.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/CurrentseasonsModel.php'
      - 'admin/src/View/Currentseasons/HtmlView.php'
      - 'admin/tmpl/currentseasons/**'
      - 'admin/views/currentseasons/view.html.php'
      - '.github/workflows/joomla5-6-admin-currentseasons.yml'

jobs:
  currentseasons:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: |
          php -l admin/src/Model/CurrentseasonsModel.php
          php -l admin/src/View/Currentseasons/HtmlView.php
          php -l admin/tmpl/currentseasons/default.php
          php -l admin/views/currentseasons/view.html.php

      - name: Validate native current seasons dashboard
        shell: bash
        run: |
          model=admin/src/Model/CurrentseasonsModel.php
          native_view=admin/src/View/Currentseasons/HtmlView.php
          template=admin/tmpl/currentseasons/default.php
          bridge=admin/views/currentseasons/view.html.php

          grep -Fq '#__sportsmanagement_division' "$model"
          grep -Fq '#__sportsmanagement_project_position' "$model"
          grep -Fq '#__sportsmanagement_project_referee' "$model"
          grep -Fq '#__sportsmanagement_project_team' "$model"
          grep -Fq '#__sportsmanagement_round' "$model"
          grep -Fq 'count_projectdivisions' "$model"
          grep -Fq 'count_projectpositions' "$model"
          grep -Fq 'count_projectreferees' "$model"
          grep -Fq 'count_projectteams' "$model"
          grep -Fq 'count_matchdays' "$model"

          grep -Fq "useScript('bootstrap.collapse')" "$native_view"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewCurrentseasons')" "$bridge"

          grep -Fq 'data-bs-toggle="collapse"' "$template"
          grep -Fq 'task=project.edit' "$template"
          grep -Fq 'view=templates' "$template"
          grep -Fq 'view=divisions' "$template"
          grep -Fq 'view=treetos' "$template"
          grep -Fq 'view=projectpositions' "$template"
          grep -Fq 'view=projectreferees' "$template"
          grep -Fq 'view=projectteams' "$template"
          grep -Fq 'view=rounds' "$template"
          grep -Fq 'view=jlxmlexports' "$template"
          grep -Fq 'count_projectdivisions' "$template"
          grep -Fq 'count_projectpositions' "$template"
          grep -Fq 'count_projectreferees' "$template"
          grep -Fq 'count_projectteams' "$template"
          grep -Fq 'count_matchdays' "$template"

          if grep -E 'BaseDatabaseModel::getInstance|sportsmanagementModel(Projectpositions|Projectreferees|Projectteams|Rounds|divisions)|jimport\(|SqueezeBox|version_compare\(JVERSION' "$native_view" "$bridge" "$template"; then
            echo 'Current seasons dashboard reintroduced a legacy view/model/UI path' >&2
            exit 1
          fi
