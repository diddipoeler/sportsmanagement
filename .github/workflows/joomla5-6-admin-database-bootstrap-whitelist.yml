name: Joomla 5/6 administrator database bootstrap allowlist

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/DatabasetoolModel.php'
      - '.github/tests/joomla56_admin_database_bootstrap_whitelist.php'
      - '.github/workflows/joomla5-6-admin-database-bootstrap-whitelist.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint database tool model and allowlist regression
        run: |
          php -l admin/src/Model/DatabasetoolModel.php
          php -l .github/tests/joomla56_admin_database_bootstrap_whitelist.php
      - name: Verify allowed sport bootstrap table names
        run: php .github/tests/joomla56_admin_database_bootstrap_whitelist.php
