name: Joomla 5/6 administrator database tool migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  databasetool:
    name: Native database maintenance and bootstrap-data checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database tool migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/DatabasetoolModel.php
            admin/src/Controller/DatabasetoolController.php
            admin/models/databasetool.php
            admin/controllers/databasetool.php
            admin/views/databasetool/view.html.php
            admin/views/databasetool/tmpl/default.php
            admin/views/databasetools/tmpl/default.php
            admin/views/databasetools/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          model=admin/src/Model/DatabasetoolModel.php
          controller=admin/src/Controller/DatabasetoolController.php

          grep -Fq 'class DatabasetoolModel extends BaseDatabaseModel' "$model"
          grep -Fq 'public static int $db_num_rows' "$model"
          grep -Fq 'public static array $jsmtables' "$model"
          grep -Fq 'public string $my_text' "$model"
          grep -Fq 'public string $_success_text' "$model"
          grep -Fq 'sportsmanagementHelper::getDBConnection()' "$model"
          grep -Fq 'LIBXML_NONET' "$model"
          grep -Fq 'getTableList()' "$model"
          grep -Fq 'getTableColumns(' "$model"
          grep -Fq "['REPAIR', 'OPTIMIZE', 'TRUNCATE']" "$model"
          grep -Fq "str_starts_with(\$tableName, \$prefix . 'sportsmanagement_')" "$model"
          grep -Fq "str_starts_with(\$tableName, \$prefix . 'joomleague_')" "$model"
          grep -Fq 'function ensureImportIdColumn' "$model"
          grep -Fq 'function replaceFieldValue' "$model"
          grep -Fq 'file_get_contents($file)' "$model"
          grep -Fq '$db->replacePrefix($statement)' "$model"

          methods=(
            getExeptionMessage getRunTime getForm getMemory getQueryTime
            getSportsManagementTables getJoomleagueTablesTruncate checkImportTablesJlJsm
            getJoomleagueImportTables getJoomleagueTables setParamstoJSON runJoomlaQuery
            setNewComponentName setNewPicturePath setSportsManagementTableQuery checkQuotes
            writeErrorLog insertAgegroup checkAssociations insertCountries insertSportType
            checkSportTypeStructur addStandardForSportType build_SelectQuery
            build_InsertQuery_Event build_InsertQuery_Position build_InsertQuery_PositionEventType
          )

          for method in "${methods[@]}"; do
            grep -Eq "function[[:space:]]+${method}[[:space:]]*\(" "$model"
          done

          grep -Fq 'class DatabasetoolController extends BaseController' "$controller"
          grep -Fq '$this->checkToken();' "$controller"
          grep -Fq "authorise('core.admin', 'com_sportsmanagement')" "$controller"
          grep -Fq "runTableAction('REPAIR'" "$controller"
          grep -Fq "runTableAction('OPTIMIZE'" "$controller"
          grep -Fq "runTableAction('TRUNCATE'" "$controller"
          grep -Fq 'setNewPicturePath()' "$controller"

          grep -Fq "class_alias(DatabasetoolModel::class, 'sportsmanagementModeldatabasetool')" admin/models/databasetool.php
          grep -Fq "class_alias(DatabasetoolController::class, 'sportsmanagementControllerDatabaseTool')" admin/controllers/databasetool.php

          grep -Fq '$this->app->getInput()' admin/views/databasetool/view.html.php
          grep -Fq "view=databasetools" admin/views/databasetool/tmpl/default.php
          grep -Fq "loadTemplate('data')" admin/views/databasetools/tmpl/default.php
          grep -Fq "HTMLHelper::_('form.token')" admin/views/databasetools/tmpl/default.php

          for task in truncate truncatejl optimize repair picturepath updatetemplatemasters; do
            grep -Fq "'task' => 'databasetool.${task}'" admin/views/databasetools/tmpl/default_data.php
          done

          if grep -Eq 'href=.*task=databasetool\.(truncate|truncatejl|optimize|repair|picturepath|updatetemplatemasters)' admin/views/databasetools/tmpl/default_data.php; then
            echo 'Database maintenance actions regressed to GET links' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|extends JSMModelLegacy|jsmdb|jsmquery|jsmapp|jsmjinput|version_compare\(.*JVERSION|Joomla\\CMS\\Filesystem|JArchive::|JHtml' "${files[@]}"; then
            echo 'Database tool migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
