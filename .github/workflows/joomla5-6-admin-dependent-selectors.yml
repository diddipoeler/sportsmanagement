name: Joomla 5/6 dependent selector migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/DependsqlField.php'
      - 'admin/src/Field/MultidependsqlField.php'
      - 'admin/src/Model/AjaxModel.php'
      - 'modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml'
      - 'site/views/statsranking/tmpl/default.xml'
      - '.github/workflows/joomla5-6-admin-dependent-selectors.yml'
  pull_request:
    branches:
      - master
      - joomla5-6
    paths:
      - 'admin/src/Field/DependsqlField.php'
      - 'admin/src/Field/MultidependsqlField.php'
      - 'admin/src/Model/AjaxModel.php'
      - 'modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml'
      - 'site/views/statsranking/tmpl/default.xml'
      - '.github/workflows/joomla5-6-admin-dependent-selectors.yml'

permissions:
  contents: read

jobs:
  dependent-selectors:
    name: Dependent selector compatibility checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dependent selectors
        shell: bash
        run: |
          set -euo pipefail

          dependsql=admin/src/Field/DependsqlField.php
          multidependsql=admin/src/Field/MultidependsqlField.php
          ajax_model=admin/src/Model/AjaxModel.php
          calendar_xml=modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml
          statsranking_xml=site/views/statsranking/tmpl/default.xml

          for file in "$dependsql" "$multidependsql" "$ajax_model"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          grep -Fq 'extends SportsManagementListField' "$dependsql"
          grep -Fq "\$element['class'] = 'form-select';" "$dependsql"
          grep -Fq "\$element['multiple'] = 'true';" "$dependsql"
          grep -Fq "'com_modules' => 'params'" "$dependsql"
          grep -Fq "'com_sportsmanagement' => \$noRequest ? '' : 'request'" "$dependsql"
          grep -Fq "\$element['onchange'] = 'this.form.submit();';" "$dependsql"
          grep -Fq 'return parent::getInput();' "$dependsql"
          grep -Fq 'private function registerDependencyScript' "$dependsql"
          grep -Fq 'use Diddipoeler\Component\SportsManagement\Administrator\Service\SportsManagementAdministratorApplicationResolver;' "$dependsql"
          grep -Fq 'return SportsManagementAdministratorApplicationResolver::resolve();' "$dependsql"
          grep -Fq 'instanceof HtmlDocument' "$dependsql"

          if grep -E -- 'HTMLHelper::|select\.genericlist|extends FormField|Factory::getApplication\(|Factory::getContainer\(' "$dependsql"; then
            echo "$dependsql regressed to a legacy list renderer/application accessor" >&2
            exit 1
          fi

          grep -Fq 'extends FormField' "$multidependsql"
          grep -Fq "HTMLHelper::_(" "$multidependsql"
          grep -Fq "'select.genericlist'" "$multidependsql"
          grep -Fq "'value' => (string) \$row->{\$keyField}" "$multidependsql"
          grep -Fq "'text' => (string) (\$row->{\$valueField} ?? \$row->{\$keyField})" "$multidependsql"
          grep -Fq "htmlspecialchars(implode('|', \$selected)" "$multidependsql"
          grep -Fq "hidden.value = selectedValues().join('|');" "$multidependsql"
          grep -Fq 'use Diddipoeler\Component\SportsManagement\Administrator\Service\SportsManagementAdministratorApplicationResolver;' "$multidependsql"
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()->getDocument()' "$multidependsql"
          grep -Fq 'instanceof HtmlDocument' "$multidependsql"

          if grep -E -- "Factory::getApplication\(|Factory::getContainer\(|'select.option'" "$multidependsql"; then
            echo 'Multi dependent field regressed to legacy application or select.option access' >&2
            exit 1
          fi

          grep -Fq 'array_unshift($rows, (object) [' "$ajax_model"
          grep -Fq "'value' => '0'" "$ajax_model"
          grep -Fq "'text' => Text::_('COM_SPORTSMANAGEMENT_GLOBAL_SELECT')" "$ajax_model"
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$ajax_model"
          grep -Fq '$db = Factory::getContainer()->get(DatabaseInterface::class);' "$ajax_model"

          if grep -E -- 'HTMLHelper::|\$app->getContainer\(|Factory::getApplication\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|Factory::getDocument\(|Factory::getConfig\(|->getCfg\(' "$ajax_model"; then
            echo 'Administrator AjaxModel regressed to a removed Joomla API' >&2
            exit 1
          fi

          grep -Fq 'type="dependsql"' "$calendar_xml"
          grep -Fq 'multiple="multiple"' "$calendar_xml"
          grep -Fq 'type="dependsql"' "$statsranking_xml"
          grep -Fq 'multiple="multiple"' "$statsranking_xml"

          echo 'Joomla 5/6 dependent selector contracts OK.'
