name: Joomla 5/6 dependent selector migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  dependent-selectors:
    name: Dependent selector compatibility checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply AjaxModel application resolver migration
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('admin/src/Model/AjaxModel.php')
          text = path.read_text(encoding='utf-8')

          database_import = 'use Diddipoeler\\Component\\SportsManagement\\Administrator\\Helper\\SportsManagementDatabaseResolver;\n'
          resolver_import = 'use Diddipoeler\\Component\\SportsManagement\\Administrator\\Helper\\SportsManagementAdministratorApplicationResolver;\n'

          if resolver_import not in text:
              if database_import not in text:
                  raise SystemExit('AjaxModel database resolver import anchor not found')
              text = text.replace(database_import, resolver_import + database_import, 1)

          old_assignment = '$app = Factory::getApplication();'
          new_assignment = '$app = SportsManagementAdministratorApplicationResolver::resolve();'
          assignment_count = text.count(old_assignment)
          if assignment_count not in (0, 2):
              raise SystemExit(f'Unexpected AjaxModel application assignment count: {assignment_count}')
          text = text.replace(old_assignment, new_assignment)

          old_message = "Factory::getApplication()->enqueueMessage($e->getMessage(), 'error');"
          new_message = "SportsManagementAdministratorApplicationResolver::resolve()->enqueueMessage($e->getMessage(), 'error');"
          message_count = text.count(old_message)
          if message_count not in (0, 1):
              raise SystemExit(f'Unexpected AjaxModel message application count: {message_count}')
          text = text.replace(old_message, new_message)

          if 'Factory::getApplication()' in text:
              raise SystemExit('AjaxModel still contains Factory::getApplication()')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate dependent selectors
        shell: bash
        run: |
          set -euo pipefail

          dependsql=admin/src/Field/DependsqlField.php
          multidependsql=admin/src/Field/MultidependsqlField.php
          ajax_model=admin/src/Model/AjaxModel.php
          calendar_xml=modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml
          statsranking_xml=site/views/statsranking/tmpl/default.xml

          php -l "$dependsql"
          php -l "$multidependsql"
          php -l "$ajax_model"

          grep -Fq 'extends SportsManagementListField' "$dependsql"
          grep -Fq "\$element['class'] = 'form-select';" "$dependsql"
          grep -Fq "\$element['multiple'] = 'true';" "$dependsql"
          grep -Fq "'com_modules' => 'params'" "$dependsql"
          grep -Fq "'com_sportsmanagement' => \$noRequest ? '' : 'request'" "$dependsql"
          grep -Fq "\$element['onchange'] = 'this.form.submit();';" "$dependsql"
          grep -Fq 'return parent::getInput();' "$dependsql"
          grep -Fq 'private function registerDependencyScript' "$dependsql"
          grep -Fq '$this->administratorApplication()->getDocument()->getWebAssetManager()->addInlineScript($script);' "$dependsql"

          if grep -E -- 'HTMLHelper::|select\.genericlist|extends FormField' "$dependsql"; then
            echo "$dependsql regressed to manual legacy list rendering" >&2
            exit 1
          fi

          grep -Fq 'extends FormField' "$multidependsql"
          grep -Fq "HTMLHelper::_(" "$multidependsql"
          grep -Fq "'select.genericlist'" "$multidependsql"
          grep -Fq "'value' => (string) \$row->{\$keyField}" "$multidependsql"
          grep -Fq "'text' => (string) (\$row->{\$valueField} ?? \$row->{\$keyField})" "$multidependsql"
          grep -Fq "htmlspecialchars(implode('|', \$selected)" "$multidependsql"
          grep -Fq "hidden.value = selectedValues().join('|');" "$multidependsql"
          grep -Fq 'use Joomla\CMS\Application\AdministratorApplication;' "$multidependsql"
          grep -Fq '$app = Factory::getContainer()->get(AdministratorApplication::class);' "$multidependsql"
          grep -Fq 'if (!$app instanceof AdministratorApplication)' "$multidependsql"
          grep -Fq '$app->getDocument()->getWebAssetManager()->addInlineScript(' "$multidependsql"

          if grep -Fq "'select.option'" "$multidependsql"; then
            echo 'Multi dependent field regressed to the legacy select.option adapter' >&2
            exit 1
          fi

          grep -Fq 'array_unshift($rows, (object) [' "$ajax_model"
          grep -Fq "'value' => '0'" "$ajax_model"
          grep -Fq "'text' => Text::_('COM_SPORTSMANAGEMENT_GLOBAL_SELECT')" "$ajax_model"
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$ajax_model"
          grep -Fq '$db = Factory::getContainer()->get(DatabaseInterface::class);' "$ajax_model"

          if grep -E -- 'HTMLHelper::|\$app->getContainer\(' "$ajax_model"; then
            echo 'Administrator AjaxModel regressed to legacy option/protected container access' >&2
            exit 1
          fi

          grep -Fq 'type="dependsql"' "$calendar_xml"
          grep -Fq 'multiple="multiple"' "$calendar_xml"
          grep -Fq 'type="dependsql"' "$statsranking_xml"
          grep -Fq 'multiple="multiple"' "$statsranking_xml"

          if grep -E -- 'Factory::getApplication\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|Factory::getDocument\(|Factory::getConfig\(|->getCfg\(' "$dependsql" "$multidependsql" "$ajax_model"; then
            echo 'Dependent selector migration regressed to a removed Joomla API' >&2
            exit 1
          fi

      - name: Commit AjaxModel migration
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin/src/Model/AjaxModel.php; then
            echo 'AjaxModel application access is already migrated.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin/src/Model/AjaxModel.php
          git commit -m "Migrate AjaxModel application access for Joomla 5/6"
          git push origin HEAD:joomla5-6
