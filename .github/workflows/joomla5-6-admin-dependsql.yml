name: Joomla 5/6 dependent SQL field gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/DependsqlField.php'
      - 'admin/models/fields/dependsql.php'
      - 'admin/models/fields/dependsql_jl.php'
      - 'admin/src/Model/AjaxModel.php'
      - '.github/workflows/joomla5-6-admin-dependsql.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/DependsqlField.php'
      - 'admin/models/fields/dependsql.php'
      - 'admin/models/fields/dependsql_jl.php'
      - 'admin/src/Model/AjaxModel.php'
      - '.github/workflows/joomla5-6-admin-dependsql.yml'

jobs:
  dependsql:
    name: Dependent SQL field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native dependent field
        shell: bash
        run: |
          set -euo pipefail

          field=admin/src/Field/DependsqlField.php
          bridge=admin/models/fields/dependsql.php
          legacy_bridge=admin/models/fields/dependsql_jl.php
          ajax=admin/src/Model/AjaxModel.php

          for file in "$field" "$bridge" "$legacy_bridge" "$ajax"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class DependsqlField extends FormField' "$field"
          grep -q 'Administrator\\Model\\AjaxModel' "$field"
          grep -q 'getInput()' "$field"
          grep -q 'URLSearchParams' "$field"
          grep -q 'fetch' "$field"
          grep -q 'renderMessages' "$field"
          grep -q 'getWebAssetManager()->addInlineScript' "$field"
          grep -q "config.task === 'projectteamoptions'" "$field"
          grep -q "config.task === 'personagegroupoptions'" "$field"
          grep -q "config.view === 'project'" "$field"
          grep -q "config.view === 'club'" "$field"
          grep -q "'getprojects', 'getprojectdivisionsoptions', 'getprojectstatsoptions'" "$field"
          grep -q "'getprojectroundoptions'" "$field"
          grep -q "class_alias(DependsqlField::class, 'JFormFieldDependSQL')" "$bridge"
          grep -q "class_alias(DependsqlField::class, 'JFormFieldDependSQL')" "$legacy_bridge"
          grep -q 'final class AjaxModel extends BaseDatabaseModel' "$ajax"

          for forbidden in cdnjs select2 Alertify alertify jQuery JLoader jimport JVERSION sportsmanagementModelAjax depend.js; do
            if grep -F "$forbidden" "$field" "$bridge" "$legacy_bridge"; then
              echo "Dependent SQL field contains forbidden legacy token: $forbidden" >&2
              exit 1
            fi
          done

          if grep -F -- '->input' "$field" "$bridge" "$legacy_bridge"; then
            echo 'Dependent SQL field regressed to magic input access' >&2
            exit 1
          fi

          if grep -F 'models/ajax.php' "$field" "$bridge" "$legacy_bridge" || grep -F 'helpers/sportsmanagement.php' "$field" "$bridge" "$legacy_bridge"; then
            echo 'Dependent SQL field regressed to a legacy bridge/helper include' >&2
            exit 1
          fi
