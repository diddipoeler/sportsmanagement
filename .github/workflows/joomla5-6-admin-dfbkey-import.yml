name: Joomla 5/6 administrator DFB key importer

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Controller/JlextdfbkeyimportController.php'
      - 'admin/src/Model/JlextdfbkeyimportModel.php'
      - 'admin/controllers/jlextdfbkeyimport.php'
      - 'admin/models/jlextdfbkeyimport.php'
      - 'admin/src/Helper/SqlImportHelper.php'
      - '.github/workflows/joomla5-6-admin-dfbkey-import.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Controller/JlextdfbkeyimportController.php'
      - 'admin/src/Model/JlextdfbkeyimportModel.php'
      - 'admin/controllers/jlextdfbkeyimport.php'
      - 'admin/models/jlextdfbkeyimport.php'
      - 'admin/src/Helper/SqlImportHelper.php'
      - '.github/workflows/joomla5-6-admin-dfbkey-import.yml'

jobs:
  dfb-key-import:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native DFB key import path
        shell: bash
        run: |
          set -euo pipefail

          controller=admin/src/Controller/JlextdfbkeyimportController.php
          model=admin/src/Model/JlextdfbkeyimportModel.php
          controller_bridge=admin/controllers/jlextdfbkeyimport.php
          model_bridge=admin/models/jlextdfbkeyimport.php
          sql_helper=admin/src/Helper/SqlImportHelper.php

          for file in "$controller" "$model" "$controller_bridge" "$model_bridge" "$sql_helper"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq 'final class JlextdfbkeyimportController extends BaseController' "$controller"
          test "$(grep -Fc '$this->checkToken();' "$controller")" -ge 4
          grep -Fq '$app->getInput()->post->getArray()' "$controller"

          grep -Fq 'final class JlextdfbkeyimportModel extends SportsManagementListModel' "$model"
          grep -Fq 'use Joomla\Database\ParameterType;' "$model"
          grep -Fq 'use Diddipoeler\Component\SportsManagement\Administrator\Helper\SqlImportHelper;' "$model"
          grep -Fq -- "->bind(':country', \$country, ParameterType::STRING)" "$model"
          grep -Fq -- "->bind(':projectId', \$projectId, ParameterType::INTEGER)" "$model"
          grep -Fq 'SqlImportHelper::importFile($db, $sqlFile);' "$model"
          test "$(grep -Fc 'ParameterType::INTEGER' "$model")" -ge 8

          grep -Fq 'use Joomla\Filesystem\File;' "$sql_helper"
          grep -Fq 'Installer::splitSql($sql)' "$sql_helper"

          grep -Fq "class_alias(JlextdfbkeyimportController::class, 'sportsmanagementControllerjlextdfbkeyimport')" "$controller_bridge"
          grep -Fq "class_alias(JlextdfbkeyimportModel::class, 'sportsmanagementModeljlextDfbkeyimport')" "$model_bridge"

          if grep -E 'Factory::get(Dbo|DBO|Document|User)\(|BaseDatabaseModel::getInstance|jimport\(|JLoader::import|Joomla\\CMS\\Filesystem\\(File|Folder)|Joomla\\CMS\\Http\\HttpFactory|\$app->input' "$controller" "$model" "$controller_bridge" "$model_bridge" "$sql_helper"; then
            echo 'DFB key import path regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -Fq '$db->quote($country)' "$model"; then
            echo 'DFB key country lookup regressed to a quoted SQL concatenation.' >&2
            exit 1
          fi
