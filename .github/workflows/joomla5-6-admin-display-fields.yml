name: Joomla 5/6 administrator display fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/JsmlinkField.php'
      - 'admin/src/Field/JsmsubtitleField.php'
      - 'admin/src/Field/JsmtitleField.php'
      - 'admin/src/Field/TitleField.php'
      - 'admin/models/fields/jsmlink.php'
      - 'admin/models/fields/jsmsubtitle.php'
      - 'admin/models/fields/jsmtitle.php'
      - 'admin/models/fields/title.php'
      - '.github/workflows/joomla5-6-admin-display-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/JsmlinkField.php'
      - 'admin/src/Field/JsmsubtitleField.php'
      - 'admin/src/Field/JsmtitleField.php'
      - 'admin/src/Field/TitleField.php'
      - 'admin/models/fields/jsmlink.php'
      - 'admin/models/fields/jsmsubtitle.php'
      - 'admin/models/fields/jsmtitle.php'
      - 'admin/models/fields/title.php'
      - '.github/workflows/joomla5-6-admin-display-fields.yml'

jobs:
  display-fields:
    name: Administrator display field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate display fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          link=admin/src/Field/JsmlinkField.php
          link_bridge=admin/models/fields/jsmlink.php
          subtitle=admin/src/Field/JsmsubtitleField.php
          subtitle_bridge=admin/models/fields/jsmsubtitle.php
          jsmtitle=admin/src/Field/JsmtitleField.php
          jsmtitle_bridge=admin/models/fields/jsmtitle.php
          title=admin/src/Field/TitleField.php
          title_bridge=admin/models/fields/title.php
          files=(
            "$link" "$link_bridge"
            "$subtitle" "$subtitle_bridge"
            "$jsmtitle" "$jsmtitle_bridge"
            "$title" "$title_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class JsmlinkField extends FormField' "$link"
          grep -q 'noopener noreferrer' "$link"
          grep -q 'htmlspecialchars' "$link"
          grep -q "class_alias(JsmlinkField::class, 'JFormFieldJSMLink')" "$link_bridge"

          grep -q 'final class JsmsubtitleField extends FormField' "$subtitle"
          grep -q 'border-bottom' "$subtitle"
          grep -q "class_alias(JsmsubtitleField::class, 'JFormFieldJSMSubtitle')" "$subtitle_bridge"

          for field in "$jsmtitle" "$title"; do
            grep -q "preg_match('/^#" "$field"
            grep -q "preg_replace('/[^A-Za-z0-9_-]/'" "$field"
            grep -q 'SYWicon-' "$field"
            grep -q "return \$html . '</div>'" "$field"
          done
          grep -q 'final class JsmtitleField extends FormField' "$jsmtitle"
          grep -q "class_alias(JsmtitleField::class, 'JFormFieldJSMTitle')" "$jsmtitle_bridge"
          grep -q 'final class TitleField extends FormField' "$title"
          grep -q "class_alias(TitleField::class, 'JFormFieldTitle')" "$title_bridge"

          if grep -E -- 'jimport\(|JLoader::|Factory::getLanguage\(|JVERSION|version_compare\(|class JFormField(JSMLink|JSMSubtitle|JSMTitle|Title) extends' "${files[@]}"; then
            echo 'Administrator display field regressed to a legacy loader or duplicated global implementation' >&2
            exit 1
          fi
