name: Joomla 5/6 dynamic administrator fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/CountryassociationField.php'
      - 'admin/src/Field/PersonagegroupField.php'
      - 'admin/src/Field/ProjectpositionlistField.php'
      - 'admin/src/Field/ProjectpositionrefereeField.php'
      - 'admin/src/Field/ProjectteamlistField.php'
      - 'admin/src/Field/SeasonteampersonField.php'
      - 'admin/models/fields/countryassociation.php'
      - 'admin/models/fields/personagegroup.php'
      - 'admin/models/fields/projectpositionlist.php'
      - 'admin/models/fields/projectpositionreferee.php'
      - 'admin/models/fields/projectteamlist.php'
      - 'admin/models/fields/seasonteamperson.php'
      - '.github/workflows/joomla5-6-admin-dynamic-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/CountryassociationField.php'
      - 'admin/src/Field/PersonagegroupField.php'
      - 'admin/src/Field/ProjectpositionlistField.php'
      - 'admin/src/Field/ProjectpositionrefereeField.php'
      - 'admin/src/Field/ProjectteamlistField.php'
      - 'admin/src/Field/SeasonteampersonField.php'
      - 'admin/models/fields/countryassociation.php'
      - 'admin/models/fields/personagegroup.php'
      - 'admin/models/fields/projectpositionlist.php'
      - 'admin/models/fields/projectpositionreferee.php'
      - 'admin/models/fields/projectteamlist.php'
      - 'admin/models/fields/seasonteamperson.php'
      - '.github/workflows/joomla5-6-admin-dynamic-fields.yml'

jobs:
  dynamic-fields:
    name: Dynamic administrator field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dynamic fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          country=admin/src/Field/CountryassociationField.php
          country_bridge=admin/models/fields/countryassociation.php
          agegroup=admin/src/Field/PersonagegroupField.php
          agegroup_bridge=admin/models/fields/personagegroup.php
          projectposition=admin/src/Field/ProjectpositionlistField.php
          projectposition_bridge=admin/models/fields/projectpositionlist.php
          referee=admin/src/Field/ProjectpositionrefereeField.php
          referee_bridge=admin/models/fields/projectpositionreferee.php
          projectteam=admin/src/Field/ProjectteamlistField.php
          projectteam_bridge=admin/models/fields/projectteamlist.php
          seasonperson=admin/src/Field/SeasonteampersonField.php
          seasonperson_bridge=admin/models/fields/seasonteamperson.php
          files=(
            "$country" "$country_bridge"
            "$agegroup" "$agegroup_bridge"
            "$projectposition" "$projectposition_bridge"
            "$referee" "$referee_bridge"
            "$projectteam" "$projectteam_bridge"
            "$seasonperson" "$seasonperson_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class CountryassociationField extends SportsManagementListField' "$country"
          grep -q '#__sportsmanagement_associations' "$country"
          grep -Fq "preg_replace('/[^A-Za-z0-9_]/'" "$country"
          grep -q "getInput()->get(" "$country"
          grep -q "class_alias(CountryassociationField::class, 'JFormFieldcountryassociation')" "$country_bridge"

          grep -q 'final class PersonagegroupField extends SportsManagementListField' "$agegroup"
          grep -q '#__sportsmanagement_agegroup' "$agegroup"
          grep -q 'sports_type_id' "$agegroup"
          grep -q 'sportstype_id' "$agegroup"
          grep -q 'Stichtag:' "$agegroup"
          grep -Fq "preg_replace('/[^A-Za-z0-9_]/'" "$agegroup"
          grep -q "class_alias(PersonagegroupField::class, 'JFormFieldpersonagegroup')" "$agegroup_bridge"

          grep -q 'final class ProjectpositionlistField extends SportsManagementListField' "$projectposition"
          grep -q '#__sportsmanagement_project_position' "$projectposition"
          grep -q '#__sportsmanagement_person_project_position' "$projectposition"
          grep -q '#__sportsmanagement_sports_type' "$projectposition"
          grep -q "getUserState(\$option . '.persontype'" "$projectposition"
          grep -q "class_alias(ProjectpositionlistField::class, 'JFormFieldprojectpositionlist')" "$projectposition_bridge"

          grep -q 'final class ProjectpositionrefereeField extends SportsManagementListField' "$referee"
          grep -q '#__sportsmanagement_project_position' "$referee"
          grep -q "quoteName('pos.persontype') . ' = 3'" "$referee"
          grep -q "getUserState(\$option . '.pid'" "$referee"
          grep -q "class_alias(ProjectpositionrefereeField::class, 'JFormFieldprojectpositionreferee')" "$referee_bridge"

          grep -q 'final class ProjectteamlistField extends SportsManagementListField' "$projectteam"
          grep -q '#__sportsmanagement_season_team_id' "$projectteam"
          grep -q '#__sportsmanagement_project_team' "$projectteam"
          grep -q "getUserState(\$option . '.pid'" "$projectteam"
          grep -q "class_alias(ProjectteamlistField::class, 'JFormFieldprojectteamlist')" "$projectteam_bridge"

          grep -q 'final class SeasonteampersonField extends FormField' "$seasonperson"
          grep -q 'use SportsManagementDatabaseTrait' "$seasonperson"
          grep -Fq "preg_replace('/[^A-Za-z0-9_]/'" "$seasonperson"
          grep -q '#__sportsmanagement_team' "$seasonperson"
          grep -q '#__sportsmanagement_club' "$seasonperson"
          grep -q '#__sportsmanagement_season' "$seasonperson"
          grep -q "HTMLHelper::_('image'" "$seasonperson"
          grep -q 'JGLOBAL_NO_MATCHING_RESULTS' "$seasonperson"
          grep -q "class_alias(SeasonteampersonField::class, 'JFormFieldseasonteamperson')" "$seasonperson_bridge"

          if grep -E -- 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|->input|JVERSION|version_compare\(|CONCAT\(|query->dump\(|class JFormField(countryassociation|personagegroup|projectpositionlist|projectpositionreferee|projectteamlist|seasonteamperson) extends' "${files[@]}"; then
            echo 'Dynamic administrator fields regressed to a legacy API, SQL dump, DB-specific label SQL or duplicated global implementation' >&2
            exit 1
          fi
