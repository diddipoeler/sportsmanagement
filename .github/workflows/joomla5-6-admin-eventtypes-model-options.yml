name: Joomla 5/6 Eventtypes controller MVC configuration

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/EventtypesController.php'
      - 'admin/src/Model/EventtypeModel.php'
      - '.github/tests/joomla56_admin_eventtypes_model_options.php'
      - '.github/tests/joomla56_admin_eventtype_media_config.php'
      - '.github/workflows/joomla5-6-admin-eventtypes-model-options.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/EventtypesController.php'
      - 'admin/src/Model/EventtypeModel.php'
      - '.github/tests/joomla56_admin_eventtypes_model_options.php'
      - '.github/tests/joomla56_admin_eventtype_media_config.php'
      - '.github/workflows/joomla5-6-admin-eventtypes-model-options.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-options:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint event-type controller and test
        run: |
          php -l admin/src/Controller/EventtypesController.php
          php -l .github/tests/joomla56_admin_eventtypes_model_options.php
          php -l admin/src/Model/EventtypeModel.php
          php -l .github/tests/joomla56_admin_eventtype_media_config.php
      - name: Ensure Eventtypes model options survive MVC factory delegation
        run: php .github/tests/joomla56_admin_eventtypes_model_options.php
      - name: Reject malformed event icon field settings
        run: php .github/tests/joomla56_admin_eventtype_media_config.php
      - name: Validate native form method PHPDoc
        run: php .github/scripts/check-php-function-docs.php admin/src/Model/EventtypeModel.php
