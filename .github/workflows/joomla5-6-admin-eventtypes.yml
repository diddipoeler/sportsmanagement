name: Joomla 5/6 admin Eventtypes

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/EventtypesModel.php'
      - 'admin/src/View/Eventtypes/HtmlView.php'
      - 'admin/views/eventtypes/view.html.php'
      - 'admin/tmpl/eventtypes/default.php'
      - '.github/workflows/joomla5-6-admin-eventtypes.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/EventtypesModel.php'
      - 'admin/src/View/Eventtypes/HtmlView.php'
      - 'admin/views/eventtypes/view.html.php'
      - 'admin/tmpl/eventtypes/default.php'
      - '.github/workflows/joomla5-6-admin-eventtypes.yml'

jobs:
  eventtypes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint Eventtypes PHP
        run: |
          php -l admin/src/Model/EventtypesModel.php
          php -l admin/src/View/Eventtypes/HtmlView.php
          php -l admin/views/eventtypes/view.html.php
          php -l admin/tmpl/eventtypes/default.php

      - name: Validate native Eventtypes bridge
        shell: bash
        run: |
          model=admin/src/Model/EventtypesModel.php
          view=admin/src/View/Eventtypes/HtmlView.php
          bridge=admin/views/eventtypes/view.html.php
          template=admin/tmpl/eventtypes/default.php

          grep -Fq 'final class EventtypesModel extends SportsManagementListModel' "$model"
          grep -Fq 'require_once $helperFile' "$model"
          grep -Fq 'public $filterForm' "$view"
          grep -Fq "ToolbarHelper::custom('eventtype.import'" "$view"
          grep -Fq "ToolbarHelper::archiveList('eventtype.export'" "$view"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewEventtypes')" "$bridge"
          grep -Fq "LayoutHelper::render('joomla.searchtools.default'" "$template"

          if grep -E 'JLoader::|jimport\(|BaseDatabaseModel::getInstance|Table::getInstance|JHtmlSelect::' "$model" "$view" "$bridge"; then
            echo 'Eventtypes native entry still contains a legacy Joomla API' >&2
            exit 1
          fi
