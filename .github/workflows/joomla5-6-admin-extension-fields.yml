name: Joomla 5/6 extension metadata fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/ExtensionauthorField.php'
      - 'admin/src/Field/ExtensionlinkField.php'
      - 'admin/src/Field/ExtensionmessageField.php'
      - 'admin/src/Field/ExtensionsubtitleField.php'
      - 'admin/src/Field/ExtensionversionField.php'
      - 'admin/src/Field/ExtensiontranslatorsField.php'
      - 'admin/models/fields/extensionauthor.php'
      - 'admin/models/fields/extensionlink.php'
      - 'admin/models/fields/extensionmessage.php'
      - 'admin/models/fields/extensionsubtitle.php'
      - 'admin/models/fields/extensionversion.php'
      - 'admin/models/fields/extensiontranslators.php'
      - '.github/workflows/joomla5-6-admin-extension-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/ExtensionauthorField.php'
      - 'admin/src/Field/ExtensionlinkField.php'
      - 'admin/src/Field/ExtensionmessageField.php'
      - 'admin/src/Field/ExtensionsubtitleField.php'
      - 'admin/src/Field/ExtensionversionField.php'
      - 'admin/src/Field/ExtensiontranslatorsField.php'
      - 'admin/models/fields/extensionauthor.php'
      - 'admin/models/fields/extensionlink.php'
      - 'admin/models/fields/extensionmessage.php'
      - 'admin/models/fields/extensionsubtitle.php'
      - 'admin/models/fields/extensionversion.php'
      - 'admin/models/fields/extensiontranslators.php'
      - '.github/workflows/joomla5-6-admin-extension-fields.yml'

jobs:
  extension-fields:
    name: Extension metadata field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native metadata fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          author=admin/src/Field/ExtensionauthorField.php
          author_bridge=admin/models/fields/extensionauthor.php
          link=admin/src/Field/ExtensionlinkField.php
          link_bridge=admin/models/fields/extensionlink.php
          message=admin/src/Field/ExtensionmessageField.php
          message_bridge=admin/models/fields/extensionmessage.php
          subtitle=admin/src/Field/ExtensionsubtitleField.php
          subtitle_bridge=admin/models/fields/extensionsubtitle.php
          version=admin/src/Field/ExtensionversionField.php
          version_bridge=admin/models/fields/extensionversion.php
          translators=admin/src/Field/ExtensiontranslatorsField.php
          translators_bridge=admin/models/fields/extensiontranslators.php
          files=(
            "$author" "$author_bridge"
            "$link" "$link_bridge"
            "$message" "$message_bridge"
            "$subtitle" "$subtitle_bridge"
            "$version" "$version_bridge"
            "$translators" "$translators_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class ExtensionauthorField extends FormField' "$author"
          grep -q 'getApplication()->getLanguage()' "$author"
          grep -q 'noopener noreferrer' "$author"
          grep -q "class_alias(ExtensionauthorField::class, 'JFormFieldExtensionAuthor')" "$author_bridge"

          grep -q 'final class ExtensionlinkField extends FormField' "$link"
          grep -q 'private const TYPES' "$link"
          grep -q 'getApplication()->getLanguage()' "$link"
          grep -q 'text-bg-info' "$link"
          grep -q "class_alias(ExtensionlinkField::class, 'JFormFieldExtensionLink')" "$link_bridge"

          grep -q 'final class ExtensionmessageField extends FormField' "$message"
          grep -q 'getApplication()->getLanguage()' "$message"
          grep -q "'error', 'fielderror' => 'danger'" "$message"
          grep -q 'text-bg-secondary' "$message"
          grep -q "class_alias(ExtensionmessageField::class, 'JFormFieldextensionmessage')" "$message_bridge"

          grep -q 'final class ExtensionsubtitleField extends FormField' "$subtitle"
          grep -q "preg_match('/^#" "$subtitle"
          grep -q "'#e65100'" "$subtitle"
          grep -q "class_alias(ExtensionsubtitleField::class, 'JFormFieldextensionsubtitle')" "$subtitle_bridge"

          grep -q 'final class ExtensionversionField extends FormField' "$version"
          grep -q 'getApplication()->getLanguage()' "$version"
          grep -q 'htmlspecialchars' "$version"
          grep -q "class_alias(ExtensionversionField::class, 'JFormFieldExtensionVersion')" "$version_bridge"

          grep -q 'final class ExtensiontranslatorsField extends FormField' "$translators"
          grep -q 'getApplication()->getLanguage()' "$translators"
          grep -q 'htmlspecialchars' "$translators"
          grep -q "class_alias(ExtensiontranslatorsField::class, 'JFormFieldExtensionTranslators')" "$translators_bridge"

          if grep -E -- 'Factory::getLanguage\(|new JVersion|JVERSION|version_compare\(|JLoader::|jimport\(|label label-|alert-error|class JFormFieldExtension(Author|Link|Version|Translators) extends|class JFormField(extensionmessage|extensionsubtitle) extends' "${files[@]}"; then
            echo 'Extension metadata field regressed to removed Joomla APIs, Joomla 2/3 markup or a duplicated global implementation' >&2
            exit 1
          fi
