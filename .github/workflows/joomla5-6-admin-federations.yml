name: Joomla 5/6 administrator federation migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  federations:
    name: Native federation model/controller checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate federation migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/JlextfederationModel.php
            admin/src/Model/JlextfederationsModel.php
            admin/src/Controller/JlextfederationController.php
            admin/src/Controller/JlextfederationsController.php
            admin/models/jlextfederation.php
            admin/models/jlextfederations.php
            admin/controllers/jlextfederation.php
            admin/controllers/jlextfederations.php
            admin/views/jlextfederation/view.html.php
            admin/views/jlextfederations/view.html.php
            admin/views/jlextfederations/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/jlextfederation.xml

          grep -q 'class JlextfederationModel extends SportsManagementAdminModel' admin/src/Model/JlextfederationModel.php
          grep -q 'models/forms' admin/src/Model/JlextfederationModel.php
          grep -q "getTable(\$type = 'jlextfederation'" admin/src/Model/JlextfederationModel.php
          grep -q 'function prepareSportsManagementData' admin/src/Model/JlextfederationModel.php
          grep -q 'founded_timestamp' admin/src/Model/JlextfederationModel.php
          grep -q 'dissolved_timestamp' admin/src/Model/JlextfederationModel.php

          grep -q 'class JlextfederationsModel extends SportsManagementListModel' admin/src/Model/JlextfederationsModel.php
          grep -q "quoteName('#__sportsmanagement_federations', 'objassoc')" admin/src/Model/JlextfederationsModel.php
          grep -q 'filter.search_nation' admin/src/Model/JlextfederationsModel.php
          grep -q 'class JlextfederationController extends SportsManagementFormController' admin/src/Controller/JlextfederationController.php
          grep -q 'class JlextfederationsController extends SportsManagementAdminController' admin/src/Controller/JlextfederationsController.php
          grep -q "getModel(\$name = 'Jlextfederation'" admin/src/Controller/JlextfederationsController.php

          grep -q "class_alias(JlextfederationModel::class, 'sportsmanagementModeljlextfederation')" admin/models/jlextfederation.php
          grep -q "class_alias(JlextfederationsModel::class, 'sportsmanagementModeljlextfederations')" admin/models/jlextfederations.php
          grep -q "class_alias(JlextfederationController::class, 'sportsmanagementControllerjlextfederation')" admin/controllers/jlextfederation.php
          grep -q "class_alias(JlextfederationsController::class, 'sportsmanagementControllerjlextfederations')" admin/controllers/jlextfederations.php

          grep -q '\$this->app->getInput()' admin/views/jlextfederation/view.html.php
          grep -q "HTMLHelper::_('select.genericlist'" admin/views/jlextfederations/view.html.php
          grep -Fq 'use Joomla\CMS\Session\Session;' admin/views/jlextfederations/tmpl/default_data.php
          grep -Fq 'use Joomla\Filesystem\File;' admin/views/jlextfederations/tmpl/default_data.php
          grep -Fq 'Session::getFormToken()' admin/views/jlextfederations/tmpl/default_data.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|JHtmlSelect::|Joomla\\CMS\\Filesystem\\File' "${files[@]}"; then
            echo 'Federation migration regressed to a removed Joomla or legacy MVC/database API' >&2
            exit 1
          fi

          if grep -E -- 'new JlextfederationTable\(|Administrator\\Table\\JlextfederationTable' admin/views/jlextfederations/view.html.php; then
            echo 'Federation list view must not construct an unused table instance.' >&2
            exit 1
          fi
