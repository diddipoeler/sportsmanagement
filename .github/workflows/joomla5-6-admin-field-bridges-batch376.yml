name: Joomla 5/6 admin field bridges batch 376

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/fields/playgrounds.php'
      - 'admin/models/fields/extensionlist.php'
      - 'admin/models/fields/languagecharacter.php'
      - 'admin/models/fields/jlgcolor.php'
      - 'admin/models/fields/personagegroup.php'
      - '.github/workflows/joomla5-6-admin-field-bridges-batch376.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/fields/playgrounds.php'
      - 'admin/models/fields/extensionlist.php'
      - 'admin/models/fields/languagecharacter.php'
      - 'admin/models/fields/jlgcolor.php'
      - 'admin/models/fields/personagegroup.php'
      - '.github/workflows/joomla5-6-admin-field-bridges-batch376.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator field bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/fields/playgrounds.php
            admin/models/fields/extensionlist.php
            admin/models/fields/languagecharacter.php
            admin/models/fields/jlgcolor.php
            admin/models/fields/personagegroup.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            grep -Fq -- 'class_alias(' "$file"
            grep -Fq -- 'throw new \\RuntimeException' "$file"
          done
