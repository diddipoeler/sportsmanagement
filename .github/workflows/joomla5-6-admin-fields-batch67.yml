name: Joomla 5/6 admin fields batch 67

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/fields/projectlist.php'
      - 'admin/src/Field/ProjectlistField.php'
      - 'admin/models/fields/leaguelevel.php'
      - 'admin/src/Field/LeaguelevelField.php'
      - '.github/workflows/joomla5-6-admin-fields-batch67.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/models/fields/projectlist.php'
      - 'admin/src/Field/ProjectlistField.php'
      - 'admin/models/fields/leaguelevel.php'
      - 'admin/src/Field/LeaguelevelField.php'
      - '.github/workflows/joomla5-6-admin-fields-batch67.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          php -l admin/models/fields/projectlist.php
          php -l admin/src/Field/ProjectlistField.php
          php -l admin/models/fields/leaguelevel.php
          php -l admin/src/Field/LeaguelevelField.php
      - name: Required file metadata
        run: |
          for file in \
            admin/models/fields/projectlist.php \
            admin/src/Field/ProjectlistField.php \
            admin/models/fields/leaguelevel.php \
            admin/src/Field/LeaguelevelField.php; do
            grep -Fq '@version    5.6.0' "$file"
            grep -Fq '@author     diddipoeler' "$file"
            grep -Fq '@copyright  Copyright (C) diddipoeler' "$file"
            grep -Fq '@license    GNU General Public License version 2 or later; see LICENSE.txt' "$file"
          done
      - name: Bridge guards
        run: |
          grep -Fq 'is_file($nativeField)' admin/models/fields/projectlist.php
          grep -Fq 'SportsManagement native Projectlist field could not be loaded.' admin/models/fields/projectlist.php
          grep -Fq "class_alias(ProjectlistField::class, 'JFormFieldprojectlist')" admin/models/fields/projectlist.php
          grep -Fq 'is_file($nativeField)' admin/models/fields/leaguelevel.php
          grep -Fq 'SportsManagement native Leaguelevel field could not be loaded.' admin/models/fields/leaguelevel.php
          grep -Fq "class_alias(LeaguelevelField::class, 'JFormFieldLeagueLevel')" admin/models/fields/leaguelevel.php
      - name: Reject stale metadata
        run: |
          ! grep -RE '@version[[:space:]]+4\.24' \
            admin/models/fields/projectlist.php \
            admin/src/Field/ProjectlistField.php \
            admin/models/fields/leaguelevel.php \
            admin/src/Field/LeaguelevelField.php
