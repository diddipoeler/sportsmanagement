name: Joomla 5/6 admin fieldsets edit contract

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/tmpl/fieldsets/edit.php'
      - 'admin/views/fieldsets/tmpl/edit.php'
      - 'admin/tmpl/fieldsets/default_editdata.php'
      - 'admin/views/fieldsets/tmpl/default_editdata.php'
      - 'admin/tmpl/fieldsets/default_fieldsets_4.php'
      - 'admin/views/fieldsets/tmpl/default_fieldsets_4.php'
      - 'admin/tmpl/fieldsets/default_position_events.php'
      - 'admin/views/fieldsets/tmpl/default_position_events.php'
      - 'admin/tmpl/fieldsets/default_position_statistics.php'
      - 'admin/views/fieldsets/tmpl/default_position_statistics.php'
      - 'admin/tmpl/fieldsets/default_playgroundnotiz.php'
      - 'admin/views/fieldsets/tmpl/default_playgroundnotiz.php'
      - 'admin/tmpl/fieldsets/default_clublogos.php'
      - 'admin/views/fieldsets/tmpl/default_clublogos.php'
      - 'admin/tmpl/fieldsets/default_playgroundlogos.php'
      - 'admin/views/fieldsets/tmpl/default_playgroundlogos.php'
      - 'admin/tmpl/fieldsets/default_leaguelogos.php'
      - 'admin/views/fieldsets/tmpl/default_leaguelogos.php'
      - 'admin/src/Helper/CountryOptionsHelper.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-admin-fieldsets-edit-contract.yml'
  pull_request:
    branches:
      - joomla5-6
    paths:
      - 'admin/tmpl/fieldsets/edit.php'
      - 'admin/views/fieldsets/tmpl/edit.php'
      - 'admin/tmpl/fieldsets/default_editdata.php'
      - 'admin/views/fieldsets/tmpl/default_editdata.php'
      - 'admin/tmpl/fieldsets/default_fieldsets_4.php'
      - 'admin/views/fieldsets/tmpl/default_fieldsets_4.php'
      - 'admin/tmpl/fieldsets/default_position_events.php'
      - 'admin/views/fieldsets/tmpl/default_position_events.php'
      - 'admin/tmpl/fieldsets/default_position_statistics.php'
      - 'admin/views/fieldsets/tmpl/default_position_statistics.php'
      - 'admin/tmpl/fieldsets/default_playgroundnotiz.php'
      - 'admin/views/fieldsets/tmpl/default_playgroundnotiz.php'
      - 'admin/tmpl/fieldsets/default_clublogos.php'
      - 'admin/views/fieldsets/tmpl/default_clublogos.php'
      - 'admin/tmpl/fieldsets/default_playgroundlogos.php'
      - 'admin/views/fieldsets/tmpl/default_playgroundlogos.php'
      - 'admin/tmpl/fieldsets/default_leaguelogos.php'
      - 'admin/views/fieldsets/tmpl/default_leaguelogos.php'
      - 'admin/src/Helper/CountryOptionsHelper.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-admin-fieldsets-edit-contract.yml'

permissions:
  contents: read

jobs:
  fieldsets-edit-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/tmpl/fieldsets/edit.php
            admin/views/fieldsets/tmpl/edit.php
            admin/tmpl/fieldsets/default_editdata.php
            admin/views/fieldsets/tmpl/default_editdata.php
            admin/tmpl/fieldsets/default_fieldsets_4.php
            admin/views/fieldsets/tmpl/default_fieldsets_4.php
            admin/tmpl/fieldsets/default_position_events.php
            admin/views/fieldsets/tmpl/default_position_events.php
            admin/tmpl/fieldsets/default_position_statistics.php
            admin/views/fieldsets/tmpl/default_position_statistics.php
            admin/tmpl/fieldsets/default_playgroundnotiz.php
            admin/views/fieldsets/tmpl/default_playgroundnotiz.php
            admin/tmpl/fieldsets/default_clublogos.php
            admin/views/fieldsets/tmpl/default_clublogos.php
            admin/tmpl/fieldsets/default_playgroundlogos.php
            admin/views/fieldsets/tmpl/default_playgroundlogos.php
            admin/tmpl/fieldsets/default_leaguelogos.php
            admin/views/fieldsets/tmpl/default_leaguelogos.php
            admin/src/Helper/CountryOptionsHelper.php
            admin/src/Helper/SportsManagementDatabaseResolver.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Required PHP metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/tmpl/fieldsets/edit.php
            admin/views/fieldsets/tmpl/edit.php
            admin/tmpl/fieldsets/default_editdata.php
            admin/views/fieldsets/tmpl/default_editdata.php
            admin/tmpl/fieldsets/default_fieldsets_4.php
            admin/views/fieldsets/tmpl/default_fieldsets_4.php
            admin/tmpl/fieldsets/default_position_events.php
            admin/views/fieldsets/tmpl/default_position_events.php
            admin/tmpl/fieldsets/default_position_statistics.php
            admin/views/fieldsets/tmpl/default_position_statistics.php
            admin/tmpl/fieldsets/default_playgroundnotiz.php
            admin/views/fieldsets/tmpl/default_playgroundnotiz.php
            admin/tmpl/fieldsets/default_clublogos.php
            admin/views/fieldsets/tmpl/default_clublogos.php
            admin/tmpl/fieldsets/default_playgroundlogos.php
            admin/views/fieldsets/tmpl/default_playgroundlogos.php
            admin/tmpl/fieldsets/default_leaguelogos.php
            admin/views/fieldsets/tmpl/default_leaguelogos.php
            admin/src/Helper/CountryOptionsHelper.php
            admin/src/Helper/SportsManagementDatabaseResolver.php
          )

          for file in "${files[@]}"; do
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq "$tag" "$file" || {
                echo "$file is missing $tag"
                exit 1
              }
            done
          done

      - name: Native fieldsets edit contract
        shell: bash
        run: |
          set -euo pipefail
          file='admin/tmpl/fieldsets/edit.php'

          forbidden=(
            'sportsmanagementHelper::'
            'sportsmanagementHelperHtml::'
            'sportsmanagementHelperRoute::'
            'JSMCountries::'
            'Factory::'
            "die('Restricted access')"
            'rel="{handler:'
          )

          for marker in "${forbidden[@]}"; do
            if grep -Fq "$marker" "$file"; then
              echo "Legacy marker remains in $file: $marker"
              exit 1
            fi
          done

          required=(
            "\\defined('_JEXEC') or die;"
            'CountryOptionsHelper::getFlag('
            'SportsManagementDatabaseResolver'
            "'bootstrap.renderModal'"
            "loadTemplate('editdata')"
            'data-bs-toggle="modal"'
            'FILTER_VALIDATE_URL'
          )

          for marker in "${required[@]}"; do
            grep -Fq "$marker" "$file" || {
              echo "Required Joomla 5/6 marker missing in $file: $marker"
              exit 1
            }
          done

      - name: Native fieldsets editdata contract
        shell: bash
        run: |
          set -euo pipefail
          file='admin/tmpl/fieldsets/default_editdata.php'

          forbidden=(
            'sportsmanagementHelper::'
            'sportsmanagementHelperHtml::'
            'sportsmanagementHelperRoute::'
            'JSMCountries::'
            'Factory::'
            'version_compare('
            'JVERSION'
            'Joomla.popupWindow'
            "die('Restricted access')"
            "HTMLHelper::_('sliders."
            "HTMLHelper::_('bootstrap.startTabSet'"
            'http://free.pagepeeker.com'
          )

          for marker in "${forbidden[@]}"; do
            if grep -Fq "$marker" "$file"; then
              echo "Legacy marker remains in $file: $marker"
              exit 1
            fi
          done

          required=(
            "\\defined('_JEXEC') or die;"
            "HTMLHelper::_('uitab.startTabSet'"
            'CountryOptionsHelper::getFlag('
            'SportsManagementDatabaseResolver'
            "'bootstrap.renderModal'"
            'data-bs-toggle="modal"'
            'FILTER_VALIDATE_URL'
            "loadTemplate('position_events')"
            "loadTemplate('position_statistics')"
            "loadTemplate('fieldsets_4')"
            "loadTemplate('footer')"
            "HTMLHelper::_('form.token')"
            "JPATH_COMPONENT . '/views/'"
          )

          for marker in "${required[@]}"; do
            grep -Fq "$marker" "$file" || {
              echo "Required Joomla 5/6 marker missing in $file: $marker"
              exit 1
            }
          done

      - name: Native fieldsets router contract
        shell: bash
        run: |
          set -euo pipefail
          file='admin/tmpl/fieldsets/default_fieldsets_4.php'

          forbidden=(
            'sportsmanagementHelper::'
            'sportsmanagementHelperHtml::'
            'sportsmanagementHelperRoute::'
            'JSMCountries::'
            'Factory::'
            'version_compare('
            'JVERSION'
            'COM_SPORTSMANAGEMENT_JOOMLAVERSION'
            "die('Restricted access')"
            'rel="{handler:'
            'javascript:submitbutton('
          )

          for marker in "${forbidden[@]}"; do
            if grep -Fq "$marker" "$file"; then
              echo "Legacy marker remains in $file: $marker"
              exit 1
            fi
          done

          required=(
            "\\defined('_JEXEC') or die;"
            "'bootstrap.renderModal'"
            'data-bs-toggle="modal"'
            'Joomla.submitbutton('
            "loadTemplate('playgroundnotiz')"
            "loadTemplate('clublogos')"
            "loadTemplate('playgroundlogos')"
            "loadTemplate('leaguelogos')"
            "renderFieldset('request')"
            "renderFieldset('competition')"
          )

          for marker in "${required[@]}"; do
            grep -Fq "$marker" "$file" || {
              echo "Required Joomla 5/6 marker missing in $file: $marker"
              exit 1
            }
          done

      - name: Native position subtemplate contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/tmpl/fieldsets/default_position_events.php
            admin/tmpl/fieldsets/default_position_statistics.php
          )

          for file in "${files[@]}"; do
            forbidden=(
              'jQuery('
              'Factory::'
              'version_compare('
              'JVERSION'
              "die('Restricted access')"
            )

            for marker in "${forbidden[@]}"; do
              if grep -Fq "$marker" "$file"; then
                echo "Legacy marker remains in $file: $marker"
                exit 1
              fi
            done

            required=(
              "\\defined('_JEXEC') or die;"
              'document.querySelectorAll('
              'move_list_items('
              'btn btn-secondary btn-sm'
            )

            for marker in "${required[@]}"; do
              grep -Fq "$marker" "$file" || {
                echo "Required Joomla 5/6 marker missing in $file: $marker"
                exit 1
              }
            done
          done

          grep -Fq "move_up('position_eventslist')" admin/tmpl/fieldsets/default_position_events.php
          grep -Fq "move_down('position_eventslist')" admin/tmpl/fieldsets/default_position_events.php
          grep -Fq "move_up('position_statistic')" admin/tmpl/fieldsets/default_position_statistics.php
          grep -Fq "move_down('position_statistic')" admin/tmpl/fieldsets/default_position_statistics.php

      - name: Native logo history subtemplate contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/tmpl/fieldsets/default_clublogos.php
            admin/tmpl/fieldsets/default_playgroundlogos.php
            admin/tmpl/fieldsets/default_leaguelogos.php
          )

          for file in "${files[@]}"; do
            forbidden=(
              'sportsmanagementHelper::'
              'Factory::'
              'jQuery('
              'version_compare('
              'JVERSION'
              "die('Restricted access')"
            )

            for marker in "${forbidden[@]}"; do
              if grep -Fq "$marker" "$file"; then
                echo "Legacy marker remains in $file: $marker"
                exit 1
              fi
            done

            required=(
              "\\defined('_JEXEC') or die;"
              "new Form("
              "addFormPath(JPATH_COMPONENT . '/models/forms')"
              "'bootstrap.renderModal'"
              'data-bs-toggle="modal"'
              "renderFieldset('picture')"
              "renderFieldset('seasons')"
            )

            for marker in "${required[@]}"; do
              grep -Fq "$marker" "$file" || {
                echo "Required Joomla 5/6 marker missing in $file: $marker"
                exit 1
              }
            done
          done

          grep -Fq "loadFile('clublogohistory', false)" admin/tmpl/fieldsets/default_clublogos.php
          grep -Fq "loadFile('playgroundlogohistory', false)" admin/tmpl/fieldsets/default_playgroundlogos.php
          grep -Fq "loadFile('leaguelogohistory', false)" admin/tmpl/fieldsets/default_leaguelogos.php

      - name: Native playground notes contract
        shell: bash
        run: |
          set -euo pipefail
          file='admin/tmpl/fieldsets/default_playgroundnotiz.php'

          forbidden=(
            'sportsmanagementHelper::'
            'Factory::'
            'jQuery('
            'datetimepicker'
            'version_compare('
            'JVERSION'
            "die('Restricted access')"
          )

          for marker in "${forbidden[@]}"; do
            if grep -Fq "$marker" "$file"; then
              echo "Legacy marker remains in $file: $marker"
              exit 1
            fi
          done

          required=(
            "\\defined('_JEXEC') or die;"
            "document.addEventListener('DOMContentLoaded'"
            "document.createElement('tr')"
            "document.querySelector('#playgroundnotic tbody')"
            "name=\"change_id[]\""
            "name=\"change_playground_id[]\""
            "name=\"change_delete[]\""
            "name=\"change_date_von[]\""
            "name=\"change_date_bis[]\""
            "name=\"name_visitors[]\""
            "name=\"change_notes[]\""
            "name=\"change_max_visitors[]\""
            "name=\"change_max_visitors_int[]\""
            "createInput('text', 'date_von[]'"
            "createInput('text', 'date_bis[]'"
            "createInput('text', 'notes[]'"
            "createInput('text', 'max_visitors[]'"
            "createInput('text', 'max_visitors_int[]'"
          )

          for marker in "${required[@]}"; do
            grep -Fq "$marker" "$file" || {
              echo "Required Joomla 5/6 marker missing in $file: $marker"
              exit 1
            }
          done

      - name: Legacy bridge contracts
        shell: bash
        run: |
          set -euo pipefail

          declare -A bridges=(
            [admin/views/fieldsets/tmpl/edit.php]="/components/com_sportsmanagement/tmpl/fieldsets/edit.php"
            [admin/views/fieldsets/tmpl/default_editdata.php]="/components/com_sportsmanagement/tmpl/fieldsets/default_editdata.php"
            [admin/views/fieldsets/tmpl/default_fieldsets_4.php]="/components/com_sportsmanagement/tmpl/fieldsets/default_fieldsets_4.php"
            [admin/views/fieldsets/tmpl/default_position_events.php]="/components/com_sportsmanagement/tmpl/fieldsets/default_position_events.php"
            [admin/views/fieldsets/tmpl/default_position_statistics.php]="/components/com_sportsmanagement/tmpl/fieldsets/default_position_statistics.php"
            [admin/views/fieldsets/tmpl/default_playgroundnotiz.php]="/components/com_sportsmanagement/tmpl/fieldsets/default_playgroundnotiz.php"
            [admin/views/fieldsets/tmpl/default_clublogos.php]="/components/com_sportsmanagement/tmpl/fieldsets/default_clublogos.php"
            [admin/views/fieldsets/tmpl/default_playgroundlogos.php]="/components/com_sportsmanagement/tmpl/fieldsets/default_playgroundlogos.php"
            [admin/views/fieldsets/tmpl/default_leaguelogos.php]="/components/com_sportsmanagement/tmpl/fieldsets/default_leaguelogos.php"
          )

          for file in "${!bridges[@]}"; do
            grep -Fq "\\defined('_JEXEC') or die;" "$file"
            grep -Fq "require JPATH_ADMINISTRATOR . '${bridges[$file]}';" "$file"

            forbidden=(
              'sportsmanagementHelper::'
              'JSMCountries::'
              'Factory::'
              'jQuery('
              'version_compare('
              'JVERSION'
              "die('Restricted access')"
            )

            for marker in "${forbidden[@]}"; do
              if grep -Fq "$marker" "$file"; then
                echo "Legacy implementation marker remains in bridge $file: $marker"
                exit 1
              fi
            done
          done
