name: Joomla 5/6 administrator form model bridges batch 402

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/team.php'
      - 'admin/models/project.php'
      - 'admin/models/season.php'
      - 'admin/models/player.php'
      - '.github/workflows/joomla5-6-admin-form-model-bridges-batch402.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/team.php'
      - 'admin/models/project.php'
      - 'admin/models/season.php'
      - 'admin/models/player.php'
      - '.github/workflows/joomla5-6-admin-form-model-bridges-batch402.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator form model bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(admin/models/team.php admin/models/project.php admin/models/season.php admin/models/player.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'is_file($nativeModel)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
          done
