name: Joomla 5/6 GCalendar action-pack table

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Table/JsmgcalendarapTable.php'
      - 'admin/tables/jsmgcalendarap.php'
      - '.github/workflows/joomla5-6-admin-gcalendarap-table.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Table/JsmgcalendarapTable.php'
      - 'admin/tables/jsmgcalendarap.php'
      - '.github/workflows/joomla5-6-admin-gcalendarap-table.yml'

jobs:
  gcalendar-table:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate GCalendar table database boundaries
        shell: bash
        run: |
          set -euo pipefail
          table=admin/src/Table/JsmgcalendarapTable.php
          bridge=admin/tables/jsmgcalendarap.php

          php -l "$table"
          php -l "$bridge"
          grep -Fq 'final class JsmgcalendarapTable extends SportsManagementTable' "$table"
          grep -Fq "parent::__construct('#__sportsmanagement_gcalendarap', 'id', \$db)" "$table"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$table"
          grep -Fq 'new Asset($joomlaDatabase)' "$table"
          grep -Fq "class_alias(JsmgcalendarapTable::class, 'sportsmanagementTablejsmGCalendarAP')" "$bridge"

          legacy_re='Table::getInstance\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|jimport\(|JLoader::'
          if grep -E "$legacy_re" "$table" "$bridge"; then
            echo 'GCalendar table slice regressed to a removed/deprecated Joomla API' >&2
            exit 1
          fi
