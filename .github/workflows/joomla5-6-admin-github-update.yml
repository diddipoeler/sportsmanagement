name: Joomla 5/6 administrator GitHub update migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  github-update:
    name: Native GitHub download and local update checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub and update migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/GithubinstallModel.php
            admin/src/Controller/GithubinstallController.php
            admin/src/Model/UpdatesModel.php
            admin/src/Controller/UpdateController.php
            admin/models/githubinstall.php
            admin/controllers/githubinstall.php
            admin/models/updates.php
            admin/controllers/update.php
            admin/views/githubinstall/view.html.php
            admin/views/githubinstall/tmpl/default.php
            admin/views/updates/view.html.php
            admin/views/updates/tmpl/default.php
            admin/views/updates/tmpl/default_data.php
            admin/assets/updates/jsm_update_github.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class GithubinstallModel extends BaseDatabaseModel' admin/src/Model/GithubinstallModel.php
          grep -q 'InstallerHelper::downloadPackage' admin/src/Model/GithubinstallModel.php
          grep -q 'new Archive' admin/src/Model/GithubinstallModel.php
          grep -q "in_array(\$scheme, \['http', 'https'\]" admin/src/Model/GithubinstallModel.php
          grep -q 'function findExtractedDirectory' admin/src/Model/GithubinstallModel.php
          grep -q "setUserState('com_sportsmanagement.github_update_dir'" admin/src/Model/GithubinstallModel.php
          grep -q 'Session::getFormToken' admin/src/Model/GithubinstallModel.php

          grep -q 'class GithubinstallController extends BaseController' admin/src/Controller/GithubinstallController.php
          grep -q 'function CopyGithubLink' admin/src/Controller/GithubinstallController.php
          grep -q 'checkToken' admin/src/Controller/GithubinstallController.php
          grep -q 'cfg_update_server_file' admin/src/Controller/GithubinstallController.php
          grep -q 'CopyGithubLink(\$url)' admin/src/Controller/GithubinstallController.php
          grep -q "getModel('Githubinstall', 'Administrator'" admin/src/Controller/GithubinstallController.php

          grep -q "class_alias(GithubinstallModel::class, 'sportsmanagementModelgithubinstall')" admin/models/githubinstall.php
          grep -q "class_alias(GithubinstallController::class, 'sportsmanagementControllergithubinstall')" admin/controllers/githubinstall.php

          grep -q 'class UpdatesModel extends BaseDatabaseModel' admin/src/Model/UpdatesModel.php
          grep -q 'function loadUpdateFile' admin/src/Model/UpdatesModel.php
          grep -q 'function getVersions' admin/src/Model/UpdatesModel.php
          grep -q 'function getVersionHistory' admin/src/Model/UpdatesModel.php
          grep -q 'function loadUpdateFiles' admin/src/Model/UpdatesModel.php
          grep -q 'function resolveUpdateFile' admin/src/Model/UpdatesModel.php
          grep -q 'function extractMetadataValue' admin/src/Model/UpdatesModel.php
          grep -q 'new \\DirectoryIterator' admin/src/Model/UpdatesModel.php
          grep -q 'file_get_contents' admin/src/Model/UpdatesModel.php
          grep -q "pathinfo(\$real, PATHINFO_EXTENSION)" admin/src/Model/UpdatesModel.php
          grep -q "count(\$parts) > 2" admin/src/Model/UpdatesModel.php
          grep -q "\$part === '..'" admin/src/Model/UpdatesModel.php
          grep -q "sportsmanagementHelper::getDBConnection" admin/src/Model/UpdatesModel.php

          if grep -q 'DATE_FORMAT' admin/src/Model/UpdatesModel.php; then
            echo 'Updates model regressed to MySQL-specific DATE_FORMAT' >&2
            exit 1
          fi

          grep -q 'class UpdateController extends BaseController' admin/src/Controller/UpdateController.php
          grep -q "checkToken('get')" admin/src/Controller/UpdateController.php
          grep -q 'function normaliseFileName' admin/src/Controller/UpdateController.php
          grep -q "\$part === '..'" admin/src/Controller/UpdateController.php
          grep -q "PATHINFO_EXTENSION" admin/src/Controller/UpdateController.php
          grep -q "getModel('Updates', 'Administrator'" admin/src/Controller/UpdateController.php

          grep -q "class_alias(UpdatesModel::class, 'sportsmanagementModelUpdates')" admin/models/updates.php
          grep -q "class_alias(UpdateController::class, 'sportsmanagementControllerUpdate')" admin/controllers/update.php

          grep -q "name=\"task\" value=\"githubinstall.CopyGithubLink\"" admin/views/githubinstall/tmpl/default.php
          grep -q "HTMLHelper::_('form.token')" admin/views/githubinstall/tmpl/default.php
          grep -q '\$this->model->getVersions' admin/views/updates/view.html.php
          grep -q '\$this->model->getVersionHistory' admin/views/updates/view.html.php
          grep -q '\$this->model->loadUpdateFiles' admin/views/updates/view.html.php
          grep -q "loadTemplate('data')" admin/views/updates/tmpl/default.php
          grep -q "bootstrap.startTabSet" admin/views/updates/tmpl/default_data.php
          grep -q "bootstrap.addTab" admin/views/updates/tmpl/default_data.php
          grep -q 'Session::getFormToken' admin/views/updates/tmpl/default_data.php
          grep -q "task=update.save" admin/views/updates/tmpl/default_data.php

          grep -q 'getWebAssetManager' admin/assets/updates/jsm_update_github.php
          grep -q 'plg_installer_folderinstaller/folderinstaller.js' admin/assets/updates/jsm_update_github.php
          grep -q "getUserState(" admin/assets/updates/jsm_update_github.php
          grep -q "github_update_dir" admin/assets/updates/jsm_update_github.php
          grep -q "HTMLHelper::_('form.token')" admin/assets/updates/jsm_update_github.php

          if grep -E -- 'joomla_version|version_compare\(.*JVERSION|Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|Factory::getDocument\(|->getCfg\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|extends JSMModelLegacy|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|JArchive::|JHtml' "${files[@]}"; then
            echo 'GitHub/update migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
