name: Joomla 5/6 administrator GitHub integration migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  github-integration:
    name: Native GitHub REST integration checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub integration migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/GithubModel.php
            admin/src/Controller/GithubController.php
            admin/models/github.php
            admin/controllers/github.php
            admin/views/github/view.html.php
            admin/views/github/tmpl/default.php
            admin/views/github/tmpl/add_issue.php
            admin/views/github/tmpl/github_result.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          model=admin/src/Model/GithubModel.php
          controller=admin/src/Controller/GithubController.php

          grep -Fq 'class GithubModel extends BaseDatabaseModel' "$model"
          grep -Fq 'use Joomla\Http\HttpFactory;' "$model"
          grep -Fq "private const API_ROOT = 'https://api.github.com';" "$model"
          grep -Fq "'Accept' => 'application/vnd.github+json'" "$model"
          grep -Fq "\$headers['Authorization'] = 'Bearer ' . \$token;" "$model"
          grep -Fq '/commits?per_page=30' "$model"
          grep -Fq "/issues'" "$model"
          grep -Fq "if (\$status !== 201" "$model"
          grep -Fq "if (\$status !== 200" "$model"
          grep -Fq 'function addissue' "$model"
          grep -Fq 'function insertissue' "$model"
          grep -Fq 'function getGithubList' "$model"
          grep -Fq 'function repositoryCoordinates' "$model"
          grep -Fq 'function githubToken' "$model"
          grep -Fq 'function normaliseLabel' "$model"
          grep -Fq "preg_match('/^[A-Za-z0-9_.-]+$/', \$value)" "$model"

          grep -Fq 'class GithubController extends BaseController' "$controller"
          grep -Fq '$this->checkToken();' "$controller"
          grep -Fq "authorise('core.manage', 'com_sportsmanagement')" "$controller"
          grep -Fq "getModel('Github', 'Administrator'" "$controller"

          grep -Fq "class_alias(GithubModel::class, 'sportsmanagementModelgithub')" admin/models/github.php
          grep -Fq "class_alias(GithubController::class, 'sportsmanagementControllergithub')" admin/controllers/github.php

          grep -Fq '$this->app->getInput()' admin/views/github/view.html.php
          grep -Fq 'getWebAssetManager()' admin/views/github/view.html.php
          grep -Fq '$this->model->getGithubList()' admin/views/github/view.html.php

          grep -Fq "layout=addissue" admin/views/github/tmpl/default.php
          grep -Fq 'htmlspecialchars($name' admin/views/github/tmpl/default.php
          grep -Fq "str_starts_with(\$htmlUrl, 'https://github.com/')" admin/views/github/tmpl/default.php
          grep -Fq "str_starts_with(\$avatarUrl, 'https://')" admin/views/github/tmpl/default.php
          grep -Fq 'rel="noopener noreferrer"' admin/views/github/tmpl/default.php

          grep -Fq 'type="password" name="gh_token"' admin/views/github/tmpl/add_issue.php
          grep -Fq 'value=""' admin/views/github/tmpl/add_issue.php
          grep -Fq 'value="github.addissue"' admin/views/github/tmpl/add_issue.php
          grep -Fq "HTMLHelper::_('form.token')" admin/views/github/tmpl/add_issue.php

          if grep -Eq 'name="(api\.username|api\.password|gh\.token)"|type="hidden"[^>]+gh_token|value="<\?PHP echo \$this->gh_token' admin/views/github/tmpl/add_issue.php admin/views/github/tmpl/github_result.php; then
            echo 'GitHub credentials regressed into rendered HTML' >&2
            exit 1
          fi

          if grep -E -- 'JGithub|Joomla\\CMS\\Http\\HttpFactory|Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|extends JSMModelLegacy|jsmdb|jsmquery|jsmapp|jsmjinput|version_compare\(.*JVERSION|api\.password|api\.username' "${files[@]}"; then
            echo 'GitHub integration regressed to a removed/deprecated API or browser-exposed credentials' >&2
            exit 1
          fi
