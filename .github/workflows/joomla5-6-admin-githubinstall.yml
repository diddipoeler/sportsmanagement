name: Joomla 5/6 administrator GitHub installer

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Controller/GithubinstallController.php'
      - 'admin/src/Model/GithubinstallModel.php'
      - 'admin/controllers/githubinstall.php'
      - 'admin/models/githubinstall.php'
      - '.github/workflows/joomla5-6-admin-githubinstall.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Controller/GithubinstallController.php'
      - 'admin/src/Model/GithubinstallModel.php'
      - 'admin/controllers/githubinstall.php'
      - 'admin/models/githubinstall.php'
      - '.github/workflows/joomla5-6-admin-githubinstall.yml'

jobs:
  github-installer:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native GitHub installer path
        shell: bash
        run: |
          set -euo pipefail

          controller=admin/src/Controller/GithubinstallController.php
          model=admin/src/Model/GithubinstallModel.php
          controller_bridge=admin/controllers/githubinstall.php
          model_bridge=admin/models/githubinstall.php

          for file in "$controller" "$model" "$controller_bridge" "$model_bridge"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq 'final class GithubinstallController' "$controller"
          grep -Fq '$this->app->getInput()' "$controller"
          grep -Fq '$this->checkToken();' "$controller"
          grep -Fq "getModel('Githubinstall', 'Administrator'" "$controller"

          grep -Fq 'final class GithubinstallModel extends BaseDatabaseModel' "$model"
          grep -Fq 'use Joomla\Filesystem\File;' "$model"
          grep -Fq 'use Joomla\Filesystem\Folder;' "$model"
          grep -Fq 'InstallerHelper::downloadPackage($url)' "$model"
          grep -Fq 'new Archive(' "$model"
          grep -Fq 'File::exists($archivePath)' "$model"
          grep -Fq 'Folder::exists($candidate)' "$model"
          grep -Fq "in_array(\$scheme, ['http', 'https'], true)" "$model"

          grep -Fq "class_alias(GithubinstallController::class, 'sportsmanagementControllergithubinstall')" "$controller_bridge"
          grep -Fq "class_alias(GithubinstallModel::class, 'sportsmanagementModelgithubinstall')" "$model_bridge"

          if grep -E 'Joomla\\CMS\\Filesystem\\(File|Folder)|Joomla\\CMS\\Http\\HttpFactory|Factory::get(Dbo|DBO|Document|User)\(|BaseDatabaseModel::getInstance|jimport\(|JLoader::import|\$app->input' "$controller" "$model" "$controller_bridge" "$model_bridge"; then
            echo 'GitHub installer path regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -E '\b(file_get_contents|file_put_contents|mkdir|unlink|rename|copy|is_file|is_dir)\s*\(' "$model"; then
            echo 'GitHub installer model regressed to direct filesystem operations.' >&2
            exit 1
          fi
