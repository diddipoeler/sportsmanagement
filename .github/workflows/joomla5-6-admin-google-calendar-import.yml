name: Joomla 5/6 administrator Google Calendar

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Controller/JsmgcalendarimportController.php'
      - 'admin/src/Model/JsmgcalendarimportModel.php'
      - 'admin/src/Model/JsmgcalendarsModel.php'
      - 'admin/controllers/jsmgcalendarimport.php'
      - 'admin/models/jsmgcalendarimport.php'
      - 'admin/models/jsmgcalendars.php'
      - '.github/workflows/joomla5-6-admin-google-calendar-import.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Controller/JsmgcalendarimportController.php'
      - 'admin/src/Model/JsmgcalendarimportModel.php'
      - 'admin/src/Model/JsmgcalendarsModel.php'
      - 'admin/controllers/jsmgcalendarimport.php'
      - 'admin/models/jsmgcalendarimport.php'
      - 'admin/models/jsmgcalendars.php'
      - '.github/workflows/joomla5-6-admin-google-calendar-import.yml'

jobs:
  google-calendar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native Google Calendar paths
        shell: bash
        run: |
          set -euo pipefail

          controller=admin/src/Controller/JsmgcalendarimportController.php
          import_model=admin/src/Model/JsmgcalendarimportModel.php
          list_model=admin/src/Model/JsmgcalendarsModel.php
          controller_bridge=admin/controllers/jsmgcalendarimport.php
          import_bridge=admin/models/jsmgcalendarimport.php
          list_bridge=admin/models/jsmgcalendars.php

          for file in "$controller" "$import_model" "$list_model" "$controller_bridge" "$import_bridge" "$list_bridge"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq 'final class JsmgcalendarimportController extends BaseController' "$controller"
          grep -Fq '$this->app->getInput()' "$controller"
          grep -Fq '$this->checkToken();' "$controller"
          grep -Fq '$isOauthCallback' "$controller"

          grep -Fq 'final class JsmgcalendarimportModel extends SportsManagementListModel' "$import_model"
          grep -Fq 'use Joomla\Database\ParameterType;' "$import_model"
          grep -Fq -- "->where(\$db->quoteName('calendar_id') . ' = :calendarId')" "$import_model"
          grep -Fq -- "->bind(':calendarId', \$calendarId, ParameterType::STRING)" "$import_model"
          grep -Fq 'hash_equals($expectedState, $receivedState)' "$import_model"
          grep -Fq '$db->transactionStart();' "$import_model"
          grep -Fq '$db->transactionCommit();' "$import_model"
          grep -Fq '$db->transactionRollback();' "$import_model"
          grep -Fq "insertObject('#__sportsmanagement_gcalendar'" "$import_model"
          grep -Fq "updateObject('#__sportsmanagement_gcalendar'" "$import_model"

          grep -Fq 'final class JsmgcalendarsModel extends SportsManagementListModel' "$list_model"
          grep -Fq 'use Joomla\Filesystem\File;' "$list_model"
          grep -Fq 'use Joomla\Filesystem\Folder;' "$list_model"
          grep -Fq 'InstallerHelper::downloadPackage($url)' "$list_model"
          grep -Fq 'new Archive()' "$list_model"
          grep -Fq 'Folder::create($extractDir)' "$list_model"
          grep -Fq 'File::copy($item->getPathname(), $target)' "$list_model"
          grep -Fq 'File::delete($packagePath)' "$list_model"
          grep -Fq 'Folder::delete($directory)' "$list_model"

          grep -Fq "class_alias(JsmgcalendarimportController::class, 'sportsmanagementControllerjsmgcalendarImport')" "$controller_bridge"
          grep -Fq "class_alias(JsmgcalendarimportModel::class, 'sportsmanagementModeljsmgcalendarImport')" "$import_bridge"
          grep -Fq "class_alias(JsmgcalendarsModel::class, 'sportsmanagementModeljsmGCalendars')" "$list_bridge"

          if grep -E 'Factory::get(Dbo|DBO|Document|User)\(|BaseDatabaseModel::getInstance|jimport\(|JLoader::import|\$app->input|Joomla\\CMS\\Http\\HttpFactory|Joomla\\CMS\\Filesystem\\(File|Folder)|calendar_id.*quote\(\$calendarId\)' "$controller" "$import_model" "$list_model" "$controller_bridge" "$import_bridge" "$list_bridge"; then
            echo 'Google Calendar path regressed to a Joomla 6 legacy or unbound lookup.' >&2
            exit 1
          fi

          if grep -E '@unlink\(|@rmdir\(|!mkdir\(|!copy\(' "$list_model"; then
            echo 'Google Calendar package handling regressed to direct filesystem writes.' >&2
            exit 1
          fi
