name: Joomla 5/6 administrator helper binding fix batch 395

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/helpers/sportsmanagement.php'
      - '.github/workflows/joomla5-6-admin-helper-binding-fix-batch395.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/helpers/sportsmanagement.php'
      - '.github/workflows/joomla5-6-admin-helper-binding-fix-batch395.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator helper binding
        shell: bash
        run: |
          set -euo pipefail
          file=admin/helpers/sportsmanagement.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '$published = 1;' "$file"
          grep -Fq -- "bind(':refereePublished', \$published, ParameterType::INTEGER)" "$file"
          ! grep -Fq -- "bind(':refereePublished', \$published = 1" "$file"
