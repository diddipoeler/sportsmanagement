name: Joomla 5/6 administrator helper database APIs batch 388

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/helpers/sportsmanagement.php'
      - '.github/workflows/joomla5-6-admin-helper-database-apis-batch388.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/helpers/sportsmanagement.php'
      - '.github/workflows/joomla5-6-admin-helper-database-apis-batch388.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator helper APIs
        shell: bash
        run: |
          set -euo pipefail
          file=admin/helpers/sportsmanagement.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'DatabaseInterface::class' "$file"
          grep -Fq -- 'new DatabaseFactory' "$file"
          grep -Fq -- 'ParameterType::INTEGER' "$file"
          ! grep -Fq -- 'JDatabaseDriver::' "$file"
          ! grep -Fq -- 'JDatabase::' "$file"
          ! grep -Fq -- 'Factory::getDbo' "$file"
          ! grep -Fq -- 'Factory::getDBO' "$file"
          ! grep -Fq -- 'Factory::getUser' "$file"
          ! grep -Fq -- "jimport('joomla.html.toolbar')" "$file"
