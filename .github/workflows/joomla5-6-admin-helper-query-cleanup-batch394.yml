name: Joomla 5/6 administrator helper query cleanup batch 394

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/helpers/sportsmanagement.php'
      - '.github/workflows/joomla5-6-admin-helper-query-cleanup-batch394.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/helpers/sportsmanagement.php'
      - '.github/workflows/joomla5-6-admin-helper-query-cleanup-batch394.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator helper query cleanup
        shell: bash
        run: |
          set -euo pipefail
          file=admin/helpers/sportsmanagement.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'createQuery()' "$file"
          grep -Fq -- 'ParameterType::INTEGER' "$file"
          ! grep -Fq -- '->disconnect()' "$file"
          ! grep -Fq -- 'JDatabaseDriver' "$file"
