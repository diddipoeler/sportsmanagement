name: Joomla 5/6 administrator image handler migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  imagehandler:
    name: Native image handler checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image handler migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/ImagehandlerModel.php
            admin/src/Model/ImagelistModel.php
            admin/src/Controller/ImagehandlerController.php
            admin/models/imagehandler.php
            admin/models/imagelist.php
            admin/controllers/imagehandler.php
            admin/views/imagehandler/view.html.php
            admin/views/imagehandler/tmpl/default.php
            admin/views/imagehandler/tmpl/default_image.php
            admin/views/imagehandler/tmpl/upload.php
            admin/views/imagehandler/tmpl/uploaddraganddrop.php
            admin/views/imagelist/view.html.php
            admin/views/imagelist/tmpl/default.php
            admin/views/imagelist/tmpl/default_image.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class ImagehandlerModel extends BaseDatabaseModel' admin/src/Model/ImagehandlerModel.php
          grep -q 'function setDatabase' admin/src/Model/ImagehandlerModel.php
          grep -q 'sportsmanagementHelper::getDBConnection' admin/src/Model/ImagehandlerModel.php
          grep -q 'DirectoryIterator' admin/src/Model/ImagehandlerModel.php
          grep -q 'normaliseRelativeFolder' admin/src/Model/ImagehandlerModel.php
          for method in saveimageclub saveimageteamplayer saveimageplayer getImages getList getPagination
          do
            grep -q "function ${method}" admin/src/Model/ImagehandlerModel.php
          done

          grep -q 'class ImagelistModel extends ListModel' admin/src/Model/ImagelistModel.php
          grep -q 'DirectoryIterator' admin/src/Model/ImagelistModel.php
          grep -q 'normaliseRelativePath' admin/src/Model/ImagelistModel.php
          for method in getFiles getPagination getTotal getStart
          do
            grep -q "function ${method}" admin/src/Model/ImagelistModel.php
          done

          grep -q 'class ImagehandlerController extends SportsManagementAdminController' admin/src/Controller/ImagehandlerController.php
          grep -q "Session::checkToken('post')" admin/src/Controller/ImagehandlerController.php
          grep -q "requirePermission('core.edit')" admin/src/Controller/ImagehandlerController.php
          grep -q "requirePermission('core.create')" admin/src/Controller/ImagehandlerController.php
          grep -q "requirePermission('core.delete')" admin/src/Controller/ImagehandlerController.php
          grep -q 'HttpFactory::getHttp' admin/src/Controller/ImagehandlerController.php
          grep -q "\['http', 'https'\]" admin/src/Controller/ImagehandlerController.php
          grep -q 'getimagesizefromstring' admin/src/Controller/ImagehandlerController.php
          grep -q 'Joomla\\Filesystem\\File' admin/src/Controller/ImagehandlerController.php

          grep -q "class_alias(ImagehandlerModel::class, 'sportsmanagementModelImagehandler')" admin/models/imagehandler.php
          grep -q "class_alias(ImagelistModel::class, 'sportsmanagementModelimagelist')" admin/models/imagelist.php
          grep -q "class_alias(ImagehandlerController::class, 'sportsmanagementControllerImagehandler')" admin/controllers/imagehandler.php

          grep -q '\$this->model->getImages' admin/views/imagehandler/view.html.php
          grep -q "HTMLHelper::_('form.token')" admin/views/imagehandler/tmpl/default.php
          grep -q "imagehandler.delete" admin/views/imagehandler/tmpl/default_image.php
          grep -q 'name="rm\[\]"' admin/views/imagehandler/tmpl/default_image.php
          grep -q "HTMLHelper::_('form.token')" admin/views/imagehandler/tmpl/upload.php
          grep -q "HTMLHelper::_('form.token')" admin/views/imagehandler/tmpl/uploaddraganddrop.php

          grep -q '\$this->model->getFiles' admin/views/imagelist/view.html.php
          grep -q 'Session::getFormToken' admin/views/imagelist/view.html.php
          grep -q 'fetch(baseUrl' admin/views/imagelist/view.html.php
          grep -q 'window.parent.Joomla.Modal' admin/views/imagelist/view.html.php
          grep -q 'method="get"' admin/views/imagelist/tmpl/default.php
          grep -q "HTMLHelper::_('form.token')" admin/views/imagelist/tmpl/default.php
          grep -q 'exportToForm' admin/views/imagelist/tmpl/default_image.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|JVERSION|version_compare\(|JEventDispatcher|SqueezeBox|Joomla\\CMS\\Filesystem\\File' "${files[@]}"; then
            echo 'Image handler migration regressed to a removed/deprecated legacy API' >&2
            exit 1
          fi
