name: Joomla 5/6 administrator image select field gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/ImageSelectField.php'
      - 'admin/models/fields/imageselect.php'
      - 'site/src/Helper/ImageSelectHelper.php'
      - '.github/workflows/joomla5-6-admin-imageselect-field.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/ImageSelectField.php'
      - 'admin/models/fields/imageselect.php'
      - 'site/src/Helper/ImageSelectHelper.php'
      - '.github/workflows/joomla5-6-admin-imageselect-field.yml'

jobs:
  imageselect-field:
    name: Native administrator image selector checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native field and bridge
        shell: bash
        run: |
          set -euo pipefail

          field=admin/src/Field/ImageSelectField.php
          bridge=admin/models/fields/imageselect.php
          helper=site/src/Helper/ImageSelectHelper.php

          php -l "$field"
          php -l "$bridge"
          php -l "$helper"

          grep -q 'final class ImageSelectField extends FormField' "$field"
          grep -q "protected \$type = 'imageselect'" "$field"
          grep -q 'ImageSelectHelper::getSelector' "$field"
          grep -q 'media/com_sportsmanagement/jl_images/spinner.gif' "$field"
          grep -q 'original_' "$field"
          grep -q 'copy_' "$field"
          grep -q "class_alias(ImageSelectField::class, 'JFormFieldImageSelect')" "$bridge"

          if grep -E -- 'class JFormFieldImageSelect extends|JLoader::|jimport\(|FormHelper::loadFieldClass|Factory::getDbo\(|Factory::getDBO\(|Factory::getLanguage\(|JVERSION|version_compare\(|->input' "$field" "$bridge"; then
            echo 'Administrator image selector regressed to duplicated global field logic or legacy Joomla APIs' >&2
            exit 1
          fi
