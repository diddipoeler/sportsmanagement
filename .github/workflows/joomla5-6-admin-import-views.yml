name: Joomla 5/6 administrator import views

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  import-views:
    name: Native admin import view boundary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint migrated import views
        shell: bash
        run: |
          files=(
            admin/views/jlextsisimport/view.html.php
            admin/views/jlextdbbimport/view.html.php
            admin/views/jlextdfbnetplayerimport/view.html.php
            admin/views/joomleagueimport/view.html.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Enforce Joomla 5/6 view APIs
        shell: bash
        run: |
          files=(
            admin/views/jlextsisimport/view.html.php
            admin/views/jlextdbbimport/view.html.php
            admin/views/jlextdfbnetplayerimport/view.html.php
            admin/views/joomleagueimport/view.html.php
          )

          if grep -E 'Factory::getDBO|Factory::getDbo|Factory::getUser|Factory::getURI|Factory::getApplication\(\)->input|BaseDatabaseModel::getInstance|Table::getInstance|jimport\(|JLoader::register|\$app->input' "${files[@]}"; then
            echo 'Admin import view regressed to a legacy Joomla factory/input path' >&2
            exit 1
          fi

          if grep -E '_displayDefault\(\$tpl\)|_displayDefaultUpdate\(\$tpl\)' "${files[@]}"; then
            echo 'Admin import view reintroduced an undefined or unnecessary tpl handoff' >&2
            exit 1
          fi

          grep -q "createModel('Seasons', 'Administrator'" admin/views/jlextdfbnetplayerimport/view.html.php
          grep -q 'getInput()' admin/views/jlextdfbnetplayerimport/view.html.php
          grep -q 'getInput()' admin/views/jlextsisimport/view.html.php
          grep -q 'getInput()' admin/views/jlextdbbimport/view.html.php
          grep -q 'getInput()' admin/views/joomleagueimport/view.html.php

      - name: Enforce native DFBnet import boundary
        shell: bash
        run: |
          files=(
            admin/src/View/Jlextdfbnetplayerimport/HtmlView.php
            admin/tmpl/jlextdfbnetplayerimport/default.php
            admin/tmpl/jlextdfbnetplayerimport/default_update.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          if grep -E 'LegacyBootstrap|class_alias|sportsmanagementHelper::addTemplatePaths|TVarDumper|Factory::getApplication\(\)->input|\$app->input' "${files[@]}"; then
            echo 'Native DFBnet import boundary regressed to a legacy presentation path' >&2
            exit 1
          fi

          grep -q 'SportsManagementDatabaseResolver::resolve' admin/src/View/Jlextdfbnetplayerimport/HtmlView.php
          grep -q "createModel('Seasons', 'Administrator'" admin/src/View/Jlextdfbnetplayerimport/HtmlView.php

      - name: Enforce native JoomlaLeague import boundary
        shell: bash
        run: |
          files=(
            admin/src/View/Joomleagueimport/HtmlView.php
            admin/tmpl/joomleagueimport/default.php
            admin/tmpl/joomleagueimport/positions.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          if grep -E 'LegacyBootstrap|class_alias|sportsmanagementHelper::addTemplatePaths|Factory::getApplication\(\)->input|\$app->input|HTMLHelper::Select::genericlist' "${files[@]}"; then
            echo 'Native JoomlaLeague import boundary regressed to a legacy presentation path' >&2
            exit 1
          fi

          grep -q 'getInput()' admin/src/View/Joomleagueimport/HtmlView.php
          grep -q "'select.genericList'" admin/src/View/Joomleagueimport/HtmlView.php
          grep -q 'addTemplatePath' admin/src/View/Joomleagueimport/HtmlView.php

      - name: Enforce PHP 8 safe JoomlaLeague progress
        shell: bash
        run: |
          view=admin/src/View/Joomleagueimport/HtmlView.php

          grep -q 'max(1, (int) ComponentHelper::getParams' "$view"
          grep -q '\$this->totals > 0' "$view"
          grep -q 'round(\$this->step \* 100 / \$this->totals)' "$view"

          if grep -E '/[[:space:]]*\$this->totals' "$view" | grep -v 'totals > 0' | grep -v 'round'; then
            echo 'Review unexpected division by totals in JoomlaLeague import progress' >&2
            exit 1
          fi
