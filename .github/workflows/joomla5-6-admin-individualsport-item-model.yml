name: Joomla 5/6 admin individual sport item model

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [master]

jobs:
  admin-individualsport-item-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate native individual sport item model
        shell: bash
        run: |
          set -euo pipefail
          model=admin/src/Model/JlextindividualsportModel.php
          model_bridge=admin/models/jlextindividualsport.php
          table=admin/src/Table/MatchSingleTable.php
          table_bridge=admin/tables/matchsingle.php
          for file in "$model" "$model_bridge" "$table" "$table_bridge"; do php -l "$file"; done

          grep -q 'final class JlextindividualsportModel extends SportsManagementAdminModel' "$model"
          grep -q 'IndividualMatchAdminService' "$model"
          grep -q 'IndividualMatchWriteService' "$model"
          grep -q 'new MatchSingleTable' "$model"
          grep -q 'getInput()' "$model"
          grep -q 'getIdentity()' "$model"
          grep -q 'getmatchsingle_rowshome' "$model"
          grep -q 'final class MatchSingleTable extends SportsManagementTable' "$table"
          grep -q '#__sportsmanagement_match_single' "$table"
          grep -q 'class_alias(JlextindividualsportModel::class' "$model_bridge"
          grep -q 'class_alias(MatchSingleTable::class' "$table_bridge"

          active=("$model" "$model_bridge" "$table" "$table_bridge")
          if grep -E -- 'JSMModelAdmin|JSMTable|BaseDatabaseModel::getInstance|Table::getInstance|Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|->input|version_compare\(JVERSION|save_round_match_(tennis|kegeln)|function save_array' "${active[@]}"; then
            echo 'Individual sport item model regressed to a legacy API' >&2
            exit 1
          fi
          if grep -E -- 'Factory::|JSMModel|JSMTable|Table::getInstance' "$model_bridge" "$table_bridge"; then
            echo 'Legacy individual sport model/table bridge is no longer passive' >&2
            exit 1
          fi
