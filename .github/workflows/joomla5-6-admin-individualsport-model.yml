name: Joomla 5/6 admin individual sport model

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-individual-sport-model:
    name: Native administrator individual-sport model gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate administrator individual-sport list model
        shell: bash
        run: |
          set -euo pipefail
          model=admin/src/Model/JlextindividualsportesModel.php
          bridge=admin/models/jlextindividualsportes.php
          setup=admin/src/Service/IndividualMatchSetupService.php

          php -l "$model"
          php -l "$bridge"
          php -l "$setup"

          grep -q 'final class JlextindividualsportesModel extends ListModel' "$model"
          grep -q "config\['dbo'\]" "$model"
          grep -q 'IndividualMatchSetupService' "$model"
          grep -q 'getProjectTeams' "$model"
          grep -q 'getProjectTeamsOptions' "$model"
          grep -q 'getMatchesByRound' "$model"
          grep -q 'getPlayer' "$model"
          grep -q 'getSportType' "$model"
          grep -q 'getListQuery' "$model"
          grep -q 'final class IndividualMatchSetupService' "$setup"
          grep -q 'ensureMatchSlots' "$setup"
          grep -q '#__sportsmanagement_match_single' "$setup"
          grep -q 'class_alias(JlextindividualsportesModel::class' "$bridge"

          active=("$model" "$bridge" "$setup")
          if grep -E -- 'Factory::getApplication\(\)->input|\$app->input|Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|BaseDatabaseModel::getInstance|Table::getInstance|JLoader::|JSMModelList|JSMModelAdmin|->disconnect\(' "${active[@]}"; then
            echo 'Administrator individual-sport model regressed to a legacy Joomla API' >&2
            exit 1
          fi

          if grep -E -- 'class sportsmanagementModel|Factory::|JSMModel' "$bridge"; then
            echo 'Legacy administrator individual-sport model bridge is no longer passive' >&2
            exit 1
          fi
