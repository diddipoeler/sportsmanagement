name: Joomla 5/6 admin individual sport view

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-individualsport-view:
    name: Administrator individual sport native view gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate individual sport view migration
        shell: bash
        run: |
          set -euo pipefail

          bridge=admin/views/jlextindividualsportes/view.html.php
          view=admin/src/View/Jlextindividualsportes/HtmlView.php
          data_service=admin/src/Service/IndividualMatchViewService.php
          pairing_service=admin/src/Service/IndividualMatchPairingService.php
          roster_service=admin/src/Service/IndividualMatchRosterReadService.php
          golf_service=admin/src/Service/IndividualMatchGolfSetupService.php
          template_dir=admin/tmpl/jlextindividualsportes
          legacy_template_dir=admin/views/jlextindividualsportes/tmpl
          asset=admin/assets/js/individualsport-admin.js

          for file in "$bridge" "$view" "$data_service" "$pairing_service" "$roster_service" "$golf_service" "$template_dir"/*.php; do
            php -l "$file"
          done
          node --check "$asset"

          grep -q 'namespace Diddipoeler\\Component\\SportsManagement\\Administrator\\View\\Jlextindividualsportes;' "$view"
          grep -q 'final class HtmlView extends BaseHtmlView' "$view"
          grep -q 'IndividualMatchViewService' "$view"
          grep -q 'IndividualMatchPairingService' "$view"
          grep -q 'getInput()' "$view"
          grep -q 'public int $close = 0;' "$view"
          grep -q 'public bool $debug = false;' "$view"
          grep -q '$this->close = $input->getInt' "$view"
          grep -q '$this->debug = (bool) $app->get' "$view"
          grep -q "setLayout('default_generate')" "$view"
          grep -q 'class_alias(HtmlView::class' "$bridge"

          grep -q 'final class IndividualMatchViewService' "$data_service"
          grep -q 'DatabaseInterface' "$data_service"
          grep -q 'ensureGolfBillardSingles' "$data_service"
          grep -q 'IndividualMatchRosterReadService' "$data_service"
          grep -q 'IndividualMatchGolfSetupService' "$data_service"
          grep -q 'transactionStart' "$golf_service"
          grep -q '#__sportsmanagement_match_single' "$data_service"
          grep -q '#__sportsmanagement_match_player' "$roster_service"
          grep -q '#__sportsmanagement_match_player' "$golf_service"

          grep -q 'final class IndividualMatchPairingService' "$pairing_service"
          grep -q "'43'" "$pairing_service"
          grep -q "'34'" "$pairing_service"
          grep -q 'Double:Double' "$pairing_service"

          for expected in default.php default_generate.php default_massadd.php default_matches.php default_matches_small_bore_rifle.php default_matrix.php; do
            test -f "$template_dir/$expected"
            test -f "$legacy_template_dir/$expected"
            grep -q "components/com_sportsmanagement/tmpl/jlextindividualsportes/$expected" "$legacy_template_dir/$expected"
          done

          if grep -E -- '<script|Factory::|jQuery\(|\.getElement\(|\.getElements\(|\.addEvent\(|\$E\(' "$legacy_template_dir"/*.php; then
            echo 'Legacy individual sport template bridge contains executable legacy runtime code' >&2
            exit 1
          fi

          grep -q 'registerAndUseScript' "$template_dir/default.php"
          grep -q 'individualsport-admin.js' "$template_dir/default.php"
          grep -q 'registerAndUseScript' "$template_dir/default_massadd.php"
          grep -q 'data-jsm-action="save-match"' "$template_dir/default_matrix.php"
          grep -q "data-jsm-action='add-matches'" "$template_dir/default_massadd.php"
          grep -q "data-jsm-action='copy-matches'" "$template_dir/default_massadd.php"
          grep -q 'data-jsm-action' "$asset"
          grep -q 'window.saveAndCloseIndividualSport' "$asset"
          grep -q '$this->debug' "$template_dir/default_generate.php"
          grep -q 'data-jsm-result-row' "$template_dir/default_result_row.php"
          grep -q 'data-jsm-close-editor' "$template_dir/default_matches.php"
          grep -q 'data-jsm-action="submit-task"' "$template_dir/default_matches.php"
          grep -q 'data-jsm-action="save-close"' "$template_dir/default_matches.php"
          grep -q "require __DIR__ . '/default_matches.php'" "$template_dir/default_matches_small_bore_rifle.php"
          grep -q 'handleResultRowChange' "$asset"
          grep -q "closest('\\[data-jsm-result-row\\]')" "$asset"

          runtime_templates=("$template_dir/default.php" "$template_dir/default_generate.php" "$template_dir/default_matches.php" "$template_dir/default_matches_small_bore_rifle.php" "$template_dir/default_result_row.php" "$template_dir/default_matrix.php" "$template_dir/default_massadd.php")
          if grep -E -- 'use Joomla\\CMS\\Factory|Factory::|jQuery\(|\.getElement\(|\.getElements\(|\.addEvent\(|\$E\(' "${runtime_templates[@]}" "$asset"; then
            echo 'Administrator individual sport runtime regressed to Factory, jQuery, or MooTools' >&2
            exit 1
          fi

          if grep -E -- '<script[ >]' "$template_dir/default.php"; then
            echo 'Administrator individual sport default template contains inline JavaScript again' >&2
            exit 1
          fi

          if grep -Ei -- 'on(click|change)=' "$template_dir/default_matrix.php" "$template_dir/default_massadd.php"; then
            echo 'Administrator individual sport matrix/mass-add templates contain inline event handlers again' >&2
            exit 1
          fi

          if grep -Ei -- 'on(click|change)=' "$template_dir/default_matches.php" "$template_dir/default_matches_small_bore_rifle.php" "$template_dir/default_result_row.php"; then
            echo 'Administrator individual sport result templates contain inline event handlers again' >&2
            exit 1
          fi

          if grep -E -- '<script[ >]' "$template_dir/default_matches.php" "$template_dir/default_matches_small_bore_rifle.php"; then
            echo 'Administrator individual sport result templates contain inline JavaScript again' >&2
            exit 1
          fi

          active=("$bridge" "$view" "$data_service" "$pairing_service" "$roster_service" "$golf_service")
          if grep -E -- 'BaseDatabaseModel::getInstance|JSMModel|sportsmanagementModel(Project|Teamplayers|Match)|Factory::getConfig\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|->input' "${active[@]}"; then
            echo 'Administrator individual sport view regressed to a legacy Joomla/SportsManagement API' >&2
            exit 1
          fi

          if grep -E -- 'class sportsmanagementViewjlextindividualsportes|BaseDatabaseModel|Factory::' "$bridge"; then
            echo 'Legacy individual sport view bridge is no longer passive' >&2
            exit 1
          fi
