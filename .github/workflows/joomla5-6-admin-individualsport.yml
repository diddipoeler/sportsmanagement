name: Joomla 5/6 admin individual sport

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-individual-sport:
    name: Native administrator individual-sport gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate administrator individual-sport migration
        shell: bash
        run: |
          set -euo pipefail
          singular=admin/src/Controller/JlextindividualsportController.php
          plural=admin/src/Controller/JlextindividualsportesController.php
          singular_bridge=admin/controllers/jlextindividualsport.php
          plural_bridge=admin/controllers/jlextindividualsportes.php
          admin_service=admin/src/Service/IndividualMatchAdminService.php
          write_service=admin/src/Service/IndividualMatchWriteService.php

          for file in "$singular" "$plural" "$singular_bridge" "$plural_bridge" "$admin_service" "$write_service"; do
            php -l "$file"
          done

          grep -q 'final class JlextindividualsportController extends SportsManagementAdminController' "$singular"
          grep -q 'final class JlextindividualsportesController extends SportsManagementAdminController' "$plural"
          grep -q 'IndividualMatchAdminService' "$singular"
          grep -q 'IndividualMatchAdminService' "$plural"
          grep -q 'IndividualMatchWriteService' "$plural"
          grep -q 'generateSingles' "$plural"
          grep -q 'saveShort' "$plural"
          grep -q 'setPublished' "$plural"
          grep -q 'deleteSingles' "$plural"
          grep -q 'final class IndividualMatchAdminService' "$admin_service"
          grep -q '#__sportsmanagement_match_single' "$admin_service"
          grep -q 'transactionStart' "$admin_service"
          grep -q 'class_alias(JlextindividualsportController::class' "$singular_bridge"
          grep -q 'class_alias(JlextindividualsportesController::class' "$plural_bridge"

          active=("$singular" "$plural" "$singular_bridge" "$plural_bridge" "$admin_service" "$write_service")
          if grep -E -- 'Factory::getApplication\(\)->input|\$app->input|Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|BaseDatabaseModel::getInstance|Table::getInstance|JSMControllerAdmin|JSMModelAdmin|sportsmanagementModeljlextindividualsport|->disconnect\(' "${active[@]}"; then
            echo 'Administrator individual-sport path regressed to a legacy Joomla/SportsManagement API' >&2
            exit 1
          fi

          if grep -E -- 'class sportsmanagementController|Factory::|JSMControllerAdmin' "$singular_bridge" "$plural_bridge"; then
            echo 'Administrator individual-sport legacy bridges are no longer passive' >&2
            exit 1
          fi
