name: Joomla 5/6 Jlext master data

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/JlextassociationModel.php'
      - 'admin/src/Model/JlextcountryModel.php'
      - 'admin/src/Model/JlextfederationModel.php'
      - 'admin/src/Table/JlextassociationTable.php'
      - 'admin/src/Table/JlextcountryTable.php'
      - 'admin/src/Table/JlextfederationTable.php'
      - 'admin/tables/jlextassociation.php'
      - 'admin/tables/jlextcountry.php'
      - 'admin/tables/jlextfederation.php'
      - '.github/workflows/joomla5-6-admin-jlext-masterdata.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/JlextassociationModel.php'
      - 'admin/src/Model/JlextcountryModel.php'
      - 'admin/src/Model/JlextfederationModel.php'
      - 'admin/src/Table/JlextassociationTable.php'
      - 'admin/src/Table/JlextcountryTable.php'
      - 'admin/src/Table/JlextfederationTable.php'
      - 'admin/tables/jlextassociation.php'
      - 'admin/tables/jlextcountry.php'
      - 'admin/tables/jlextfederation.php'
      - '.github/workflows/joomla5-6-admin-jlext-masterdata.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Jlext master-data slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/JlextassociationModel.php
            admin/src/Model/JlextcountryModel.php
            admin/src/Model/JlextfederationModel.php
            admin/src/Table/JlextassociationTable.php
            admin/src/Table/JlextcountryTable.php
            admin/src/Table/JlextfederationTable.php
            admin/tables/jlextassociation.php
            admin/tables/jlextcountry.php
            admin/tables/jlextfederation.php
          )
          for file in "${files[@]}"; do php -l "$file"; done

          grep -Fq 'new JlextassociationTable($this->getDatabase())' admin/src/Model/JlextassociationModel.php
          grep -Fq 'new JlextcountryTable($this->getDatabase())' admin/src/Model/JlextcountryModel.php
          grep -Fq 'new JlextfederationTable($this->getDatabase())' admin/src/Model/JlextfederationModel.php
          grep -Fq 'require_once $helperFile' admin/src/Model/JlextassociationModel.php
          grep -Fq 'require_once $helperFile' admin/src/Model/JlextfederationModel.php
          grep -Fq '(new HttpFactory())->getHttp()' admin/src/Model/JlextcountryModel.php
          grep -Fq '$response->getStatusCode()' admin/src/Model/JlextcountryModel.php
          grep -Fq '$response->getBody()' admin/src/Model/JlextcountryModel.php

          grep -Fq "parent::__construct('#__sportsmanagement_associations', 'id', \$db)" admin/src/Table/JlextassociationTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_countries', 'id', \$db)" admin/src/Table/JlextcountryTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_federations', 'id', \$db)" admin/src/Table/JlextfederationTable.php
          grep -Fq "class_alias(JlextassociationTable::class, 'sportsmanagementTablejlextassociation')" admin/tables/jlextassociation.php
          grep -Fq "class_alias(JlextcountryTable::class, 'sportsmanagementTablejlextcountry')" admin/tables/jlextcountry.php
          grep -Fq "class_alias(JlextfederationTable::class, 'sportsmanagementTablejlextfederation')" admin/tables/jlextfederation.php

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Joomla\\CMS\\Filesystem\\(File|Folder|Path)|Joomla\\CMS\\Http\\|Table::getInstance\(|->code|->body'
          if grep -ER "$legacy_re" "${files[@]}"; then
            echo 'Jlext master-data slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
