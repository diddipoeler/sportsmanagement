name: Joomla 5/6 administrator country migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  countries:
    name: Native country model/controller/import checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate country migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/SportsManagementAdminModel.php
            admin/src/Model/SportsManagementListModel.php
            admin/src/Model/JlextcountryModel.php
            admin/src/Model/JlextcountriesModel.php
            admin/src/Controller/JlextcountryController.php
            admin/src/Controller/JlextcountriesController.php
            admin/src/View/Jlextcountry/HtmlView.php
            admin/src/View/Jlextcountries/HtmlView.php
            admin/models/jlextcountry.php
            admin/models/jlextcountries.php
            admin/controllers/jlextcountry.php
            admin/controllers/jlextcountries.php
            admin/views/jlextcountry/view.html.php
            admin/views/jlextcountries/view.html.php
            admin/tmpl/jlextcountries/default.php
            admin/views/jlextcountries/tmpl/default.php
            admin/views/jlextcountries/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/forms/jlextcountry.xml
          test -f admin/forms/filter_jlextcountries.xml
          grep -Fq "components/com_sportsmanagement/forms" admin/src/Model/SportsManagementAdminModel.php
          grep -Fq "components/com_sportsmanagement/forms" admin/src/Model/SportsManagementListModel.php
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' admin/forms/jlextcountry.xml
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' admin/forms/filter_jlextcountries.xml

          grep -Fq 'class JlextcountryModel extends SportsManagementAdminModel' admin/src/Model/JlextcountryModel.php
          grep -Fq "getTable(\$type = 'jlextcountry'" admin/src/Model/JlextcountryModel.php
          grep -Fq 'function prepareSportsManagementData' admin/src/Model/JlextcountryModel.php
          grep -Eq "countrymap_mapdata.*= null" admin/src/Model/JlextcountryModel.php
          grep -Eq "countrymap_mapinfo.*= null" admin/src/Model/JlextcountryModel.php
          grep -Fq 'function importplz' admin/src/Model/JlextcountryModel.php
          grep -Fq 'Joomla\Http\HttpFactory' admin/src/Model/JlextcountryModel.php
          grep -Fq 'Joomla\Archive\Archive' admin/src/Model/JlextcountryModel.php
          grep -Fq 'Joomla\Filesystem\File' admin/src/Model/JlextcountryModel.php
          grep -Fq 'Joomla\Filesystem\Folder' admin/src/Model/JlextcountryModel.php
          grep -Fq 'File::write' admin/src/Model/JlextcountryModel.php
          grep -Fq 'Folder::create' admin/src/Model/JlextcountryModel.php
          grep -Fq 'fgetcsv' admin/src/Model/JlextcountryModel.php
          grep -Fq "insertObject('#__sportsmanagement_countries_plz'" admin/src/Model/JlextcountryModel.php
          grep -Fq 'transactionStart' admin/src/Model/JlextcountryModel.php
          grep -Fq 'transactionCommit' admin/src/Model/JlextcountryModel.php
          grep -Fq 'transactionRollback' admin/src/Model/JlextcountryModel.php

          grep -Fq 'class JlextcountriesModel extends SportsManagementListModel' admin/src/Model/JlextcountriesModel.php
          grep -Fq 'function getFederation' admin/src/Model/JlextcountriesModel.php
          grep -Fq 'function getListQuery' admin/src/Model/JlextcountriesModel.php
          grep -Fq "['IS NULL', 'IS NOT NULL']" admin/src/Model/JlextcountriesModel.php
          grep -Fq "quoteName('#__sportsmanagement_countries', 'objcountry')" admin/src/Model/JlextcountriesModel.php
          grep -Fq "quoteName('#__sportsmanagement_federations', 'f')" admin/src/Model/JlextcountriesModel.php

          grep -Fq 'class JlextcountryController extends SportsManagementFormController' admin/src/Controller/JlextcountryController.php
          grep -Fq 'class JlextcountriesController extends SportsManagementAdminController' admin/src/Controller/JlextcountriesController.php
          grep -Fq "getModel(\$name = 'Jlextcountry'" admin/src/Controller/JlextcountriesController.php
          grep -Fq 'function importplz' admin/src/Controller/JlextcountriesController.php
          grep -Fq 'checkToken' admin/src/Controller/JlextcountriesController.php
          grep -Fq '$this->app->getInput()' admin/src/Controller/JlextcountriesController.php

          grep -Fq "class_alias(JlextcountryModel::class, 'sportsmanagementModeljlextcountry')" admin/models/jlextcountry.php
          grep -Fq "class_alias(JlextcountriesModel::class, 'sportsmanagementModeljlextcountries')" admin/models/jlextcountries.php
          grep -Fq "class_alias(JlextcountryController::class, 'sportsmanagementControllerjlextcountry')" admin/controllers/jlextcountry.php
          grep -Fq "class_alias(JlextcountriesController::class, 'sportsmanagementControllerjlextcountries')" admin/controllers/jlextcountries.php

          grep -Fq 'final class HtmlView extends BaseHtmlView' admin/src/View/Jlextcountry/HtmlView.php
          grep -Fq 'Joomla\CMS\Application\AdministratorApplication' admin/src/View/Jlextcountry/HtmlView.php
          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Jlextcountry/HtmlView.php
          grep -Fq "ToolbarHelper::apply('jlextcountry.apply')" admin/src/View/Jlextcountry/HtmlView.php
          grep -Fq 'final class HtmlView extends BaseHtmlView' admin/src/View/Jlextcountries/HtmlView.php
          grep -Fq "'jlextcountries.importplz'" admin/src/View/Jlextcountries/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewJlextcountry')" admin/views/jlextcountry/view.html.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewjlextcountries')" admin/views/jlextcountries/view.html.php

          grep -Fq "require JPATH_ADMINISTRATOR . '/components/com_sportsmanagement/tmpl/jlextcountries/default.php'" admin/views/jlextcountries/tmpl/default.php
          grep -Fq "HTMLHelper::_('form.token')" admin/tmpl/jlextcountries/default.php
          grep -Fq "HTMLHelper::_('grid.checkall')" admin/tmpl/jlextcountries/default.php
          grep -Fq "task=jlextcountry.edit" admin/tmpl/jlextcountries/default.php
          grep -Fq 'Session::getFormToken' admin/views/jlextcountries/tmpl/default_data.php
          grep -Fq 'is_file' admin/views/jlextcountries/tmpl/default_data.php
          grep -Fq "'objcountry.published'" admin/views/jlextcountries/tmpl/default_data.php

          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/Model/SportsManagementAdminModel.php
          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/Model/SportsManagementListModel.php

          if grep -E -- 'Factory::getApplication\(|Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|JHtmlSelect::|Joomla\\CMS\\Filesystem\\|Joomla\\CMS\\Http\\HttpFactory|file_put_contents\(|mkdir\(|unlink\(|version_compare\(.*JVERSION|joomla_version|JSMparseCSV' "${files[@]}"; then
            echo 'Country migration regressed to a removed or deprecated Joomla/legacy API' >&2
            exit 1
          fi
