name: Joomla 5/6 administrator DFB-key import migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  jlextdfbkeyimport:
    name: Native DFB-key import checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate DFB-key import migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/JlextdfbkeyimportModel.php
            admin/src/Controller/JlextdfbkeyimportController.php
            admin/models/jlextdfbkeyimport.php
            admin/controllers/jlextdfbkeyimport.php
            admin/views/jlextdfbkeyimport/view.html.php
            admin/views/jlextdfbkeyimport/tmpl/default_createdays.php
            admin/views/jlextdfbkeyimport/tmpl/default_firstmatchday.php
            admin/views/jlextdfbkeyimport/tmpl/default_savematchdays.php
            admin/views/jlextdfbkeyimport/tmpl/default_getdivision.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class JlextdfbkeyimportModel extends SportsManagementListModel' admin/src/Model/JlextdfbkeyimportModel.php
          for method in _loadData _initData getProjectType getProjectteams getDFBKey getCountry getMatchdays getMatches getSchedule getDivisions checkTable; do
            grep -q "function ${method}" admin/src/Model/JlextdfbkeyimportModel.php
          done
          grep -q "quoteName('#__sportsmanagement_dfbkey'" admin/src/Model/JlextdfbkeyimportModel.php
          grep -q "quoteName('#__sportsmanagement_round'" admin/src/Model/JlextdfbkeyimportModel.php
          grep -q "quoteName('#__sportsmanagement_match')" admin/src/Model/JlextdfbkeyimportModel.php
          grep -q 'getDatabase' admin/src/Model/JlextdfbkeyimportModel.php

          grep -q 'class JlextdfbkeyimportController extends BaseController' admin/src/Controller/JlextdfbkeyimportController.php
          for method in getdivisionfirst apply save insert; do
            grep -q "function ${method}" admin/src/Controller/JlextdfbkeyimportController.php
          done
          test "$(grep -c 'checkToken' admin/src/Controller/JlextdfbkeyimportController.php)" -ge 4
          grep -q "insertObject('#__sportsmanagement_round'" admin/src/Controller/JlextdfbkeyimportController.php
          grep -q "insertObject('#__sportsmanagement_match'" admin/src/Controller/JlextdfbkeyimportController.php

          grep -q "class_alias(JlextdfbkeyimportModel::class, 'sportsmanagementModeljlextDfbkeyimport')" admin/models/jlextdfbkeyimport.php
          grep -q "class_alias(JlextdfbkeyimportController::class, 'sportsmanagementControllerjlextdfbkeyimport')" admin/controllers/jlextdfbkeyimport.php
          grep -q '\$this->model->getDivisions' admin/views/jlextdfbkeyimport/view.html.php
          grep -q '\$this->app->getInput()' admin/views/jlextdfbkeyimport/view.html.php

          for template in \
            admin/views/jlextdfbkeyimport/tmpl/default_createdays.php \
            admin/views/jlextdfbkeyimport/tmpl/default_firstmatchday.php \
            admin/views/jlextdfbkeyimport/tmpl/default_savematchdays.php \
            admin/views/jlextdfbkeyimport/tmpl/default_getdivision.php; do
            grep -q "HTMLHelper::_('form.token')" "$template"
          done

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|sportsmanagementModeldatabasetool' "${files[@]}"; then
            echo 'DFB-key importer regressed to a removed Joomla or legacy MVC/database API' >&2
            exit 1
          fi
