name: Joomla 5/6 administrator handball.net migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  jlexthandballnet:
    name: Native handball.net import checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate handball.net migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/JlexthandballnetModel.php
            admin/src/Controller/JlexthandballnetController.php
            admin/models/jlexthandballnet.php
            admin/controllers/jlexthandballnet.php
            admin/views/jlexthandballnet/view.html.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class JlexthandballnetModel extends SportsManagementListModel' admin/src/Model/JlexthandballnetModel.php
          for method in _loadData _initData getProjectType getProjectteams getCountry; do
            grep -q "function ${method}" admin/src/Model/JlexthandballnetModel.php
          done
          grep -q "quoteName('#__sportsmanagement_league', 'l')" admin/src/Model/JlexthandballnetModel.php
          grep -q "quoteName('#__sportsmanagement_project', 'p')" admin/src/Model/JlexthandballnetModel.php
          grep -q 'getDatabase' admin/src/Model/JlexthandballnetModel.php

          grep -q 'class JlexthandballnetController extends BaseController' admin/src/Controller/JlexthandballnetController.php
          grep -q "class_alias(JlexthandballnetModel::class, 'sportsmanagementModeljlexthandballnet')" admin/models/jlexthandballnet.php
          grep -q "class_alias(JlexthandballnetController::class, 'sportsmanagementControllerjlexthandballnet')" admin/controllers/jlexthandballnet.php
          grep -q '\$this->document->addCustomTag' admin/views/jlexthandballnet/view.html.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|sportsmanagementModeldatabasetool' "${files[@]}"; then
            echo 'handball.net migration regressed to a removed Joomla or legacy MVC/database API' >&2
            exit 1
          fi
