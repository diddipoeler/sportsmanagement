name: Joomla 5/6 administrator XML imports landing model gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  jlxmlimports-landing:
    name: Native XML imports landing model checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate XML imports landing model migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/JlxmlimportsModel.php
            admin/models/jlxmlimports.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class JlxmlimportsModel extends BaseDatabaseModel' admin/src/Model/JlxmlimportsModel.php
          grep -q 'function setDatabase' admin/src/Model/JlxmlimportsModel.php
          grep -q 'sportsmanagementHelper::getDBConnection' admin/src/Model/JlxmlimportsModel.php
          grep -q 'parent::setDatabase' admin/src/Model/JlxmlimportsModel.php
          grep -q "class_alias(JlxmlimportsModel::class, 'sportsmanagementModelJLXMLImports')" admin/models/jlxmlimports.php

          if grep -E -- '->setDbo\(|->getDbo\(|Factory::getDbo\(|Factory::getDBO\(|->input|jimport\(|JLoader::import\(|jexit\(|extends JSMModel|jsmdb|jsmquery' "${files[@]}"; then
            echo 'XML imports landing model regressed to a legacy Joomla/database API' >&2
            exit 1
          fi

          # The singular jlxmlimport model/view is intentionally outside this
          # gate and remains a dedicated import-migration block.
