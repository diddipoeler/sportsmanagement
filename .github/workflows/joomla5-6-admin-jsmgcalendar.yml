name: Joomla 5/6 administrator Google calendar migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  jsmgcalendar:
    name: Native Google calendar model/controller/OAuth checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Google calendar migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/JsmgcalendarModel.php
            admin/src/Model/JsmgcalendarsModel.php
            admin/src/Model/JsmgcalendarimportModel.php
            admin/src/Controller/JsmgcalendarController.php
            admin/src/Controller/JsmgcalendarsController.php
            admin/src/Controller/JsmgcalendarimportController.php
            admin/models/jsmgcalendar.php
            admin/models/jsmgcalendars.php
            admin/models/jsmgcalendarimport.php
            admin/controllers/jsmgcalendar.php
            admin/controllers/jsmgcalendars.php
            admin/controllers/jsmgcalendarimport.php
            admin/views/jsmgcalendar/view.html.php
            admin/views/jsmgcalendars/view.html.php
            admin/views/jsmgcalendarimport/view.html.php
            admin/views/jsmgcalendars/tmpl/default.php
            admin/views/jsmgcalendars/tmpl/default_data.php
            admin/views/jsmgcalendarimport/tmpl/login.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/jsmgcalendar.xml
          test -f admin/tables/jsmgcalendar.php

          grep -q 'class JsmgcalendarModel extends SportsManagementAdminModel' admin/src/Model/JsmgcalendarModel.php
          grep -q 'models/forms' admin/src/Model/JsmgcalendarModel.php
          grep -q "getTable(\$type = 'jsmGCalendar'" admin/src/Model/JsmgcalendarModel.php
          grep -q 'function prepareSportsManagementData' admin/src/Model/JsmgcalendarModel.php
          grep -q 'writeCreateCalendarTemplate' admin/src/Model/JsmgcalendarModel.php
          grep -q 'LOCK_EX' admin/src/Model/JsmgcalendarModel.php

          grep -q 'class JsmgcalendarsModel extends SportsManagementListModel' admin/src/Model/JsmgcalendarsModel.php
          grep -q 'function check_google_api' admin/src/Model/JsmgcalendarsModel.php
          grep -q 'InstallerHelper::downloadPackage' admin/src/Model/JsmgcalendarsModel.php
          grep -q "get('tmp_path'" admin/src/Model/JsmgcalendarsModel.php
          grep -q 'new Archive' admin/src/Model/JsmgcalendarsModel.php
          grep -q 'RecursiveDirectoryIterator' admin/src/Model/JsmgcalendarsModel.php
          grep -q "quoteName('#__sportsmanagement_gcalendar')" admin/src/Model/JsmgcalendarsModel.php
          grep -q 'getAuthorisedViewLevels' admin/src/Model/JsmgcalendarsModel.php

          grep -q 'class JsmgcalendarimportModel extends SportsManagementListModel' admin/src/Model/JsmgcalendarimportModel.php
          grep -q 'OAUTH_STATE_KEY' admin/src/Model/JsmgcalendarimportModel.php
          grep -q 'OAUTH_CONTEXT_KEY' admin/src/Model/JsmgcalendarimportModel.php
          grep -q 'random_bytes' admin/src/Model/JsmgcalendarimportModel.php
          grep -q 'setState' admin/src/Model/JsmgcalendarimportModel.php
          grep -q 'hash_equals' admin/src/Model/JsmgcalendarimportModel.php
          grep -q 'transactionStart' admin/src/Model/JsmgcalendarimportModel.php
          grep -q 'transactionCommit' admin/src/Model/JsmgcalendarimportModel.php
          grep -q 'transactionRollback' admin/src/Model/JsmgcalendarimportModel.php
          grep -q "insertObject('#__sportsmanagement_gcalendar'" admin/src/Model/JsmgcalendarimportModel.php
          grep -q "updateObject('#__sportsmanagement_gcalendar'" admin/src/Model/JsmgcalendarimportModel.php

          grep -q 'class JsmgcalendarController extends SportsManagementFormController' admin/src/Controller/JsmgcalendarController.php
          grep -q 'class JsmgcalendarsController extends SportsManagementAdminController' admin/src/Controller/JsmgcalendarsController.php
          grep -q "getModel(\$name = 'Jsmgcalendar'" admin/src/Controller/JsmgcalendarsController.php
          grep -q 'class JsmgcalendarimportController extends BaseController' admin/src/Controller/JsmgcalendarimportController.php
          grep -q 'function import' admin/src/Controller/JsmgcalendarimportController.php
          grep -q 'checkToken' admin/src/Controller/JsmgcalendarimportController.php
          grep -q 'isOauthCallback' admin/src/Controller/JsmgcalendarimportController.php

          grep -q "class_alias(JsmgcalendarModel::class, 'sportsmanagementModeljsmGCalendar')" admin/models/jsmgcalendar.php
          grep -q "class_alias(JsmgcalendarsModel::class, 'sportsmanagementModeljsmGCalendars')" admin/models/jsmgcalendars.php
          grep -q "class_alias(JsmgcalendarimportModel::class, 'sportsmanagementModeljsmgcalendarImport')" admin/models/jsmgcalendarimport.php
          grep -q "class_alias(JsmgcalendarController::class, 'sportsmanagementControllerjsmgcalendar')" admin/controllers/jsmgcalendar.php
          grep -q "class_alias(JsmgcalendarsController::class, 'sportsmanagementControllerjsmGCalendars')" admin/controllers/jsmgcalendars.php
          grep -q "class_alias(JsmgcalendarimportController::class, 'sportsmanagementControllerjsmgcalendarImport')" admin/controllers/jsmgcalendarimport.php

          grep -q "ComponentHelper::getParams('com_sportsmanagement')" admin/views/jsmgcalendar/view.html.php
          grep -q '\$this->model->check_google_api' admin/views/jsmgcalendars/view.html.php
          grep -q "setLayout('login')" admin/views/jsmgcalendarimport/view.html.php
          grep -q "HTMLHelper::_('form.token')" admin/views/jsmgcalendars/tmpl/default.php
          grep -q "name=\"task\" value=\"jsmgcalendarimport.import\"" admin/views/jsmgcalendarimport/tmpl/login.php
          grep -q "HTMLHelper::_('form.token')" admin/views/jsmgcalendarimport/tmpl/login.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|Joomla\\CMS\\Filesystem|Joomla\\CMS\\Http\\HttpFactory|version_compare\(.*JVERSION|google-api-php-client-2\.4\.0' "${files[@]}"; then
            echo 'Google calendar migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
