name: Joomla 5/6 administrator Kunena field gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/KunenaCategoryListField.php'
      - 'admin/models/fields/kunenacategorylist.php'
      - '.github/workflows/joomla5-6-admin-kunena-field.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/KunenaCategoryListField.php'
      - 'admin/models/fields/kunenacategorylist.php'
      - '.github/workflows/joomla5-6-admin-kunena-field.yml'

jobs:
  kunena-field:
    name: Native Kunena category field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native field and bridge
        shell: bash
        run: |
          set -euo pipefail

          field=admin/src/Field/KunenaCategoryListField.php
          bridge=admin/models/fields/kunenacategorylist.php

          php -l "$field"
          php -l "$bridge"

          grep -q 'final class KunenaCategoryListField extends ListField' "$field"
          grep -q "protected \$type = 'KunenaCategoryList'" "$field"
          grep -q "KunenaForum::installed" "$field"
          grep -q "'kunenaforum.categorylist'" "$field"
          grep -q "KunenaFactory::loadLanguage" "$field"
          grep -q "class_alias(KunenaCategoryListField::class, 'JFormFieldKunenaCategoryList')" "$bridge"

          if grep -E -- 'class JFormFieldKunenaCategoryList extends|JFormFieldList|FormHelper::|JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|JVERSION|version_compare\(|->input' "$field" "$bridge"; then
            echo 'Kunena field regressed to a legacy Joomla field/API implementation' >&2
            exit 1
          fi
