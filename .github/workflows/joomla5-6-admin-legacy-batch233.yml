name: Joomla 5/6 admin legacy batch 233

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/jlextdfbkeyimport/view.html.php'
      - 'admin/views/jlexthandballnet/view.html.php'
      - 'admin/views/jlextprofleagimport/view.html.php'
      - 'admin/views/jlextlmoimports/view.html.php'
      - '.github/workflows/joomla5-6-admin-legacy-batch233.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/jlextdfbkeyimport/view.html.php'
      - 'admin/views/jlexthandballnet/view.html.php'
      - 'admin/views/jlextprofleagimport/view.html.php'
      - 'admin/views/jlextlmoimports/view.html.php'
      - '.github/workflows/joomla5-6-admin-legacy-batch233.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/views/jlextdfbkeyimport/view.html.php
            admin/views/jlexthandballnet/view.html.php
            admin/views/jlextprofleagimport/view.html.php
            admin/views/jlextlmoimports/view.html.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done
      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail
          for file in admin/views/jlextdfbkeyimport/view.html.php admin/views/jlexthandballnet/view.html.php admin/views/jlextprofleagimport/view.html.php; do
            grep -Fq -- 'instanceof HtmlDocument' "$file"
          done
          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/views/jlextlmoimports/view.html.php
          ! grep -Fq -- 'Factory::getApplication()' admin/views/jlextlmoimports/view.html.php
          echo 'Joomla 5/6 batch 233 contracts OK.'
