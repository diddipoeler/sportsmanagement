name: Joomla 5/6 admin legacy batch 318

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/eventtype.php'
      - 'admin/models/matchstaff.php'
      - 'admin/models/smquotestxt.php'
      - 'admin/models/jlextcountry.php'
      - 'admin/models/databasetools.php'
      - 'admin/models/jlxmlimports.php'
      - 'admin/tables/smextxmleditor.php'
      - '.github/workflows/joomla5-6-admin-legacy-batch318.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/eventtype.php'
      - 'admin/models/matchstaff.php'
      - 'admin/models/smquotestxt.php'
      - 'admin/models/jlextcountry.php'
      - 'admin/models/databasetools.php'
      - 'admin/models/jlxmlimports.php'
      - 'admin/tables/smextxmleditor.php'
      - '.github/workflows/joomla5-6-admin-legacy-batch318.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 administrator legacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/eventtype.php
            admin/models/matchstaff.php
            admin/models/smquotestxt.php
            admin/models/jlextcountry.php
            admin/models/databasetools.php
            admin/models/jlxmlimports.php
            admin/tables/smextxmleditor.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
          ! grep -Fq -- '@version    1.0.05' admin/tables/smextxmleditor.php
          grep -Fq -- 'public function __construct' admin/tables/smextxmleditor.php
