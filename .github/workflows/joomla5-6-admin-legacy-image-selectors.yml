name: Joomla 5/6 legacy image selector fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/AgegrouplistField.php'
      - 'admin/src/Field/CountrylistField.php'
      - 'admin/src/Field/LeaguelistField.php'
      - 'admin/src/Field/Playgroundlist2Field.php'
      - 'admin/src/Field/SportstypelistField.php'
      - 'admin/src/Field/SportsManagementDatabaseTrait.php'
      - 'admin/src/Field/SportsManagementListField.php'
      - 'admin/models/fields/agegrouplist.php'
      - 'admin/models/fields/countrylist.php'
      - 'admin/models/fields/leaguelist.php'
      - 'admin/models/fields/playgroundlist2.php'
      - 'admin/models/fields/sportstypelist.php'
      - 'admin/models/forms/filter_teams.xml'
      - 'admin/models/forms/filter_players.xml'
      - 'admin/models/forms/project.xml'
      - '.github/workflows/joomla5-6-admin-legacy-image-selectors.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/AgegrouplistField.php'
      - 'admin/src/Field/CountrylistField.php'
      - 'admin/src/Field/LeaguelistField.php'
      - 'admin/src/Field/Playgroundlist2Field.php'
      - 'admin/src/Field/SportstypelistField.php'
      - 'admin/src/Field/SportsManagementDatabaseTrait.php'
      - 'admin/src/Field/SportsManagementListField.php'
      - 'admin/models/fields/agegrouplist.php'
      - 'admin/models/fields/countrylist.php'
      - 'admin/models/fields/leaguelist.php'
      - 'admin/models/fields/playgroundlist2.php'
      - 'admin/models/fields/sportstypelist.php'
      - 'admin/models/forms/filter_teams.xml'
      - 'admin/models/forms/filter_players.xml'
      - 'admin/models/forms/project.xml'
      - '.github/workflows/joomla5-6-admin-legacy-image-selectors.yml'

jobs:
  legacy-image-selectors:
    name: Migrated image selector checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native selector fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          age=admin/src/Field/AgegrouplistField.php
          age_bridge=admin/models/fields/agegrouplist.php
          country=admin/src/Field/CountrylistField.php
          country_bridge=admin/models/fields/countrylist.php
          league=admin/src/Field/LeaguelistField.php
          league_bridge=admin/models/fields/leaguelist.php
          playground=admin/src/Field/Playgroundlist2Field.php
          playground_bridge=admin/models/fields/playgroundlist2.php
          sports=admin/src/Field/SportstypelistField.php
          sports_bridge=admin/models/fields/sportstypelist.php
          files=(
            "$age" "$age_bridge"
            "$country" "$country_bridge"
            "$league" "$league_bridge"
            "$playground" "$playground_bridge"
            "$sports" "$sports_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class AgegrouplistField extends SportsManagementListField' "$age"
          grep -q '#__sportsmanagement_agegroup' "$age"
          grep -q "' ('" "$age"
          grep -q "this.form.submit();" "$age"
          grep -q "class_alias(AgegrouplistField::class, 'JFormFieldagegrouplist')" "$age_bridge"

          grep -q 'final class CountrylistField extends SportsManagementListField' "$country"
          grep -q '#__sportsmanagement_countries' "$country"
          grep -q "quoteName('alpha3', 'value')" "$country"
          grep -q "'jlextassociations'" "$country"
          grep -q "class_alias(CountrylistField::class, 'JFormFieldcountrylist')" "$country_bridge"

          grep -q 'final class LeaguelistField extends SportsManagementListField' "$league"
          grep -q '#__sportsmanagement_league' "$league"
          grep -q '#__sportsmanagement_project' "$league"
          grep -q '\$input = \$app->getInput();' "$league"
          grep -q "\$view = \$input->getCmd('view'" "$league"
          grep -q "view === 'projects'" "$league"
          grep -q "search_nation" "$league"
          grep -q "class_alias(LeaguelistField::class, 'JFormFieldleaguelist')" "$league_bridge"

          grep -q 'final class Playgroundlist2Field extends SportsManagementListField' "$playground"
          grep -q '#__sportsmanagement_playground' "$playground"
          grep -q "class_alias(Playgroundlist2Field::class, 'JFormFieldplaygroundlist2')" "$playground_bridge"

          grep -q 'final class SportstypelistField extends SportsManagementListField' "$sports"
          grep -q '#__sportsmanagement_sports_type' "$sports"
          grep -q "getInput()->getCmd('view'" "$sports"
          grep -q "view !== 'league'" "$sports"
          grep -q "class_alias(SportstypelistField::class, 'JFormFieldsportstypelist')" "$sports_bridge"

          grep -q 'type="agegrouplist"' admin/models/forms/filter_teams.xml
          grep -q 'type="countrylist"' admin/models/forms/filter_players.xml
          grep -q 'type="sportstypelist"' admin/models/forms/filter_players.xml
          grep -q 'type="leaguelist"' admin/models/forms/project.xml
          grep -q 'type="playgroundlist2"' admin/models/forms/team.xml

          if grep -E -- 'JLoader::|jimport\(|FormHelper::loadFieldClass|Factory::getDbo\(|Factory::getDBO\(|Factory::getLanguage\(|JVERSION|version_compare\(|formbehavior\.chosen|formbehavior2\.select2|JSMCountries|sportsmanagementHelper::getDefaultPlaceholder|class JFormField(agegrouplist|countrylist|leaguelist|playgroundlist2|sportstypelist) extends' "${files[@]}"; then
            echo 'Migrated image selector regressed to a legacy Joomla API, Chosen/Select2 image layer, or duplicated global implementation' >&2
            exit 1
          fi
