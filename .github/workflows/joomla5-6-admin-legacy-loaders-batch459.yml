name: Joomla 5/6 administrator legacy loaders batch 459

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/projectteam.php'
      - 'admin/models/fields/dependsql.php'
      - '.github/workflows/joomla5-6-admin-legacy-loaders-batch459.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/projectteam.php'
      - 'admin/models/fields/dependsql.php'
      - '.github/workflows/joomla5-6-admin-legacy-loaders-batch459.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator legacy loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(admin/models/projectteam.php admin/models/fields/dependsql.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            ! grep -Fq -- 'require_once JPATH_ADMINISTRATOR' "$file"
          done
          grep -Fq -- 'is_file($nativeModel)' admin/models/projectteam.php
          grep -Fq -- 'is_file($nativeField)' admin/models/fields/dependsql.php
