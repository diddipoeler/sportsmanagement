name: Joomla 5/6 administrator legacy model runtime batch 408

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/libraries/sportsmanagement/model.php'
      - '.github/workflows/joomla5-6-admin-legacy-model-runtime-batch408.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/libraries/sportsmanagement/model.php'
      - '.github/workflows/joomla5-6-admin-legacy-model-runtime-batch408.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator legacy model runtime
        shell: bash
        run: |
          set -euo pipefail
          file=admin/libraries/sportsmanagement/model.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'setDatabase($this->jsmdb)' "$file"
          grep -Fq -- '$this->jsmapp->getIdentity()' "$file"
          grep -Fq -- '$this->jsmdb->createQuery()' "$file"
          ! grep -Fq -- 'parent::setDbo(' "$file"
          ! grep -Fq -- 'Factory::getDbo()' "$file"
          ! grep -Fq -- 'Factory::getUser()' "$file"
          ! grep -Fq -- 'Restricted access' "$file"
