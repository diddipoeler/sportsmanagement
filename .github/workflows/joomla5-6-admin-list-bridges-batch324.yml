name: Joomla 5/6 admin list bridges batch 324

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/githubinstall.php'
      - 'admin/models/templates.php'
      - 'admin/models/predictiongames.php'
      - 'admin/models/predictionmembers.php'
      - 'admin/models/predictiontemplates.php'
      - '.github/workflows/joomla5-6-admin-list-bridges-batch324.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/githubinstall.php'
      - 'admin/models/templates.php'
      - 'admin/models/predictiongames.php'
      - 'admin/models/predictionmembers.php'
      - 'admin/models/predictiontemplates.php'
      - '.github/workflows/joomla5-6-admin-list-bridges-batch324.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator list bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/githubinstall.php
            admin/models/templates.php
            admin/models/predictiongames.php
            admin/models/predictionmembers.php
            admin/models/predictiontemplates.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
          ! grep -Fq -- '@version    4.24.00' admin/models/githubinstall.php
          grep -Fq -- "class_alias(GithubinstallModel::class, 'sportsmanagementModelgithubinstall')" admin/models/githubinstall.php
