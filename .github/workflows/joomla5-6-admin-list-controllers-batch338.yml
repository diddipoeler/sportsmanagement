name: Joomla 5/6 admin list controllers batch 338

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/controllers/predictiontemplates.php'
      - 'admin/controllers/rounds.php'
      - 'admin/controllers/seasons.php'
      - 'admin/controllers/clubs.php'
      - 'admin/controllers/leagues.php'
      - '.github/workflows/joomla5-6-admin-list-controllers-batch338.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/controllers/predictiontemplates.php'
      - 'admin/controllers/rounds.php'
      - 'admin/controllers/seasons.php'
      - 'admin/controllers/clubs.php'
      - 'admin/controllers/leagues.php'
      - '.github/workflows/joomla5-6-admin-list-controllers-batch338.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator list controller bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/controllers/predictiontemplates.php
            admin/controllers/rounds.php
            admin/controllers/seasons.php
            admin/controllers/clubs.php
            admin/controllers/leagues.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
            grep -Fq -- 'throw new \\RuntimeException' "$file"
          done
