name: Joomla 5/6 admin list controllers batch 339

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/controllers/matches.php'
      - 'admin/controllers/projects.php'
      - 'admin/controllers/positions.php'
      - 'admin/controllers/divisions.php'
      - 'admin/controllers/eventtypes.php'
      - '.github/workflows/joomla5-6-admin-list-controllers-batch339.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/controllers/matches.php'
      - 'admin/controllers/projects.php'
      - 'admin/controllers/positions.php'
      - 'admin/controllers/divisions.php'
      - 'admin/controllers/eventtypes.php'
      - '.github/workflows/joomla5-6-admin-list-controllers-batch339.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator list controller bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/controllers/matches.php
            admin/controllers/projects.php
            admin/controllers/positions.php
            admin/controllers/divisions.php
            admin/controllers/eventtypes.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
            grep -Fq -- 'throw new \\RuntimeException' "$file"
          done
