name: Joomla 5/6 admin list fields batch 70

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/models/fields/templatelist.php'
      - 'admin/src/Field/TemplatelistField.php'
      - 'admin/src/Field/TeamlistField.php'
      - 'admin/src/Field/PersonlistField.php'
      - 'admin/src/Field/UserlistField.php'
      - '.github/workflows/joomla5-6-admin-list-fields-batch70.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/models/fields/templatelist.php'
      - 'admin/src/Field/TemplatelistField.php'
      - 'admin/src/Field/TeamlistField.php'
      - 'admin/src/Field/PersonlistField.php'
      - 'admin/src/Field/UserlistField.php'
      - '.github/workflows/joomla5-6-admin-list-fields-batch70.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          php -l admin/models/fields/templatelist.php
          php -l admin/src/Field/TemplatelistField.php
          php -l admin/src/Field/TeamlistField.php
          php -l admin/src/Field/PersonlistField.php
          php -l admin/src/Field/UserlistField.php
      - name: Required file metadata
        run: |
          files=(
            admin/models/fields/templatelist.php
            admin/src/Field/TemplatelistField.php
            admin/src/Field/TeamlistField.php
            admin/src/Field/PersonlistField.php
            admin/src/Field/UserlistField.php
          )
          for file in "${files[@]}"; do
            grep -Fq '@version    5.6.0' "$file"
            grep -Fq '@author     diddipoeler' "$file"
            grep -Fq '@copyright  Copyright (C) diddipoeler' "$file"
            grep -Fq '@license    GNU General Public License version 2 or later; see LICENSE.txt' "$file"
            ! grep -Eq '@version[[:space:]]+4\.' "$file"
          done
      - name: Template-list bridge assertions
        run: |
          grep -Fq 'is_file($nativeField)' admin/models/fields/templatelist.php
          grep -Fq "throw new \\RuntimeException('SportsManagement native Templatelist field could not be loaded.', 500);" admin/models/fields/templatelist.php
          grep -Fq "class_alias(TemplatelistField::class, 'JFormFieldtemplatelist');" admin/models/fields/templatelist.php
      - name: Native field assertions
        run: |
          grep -Fq "final class TemplatelistField extends SportsManagementListField" admin/src/Field/TemplatelistField.php
          grep -Fq "#__sportsmanagement_project" admin/src/Field/TemplatelistField.php
          grep -Fq "final class TeamlistField extends SportsManagementListField" admin/src/Field/TeamlistField.php
          grep -Fq "#__sportsmanagement_team" admin/src/Field/TeamlistField.php
          grep -Fq "final class PersonlistField extends SportsManagementListField" admin/src/Field/PersonlistField.php
          grep -Fq "#__sportsmanagement_person" admin/src/Field/PersonlistField.php
          grep -Fq "final class UserlistField extends ListField" admin/src/Field/UserlistField.php
          grep -Fq "DatabaseInterface::class" admin/src/Field/UserlistField.php
