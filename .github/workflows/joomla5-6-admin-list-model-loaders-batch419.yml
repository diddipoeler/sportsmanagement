name: Joomla 5/6 administrator list model loaders batch 419

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/projectreferees.php'
      - 'admin/models/predictiontemplates.php'
      - 'admin/models/seasons.php'
      - 'admin/models/databasetool.php'
      - '.github/workflows/joomla5-6-admin-list-model-loaders-batch419.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/projectreferees.php'
      - 'admin/models/predictiontemplates.php'
      - 'admin/models/seasons.php'
      - 'admin/models/databasetool.php'
      - '.github/workflows/joomla5-6-admin-list-model-loaders-batch419.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator list model loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/projectreferees.php
            admin/models/predictiontemplates.php
            admin/models/seasons.php
            admin/models/databasetool.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'is_file($nativeModel)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
          done
