name: Joomla 5/6 admin listheader contract

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tmpl/listheader/default_debug.php'
      - 'admin/tmpl/listheader/default_4_info_message.php'
      - 'admin/tmpl/listheader/default_data_order.php'
      - 'admin/tmpl/listheader/default_jsm_notes.php'
      - 'admin/tmpl/listheader/default_jsm_tips.php'
      - 'admin/tmpl/listheader/default_jsm_warnings.php'
      - 'admin/views/listheader/tmpl/default_debug.php'
      - 'admin/views/listheader/tmpl/default_4_info_message.php'
      - 'admin/views/listheader/tmpl/default_data_order.php'
      - 'admin/views/listheader/tmpl/default_jsm_notes.php'
      - 'admin/views/listheader/tmpl/default_jsm_tips.php'
      - 'admin/views/listheader/tmpl/default_jsm_warnings.php'
      - '.github/workflows/joomla5-6-admin-listheader-debug-contract.yml'
  pull_request:
    paths:
      - 'admin/tmpl/listheader/default_debug.php'
      - 'admin/tmpl/listheader/default_4_info_message.php'
      - 'admin/tmpl/listheader/default_data_order.php'
      - 'admin/tmpl/listheader/default_jsm_notes.php'
      - 'admin/tmpl/listheader/default_jsm_tips.php'
      - 'admin/tmpl/listheader/default_jsm_warnings.php'
      - 'admin/views/listheader/tmpl/default_debug.php'
      - 'admin/views/listheader/tmpl/default_4_info_message.php'
      - 'admin/views/listheader/tmpl/default_data_order.php'
      - 'admin/views/listheader/tmpl/default_jsm_notes.php'
      - 'admin/views/listheader/tmpl/default_jsm_tips.php'
      - 'admin/views/listheader/tmpl/default_jsm_warnings.php'
      - '.github/workflows/joomla5-6-admin-listheader-debug-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint admin listheader PHP files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            admin/tmpl/listheader/default_debug.php \
            admin/tmpl/listheader/default_4_info_message.php \
            admin/tmpl/listheader/default_data_order.php \
            admin/tmpl/listheader/default_jsm_notes.php \
            admin/tmpl/listheader/default_jsm_tips.php \
            admin/tmpl/listheader/default_jsm_warnings.php \
            admin/views/listheader/tmpl/default_debug.php \
            admin/views/listheader/tmpl/default_4_info_message.php \
            admin/views/listheader/tmpl/default_data_order.php \
            admin/views/listheader/tmpl/default_jsm_notes.php \
            admin/views/listheader/tmpl/default_jsm_tips.php \
            admin/views/listheader/tmpl/default_jsm_warnings.php; do
            php -l "$file"
          done

      - name: Validate admin listheader migration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          native_dir = Path('admin/tmpl/listheader')
          bridge_dir = Path('admin/views/listheader/tmpl')
          names = (
              'default_debug.php',
              'default_4_info_message.php',
              'default_data_order.php',
              'default_jsm_notes.php',
              'default_jsm_tips.php',
              'default_jsm_warnings.php',
          )
          native_files = [native_dir / name for name in names]
          bridge_files = [bridge_dir / name for name in names]

          for file in native_files + bridge_files:
              content = file.read_text(encoding='utf-8')
              for tag in ('@version', '@author', '@copyright', '@license'):
                  if tag not in content:
                      raise SystemExit(f'{file}: required metadata missing: {tag}')
              if "\\defined('_JEXEC') or die;" not in content:
                  raise SystemExit(f'{file}: Joomla 5/6 guard missing')

          forbidden = (
              'version_compare(JVERSION',
              'version_compare(substr(JVERSION',
              "HTMLHelper::_('sliders.",
              "HTMLHelper::_('bootstrap.startAccordion'",
              "HTMLHelper::_('bootstrap.addSlide'",
              "die('Restricted access')",
          )
          for file in native_files + bridge_files:
              content = file.read_text(encoding='utf-8')
              for legacy in forbidden:
                  if legacy in content:
                      raise SystemExit(f'{file}: Joomla 3/4 presentation dependency remains: {legacy}')

          debug_content = (native_dir / 'default_debug.php').read_text(encoding='utf-8')
          for needle in (
              'sportsmanagementHelper::$_success_text',
              '<details',
              'htmlspecialchars(',
          ):
              if needle not in debug_content:
                  raise SystemExit(f'Admin listheader debug transitional contract missing: {needle}')

          presentation_markers = {
              'default_4_info_message.php': (
                  '$this->jsmmessage',
                  'alert alert-success',
                  'role="alert"',
              ),
              'default_data_order.php': (
                  '$this->pagination->orderUpIcon(',
                  '$this->pagination->orderDownIcon(',
                  'sortable-handler',
                  'fas fa-ellipsis-v',
              ),
              'default_jsm_notes.php': (
                  '$this->notes',
                  'fas fa-edit fa-2x fa-pull-left',
                  'COM_SPORTSMANAGEMENT_GLOBAL_NOTE',
              ),
              'default_jsm_tips.php': (
                  '$this->tips',
                  'fas fa-quote-right fa-2x fa-pull-left',
                  'COM_SPORTSMANAGEMENT_GLOBAL_TIP',
              ),
              'default_jsm_warnings.php': (
                  '$this->warnings',
                  'fas fa-exclamation-triangle fa-2x fa-pull-left',
                  'COM_SPORTSMANAGEMENT_GLOBAL_WARNING',
              ),
          }
          for name, needles in presentation_markers.items():
              content = (native_dir / name).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f'{name}: native listheader presentation contract missing: {needle}')

          for name in names:
              bridge = bridge_dir / name
              target = (
                  "require JPATH_ADMINISTRATOR . '/components/com_sportsmanagement/tmpl/listheader/"
                  + name
                  + "';"
              )
              content = bridge.read_text(encoding='utf-8')
              if target not in content:
                  raise SystemExit(f'{bridge}: compatibility bridge target missing')
              if 'sportsmanagementHelper::$_success_text' in content:
                  raise SystemExit(f'{bridge}: legacy debug implementation remains in bridge')

          print('Joomla 5/6 admin listheader contract OK')
          PY
