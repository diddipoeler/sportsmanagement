name: Joomla 5/6 core masterdata tables gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/src/Table/SportsManagementTable.php'
      - 'admin/src/Table/TeamTable.php'
      - 'admin/src/Table/ClubTable.php'
      - 'admin/src/Table/LeagueTable.php'
      - 'admin/src/Table/SeasonTable.php'
      - 'admin/tables/team.php'
      - 'admin/tables/club.php'
      - 'admin/tables/league.php'
      - 'admin/tables/season.php'
      - '.github/workflows/joomla5-6-admin-masterdata-tables.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/src/Table/SportsManagementTable.php'
      - 'admin/src/Table/TeamTable.php'
      - 'admin/src/Table/ClubTable.php'
      - 'admin/src/Table/LeagueTable.php'
      - 'admin/src/Table/SeasonTable.php'
      - 'admin/tables/team.php'
      - 'admin/tables/club.php'
      - 'admin/tables/league.php'
      - 'admin/tables/season.php'
      - '.github/workflows/joomla5-6-admin-masterdata-tables.yml'

jobs:
  masterdata-tables:
    name: Native core masterdata table checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native tables and legacy bridges
        shell: bash
        run: |
          set -euo pipefail

          resolver=admin/src/Helper/SportsManagementDatabaseResolver.php
          base=admin/src/Table/SportsManagementTable.php
          team=admin/src/Table/TeamTable.php
          club=admin/src/Table/ClubTable.php
          league=admin/src/Table/LeagueTable.php
          season=admin/src/Table/SeasonTable.php
          team_bridge=admin/tables/team.php
          club_bridge=admin/tables/club.php
          league_bridge=admin/tables/league.php
          season_bridge=admin/tables/season.php
          files=(
            "$resolver" "$base"
            "$team" "$club" "$league" "$season"
            "$team_bridge" "$club_bridge" "$league_bridge" "$season_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class SportsManagementDatabaseResolver' "$resolver"
          grep -q 'getQuery(true)' "$resolver"
          grep -q 'abstract class SportsManagementTable extends Table' "$base"
          grep -q 'SportsManagementDatabaseResolver' "$base"

          grep -q 'final class TeamTable extends SportsManagementTable' "$team"
          grep -q "#__sportsmanagement_team" "$team"
          grep -q 'COM_SPORTSMANAGEMENT_GLOBAL_NAME_REQUIRED' "$team"
          grep -q 'middle_name' "$team"
          grep -q 'short_name' "$team"
          grep -q 'OutputFilter::stringURLSafe' "$team"

          grep -q 'class ClubTable extends SportsManagementTable' "$club"
          grep -q "#__sportsmanagement_club" "$club"
          grep -q 'OutputFilter::stringURLSafe' "$club"

          grep -q 'final class LeagueTable extends SportsManagementTable' "$league"
          grep -q "#__sportsmanagement_league" "$league"
          grep -q 'OutputFilter::stringURLSafe' "$league"

          grep -q 'final class SeasonTable extends SportsManagementTable' "$season"
          grep -q "#__sportsmanagement_season" "$season"
          grep -q 'aliasSource' "$season"
          grep -q 'OutputFilter::stringURLSafe' "$season"

          grep -q "class_alias(TeamTable::class, 'sportsmanagementTableTeam')" "$team_bridge"
          grep -q '/src/Table/TeamTable.php' "$team_bridge"
          grep -q "class_alias(ClubTable::class, 'sportsmanagementTableClub')" "$club_bridge"
          grep -q '/src/Table/ClubTable.php' "$club_bridge"
          grep -q "class_alias(LeagueTable::class, 'sportsmanagementTableLeague')" "$league_bridge"
          grep -q '/src/Table/LeagueTable.php' "$league_bridge"
          grep -q "class_alias(SeasonTable::class, 'sportsmanagementTableSeason')" "$season_bridge"
          grep -q '/src/Table/SeasonTable.php' "$season_bridge"

          if grep -E -- 'extends JSMTable|sportsmanagementHelper::|getDBConnection\(|Factory::getDbo\(|Factory::getDBO\(|JDatabaseDriver::|JDatabase::|JLoader::|jimport\(|Table::getInstance\(|createQuery\(' "${files[@]}"; then
            echo 'Core masterdata tables regressed to a legacy database/table API or Joomla 6-only query API' >&2
            exit 1
          fi
