name: Joomla 5/6 administrator match and league ID validation

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/MatchModel.php'
      - 'admin/src/Model/LeagueModel.php'
      - '.github/tests/joomla56_admin_match_league_selection_ids.php'
      - '.github/workflows/joomla5-6-admin-match-league-ids.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selected-ids:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint native models and regression test
        run: |
          php -l admin/src/Model/MatchModel.php
          php -l admin/src/Model/LeagueModel.php
          php -l .github/tests/joomla56_admin_match_league_selection_ids.php
      - name: Reject destructive malformed match and league IDs
        run: php .github/tests/joomla56_admin_match_league_selection_ids.php
