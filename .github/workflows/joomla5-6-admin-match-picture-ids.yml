name: Joomla 5/6 administrator match media ID safety

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/MatchesModel.php'
      - '.github/tests/joomla56_admin_match_picture_ids.php'
      - '.github/workflows/joomla5-6-admin-match-picture-ids.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match-media:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint Matches model and media ID test
        run: |
          php -l admin/src/Model/MatchesModel.php
          php -l .github/tests/joomla56_admin_match_picture_ids.php
      - name: Reject malformed match-media identifiers
        run: php .github/tests/joomla56_admin_match_picture_ids.php
