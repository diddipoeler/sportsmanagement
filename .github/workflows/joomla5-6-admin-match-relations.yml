name: Joomla 5/6 administrator match relation migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  match-relations:
    name: Native match relation form model checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate match relation model migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/MatcheventModel.php
            admin/src/Model/MatchplayerModel.php
            admin/src/Model/MatchrefereeModel.php
            admin/src/Model/MatchstaffModel.php
            admin/models/matchevent.php
            admin/models/matchplayer.php
            admin/models/matchreferee.php
            admin/models/matchstaff.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          declare -a pairs=(
            'MatcheventModel|matchevent|sportsmanagementModelmatchevent'
            'MatchplayerModel|matchplayer|sportsmanagementModelmatchplayer'
            'MatchrefereeModel|matchreferee|sportsmanagementModelmatchreferee'
            'MatchstaffModel|matchstaff|sportsmanagementModelmatchstaff'
          )

          for pair in "${pairs[@]}"; do
            IFS='|' read -r class legacy alias <<< "$pair"
            native="admin/src/Model/${class}.php"
            bridge="admin/models/${legacy}.php"

            grep -q "class ${class} extends SportsManagementAdminModel" "$native"
            grep -q 'models/forms' "$native"
            grep -q 'function getScript' "$native"
            grep -q 'function saveorder' "$native"
            grep -q 'function getTable' "$native"
            grep -q 'function allowEdit' "$native"
            grep -q "\$config\['dbo'\] = \$this->getDatabase()" "$native"
            grep -q "class_alias(${class}::class, '${alias}')" "$bridge"
          done

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|sportsmanagementModeldatabasetool' "${files[@]}"; then
            echo 'Match relation migration regressed to a removed Joomla or legacy MVC/database API' >&2
            exit 1
          fi
