name: Joomla 5/6 administrator match write input integrity

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Service/MatchWriteService.php'
      - '.github/tests/joomla56_admin_match_statistics_input_integrity.php'
      - '.github/tests/joomla56_admin_match_lineup_input_integrity.php'
      - '.github/workflows/joomla5-6-admin-match-statistics-input-integrity.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Service/MatchWriteService.php'
      - '.github/tests/joomla56_admin_match_statistics_input_integrity.php'
      - '.github/tests/joomla56_admin_match_lineup_input_integrity.php'
      - '.github/workflows/joomla5-6-admin-match-statistics-input-integrity.yml'

permissions:
  contents: read

jobs:
  validate-statistics:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate syntax and required PHPDoc metadata
        run: |
          set -euo pipefail
          php -l admin/src/Service/MatchWriteService.php
          php -l .github/tests/joomla56_admin_match_statistics_input_integrity.php
          php -l .github/tests/joomla56_admin_match_lineup_input_integrity.php
          php .github/tests/phpdoc_metadata.php admin/src/Service/MatchWriteService.php .github/tests/joomla56_admin_match_statistics_input_integrity.php .github/tests/joomla56_admin_match_lineup_input_integrity.php
      - name: Exercise valid and forged match statistic form submissions
        run: php .github/tests/joomla56_admin_match_statistics_input_integrity.php
      - name: Reject forged lineup and referee assignments
        run: php .github/tests/joomla56_admin_match_lineup_input_integrity.php
