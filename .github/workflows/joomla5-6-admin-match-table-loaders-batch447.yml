name: Joomla 5/6 administrator match table loaders batch 447

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tables/matchcommentary.php'
      - 'admin/tables/matchreferee.php'
      - 'admin/tables/matchstaffstatistic.php'
      - 'admin/tables/matchstatistic.php'
      - '.github/workflows/joomla5-6-admin-match-table-loaders-batch447.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/tables/matchcommentary.php'
      - 'admin/tables/matchreferee.php'
      - 'admin/tables/matchstaffstatistic.php'
      - 'admin/tables/matchstatistic.php'
      - '.github/workflows/joomla5-6-admin-match-table-loaders-batch447.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator match table loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(admin/tables/matchcommentary.php admin/tables/matchreferee.php admin/tables/matchstaffstatistic.php admin/tables/matchstatistic.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do grep -Fq -- "$tag" "$file"; done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'is_file($nativeTable)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
            ! grep -Fq -- 'require_once JPATH_ADMINISTRATOR' "$file"
          done
