name: Joomla 5/6 admin matches controller

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-matches-controller:
    name: Native administrator matches controller gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native matches controller
        shell: bash
        run: |
          set -euo pipefail
          controller=admin/src/Controller/MatchesController.php
          bridge=admin/controllers/matches.php
          write=admin/src/Service/MatchWriteService.php
          timeline=admin/src/Service/MatchTimelineWriteService.php
          notifier=admin/src/Service/MatchRefereeNotificationService.php

          for file in "$controller" "$bridge" "$write" "$timeline" "$notifier"; do
            php -l "$file"
          done

          grep -q 'final class MatchesController extends SportsManagementAdminController' "$controller"
          grep -q 'MatchWriteService' "$controller"
          grep -q 'MatchTimelineWriteService' "$controller"
          grep -q 'MatchRefereeNotificationService' "$controller"
          grep -q 'saveStatistics' "$controller"
          grep -q 'updateRoster' "$controller"
          grep -q 'updateStaff' "$controller"
          grep -q 'updateReferees' "$controller"
          grep -q 'saveEvent' "$controller"
          grep -q 'saveComment' "$controller"
          grep -q 'saveSubstitution' "$controller"
          grep -q 'deleteEvent' "$controller"
          grep -q 'deleteCommentary' "$controller"
          grep -q 'removeSubstitution' "$controller"
          grep -q '#__sportsmanagement_project_position' "$controller"
          grep -q '#__sportsmanagement_match' "$controller"
          grep -q 'legacyMatchModel()->saveshort' "$controller"
          grep -q 'class_alias(MatchesController::class' "$bridge"

          if grep -E -- 'Factory::getApplication\(\)->input|Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|BaseDatabaseModel::getInstance|JLoader::import\(|jimport\(|->disconnect\(|\$this->getModel\(' "$controller"; then
            echo 'Native administrator matches controller regressed to legacy Joomla MVC/database bootstrapping' >&2
            exit 1
          fi

          if grep -E -- 'class sportsmanagementControllermatches|Factory::|BaseDatabaseModel|JSMControllerAdmin' "$bridge"; then
            echo 'Legacy administrator matches controller bridge is no longer passive' >&2
            exit 1
          fi
