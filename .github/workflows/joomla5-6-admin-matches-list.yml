name: Joomla 5/6 administrator matches list migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  matches-list:
    name: Native matches list checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate matches list migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/MatchesModel.php
            admin/models/matches.php
            admin/views/matches/view.html.php
            admin/views/matches/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class MatchesModel extends SportsManagementListModel' admin/src/Model/MatchesModel.php
          for method in prepareItems checkMatchPicturePath getMatchesCount getMatchesByRound getProject getRound getRounds getProjectTeamOptions getDivisionOptions getPlaygroundOptions getMatchTableColumns getContextParams
          do
            grep -q "function ${method}" admin/src/Model/MatchesModel.php
          done
          grep -q 'countRosterRows' admin/src/Model/MatchesModel.php
          grep -q '#__sportsmanagement_match_player' admin/src/Model/MatchesModel.php
          grep -q '#__sportsmanagement_match_staff' admin/src/Model/MatchesModel.php
          grep -q '#__sportsmanagement_match_referee' admin/src/Model/MatchesModel.php
          grep -q '#__sportsmanagement_project_team' admin/src/Model/MatchesModel.php
          grep -q '\$orderMap\[\$ordering\]' admin/src/Model/MatchesModel.php

          grep -q "class_alias(MatchesModel::class, 'sportsmanagementModelMatches')" admin/models/matches.php

          grep -q '\$this->model->getProject' admin/views/matches/view.html.php
          grep -q '\$this->model->getRound' admin/views/matches/view.html.php
          grep -q '\$this->model->getProjectTeamOptions' admin/views/matches/view.html.php
          grep -q '\$this->model->getDivisionOptions' admin/views/matches/view.html.php
          grep -q '\$this->model->getPlaygroundOptions' admin/views/matches/view.html.php
          grep -q '\$this->model->prepareItems' admin/views/matches/view.html.php
          grep -q '\$this->app->getIdentity()' admin/views/matches/view.html.php
          grep -q '\$this->app->getInput()' admin/views/matches/tmpl/default.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|JVERSION|version_compare\(|JEventDispatcher|SqueezeBox|Joomla\\CMS\\Filesystem\\Folder' "${files[@]}"; then
            echo 'Matches list migration regressed to a removed/deprecated legacy API' >&2
            exit 1
          fi
