name: Joomla 5/6 miscellaneous administrator fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/Categorylistk2Field.php'
      - 'admin/src/Field/ColorField.php'
      - 'admin/src/Field/CustomcalendarField.php'
      - 'admin/src/Field/DatetimechooserField.php'
      - 'admin/src/Field/LanguagecharacterField.php'
      - 'admin/src/Field/PagetitleformatField.php'
      - 'admin/src/Field/Textarea2Field.php'
      - 'admin/models/fields/categorylistk2.php'
      - 'admin/models/fields/color.php'
      - 'admin/models/fields/customcalendar.php'
      - 'admin/models/fields/datetimechooser.php'
      - 'admin/models/fields/languagecharacter.php'
      - 'admin/models/fields/pagetitleformat.php'
      - 'admin/models/fields/textarea2.php'
      - '.github/workflows/joomla5-6-admin-misc-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/Categorylistk2Field.php'
      - 'admin/src/Field/ColorField.php'
      - 'admin/src/Field/CustomcalendarField.php'
      - 'admin/src/Field/DatetimechooserField.php'
      - 'admin/src/Field/LanguagecharacterField.php'
      - 'admin/src/Field/PagetitleformatField.php'
      - 'admin/src/Field/Textarea2Field.php'
      - 'admin/models/fields/categorylistk2.php'
      - 'admin/models/fields/color.php'
      - 'admin/models/fields/customcalendar.php'
      - 'admin/models/fields/datetimechooser.php'
      - 'admin/models/fields/languagecharacter.php'
      - 'admin/models/fields/pagetitleformat.php'
      - 'admin/models/fields/textarea2.php'
      - '.github/workflows/joomla5-6-admin-misc-fields.yml'

jobs:
  misc-fields:
    name: Miscellaneous administrator field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          k2=admin/src/Field/Categorylistk2Field.php
          k2_bridge=admin/models/fields/categorylistk2.php
          color=admin/src/Field/ColorField.php
          color_bridge=admin/models/fields/color.php
          calendar=admin/src/Field/CustomcalendarField.php
          calendar_bridge=admin/models/fields/customcalendar.php
          datetime=admin/src/Field/DatetimechooserField.php
          datetime_bridge=admin/models/fields/datetimechooser.php
          language=admin/src/Field/LanguagecharacterField.php
          language_bridge=admin/models/fields/languagecharacter.php
          pagetitle=admin/src/Field/PagetitleformatField.php
          pagetitle_bridge=admin/models/fields/pagetitleformat.php
          textarea=admin/src/Field/Textarea2Field.php
          textarea_bridge=admin/models/fields/textarea2.php
          files=(
            "$k2" "$k2_bridge"
            "$color" "$color_bridge"
            "$calendar" "$calendar_bridge"
            "$datetime" "$datetime_bridge"
            "$language" "$language_bridge"
            "$pagetitle" "$pagetitle_bridge"
            "$textarea" "$textarea_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class Categorylistk2Field extends ListField' "$k2"
          grep -q '#__k2_categories' "$k2"
          grep -q 'DatabaseInterface::class' "$k2"
          grep -q "class_alias(Categorylistk2Field::class, 'JFormFieldcategorylistk2')" "$k2_bridge"

          grep -q 'final class ColorField extends JoomlaColorField' "$color"
          grep -q 'Joomla\\CMS\\Form\\Field\\ColorField' "$color"
          grep -q "class_alias(ColorField::class, 'JFormFieldColor')" "$color_bridge"

          grep -q 'final class CustomcalendarField extends CalendarField' "$calendar"
          grep -q 'Joomla\\CMS\\Date\\Date' "$calendar"
          grep -q "'0000-00-00'" "$calendar"
          grep -q "'00-00-0000'" "$calendar"
          grep -q "HTMLHelper::_('calendar'" "$calendar"
          grep -q "class_alias(CustomcalendarField::class, 'JFormFieldCustomCalendar')" "$calendar_bridge"

          grep -q 'final class DatetimechooserField extends FormField' "$datetime"
          grep -q 'getConfig()' "$datetime"
          grep -q 'getIdentity()' "$datetime"
          grep -q "'SERVER_UTC'" "$datetime"
          grep -q "'USER_UTC'" "$datetime"
          grep -q "'+1 HOUR'" "$datetime"
          grep -q "'+2 MONTH'" "$datetime"
          grep -q "class_alias(DatetimechooserField::class, 'JFormFieldDatetimechooser')" "$datetime_bridge"

          grep -q 'final class LanguagecharacterField extends ListField' "$language"
          grep -q 'getApplication()->getLanguage()' "$language"
          grep -q "'ru-RU'" "$language"
          grep -q "'el-GR'" "$language"
          grep -q 'html_entity_decode' "$language"
          grep -q "class_alias(LanguagecharacterField::class, 'JFormFieldlanguagecharacter')" "$language_bridge"

          grep -q 'final class PagetitleformatField extends ListField' "$pagetitle"
          grep -q 'getApplication()->getLanguage()' "$pagetitle"
          grep -q 'COM_SPORTSMANAGEMENT_FES_PARAM_PAGE_TITLE_NONE' "$pagetitle"
          grep -q "class_alias(PagetitleformatField::class, 'JFormFieldPageTitleFormat')" "$pagetitle_bridge"

          grep -q 'final class Textarea2Field extends TextareaField' "$textarea"
          grep -q 'form-text' "$textarea"
          grep -q "class_alias(Textarea2Field::class, 'JFormFieldTextarea2')" "$textarea_bridge"

          for forbidden in JLoader jimport com_gcalendar jscolor JFormHelper JPath 'Factory::getConfig' 'Factory::getUser' 'Factory::getLanguage' '->input'; do
            if grep -F -- "$forbidden" "${files[@]}"; then
              echo "Miscellaneous administrator field contains forbidden legacy token: $forbidden" >&2
              exit 1
            fi
          done
