name: Joomla 5/6 admin model factories

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/AgegroupModel.php'
      - 'admin/src/Model/CpanelModel.php'
      - 'admin/models/agegroup.php'
      - 'admin/models/cpanel.php'
      - '.github/workflows/joomla5-6-admin-model-factories.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/AgegroupModel.php'
      - 'admin/src/Model/CpanelModel.php'
      - 'admin/models/agegroup.php'
      - 'admin/models/cpanel.php'
      - '.github/workflows/joomla5-6-admin-model-factories.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint admin model slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/AgegroupModel.php
            admin/src/Model/CpanelModel.php
            admin/models/agegroup.php
            admin/models/cpanel.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate Joomla 5/6 model contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq '$this->getMVCFactory()' admin/src/Model/AgegroupModel.php
          grep -Fq "createModel(" admin/src/Model/AgegroupModel.php
          grep -Fq "'Databasetool'" admin/src/Model/AgegroupModel.php
          grep -Fq "'Cpanel'" admin/src/Model/AgegroupModel.php
          grep -Fq "'Administrator'" admin/src/Model/AgegroupModel.php

          grep -Fq 'use Joomla\Http\HttpFactory;' admin/src/Model/CpanelModel.php
          grep -Fq '(new HttpFactory())->getHttp()' admin/src/Model/CpanelModel.php
          grep -Fq 'getStatusCode()' admin/src/Model/CpanelModel.php
          grep -Fq 'getBody()' admin/src/Model/CpanelModel.php

          grep -Fq 'extends AgegroupModel' admin/models/agegroup.php
          grep -Fq "class_alias(CpanelModel::class, 'sportsmanagementModelcpanel')" admin/models/cpanel.php

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Joomla\\CMS\\Http\\|Table::getInstance\('
          if grep -ER "$legacy_re" \
            admin/src/Model/AgegroupModel.php \
            admin/src/Model/CpanelModel.php \
            admin/models/agegroup.php \
            admin/models/cpanel.php; then
            echo 'Admin model slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
