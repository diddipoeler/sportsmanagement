name: Joomla 5/6 admin models batch 315

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/team.php'
      - 'admin/models/template.php'
      - 'admin/models/position.php'
      - 'admin/models/statistic.php'
      - 'admin/models/sportstype.php'
      - '.github/workflows/joomla5-6-admin-models-batch315.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/team.php'
      - 'admin/models/template.php'
      - 'admin/models/position.php'
      - 'admin/models/statistic.php'
      - 'admin/models/sportstype.php'
      - '.github/workflows/joomla5-6-admin-models-batch315.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 administrator model bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/team.php
            admin/models/template.php
            admin/models/position.php
            admin/models/statistic.php
            admin/models/sportstype.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
