name: Joomla 5/6 admin modules cleanup batch 321

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/matchevent.php'
      - 'admin/models/projectreferees.php'
      - 'admin/models/positions.php'
      - 'modules/mod_sportsmanagement_clubicons/tmpl/default2.php'
      - '.github/workflows/joomla5-6-admin-modules-batch321.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/matchevent.php'
      - 'admin/models/projectreferees.php'
      - 'admin/models/positions.php'
      - 'modules/mod_sportsmanagement_clubicons/tmpl/default2.php'
      - '.github/workflows/joomla5-6-admin-modules-batch321.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 admin and module cleanup
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/matchevent.php
            admin/models/projectreferees.php
            admin/models/positions.php
            modules/mod_sportsmanagement_clubicons/tmpl/default2.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done
          for file in admin/models/matchevent.php admin/models/projectreferees.php admin/models/positions.php; do
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
          grep -Fq -- "require __DIR__ . '/default.php';" modules/mod_sportsmanagement_clubicons/tmpl/default2.php
