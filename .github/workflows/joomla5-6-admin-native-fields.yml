name: Joomla 5/6 native administrator fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/**'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/models/fields/acteventtype.php'
      - 'admin/models/fields/actseason.php'
      - 'admin/models/fields/associationslist.php'
      - 'admin/models/fields/clublist.php'
      - 'admin/models/fields/clubs.php'
      - 'admin/models/fields/country.php'
      - 'admin/models/fields/currentround.php'
      - 'admin/models/fields/eventtypelist.php'
      - 'admin/models/fields/federationslist.php'
      - 'admin/models/fields/gcalendar.php'
      - 'admin/models/fields/leaguelevel.php'
      - 'admin/models/fields/matchdaylist.php'
      - 'admin/models/fields/personlist.php'
      - 'admin/models/fields/playgroundlist.php'
      - 'admin/models/fields/playgrounds.php'
      - 'admin/models/fields/positionlist.php'
      - 'admin/models/fields/projectdivisionlist.php'
      - 'admin/models/fields/projectlist.php'
      - 'admin/models/fields/projectrounds.php'
      - 'admin/models/fields/statstypelist.php'
      - 'admin/models/fields/teamlist.php'
      - 'admin/models/fields/teams.php'
      - 'admin/models/fields/templatelist.php'
      - 'admin/models/fields/userlist.php'
      - '.github/workflows/joomla5-6-admin-native-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/**'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/models/fields/acteventtype.php'
      - 'admin/models/fields/actseason.php'
      - 'admin/models/fields/associationslist.php'
      - 'admin/models/fields/clublist.php'
      - 'admin/models/fields/clubs.php'
      - 'admin/models/fields/country.php'
      - 'admin/models/fields/currentround.php'
      - 'admin/models/fields/eventtypelist.php'
      - 'admin/models/fields/federationslist.php'
      - 'admin/models/fields/gcalendar.php'
      - 'admin/models/fields/leaguelevel.php'
      - 'admin/models/fields/matchdaylist.php'
      - 'admin/models/fields/personlist.php'
      - 'admin/models/fields/playgroundlist.php'
      - 'admin/models/fields/playgrounds.php'
      - 'admin/models/fields/positionlist.php'
      - 'admin/models/fields/projectdivisionlist.php'
      - 'admin/models/fields/projectlist.php'
      - 'admin/models/fields/projectrounds.php'
      - 'admin/models/fields/statstypelist.php'
      - 'admin/models/fields/teamlist.php'
      - 'admin/models/fields/teams.php'
      - 'admin/models/fields/templatelist.php'
      - 'admin/models/fields/userlist.php'
      - '.github/workflows/joomla5-6-admin-native-fields.yml'

jobs:
  native-fields:
    name: Native administrator field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native fields
        shell: bash
        run: |
          set -euo pipefail

          trait=admin/src/Field/SportsManagementDatabaseTrait.php
          resolver=admin/src/Helper/SportsManagementDatabaseResolver.php
          base=admin/src/Field/SportsManagementListField.php
          acteventtype=admin/src/Field/ActeventtypeField.php
          acteventtype_bridge=admin/models/fields/acteventtype.php
          actseason=admin/src/Field/ActseasonField.php
          actseason_bridge=admin/models/fields/actseason.php
          associationslist=admin/src/Field/AssociationslistField.php
          associationslist_bridge=admin/models/fields/associationslist.php
          clublist=admin/src/Field/ClublistField.php
          clublist_bridge=admin/models/fields/clublist.php
          clubs=admin/src/Field/ClubsField.php
          clubs_bridge=admin/models/fields/clubs.php
          country=admin/src/Field/CountryField.php
          country_bridge=admin/models/fields/country.php
          currentround=admin/src/Field/CurrentroundField.php
          currentround_bridge=admin/models/fields/currentround.php
          eventtypelist=admin/src/Field/EventtypelistField.php
          eventtypelist_bridge=admin/models/fields/eventtypelist.php
          federationslist=admin/src/Field/FederationslistField.php
          federationslist_bridge=admin/models/fields/federationslist.php
          gcalendar=admin/src/Field/GcalendarField.php
          gcalendar_bridge=admin/models/fields/gcalendar.php
          leaguelevel=admin/src/Field/LeaguelevelField.php
          leaguelevel_bridge=admin/models/fields/leaguelevel.php
          matchdaylist=admin/src/Field/MatchdaylistField.php
          matchdaylist_bridge=admin/models/fields/matchdaylist.php
          personlist=admin/src/Field/PersonlistField.php
          personlist_bridge=admin/models/fields/personlist.php
          playgroundlist=admin/src/Field/PlaygroundlistField.php
          playgroundlist_bridge=admin/models/fields/playgroundlist.php
          playgrounds=admin/src/Field/PlaygroundsField.php
          playgrounds_bridge=admin/models/fields/playgrounds.php
          positionlist=admin/src/Field/PositionlistField.php
          positionlist_bridge=admin/models/fields/positionlist.php
          projectdivision=admin/src/Field/ProjectdivisionField.php
          projectdivision_bridge=admin/models/fields/projectdivisionlist.php
          projectlist=admin/src/Field/ProjectlistField.php
          projectlist_bridge=admin/models/fields/projectlist.php
          projectrounds=admin/src/Field/ProjectroundsField.php
          projectrounds_bridge=admin/models/fields/projectrounds.php
          statstypelist=admin/src/Field/StatstypelistField.php
          statstypelist_bridge=admin/models/fields/statstypelist.php
          teamlist=admin/src/Field/TeamlistField.php
          teamlist_bridge=admin/models/fields/teamlist.php
          teams=admin/src/Field/TeamsField.php
          teams_bridge=admin/models/fields/teams.php
          templatelist=admin/src/Field/TemplatelistField.php
          templatelist_bridge=admin/models/fields/templatelist.php
          userlist=admin/src/Field/UserlistField.php
          userlist_bridge=admin/models/fields/userlist.php
          files=(
            "$trait" "$resolver" "$base"
            "$acteventtype" "$acteventtype_bridge"
            "$actseason" "$actseason_bridge"
            "$associationslist" "$associationslist_bridge"
            "$clublist" "$clublist_bridge"
            "$clubs" "$clubs_bridge"
            "$country" "$country_bridge"
            "$currentround" "$currentround_bridge"
            "$eventtypelist" "$eventtypelist_bridge"
            "$federationslist" "$federationslist_bridge"
            "$gcalendar" "$gcalendar_bridge"
            "$leaguelevel" "$leaguelevel_bridge"
            "$matchdaylist" "$matchdaylist_bridge"
            "$personlist" "$personlist_bridge"
            "$playgroundlist" "$playgroundlist_bridge"
            "$playgrounds" "$playgrounds_bridge"
            "$positionlist" "$positionlist_bridge"
            "$projectdivision" "$projectdivision_bridge"
            "$projectlist" "$projectlist_bridge"
            "$projectrounds" "$projectrounds_bridge"
            "$statstypelist" "$statstypelist_bridge"
            "$teamlist" "$teamlist_bridge"
            "$teams" "$teams_bridge"
            "$templatelist" "$templatelist_bridge"
            "$userlist" "$userlist_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'trait SportsManagementDatabaseTrait' "$trait"
          grep -q 'SportsManagementDatabaseResolver' "$trait"
          grep -q 'DatabaseInterface' "$trait"
          grep -q 'new SportsManagementDatabaseResolver' "$trait"
          grep -q 'instanceof DatabaseInterface' "$trait"

          grep -q 'final class SportsManagementDatabaseResolver' "$resolver"
          grep -q 'Joomla\\Database\\DatabaseFactory' "$resolver"
          grep -q 'Joomla\\Database\\DatabaseInterface' "$resolver"
          grep -q 'Factory::getContainer()->get(DatabaseInterface::class)' "$resolver"
          grep -q 'new DatabaseFactory' "$resolver"
          grep -q 'getDriver' "$resolver"
          grep -q 'getQuery(true)' "$resolver"
          grep -q '#__user_profiles' "$resolver"
          grep -q 'jsmprofile.databaseaccess' "$resolver"
          grep -q 'jsmprofile.serialnumber' "$resolver"
          grep -q 'jsmprofile.access_from' "$resolver"
          grep -q 'jsmprofile.access_to' "$resolver"
          grep -q "'postgresql' => 'pgsql'" "$resolver"

          if grep -E -- 'sportsmanagementHelper::getDBConnection|helpers/sportsmanagement\.php|Factory::getDbo\(|Factory::getDBO\(|JDatabaseDriver::|JDatabase::|createQuery\(' "$trait" "$resolver"; then
            echo 'Native SportsManagement database resolver regressed to the legacy helper or a Joomla 6-only query API' >&2
            exit 1
          fi

          grep -q 'abstract class SportsManagementListField extends ListField' "$base"
          grep -q 'use SportsManagementDatabaseTrait' "$base"

          grep -q 'final class ActeventtypeField extends SportsManagementListField' "$acteventtype"
          grep -q '#__sportsmanagement_eventtype' "$acteventtype"
          grep -q 'sports_type_id' "$acteventtype"
          grep -Fq "preg_replace('/[^A-Za-z0-9_]/'" "$acteventtype"
          grep -q "class_alias(ActeventtypeField::class, 'JFormFieldacteventtype')" "$acteventtype_bridge"

          grep -q 'final class ActseasonField extends SportsManagementListField' "$actseason"
          grep -q '#__sportsmanagement_season' "$actseason"
          grep -q "class_alias(ActseasonField::class, 'JFormFieldactseason')" "$actseason_bridge"

          grep -q 'final class AssociationslistField extends SportsManagementListField' "$associationslist"
          grep -q "view === 'projects'" "$associationslist"
          grep -q "view === 'leagues'" "$associationslist"
          grep -q "view === 'clubs'" "$associationslist"
          grep -q 'getCountryOptions' "$associationslist"
          grep -q 'getCountryTreeOptions' "$associationslist"
          grep -q 'appendChildren' "$associationslist"
          grep -q '#__sportsmanagement_associations' "$associationslist"
          grep -Fq "preg_replace('/[^A-Za-z0-9_]/'" "$associationslist"
          grep -q "class_alias(AssociationslistField::class, 'JFormFieldAssociationsList')" "$associationslist_bridge"

          grep -q 'final class ClublistField extends SportsManagementListField' "$clublist"
          grep -q '#__sportsmanagement_club' "$clublist"
          grep -q '#__sportsmanagement_team' "$clublist"
          grep -q '#__sportsmanagement_sports_type' "$clublist"
          grep -q "getInput()->getInt('club_id'" "$clublist"
          grep -q "class_alias(ClublistField::class, 'JFormFieldClublist')" "$clublist_bridge"

          grep -q 'final class ClubsField extends FormField' "$clubs"
          grep -q 'use SportsManagementDatabaseTrait' "$clubs"
          grep -q 'cfg_which_database_table' "$clubs"
          grep -q 'select.genericlist' "$clubs"
          grep -q 'multiple="multiple"' "$clubs"
          grep -q "class_alias(ClubsField::class, 'JFormFieldClubs')" "$clubs_bridge"

          grep -q 'final class CountryField extends SportsManagementListField' "$country"
          grep -q '#__sportsmanagement_countries' "$country"
          grep -q "quoteName('alpha3', 'value')" "$country"
          grep -q "class_alias(CountryField::class, 'JFormFieldCountry')" "$country_bridge"

          grep -q 'final class CurrentroundField extends SportsManagementListField' "$currentround"
          grep -q 'getInput()->getInt' "$currentround"
          grep -q '#__sportsmanagement_round' "$currentround"
          grep -q 'COM_SPORTSMANAGEMENT_GLOBAL_MATCHDAY_NAME' "$currentround"
          grep -q "class_alias(CurrentroundField::class, 'JFormFieldCurrentround')" "$currentround_bridge"

          grep -q 'final class EventtypelistField extends SportsManagementListField' "$eventtypelist"
          grep -q '#__sportsmanagement_eventtype' "$eventtypelist"
          grep -q "quoteName('published')" "$eventtypelist"
          grep -q "quoteName('ordering')" "$eventtypelist"
          grep -q "class_alias(EventtypelistField::class, 'JFormFieldeventtypelist')" "$eventtypelist_bridge"

          grep -q 'final class FederationslistField extends SportsManagementListField' "$federationslist"
          grep -q "view === 'leagues'" "$federationslist"
          grep -q 'getTopLevelOptions' "$federationslist"
          grep -q 'getTreeOptions' "$federationslist"
          grep -q 'appendChildren' "$federationslist"
          grep -q '#__sportsmanagement_federations' "$federationslist"
          grep -q "class_alias(FederationslistField::class, 'JFormFieldFederationsList')" "$federationslist_bridge"

          grep -q 'final class GcalendarField extends SportsManagementListField' "$gcalendar"
          grep -q '#__sportsmanagement_gcalendar' "$gcalendar"
          grep -q "class_alias(GcalendarField::class, 'JFormFieldGCalendar')" "$gcalendar_bridge"

          grep -q 'final class LeaguelevelField extends SportsManagementListField' "$leaguelevel"
          grep -q 'level <= 20' "$leaguelevel"
          grep -q 'level <= 40' "$leaguelevel"
          grep -q 'level <= 50' "$leaguelevel"
          grep -q "class_alias(LeaguelevelField::class, 'JFormFieldLeagueLevel')" "$leaguelevel_bridge"

          grep -q 'final class MatchdaylistField extends SportsManagementListField' "$matchdaylist"
          grep -q "element\['varname'\]" "$matchdaylist"
          grep -q '#__sportsmanagement_round' "$matchdaylist"
          grep -q "quoteName('published')" "$matchdaylist"
          grep -q "quoteName('roundcode')" "$matchdaylist"
          grep -q "class_alias(MatchdaylistField::class, 'JFormFieldMatchdaylist')" "$matchdaylist_bridge"

          grep -q 'final class PersonlistField extends SportsManagementListField' "$personlist"
          grep -q '#__sportsmanagement_person' "$personlist"
          grep -q "quoteName('firstname')" "$personlist"
          grep -q "quoteName('lastname')" "$personlist"
          grep -q "class_alias(PersonlistField::class, 'JFormFieldpersonlist')" "$personlist_bridge"

          grep -q 'final class PlaygroundlistField extends SportsManagementListField' "$playgroundlist"
          grep -q '#__sportsmanagement_playground' "$playgroundlist"
          grep -q "class_alias(PlaygroundlistField::class, 'JFormFieldplaygroundlist')" "$playgroundlist_bridge"

          grep -q 'final class PlaygroundsField extends FormField' "$playgrounds"
          grep -q 'use SportsManagementDatabaseTrait' "$playgrounds"
          grep -q 'cfg_which_database_table' "$playgrounds"
          grep -q 'select.genericlist' "$playgrounds"
          grep -q 'multiple="multiple"' "$playgrounds"
          grep -q "class_alias(PlaygroundsField::class, 'JFormFieldPlaygrounds')" "$playgrounds_bridge"

          grep -q 'final class PositionlistField extends SportsManagementListField' "$positionlist"
          grep -q '#__sportsmanagement_position' "$positionlist"
          grep -q '#__sportsmanagement_sports_type' "$positionlist"
          grep -q "quoteName('pos.published')" "$positionlist"
          grep -q "class_alias(PositionlistField::class, 'JFormFieldpositionlist')" "$positionlist_bridge"

          grep -q 'final class ProjectdivisionField extends SportsManagementListField' "$projectdivision"
          grep -q 'getInput()->getInt' "$projectdivision"
          grep -q '#__sportsmanagement_division' "$projectdivision"
          grep -q "class_alias(ProjectdivisionField::class, 'JFormFieldprojectdivisionlist')" "$projectdivision_bridge"

          grep -q 'final class ProjectlistField extends SportsManagementListField' "$projectlist"
          grep -q '#__sportsmanagement_project' "$projectlist"
          grep -q "class_alias(ProjectlistField::class, 'JFormFieldprojectlist')" "$projectlist_bridge"

          grep -q 'final class ProjectroundsField extends SportsManagementListField' "$projectrounds"
          grep -q '#__sportsmanagement_round' "$projectrounds"
          grep -q "getValue('project')" "$projectrounds"
          grep -q "class_alias(ProjectroundsField::class, 'JFormFieldprojectrounds')" "$projectrounds_bridge"

          grep -q 'final class StatstypelistField extends ListField' "$statstypelist"
          grep -q 'Joomla\\Filesystem\\Folder' "$statstypelist"
          grep -q 'PATHINFO_FILENAME' "$statstypelist"
          grep -q "class_alias(StatstypelistField::class, 'JFormFieldStatstypelist')" "$statstypelist_bridge"

          grep -q 'final class TeamlistField extends SportsManagementListField' "$teamlist"
          grep -q '#__sportsmanagement_team' "$teamlist"
          grep -q "class_alias(TeamlistField::class, 'JFormFieldTeamlist')" "$teamlist_bridge"

          grep -q 'final class TeamsField extends FormField' "$teams"
          grep -q 'use SportsManagementDatabaseTrait' "$teams"
          grep -q '#__sportsmanagement_team' "$teams"
          grep -q "\$this->name . '\[\]'" "$teams"
          grep -q 'select.genericlist' "$teams"
          grep -q 'multiple="multiple"' "$teams"
          grep -q "class_alias(TeamsField::class, 'JFormFieldTeams')" "$teams_bridge"

          grep -q 'final class TemplatelistField extends SportsManagementListField' "$templatelist"
          grep -q '#__sportsmanagement_project' "$templatelist"
          grep -q "quoteName('master_template')" "$templatelist"
          grep -q "class_alias(TemplatelistField::class, 'JFormFieldtemplatelist')" "$templatelist_bridge"

          grep -q 'final class UserlistField extends ListField' "$userlist"
          grep -q 'DatabaseInterface::class' "$userlist"
          grep -q '#__users' "$userlist"
          grep -q "class_alias(UserlistField::class, 'JFormFielduserlist')" "$userlist_bridge"

          if grep -E -- 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|->input|JVERSION|version_compare\(|formbehavior\.chosen|formbehavior2\.select2|sportsmanagementHelper::getRoundsOptions|class JFormField(AssociationsList|Clublist|Clubs|Country|FederationsList|LeagueLevel|Matchdaylist|Playgrounds|Teams|acteventtype|actseason|Currentround|eventtypelist|GCalendar|personlist|playgroundlist|positionlist|projectdivisionlist|projectlist|projectrounds|Statstypelist|Teamlist|templatelist|userlist) extends|JSMCountries|JJ_categoryArray|fbTreeRecurse|CASE LENGTH\(|CONCAT\(' "${files[@]}"; then
            echo 'Native administrator fields regressed to a legacy loader, input, Joomla-version branch, helper coupling, DB-specific label SQL or duplicated field implementation' >&2
            exit 1
          fi
