name: Joomla 5/6 native administrator fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/**'
      - 'admin/models/fields/country.php'
      - 'admin/models/fields/federationslist.php'
      - 'admin/models/fields/leaguelevel.php'
      - 'admin/models/fields/projectdivisionlist.php'
      - '.github/workflows/joomla5-6-admin-native-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/**'
      - 'admin/models/fields/country.php'
      - 'admin/models/fields/federationslist.php'
      - 'admin/models/fields/leaguelevel.php'
      - 'admin/models/fields/projectdivisionlist.php'
      - '.github/workflows/joomla5-6-admin-native-fields.yml'

jobs:
  native-fields:
    name: Native administrator field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native fields
        shell: bash
        run: |
          set -euo pipefail

          base=admin/src/Field/SportsManagementListField.php
          country=admin/src/Field/CountryField.php
          country_bridge=admin/models/fields/country.php
          federationslist=admin/src/Field/FederationslistField.php
          federationslist_bridge=admin/models/fields/federationslist.php
          leaguelevel=admin/src/Field/LeaguelevelField.php
          leaguelevel_bridge=admin/models/fields/leaguelevel.php
          projectdivision=admin/src/Field/ProjectdivisionField.php
          projectdivision_bridge=admin/models/fields/projectdivisionlist.php
          files=(
            "$base"
            "$country"
            "$country_bridge"
            "$federationslist"
            "$federationslist_bridge"
            "$leaguelevel"
            "$leaguelevel_bridge"
            "$projectdivision"
            "$projectdivision_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'abstract class SportsManagementListField extends ListField' "$base"
          grep -q 'DatabaseInterface' "$base"
          grep -q 'require_once \$helperFile' "$base"
          grep -q 'sportsmanagementHelper::getDBConnection()' "$base"
          grep -q 'instanceof DatabaseInterface' "$base"

          grep -q 'final class CountryField extends SportsManagementListField' "$country"
          grep -q '#__sportsmanagement_countries' "$country"
          grep -q "quoteName('alpha3', 'value')" "$country"
          grep -q "quoteName('name', 'text')" "$country"
          grep -q "class_alias(CountryField::class, 'JFormFieldCountry')" "$country_bridge"
          grep -q '/src/Field/CountryField.php' "$country_bridge"

          grep -q 'final class FederationslistField extends SportsManagementListField' "$federationslist"
          grep -q "view === 'leagues'" "$federationslist"
          grep -q 'getTopLevelOptions' "$federationslist"
          grep -q 'getTreeOptions' "$federationslist"
          grep -q 'appendChildren' "$federationslist"
          grep -q '#__sportsmanagement_federations' "$federationslist"
          grep -q "class_alias(FederationslistField::class, 'JFormFieldFederationsList')" "$federationslist_bridge"
          grep -q '/src/Field/FederationslistField.php' "$federationslist_bridge"

          grep -q 'final class LeaguelevelField extends SportsManagementListField' "$leaguelevel"
          grep -q 'level <= 20' "$leaguelevel"
          grep -q 'level <= 40' "$leaguelevel"
          grep -q 'level <= 50' "$leaguelevel"
          grep -q "class_alias(LeaguelevelField::class, 'JFormFieldLeagueLevel')" "$leaguelevel_bridge"
          grep -q '/src/Field/LeaguelevelField.php' "$leaguelevel_bridge"

          grep -q 'final class ProjectdivisionField extends SportsManagementListField' "$projectdivision"
          grep -q 'getInput()->getInt' "$projectdivision"
          grep -q '#__sportsmanagement_division' "$projectdivision"
          grep -q "class_alias(ProjectdivisionField::class, 'JFormFieldprojectdivisionlist')" "$projectdivision_bridge"
          grep -q '/src/Field/ProjectdivisionField.php' "$projectdivision_bridge"

          if grep -E -- 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|->input|class JFormField(Country|FederationsList|LeagueLevel|projectdivisionlist) extends|JSMCountries|JJ_categoryArray|fbTreeRecurse' "${files[@]}"; then
            echo 'Native administrator fields regressed to a legacy loader, input or duplicated field implementation' >&2
            exit 1
          fi
