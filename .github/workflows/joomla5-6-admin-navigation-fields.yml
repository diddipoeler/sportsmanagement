name: Joomla 5/6 administrator navigation fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/JlmenuitemsField.php'
      - 'admin/src/Field/JsmmenuitemsField.php'
      - 'admin/models/fields/jlmenuitems.php'
      - 'admin/models/fields/jsmmenuitems.php'
      - '.github/workflows/joomla5-6-admin-navigation-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/JlmenuitemsField.php'
      - 'admin/src/Field/JsmmenuitemsField.php'
      - 'admin/models/fields/jlmenuitems.php'
      - 'admin/models/fields/jsmmenuitems.php'
      - '.github/workflows/joomla5-6-admin-navigation-fields.yml'

jobs:
  navigation-fields:
    name: Administrator navigation field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate navigation fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          jl=admin/src/Field/JlmenuitemsField.php
          jl_bridge=admin/models/fields/jlmenuitems.php
          jsm=admin/src/Field/JsmmenuitemsField.php
          jsm_bridge=admin/models/fields/jsmmenuitems.php

          for file in "$jl" "$jl_bridge" "$jsm" "$jsm_bridge"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class JlmenuitemsField extends ListField' "$jl"
          grep -q "'jlallprojectrounds'" "$jl"
          test "$(grep -c "'treetonode' =>" "$jl")" -eq 1
          grep -q "class_alias(JlmenuitemsField::class, 'JFormFieldJLMenuItems')" "$jl_bridge"

          grep -q 'final class JsmmenuitemsField extends ListField' "$jsm"
          grep -q "'rankingmatrix'" "$jsm"
          grep -q "'statsrankingteams'" "$jsm"
          grep -q "'leaguechampionoverview'" "$jsm"
          grep -q "class_alias(JsmmenuitemsField::class, 'JFormFieldJSMMenuItems')" "$jsm_bridge"

          if grep -E -- 'jimport\(|JLoader::|FormHelper::loadFieldClass|class JFormField(JLMenuItems|JSMMenuItems) extends' "$jl" "$jl_bridge" "$jsm" "$jsm_bridge"; then
            echo 'Navigation field regressed to a legacy loader or duplicated global implementation' >&2
            exit 1
          fi
