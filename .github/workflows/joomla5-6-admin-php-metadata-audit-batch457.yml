name: Joomla 5/6 administrator PHP metadata audit batch 457

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/**/*.php'
      - '.github/workflows/joomla5-6-admin-php-metadata-audit-batch457.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/**/*.php'
      - '.github/workflows/joomla5-6-admin-php-metadata-audit-batch457.yml'

permissions:
  contents: read

jobs:
  admin-php-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate every administrator PHP file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find admin -type f -name '*.php' ! -path '*/vendor/*' -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No administrator PHP files found." >&2
            exit 1
          fi

          failures=0
          for file in "${files[@]}"; do
            # Continue after syntax errors so a single run reports every broken
            # administrator file instead of stopping at the first one.
            if ! php -l "$file"; then
              failures=$((failures + 1))
            fi
          done

          # Preserve upstream PHPDoc ownership and licenses.
          if ! php .github/tests/phpdoc_metadata.php "${files[@]}"; then
            failures=$((failures + 1))
          fi

          echo "Validated ${#files[@]} administrator PHP files; ${failures} failures."
          test "${failures}" -eq 0
