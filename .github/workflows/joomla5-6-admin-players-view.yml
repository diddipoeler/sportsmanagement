name: Joomla 5/6 administrator players view

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/players/view.html.php'
      - 'admin/src/Legacy/LegacyBootstrap.php'
      - '.github/workflows/joomla5-6-admin-players-view.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/views/players/view.html.php'
      - 'admin/src/Legacy/LegacyBootstrap.php'
      - '.github/workflows/joomla5-6-admin-players-view.yml'

jobs:
  players-view:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate players view legacy boundary
        shell: bash
        run: |
          set -euo pipefail
          view=admin/views/players/view.html.php
          bootstrap=admin/src/Legacy/LegacyBootstrap.php

          php -l "$view"
          php -l "$bootstrap"
          grep -Fq "self::importLegacy('countries')" "$bootstrap"
          grep -Fq 'JSMCountries::getCountryOptions()' "$view"

          legacy_re='JLoader::|jimport\(|BaseDatabaseModel::getInstance\(|Table::getInstance\(|Factory::getDbo\(|Factory::getDBO\('
          if grep -E "$legacy_re" "$view"; then
            echo 'Players view regressed to a removed/deprecated Joomla loader or factory API' >&2
            exit 1
          fi
