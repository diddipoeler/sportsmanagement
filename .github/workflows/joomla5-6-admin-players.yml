name: Joomla 5/6 administrator players migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  players:
    name: Native players checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate players migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/PlayerModel.php
            admin/src/Model/PlayersModel.php
            admin/src/Controller/PlayerController.php
            admin/src/Controller/PlayersController.php
            admin/models/player.php
            admin/models/players.php
            admin/controllers/player.php
            admin/controllers/players.php
            admin/views/player/view.html.php
            admin/views/players/view.html.php
            admin/views/players/tmpl/default.php
            admin/views/players/tmpl/default_data.php
            admin/views/players/tmpl/players_upload.php
            admin/views/players/tmpl/assignconfirm.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/player.xml

          grep -q 'class PlayerModel extends SportsManagementAdminModel' admin/src/Model/PlayerModel.php
          grep -q "\$config\['dbo'\] = \$this->getDatabase()" admin/src/Model/PlayerModel.php
          for method in getAgeGroupID getPerson saveshort importupload storeAssign
          do
            grep -q "function ${method}" admin/src/Model/PlayerModel.php
          done
          grep -q 'headerMap' admin/src/Model/PlayerModel.php
          grep -q "'firstname' => 'firstname'" admin/src/Model/PlayerModel.php
          grep -q "'knvbnr' => 'knvbnr'" admin/src/Model/PlayerModel.php
          grep -q 'File::upload' admin/src/Model/PlayerModel.php
          grep -q 'transactionStart' admin/src/Model/PlayerModel.php
          grep -q 'ensureSeasonTeamPerson' admin/src/Model/PlayerModel.php
          grep -q 'ensureSeasonPerson' admin/src/Model/PlayerModel.php
          grep -q 'ensureProjectReferee' admin/src/Model/PlayerModel.php
          grep -q 'ensurePersonProjectPosition' admin/src/Model/PlayerModel.php

          grep -q 'class PlayersModel extends SportsManagementListModel' admin/src/Model/PlayersModel.php
          for method in getPersonsToAssign getProjectTeamList getTeamName getProjectTeamName getPersons getPersonListSelect getPositionOptions getAgeGroupOptions getProjectName
          do
            grep -q "function ${method}" admin/src/Model/PlayersModel.php
          done
          grep -q 'pt.project_id = ' admin/src/Model/PlayersModel.php
          grep -q '\$orderMap\[\$ordering\]' admin/src/Model/PlayersModel.php

          grep -q 'class PlayerController extends SportsManagementFormController' admin/src/Controller/PlayerController.php
          grep -q 'class PlayersController extends SportsManagementAdminController' admin/src/Controller/PlayersController.php
          for method in importupload assign close saveshort
          do
            grep -q "function ${method}" admin/src/Controller/PlayersController.php
          done
          grep -q "Session::checkToken('post')" admin/src/Controller/PlayersController.php
          grep -q "requirePermission('core.create')" admin/src/Controller/PlayersController.php
          grep -q "requirePermission('core.edit')" admin/src/Controller/PlayersController.php

          grep -q "class_alias(PlayerModel::class, 'sportsmanagementModelplayer')" admin/models/player.php
          grep -q "class_alias(PlayersModel::class, 'sportsmanagementModelplayers')" admin/models/players.php
          grep -q "class_alias(PlayerController::class, 'sportsmanagementControllerplayer')" admin/controllers/player.php
          grep -q "class_alias(PlayersController::class, 'sportsmanagementControllerplayers')" admin/controllers/players.php

          grep -q '\$this->model->getAgeGroupID' admin/views/player/view.html.php
          grep -q '\$this->model->getPositionOptions' admin/views/players/view.html.php
          grep -q '\$this->model->getAgeGroupOptions' admin/views/players/view.html.php
          grep -q "loadTemplate('data')" admin/views/players/tmpl/default.php
          grep -q "HTMLHelper::_('form.token')" admin/views/players/tmpl/default.php
          for field in firstname nickname lastname birthday deathday knvbnr country position agegroup
          do
            grep -q "name=\"${field}" admin/views/players/tmpl/default_data.php
          done
          grep -q 'type="date" name="birthday' admin/views/players/tmpl/default_data.php
          grep -q 'type="date" name="deathday' admin/views/players/tmpl/default_data.php
          grep -q 'name="fileToUpload"' admin/views/players/tmpl/players_upload.php
          grep -q "HTMLHelper::_('form.token')" admin/views/players/tmpl/players_upload.php
          grep -q 'name="cid\[\]"' admin/views/players/tmpl/assignconfirm.php
          grep -q 'name="task" value="players.assign"' admin/views/players/tmpl/assignconfirm.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|JVERSION|version_compare\(|JEventDispatcher|SqueezeBox|Joomla\\CMS\\Filesystem\\File|cdnjs\.cloudflare\.com|netdna\.bootstrapcdn\.com|tempusdominus|moment\.js|\$_FILES' "${files[@]}"; then
            echo 'Players migration regressed to a removed/deprecated or unsafe legacy API' >&2
            exit 1
          fi
