name: Joomla 5/6 admin playgrounds

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/PlaygroundsModel.php'
      - 'admin/src/View/Playgrounds/HtmlView.php'
      - 'admin/tmpl/playgrounds/**'
      - 'admin/views/playgrounds/view.html.php'
      - '.github/workflows/joomla5-6-admin-playgrounds.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/PlaygroundsModel.php'
      - 'admin/src/View/Playgrounds/HtmlView.php'
      - 'admin/tmpl/playgrounds/**'
      - 'admin/views/playgrounds/view.html.php'
      - '.github/workflows/joomla5-6-admin-playgrounds.yml'

jobs:
  playgrounds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint playground PHP
        shell: bash
        run: |
          php -l admin/src/Model/PlaygroundsModel.php
          php -l admin/src/View/Playgrounds/HtmlView.php
          php -l admin/tmpl/playgrounds/default.php
          php -l admin/views/playgrounds/view.html.php

      - name: Validate native playground list
        shell: bash
        run: |
          model=admin/src/Model/PlaygroundsModel.php
          native_view=admin/src/View/Playgrounds/HtmlView.php
          template=admin/tmpl/playgrounds/default.php
          bridge=admin/views/playgrounds/view.html.php

          grep -Fq 'extends SportsManagementListModel' "$model"
          grep -Fq '#__sportsmanagement_playground' "$model"
          grep -Fq "get('FilterForm')" "$native_view"
          grep -Fq "get('ActiveFilters')" "$native_view"
          grep -Fq "ToolbarHelper::publish('playgrounds.publish'" "$native_view"
          grep -Fq "ToolbarHelper::unpublish('playgrounds.unpublish'" "$native_view"
          grep -Fq "LayoutHelper::render('joomla.searchtools.default'" "$template"
          grep -Fq "HTMLHelper::_('jgrid.published'" "$template"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewPlaygrounds')" "$bridge"

          if grep -E 'JHtmlSelect|BaseDatabaseModel::getInstance|Table::getInstance|JLoader::|jimport\(|version_compare\(JVERSION|JVERSION' "$bridge" "$native_view" "$template"; then
            echo 'Playgrounds view reintroduced a legacy Joomla path' >&2
            exit 1
          fi
