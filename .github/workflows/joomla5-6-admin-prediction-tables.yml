name: Joomla 5/6 native prediction tables

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/PredictiongameModel.php'
      - 'admin/src/Model/PredictionprojectModel.php'
      - 'admin/src/Model/PredictiontemplateModel.php'
      - 'admin/src/Table/PredictiongameTable.php'
      - 'admin/src/Table/PredictionprojectTable.php'
      - 'admin/src/Table/PredictiontemplateTable.php'
      - 'admin/tables/predictiongame.php'
      - 'admin/tables/predictionproject.php'
      - 'admin/tables/predictiontemplate.php'
      - '.github/workflows/joomla5-6-admin-prediction-tables.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/PredictiongameModel.php'
      - 'admin/src/Model/PredictionprojectModel.php'
      - 'admin/src/Model/PredictiontemplateModel.php'
      - 'admin/src/Table/PredictiongameTable.php'
      - 'admin/src/Table/PredictionprojectTable.php'
      - 'admin/src/Table/PredictiontemplateTable.php'
      - 'admin/tables/predictiongame.php'
      - 'admin/tables/predictionproject.php'
      - 'admin/tables/predictiontemplate.php'
      - '.github/workflows/joomla5-6-admin-prediction-tables.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint prediction table slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/PredictiongameModel.php
            admin/src/Model/PredictionprojectModel.php
            admin/src/Model/PredictiontemplateModel.php
            admin/src/Table/PredictiongameTable.php
            admin/src/Table/PredictionprojectTable.php
            admin/src/Table/PredictiontemplateTable.php
            admin/tables/predictiongame.php
            admin/tables/predictionproject.php
            admin/tables/predictiontemplate.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate prediction table contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'final class PredictiongameTable extends SportsManagementTable' admin/src/Table/PredictiongameTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_prediction_game', 'id', \$db)" admin/src/Table/PredictiongameTable.php
          grep -Fq 'OutputFilter::stringURLSafe($name)' admin/src/Table/PredictiongameTable.php
          grep -Fq 'new PredictiongameTable($this->getDatabase())' admin/src/Model/PredictiongameModel.php
          grep -Fq "class_alias(PredictiongameTable::class, 'sportsmanagementTablePredictionGame')" admin/tables/predictiongame.php

          grep -Fq 'final class PredictionprojectTable extends SportsManagementTable' admin/src/Table/PredictionprojectTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_prediction_project', 'id', \$db)" admin/src/Table/PredictionprojectTable.php
          grep -Fq '$this->prediction_id' admin/src/Table/PredictionprojectTable.php
          grep -Fq '$this->project_id' admin/src/Table/PredictionprojectTable.php
          grep -Fq 'new PredictionprojectTable($this->getDatabase())' admin/src/Model/PredictionprojectModel.php
          grep -Fq "class_alias(PredictionprojectTable::class, 'sportsmanagementTablePredictionProject')" admin/tables/predictionproject.php

          grep -Fq 'final class PredictiontemplateTable extends SportsManagementTable' admin/src/Table/PredictiontemplateTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_prediction_template', 'id', \$db)" admin/src/Table/PredictiontemplateTable.php
          grep -Fq 'new PredictiontemplateTable($this->getDatabase())' admin/src/Model/PredictiontemplateModel.php
          grep -Fq "class_alias(PredictiontemplateTable::class, 'sportsmanagementTablePredictionTemplate')" admin/tables/predictiontemplate.php

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Joomla\\CMS\\Filesystem\\(File|Folder|Path)|Joomla\\CMS\\Http\\|Table::getInstance\('
          if grep -ER "$legacy_re" \
            admin/src/Model/PredictiongameModel.php \
            admin/src/Model/PredictionprojectModel.php \
            admin/src/Model/PredictiontemplateModel.php \
            admin/src/Table/PredictiongameTable.php \
            admin/src/Table/PredictionprojectTable.php \
            admin/src/Table/PredictiontemplateTable.php \
            admin/tables/predictiongame.php \
            admin/tables/predictionproject.php \
            admin/tables/predictiontemplate.php; then
            echo 'Prediction table slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
