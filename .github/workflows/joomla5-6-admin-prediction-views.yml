name: Joomla 5/6 administrator prediction view migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  prediction-views:
    name: Native prediction administrator view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prediction view migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/PredictiongamesModel.php
            admin/src/Model/PredictionroundsModel.php
            admin/src/Model/PredictiontemplatesModel.php
            admin/views/predictiongames/view.html.php
            admin/views/predictionrounds/view.html.php
            admin/views/predictiontemplates/view.html.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          # Prediction-game list view gets all cross-table reads from its native list model.
          grep -q 'function getPredictionGame' admin/src/Model/PredictiongamesModel.php
          grep -q 'function getActivePredictionRoundsCount' admin/src/Model/PredictiongamesModel.php
          grep -q 'function getProjectRoundsCount' admin/src/Model/PredictiongamesModel.php
          grep -q '\$this->model->getPredictionGames' admin/views/predictiongames/view.html.php
          grep -q '\$this->model->getPredictionGame' admin/views/predictiongames/view.html.php
          grep -q 'getActivePredictionRoundsCount' admin/views/predictiongames/view.html.php
          grep -q 'getProjectRoundsCount' admin/views/predictiongames/view.html.php

          # Prediction-round and template views stay on their injected native models.
          for model in PredictionroundsModel PredictiontemplatesModel; do
            grep -q 'function getPredictionGames' "admin/src/Model/${model}.php"
            grep -q 'function getPredictionGame' "admin/src/Model/${model}.php"
          done
          grep -q '\$this->model->getPredictionGames' admin/views/predictionrounds/view.html.php
          grep -q '\$this->model->getPredictionGame' admin/views/predictionrounds/view.html.php
          grep -q '\$this->model->getPredictionGames' admin/views/predictiontemplates/view.html.php
          grep -q '\$this->model->getPredictionGame' admin/views/predictiontemplates/view.html.php

          if grep -E -- 'BaseDatabaseModel::getInstance\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|jsmdb|jsmquery|jsmjinput|extends JSMModel|extends JSMController' "${files[@]}"; then
            echo 'Prediction administrator view path regressed to a legacy model/database API' >&2
            exit 1
          fi
