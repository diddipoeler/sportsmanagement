name: Joomla 5/6 administrator prediction game migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  prediction-game:
    name: Native prediction game model/controller checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prediction game migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/PredictiongameModel.php
            admin/src/Model/PredictiongamesModel.php
            admin/src/Controller/PredictiongameController.php
            admin/src/Controller/PredictiongamesController.php
            admin/models/predictiongame.php
            admin/models/predictiongames.php
            admin/controllers/predictiongame.php
            admin/controllers/predictiongames.php
            admin/views/predictiongame/view.html.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/predictiongame.xml

          grep -q 'class PredictiongameModel extends SportsManagementAdminModel' admin/src/Model/PredictiongameModel.php
          grep -q 'models/forms' admin/src/Model/PredictiongameModel.php
          grep -q 'function afterSportsManagementSave' admin/src/Model/PredictiongameModel.php
          grep -q 'function storePredictionAdmins' admin/src/Model/PredictiongameModel.php
          grep -q 'function storePredictionProjects' admin/src/Model/PredictiongameModel.php
          grep -q 'function getPredictionProjectIDs' admin/src/Model/PredictiongameModel.php
          grep -q 'function deletePredictionAdmins' admin/src/Model/PredictiongameModel.php
          grep -q 'function deletePredictionProjects' admin/src/Model/PredictiongameModel.php
          grep -q 'function deletePredictionMembers' admin/src/Model/PredictiongameModel.php
          grep -q 'function deletePredictionResults' admin/src/Model/PredictiongameModel.php
          grep -q 'function rebuildPredictionProjectSPoints' admin/src/Model/PredictiongameModel.php
          grep -q 'function syncRelation' admin/src/Model/PredictiongameModel.php
          grep -q 'function calculatePredictionPoints' admin/src/Model/PredictiongameModel.php
          grep -q "#__sportsmanagement_prediction_admin" admin/src/Model/PredictiongameModel.php
          grep -q "#__sportsmanagement_prediction_project" admin/src/Model/PredictiongameModel.php
          grep -q "#__sportsmanagement_prediction_result" admin/src/Model/PredictiongameModel.php

          grep -q 'class PredictiongameController extends SportsManagementFormController' admin/src/Controller/PredictiongameController.php
          grep -q 'class PredictiongamesController extends SportsManagementAdminController' admin/src/Controller/PredictiongamesController.php
          grep -q "getModel(\$name = 'Predictiongame'" admin/src/Controller/PredictiongamesController.php

          grep -q "class_alias(PredictiongameModel::class, 'sportsmanagementModelPredictionGame')" admin/models/predictiongame.php
          grep -q "class_alias(PredictiongamesModel::class, 'sportsmanagementModelPredictionGames')" admin/models/predictiongames.php
          grep -q "class_alias(PredictiongameController::class, 'sportsmanagementControllerpredictiongame')" admin/controllers/predictiongame.php
          grep -q "class_alias(PredictiongamesController::class, 'sportsmanagementControllerpredictiongames')" admin/controllers/predictiongames.php

          grep -q 'PredictiongamesModel::getAdmins' admin/views/predictiongame/view.html.php
          grep -q 'PredictiongameModel::\$seasonid' admin/views/predictiongame/view.html.php
          grep -q 'getInput()' admin/views/predictiongame/view.html.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|INSERT IGNORE|BaseDatabaseModel::getInstance\(' \
            admin/src/Model/PredictiongameModel.php \
            admin/src/Controller/PredictiongameController.php \
            admin/src/Controller/PredictiongamesController.php \
            admin/views/predictiongame/view.html.php; then
            echo 'Prediction game migration regressed to a removed Joomla or legacy MVC/database API' >&2
            exit 1
          fi
