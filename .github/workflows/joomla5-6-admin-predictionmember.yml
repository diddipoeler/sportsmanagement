name: Joomla 5/6 administrator prediction member migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  predictionmember:
    name: Native prediction member model/controller/view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prediction member migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/PredictionmemberModel.php
            admin/src/Model/PredictionmembersModel.php
            admin/src/Controller/PredictionmemberController.php
            admin/src/Controller/PredictionmembersController.php
            admin/models/predictionmember.php
            admin/models/predictionmembers.php
            admin/controllers/predictionmember.php
            admin/controllers/predictionmembers.php
            admin/views/predictionmember/view.html.php
            admin/views/predictionmembers/view.html.php
            admin/views/predictionmembers/tmpl/default.php
            admin/views/predictionmembers/tmpl/default_data.php
            admin/views/predictionmembers/tmpl/editlist.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/predictionmember.xml
          test -f admin/models/forms/filter_predictionmembers.xml
          test -f admin/tables/predictionmember.php
          php -r "libxml_use_internal_errors(true); exit(simplexml_load_file('admin/models/forms/predictionmember.xml') ? 0 : 1);"
          php -r "libxml_use_internal_errors(true); exit(simplexml_load_file('admin/models/forms/filter_predictionmembers.xml') ? 0 : 1);"

          grep -q 'class PredictionmemberModel extends SportsManagementAdminModel' admin/src/Model/PredictionmemberModel.php
          grep -q 'models/forms' admin/src/Model/PredictionmemberModel.php
          grep -q "getTable(\$type = 'predictionmember'" admin/src/Model/PredictionmemberModel.php
          grep -q 'function save_memberlist' admin/src/Model/PredictionmemberModel.php
          grep -q 'function sendEmailtoMembers' admin/src/Model/PredictionmemberModel.php
          grep -q 'function publishpredmembers' admin/src/Model/PredictionmemberModel.php
          grep -q 'function deletePredictionMembers' admin/src/Model/PredictionmemberModel.php
          grep -q 'function deletePredictionResults' admin/src/Model/PredictionmemberModel.php
          grep -q 'MailerFactoryInterface::class' admin/src/Model/PredictionmemberModel.php
          grep -q 'setSender(\$senderEmail, \$senderName)' admin/src/Model/PredictionmemberModel.php
          grep -q 'foreach (\$bcc as \$bccEmail)' admin/src/Model/PredictionmemberModel.php
          grep -q 'function getPredictionTemplateConfig' admin/src/Model/PredictionmemberModel.php
          grep -q '#__sportsmanagement_prediction_template' admin/src/Model/PredictionmemberModel.php
          grep -q 'master_template' admin/src/Model/PredictionmemberModel.php
          grep -q 'function calculatePredictionPoints' admin/src/Model/PredictionmemberModel.php
          grep -q "(string) \$result->tipp === '1'" admin/src/Model/PredictionmemberModel.php

          if grep -q 'sportsmanagementModelPrediction' admin/src/Model/PredictionmemberModel.php; then
            echo 'Prediction member reminder regressed to the legacy site prediction model' >&2
            exit 1
          fi

          grep -q 'class PredictionmembersModel extends SportsManagementListModel' admin/src/Model/PredictionmembersModel.php
          grep -q 'models/forms' admin/src/Model/PredictionmembersModel.php
          grep -q 'function getPredictionProjectName' admin/src/Model/PredictionmembersModel.php
          grep -q 'function getPredictionMembers' admin/src/Model/PredictionmembersModel.php
          grep -q 'function getJLUsers' admin/src/Model/PredictionmembersModel.php
          grep -q 'function getPredictionGames' admin/src/Model/PredictionmembersModel.php
          grep -q '#__sportsmanagement_prediction_member' admin/src/Model/PredictionmembersModel.php

          grep -q 'class PredictionmemberController extends SportsManagementFormController' admin/src/Controller/PredictionmemberController.php
          grep -q 'class PredictionmembersController extends SportsManagementAdminController' admin/src/Controller/PredictionmembersController.php
          grep -q 'function save_memberlist' admin/src/Controller/PredictionmembersController.php
          grep -q 'function reminder' admin/src/Controller/PredictionmembersController.php
          grep -q 'function publish' admin/src/Controller/PredictionmembersController.php
          grep -q 'function unpublish' admin/src/Controller/PredictionmembersController.php
          grep -q 'function remove' admin/src/Controller/PredictionmembersController.php
          test "$(grep -c 'checkToken' admin/src/Controller/PredictionmembersController.php)" -ge 4

          grep -q "class_alias(PredictionmemberModel::class, 'sportsmanagementModelpredictionmember')" admin/models/predictionmember.php
          grep -q "class_alias(PredictionmembersModel::class, 'sportsmanagementModelPredictionMembers')" admin/models/predictionmembers.php
          grep -q "class_alias(PredictionmemberController::class, 'sportsmanagementControllerpredictionmember')" admin/controllers/predictionmember.php
          grep -q "class_alias(PredictionmembersController::class, 'sportsmanagementControllerpredictionmembers')" admin/controllers/predictionmembers.php

          grep -q '\$this->model->getPredictionGames' admin/views/predictionmembers/view.html.php
          grep -q '\$this->model->getPredictionMembers' admin/views/predictionmembers/view.html.php
          grep -q '\$this->model->getJLUsers' admin/views/predictionmembers/view.html.php
          grep -q '\$this->app->getInput()' admin/views/predictionmember/view.html.php
          grep -q "LayoutHelper::render('joomla.searchtools.default'" admin/views/predictionmembers/tmpl/default.php
          grep -q "loadTemplate('data')" admin/views/predictionmembers/tmpl/default.php
          grep -q "predictionmembers.save_memberlist" admin/views/predictionmembers/tmpl/editlist.php
          grep -q "HTMLHelper::_('form.token')" admin/views/predictionmembers/tmpl/editlist.php
          grep -q "HTMLHelper::_('grid.id'" admin/views/predictionmembers/tmpl/default_data.php

          if grep -E -- "joomla_version|SqueezeBox|jgrid\.checkedout|version_compare\(.*JVERSION" admin/views/predictionmembers/tmpl/default.php admin/views/predictionmembers/tmpl/editlist.php admin/views/predictionmembers/tmpl/default_data.php; then
            echo 'Prediction member UI regressed to a legacy wrapper/modal/checkout/version path' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Prediction member migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
