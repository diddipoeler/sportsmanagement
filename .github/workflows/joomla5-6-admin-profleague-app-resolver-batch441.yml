name: Joomla 5/6 administrator ProfLeague application resolver batch 441

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/jlextprofleagimport.php'
      - '.github/workflows/joomla5-6-admin-profleague-app-resolver-batch441.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/jlextprofleagimport.php'
      - '.github/workflows/joomla5-6-admin-profleague-app-resolver-batch441.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate ProfLeague application resolver
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/jlextprofleagimport.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'SportsManagementAdministratorApplicationResolver::resolve()' "$file"
          grep -Fq -- 'is_file($applicationResolverFile)' "$file"
          grep -Fq -- '$this->jsmapp->getUserState' "$file"
          grep -Fq -- '$this->jsmjinput->post->getArray' "$file"
          ! grep -Fq -- 'Factory::getApplication' "$file"
