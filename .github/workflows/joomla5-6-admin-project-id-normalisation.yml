name: Joomla 5/6 administrator project ID boundaries

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/ProjectsModel.php'
      - '.github/tests/joomla56_admin_project_id_normalisation.php'
      - '.github/workflows/joomla5-6-admin-project-id-normalisation.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-ids:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint native Projects model and test
        run: |
          php -l admin/src/Model/ProjectsModel.php
          php -l .github/tests/joomla56_admin_project_id_normalisation.php
      - name: Ensure invalid season and league selectors never reach queries
        run: php .github/tests/joomla56_admin_project_id_normalisation.php
