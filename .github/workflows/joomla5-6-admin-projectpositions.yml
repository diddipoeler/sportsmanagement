name: Joomla 5/6 administrator project positions

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  projectpositions-view:
    name: Native project positions view boundary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint project positions view
        shell: bash
        run: |
          php -l admin/views/projectpositions/view.html.php

      - name: Enforce Joomla 5/6 view APIs
        shell: bash
        run: |
          view=admin/views/projectpositions/view.html.php

          if grep -E 'Factory::getApplication|Factory::getUser|Factory::getConfig|Factory::getURI|BaseDatabaseModel::getInstance|Table::getInstance|\$app->input' "$view"; then
            echo 'Project positions view regressed to a legacy Joomla factory/input path' >&2
            exit 1
          fi

          grep -q 'getInput()' "$view"
          grep -q "bootComponent('com_sportsmanagement')" "$view"
          grep -q 'getMVCFactory()' "$view"
          grep -q "createModel('Project', 'Administrator'" "$view"

      - name: Preserve project position assignment boundary
        shell: bash
        run: |
          view=admin/views/projectpositions/view.html.php

          grep -q '\$assignedPositionIds\[\$positionId\] = true' "$view"
          grep -q 'isset(\$assignedPositionIds\[\$positionId\])' "$view"
          grep -q "\$this->setLayout('editlist')" "$view"
          grep -q '\$this->project_id = \$projectId' "$view"

          if grep -q '\$this->addToolbar_Editlist();' "$view"; then
            occurrences=$(grep -c '\$this->addToolbar_Editlist();' "$view")
            test "$occurrences" -eq 1
          fi
