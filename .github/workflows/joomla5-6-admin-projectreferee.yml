name: Joomla 5/6 native project referee

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/ProjectrefereeModel.php'
      - 'admin/src/Model/ProjectModel.php'
      - 'admin/src/Model/PlayerModel.php'
      - 'admin/src/Table/ProjectrefereeTable.php'
      - 'admin/tables/projectreferee.php'
      - 'admin/views/projectreferee/view.html.php'
      - '.github/workflows/joomla5-6-admin-projectreferee.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/ProjectrefereeModel.php'
      - 'admin/src/Model/ProjectModel.php'
      - 'admin/src/Model/PlayerModel.php'
      - 'admin/src/Table/ProjectrefereeTable.php'
      - 'admin/tables/projectreferee.php'
      - 'admin/views/projectreferee/view.html.php'
      - '.github/workflows/joomla5-6-admin-projectreferee.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate project referee slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/ProjectrefereeModel.php
            admin/src/Table/ProjectrefereeTable.php
            admin/tables/projectreferee.php
            admin/views/projectreferee/view.html.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          grep -Fq 'new ProjectrefereeTable($this->getDatabase())' admin/src/Model/ProjectrefereeModel.php
          grep -Fq "parent::__construct('#__sportsmanagement_project_referee', 'id', \$db)" admin/src/Table/ProjectrefereeTable.php
          grep -Fq "class_alias(ProjectrefereeTable::class, 'sportsmanagementTableProjectReferee')" admin/tables/projectreferee.php
          grep -Fq "bootComponent('com_sportsmanagement')->getMVCFactory()" admin/views/projectreferee/view.html.php
          grep -Fq "createModel('Project', 'Administrator')" admin/views/projectreferee/view.html.php
          grep -Fq "createModel('Player', 'Administrator')" admin/views/projectreferee/view.html.php
          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Joomla\\CMS\\Filesystem\\(File|Folder|Path)|Joomla\\CMS\\Http\\|Table::getInstance\('
          if grep -ER "$legacy_re" "${files[@]}"; then
            echo 'Project referee slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
