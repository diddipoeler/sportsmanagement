name: Joomla 5/6 administrator project referees migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  project-referees:
    name: Native project referee model/controller checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project referee migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/ProjectrefereeModel.php
            admin/src/Model/ProjectrefereesModel.php
            admin/src/Controller/ProjectrefereeController.php
            admin/src/Controller/ProjectrefereesController.php
            admin/models/projectreferee.php
            admin/models/projectreferees.php
            admin/controllers/projectreferee.php
            admin/controllers/projectreferees.php
            admin/views/projectreferees/view.html.php
            admin/views/projectreferees/tmpl/default.php
            admin/views/projectreferees/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/projectreferee.xml

          grep -q 'class ProjectrefereeModel extends SportsManagementAdminModel' admin/src/Model/ProjectrefereeModel.php
          grep -q 'models/forms' admin/src/Model/ProjectrefereeModel.php
          grep -q 'function saveshort' admin/src/Model/ProjectrefereeModel.php
          grep -q 'function delete' admin/src/Model/ProjectrefereeModel.php
          grep -q "quoteName('#__sportsmanagement_match_referee')" admin/src/Model/ProjectrefereeModel.php
          grep -q "quoteName('project_referee_id')" admin/src/Model/ProjectrefereeModel.php

          grep -q 'class ProjectrefereesModel extends SportsManagementListModel' admin/src/Model/ProjectrefereesModel.php
          for method in storeAssigned unassign getProjectRefereesCount getItems2 getProject getProjectPositions getListQuery; do
            grep -q "function ${method}" admin/src/Model/ProjectrefereesModel.php
          done
          grep -q "quoteName('#__sportsmanagement_project_referee'" admin/src/Model/ProjectrefereesModel.php
          grep -q "quoteName('#__sportsmanagement_season_person_id', 'tp')" admin/src/Model/ProjectrefereesModel.php
          grep -q "quoteName('#__sportsmanagement_project_position', 'ppos')" admin/src/Model/ProjectrefereesModel.php

          grep -q 'class ProjectrefereeController extends SportsManagementFormController' admin/src/Controller/ProjectrefereeController.php
          grep -q 'function remove' admin/src/Controller/ProjectrefereeController.php
          grep -q 'checkToken' admin/src/Controller/ProjectrefereeController.php
          grep -q 'class ProjectrefereesController extends SportsManagementAdminController' admin/src/Controller/ProjectrefereesController.php
          grep -q 'function saveshort' admin/src/Controller/ProjectrefereesController.php
          grep -q 'checkToken' admin/src/Controller/ProjectrefereesController.php

          grep -q "class_alias(ProjectrefereeModel::class, 'sportsmanagementModelprojectreferee')" admin/models/projectreferee.php
          grep -q "class_alias(ProjectrefereesModel::class, 'sportsmanagementModelProjectReferees')" admin/models/projectreferees.php
          grep -q "class_alias(ProjectrefereeController::class, 'sportsmanagementControllerprojectreferee')" admin/controllers/projectreferee.php
          grep -q "class_alias(ProjectrefereesController::class, 'sportsmanagementControllerprojectreferees')" admin/controllers/projectreferees.php

          grep -q '\$this->model->getProject(' admin/views/projectreferees/view.html.php
          grep -q '\$this->model->getProjectPositions(' admin/views/projectreferees/view.html.php
          grep -q '\$this->app->getInput()' admin/views/projectreferees/view.html.php
          grep -q "HTMLHelper::_('form.token')" admin/views/projectreferees/tmpl/default.php
          grep -q "HTMLHelper::_('draggablelist.draggable')" admin/views/projectreferees/tmpl/default_data.php
          grep -q '\$this->item->picture === sportsmanagementHelper::getDefaultPlaceholder' admin/views/projectreferees/tmpl/default_data.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Table::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|sportsmanagementModeldatabasetool' "${files[@]}"; then
            echo 'Project referee migration regressed to a removed Joomla or legacy MVC/database API' >&2
            exit 1
          fi

          if grep -E 'version_compare\(|\$row->picture' admin/views/projectreferees/tmpl/default_data.php; then
            echo 'Project referee row template regressed to a pre-Joomla-5 branch or undefined row variable' >&2
            exit 1
          fi
