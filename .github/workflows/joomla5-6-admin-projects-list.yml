name: Joomla 5/6 administrator projects list migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  projects-list:
    name: Native projects list checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate projects list migration
        shell: bash
        run: |
          set -euo pipefail

          php_files=(
            admin/src/Model/ProjectsModel.php
            admin/src/Service/ProjectsViewDataService.php
            admin/models/projects.php
            admin/views/projects/view.html.php
            admin/views/projects/tmpl/default.php
            admin/views/projects/tmpl/default_data.php
          )

          for file in "${php_files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/filter_projects.xml

          grep -q 'class ProjectsModel extends SportsManagementListModel' admin/src/Model/ProjectsModel.php
          grep -q 'models/forms' admin/src/Model/ProjectsModel.php
          grep -q 'function existcurrentseason' admin/src/Model/ProjectsModel.php
          grep -q '#__sportsmanagement_project_team' admin/src/Model/ProjectsModel.php
          grep -q '#__sportsmanagement_confidential' admin/src/Model/ProjectsModel.php
          grep -q '#__sportsmanagement_user_extra_fields_values' admin/src/Model/ProjectsModel.php
          grep -q 'filter.show_notassign' admin/src/Model/ProjectsModel.php
          grep -q "\$map\[\$ordering\]" admin/src/Model/ProjectsModel.php

          grep -q 'class ProjectsViewDataService' admin/src/Service/ProjectsViewDataService.php
          for method in getExtraFields getProjectExtraFieldNames getLeagues getSportsTypes getSeasons getAgeGroups getMasterTemplates getAssociations getCountries getRoundsCount getDivisionsCount getMatchesCount
          do
            grep -q "function ${method}" admin/src/Service/ProjectsViewDataService.php
          done

          grep -q "class_alias(ProjectsModel::class, 'sportsmanagementModelProjects')" admin/models/projects.php
          grep -q 'SportsManagementListModel.php' admin/models/projects.php

          # View data is native; project write actions are covered by the separate project gate.
          grep -q 'new ProjectsViewDataService' admin/views/projects/view.html.php
          grep -q '\$this->model->getFilterForm' admin/views/projects/view.html.php
          grep -q '\$this->model->getActiveFilters' admin/views/projects/view.html.php
          grep -q "projects.saveshort" admin/views/projects/view.html.php
          grep -q "projects.setleaguechampion" admin/views/projects/view.html.php
          grep -q "projects.copy" admin/views/projects/view.html.php

          # Active list wrapper uses SearchTools directly rather than the legacy Joomla-version wrapper.
          grep -q "searchtools.default" admin/views/projects/tmpl/default.php
          grep -q "HTMLHelper::_('form.token')" admin/views/projects/tmpl/default.php
          grep -q "loadTemplate('data')" admin/views/projects/tmpl/default.php

          # Keep every field consumed by native ProjectModel::saveshort().
          for field in new_project_name league project_type agegroup master_template fast_projektteam project_live_update use_leaguechampion cr_project user_field user_field_id
          do
            grep -q "$field" admin/views/projects/tmpl/default_data.php
          done
          grep -q '\$this->projectData->getRoundsCount' admin/views/projects/tmpl/default_data.php
          grep -q '\$this->projectData->getMatchesCount' admin/views/projects/tmpl/default_data.php
          grep -q '\$this->projectData->getDivisionsCount' admin/views/projects/tmpl/default_data.php
          grep -q '\$this->model->existcurrentseason' admin/views/projects/tmpl/default_data.php

          if grep -E -- 'BaseDatabaseModel::getInstance\(|Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|JHtmlSelect|JVERSION|version_compare\(|joomla_version|Joomla\\CMS\\Filesystem\\(File|Folder)|Folder::(exists|create)|Table::getInstance\(' "${php_files[@]}"; then
            echo 'Projects list migration regressed to a removed/deprecated Joomla or legacy MVC/database/UI API' >&2
            exit 1
          fi

          # ProjectModel and ProjectsController are validated by joomla5-6-admin-project.yml.
