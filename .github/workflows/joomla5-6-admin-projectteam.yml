name: Joomla 5/6 administrator project-team form migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  projectteam:
    name: Native project-team form and action checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project-team form migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/ProjectteamModel.php
            admin/models/projectteam.php
            admin/src/Controller/ProjectteamController.php
            admin/controllers/projectteam.php
            admin/src/Controller/ProjectteamsController.php
            admin/controllers/projectteams.php
            admin/src/Table/SeasonteamTable.php
            admin/tables/seasonteam.php
            admin/views/projectteam/view.html.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/projectteam.xml

          grep -q 'class ProjectteamModel extends SportsManagementAdminModel' admin/src/Model/ProjectteamModel.php
          grep -q 'Form::addFormPath' admin/src/Model/ProjectteamModel.php
          grep -q 'models/forms' admin/src/Model/ProjectteamModel.php
          grep -q "\$config\['dbo'\] = \$this->getDatabase()" admin/src/Model/ProjectteamModel.php

          for method in \
            set_playground_match \
            getProjectTeamPlayground \
            set_playground \
            saveshort \
            setseasonid \
            setusetable \
            setusetablepoints \
            matchgroups \
            storeAssign \
            delete \
            getProjectTeam
          do
            grep -q "function ${method}" admin/src/Model/ProjectteamModel.php
          done

          grep -q '#__sportsmanagement_project_team' admin/src/Model/ProjectteamModel.php
          grep -q '#__sportsmanagement_match' admin/src/Model/ProjectteamModel.php
          grep -q '#__sportsmanagement_project_team_division' admin/src/Model/ProjectteamModel.php
          grep -q '#__sportsmanagement_season_team_id' admin/src/Model/ProjectteamModel.php
          grep -q '#__sportsmanagement_club' admin/src/Model/ProjectteamModel.php
          grep -q '#__sportsmanagement_team' admin/src/Model/ProjectteamModel.php

          # Division-point POST keys must never become arbitrary SQL column names.
          grep -q 'function updateDivisionPoints' admin/src/Model/ProjectteamModel.php
          for field in start_points matches_finally points_finally neg_points_finally penalty_points won_finally draws_finally lost_finally homegoals_finally guestgoals_finally diffgoals_finally; do
            grep -q "'${field}'" admin/src/Model/ProjectteamModel.php
          done
          grep -q "in_array(\$field, \$allowed, true)" admin/src/Model/ProjectteamModel.php
          grep -q 'function normaliseIds' admin/src/Model/ProjectteamModel.php
          grep -q "array_map('intval'" admin/src/Model/ProjectteamModel.php

          # Delete retains the historic cascade for home/away matches.
          grep -q "\['projectteam1_id', 'projectteam2_id'\]" admin/src/Model/ProjectteamModel.php
          grep -q 'parent::delete' admin/src/Model/ProjectteamModel.php

          grep -q "class_alias(ProjectteamModel::class, 'sportsmanagementModelprojectteam')" admin/models/projectteam.php
          grep -q 'SportsManagementAdminModel.php' admin/models/projectteam.php
          grep -q 'ProjectteamModel.php' admin/models/projectteam.php

          grep -q 'class ProjectteamController extends SportsManagementFormController' admin/src/Controller/ProjectteamController.php
          grep -q 'function storechangeteams' admin/src/Controller/ProjectteamController.php
          grep -q "Session::checkToken('post')" admin/src/Controller/ProjectteamController.php
          grep -q "getIdentity()->authorise" admin/src/Controller/ProjectteamController.php
          grep -q '#__sportsmanagement_season_team_id' admin/src/Controller/ProjectteamController.php
          grep -q "updateObject(" admin/src/Controller/ProjectteamController.php
          grep -q "class_alias(ProjectteamController::class, 'sportsmanagementControllerprojectteam')" admin/controllers/projectteam.php
          grep -q 'SportsManagementFormController.php' admin/controllers/projectteam.php

          grep -q 'class ProjectteamsController extends SportsManagementAdminController' admin/src/Controller/ProjectteamsController.php
          for action in saveshort set_playground_match set_playground assign matchgroups setseasonid use_table_yes use_table_no use_table_points_yes use_table_points_no; do
            grep -q "function ${action}" admin/src/Controller/ProjectteamsController.php
          done
          grep -q "Session::checkToken('post')" admin/src/Controller/ProjectteamsController.php
          grep -q "getIdentity()->authorise" admin/src/Controller/ProjectteamsController.php
          grep -q "parent::getModel('Projectteam', 'Administrator'" admin/src/Controller/ProjectteamsController.php
          grep -q "class_alias(ProjectteamsController::class, 'sportsmanagementControllerprojectteams')" admin/controllers/projectteams.php
          grep -q 'SportsManagementAdminController.php' admin/controllers/projectteams.php

          # Project-team edit view uses the component MVC factory and native season-team table.
          grep -q 'final class SeasonteamTable extends SportsManagementTable' admin/src/Table/SeasonteamTable.php
          grep -q "#__sportsmanagement_season_team_id" admin/src/Table/SeasonteamTable.php
          grep -q "class_alias(SeasonteamTable::class, 'sportsmanagementTableseasonteam')" admin/tables/seasonteam.php
          grep -q "bootComponent('com_sportsmanagement')->getMVCFactory()" admin/views/projectteam/view.html.php
          grep -q "createModel('Project', 'Administrator')" admin/views/projectteam/view.html.php
          grep -q "createModel('Team', 'Administrator')" admin/views/projectteam/view.html.php
          grep -q 'new SeasonteamTable($this->model->getDatabase())' admin/views/projectteam/view.html.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Table::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|extends JSMModelLegacy|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool' "${files[@]}"; then
            echo 'Project-team migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
