name: Joomla 5/6 administrator query compatibility gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Model/ClubnameModel.php'
      - 'admin/src/Model/DivisionModel.php'
      - 'admin/src/Model/SportstypeModel.php'
      - '.github/workflows/joomla5-6-admin-query-compat.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Model/ClubnameModel.php'
      - 'admin/src/Model/DivisionModel.php'
      - 'admin/src/Model/SportstypeModel.php'
      - '.github/workflows/joomla5-6-admin-query-compat.yml'

jobs:
  query-compat:
    name: Joomla 5/6 query API checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate portable query API
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/ClubnameModel.php
            admin/src/Model/DivisionModel.php
            admin/src/Model/SportstypeModel.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
            grep -q 'getQuery(true)' "$file"
          done

          grep -q 'final class ClubnameModel extends SportsManagementAdminModel' admin/src/Model/ClubnameModel.php
          grep -q '#__sportsmanagement_club_names' admin/src/Model/ClubnameModel.php

          grep -q 'final class DivisionModel extends SportsManagementAdminModel' admin/src/Model/DivisionModel.php
          for method in divisiontoproject massadd getMaxDivision count_teams_division saveshort; do
            grep -q "function ${method}" admin/src/Model/DivisionModel.php
          done
          grep -q '#__sportsmanagement_division' admin/src/Model/DivisionModel.php
          grep -q '#__sportsmanagement_project_team' admin/src/Model/DivisionModel.php

          grep -q 'final class SportstypeModel extends SportsManagementAdminModel' admin/src/Model/SportstypeModel.php
          grep -q 'function getSportstype' admin/src/Model/SportstypeModel.php
          grep -q '#__sportsmanagement_sports_type' admin/src/Model/SportstypeModel.php

          if grep -E -- 'createQuery\(|Factory::getDbo\(|Factory::getDBO\(|sportsmanagementHelper::|helpers/sportsmanagement\.php|JLoader::|jimport\(|->input|JDatabaseDriver::|JDatabase::' "${files[@]}"; then
            echo 'Administrator model query slice regressed to a Joomla 6-only or legacy database API' >&2
            exit 1
          fi
