name: Joomla 5/6 administrator quick-add migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  quickadd:
    name: Native quick-add checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate quick-add migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/QuickaddModel.php
            admin/models/quickadd.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class QuickaddModel extends SportsManagementListModel' admin/src/Model/QuickaddModel.php
          grep -q 'function getNotAssignedPlayers' admin/src/Model/QuickaddModel.php
          grep -q 'function getNotAssignedStaff' admin/src/Model/QuickaddModel.php
          grep -q 'function getNotAssignedReferees' admin/src/Model/QuickaddModel.php
          grep -q 'function getNotAssignedTeams' admin/src/Model/QuickaddModel.php
          grep -q 'function addPlayer' admin/src/Model/QuickaddModel.php
          grep -q 'function getTotal' admin/src/Model/QuickaddModel.php
          grep -q 'function personSearchQuery' admin/src/Model/QuickaddModel.php
          grep -q 'function loadQuickRows' admin/src/Model/QuickaddModel.php
          grep -q 'function personOrdering' admin/src/Model/QuickaddModel.php

          grep -q '#__sportsmanagement_team_player' admin/src/Model/QuickaddModel.php
          grep -q '#__sportsmanagement_team_staff' admin/src/Model/QuickaddModel.php
          grep -q '#__sportsmanagement_project_referee' admin/src/Model/QuickaddModel.php
          grep -q '#__sportsmanagement_project_team' admin/src/Model/QuickaddModel.php
          grep -q '#__sportsmanagement_person' admin/src/Model/QuickaddModel.php
          grep -q "insertObject('#__sportsmanagement_person'" admin/src/Model/QuickaddModel.php
          grep -q "NOT EXISTS" admin/src/Model/QuickaddModel.php
          grep -q 'FILTER_VALIDATE_INT' admin/src/Model/QuickaddModel.php
          grep -q 'getUserStateFromRequest' admin/src/Model/QuickaddModel.php
          grep -q "in_array(\$requested, \$allowed, true)" admin/src/Model/QuickaddModel.php
          grep -q "\$direction === 'DESC' ? 'DESC' : 'ASC'" admin/src/Model/QuickaddModel.php
          grep -q "getState('list.start'" admin/src/Model/QuickaddModel.php
          grep -q "getState('list.limit'" admin/src/Model/QuickaddModel.php

          grep -q "class_alias(QuickaddModel::class, 'sportsmanagementModelQuickAdd')" admin/models/quickadd.php
          grep -q 'SportsManagementListModel.php' admin/models/quickadd.php
          grep -q 'QuickaddModel.php' admin/models/quickadd.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|extends JSMModelLegacy|\$this->_db|\$this->_getList|\$this->_getListCount|jsmdb|jsmquery|jsmapp|jsmjinput' "${files[@]}"; then
            echo 'Quick-add migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
