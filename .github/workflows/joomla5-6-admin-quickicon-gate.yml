name: Joomla 5/6 administrator quickicon gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  administrator-quickicon:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate administrator quickicon module
        shell: bash
        run: |
          set -euo pipefail
          module=admin/modules/mod_sportsmanagement_quickicon
          manifest="$module/mod_sportsmanagement_quickicon.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/tmpl/default.php"
          test ! -d "$module/tmpl/css"
          test ! -d "$module/tmpl/images"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/mod_sportsmanagement_quickicon.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementQuickIcon</namespace>' "$manifest"
          grep -q 'module="mod_sportsmanagement_quickicon"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q "authorise('core.manage', 'com_sportsmanagement')" "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'ComponentHelper::isEnabled' "$module/src/Dispatcher/Dispatcher.php"
          grep -q "view=predictiongames" "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'quick-icons' "$module/tmpl/default.php"
          grep -q 'DatabaseInterface::class' "$module/helper.php"

          if grep -E 'version_compare\(|JVERSION|\bJURI::|Factory::get(Document|Config|Language|User|Dbo|DBO)\(|HTMLHelper::_\(.links\.linksgroups' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/mod_sportsmanagement_quickicon.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php"; then
            echo 'Administrator quickicon regressed to a legacy Joomla API or version branch.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
