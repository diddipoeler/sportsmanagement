name: Joomla 5/6 administrator quote editor

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Model/SmquotestxtModel.php'
      - 'admin/src/Model/SmquotetxtModel.php'
      - 'admin/models/smquotestxt.php'
      - 'admin/models/smquotetxt.php'
      - '.github/workflows/joomla5-6-admin-quote-editor.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Model/SmquotestxtModel.php'
      - 'admin/src/Model/SmquotetxtModel.php'
      - 'admin/models/smquotestxt.php'
      - 'admin/models/smquotetxt.php'
      - '.github/workflows/joomla5-6-admin-quote-editor.yml'

jobs:
  admin-quote-editor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native administrator quote models
        shell: bash
        run: |
          set -euo pipefail

          list_model=admin/src/Model/SmquotestxtModel.php
          editor_model=admin/src/Model/SmquotetxtModel.php
          list_bridge=admin/models/smquotestxt.php
          editor_bridge=admin/models/smquotetxt.php

          for file in "$list_model" "$editor_model" "$list_bridge" "$editor_bridge"; do
            php -l "$file"
          done

          grep -Fq 'final class SmquotestxtModel extends BaseDatabaseModel' "$list_model"
          grep -Fq 'new DirectoryIterator($path)' "$list_model"
          grep -Fq "['txt', 'php']" "$list_model"

          grep -Fq 'final class SmquotetxtModel extends AdminModel' "$editor_model"
          grep -Fq 'use Joomla\Filesystem\File;' "$editor_model"
          grep -Fq 'File::write($filePath, $source)' "$editor_model"
          grep -Fq 'File::read($filePath)' "$editor_model"
          grep -Fq "['txt', 'php']" "$editor_model"
          grep -Fq 'basename($fileName) !== $fileName' "$editor_model"

          grep -Fq "class_alias(SmquotestxtModel::class, 'sportsmanagementModelsmquotestxt')" "$list_bridge"
          grep -Fq "class_alias(SmquotetxtModel::class, 'sportsmanagementModelsmquotetxt')" "$editor_bridge"

          if grep -E 'Joomla\\CMS\\Filesystem\\(File|Folder|Path)|file_get_contents\(|file_put_contents\(|\bfopen\(|\bfwrite\(|Factory::get(Dbo|DBO|Document|User)\(|BaseDatabaseModel::getInstance|jimport\(|JLoader::import|\$app->input' "$list_model" "$editor_model" "$list_bridge" "$editor_bridge"; then
            echo 'Administrator quote editor regressed to a Joomla 6 legacy file path.' >&2
            exit 1
          fi
