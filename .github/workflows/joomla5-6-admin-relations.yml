name: Joomla 5/6 native administrator relations

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-relations:
    name: Native project/team relation lists
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native relation stack
        shell: bash
        run: |
          files=(
            admin/src/Service/ProjectRelationService.php
            admin/src/Model/TeamplayersModel.php
            admin/src/Controller/TeamplayersController.php
            admin/src/View/Teamplayers/HtmlView.php
            admin/tmpl/teamplayers/default.php
            admin/forms/filter_teamplayers.xml
            admin/src/Model/ProjectteamsModel.php
            admin/src/Controller/ProjectteamsController.php
            admin/src/View/Projectteams/HtmlView.php
            admin/tmpl/projectteams/default.php
            admin/src/Field/ProjectdivisionField.php
            admin/forms/filter_projectteams.xml
            admin/src/Dispatcher/Dispatcher.php
          )
          for file in "${files[@]}"; do test -f "$file"; done
          for file in "${files[@]}"; do
            case "$file" in *.php) php -l "$file" ;; esac
          done
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for file in ('admin/forms/filter_teamplayers.xml', 'admin/forms/filter_projectteams.xml'):
              ET.parse(file)
          PY

      - name: Reject legacy relation MVC and render side effects
        shell: bash
        run: |
          files=(
            admin/src/Service/ProjectRelationService.php
            admin/src/Model/TeamplayersModel.php
            admin/src/Controller/TeamplayersController.php
            admin/src/View/Teamplayers/HtmlView.php
            admin/tmpl/teamplayers/default.php
            admin/src/Model/ProjectteamsModel.php
            admin/src/Controller/ProjectteamsController.php
            admin/src/View/Projectteams/HtmlView.php
            admin/tmpl/projectteams/default.php
            admin/src/Field/ProjectdivisionField.php
          )
          if grep -En 'JSMModel|sportsmanagementModel|BaseDatabaseModel::getInstance|Table::getInstance|ALTER TABLE|runJoomlaQuery|->disconnect\(' "${files[@]}"; then
            echo "Native relation stack contains a legacy MVC/schema side effect" >&2
            exit 1
          fi
          presentation=(
            admin/src/Service/ProjectRelationService.php
            admin/src/View/Teamplayers/HtmlView.php
            admin/tmpl/teamplayers/default.php
            admin/src/View/Projectteams/HtmlView.php
            admin/tmpl/projectteams/default.php
          )
          if grep -Ei 'updateObject|insertObject|deleteObject|->update\(|->insert\(|->delete\(' "${presentation[@]}"; then
            echo "Relation service/presentation contains a database write path" >&2
            exit 1
          fi

      - name: Validate teamplayers relation boundary
        shell: bash
        run: |
          model=admin/src/Model/TeamplayersModel.php
          controller=admin/src/Controller/TeamplayersController.php
          template=admin/tmpl/teamplayers/default.php
          view=admin/src/View/Teamplayers/HtmlView.php
          grep -q '#__sportsmanagement_season_team_person_id' "$model"
          grep -q '#__sportsmanagement_person_project_position' "$model"
          grep -q 'loadValidatedRelation' "$model"
          grep -q 'getProjectPosition' "$model"
          grep -q 'saveShort' "$model"
          grep -q 'setRelationState' "$model"
          grep -q "Session::checkToken('post')" "$controller"
          grep -q 'core.edit.state' "$controller"
          grep -q 'teamplayers.saveshort' "$view"
          grep -q 'project_position_id\[' "$template"
          grep -q 'market_value\[' "$template"
          grep -q 'tt_startpoints\[' "$template"

      - name: Validate projectteams safe inline boundary
        shell: bash
        run: |
          model=admin/src/Model/ProjectteamsModel.php
          controller=admin/src/Controller/ProjectteamsController.php
          template=admin/tmpl/projectteams/default.php
          view=admin/src/View/Projectteams/HtmlView.php
          dispatcher=admin/src/Dispatcher/Dispatcher.php
          service=admin/src/Service/ProjectRelationService.php
          grep -q '#__sportsmanagement_project_team' "$model"
          grep -q 'loadProjectTeam' "$model"
          grep -q 'divisionBelongsToProject' "$model"
          grep -q 'playgroundExists' "$model"
          grep -q 'saveShort' "$model"
          grep -q 'setScoreFlag' "$model"
          grep -q 'setFinallyFlag' "$model"
          grep -q "Session::checkToken('post')" "$controller"
          grep -q 'projectteams.saveshort' "$view"
          grep -q 'view=teamplayers' "$template"
          grep -q 'getProjectPositions' "$service"
          grep -q 'getDivisions' "$service"
          grep -q 'getPlaygrounds' "$service"

          if grep -Eq "updateObject\(['\"]#__sportsmanagement_(club|team|match)" "$model"; then
            echo "Native projectteams inline save writes unrelated club/team/match entities" >&2
            exit 1
          fi

          for task in \
            teamplayers.saveshort teamplayers.publish teamplayers.unpublish teamplayers.archive teamplayers.trash \
            projectteams.saveshort projectteams.publish projectteams.unpublish projectteams.archive projectteams.trash \
            projectteams.use_table_yes projectteams.use_table_no projectteams.use_table_points_yes projectteams.use_table_points_no; do
            grep -q "'$task'" "$dispatcher"
          done

          for legacy_task in \
            projectteams.assign projectteams.matchgroups projectteams.setseasonid projectteams.set_playground projectteams.set_playground_match \
            teamplayers.assignplayerscountry teamplayers.assignpersonsclub; do
            if grep -q "'$legacy_task'" "$dispatcher"; then
              echo "Complex legacy relation action leaked into native dispatcher: $legacy_task" >&2
              exit 1
            fi
          done
