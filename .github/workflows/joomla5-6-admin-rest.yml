name: Joomla 5/6 administrator residual migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-rest:
    name: Native administrator residual model and controller checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate administrator residual migrations
        shell: bash
        run: |
          set -euo pipefail

          list_model_pairs=(
            'CpanelModel|cpanel|sportsmanagementModelcpanel'
            'DatabasetoolsModel|databasetools|sportsmanagementModelDatabaseTools'
            'PredictiongroupsModel|predictiongroups|sportsmanagementModelpredictiongroups'
            'ProjectpositionsModel|projectpositions|sportsmanagementModelProjectpositions'
            'SpecialextensionsModel|specialextensions|sportsmanagementModelspecialextensions'
            'SportsmanagementsModel|sportsmanagements|sportsmanagementModelsportsmanagements'
            'SportstypesModel|sportstypes|sportsmanagementModelSportsTypes'
          )

          form_model_pairs=(
            'InstallhelperModel|installhelper|sportsmanagementModelinstallhelper'
            'PlaygroundModel|playground|sportsmanagementModelPlayground'
            'PredictiongroupModel|predictiongroup|sportsmanagementModelpredictiongroup'
            'ProjectpositionModel|projectposition|sportsmanagementModelProjectposition'
            'SeasonpersonModel|seasonperson|sportsmanagementModelseasonperson'
            'SeasonteamModel|seasonteam|sportsmanagementModelseasonteam'
            'SeasonteampersonModel|seasonteamperson|sportsmanagementModelseasonteamperson'
            'SportsmanagementModel|sportsmanagement|sportsmanagementModelsportsmanagement'
            'StatisticModel|statistic|sportsmanagementModelstatistic'
            'TrainingdataModel|trainingdata|sportsmanagementModeltrainingdata'
            'TrainingsdataModel|trainingsdata|sportsmanagementModeltrainingsdata'
          )

          controller_pairs=(
            'AgegroupController|agegroup|sportsmanagementControlleragegroup'
            'AgegroupsController|agegroups|sportsmanagementControlleragegroups'
            'ClubnameController|clubname|sportsmanagementControllerclubname'
            'CpanelController|cpanel|sportsmanagementControllercpanel'
            'CurrentseasonController|currentseason|sportsmanagementControllercurrentseason'
            'DatabasetoolsController|databasetools|sportsmanagementControllerDatabaseTools'
            'EventtypeController|eventtype|sportsmanagementControllereventtype'
            'EventtypesController|eventtypes|sportsmanagementControllereventtypes'
            'ExtrafieldController|extrafield|sportsmanagementControllerextrafield'
            'InstallhelperController|installhelper|sportsmanagementControllerinstallhelper'
            'LeagueController|league|sportsmanagementControllerleague'
            'PositionController|position|sportsmanagementControllerposition'
            'PlaygroundController|playground|sportsmanagementControllerplayground'
            'PredictiongroupController|predictiongroup|sportsmanagementControllerpredictiongroup'
            'PredictiongroupsController|predictiongroups|sportsmanagementControllerpredictiongroups'
            'ProjectpositionController|projectposition|sportsmanagementControllerprojectposition'
            'ProjectpositionsController|projectpositions|sportsmanagementControllerprojectpositions'
            'SportstypesController|sportstypes|sportsmanagementControllersportstypes'
          )

          lint_files=()

          for pair in "${list_model_pairs[@]}"; do
            IFS='|' read -r class legacy legacy_class <<< "$pair"
            native="admin/src/Model/${class}.php"
            bridge="admin/models/${legacy}.php"
            test -f "$native"
            test -f "$bridge"
            grep -q "class ${class} extends SportsManagementListModel" "$native"
            grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge"
            lint_files+=("$native" "$bridge")
          done

          for pair in "${form_model_pairs[@]}"; do
            IFS='|' read -r class legacy legacy_class <<< "$pair"
            native="admin/src/Model/${class}.php"
            bridge="admin/models/${legacy}.php"
            test -f "$native"
            test -f "$bridge"
            grep -q "class ${class} extends SportsManagementAdminModel" "$native"
            grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge"
            lint_files+=("$native" "$bridge")
          done

          for pair in "${controller_pairs[@]}"; do
            IFS='|' read -r class legacy legacy_class <<< "$pair"
            native="admin/src/Controller/${class}.php"
            bridge="admin/controllers/${legacy}.php"
            test -f "$native"
            test -f "$bridge"
            grep -q "class ${class}" "$native"
            grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge"
            lint_files+=("$native" "$bridge")
          done

          for file in "${lint_files[@]}"; do
            php -l "$file"
          done

          # Dashboard stays read-only with maintenance work isolated in Databasetool.
          grep -q 'class CpanelModel extends SportsManagementListModel' admin/src/Model/CpanelModel.php
          grep -q 'function getVersion' admin/src/Model/CpanelModel.php
          grep -q 'function getListQuery' admin/src/Model/CpanelModel.php

          # Database-tools list/controller are native while the large action model migrates separately.
          grep -q 'class DatabasetoolsModel extends SportsManagementListModel' admin/src/Model/DatabasetoolsModel.php
          grep -q "getUInt('limitstart', 0)" admin/src/Model/DatabasetoolsModel.php
          grep -q 'class DatabasetoolsController extends BaseController' admin/src/Controller/DatabasetoolsController.php
          grep -q "getModel(\$name = 'databasetool'" admin/src/Controller/DatabasetoolsController.php
          grep -q "\$config\['ignore_request'\] = true" admin/src/Controller/DatabasetoolsController.php

          # Filesystem-backed extension discovery must not depend on removed CMS Filesystem classes.
          grep -q 'class SpecialextensionsModel extends SportsManagementListModel' admin/src/Model/SpecialextensionsModel.php
          grep -q 'function getSpecialExtensions' admin/src/Model/SpecialextensionsModel.php
          grep -q 'DirectoryIterator' admin/src/Model/SpecialextensionsModel.php
          if grep -q 'Joomla\\CMS\\Filesystem' admin/src/Model/SpecialextensionsModel.php; then
            echo 'Specialextensions model regressed to the removed CMS Filesystem package' >&2
            exit 1
          fi

          # Install helper uses native model/controller state and no static JSM warning channel.
          grep -q 'class InstallhelperModel extends SportsManagementAdminModel' admin/src/Model/InstallhelperModel.php
          grep -q 'function saveSportstype' admin/src/Model/InstallhelperModel.php
          grep -q "insertObject('#__sportsmanagement_sports_type'" admin/src/Model/InstallhelperModel.php
          grep -q 'class InstallhelperController extends SportsManagementFormController' admin/src/Controller/InstallhelperController.php
          grep -q 'function savesportstype' admin/src/Controller/InstallhelperController.php
          grep -q 'checkToken' admin/src/Controller/InstallhelperController.php
          grep -q 'view=installhelper&step=1' admin/src/Controller/InstallhelperController.php
          grep -q 'view=installhelper&step=2' admin/src/Controller/InstallhelperController.php
          if grep -E -- 'JSMModelAdmin|\$_warnings|jsmjinput' admin/src/Model/InstallhelperModel.php admin/src/Controller/InstallhelperController.php; then
            echo 'Installhelper regressed to its static legacy model/controller state' >&2
            exit 1
          fi

          # Training-data form models use the shared native save flow.
          grep -q 'class TrainingdataModel extends SportsManagementAdminModel' admin/src/Model/TrainingdataModel.php
          grep -q "getTable(\$type = 'TeamTrainingData'" admin/src/Model/TrainingdataModel.php
          grep -q 'function afterSportsManagementSave' admin/src/Model/TrainingdataModel.php
          grep -q 'COM_SPORTSMANAGEMENT_N_ITEMS_CREATED' admin/src/Model/TrainingdataModel.php
          grep -q 'class TrainingsdataModel extends SportsManagementAdminModel' admin/src/Model/TrainingsdataModel.php
          grep -q 'com_sportsmanagement.message.' admin/src/Model/TrainingsdataModel.php

          # Prediction-group form/list/controller family is fully native.
          grep -q 'class PredictiongroupModel extends SportsManagementAdminModel' admin/src/Model/PredictiongroupModel.php
          grep -q 'function afterSportsManagementSave' admin/src/Model/PredictiongroupModel.php
          grep -q 'COM_SPORTSMANAGEMENT_N_ITEMS_CREATED' admin/src/Model/PredictiongroupModel.php
          grep -q 'class PredictiongroupsModel extends SportsManagementListModel' admin/src/Model/PredictiongroupsModel.php
          grep -q "quoteName('#__sportsmanagement_prediction_groups', 's')" admin/src/Model/PredictiongroupsModel.php
          grep -q 'function getListQuery' admin/src/Model/PredictiongroupsModel.php
          grep -q 'class PredictiongroupController extends SportsManagementFormController' admin/src/Controller/PredictiongroupController.php
          grep -q 'class PredictiongroupsController extends SportsManagementAdminController' admin/src/Controller/PredictiongroupsController.php
          grep -q "getModel(\$name = 'Predictiongroup'" admin/src/Controller/PredictiongroupsController.php

          # Project-position assignment form/list/controller family is fully native.
          grep -q 'class ProjectpositionModel extends SportsManagementAdminModel' admin/src/Model/ProjectpositionModel.php
          grep -q 'function store' admin/src/Model/ProjectpositionModel.php
          grep -q "quoteName('#__sportsmanagement_project_position')" admin/src/Model/ProjectpositionModel.php
          grep -q 'class ProjectpositionsModel extends SportsManagementListModel' admin/src/Model/ProjectpositionsModel.php
          for method in updateprojectpositions insertStandardProjectPositions getSubPositions getProjectPositionsCount getListQuery; do
            grep -q "function ${method}" admin/src/Model/ProjectpositionsModel.php
          done
          grep -q 'class ProjectpositionController extends SportsManagementFormController' admin/src/Controller/ProjectpositionController.php
          grep -q 'class ProjectpositionsController extends SportsManagementAdminController' admin/src/Controller/ProjectpositionsController.php
          grep -q 'function store' admin/src/Controller/ProjectpositionsController.php
          grep -q 'checkToken' admin/src/Controller/ProjectpositionsController.php
          grep -q "getModel(\$name = 'Projectposition'" admin/src/Controller/ProjectpositionsController.php

          # Keep the old sample/list screen source under the native list base.
          grep -q 'class SportsmanagementsModel extends SportsManagementListModel' admin/src/Model/SportsmanagementsModel.php
          grep -q "quoteName('#__sportsmanagement')" admin/src/Model/SportsmanagementsModel.php
          grep -q "quoteName('greeting')" admin/src/Model/SportsmanagementsModel.php

          # Keep the singular sample form model native while retaining its historical table adapter.
          grep -q 'class SportsmanagementModel extends SportsManagementAdminModel' admin/src/Model/SportsmanagementModel.php
          grep -q 'function getScript' admin/src/Model/SportsmanagementModel.php
          grep -q 'com_sportsmanagement.message.' admin/src/Model/SportsmanagementModel.php

          # The historical singular Statistic model added no behaviour beyond the admin base.
          grep -q 'class StatisticModel extends SportsManagementAdminModel' admin/src/Model/StatisticModel.php

          # Sports-type statistics are already fully native.
          for method in getSportsTypes getProjectsCount getPlaygroundsOnlyCount getLeaguesOnlyCount getPersonsOnlyCount getClubsOnlyCount getLeaguesCount getSeasonsOnlyCount getSeasonsCount getProjectTeamsCount getProjectTeamsPlayersCount getProjectDivisionsCount getProjectRoundsCount getProjectMatchesCount getProjectMatchesEventsNameCount getProjectMatchesEventsCount; do
            grep -q "function ${method}" admin/src/Model/SportstypesModel.php
          done

          # Playground singular model retains its administrator read/form surface natively.
          grep -q 'function getlogohistoryPlayground' admin/src/Model/PlaygroundModel.php
          grep -q 'function getPlaygroundNotic' admin/src/Model/PlaygroundModel.php
          grep -q 'function getAddressString' admin/src/Model/PlaygroundModel.php
          grep -q 'function getPlayground' admin/src/Model/PlaygroundModel.php
          grep -q 'function updateHits' admin/src/Model/PlaygroundModel.php
          grep -q 'function getNextGames' admin/src/Model/PlaygroundModel.php

          # Current-season legacy controller must stay a pure bridge.
          grep -q 'class CurrentseasonController extends SportsManagementAdminController' admin/src/Controller/CurrentseasonController.php
          grep -q "protected \$view_list = 'currentseasons'" admin/src/Controller/CurrentseasonController.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel' "${lint_files[@]}"; then
            echo 'Administrator residual migration regressed to a removed Joomla or legacy MVC API' >&2
            exit 1
          fi
