name: Joomla 5/6 administrator round navigation ID safety

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/RoundsModel.php'
      - '.github/tests/joomla56_admin_round_navigation_ids.php'
      - '.github/workflows/joomla5-6-admin-round-navigation-ids.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint administrator rounds and navigation test
        run: |
          php -l admin/src/Model/RoundsModel.php
          php -l .github/tests/joomla56_admin_round_navigation_ids.php
      - name: Reject malformed round identifiers
        run: php .github/tests/joomla56_admin_round_navigation_ids.php
