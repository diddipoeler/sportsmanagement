name: Joomla 5/6 administrator season assignment field gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/SportsManagementDatabaseTrait.php'
      - 'admin/src/Field/SeasoncheckboxField.php'
      - 'admin/models/fields/seasoncheckbox.php'
      - 'admin/models/forms/team.xml'
      - 'admin/models/forms/player.xml'
      - '.github/workflows/joomla5-6-admin-season-checkbox.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/SportsManagementDatabaseTrait.php'
      - 'admin/src/Field/SeasoncheckboxField.php'
      - 'admin/models/fields/seasoncheckbox.php'
      - 'admin/models/forms/team.xml'
      - 'admin/models/forms/player.xml'
      - '.github/workflows/joomla5-6-admin-season-checkbox.yml'

jobs:
  season-checkbox:
    name: Administrator season assignment field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native season assignment field
        shell: bash
        run: |
          set -euo pipefail

          field=admin/src/Field/SeasoncheckboxField.php
          bridge=admin/models/fields/seasoncheckbox.php
          team=admin/models/forms/team.xml
          player=admin/models/forms/player.xml

          php -l "$field"
          php -l "$bridge"

          grep -q 'final class SeasoncheckboxField extends FormField' "$field"
          grep -q 'use SportsManagementDatabaseTrait' "$field"
          grep -q "'season_team_id' => 'team_id'" "$field"
          grep -q "'season_person_id' => 'person_id'" "$field"
          grep -q 'jform\[teamvalue\]' "$field"
          grep -q 'jform\[season_teamname\]' "$field"
          grep -q 'season_person_club_id\[\]' "$field"
          grep -q 'season_person_position_id\[\]' "$field"
          grep -q 'assign_club_position_to_player' "$field"
          grep -q 'COM_SPORTSMANAGEMENT_ST_TABLETENNIS' "$field"
          grep -q "class_alias(SeasoncheckboxField::class, 'JFormFieldseasoncheckbox')" "$bridge"

          grep -q 'type="seasoncheckbox"' "$team"
          grep -q 'targettable="season_team_id"' "$team"
          grep -q 'targetid="team_id"' "$team"
          grep -q 'type="seasoncheckbox"' "$player"
          grep -q 'targettable="season_person_id"' "$player"
          grep -q 'targetid="person_id"' "$player"

          if grep -E -- 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|->input|FormHelper::loadFieldClass|class JFormFieldseasoncheckbox extends' "$field" "$bridge"; then
            echo 'Season assignment field regressed to legacy database/input APIs or a duplicated global implementation' >&2
            exit 1
          fi
