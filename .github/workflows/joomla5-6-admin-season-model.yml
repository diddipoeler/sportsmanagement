name: Joomla 5/6 administrator season model gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Model/SeasonModel.php'
      - '.github/workflows/joomla5-6-admin-season-model.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Model/SeasonModel.php'
      - '.github/workflows/joomla5-6-admin-season-model.yml'

jobs:
  season-model:
    name: Native season model checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate season model
        shell: bash
        run: |
          set -euo pipefail

          model=admin/src/Model/SeasonModel.php
          test -f "$model"
          php -l "$model"

          grep -q 'final class SeasonModel extends SportsManagementAdminModel' "$model"
          grep -q 'getQuery(true)' "$model"
          for method in saveshortpersons saveshortteams ensureSeasonPerson ensureProjectPersonPosition ensureProjectReferee ensureSeasonTeamPerson resolveTeamId; do
            grep -q "function ${method}" "$model"
          done

          for table in season_team_id season_person_id project_position person_project_position project_referee season_team_person_id; do
            grep -q "#__sportsmanagement_${table}" "$model"
          done

          if grep -E -- 'createQuery\(|sportsmanagementHelper::|helpers/sportsmanagement\.php|JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|->input|JDatabaseDriver::|JDatabase::' "$model"; then
            echo 'Season model regressed to a Joomla 6-only query API or legacy helper/database API' >&2
            exit 1
          fi
