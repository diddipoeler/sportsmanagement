name: Joomla 5/6 administrator season and user fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/SportsManagementDatabaseTrait.php'
      - 'admin/src/Field/SeasonlistField.php'
      - 'admin/src/Field/UserfieldsField.php'
      - 'admin/models/fields/seasonlist.php'
      - 'admin/models/fields/userfields.php'
      - '.github/workflows/joomla5-6-admin-season-user-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/SportsManagementDatabaseTrait.php'
      - 'admin/src/Field/SeasonlistField.php'
      - 'admin/src/Field/UserfieldsField.php'
      - 'admin/models/fields/seasonlist.php'
      - 'admin/models/fields/userfields.php'
      - '.github/workflows/joomla5-6-admin-season-user-fields.yml'

jobs:
  season-user-fields:
    name: Administrator season and user field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native selectors and bridges
        shell: bash
        run: |
          set -euo pipefail

          season=admin/src/Field/SeasonlistField.php
          season_bridge=admin/models/fields/seasonlist.php
          userfields=admin/src/Field/UserfieldsField.php
          userfields_bridge=admin/models/fields/userfields.php
          files=("$season" "$season_bridge" "$userfields" "$userfields_bridge")

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class SeasonlistField extends SportsManagementListField' "$season"
          grep -q 'getSportsManagementDatabase($whichDatabase)' "$season"
          grep -q '#__sportsmanagement_season' "$season"
          grep -q "\['club', 'league', 'playground'\]" "$season"
          grep -q 'setseasonname()' "$season"
          grep -q 'COM_SPORTSMANAGEMENT_ADMIN_PROJECTS_COPYTOSEASON_FILTER' "$season"
          grep -q "class_alias(SeasonlistField::class, 'JFormFieldseasonlist')" "$season_bridge"

          grep -q 'final class UserfieldsField extends SportsManagementListField' "$userfields"
          grep -q '#__sportsmanagement_user_extra_fields' "$userfields"
          grep -q "quote('project')" "$userfields"
          grep -q "quote('team')" "$userfields"
          grep -q 'this.form.submit()' "$userfields"
          grep -q "class_alias(UserfieldsField::class, 'JFormFielduserfields')" "$userfields_bridge"

          if grep -E -- 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getLanguage\(|->input|JVERSION|version_compare\(|formbehavior\.chosen|formbehavior2\.select2|sportsmanagementHelper::getDefaultPlaceholder|class JFormField(seasonlist|userfields) extends' "${files[@]}"; then
            echo 'Season/user selector regressed to legacy database, input or select enhancement APIs' >&2
            exit 1
          fi
