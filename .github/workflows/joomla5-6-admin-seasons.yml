name: Joomla 5/6 administrator seasons migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/views/seasons/view.html.php'
      - 'admin/views/seasons/tmpl/default_data.php'
      - 'admin/src/Table/SeasonTable.php'
      - '.github/workflows/joomla5-6-admin-seasons.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/views/seasons/view.html.php'
      - 'admin/views/seasons/tmpl/default_data.php'
      - 'admin/src/Table/SeasonTable.php'
      - '.github/workflows/joomla5-6-admin-seasons.yml'

jobs:
  seasons:
    name: Native seasons view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate seasons migration
        shell: bash
        run: |
          set -euo pipefail

          view=admin/views/seasons/view.html.php
          rows=admin/views/seasons/tmpl/default_data.php
          table=admin/src/Table/SeasonTable.php

          for file in "$view" "$rows" "$table"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'new SeasonTable($this->model->getDatabase())' "$view"
          grep -q '\$this->app->getInput()' "$view"
          grep -q 'getSeasonTeams($this->season_id)' "$view"
          grep -q "str_starts_with(\$layout, 'assignpersonsclub')" "$view"
          grep -q "HTMLHelper::_('select.genericlist'" "$view"

          if grep -E 'Table::getInstance|JHtmlSelect::|Factory::getApplication|Factory::getUser|Factory::getURI|\$season_id' "$view"; then
            echo 'Seasons view regressed to a legacy Joomla API or undefined season variable' >&2
            exit 1
          fi

          grep -q "HTMLHelper::_('draggablelist.draggable')" "$rows"
          grep -q '\$this->item->checked_out === 0' "$rows"
          grep -q '\$this->table->isCheckedOut' "$rows"

          if grep -E 'version_compare\(|\$row->' "$rows"; then
            echo 'Seasons row template regressed to a pre-Joomla-5 branch or undefined row variable' >&2
            exit 1
          fi
