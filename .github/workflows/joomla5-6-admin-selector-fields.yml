name: Joomla 5/6 administrator selector fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/SportsManagementDatabaseTrait.php'
      - 'admin/src/Field/ExtensionradiobuttonField.php'
      - 'admin/src/Field/ExtensionlistField.php'
      - 'admin/src/Field/GoogleapikeyField.php'
      - 'admin/src/Field/FavteamField.php'
      - 'admin/src/Field/PredictiongameField.php'
      - 'admin/src/Field/PredictiongamesField.php'
      - 'admin/src/Field/ProjectsField.php'
      - 'admin/models/fields/extensionradiobutton.php'
      - 'admin/models/fields/extensionlist.php'
      - 'admin/models/fields/googleapikey.php'
      - 'admin/models/fields/favteam.php'
      - 'admin/models/fields/predictiongame.php'
      - 'admin/models/fields/predictiongames.php'
      - 'admin/models/fields/projects.php'
      - '.github/workflows/joomla5-6-admin-selector-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/SportsManagementDatabaseTrait.php'
      - 'admin/src/Field/ExtensionradiobuttonField.php'
      - 'admin/src/Field/ExtensionlistField.php'
      - 'admin/src/Field/GoogleapikeyField.php'
      - 'admin/src/Field/FavteamField.php'
      - 'admin/src/Field/PredictiongameField.php'
      - 'admin/src/Field/PredictiongamesField.php'
      - 'admin/src/Field/ProjectsField.php'
      - 'admin/models/fields/extensionradiobutton.php'
      - 'admin/models/fields/extensionlist.php'
      - 'admin/models/fields/googleapikey.php'
      - 'admin/models/fields/favteam.php'
      - 'admin/models/fields/predictiongame.php'
      - 'admin/models/fields/predictiongames.php'
      - 'admin/models/fields/projects.php'
      - '.github/workflows/joomla5-6-admin-selector-fields.yml'

jobs:
  selector-fields:
    name: Administrator selector field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate selector fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          database_trait=admin/src/Field/SportsManagementDatabaseTrait.php
          radio=admin/src/Field/ExtensionradiobuttonField.php
          radio_bridge=admin/models/fields/extensionradiobutton.php
          extensions=admin/src/Field/ExtensionlistField.php
          extensions_bridge=admin/models/fields/extensionlist.php
          api=admin/src/Field/GoogleapikeyField.php
          api_bridge=admin/models/fields/googleapikey.php
          fav=admin/src/Field/FavteamField.php
          fav_bridge=admin/models/fields/favteam.php
          prediction=admin/src/Field/PredictiongameField.php
          prediction_bridge=admin/models/fields/predictiongame.php
          predictions=admin/src/Field/PredictiongamesField.php
          predictions_bridge=admin/models/fields/predictiongames.php
          projects=admin/src/Field/ProjectsField.php
          projects_bridge=admin/models/fields/projects.php
          files=(
            "$database_trait"
            "$radio" "$radio_bridge"
            "$extensions" "$extensions_bridge"
            "$api" "$api_bridge"
            "$fav" "$fav_bridge"
            "$prediction" "$prediction_bridge"
            "$predictions" "$predictions_bridge"
            "$projects" "$projects_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'getSportsManagementDatabase(mixed $whichDatabase = null)' "$database_trait"
          grep -q 'sportsmanagementHelper::getDBConnection()' "$database_trait"
          grep -q 'sportsmanagementHelper::getDBConnection(true, $whichDatabase)' "$database_trait"

          grep -q 'final class ExtensionradiobuttonField extends RadioField' "$radio"
          grep -q 'joomla.form.field.radio.switcher' "$radio"
          grep -q "class_alias(ExtensionradiobuttonField::class, 'JFormFieldExtensionRadioButton')" "$radio_bridge"

          grep -q 'final class ExtensionlistField extends ListField' "$extensions"
          grep -q 'Joomla\\Filesystem\\Folder' "$extensions"
          grep -q '/components/com_sportsmanagement/extensions' "$extensions"
          grep -q "class_alias(ExtensionlistField::class, 'JFormFieldExtensionlist')" "$extensions_bridge"

          grep -q 'final class GoogleapikeyField extends TextField' "$api"
          grep -q 'google_api_developerkey' "$api"
          grep -q "class_alias(GoogleapikeyField::class, 'JFormFieldGoogleApiKey')" "$api_bridge"

          grep -q 'final class FavteamField extends SportsManagementListField' "$fav"
          grep -q '#__sportsmanagement_project_team' "$fav"
          grep -q '#__sportsmanagement_season_team_id' "$fav"
          grep -q "class_alias(FavteamField::class, 'JFormFieldFavteam')" "$fav_bridge"

          grep -q 'final class PredictiongameField extends FormField' "$prediction"
          grep -q 'use SportsManagementDatabaseTrait' "$prediction"
          grep -q '#__sportsmanagement_prediction_game' "$prediction"
          grep -q "where(\$db->quoteName('published') . ' = 1')" "$prediction"
          grep -q "(int) \$item->id . ':' . (string) \$item->name" "$prediction"
          grep -q 'multiple="multiple" size="10"' "$prediction"
          grep -q "class_alias(PredictiongameField::class, 'JFormFieldPredictiongame')" "$prediction_bridge"

          grep -q 'final class PredictiongamesField extends SportsManagementListField' "$predictions"
          grep -q '#__sportsmanagement_prediction_game' "$predictions"
          grep -q "class_alias(PredictiongamesField::class, 'JFormFieldPredictiongames')" "$predictions_bridge"

          grep -q 'final class ProjectsField extends SportsManagementListField' "$projects"
          grep -q 'cfg_which_database_table' "$projects"
          grep -q 'getSportsManagementDatabase($whichDatabase)' "$projects"
          grep -Fq "preg_replace('/[^A-Za-z0-9_]/'" "$projects"
          grep -q "quoteName('p.published') . ' = 1'" "$projects"
          grep -q 'COM_SPORTSMANAGEMENT_GLOBAL_LEAGUE' "$projects"
          grep -q 'COM_SPORTSMANAGEMENT_GLOBAL_SEASON' "$projects"
          grep -q "class_alias(ProjectsField::class, 'JFormFieldProjects')" "$projects_bridge"

          if grep -E -- 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getLanguage\(|->input|JVERSION|version_compare\(|BaseDatabaseModel::getInstance|CONCAT\(|class JFormField(ExtensionRadioButton|Extensionlist|GoogleApiKey|Favteam|Predictiongame|Predictiongames|Projects) extends' "${files[@]}"; then
            echo 'Administrator selector field regressed to a removed Joomla API, DB-specific label SQL or duplicated legacy implementation' >&2
            exit 1
          fi
