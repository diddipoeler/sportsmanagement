name: Joomla 5/6 administrator selector follow-up gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  selector-follow-up:
    name: Administrator selector compatibility checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migrated administrator selectors
        shell: bash
        run: |
          set -euo pipefail

          plain_list_fields=(
            admin/src/Field/ExtensionlistField.php
            admin/src/Field/FinaltablerankField.php
            admin/src/Field/GoogletimezonesField.php
            admin/src/Field/PagetitleformatField.php
            admin/src/Field/TeamnameformatField.php
            admin/src/Field/SortorderField.php
            admin/src/Field/StatstypelistField.php
            admin/src/Field/LanguagecharacterField.php
          )

          sports_list_fields=(
            admin/src/Field/SportstypelistField.php
            admin/src/Field/LeagueField.php
            admin/src/Field/LeaguelevelField.php
            admin/src/Field/LeaguelistField.php
            admin/src/Field/MatchdaylistField.php
            admin/src/Field/PositionlistField.php
            admin/src/Field/ParentdivisionField.php
            admin/src/Field/ParentpositionField.php
            admin/src/Field/ProjectdivisionField.php
            admin/src/Field/PersonlistField.php
            admin/src/Field/ProjectField.php
            admin/src/Field/ProjectpositionlistField.php
            admin/src/Field/ProjectpositionrefereeField.php
            admin/src/Field/ProjectroundsField.php
            admin/src/Field/ProjectteamlistField.php
            admin/src/Field/PredictiongameField.php
            admin/src/Field/SeasonlistField.php
            admin/src/Field/TeamsField.php
            admin/src/Field/PredictionroundidField.php
          )

          other_fields=(
            admin/src/Field/UserlistField.php
            admin/src/Field/UserfieldsField.php
            admin/src/Field/NameformatField.php
            admin/src/Field/SeasoncheckboxField.php
          )

          files=("${plain_list_fields[@]}" "${sports_list_fields[@]}" "${other_fields[@]}")

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          for field in "${plain_list_fields[@]}"; do
            grep -Fq 'extends ListField' "$field"
            grep -Fq '(object) [' "$field"
            ! grep -Fq 'HTMLHelper::' "$field"
          done

          for field in "${sports_list_fields[@]}"; do
            grep -Fq 'extends SportsManagementListField' "$field"
            grep -Fq '(object) [' "$field"
            ! grep -Fq 'HTMLHelper::' "$field"
          done

          user_list=admin/src/Field/UserlistField.php
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$user_list"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$user_list"
          ! grep -Fq '$app->getContainer()' "$user_list"
          ! grep -Fq 'Factory::getApplication()' "$user_list"
          grep -Fq "'value' => (string) \$item->value" "$user_list"
          ! grep -Fq 'HTMLHelper::' "$user_list"

          user_fields=admin/src/Field/UserfieldsField.php
          grep -Fq 'extends SportsManagementListField' "$user_fields"
          grep -Fq '$this->getSportsManagementDatabase()' "$user_fields"
          ! grep -E -- 'HTMLHelper::|select\.genericlist' "$user_fields"

          name_format=admin/src/Field/NameformatField.php
          grep -Fq 'extends ListField' "$name_format"
          grep -Fq "'value' => (string) \$value" "$name_format"
          ! grep -E -- 'HTMLHelper::|select\.genericlist' "$name_format"

          season_list=admin/src/Field/SeasonlistField.php
          grep -Fq '$this->getSportsManagementDatabase($whichDatabase)' "$season_list"
          grep -Fq "\$element['multiple'] = 'true';" "$season_list"
          ! grep -E -- 'HTMLHelper::|select\.genericlist' "$season_list"

          season_checkbox=admin/src/Field/SeasoncheckboxField.php
          grep -Fq 'extends FormField' "$season_checkbox"
          grep -Fq '$this->getSportsManagementDatabase()' "$season_checkbox"
          grep -Fq "'select.genericlist'" "$season_checkbox"
          ! grep -Fq "'select.option'" "$season_checkbox"

          if grep -E -- 'Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|Factory::getDocument\(|Factory::getConfig\(|Factory::getApplication\(\)->getContainer\(|\$app->getContainer\(|->administratorApplication\(\)->getContainer\(|->getCfg\(' "${files[@]}"; then
            echo 'Administrator selector migration regressed to a removed/protected Joomla API' >&2
            exit 1
          fi

          echo 'Joomla 5/6 administrator selector contracts OK'
