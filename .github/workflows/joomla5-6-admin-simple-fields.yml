name: Joomla 5/6 simple administrator fields gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/CoefficientyearsField.php'
      - 'admin/src/Field/FinaltablerankField.php'
      - 'admin/src/Field/ParentdivisionField.php'
      - 'admin/src/Field/SerialnumberField.php'
      - 'admin/src/Field/SortorderField.php'
      - 'admin/models/fields/coefficientyears.php'
      - 'admin/models/fields/finaltablerank.php'
      - 'admin/models/fields/parentdivision.php'
      - 'admin/models/fields/serialnumber.php'
      - 'admin/models/fields/sortorder.php'
      - '.github/workflows/joomla5-6-admin-simple-fields.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/CoefficientyearsField.php'
      - 'admin/src/Field/FinaltablerankField.php'
      - 'admin/src/Field/ParentdivisionField.php'
      - 'admin/src/Field/SerialnumberField.php'
      - 'admin/src/Field/SortorderField.php'
      - 'admin/models/fields/coefficientyears.php'
      - 'admin/models/fields/finaltablerank.php'
      - 'admin/models/fields/parentdivision.php'
      - 'admin/models/fields/serialnumber.php'
      - 'admin/models/fields/sortorder.php'
      - '.github/workflows/joomla5-6-admin-simple-fields.yml'

jobs:
  simple-fields:
    name: Simple administrator field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate fields and bridges
        shell: bash
        run: |
          set -euo pipefail

          coefficient=admin/src/Field/CoefficientyearsField.php
          coefficient_bridge=admin/models/fields/coefficientyears.php
          rank=admin/src/Field/FinaltablerankField.php
          rank_bridge=admin/models/fields/finaltablerank.php
          parent=admin/src/Field/ParentdivisionField.php
          parent_bridge=admin/models/fields/parentdivision.php
          serial=admin/src/Field/SerialnumberField.php
          serial_bridge=admin/models/fields/serialnumber.php
          sortorder=admin/src/Field/SortorderField.php
          sortorder_bridge=admin/models/fields/sortorder.php
          files=(
            "$coefficient" "$coefficient_bridge"
            "$rank" "$rank_bridge"
            "$parent" "$parent_bridge"
            "$serial" "$serial_bridge"
            "$sortorder" "$sortorder_bridge"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class CoefficientyearsField extends SportsManagementListField' "$coefficient"
          grep -q '#__sportsmanagement_uefawertung' "$coefficient"
          grep -q 'loadColumn' "$coefficient"
          grep -q "class_alias(CoefficientyearsField::class, 'JFormFieldcoefficientyears')" "$coefficient_bridge"

          grep -q 'final class FinaltablerankField extends ListField' "$rank"
          grep -q 'rank <= 40' "$rank"
          grep -q 'COM_SPORTSMANAGEMENT_ADMIN_PROJECTTEAM_FINALTABLERANK' "$rank"
          grep -q "class_alias(FinaltablerankField::class, 'JFormFieldfinaltablerank')" "$rank_bridge"

          grep -q 'final class ParentdivisionField extends SportsManagementListField' "$parent"
          grep -q '#__sportsmanagement_division' "$parent"
          grep -q "quoteName('parent_id')" "$parent"
          grep -q "getUserState(\$option . '.pid'" "$parent"
          grep -q "class_alias(ParentdivisionField::class, 'JFormFieldparentdivision')" "$parent_bridge"

          grep -q 'final class SerialnumberField extends FormField' "$serial"
          grep -q 'XX99-XX99-99XX-99XX-XXXX-99XX' "$serial"
          grep -q 'random_int(65, 90)' "$serial"
          grep -q 'random_int(0, 9)' "$serial"
          grep -q "class_alias(SerialnumberField::class, 'JFormFieldserialnumber')" "$serial_bridge"

          grep -q 'final class SortorderField extends ListField' "$sortorder"
          grep -q 'template_sort_orders' "$sortorder"
          grep -q "class_alias(SortorderField::class, 'JFormFieldsortorder')" "$sortorder_bridge"

          if grep -E -- 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|->input|JVERSION|version_compare\(|sportsmanagementHelper::jsmsernum|class JFormField(coefficientyears|finaltablerank|parentdivision|serialnumber|sortorder) extends' "${files[@]}"; then
            echo 'Simple administrator fields regressed to a legacy API, helper coupling or duplicated global implementation' >&2
            exit 1
          fi
