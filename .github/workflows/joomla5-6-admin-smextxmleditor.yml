name: Joomla 5/6 administrator extended XML editor migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  smextxmleditor:
    name: Native extended XML editor checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate extended XML editor migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/SmextxmleditorModel.php
            admin/src/Model/SmextxmleditorsModel.php
            admin/src/Controller/SmextxmleditorController.php
            admin/src/Controller/SmextxmleditorsController.php
            admin/models/smextxmleditor.php
            admin/models/smextxmleditors.php
            admin/controllers/smextxmleditor.php
            admin/controllers/smextxmleditors.php
            admin/views/smextxmleditor/view.html.php
            admin/views/smextxmleditors/view.html.php
            admin/views/smextxmleditor/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/smextxmleditor.xml

          grep -q 'class SmextxmleditorModel extends AdminModel' admin/src/Model/SmextxmleditorModel.php
          grep -q 'models/forms' admin/src/Model/SmextxmleditorModel.php
          grep -q 'function getSource' admin/src/Model/SmextxmleditorModel.php
          grep -q 'file_get_contents' admin/src/Model/SmextxmleditorModel.php
          grep -q 'file_put_contents' admin/src/Model/SmextxmleditorModel.php
          grep -q 'basename' admin/src/Model/SmextxmleditorModel.php
          grep -q 'pathinfo' admin/src/Model/SmextxmleditorModel.php
          grep -q "\['xml', 'php'\]" admin/src/Model/SmextxmleditorModel.php

          grep -q 'class SmextxmleditorsModel extends BaseDatabaseModel' admin/src/Model/SmextxmleditorsModel.php
          grep -q 'DirectoryIterator' admin/src/Model/SmextxmleditorsModel.php
          grep -q 'function getXMLFiles' admin/src/Model/SmextxmleditorsModel.php

          grep -q 'class SmextxmleditorController extends FormController' admin/src/Controller/SmextxmleditorController.php
          grep -q 'function save' admin/src/Controller/SmextxmleditorController.php
          grep -q 'checkToken' admin/src/Controller/SmextxmleditorController.php
          grep -q 'getInput' admin/src/Controller/SmextxmleditorController.php
          grep -q 'class SmextxmleditorsController extends SportsManagementAdminController' admin/src/Controller/SmextxmleditorsController.php

          grep -q "class_alias(SmextxmleditorModel::class, 'sportsmanagementModelsmextxmleditor')" admin/models/smextxmleditor.php
          grep -q "class_alias(SmextxmleditorsModel::class, 'sportsmanagementModelsmextxmleditors')" admin/models/smextxmleditors.php
          grep -q "class_alias(SmextxmleditorController::class, 'sportsmanagementControllersmextxmleditor')" admin/controllers/smextxmleditor.php
          grep -q "class_alias(SmextxmleditorsController::class, 'sportsmanagementControllersmextxmleditors')" admin/controllers/smextxmleditors.php

          grep -q '\$this->app->getInput()' admin/views/smextxmleditor/view.html.php
          grep -q '\$this->model->getXMLFiles' admin/views/smextxmleditors/view.html.php
          grep -q "HTMLHelper::_('form.token')" admin/views/smextxmleditor/tmpl/default.php

          if grep -E -- 'Joomla\\CMS\\Filesystem|->input|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|jsmoption' "${files[@]}"; then
            echo 'Extended XML editor regressed to a legacy MVC, input or filesystem API' >&2
            exit 1
          fi
