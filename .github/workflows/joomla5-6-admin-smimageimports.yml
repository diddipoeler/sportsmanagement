name: Joomla 5/6 administrator image imports migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  smimageimports:
    name: Native image package import checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate image import migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/SmimageimportModel.php
            admin/src/Model/SmimageimportsModel.php
            admin/src/Controller/SmimageimportController.php
            admin/src/Controller/SmimageimportsController.php
            admin/models/smimageimport.php
            admin/models/smimageimports.php
            admin/controllers/smimageimport.php
            admin/controllers/smimageimports.php
            admin/views/smimageimports/view.html.php
            admin/views/smimageimports/tmpl/default.php
            admin/views/smimageimports/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/smimageimport.xml

          grep -q 'class SmimageimportModel extends SportsManagementAdminModel' admin/src/Model/SmimageimportModel.php
          grep -q "\$config\['dbo'\] = \$this->getDatabase()" admin/src/Model/SmimageimportModel.php
          grep -q 'function import' admin/src/Model/SmimageimportModel.php
          grep -q 'HttpFactory::getHttp' admin/src/Model/SmimageimportModel.php
          grep -q 'https://sportsmanagement.fussballineuropa.de/jdownloads/' admin/src/Model/SmimageimportModel.php
          grep -q 'isSafeRelativePath' admin/src/Model/SmimageimportModel.php
          grep -q 'file_put_contents' admin/src/Model/SmimageimportModel.php
          grep -q 'Archive' admin/src/Model/SmimageimportModel.php
          grep -q '#__sportsmanagement_pictures' admin/src/Model/SmimageimportModel.php

          grep -q 'class SmimageimportsModel extends SportsManagementListModel' admin/src/Model/SmimageimportsModel.php
          for method in getXMLFolder getimagesxml getXMLFiles getListQuery
          do
            grep -q "function ${method}" admin/src/Model/SmimageimportsModel.php
          done
          grep -q 'HttpFactory::getHttp' admin/src/Model/SmimageimportsModel.php
          grep -q 'simplexml_load_string' admin/src/Model/SmimageimportsModel.php
          grep -q 'simplexml_load_file' admin/src/Model/SmimageimportsModel.php
          grep -q '\$orderMap\[\$ordering\]' admin/src/Model/SmimageimportsModel.php

          grep -q "class_alias(SmimageimportModel::class, 'sportsmanagementModelsmimageimport')" admin/models/smimageimport.php
          grep -q "class_alias(SmimageimportsModel::class, 'sportsmanagementModelsmimageimports')" admin/models/smimageimports.php
          grep -q "class_alias(SmimageimportController::class, 'sportsmanagementControllersmimageimport')" admin/controllers/smimageimport.php
          grep -q "class_alias(SmimageimportsController::class, 'sportsmanagementControllersmimageimports')" admin/controllers/smimageimports.php

          grep -q 'class SmimageimportController extends SportsManagementFormController' admin/src/Controller/SmimageimportController.php
          grep -q 'class SmimageimportsController extends SportsManagementAdminController' admin/src/Controller/SmimageimportsController.php
          grep -q "Session::checkToken('post')" admin/src/Controller/SmimageimportsController.php
          grep -q "authorise('core.create'" admin/src/Controller/SmimageimportsController.php

          grep -q '\$this->model->getimagesxml' admin/views/smimageimports/view.html.php
          grep -q '\$this->model->getXMLFiles' admin/views/smimageimports/view.html.php
          grep -q "smimageimports.import" admin/views/smimageimports/view.html.php
          grep -q "HTMLHelper::_('form.token')" admin/views/smimageimports/tmpl/default.php
          grep -q "loadTemplate('data')" admin/views/smimageimports/tmpl/default.php
          for field in picture folder directory file
          do
            grep -q "name=\"${field}\[" admin/views/smimageimports/tmpl/default_data.php
          done

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|JVERSION|version_compare\(|CURLOPT_SSL_VERIFYHOST|CURLOPT_SSL_VERIFYPEER|Joomla\\CMS\\Filesystem\\File' "${files[@]}"; then
            echo 'Image import migration regressed to a removed/deprecated or insecure legacy API' >&2
            exit 1
          fi
