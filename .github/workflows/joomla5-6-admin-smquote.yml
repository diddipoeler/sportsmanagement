name: Joomla 5/6 native quote table

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/SmquoteModel.php'
      - 'admin/src/Table/SmquoteTable.php'
      - 'admin/tables/smquote.php'
      - '.github/workflows/joomla5-6-admin-smquote.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/SmquoteModel.php'
      - 'admin/src/Table/SmquoteTable.php'
      - 'admin/tables/smquote.php'
      - '.github/workflows/joomla5-6-admin-smquote.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate quote table slice
        shell: bash
        run: |
          set -euo pipefail
          files=(admin/src/Model/SmquoteModel.php admin/src/Table/SmquoteTable.php admin/tables/smquote.php)
          for file in "${files[@]}"; do php -l "$file"; done
          grep -Fq 'new SmquoteTable($this->getDatabase())' admin/src/Model/SmquoteModel.php
          grep -Fq "parent::__construct('#__sportsmanagement_rquote', 'id', \$db)" admin/src/Table/SmquoteTable.php
          grep -Fq "class_alias(SmquoteTable::class, 'sportsmanagementTablesmquote')" admin/tables/smquote.php
          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Joomla\\CMS\\Filesystem\\(File|Folder|Path)|Joomla\\CMS\\Http\\|Table::getInstance\('
          if grep -ER "$legacy_re" "${files[@]}"; then
            echo 'Quote slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
