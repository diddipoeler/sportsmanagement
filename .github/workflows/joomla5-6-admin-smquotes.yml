name: Joomla 5/6 administrator quote migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  smquotes:
    name: Native quote model and controller checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate quote migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/SmquoteModel.php
            admin/src/Model/SmquotesModel.php
            admin/src/Controller/SmquoteController.php
            admin/src/Controller/SmquotesController.php
            admin/models/smquote.php
            admin/models/smquotes.php
            admin/controllers/smquote.php
            admin/controllers/smquotes.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/smquote.xml

          grep -q 'class SmquoteModel extends SportsManagementAdminModel' admin/src/Model/SmquoteModel.php
          grep -q 'models/forms' admin/src/Model/SmquoteModel.php
          grep -q 'function prepareSportsManagementData' admin/src/Model/SmquoteModel.php
          grep -q 'function afterSportsManagementSave' admin/src/Model/SmquoteModel.php
          grep -q "quoteName('#__sportsmanagement_rquote')" admin/src/Model/SmquoteModel.php
          grep -q "quoteName('author')" admin/src/Model/SmquoteModel.php
          grep -q "quoteName('picture')" admin/src/Model/SmquoteModel.php

          grep -q 'class SmquotesModel extends SportsManagementListModel' admin/src/Model/SmquotesModel.php
          grep -q "quoteName('#__sportsmanagement_rquote', 'obj')" admin/src/Model/SmquotesModel.php
          grep -q "quoteName('#__categories', 'c')" admin/src/Model/SmquotesModel.php
          grep -q 'function getListQuery' admin/src/Model/SmquotesModel.php

          grep -q 'class SmquoteController extends SportsManagementFormController' admin/src/Controller/SmquoteController.php
          grep -q 'class SmquotesController extends SportsManagementAdminController' admin/src/Controller/SmquotesController.php
          grep -q 'function edittxt' admin/src/Controller/SmquotesController.php
          grep -q "getModel(\$name = 'Smquote'" admin/src/Controller/SmquotesController.php

          grep -q "class_alias(SmquoteModel::class, 'sportsmanagementModelsmquote')" admin/models/smquote.php
          grep -q "class_alias(SmquotesModel::class, 'sportsmanagementModelsmquotes')" admin/models/smquotes.php
          grep -q "class_alias(SmquoteController::class, 'sportsmanagementControllersmquote')" admin/controllers/smquote.php
          grep -q "class_alias(SmquotesController::class, 'sportsmanagementControllersmquotes')" admin/controllers/smquotes.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput|sportsmanagementModeldatabasetool|INSERT IGNORE' "${files[@]}"; then
            echo 'Quote migration regressed to a removed Joomla or legacy MVC/database API' >&2
            exit 1
          fi
