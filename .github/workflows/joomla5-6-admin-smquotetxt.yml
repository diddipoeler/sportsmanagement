name: Joomla 5/6 administrator quote text editor migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  smquotetxt:
    name: Native quote text editor checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate quote text editor migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/SmquotetxtModel.php
            admin/src/Model/SmquotestxtModel.php
            admin/src/Controller/SmquotetxtController.php
            admin/models/smquotetxt.php
            admin/models/smquotestxt.php
            admin/controllers/smquotetxt.php
            admin/views/smquotetxt/view.html.php
            admin/views/smquotestxt/view.html.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/smquotetxt.xml

          grep -q 'class SmquotetxtModel extends AdminModel' admin/src/Model/SmquotetxtModel.php
          grep -q 'models/forms' admin/src/Model/SmquotetxtModel.php
          grep -q 'function getSource' admin/src/Model/SmquotetxtModel.php
          grep -q 'file_get_contents' admin/src/Model/SmquotetxtModel.php
          grep -q 'file_put_contents' admin/src/Model/SmquotetxtModel.php
          grep -q 'basename' admin/src/Model/SmquotetxtModel.php
          grep -q 'pathinfo' admin/src/Model/SmquotetxtModel.php

          grep -q 'class SmquotestxtModel extends BaseDatabaseModel' admin/src/Model/SmquotestxtModel.php
          grep -q 'DirectoryIterator' admin/src/Model/SmquotestxtModel.php
          grep -q 'function getTXTFiles' admin/src/Model/SmquotestxtModel.php

          grep -q 'class SmquotetxtController extends FormController' admin/src/Controller/SmquotetxtController.php
          grep -q 'function save' admin/src/Controller/SmquotetxtController.php
          grep -q 'checkToken' admin/src/Controller/SmquotetxtController.php
          grep -q 'getInput' admin/src/Controller/SmquotetxtController.php

          grep -q "class_alias(SmquotetxtModel::class, 'sportsmanagementModelsmquotetxt')" admin/models/smquotetxt.php
          grep -q "class_alias(SmquotestxtModel::class, 'sportsmanagementModelsmquotestxt')" admin/models/smquotestxt.php
          grep -q "class_alias(SmquotetxtController::class, 'sportsmanagementControllersmquotetxt')" admin/controllers/smquotetxt.php
          grep -q '\$this->model->getTXTFiles' admin/views/smquotestxt/view.html.php
          grep -q '\$this->app->getInput()' admin/views/smquotetxt/view.html.php

          if grep -E -- 'Joomla\\CMS\\Filesystem|->input|BaseDatabaseModel::getInstance\(|jimport\(|JLoader::import\(|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmjinput' "${files[@]}"; then
            echo 'Quote text editor regressed to a legacy MVC, input or filesystem API' >&2
            exit 1
          fi
