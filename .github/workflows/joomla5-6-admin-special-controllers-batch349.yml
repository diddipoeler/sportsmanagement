name: Joomla 5/6 admin special controllers batch 349

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/controllers/extrafield.php'
      - 'admin/controllers/playground.php'
      - 'admin/controllers/projectteam.php'
      - 'admin/controllers/currentseason.php'
      - 'admin/controllers/smimageimport.php'
      - 'admin/controllers/rosterposition.php'
      - 'admin/controllers/projectposition.php'
      - 'admin/controllers/teamplayer.php'
      - 'admin/controllers/treeto.php'
      - '.github/workflows/joomla5-6-admin-special-controllers-batch349.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/controllers/extrafield.php'
      - 'admin/controllers/playground.php'
      - 'admin/controllers/projectteam.php'
      - 'admin/controllers/currentseason.php'
      - 'admin/controllers/smimageimport.php'
      - 'admin/controllers/rosterposition.php'
      - 'admin/controllers/projectposition.php'
      - 'admin/controllers/teamplayer.php'
      - 'admin/controllers/treeto.php'
      - '.github/workflows/joomla5-6-admin-special-controllers-batch349.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator special controller bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/controllers/extrafield.php
            admin/controllers/playground.php
            admin/controllers/projectteam.php
            admin/controllers/currentseason.php
            admin/controllers/smimageimport.php
            admin/controllers/rosterposition.php
            admin/controllers/projectposition.php
            admin/controllers/teamplayer.php
            admin/controllers/treeto.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
            grep -Fq -- 'class_alias(' "$file"
            grep -Fq -- 'throw new \\RuntimeException' "$file"
          done
