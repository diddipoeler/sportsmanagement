name: Joomla 5/6 administrator special views

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  native-special-views:
    name: Native Google calendar and image import views
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint migrated PHP paths
        shell: bash
        run: |
          files=(
            admin/src/View/Jsmgcalendarimport/HtmlView.php
            admin/tmpl/jsmgcalendarimport/login.php
            admin/src/View/Smimageimports/HtmlView.php
            admin/tmpl/smimageimports/default.php
            admin/tmpl/smimageimports/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Guard native view boundaries
        shell: bash
        run: |
          calendar_files=(
            admin/src/View/Jsmgcalendarimport/HtmlView.php
            admin/tmpl/jsmgcalendarimport/login.php
          )
          if grep -E 'LegacyBootstrap|class_alias|sportsmanagementView|sportsmanagementHelper|JLoader|require_once .*views/jsmgcalendarimport' "${calendar_files[@]}"; then
            echo 'Google calendar import view regressed to legacy presentation code' >&2
            exit 1
          fi

          image_files=(
            admin/src/View/Smimageimports/HtmlView.php
            admin/tmpl/smimageimports/default.php
            admin/tmpl/smimageimports/default_data.php
          )
          if grep -E 'LegacyBootstrap|class_alias|sportsmanagementView|sportsmanagementHelper::addTemplatePaths|JLoader|require_once .*views/smimageimports' "${image_files[@]}"; then
            echo 'Image import view regressed to legacy presentation code' >&2
            exit 1
          fi

          grep -q "setLayout('login')" admin/src/View/Jsmgcalendarimport/HtmlView.php
          grep -q "jsmgcalendarimport.import" admin/tmpl/jsmgcalendarimport/login.php
          grep -q "behavior.formvalidator" admin/tmpl/jsmgcalendarimport/login.php
          grep -q "SmimageimportsModel" admin/src/View/Smimageimports/HtmlView.php
          grep -q "getimagesxml" admin/src/View/Smimageimports/HtmlView.php
          grep -q "getXMLFiles" admin/src/View/Smimageimports/HtmlView.php
          grep -q "loadTemplate('data')" admin/tmpl/smimageimports/default.php
