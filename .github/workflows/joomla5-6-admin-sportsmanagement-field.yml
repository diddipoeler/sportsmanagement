name: Joomla 5/6 administrator SportsManagement field gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/SportsmanagementField.php'
      - 'admin/src/Field/SportsManagementListField.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/models/fields/sportsmanagement.php'
      - '.github/workflows/joomla5-6-admin-sportsmanagement-field.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/SportsmanagementField.php'
      - 'admin/src/Field/SportsManagementListField.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/models/fields/sportsmanagement.php'
      - '.github/workflows/joomla5-6-admin-sportsmanagement-field.yml'

jobs:
  sportsmanagement-field:
    name: Native SportsManagement field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native field and bridge
        shell: bash
        run: |
          set -euo pipefail

          field=admin/src/Field/SportsmanagementField.php
          base=admin/src/Field/SportsManagementListField.php
          resolver=admin/src/Helper/SportsManagementDatabaseResolver.php
          bridge=admin/models/fields/sportsmanagement.php
          files=("$field" "$base" "$resolver" "$bridge")

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'final class SportsmanagementField extends SportsManagementListField' "$field"
          grep -q "protected \$type = 'sportsmanagement'" "$field"
          grep -q '#__sportsmanagement' "$field"
          grep -q '#__categories' "$field"
          grep -q 'getSportsManagementDatabase()' "$field"
          grep -q 'getQuery(true)' "$field"
          grep -q "class_alias(SportsmanagementField::class, 'JFormFieldsportsmanagement')" "$bridge"

          if grep -E -- 'sportsmanagementHelper::|JFormFieldList|FormHelper::|JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|createQuery\(|JVERSION|version_compare\(|->input' "$field" "$bridge"; then
            echo 'SportsManagement selector field regressed to a legacy Joomla/database API' >&2
            exit 1
          fi
