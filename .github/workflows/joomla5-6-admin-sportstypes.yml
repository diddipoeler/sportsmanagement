name: Joomla 5/6 administrator sportstypes migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-sportstypes:
    name: Native administrator sportstypes checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sportstypes migration
        shell: bash
        run: |
          set -euo pipefail

          model=admin/src/Model/SportstypesModel.php
          bridge=admin/models/sportstypes.php

          test -f "$model"
          test -f "$bridge"
          php -l "$model"
          php -l "$bridge"
          php -l admin/src/Model/SportsManagementListModel.php

          grep -q 'class SportstypesModel extends SportsManagementListModel' "$model"
          grep -q "class_alias(SportstypesModel::class, 'sportsmanagementModelSportsTypes')" "$bridge"

          for method in getSportsTypes getProjectsCount getPlaygroundsOnlyCount getLeaguesOnlyCount getPersonsOnlyCount getClubsOnlyCount getLeaguesCount getSeasonsOnlyCount getSeasonsCount getProjectTeamsCount getProjectTeamsPlayersCount getProjectDivisionsCount getProjectRoundsCount getProjectMatchesCount getProjectMatchesEventsNameCount getProjectMatchesEventsCount getProjectMatchesStatsCount; do
            grep -q "function ${method}" "$model"
          done

          grep -q "COUNT(DISTINCT ' . \$db->quoteName('p.league_id')" "$model"
          grep -q "COUNT(DISTINCT ' . \$db->quoteName('p.season_id')" "$model"
          grep -q "where(\$db->quoteName('p.sports_type_id')" "$model"
          grep -q "group(\[" "$model"
          grep -q "quoteName('me.event_type_id')" "$model"

          if grep -E -- 'extends JSMModelList|->setDbo\(|->getDbo\(|Factory::getDbo\(|Factory::getUser\(|->input|jimport\(|JLoader::import\(|disconnect\(|sportsmanagementModelSportsTypes' "$model"; then
            echo 'Native Sportstypes model regressed to a legacy model or Joomla API' >&2
            exit 1
          fi
