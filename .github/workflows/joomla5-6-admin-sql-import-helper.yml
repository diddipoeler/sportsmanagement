name: Joomla 5/6 administrator SQL import helper

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Helper/SqlImportHelper.php'
      - '.github/workflows/joomla5-6-admin-sql-import-helper.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Helper/SqlImportHelper.php'
      - '.github/workflows/joomla5-6-admin-sql-import-helper.yml'

jobs:
  sql-import-helper:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SQL import helper
        shell: bash
        run: |
          set -euo pipefail

          helper=admin/src/Helper/SqlImportHelper.php

          php -l "$helper"
          grep -Fq 'use Joomla\Filesystem\File;' "$helper"
          grep -Fq 'File::read(' "$helper"
          grep -Fq 'Installer::splitSql(' "$helper"
          grep -Fq 'DatabaseInterface' "$helper"

          if grep -E 'Joomla\\CMS\\Filesystem\\File|file_get_contents\(|Factory::get(Dbo|DBO)\(|jimport\(' "$helper"; then
            echo 'SQL import helper regressed to a direct/deprecated Joomla filesystem/database API.' >&2
            exit 1
          fi
