name: Joomla 5/6 administrator statistics runtime batch 455

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/statistics/base.php'
      - 'admin/statistics/basic.php'
      - 'admin/statistics/pergame.php'
      - 'admin/statistics/sumstats.php'
      - '.github/workflows/joomla5-6-admin-statistics-runtime-batch455.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/statistics/base.php'
      - 'admin/statistics/basic.php'
      - 'admin/statistics/pergame.php'
      - 'admin/statistics/sumstats.php'
      - '.github/workflows/joomla5-6-admin-statistics-runtime-batch455.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator statistics runtime
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/statistics/base.php
            admin/statistics/basic.php
            admin/statistics/pergame.php
            admin/statistics/sumstats.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            ! grep -Fq -- 'Factory::getApplication' "$file"
            ! grep -Fq -- 'JLoader::import' "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
          grep -Fq -- 'SportsManagementAdministratorApplicationResolver::resolve()' admin/statistics/base.php
          grep -Fq -- 'function application()' admin/statistics/base.php
          for file in admin/statistics/basic.php admin/statistics/pergame.php admin/statistics/sumstats.php; do
            grep -Fq -- 'is_file($baseStatistic)' "$file"
            grep -Fq -- 'SMStatistic::application()' "$file" || true
          done
