name: Joomla 5/6 administrator statistics view

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/statistics/view.html.php'
      - 'admin/src/Table/StatisticTable.php'
      - 'admin/src/Model/SportstypesModel.php'
      - '.github/workflows/joomla5-6-admin-statistics-view.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/views/statistics/view.html.php'
      - 'admin/src/Table/StatisticTable.php'
      - 'admin/src/Model/SportstypesModel.php'
      - '.github/workflows/joomla5-6-admin-statistics-view.yml'

jobs:
  statistics-view:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate native statistics view dependencies
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/views/statistics/view.html.php
            admin/src/Table/StatisticTable.php
            admin/src/Model/SportstypesModel.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          view=admin/views/statistics/view.html.php
          grep -Fq 'new StatisticTable($this->model->getDatabase())' "$view"
          grep -Fq "bootComponent('com_sportsmanagement')->getMVCFactory()" "$view"
          grep -Fq "createModel('Sportstypes', 'Administrator')" "$view"

          legacy_re='BaseDatabaseModel::getInstance\(|Table::getInstance\(|jimport\(|JLoader::|Factory::getDbo\(|Factory::getDBO\('
          if grep -E "$legacy_re" "$view"; then
            echo 'Statistics view regressed to a removed/deprecated Joomla API' >&2
            exit 1
          fi
