name: Joomla 5/6 administrator table bridge loaders batch 423

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tables/team.php'
      - 'admin/tables/club.php'
      - 'admin/tables/match.php'
      - 'admin/tables/round.php'
      - 'admin/tables/season.php'
      - 'admin/tables/player.php'
      - '.github/workflows/joomla5-6-admin-table-bridge-loaders-batch423.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/tables/team.php'
      - 'admin/tables/club.php'
      - 'admin/tables/match.php'
      - 'admin/tables/round.php'
      - 'admin/tables/season.php'
      - 'admin/tables/player.php'
      - '.github/workflows/joomla5-6-admin-table-bridge-loaders-batch423.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator table bridge loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/tables/team.php
            admin/tables/club.php
            admin/tables/match.php
            admin/tables/round.php
            admin/tables/season.php
            admin/tables/player.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'is_file($nativeTable)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
          done
