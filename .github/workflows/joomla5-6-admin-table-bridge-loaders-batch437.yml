name: Joomla 5/6 administrator table bridge loaders batch 437

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tables/pictures.php'
      - 'admin/tables/teamstaff.php'
      - 'admin/tables/matchevent.php'
      - 'admin/tables/matchstaff.php'
      - 'admin/tables/teamplayer.php'
      - 'admin/tables/seasonteam.php'
      - '.github/workflows/joomla5-6-admin-table-bridge-loaders-batch437.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/tables/pictures.php'
      - 'admin/tables/teamstaff.php'
      - 'admin/tables/matchevent.php'
      - 'admin/tables/matchstaff.php'
      - 'admin/tables/teamplayer.php'
      - 'admin/tables/seasonteam.php'
      - '.github/workflows/joomla5-6-admin-table-bridge-loaders-batch437.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator table bridge loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/tables/pictures.php
            admin/tables/teamstaff.php
            admin/tables/matchevent.php
            admin/tables/matchstaff.php
            admin/tables/teamplayer.php
            admin/tables/seasonteam.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'is_file($nativeTable)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
            ! grep -Fq -- 'require_once JPATH_ADMINISTRATOR' "$file"
          done
