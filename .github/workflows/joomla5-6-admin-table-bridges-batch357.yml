name: Joomla 5/6 admin table bridges batch 357

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tables/projectreferee.php'
      - 'admin/tables/predictiongroup.php'
      - 'admin/tables/predictionround.php'
      - 'admin/tables/jlextfederation.php'
      - 'admin/tables/projectteam.php'
      - 'admin/tables/matchreferee.php'
      - 'admin/tables/seasonteamperson.php'
      - 'admin/tables/playground.php'
      - 'admin/tables/clubname.php'
      - 'admin/tables/eventtype.php'
      - '.github/workflows/joomla5-6-admin-table-bridges-batch357.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/tables/projectreferee.php'
      - 'admin/tables/predictiongroup.php'
      - 'admin/tables/predictionround.php'
      - 'admin/tables/jlextfederation.php'
      - 'admin/tables/projectteam.php'
      - 'admin/tables/matchreferee.php'
      - 'admin/tables/seasonteamperson.php'
      - 'admin/tables/playground.php'
      - 'admin/tables/clubname.php'
      - 'admin/tables/eventtype.php'
      - '.github/workflows/joomla5-6-admin-table-bridges-batch357.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate administrator table bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/tables/projectreferee.php
            admin/tables/predictiongroup.php
            admin/tables/predictionround.php
            admin/tables/jlextfederation.php
            admin/tables/projectteam.php
            admin/tables/matchreferee.php
            admin/tables/seasonteamperson.php
            admin/tables/playground.php
            admin/tables/clubname.php
            admin/tables/eventtype.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
            grep -Fq -- 'class_alias(' "$file"
            grep -Fq -- 'throw new \\RuntimeException' "$file"
          done
