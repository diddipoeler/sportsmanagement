name: Joomla 5/6 Admin Tables Gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Table/**'
      - 'admin/tables/clubname.php'
      - 'admin/tables/template.php'
      - 'admin/tables/eventtype.php'
      - 'admin/tables/position.php'
      - 'admin/tables/statistic.php'
      - 'admin/tables/division.php'
      - 'admin/tables/match.php'
      - '.github/workflows/joomla5-6-admin-tables-gate.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Table/**'
      - 'admin/tables/clubname.php'
      - 'admin/tables/template.php'
      - 'admin/tables/eventtype.php'
      - 'admin/tables/position.php'
      - 'admin/tables/statistic.php'
      - 'admin/tables/division.php'
      - 'admin/tables/match.php'
      - '.github/workflows/joomla5-6-admin-tables-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate migrated administrator tables
        shell: bash
        run: |
          set -euo pipefail

          pairs=(
            'clubname:ClubnameTable:sportsmanagementTableclubname'
            'template:TemplateTable:sportsmanagementTableTemplate'
            'eventtype:EventtypeTable:sportsmanagementTableEventtype'
            'position:PositionTable:sportsmanagementTablePosition'
            'statistic:StatisticTable:sportsmanagementTableStatistic'
            'division:DivisionTable:sportsmanagementTableDivision'
            'match:MatchTable:sportsmanagementTableMatch'
          )

          for spec in "${pairs[@]}"; do
            IFS=: read -r legacy native alias <<< "$spec"
            bridge="admin/tables/${legacy}.php"
            table="admin/src/Table/${native}.php"

            test -f "$bridge"
            test -f "$table"
            php -l "$bridge"
            php -l "$table"

            grep -Fq "use Diddipoeler\\Component\\SportsManagement\\Administrator\\Table\\${native};" "$bridge"
            grep -Fq "class_alias(${native}::class, '${alias}')" "$bridge"
            grep -Fq "class ${native} extends SportsManagementTable" "$table" || \
              grep -Fq "final class ${native} extends SportsManagementTable" "$table"
            grep -Fq 'DatabaseInterface $db' "$table"

            if grep -REn 'sportsmanagementHelper::getDBConnection|getDBConnection\(|Factory::getDbo\(|Factory::getDBO\(|JDatabaseDriver|->disconnect\(' "$bridge" "$table"; then
              echo "Administrator table ${legacy} regressed to a legacy database bootstrap." >&2
              exit 1
            fi
          done

          grep -Fq "#__sportsmanagement_club_names" admin/src/Table/ClubnameTable.php
          grep -Fq "#__sportsmanagement_template_config" admin/src/Table/TemplateTable.php
          grep -Fq "#__sportsmanagement_eventtype" admin/src/Table/EventtypeTable.php
          grep -Fq "#__sportsmanagement_position" admin/src/Table/PositionTable.php
          grep -Fq "#__sportsmanagement_statistic" admin/src/Table/StatisticTable.php
          grep -Fq "#__sportsmanagement_division" admin/src/Table/DivisionTable.php
          grep -Fq "#__sportsmanagement_match" admin/src/Table/MatchTable.php

          grep -Fq 'OutputFilter::stringURLSafe' admin/src/Table/EventtypeTable.php
          grep -Fq 'OutputFilter::stringURLSafe' admin/src/Table/PositionTable.php
          grep -Fq 'OutputFilter::stringURLSafe' admin/src/Table/StatisticTable.php
          grep -Fq 'OutputFilter::stringURLSafe' admin/src/Table/DivisionTable.php
          grep -Fq 'strtoupper(substr' admin/src/Table/StatisticTable.php
          grep -Fq 'team1_result_decision' admin/src/Table/MatchTable.php
          grep -Fq 'team2_result_decision' admin/src/Table/MatchTable.php
