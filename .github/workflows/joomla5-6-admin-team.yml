name: Joomla 5/6 administrator team migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/src/Model/TeamModel.php'
      - 'admin/src/Table/TeamTable.php'
      - 'admin/tables/team.php'
      - 'admin/views/team/view.html.php'
      - '.github/workflows/joomla5-6-admin-team.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/src/Model/TeamModel.php'
      - 'admin/src/Table/TeamTable.php'
      - 'admin/tables/team.php'
      - 'admin/views/team/view.html.php'
      - '.github/workflows/joomla5-6-admin-team.yml'

jobs:
  team:
    name: Native team model checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate team migration
        shell: bash
        run: |
          set -euo pipefail

          resolver=admin/src/Helper/SportsManagementDatabaseResolver.php
          extrahelper=admin/src/Helper/ExtraFieldsSaveHelper.php
          model=admin/src/Model/TeamModel.php
          table=admin/src/Table/TeamTable.php
          bridge=admin/tables/team.php
          view=admin/views/team/view.html.php
          files=("$resolver" "$extrahelper" "$model" "$table" "$bridge")

          for file in "${files[@]}" "$view"; do
            test -f "$file"
            php -l "$file"
          done

          # Native model keeps the Joomla 5-compatible query API throughout.
          grep -q 'final class TeamModel extends SportsManagementAdminModel' "$model"
          grep -q 'getQuery(true)' "$model"
          grep -q 'ExtraFieldsSaveHelper' "$model"
          grep -q 'new ExtraFieldsSaveHelper' "$model"
          grep -q 'save($post, $id, $this->getDatabase())' "$model"
          for method in saveshort copySelected copysave getTeamLogo getTeam DeleteTrainigData UpdateTrainigData getTrainigData addNewTrainigData; do
            grep -q "function ${method}" "$model"
          done
          grep -q '#__sportsmanagement_team_trainingdata' "$model"
          grep -q '#__sportsmanagement_season_team_id' "$model"

          # Extra-field persistence is isolated from the historic monolithic helper.
          grep -q 'final class ExtraFieldsSaveHelper' "$extrahelper"
          grep -q 'SportsManagementDatabaseResolver' "$extrahelper"
          grep -q '#__sportsmanagement_user_extra_fields_values' "$extrahelper"
          grep -q "fieldId === 34" "$extrahelper"
          grep -q "fieldId === 69" "$extrahelper"
          grep -q "task === 'save2copy'" "$extrahelper"
          grep -q 'getQuery(true)' "$extrahelper"

          # Team table owns the historic normalization and validation rules.
          grep -q 'final class TeamTable extends SportsManagementTable' "$table"
          grep -q 'COM_SPORTSMANAGEMENT_GLOBAL_NAME_REQUIRED' "$table"
          grep -q 'middle_name' "$table"
          grep -q 'short_name' "$table"
          grep -q 'OutputFilter::stringURLSafe' "$table"

          # Legacy table entry point remains an alias-only bridge.
          grep -q "class_alias(TeamTable::class, 'sportsmanagementTableTeam')" "$bridge"

          # The optional external SportsManagement database stays centralized.
          grep -q 'final class SportsManagementDatabaseResolver' "$resolver"
          grep -q 'Factory::getContainer()->get(DatabaseInterface::class)' "$resolver"
          grep -q 'getQuery(true)' "$resolver"

          # The active edit view reads request data through the injected application.
          grep -q '\$this->app->getInput()' "$view"
          grep -q 'checkUserExtraFields' "$view"
          grep -q 'getUserExtraFields' "$view"

          if grep -E -- 'Factory::getApplication\(\)->input|Factory::getUser\(|Factory::getURI\(|\$app->input' "$view"; then
            echo 'Team view regressed to a legacy global application/input API' >&2
            exit 1
          fi

          if grep -E -- 'createQuery\(|sportsmanagementHelper::|helpers/sportsmanagement\.php|JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|->input|JDatabaseDriver::|JDatabase::' "${files[@]}"; then
            echo 'Team migration regressed to a Joomla 6-only query API or legacy helper/database API' >&2
            exit 1
          fi
