name: Joomla 5/6 administrator team players migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  teamplayers:
    name: Native team players checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate team players migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/TeamplayerModel.php
            admin/src/Model/TeamplayersModel.php
            admin/src/Controller/TeamplayerController.php
            admin/src/Controller/TeamplayersController.php
            admin/models/teamplayer.php
            admin/models/teamplayers.php
            admin/controllers/teamplayer.php
            admin/controllers/teamplayers.php
            admin/views/teamplayer/view.html.php
            admin/views/teamplayers/view.html.php
            admin/views/teamplayers/tmpl/default.php
            admin/views/teamplayers/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/teamplayer.xml
          test -f admin/tables/teamplayer.php
          test -f admin/src/Service/ProjectRelationService.php

          grep -q 'class TeamplayerModel extends SportsManagementAdminModel' admin/src/Model/TeamplayerModel.php
          grep -q "\$config\['dbo'\] = \$this->getDatabase()" admin/src/Model/TeamplayerModel.php
          for method in assignplayerscountry set_state saveshort delete save getPerson getProject getProjectPositions
          do
            grep -q "function ${method}" admin/src/Model/TeamplayerModel.php
          done
          grep -q 'transactionStart' admin/src/Model/TeamplayerModel.php
          grep -q '#__sportsmanagement_match_player' admin/src/Model/TeamplayerModel.php
          grep -q '#__sportsmanagement_match_staff' admin/src/Model/TeamplayerModel.php
          grep -q '#__sportsmanagement_person_project_position' admin/src/Model/TeamplayerModel.php

          grep -q 'class TeamplayersModel extends SportsManagementListModel' admin/src/Model/TeamplayersModel.php
          grep -q 'ProjectRelationService' admin/src/Model/TeamplayersModel.php
          for method in getProjectContext getTeamContext getProjectPositionOptions getprojectpublished getprojectposition PersonProjectPosition checkProjectPositions saveShort setRelationState assignPlayersCountry deleteRelations getTeamplayersMatch getProjectTeamplayers
          do
            grep -q "function ${method}" admin/src/Model/TeamplayersModel.php
          done
          grep -q 'loadValidatedRelation' admin/src/Model/TeamplayersModel.php
          grep -q 'transactionStart' admin/src/Model/TeamplayersModel.php
          grep -q '#__sportsmanagement_season_team_person_id' admin/src/Model/TeamplayersModel.php

          grep -q 'class TeamplayerController extends SportsManagementFormController' admin/src/Controller/TeamplayerController.php
          grep -q 'class TeamplayersController extends SportsManagementAdminController' admin/src/Controller/TeamplayersController.php
          for method in saveshort assignplayerscountry delete publish unpublish archive trash assignpersonsclub
          do
            grep -q "function ${method}" admin/src/Controller/TeamplayersController.php
          done
          grep -q "Session::checkToken('post')" admin/src/Controller/TeamplayersController.php
          grep -q "assertPostAndPermission('core.edit')" admin/src/Controller/TeamplayersController.php
          grep -q "assertPostAndPermission('core.delete')" admin/src/Controller/TeamplayersController.php
          grep -q "assertPostAndPermission('core.edit.state')" admin/src/Controller/TeamplayersController.php

          grep -q "class_alias(TeamplayerModel::class, 'sportsmanagementModelteamplayer')" admin/models/teamplayer.php
          grep -q "class_alias(TeamplayersModel::class, 'sportsmanagementModelteamplayers')" admin/models/teamplayers.php
          grep -q "class_alias(TeamplayerController::class, 'sportsmanagementControllerteamplayer')" admin/controllers/teamplayer.php
          grep -q "class_alias(TeamplayersController::class, 'sportsmanagementControllerteamplayers')" admin/controllers/teamplayers.php

          grep -q '\$this->model->getProject' admin/views/teamplayer/view.html.php
          grep -q '\$this->model->getPerson' admin/views/teamplayer/view.html.php
          grep -q '\$this->model->getProjectContext' admin/views/teamplayers/view.html.php
          grep -q '\$this->model->getTeamContext' admin/views/teamplayers/view.html.php
          grep -q '\$this->model->getProjectPositionOptions' admin/views/teamplayers/view.html.php
          grep -q "loadTemplate('data')" admin/views/teamplayers/tmpl/default.php
          grep -q "HTMLHelper::_('form.token')" admin/views/teamplayers/tmpl/default.php
          grep -Fq 'name="cid[]"' admin/views/teamplayers/tmpl/default_data.php
          grep -Fq 'name="project_position_id[<?php echo $relationId; ?>]"' admin/views/teamplayers/tmpl/default_data.php
          grep -Fq 'name="jerseynumber[<?php echo $relationId; ?>]"' admin/views/teamplayers/tmpl/default_data.php
          grep -Fq 'name="project_published[<?php echo $relationId; ?>]"' admin/views/teamplayers/tmpl/default_data.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|JVERSION|version_compare\(|JEventDispatcher|SqueezeBox|behavior\.mootools|behavior\.framework' "${files[@]}"; then
            echo 'Team players migration regressed to a removed/deprecated legacy API' >&2
            exit 1
          fi
