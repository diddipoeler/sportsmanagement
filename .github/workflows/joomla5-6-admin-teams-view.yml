name: Joomla 5/6 admin teams view

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/View/Teams/**'
      - 'admin/views/teams/view.html.php'
      - '.github/workflows/joomla5-6-admin-teams-view.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/View/Teams/**'
      - 'admin/views/teams/view.html.php'
      - '.github/workflows/joomla5-6-admin-teams-view.yml'

jobs:
  teams-view:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint teams views
        run: |
          php -l admin/src/View/Teams/HtmlView.php
          php -l admin/views/teams/view.html.php
      - name: Validate native teams view bridge
        shell: bash
        run: |
          native=admin/src/View/Teams/HtmlView.php
          legacy=admin/views/teams/view.html.php

          grep -Fq 'final class HtmlView extends BaseHtmlView' "$native"
          grep -Fq "ToolbarHelper::custom('teams.copysave'" "$native"
          grep -Fq "ToolbarHelper::custom('team.import'" "$native"
          grep -Fq "ToolbarHelper::archiveList('team.export'" "$native"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewTeams')" "$legacy"

          if grep -E 'BaseDatabaseModel::getInstance\(|Table::getInstance\(|JHtmlSelect::|JLoader::|jimport\(' "$legacy"; then
            echo 'Admin Teams legacy entry still executes legacy model/table APIs' >&2
            exit 1
          fi
