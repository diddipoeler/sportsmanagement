name: Joomla 5/6 administrator team staff migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  teamstaff:
    name: Native team staff model checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate team staff migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/TeamstaffModel.php
            admin/src/Model/TeamstaffsModel.php
            admin/models/teamstaff.php
            admin/models/teamstaffs.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/teamstaff.xml
          test -f admin/tables/teamstaff.php
          php -r "libxml_use_internal_errors(true); exit(simplexml_load_file('admin/models/forms/teamstaff.xml') ? 0 : 1);"

          grep -q 'class TeamstaffModel extends SportsManagementAdminModel' admin/src/Model/TeamstaffModel.php
          grep -q 'models/forms' admin/src/Model/TeamstaffModel.php
          grep -q "getTable(\$type = 'teamstaff'" admin/src/Model/TeamstaffModel.php
          grep -q 'function saveshort' admin/src/Model/TeamstaffModel.php
          grep -q 'function saveorder' admin/src/Model/TeamstaffModel.php
          grep -q 'function delete' admin/src/Model/TeamstaffModel.php
          grep -q 'function prepareSportsManagementData' admin/src/Model/TeamstaffModel.php
          grep -q 'transactionStart' admin/src/Model/TeamstaffModel.php
          grep -q "delete(\$db->quoteName(\$table))" admin/src/Model/TeamstaffModel.php
          grep -q '#__sportsmanagement_match_staff_statistic' admin/src/Model/TeamstaffModel.php

          grep -q 'class TeamstaffsModel extends SportsManagementListModel' admin/src/Model/TeamstaffsModel.php
          grep -q 'COM_SPORTSMANAGEMENT_USE_NEW_TABLE' admin/src/Model/TeamstaffsModel.php
          grep -q '#__sportsmanagement_season_team_person_id' admin/src/Model/TeamstaffsModel.php
          grep -q '#__sportsmanagement_team_staff' admin/src/Model/TeamstaffsModel.php
          grep -q 'ts.persontype' admin/src/Model/TeamstaffsModel.php
          grep -q 'function remove' admin/src/Model/TeamstaffsModel.php
          grep -q 'transactionStart' admin/src/Model/TeamstaffsModel.php

          grep -q "class_alias(TeamstaffModel::class, 'sportsmanagementModelteamstaff')" admin/models/teamstaff.php
          grep -q "class_alias(TeamstaffsModel::class, 'sportsmanagementModelTeamStaffs')" admin/models/teamstaffs.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|JString::|DELETE[[:space:]]+mp,[[:space:]]*ms|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Team staff migration regressed to a removed/deprecated Joomla or legacy database API' >&2
            exit 1
          fi
