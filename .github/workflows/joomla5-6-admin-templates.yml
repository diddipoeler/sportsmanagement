name: Joomla 5/6 administrator project templates migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  templates:
    name: Native project template model/controller/view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project templates migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/TemplateModel.php
            admin/src/Model/TemplatesModel.php
            admin/src/Controller/TemplateController.php
            admin/src/Controller/TemplatesController.php
            admin/models/template.php
            admin/models/templates.php
            admin/controllers/template.php
            admin/controllers/templates.php
            admin/views/template/view.html.php
            admin/views/templates/view.html.php
            admin/views/templates/tmpl/default.php
            admin/views/templates/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/forms/filter_templates.xml
          test -f admin/tables/template.php
          php -r "libxml_use_internal_errors(true); exit(simplexml_load_file('admin/forms/filter_templates.xml') ? 0 : 1);"

          grep -q 'class TemplateModel extends SportsManagementAdminModel' admin/src/Model/TemplateModel.php
          grep -q 'FormFactoryInterface' admin/src/Model/TemplateModel.php
          grep -q "createForm((string) \$item->template, \['control' => 'params'\])" admin/src/Model/TemplateModel.php
          grep -q 'function saveTemplateParams' admin/src/Model/TemplateModel.php
          grep -q 'function getAllTemplatesList' admin/src/Model/TemplateModel.php
          grep -q 'function getProjectTeamsCount' admin/src/Model/TemplateModel.php
          grep -q 'function update' admin/src/Model/TemplateModel.php
          grep -q "updateObject('#__sportsmanagement_template_config'" admin/src/Model/TemplateModel.php

          grep -q 'class TemplatesModel extends SportsManagementListModel' admin/src/Model/TemplatesModel.php
          grep -q 'function checklist' admin/src/Model/TemplatesModel.php
          grep -q 'FormFactoryInterface' admin/src/Model/TemplatesModel.php
          grep -q 'DirectoryIterator' admin/src/Model/TemplatesModel.php
          grep -q "insertObject('#__sportsmanagement_template_config'" admin/src/Model/TemplatesModel.php
          grep -q 'function getMasterTemplatesList' admin/src/Model/TemplatesModel.php
          grep -q 'function getMasterName' admin/src/Model/TemplatesModel.php
          grep -q "getUserState('com_sportsmanagement.pid'" admin/src/Model/TemplatesModel.php

          grep -q 'class TemplateController extends SportsManagementFormController' admin/src/Controller/TemplateController.php
          grep -q 'function save' admin/src/Controller/TemplateController.php
          grep -q "post->get('params'" admin/src/Controller/TemplateController.php
          grep -q 'saveTemplateParams' admin/src/Controller/TemplateController.php
          grep -q 'function reset' admin/src/Controller/TemplateController.php
          grep -q 'function remove' admin/src/Controller/TemplateController.php
          grep -q 'function update' admin/src/Controller/TemplateController.php
          grep -q 'function masterimport' admin/src/Controller/TemplateController.php
          test "$(grep -c 'checkToken' admin/src/Controller/TemplateController.php)" -ge 4

          grep -q 'class TemplatesController extends SportsManagementAdminController' admin/src/Controller/TemplatesController.php
          grep -q 'function changetemplate' admin/src/Controller/TemplatesController.php
          grep -q 'checkToken' admin/src/Controller/TemplatesController.php

          grep -q "class_alias(TemplateModel::class, 'sportsmanagementModeltemplate')" admin/models/template.php
          grep -q "class_alias(TemplatesModel::class, 'sportsmanagementModelTemplates')" admin/models/templates.php
          grep -q "class_alias(TemplateController::class, 'sportsmanagementControllertemplate')" admin/controllers/template.php
          grep -q "class_alias(TemplatesController::class, 'sportsmanagementControllertemplates')" admin/controllers/templates.php

          grep -q '\$this->model->getProject' admin/views/template/view.html.php
          grep -q '\$this->model->getProjectTeamsCount' admin/views/template/view.html.php
          grep -q '\$this->model->getAllTemplatesList' admin/views/template/view.html.php
          grep -q '\$this->model->getProject' admin/views/templates/view.html.php
          grep -q '\$this->model->getMasterTemplatesList' admin/views/templates/view.html.php
          grep -q 'name="isMaster\[' admin/views/templates/tmpl/default_data.php
          grep -q "HTMLHelper::_('form.token')" admin/views/templates/tmpl/default.php
          grep -q 'name="pid"' admin/views/templates/tmpl/default.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Project templates migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
