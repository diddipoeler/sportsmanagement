name: Joomla 5/6 administrator timezone field gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Field/GoogletimezonesField.php'
      - 'admin/models/fields/googletimezones.php'
      - '.github/workflows/joomla5-6-admin-timezone-field.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/Field/GoogletimezonesField.php'
      - 'admin/models/fields/googletimezones.php'
      - '.github/workflows/joomla5-6-admin-timezone-field.yml'

jobs:
  timezone-field:
    name: Administrator timezone field checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dynamic IANA timezone selector
        shell: bash
        run: |
          set -euo pipefail

          field=admin/src/Field/GoogletimezonesField.php
          bridge=admin/models/fields/googletimezones.php

          php -l "$field"
          php -l "$bridge"

          grep -q 'final class GoogletimezonesField extends ListField' "$field"
          grep -q 'DateTimeZone::ALL_WITH_BC' "$field"
          grep -q 'DateTimeZone::listIdentifiers' "$field"
          grep -q 'getOffset' "$field"
          grep -q 'formatOffset' "$field"
          grep -q "class_alias(GoogletimezonesField::class, 'JFormFieldGoogletimezones')" "$bridge"

          if grep -E -- 'JLoader::|JLoader::import|FormHelper::loadFieldClass|Factory::getLanguage\(|class JFormFieldGoogletimezones extends|Pacific/Apia.*GMT' "$field" "$bridge"; then
            echo 'Timezone field regressed to the legacy static timezone table or loader APIs' >&2
            exit 1
          fi
