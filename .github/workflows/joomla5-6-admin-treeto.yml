name: Joomla 5/6 administrator tournament tree migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  treeto:
    name: Native tournament tree model/controller/view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tournament tree migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/TreetoModel.php
            admin/src/Model/TreetosModel.php
            admin/src/Controller/TreetoController.php
            admin/src/Controller/TreetosController.php
            admin/models/treeto.php
            admin/models/treetos.php
            admin/controllers/treeto.php
            admin/controllers/treetos.php
            admin/views/treeto/view.html.php
            admin/views/treetos/view.html.php
            admin/views/treeto/tmpl/gennode.php
            admin/views/treeto/tmpl/gennode_data.php
            admin/views/treetos/tmpl/default.php
            admin/views/treetos/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/treeto.xml
          test -f admin/tables/treeto.php
          php -r "libxml_use_internal_errors(true); exit(simplexml_load_file('admin/models/forms/treeto.xml') ? 0 : 1);"

          grep -q 'class TreetoModel extends SportsManagementAdminModel' admin/src/Model/TreetoModel.php
          grep -q 'models/forms' admin/src/Model/TreetoModel.php
          grep -q "getTable(\$type = 'Treeto'" admin/src/Model/TreetoModel.php
          grep -q 'function getTreeToData' admin/src/Model/TreetoModel.php
          grep -q 'function setGenerateNode' admin/src/Model/TreetoModel.php
          grep -q 'transactionStart' admin/src/Model/TreetoModel.php
          grep -q 'transactionCommit' admin/src/Model/TreetoModel.php
          grep -q 'transactionRollback' admin/src/Model/TreetoModel.php
          grep -q "insertObject('#__sportsmanagement_treeto_node'" admin/src/Model/TreetoModel.php
          grep -q "updateObject('#__sportsmanagement_treeto'" admin/src/Model/TreetoModel.php
          grep -q 'function getProject' admin/src/Model/TreetoModel.php

          grep -q 'class TreetosModel extends SportsManagementListModel' admin/src/Model/TreetosModel.php
          grep -q 'function storeshort' admin/src/Model/TreetosModel.php
          grep -q "updateObject('#__sportsmanagement_treeto'" admin/src/Model/TreetosModel.php
          grep -q 'function getProjectId' admin/src/Model/TreetosModel.php
          grep -q 'function getProject' admin/src/Model/TreetosModel.php
          grep -q 'function getDivisions' admin/src/Model/TreetosModel.php
          grep -q "getUserState('com_sportsmanagement.pid'" admin/src/Model/TreetosModel.php

          grep -q 'class TreetoController extends SportsManagementFormController' admin/src/Controller/TreetoController.php
          grep -q 'function saveshort' admin/src/Controller/TreetoController.php
          grep -q 'function generatenode' admin/src/Controller/TreetoController.php
          grep -q 'function remove' admin/src/Controller/TreetoController.php
          grep -q 'function cancel' admin/src/Controller/TreetoController.php
          test "$(grep -c 'checkToken' admin/src/Controller/TreetoController.php)" -ge 4
          grep -q "getModel('Treetos', 'Administrator'" admin/src/Controller/TreetoController.php
          grep -q 'view=treetonodes' admin/src/Controller/TreetoController.php

          grep -q 'class TreetosController extends SportsManagementAdminController' admin/src/Controller/TreetosController.php
          grep -q 'function genNode' admin/src/Controller/TreetosController.php
          grep -q 'function save' admin/src/Controller/TreetosController.php
          grep -q 'checkToken' admin/src/Controller/TreetosController.php

          grep -q "class_alias(TreetoModel::class, 'sportsmanagementModelTreeto')" admin/models/treeto.php
          grep -q "class_alias(TreetosModel::class, 'sportsmanagementModelTreetos')" admin/models/treetos.php
          grep -q "class_alias(TreetoController::class, 'sportsmanagementControllerTreeto')" admin/controllers/treeto.php
          grep -q "class_alias(TreetosController::class, 'sportsmanagementControllertreetos')" admin/controllers/treetos.php

          grep -q '\$this->model->getProject' admin/views/treeto/view.html.php
          grep -q '\$this->model->getProject' admin/views/treetos/view.html.php
          grep -q '\$this->model->getDivisions' admin/views/treetos/view.html.php
          grep -q "name=\"task\" value=\"treeto.generatenode\"" admin/views/treeto/tmpl/gennode.php
          grep -q "HTMLHelper::_('form.token')" admin/views/treeto/tmpl/gennode.php
          grep -q 'name="pid"' admin/views/treetos/tmpl/default.php
          grep -q "HTMLHelper::_('form.token')" admin/views/treetos/tmpl/default.php
          grep -q "HTMLHelper::_('grid.id'" admin/views/treetos/tmpl/default_data.php
          grep -q "HTMLHelper::_('grid.published', (int) \$row->published" admin/views/treetos/tmpl/default_data.php
          if grep -qi 'grid.checkedout' admin/views/treetos/tmpl/default_data.php; then
            echo 'Treetos list regressed to the legacy checked-out grid helper' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Tournament tree migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
