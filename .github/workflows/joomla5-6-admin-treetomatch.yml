name: Joomla 5/6 administrator tree match migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  treetomatch:
    name: Native tournament-tree match model/controller/view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tree match migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/TreetomatchsModel.php
            admin/src/Controller/TreetomatchController.php
            admin/models/treetomatchs.php
            admin/controllers/treetomatch.php
            admin/views/treetomatchs/view.html.php
            admin/views/treetomatchs/tmpl/default.php
            admin/views/treetomatchs/tmpl/default_data.php
            admin/views/treetomatchs/tmpl/editlist.php
            admin/views/treetomatchs/tmpl/editlist_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/tables/treetomatch.php

          grep -q 'class TreetomatchsModel extends SportsManagementListModel' admin/src/Model/TreetomatchsModel.php
          grep -q 'function store' admin/src/Model/TreetomatchsModel.php
          grep -q 'transactionStart' admin/src/Model/TreetomatchsModel.php
          grep -q 'transactionCommit' admin/src/Model/TreetomatchsModel.php
          grep -q 'transactionRollback' admin/src/Model/TreetomatchsModel.php
          grep -q "delete(\$db->quoteName('#__sportsmanagement_treeto_match'))" admin/src/Model/TreetomatchsModel.php
          grep -q "insertObject('#__sportsmanagement_treeto_match'" admin/src/Model/TreetomatchsModel.php
          grep -q 'function getMatches' admin/src/Model/TreetomatchsModel.php
          grep -q 'function getNodeMatches' admin/src/Model/TreetomatchsModel.php
          grep -q 'function getProject' admin/src/Model/TreetomatchsModel.php
          grep -q 'function getNode' admin/src/Model/TreetomatchsModel.php
          grep -q '#__sportsmanagement_treeto_node' admin/src/Model/TreetomatchsModel.php

          grep -q 'class TreetomatchController extends SportsManagementFormController' admin/src/Controller/TreetomatchController.php
          grep -q 'function editlist' admin/src/Controller/TreetomatchController.php
          grep -q 'function save_matcheslist' admin/src/Controller/TreetomatchController.php
          grep -q 'checkToken' admin/src/Controller/TreetomatchController.php
          grep -q "getModel('Treetomatchs', 'Administrator'" admin/src/Controller/TreetomatchController.php

          grep -q "class_alias(TreetomatchsModel::class, 'sportsmanagementModelTreetomatchs')" admin/models/treetomatchs.php
          grep -q "class_alias(TreetomatchController::class, 'sportsmanagementControllerTreetomatch')" admin/controllers/treetomatch.php

          grep -q '\$this->model->getProject' admin/views/treetomatchs/view.html.php
          grep -q '\$this->model->getNode' admin/views/treetomatchs/view.html.php
          grep -q '\$this->model->getNodeMatches' admin/views/treetomatchs/view.html.php
          grep -q '\$this->model->getMatches' admin/views/treetomatchs/view.html.php
          grep -q "HTMLHelper::_('form.token')" admin/views/treetomatchs/tmpl/default.php
          grep -q "HTMLHelper::_('form.token')" admin/views/treetomatchs/tmpl/editlist.php
          grep -q 'name="nid"' admin/views/treetomatchs/tmpl/editlist.php
          grep -q 'name="tid"' admin/views/treetomatchs/tmpl/editlist.php
          grep -q 'name="pid"' admin/views/treetomatchs/tmpl/editlist.php
          grep -q "node_matcheslist option" admin/views/treetomatchs/tmpl/editlist.php

          if grep -E -- 'quote\(\$peids\)|grid\.checkedout|jgrid\.checkedout|SqueezeBox|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Tree match migration regressed to a legacy list/version/id-list path' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Tree match migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
