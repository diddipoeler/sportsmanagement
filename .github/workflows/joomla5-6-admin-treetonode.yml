name: Joomla 5/6 administrator tournament tree node migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  treetonode:
    name: Native tournament-tree node model/controller/view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tournament tree node migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/TreetonodeModel.php
            admin/src/Model/TreetonodesModel.php
            admin/src/Controller/TreetonodeController.php
            admin/models/treetonode.php
            admin/models/treetonodes.php
            admin/controllers/treetonode.php
            admin/views/treetonode/view.html.php
            admin/views/treetonodes/view.html.php
            admin/views/treetonodes/tmpl/default.php
            admin/views/treetonodes/tmpl/default_data.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f admin/models/forms/treetonode.xml
          test -f admin/tables/treetonode.php
          php -r "libxml_use_internal_errors(true); exit(simplexml_load_file('admin/models/forms/treetonode.xml') ? 0 : 1);"

          grep -q 'class TreetonodeModel extends SportsManagementAdminModel' admin/src/Model/TreetonodeModel.php
          grep -q 'models/forms' admin/src/Model/TreetonodeModel.php
          grep -q "getTable(\$type = 'Treetonode'" admin/src/Model/TreetonodeModel.php
          grep -q 'function getNode' admin/src/Model/TreetonodeModel.php
          grep -q 'function getNodeMatch' admin/src/Model/TreetonodeModel.php
          grep -q 'function setUnpublishNode' admin/src/Model/TreetonodeModel.php
          grep -q 'function getProject' admin/src/Model/TreetonodeModel.php
          grep -q 'function getProjectTeamsOptions' admin/src/Model/TreetonodeModel.php

          grep -q 'class TreetonodesModel extends SportsManagementListModel' admin/src/Model/TreetonodesModel.php
          grep -q "setState('list.limit', 0)" admin/src/Model/TreetonodesModel.php
          grep -q 'function savenode' admin/src/Model/TreetonodesModel.php
          grep -q 'function getteamsprorunde' admin/src/Model/TreetonodesModel.php
          grep -q 'function getMaxRound' admin/src/Model/TreetonodesModel.php
          grep -q 'function setRemoveNode' admin/src/Model/TreetonodesModel.php
          grep -q 'function storeshortleaf' admin/src/Model/TreetonodesModel.php
          grep -q 'function storefinishleaf' admin/src/Model/TreetonodesModel.php
          grep -q 'function getProjectTeamsOptions' admin/src/Model/TreetonodesModel.php
          grep -q 'function storeshort' admin/src/Model/TreetonodesModel.php
          grep -q 'function getTreeToData' admin/src/Model/TreetonodesModel.php
          grep -q 'transactionStart' admin/src/Model/TreetonodesModel.php
          grep -q "delete(\$db->quoteName('#__sportsmanagement_treeto_match'))" admin/src/Model/TreetonodesModel.php
          grep -q "delete(\$db->quoteName('#__sportsmanagement_treeto_node'))" admin/src/Model/TreetonodesModel.php
          grep -q 'hasNodeMatch' admin/src/Model/TreetonodesModel.php
          grep -q 'getProjectTeamNames' admin/src/Model/TreetonodesModel.php

          grep -q 'class TreetonodeController extends SportsManagementFormController' admin/src/Controller/TreetonodeController.php
          grep -q 'function saveshort' admin/src/Controller/TreetonodeController.php
          grep -q 'function saveallleaf' admin/src/Controller/TreetonodeController.php
          grep -q 'function savefinishleaf' admin/src/Controller/TreetonodeController.php
          grep -q 'function removenode' admin/src/Controller/TreetonodeController.php
          test "$(grep -c 'checkToken' admin/src/Controller/TreetonodeController.php)" -ge 4
          grep -q 'storeshortleaf' admin/src/Controller/TreetonodeController.php
          grep -q 'storefinishleaf' admin/src/Controller/TreetonodeController.php

          grep -q "class_alias(TreetonodeModel::class, 'sportsmanagementModelTreetonode')" admin/models/treetonode.php
          grep -q "class_alias(TreetonodesModel::class, 'sportsmanagementModelTreetonodes')" admin/models/treetonodes.php
          grep -q "class_alias(TreetonodeController::class, 'sportsmanagementControllerTreetonode')" admin/controllers/treetonode.php

          grep -q '\$this->model->getProject' admin/views/treetonode/view.html.php
          grep -q '\$this->model->getProjectTeamsOptions' admin/views/treetonode/view.html.php
          grep -q '\$this->model->getProject' admin/views/treetonodes/view.html.php
          grep -q '\$this->model->getTreeToData' admin/views/treetonodes/view.html.php
          grep -q '\$this->model->getteamsprorunde' admin/views/treetonodes/view.html.php
          grep -q '\$this->model->savenode' admin/views/treetonodes/view.html.php

          grep -q "loadTemplate('data')" admin/views/treetonodes/tmpl/default.php
          grep -q "HTMLHelper::_('form.token')" admin/views/treetonodes/tmpl/default.php
          grep -q 'name="treeto_id"' admin/views/treetonodes/tmpl/default.php
          grep -q 'treetonode-selector' admin/views/treetonodes/tmpl/default_data.php
          grep -q "HTMLHelper::_('select.genericlist'" admin/views/treetonodes/tmpl/default_data.php
          grep -q 'treetomatchs&layout=editlist' admin/views/treetonodes/tmpl/default_data.php

          if grep -E -- 'joomla_version|grid\.checkedout|jgrid\.checkedout|JHtmlSelect|SqueezeBox|DELETE[[:space:]]+ttn,[[:space:]]*ttm|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Tournament tree node migration regressed to a legacy wrapper/checkout/database/version path' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getConfig\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|BaseDatabaseModel::getInstance\(|Form::getInstance\(|jimport\(|JLoader::import\(|JError::|jexit\(|extends JSMController|extends JSMModel|jsmdb|jsmquery|jsmapp|jsmjinput|sportsmanagementModeldatabasetool|version_compare\(.*JVERSION' "${files[@]}"; then
            echo 'Tournament tree node migration regressed to a removed/deprecated Joomla or legacy MVC/database API' >&2
            exit 1
          fi
