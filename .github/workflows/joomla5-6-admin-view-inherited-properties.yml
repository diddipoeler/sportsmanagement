name: Joomla 5/6 native admin view inheritance

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/View/**'
      - '.github/workflows/joomla5-6-admin-view-inherited-properties.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/View/**'
      - '.github/workflows/joomla5-6-admin-view-inherited-properties.yml'

jobs:
  inherited-view-properties:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native administrator views
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find admin/src/View -type f -name '*.php' -print0)

          if grep -R -nE --include='*.php' '^[[:space:]]*(public|protected|private)[[:space:]]+([^$;]+[[:space:]]+)?\$option([[:space:]]*=|[[:space:]]*;)' admin/src/View; then
            echo 'Native admin views must use inherited Joomla AbstractView::$option and must not redeclare it.' >&2
            exit 1
          fi
