name: Joomla 5/6 administrator view runtime gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-view-runtime:
    name: Administrator view runtime checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate administrator views
        shell: bash
        run: |
          set -euo pipefail

          individual_model=admin/src/Model/JlextindividualsportesModel.php

          while IFS= read -r file; do
            php -l "$file"
          done < <(find admin/src/View -type f -name '*.php' -print | sort)

          php -l "$individual_model"

          application_hits="$(grep -R -n --include='*.php' -F -- '->getApplication(' admin/src/View || true)"
          if [[ -n "$application_hits" ]]; then
            printf '%s\n' "$application_hits" >&2
            echo 'A native administrator view still calls an unavailable getApplication() method.' >&2
            exit 1
          fi

          database_hits="$(grep -R -n --include='*.php' -F -- '->getDatabase(' admin/src/View || true)"
          if [[ -n "$database_hits" ]]; then
            printf '%s\n' "$database_hits" >&2
            echo 'A native administrator view still calls protected BaseDatabaseModel::getDatabase().' >&2
            exit 1
          fi

          grep -Fq 'use Diddipoeler\Component\SportsManagement\Administrator\Helper\SportsManagementDatabaseResolver;' "$individual_model"
          grep -Fq '(new SportsManagementDatabaseResolver())->resolve(' "$individual_model"

          if grep -E 'sportsmanagementHelper|getDBConnection\(|require_once JPATH_ADMINISTRATOR' "$individual_model"; then
            echo 'Individual-sport model regressed to the legacy database helper.' >&2
            exit 1
          fi
