name: Joomla 5/6 administrator view runtime gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  admin-view-runtime:
    name: Administrator view runtime checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate administrator views
        shell: bash
        run: |
          set -euo pipefail

          individual_model=admin/src/Model/JlextindividualsportesModel.php
          dashboard_template=admin/tmpl/cpanel/native.php

          while IFS= read -r file; do
            php -l "$file"
          done < <(find admin/src/View -type f -name '*.php' -print | sort)

          php -l "$individual_model"
          php -l "$dashboard_template"

          application_hits="$(grep -R -n --include='*.php' -F -- '->getApplication(' admin/src/View || true)"
          if [[ -n "$application_hits" ]]; then
            printf '%s\n' "$application_hits" >&2
            echo 'A native administrator view still calls an unavailable getApplication() method.' >&2
            exit 1
          fi

          database_hits="$(grep -R -n --include='*.php' -F -- '->getDatabase(' admin/src/View || true)"
          if [[ -n "$database_hits" ]]; then
            printf '%s\n' "$database_hits" >&2
            echo 'A native administrator view still calls protected BaseDatabaseModel::getDatabase().' >&2
            exit 1
          fi

          legacy_toolbar_hits="$(grep -R -n --include='*.php' -F -- 'sportsmanagementHelper::ToolbarButton(' admin/src/View || true)"
          if [[ -n "$legacy_toolbar_hits" ]]; then
            printf '%s\n' "$legacy_toolbar_hits" >&2
            echo 'A native administrator view still depends on the legacy toolbar popup helper.' >&2
            exit 1
          fi

          toolbar_instance_hits="$(grep -R -n --include='*.php' -F -- 'Toolbar::getInstance(' admin/src/View || true)"
          if [[ -n "$toolbar_instance_hits" ]]; then
            printf '%s\n' "$toolbar_instance_hits" >&2
            echo 'A native administrator view regressed to the removed Toolbar::getInstance() access.' >&2
            exit 1
          fi

          grep -Fq 'use Diddipoeler\Component\SportsManagement\Administrator\Helper\SportsManagementDatabaseResolver;' "$individual_model"
          grep -Fq '(new SportsManagementDatabaseResolver())->resolve(' "$individual_model"

          if grep -E 'sportsmanagementHelper|getDBConnection\(|require_once JPATH_ADMINISTRATOR' "$individual_model"; then
            echo 'Individual-sport model regressed to the legacy database helper.' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('admin/tmpl/cpanel/native.php').read_text(encoding='utf-8')
          dashboard_view = Path('admin/src/View/Cpanel/HtmlView.php').read_text(encoding='utf-8')

          expected = (
              "Route::_($item['url'], false)",
              "Route::_('index.php?option=com_sportsmanagement&view=databasetools', false)",
          )
          for needle in expected:
              if needle not in dashboard:
                  raise SystemExit(f'administrator dashboard routing contract missing: {needle}')

          for text, name in ((dashboard, 'dashboard template'), (dashboard_view, 'dashboard view')):
              if '&amp;view=' in text or '&amp;amp;view=' in text:
                  raise SystemExit(f'{name} contains pre-encoded view query separators')

          if "$escape(Route::_($item['url']))" in dashboard:
              raise SystemExit('administrator dashboard double-encodes routed view links')

          for tag in ('@version', '@author', '@copyright', '@license'):
              if tag not in dashboard:
                  raise SystemExit(f'administrator dashboard metadata missing: {tag}')

          print('Administrator view and dashboard routing contracts OK')
          PY
