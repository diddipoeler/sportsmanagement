name: Joomla 5/6 agegroup eventtype models batch 29

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/models/agegroup.php'
      - 'admin/models/agegroups.php'
      - 'admin/models/eventtype.php'
      - 'admin/models/eventtypes.php'
      - 'admin/src/Model/AgegroupsModel.php'
      - 'admin/src/Model/EventtypesModel.php'
      - '.github/workflows/joomla5-6-agegroup-eventtype-models-batch29.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/models/agegroup.php'
      - 'admin/models/agegroups.php'
      - 'admin/models/eventtype.php'
      - 'admin/models/eventtypes.php'
      - 'admin/src/Model/AgegroupsModel.php'
      - 'admin/src/Model/EventtypesModel.php'
      - '.github/workflows/joomla5-6-agegroup-eventtype-models-batch29.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 agegroup and eventtype models
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/agegroup.php
            admin/models/agegroups.php
            admin/models/eventtype.php
            admin/models/eventtypes.php
            admin/src/Model/AgegroupModel.php
            admin/src/Model/AgegroupsModel.php
            admin/src/Model/EventtypeModel.php
            admin/src/Model/EventtypesModel.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq 'class sportsmanagementModelagegroup extends AgegroupModel' admin/models/agegroup.php
          grep -Fq "class_alias(AgegroupsModel::class, 'sportsmanagementModelagegroups')" admin/models/agegroups.php
          grep -Fq "class_alias(EventtypeModel::class, 'sportsmanagementModeleventtype')" admin/models/eventtype.php
          grep -Fq "class_alias(EventtypesModel::class, 'sportsmanagementModelEventtypes')" admin/models/eventtypes.php

          grep -Fq 'class AgegroupModel extends SportsManagementAdminModel' admin/src/Model/AgegroupModel.php
          grep -Fq 'class AgegroupsModel extends SportsManagementListModel' admin/src/Model/AgegroupsModel.php
          grep -Fq 'final class EventtypeModel extends SportsManagementAdminModel' admin/src/Model/EventtypeModel.php
          grep -Fq 'final class EventtypesModel extends SportsManagementListModel' admin/src/Model/EventtypesModel.php

          grep -Fq '$this->administratorApplication()' admin/src/Model/AgegroupsModel.php
          grep -Fq '$this->administratorApplication()' admin/src/Model/EventtypesModel.php

          if grep -En 'Factory::getApplication\(\)' admin/src/Model/AgegroupsModel.php admin/src/Model/EventtypesModel.php; then
            echo 'Static application access remains in native list models.' >&2
            exit 1
          fi
