name: Joomla 5/6 AJAX navigation dependency guard batch 429

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_ajax_top_navigation_menu/helper.php'
      - '.github/workflows/joomla5-6-ajax-navigation-dependency-guard-batch429.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_ajax_top_navigation_menu/helper.php'
      - '.github/workflows/joomla5-6-ajax-navigation-dependency-guard-batch429.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate AJAX navigation dependency guard
        shell: bash
        run: |
          set -euo pipefail
          file=modules/mod_sportsmanagement_ajax_top_navigation_menu/helper.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'SiteRouteHelper::class' "$file"
          grep -Fq -- 'SportsManagementDatabaseResolver::class' "$file"
          grep -Fq -- 'SportsManagementSiteApplicationResolver::class' "$file"
          grep -Fq -- 'NavigationDataHelper::class => __DIR__' "$file"
          grep -Fq -- 'throw new \RuntimeException' "$file"
