name: Joomla 5/6 AJAX navigation gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  ajax-navigation:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AJAX top navigation module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_ajax_top_navigation_menu
          manifest="$module/mod_sportsmanagement_ajax_top_navigation_menu.xml"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/AjaxTopNavigationHelper.php"
          php -l "$module/mod_sportsmanagement_ajax_top_navigation_menu.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/native.php"
          node --check "$module/js/native.js"

          test ! -f "$module/js/mod_sportsmanagement_ajax_top_navigation_menu.js"
          test ! -f "$module/js/mod_sportsmanagement_ajax_top_navigation_menu_2.js"
          test ! -d "$module/fields"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementAjaxTopNavigationMenu</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'new \\modSportsmanagementAjaxTopNavigationMenuHelper($params, $app)' "$module/src/Helper/AjaxTopNavigationHelper.php"
          grep -q 'getIdentity()' "$module/helper.php"
          grep -q 'getInput()' "$module/helper.php"
          grep -q 'fetch(' "$module/js/native.js"
          grep -q 'Promise.all' "$module/js/native.js"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'AJAX navigation manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|URI)\(|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/AjaxTopNavigationHelper.php" \
            "$module/mod_sportsmanagement_ajax_top_navigation_menu.php" \
            "$module/helper.php"; then
            echo 'AJAX navigation PHP regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -E 'jQuery|\$\(|async:[[:space:]]*false|XMLHttpRequest|ActiveXObject|window\.addEvent|SqueezeBox' "$module/js/native.js"; then
            echo 'AJAX navigation runtime regressed to legacy JavaScript.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
