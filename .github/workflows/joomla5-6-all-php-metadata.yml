name: Joomla 5/6 all PHP metadata audit
# Check file-level PHPDoc, not merely tag strings anywhere in source.

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - joomla5-6
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Audit file-level PHPDoc metadata in site, admin and modules
        run: php .github/tests/phpdoc_metadata.php --all
