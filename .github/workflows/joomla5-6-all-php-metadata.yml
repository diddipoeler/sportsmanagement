name: Joomla 5/6 all PHP metadata audit
# Check file-level PHPDoc, not merely tag strings anywhere in source.

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - joomla5-6
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Audit file-level PHPDoc metadata in site, admin, modules and installer
        run: php .github/tests/phpdoc_metadata.php --all

      - name: Lint changed Joomla 5/6 PHP files
        run: |
          php -l site/src/Controller/EditmatchController.php
          php -l site/src/Controller/EditclubController.php
          php -l site/src/Model/EditclubModel.php
          php -l site/src/Controller/AjaxController.php
          php -l admin/src/Controller/DivisionsController.php
          php -l .github/tests/joomla56_ajax_divisions_birthday_contract.php
          php -l site/src/Model/EditpersonModel.php
          php -l site/src/Model/EditteamModel.php
          php -l admin/src/Controller/SportsManagementAdminController.php
          php -l admin/src/Controller/ClubsController.php
          php -l admin/src/Controller/TeamsController.php
          php -l admin/src/Controller/LeaguesController.php
          php -l admin/src/Controller/AgegroupsController.php
          php -l admin/src/Controller/SeasonsController.php
          php -l modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php
          php -l .github/tests/joomla56_editor_admin_module_contract.php
          php -l admin/src/Controller/AjaxController.php
          php -l modules/mod_sportsmanagement_matches/connectors/native/LinkTrait.php
          php -l modules/mod_sportsmanagement_matches/connectors/native/FormatTrait.php
          php -l .github/tests/joomla56_match_write_security.php
          php -l .github/tests/joomla56_club_save_contract.php
          php -l .github/tests/phpdoc_metadata.php
          php -l script.joomla56.php

      - name: Check match write guards, AJAX output and module website links
        run: php .github/tests/joomla56_match_write_security.php

      - name: Check frontend club date parsing and model save contract
        run: php .github/tests/joomla56_club_save_contract.php

      - name: Check site editor values, administrator write guards and birthday paths
        run: php .github/tests/joomla56_editor_admin_module_contract.php

      - name: Check site AJAX, division write access and birthday selector IDs
        run: php .github/tests/joomla56_ajax_divisions_birthday_contract.php
