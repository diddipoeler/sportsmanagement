name: Joomla 5/6 all PHP metadata audit
# Check file-level PHPDoc, not merely tag strings anywhere in source.

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - joomla5-6
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Audit file-level PHPDoc metadata in site, admin, modules and installer
        run: php .github/tests/phpdoc_metadata.php --all

      - name: Lint changed Joomla 5/6 PHP files
        run: |
          php -l site/src/Controller/EditmatchController.php
          php -l site/src/Controller/EditclubController.php
          php -l site/src/Model/EditclubModel.php
          php -l site/src/Controller/AjaxController.php
          php -l site/src/Controller/ImagehandlerController.php
          php -l admin/src/Controller/DivisionsController.php
          php -l admin/src/Controller/MatchesController.php
          php -l admin/src/Controller/MatchController.php
          php -l .github/tests/joomla56_match_form_access_contract.php
          php -l admin/src/Controller/PredictionmembersController.php
          php -l .github/tests/joomla56_ajax_divisions_birthday_contract.php
          php -l site/src/Model/EditpersonModel.php
          php -l site/src/Model/EditteamModel.php
          php -l admin/src/Controller/SportsManagementAdminController.php
          php -l admin/src/Controller/ClubsController.php
          php -l admin/src/Controller/TeamsController.php
          php -l admin/src/Controller/LeaguesController.php
          php -l admin/src/Controller/AgegroupsController.php
          php -l admin/src/Controller/SeasonsController.php
          php -l modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php
          php -l .github/tests/joomla56_birthday_leapday.php
          php -l .github/tests/joomla56_editor_admin_module_contract.php
          php -l admin/src/Controller/AjaxController.php
          php -l admin/src/Controller/DatabasetoolController.php
          php -l modules/mod_sportsmanagement_matches/connectors/native/LinkTrait.php
          php -l modules/mod_sportsmanagement_matches/connectors/native/FormatTrait.php
          php -l modules/mod_sportsmanagement_matches/connectors/native/QueryTrait.php
          php -l site/src/Controller/PredictionentryController.php
          php -l site/src/Controller/MatchesController.php
          php -l modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
          php -l .github/tests/joomla56_site_timeline_slider_contract.php
          php -l .github/tests/joomla56_match_timeline_contract.php
          php -l .github/tests/joomla56_match_write_security.php
          php -l .github/tests/joomla56_club_save_contract.php
          php -l .github/tests/phpdoc_metadata.php
          php -l script.joomla56.php
          php -l site/src/Model/PredictionuserModel.php
          php -l modules/mod_sportsmanagement_teamplayers/src/Helper/TeamPlayersHelper.php
          php -l .github/tests/joomla56_prediction_member_identity.php
          php -l admin/src/Controller/SeasonsController.php
          php -l modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php
          php -l .github/tests/joomla56_admin_seasons_controller.php
          php -l .github/tests/joomla56_ranking_media_urls.php
          php -l site/src/Model/PredictionmemberModel.php
          php -l admin/src/Controller/DivisionsController.php
          php -l modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
          php -l .github/tests/joomla56_prediction_registration_dates.php
          php -l .github/tests/joomla56_admin_divisions_model_guards.php
          php -l .github/tests/joomla56_new_project_identity_selector.php
          php -l site/src/Model/JsonfeedModel.php
          php -l admin/src/Controller/SmquotetxtController.php
          php -l modules/mod_sportsmanagement_playground_ticker/src/Helper/PlaygroundTickerHelper.php
          php -l .github/tests/joomla56_jsonfeed_selected_calendar_ids.php
          php -l site/src/Model/IcalModel.php
          php -l admin/src/Controller/RoundsController.php
          php -l modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php
          php -l .github/tests/joomla56_ical_error_privacy.php
          php -l .github/tests/joomla56_admin_rounds_write_guards.php
          php -l site/src/Model/PredictionpointsModel.php
          php -l admin/src/Controller/ProjectrefereesController.php
          php -l modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php
          php -l .github/tests/joomla56_prediction_points_model_acl.php
          php -l .github/tests/joomla56_projectreferees_write_guards.php
          php -l .github/tests/joomla56_results_acl_liveticker_commentary.php
          php -l site/src/Model/PredictionmembershipModel.php
          php -l admin/src/Controller/PredictionroundsController.php
          php -l modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php
          php -l .github/tests/joomla56_prediction_membership_guest.php
          php -l .github/tests/joomla56_prediction_rounds_write_guards.php
          php -l .github/tests/joomla56_prediction_liveticker_followup.php
          php -l site/src/Model/UefawertungModel.php
          php -l admin/src/Controller/PlaygroundsController.php
          php -l modules/mod_sportsmanagement_top_tipper/src/Helper/TopTipperHelper.php
          php -l .github/tests/joomla56_site_uefa_error_privacy.php
          php -l .github/tests/joomla56_admin_playgrounds_model_options.php
          php -l .github/tests/joomla56_top_tipper_module_settings.php
          php -l admin/src/Controller/ProjectsController.php
          php -l modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php
          php -l .github/tests/joomla56_admin_projects_action_feedback.php
          php -l .github/tests/joomla56_liveticker_database_selector.php

      - name: Check match write guards, AJAX output and module website links
        run: php .github/tests/joomla56_match_write_security.php

      - name: Check frontend club date parsing and model save contract
        run: php .github/tests/joomla56_club_save_contract.php

      - name: Check site editor values, administrator write guards and birthday paths
        run: php .github/tests/joomla56_editor_admin_module_contract.php

      - name: Check site AJAX, division write access and birthday selector IDs
        run: php .github/tests/joomla56_ajax_divisions_birthday_contract.php

      - name: Verify match timeline POST security, JSON and private errors
        run: php .github/tests/joomla56_match_timeline_contract.php

      - name: Test frontend match AJAX security and slider sanitizers
        run: php .github/tests/joomla56_site_timeline_slider_contract.php

      - name: Test timeline JavaScript POST payloads and Joomla CSRF tokens
        run: node .github/tests/joomla56_timeline_js_contract.js

      - name: Check custom match form write permissions and private errors
        run: php .github/tests/joomla56_match_form_access_contract.php

      - name: Check prediction member ACL with missing Joomla identities
        run: php .github/tests/joomla56_prediction_member_identity.php

      - name: Test administrator Seasons controller model guards
        run: php .github/tests/joomla56_admin_seasons_controller.php

      - name: Check Ranking module media URLs
        run: php .github/tests/joomla56_ranking_media_urls.php

      - name: Reject invalid prediction registration dates
        run: php .github/tests/joomla56_prediction_registration_dates.php

      - name: Verify administrator Divisions model guards
        run: php .github/tests/joomla56_admin_divisions_model_guards.php

      - name: Test New Project module identity and database selectors
        run: php .github/tests/joomla56_new_project_identity_selector.php

      - name: Test calendar JSON feed ID count for integer and CSV inputs
        run: php .github/tests/joomla56_jsonfeed_selected_calendar_ids.php

      - name: Ensure calendar failures do not expose SQL details
        run: php .github/tests/joomla56_ical_error_privacy.php

      - name: Test project-position write permissions and missing MVC models
        run: |
          php -l admin/src/Controller/ProjectpositionsController.php
          php -l .github/tests/joomla56_admin_projectpositions_write.php
          php .github/tests/joomla56_admin_projectpositions_write.php

      - name: Test Rounds write permissions and missing models
        run: php .github/tests/joomla56_admin_rounds_write_guards.php

      - name: Test administrator Projects permissions and success messages
        run: php .github/tests/joomla56_admin_projects_action_feedback.php

      - name: Verify Liveticker invalid database settings do not query SQL
        run: php .github/tests/joomla56_liveticker_database_selector.php

      - name: Check prediction membership guest permissions
        run: php .github/tests/joomla56_prediction_membership_guest.php

      - name: Check administrator prediction round write guards
        run: php .github/tests/joomla56_prediction_rounds_write_guards.php

      - name: Check Liveticker settings and query bounds
        run: php .github/tests/joomla56_prediction_liveticker_followup.php

      - name: Verify UEFA site model hides SQL details from visitors
        run: php .github/tests/joomla56_site_uefa_error_privacy.php

      - name: Verify Playground controller preserves MVC factory options
        run: php .github/tests/joomla56_admin_playgrounds_model_options.php

      - name: Verify Top Tipper database and list limit settings
        run: php .github/tests/joomla56_top_tipper_module_settings.php

      - name: Verify direct prediction scoring permissions
        run: php .github/tests/joomla56_prediction_points_model_acl.php

      - name: Verify project referee write permissions and missing models
        run: php .github/tests/joomla56_projectreferees_write_guards.php

      - name: Verify bounded Liveticker commentary match IDs
        run: php .github/tests/joomla56_results_acl_liveticker_commentary.php
