name: Joomla 5/6 allprojects migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  allprojects:
    name: Native allprojects model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate allprojects migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/AllprojectsModel.php
          model_bridge=site/models/allprojects.php
          view=site/src/View/Allprojects/HtmlView.php
          view_bridge=site/views/allprojects/view.html.php
          main_template=site/views/allprojects/tmpl/default.php
          items_template=site/views/allprojects/tmpl/default_items.php

          for file in "$model" "$model_bridge" "$view" "$view_bridge" "$main_template" "$items_template"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class AllprojectsModel extends SportsManagementListModel' "$model"
          grep -q "class_alias(AllprojectsModel::class, 'sportsmanagementModelallprojects')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewallprojects')" "$view_bridge"

          grep -q 'function getLeagueOptions' "$model"
          grep -q 'function getSeasonOptions' "$model"
          grep -q 'function normaliseIds' "$model"
          grep -q "'v.country' => 'l.country'" "$model"
          grep -q 'if ($limit <= 0)' "$model"
          grep -q 'getIdentity()' "$view"
          grep -q 'getLeagueOptions()' "$view"
          grep -q 'getSeasonOptions()' "$view"
          grep -q 'document.getElementById' "$main_template"
          grep -q '\$this->input->getInt' "$items_template"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(|BaseDatabaseModel::getInstance|Joomla\\CMS\\Filesystem' "$model" "$model_bridge" "$view" "$view_bridge" "$main_template" "$items_template"; then
            echo 'Allprojects MVC regressed to a removed Joomla or legacy model API' >&2
            exit 1
          fi

          if grep -E -- 'extends ListModel|extends sportsmanagementView' "$model" "$view"; then
            echo 'Allprojects native MVC bypasses the SportsManagement native bases' >&2
            exit 1
          fi

          if grep -q 'document.id(' "$main_template"; then
            echo 'Allprojects template regressed to Mootools document.id' >&2
            exit 1
          fi
