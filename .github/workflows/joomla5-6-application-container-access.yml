name: Joomla 5/6 application container access gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  application-container-access:
    name: Validate public Joomla DI container access
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan native site, admin and module runtime
        shell: bash
        run: |
          set -euo pipefail

          native_roots=(site/src admin/src)
          while IFS= read -r dir; do
            native_roots+=("$dir")
          done < <(find modules -mindepth 2 -maxdepth 2 -type d -name src -print | sort)

          # CMSApplication::getContainer() is protected in Joomla. Runtime code must
          # validate the application separately and obtain Joomla services from the
          # public Factory DI container.
          protected_container_hits="$(grep -R -n -E --include='*.php' -- '\$[A-Za-z_][A-Za-z0-9_]*app[A-Za-z0-9_]*->getContainer\(|->getApplication\(\)->getContainer\(|->siteApplication\(\)->getContainer\(|->administratorApplication\(\)->getContainer\(' "${native_roots[@]}" || true)"
          if [[ -n "$protected_container_hits" ]]; then
            printf '%s\n' "$protected_container_hits" >&2
            echo 'Protected CMSApplication::getContainer() access detected in native runtime.' >&2
            exit 1
          fi

          legacy_input_hits="$(grep -R -n -E --include='*.php' -- 'Factory::getApplication\(\)->input\b|\$[A-Za-z_][A-Za-z0-9_]*app[A-Za-z0-9_]*->input\b' "${native_roots[@]}" || true)"
          if [[ -n "$legacy_input_hits" ]]; then
            printf '%s\n' "$legacy_input_hits" >&2
            echo 'Legacy application input property access detected in native runtime; use getInput().' >&2
            exit 1
          fi

          # Representative contracts for resolved application + public DI access.
          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' site/src/Model/SportsManagementModel.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' site/src/Model/SportsManagementModel.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' site/src/Model/SportsManagementListModel.php
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' admin/src/Field/UserlistField.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' admin/src/Field/UserlistField.php

          echo 'Public Joomla DI container access contracts OK.'
