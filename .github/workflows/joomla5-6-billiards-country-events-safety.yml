name: Joomla 5/6 billiards roster country events safety

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/EditmatchModel.php'
      - 'admin/src/Model/TeamplayerModel.php'
      - 'modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php'
      - '.github/tests/joomla56_billiards_country_events_scope.php'
      - '.github/workflows/joomla5-6-billiards-country-events-safety.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/EditmatchModel.php'
      - 'admin/src/Model/TeamplayerModel.php'
      - 'modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php'
      - '.github/tests/joomla56_billiards_country_events_scope.php'
      - '.github/workflows/joomla5-6-billiards-country-events-safety.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and PHPDoc requirement
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Model/EditmatchModel.php
            admin/src/Model/TeamplayerModel.php
            modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php
            .github/tests/joomla56_billiards_country_events_scope.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Scoped billiards writes, protected country updates and events filters
        shell: bash
        run: |
          set -euo pipefail
          php .github/tests/joomla56_billiards_country_events_scope.php
          php .github/tests/joomla56_match_roster_birthday_scope.php
          php .github/tests/joomla56_club_merge_roster_country_uefa.php
          php .github/tests/joomla56_editmatch_teamplayer_playgroundticker.php
          php .github/tests/joomla56_eventsranking_media.php
