name: Joomla 5/6 birthday gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  birthday:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate birthday module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_birthday
          manifest="$module/mod_sportsmanagement_birthday.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/BirthdayHelper.php"
          test -f "$module/tmpl/default.php"
          test -f "$module/tmpl/default_player_card.php"
          test -f "$module/tmpl/default_player_sticker.php"
          test -f "$module/tmpl/jssor.php"
          test ! -d "$module/js"
          test ! -d "$module/css"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/BirthdayHelper.php"
          php -l "$module/mod_sportsmanagement_birthday.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"
          php -l "$module/tmpl/default_player_card.php"
          php -l "$module/tmpl/default_player_sticker.php"
          php -l "$module/tmpl/jssor.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementBirthday</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -Fq '<option value="J">BOOTSTRAP Slider</option>' "$manifest"
          grep -Fq "in_array(\$data['mode'], ['B', 'J'], true)" "$module/src/Dispatcher/Dispatcher.php"
          grep -Fq "useScript('bootstrap.carousel')" "$module/src/Dispatcher/Dispatcher.php"
          grep -Fq "params->get('table_class'" "$module/tmpl/default.php"
          grep -q 'data-bs-ride="carousel"' "$module/tmpl/jssor.php"
          grep -Fq 'SportsManagementDatabaseResolver' "$module/src/Helper/BirthdayHelper.php"

          if grep -q 'addfieldpath' "$manifest"; then
            echo 'Birthday manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -Eq '<folder>(js|css)</folder>' "$manifest"; then
            echo 'Birthday manifest reintroduced obsolete asset directories.' >&2
            exit 1
          fi

          if grep -Eiq 'jssor_transition|jssor_playorientation|jssor_captiontransitions|jquery\.simplyscroll|qscroller|wowslider' "$manifest"; then
            echo 'Birthday manifest reintroduced obsolete slider configuration.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/BirthdayHelper.php" \
            "$module/mod_sportsmanagement_birthday.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php" \
            "$module/tmpl/default_player_card.php" \
            "$module/tmpl/default_player_sticker.php" \
            "$module/tmpl/jssor.php"; then
            echo 'Birthday module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
