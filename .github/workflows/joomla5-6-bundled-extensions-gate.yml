name: Joomla 5/6 bundled extensions gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'sportsmanagement.xml'
      - 'script.joomla56.php'
      - 'modules/**'
      - 'admin/modules/**'
      - 'plugins/**'
      - '.github/workflows/joomla5-6-bundled-extensions-gate.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'sportsmanagement.xml'
      - 'script.joomla56.php'
      - 'modules/**'
      - 'admin/modules/**'
      - 'plugins/**'
      - '.github/workflows/joomla5-6-bundled-extensions-gate.yml'

jobs:
  bundled-extensions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate installer manifest contract
        shell: bash
        run: |
          set -euo pipefail
          php -l script.joomla56.php
          grep -Fq "xpath('modules/module')" script.joomla56.php
          grep -Fq "xpath('plugins/plugin')" script.joomla56.php

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse('sportsmanagement.xml').getroot()

          expected_modules = {
              ('mod_sportsmanagement_quickicon', 'administrator'),
              ('mod_sportsmanagement_rquotes', 'site'),
              ('mod_sportsmanagement_liveticker', 'site'),
              ('mod_sportsmanagement_count_rekord', 'site'),
              ('mod_sportsmanagement_ranking', 'site'),
              ('mod_sportsmanagement_birthday', 'site'),
              ('mod_sportsmanagement_club_birthday', 'site'),
              ('mod_sportsmanagement_clubicons', 'site'),
              ('mod_sportsmanagement_matches', 'site'),
              ('mod_sportsmanagement_matchesslider', 'site'),
              ('mod_sportsmanagement_eventsranking', 'site'),
              ('mod_sportsmanagement_new_project', 'site'),
              ('mod_sportsmanagement_act_season', 'site'),
              ('mod_sportsmanagement_playgroundplan', 'site'),
              ('mod_sportsmanagement_playground_ticker', 'site'),
              ('mod_sportsmanagement_randomplayer', 'site'),
              ('mod_sportsmanagement_teamplayers', 'site'),
              ('mod_sportsmanagement_teamstats_ranking', 'site'),
              ('mod_sportsmanagement_top_tipper', 'site'),
              ('mod_sportsmanagement_ajax_top_navigation_menu', 'site'),
              ('mod_sportsmanagement_navigation_menu', 'site'),
              ('mod_sportsmanagement_gcalendar', 'site'),
              ('mod_sportsmanagement_google_calendar', 'site'),
              ('mod_sportsmanagement_calendar', 'site'),
              ('mod_sportsmanagement_trainingsdata', 'site'),
              ('mod_sportsmanagement_sports_type_statistics', 'site'),
              ('mod_sportsmanagement_teamstatistics_counter', 'site'),
              ('mod_sportsmanagement_projectmap', 'site'),
              ('mod_sportsmanagement_uefawertung', 'site'),
              ('mod_sportsmanagement_firstleagueoverview', 'site'),
          }

          expected_plugins = {
              ('jsm_jcomments', 'sportsmanagement_comments', 'content'),
              ('jsm_search', 'jsm_search', 'finder'),
              ('jsm_userprofile', 'jsmprofile', 'user'),
              ('jsm_bootstrap', 'jsm_bootstrap', 'system'),
              ('jsm_ishupdate', 'jsm_ishupdate', 'system'),
              ('jsm_siscron', 'jsm_siscron', 'system'),
              ('jsm_registercomp', 'jsm_registercomp', 'system'),
          }

          modules = {
              (node.attrib.get('module', ''), node.attrib.get('client', ''))
              for node in root.findall('./modules/module')
          }
          plugins = {
              (
                  node.attrib.get('plugin', ''),
                  node.attrib.get('element', ''),
                  node.attrib.get('group', ''),
              )
              for node in root.findall('./plugins/plugin')
          }

          if modules != expected_modules:
              missing = sorted(expected_modules - modules)
              extra = sorted(modules - expected_modules)
              raise SystemExit(f'Bundled module declarations differ. Missing={missing}; extra={extra}')

          if plugins != expected_plugins:
              missing = sorted(expected_plugins - plugins)
              extra = sorted(plugins - expected_plugins)
              raise SystemExit(f'Bundled plugin declarations differ. Missing={missing}; extra={extra}')

          for module, client in expected_modules:
              base = Path('admin/modules') if client == 'administrator' else Path('modules')
              source = base / module
              manifest = source / f'{module}.xml'
              if not source.is_dir() or not manifest.is_file():
                  raise SystemExit(f'Missing bundled module source/manifest: {source}')

          for plugin, element, group in expected_plugins:
              source = Path('plugins') / plugin
              if not source.is_dir():
                  raise SystemExit(f'Missing bundled plugin source: {source}')

          finder_manifest = Path('plugins/jsm_search/jsm_search.xml')
          if not finder_manifest.is_file():
              raise SystemExit('Finder bundle must use plugins/jsm_search/jsm_search.xml')

          print(f'Bundled installer contract OK: {len(modules)} modules, {len(plugins)} plugins')
          PY
