name: Joomla 5/6 Google API provisioning and OAuth admin ACL

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/View/Jsmgcalendars/HtmlView.php'
      - 'admin/src/Controller/JsmgcalendarsController.php'
      - 'admin/src/Controller/JsmgcalendarimportController.php'
      - 'admin/src/Model/JsmgcalendarsModel.php'
      - 'admin/src/Model/JsmgcalendarimportModel.php'
      - '.github/tests/joomla56_calendar_provision_oauth_acl.php'
      - '.github/tests/joomla56_calendar_oauth_import_bounds.php'
      - '.github/workflows/joomla5-6-calendar-explicit-provision-oauth-acl.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/View/Jsmgcalendars/HtmlView.php'
      - 'admin/src/Controller/JsmgcalendarsController.php'
      - 'admin/src/Controller/JsmgcalendarimportController.php'
      - 'admin/src/Model/JsmgcalendarsModel.php'
      - 'admin/src/Model/JsmgcalendarimportModel.php'
      - '.github/tests/joomla56_calendar_provision_oauth_acl.php'
      - '.github/tests/joomla56_calendar_oauth_import_bounds.php'
      - '.github/workflows/joomla5-6-calendar-explicit-provision-oauth-acl.yml'

permissions:
  contents: read

jobs:
  oauth-guards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify PHP syntax and required metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/View/Jsmgcalendars/HtmlView.php
            admin/src/Controller/JsmgcalendarsController.php
            admin/src/Controller/JsmgcalendarimportController.php
            admin/src/Model/JsmgcalendarsModel.php
            admin/src/Model/JsmgcalendarimportModel.php
            .github/tests/joomla56_calendar_provision_oauth_acl.php
            .github/tests/joomla56_calendar_oauth_import_bounds.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Test explicit package installation and OAuth ACL
        run: php .github/tests/joomla56_calendar_provision_oauth_acl.php
      - name: Test OAuth input, pagination and calendar count bounds
        run: php .github/tests/joomla56_calendar_oauth_import_bounds.php
