name: Joomla 5/6 Calendar Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate calendar module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_calendar
          runtime="$module/src/Runtime/CalendarRuntime.php"
          runtime_compat="$module/connectors/calendarRuntime_j5.php"
          sports_connector="$module/connectors/sportsmanagement_j5.php"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/CalendarHelper.php"
          php -l "$module/helper.php"
          php -l "$module/mod_sportsmanagement_calendar.php"
          php -l "$module/calendarClass.php"
          php -l "$module/calendarFunctions.php"
          php -l "$runtime"
          php -l "$runtime_compat"
          php -l "$sports_connector"
          php -l "$module/connectors/jevents_j5.php"
          php -l "$module/connectors/livescore_j5.php"
          for template in "$module"/tmpl/*.php; do php -l "$template"; done
          node --check "$module/assets/js/mod_sportsmanagement_calendar.js"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementCalendar</namespace>' "$module/mod_sportsmanagement_calendar.xml"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$module/mod_sportsmanagement_calendar.xml"
          ! grep -Fq 'addfieldpath=' "$module/mod_sportsmanagement_calendar.xml"
          ! grep -Fq 'table-condensed' "$module/mod_sportsmanagement_calendar.xml"
          ! grep -Fq '<folder>tuicalendar</folder>' "$module/mod_sportsmanagement_calendar.xml"

          grep -Fq "'default_arrobefr', 'default_tuicalendar' => 'default_jsm'" "$module/src/Dispatcher/Dispatcher.php"
          grep -Fq "require __DIR__ . '/default_jsm.php';" "$module/tmpl/default_arrobefr.php"
          grep -Fq "require __DIR__ . '/default_jsm.php';" "$module/tmpl/default_tuicalendar.php"
          ! grep -REn 'uicdn\.toast\.com|cdn\.jsdelivr\.net/npm/arrobefr|cdnjs\.cloudflare\.com|jquery\.touchSwipe|window\.tui\.Calendar' \
            "$module/tmpl/default_arrobefr.php" "$module/tmpl/default_tuicalendar.php"

          grep -Fq 'public function refreshAjax(): string' "$module/src/Helper/CalendarHelper.php"
          grep -Fq 'ModuleHelper::getModuleById' "$module/src/Helper/CalendarHelper.php"
          grep -Fq 'method=refresh&format=raw' "$module/tmpl/default_jsm.php"
          grep -Fq 'data-refresh-url=' "$module/tmpl/default_jsm.php"
          grep -Fq 'data-jsm-calendar-team=' "$module/tmpl/default_jsm.php"
          grep -Fq 'fetch(requestUrl' "$module/assets/js/mod_sportsmanagement_calendar.js"
          grep -Fq "method: 'GET'" "$module/assets/js/mod_sportsmanagement_calendar.js"
          grep -Fq "requestUrl.searchParams.set('module_id'" "$module/assets/js/mod_sportsmanagement_calendar.js"
          ! grep -Fq 'fetch(window.location.href' "$module/assets/js/mod_sportsmanagement_calendar.js"

          grep -Fq "self::\$params->get('time_zone'" "$runtime"
          grep -Fq 'new \DateTimeZone' "$runtime"
          grep -Fq '$firstDay->getTimestamp()' "$runtime"
          grep -Fq '$lastDay->getTimestamp()' "$runtime"
          ! grep -Fq 'sportsmanagementHelper::getTimestamp' "$runtime"

          grep -Fq 'use Diddipoeler\Component\SportsManagement\Site\Service\SportsManagementDatabaseResolver;' "$sports_connector"
          grep -Fq 'use Joomla\Database\DatabaseInterface;' "$sports_connector"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$sports_connector"
          grep -Fq 'SportsManagementDatabaseResolver::resolve($joomlaDatabase, $selector)' "$sports_connector"
          grep -Fq "self::\$xparams->get('cfg_which_database'" "$sports_connector"
          grep -Fq "'image' => \$image" "$sports_connector"
          ! grep -Fq 'getDBConnection(' "$sports_connector"

          test ! -e "$module/calendarFunctions-2.php"
          test ! -e "$module/connectors/jevents.php"
          test ! -e "$module/connectors/livescore.php"
          test ! -e "$module/connectors/sportsmanagement.php"
          test ! -e "$module/connectors/ajaxHelper_j5.php"
          test ! -e "$module/assets/js/calendars.js"
          test ! -e "$module/assets/js/mod_sportsmanagement_calendar_2.js"
          test ! -e "$module/assets/js/schedules.js"
          test ! -e "$module/tuicalendar/app.js"
          test ! -e "$module/tuicalendar/dist/tui-calendar.js"
          test ! -e "$module/tuicalendar/dist/tui-calendar.min.js"
          test ! -e "$module/tuicalendar/dist/tui-calendar.css"
          test ! -e "$module/tuicalendar/dist/tui-calendar.min.css"

          ! grep -REn 'JLoader::|jimport\(|BaseDatabaseModel::getInstance|Factory::get(Document|Language|User|Config|Dbo)\(|->disconnect\(' \
            "$module/services" \
            "$module/src" \
            "$module/mod_sportsmanagement_calendar.php" \
            "$module/calendarClass.php" \
            "$module/calendarFunctions.php" \
            "$runtime" \
            "$runtime_compat" \
            "$sports_connector" \
            "$module/connectors/jevents_j5.php" \
            "$module/connectors/livescore_j5.php"
