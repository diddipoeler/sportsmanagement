name: Joomla 5/6 calendar navigation and referee notifications

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php'
      - 'site/src/Controller/EditmatchController.php'
      - 'admin/src/Service/MatchRefereeNotificationService.php'
      - '.github/tests/joomla56_editmatch_calendar_navigation.php'
      - '.github/tests/joomla56_referee_notification_safety.php'
      - '.github/workflows/joomla5-6-calendar-navigation-referee-safety.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php'
      - 'site/src/Controller/EditmatchController.php'
      - 'admin/src/Service/MatchRefereeNotificationService.php'
      - '.github/tests/joomla56_editmatch_calendar_navigation.php'
      - '.github/tests/joomla56_referee_notification_safety.php'
      - '.github/workflows/joomla5-6-calendar-navigation-referee-safety.yml'

permissions:
  contents: read

jobs:
  calendar-navigation-notifications:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax and mandatory metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php
            site/src/Controller/EditmatchController.php
            admin/src/Service/MatchRefereeNotificationService.php
          )
          php .github/tests/phpdoc_metadata.php "${files[@]}"
          for file in "${files[@]}" .github/tests/joomla56_editmatch_calendar_navigation.php .github/tests/joomla56_referee_notification_safety.php; do
            php -l "$file"
          done

      - name: Test frontend return URLs and calendar module IDs
        run: php .github/tests/joomla56_editmatch_calendar_navigation.php

      - name: Test administrator referee notifications
        run: php .github/tests/joomla56_referee_notification_safety.php
