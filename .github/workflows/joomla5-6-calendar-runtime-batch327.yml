name: Joomla 5/6 calendar runtime batch 327

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_calendar/calendarClass.php'
      - 'modules/mod_sportsmanagement_calendar/calendarFunctions.php'
      - '.github/workflows/joomla5-6-calendar-runtime-batch327.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_calendar/calendarClass.php'
      - 'modules/mod_sportsmanagement_calendar/calendarFunctions.php'
      - '.github/workflows/joomla5-6-calendar-runtime-batch327.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate calendar runtime bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_calendar/calendarClass.php
            modules/mod_sportsmanagement_calendar/calendarFunctions.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          done
          grep -Fq -- "throw new \\RuntimeException('SportsManagement native CalendarRenderer could not be loaded.'" modules/mod_sportsmanagement_calendar/calendarClass.php
          grep -Fq -- "throw new \\RuntimeException('SportsManagement native CalendarFunctions runtime could not be loaded.'" modules/mod_sportsmanagement_calendar/calendarFunctions.php
          grep -Fq -- "class_alias(CalendarRenderer::class, 'PHPCalendar')" modules/mod_sportsmanagement_calendar/calendarClass.php
