name: Joomla 5/6 calendar runtime regressions

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Service/GoogleCalendarReadService.php'
      - 'admin/src/Service/GoogleCalendarMatchSynchronizer.php'
      - 'modules/mod_sportsmanagement_google_calendar/tmpl/default.php'
      - '.github/tests/joomla5-6-calendar-runtime.php'
      - '.github/tests/joomla56_calendar_pagination_bounds.php'
      - '.github/tests/joomla56_calendar_oauth_log_safety.php'
      - '.github/workflows/joomla5-6-calendar-runtime-regressions.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Service/GoogleCalendarReadService.php'
      - 'admin/src/Service/GoogleCalendarMatchSynchronizer.php'
      - 'modules/mod_sportsmanagement_google_calendar/tmpl/default.php'
      - '.github/tests/joomla5-6-calendar-runtime.php'
      - '.github/tests/joomla56_calendar_pagination_bounds.php'
      - '.github/tests/joomla56_calendar_oauth_log_safety.php'
      - '.github/workflows/joomla5-6-calendar-runtime-regressions.yml'

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint calendar site, admin and module PHP
        run: |
          php -l site/src/Service/GoogleCalendarReadService.php
          php -l admin/src/Service/GoogleCalendarMatchSynchronizer.php
          php -l modules/mod_sportsmanagement_google_calendar/tmpl/default.php
          php -l .github/tests/joomla5-6-calendar-runtime.php
          php -l .github/tests/joomla56_calendar_pagination_bounds.php
          php -l .github/tests/joomla56_calendar_oauth_log_safety.php
      - name: Check four required PHPDoc tags
        run: |
          php .github/tests/phpdoc_metadata.php \
            site/src/Service/GoogleCalendarReadService.php \
            admin/src/Service/GoogleCalendarMatchSynchronizer.php \
            modules/mod_sportsmanagement_google_calendar/tmpl/default.php
      - name: Test timezone ordering, event durations and safe links
        run: php .github/tests/joomla5-6-calendar-runtime.php
      - name: Test bounded Google Calendar pagination and time windows
        run: php .github/tests/joomla56_calendar_pagination_bounds.php
      - name: Test Google Calendar OAuth parameters and diagnostic secrecy
        run: php .github/tests/joomla56_calendar_oauth_log_safety.php
