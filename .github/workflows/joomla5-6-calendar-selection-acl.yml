name: Joomla 5/6 Calendar selection and ACL

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/JsonfeedModel.php'
      - 'site/src/Service/GoogleCalendarReadService.php'
      - 'admin/src/Service/GoogleCalendarMatchSynchronizer.php'
      - 'modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php'
      - '.github/tests/joomla56_calendar_selection_acl.php'
      - '.github/workflows/joomla5-6-calendar-selection-acl.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/JsonfeedModel.php'
      - 'site/src/Service/GoogleCalendarReadService.php'
      - 'admin/src/Service/GoogleCalendarMatchSynchronizer.php'
      - 'modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php'
      - '.github/tests/joomla56_calendar_selection_acl.php'
      - '.github/workflows/joomla5-6-calendar-selection-acl.yml'

permissions:
  contents: read

jobs:
  calendar-selection-acl:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax and file-level metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Model/JsonfeedModel.php
            site/src/Service/GoogleCalendarReadService.php
            admin/src/Service/GoogleCalendarMatchSynchronizer.php
            modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
          )
          php .github/tests/phpdoc_metadata.php "${files[@]}"
          for file in "${files[@]}" .github/tests/joomla56_calendar_selection_acl.php; do
            php -l "$file"
          done

      - name: Run calendar selection and ACL regression tests
        run: php .github/tests/joomla56_calendar_selection_acl.php
