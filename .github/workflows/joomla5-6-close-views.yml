name: Joomla 5/6 close views

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/View/Close/HtmlView.php'
      - 'admin/views/close/view.html.php'
      - 'site/src/View/Close/HtmlView.php'
      - 'site/views/close/view.html.php'
      - '.github/workflows/joomla5-6-close-views.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/View/Close/HtmlView.php'
      - 'admin/views/close/view.html.php'
      - 'site/src/View/Close/HtmlView.php'
      - 'site/views/close/view.html.php'
      - '.github/workflows/joomla5-6-close-views.yml'

jobs:
  close-views:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: |
          php -l admin/src/View/Close/HtmlView.php
          php -l admin/views/close/view.html.php
          php -l site/src/View/Close/HtmlView.php
          php -l site/views/close/view.html.php

      - name: Validate native close paths
        shell: bash
        run: |
          admin_native=admin/src/View/Close/HtmlView.php
          admin_bridge=admin/views/close/view.html.php
          site_native=site/src/View/Close/HtmlView.php
          site_bridge=site/views/close/view.html.php

          grep -Fq 'getWebAssetManager()->addInlineScript' "$admin_native"
          grep -Fq 'sportsmanagement:close-modal' "$admin_native"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewClose')" "$admin_bridge"

          grep -Fq 'getWebAssetManager()->addInlineScript' "$site_native"
          grep -Fq 'window.parent.location.reload()' "$site_native"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewClose')" "$site_bridge"

          if grep -R -E 'SqueezeBox|jimport\(|Factory::getDocument\(|addScriptDeclaration\(' \
              "$admin_native" "$admin_bridge" "$site_native" "$site_bridge"; then
            echo 'Close views reintroduced a Joomla 3 modal or document path' >&2
            exit 1
          fi
