name: Joomla 5/6 Club Birthday Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  club-birthday:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate club birthday module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_club_birthday
          manifest="$module/mod_sportsmanagement_club_birthday.xml"
          provider="$module/services/provider.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/ClubBirthdayHelper.php"
          entry="$module/mod_sportsmanagement_club_birthday.php"
          bridge="$module/helper.php"
          list_layout="$module/tmpl/default.php"
          carousel="$module/tmpl/default_carousel.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php

          test -f "$provider"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$list_layout"
          test -f "$carousel"
          test -f "$resolver"
          test ! -d "$module/js"
          test ! -d "$module/css"
          test ! -d "$module/images"
          test ! -d "$module/tooltips"

          php -l "$provider"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$entry"
          php -l "$bridge"
          php -l "$list_layout"
          php -l "$carousel"
          php -l "$resolver"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementClubBirthday</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_club_birthday">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq '<option value="L">LIST</option>' "$manifest"
          grep -Fq '<option value="BC">BOOTSTRAP Carousel</option>' "$manifest"
          grep -Fq 'name="limit"' "$manifest"
          grep -Fq 'name="maxdays"' "$manifest"
          grep -Fq 'name="picture_width"' "$manifest"
          grep -Fq 'name="cache_time"' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"
          ! grep -Eq '<folder>(js|css|images|tooltips)</folder>|jssor|wowslider|qscroller|jquery\.simplyscroll|<option value="T">' "$manifest"

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq "useScript('bootstrap.carousel')" "$dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq "params->get('maxdays'" "$helper"
          grep -Fq 'days_to_birthday' "$helper"
          grep -Fq 'PHP_QUERY_RFC3986' "$helper"
          grep -Fq 'SportsManagementDatabaseResolver' "$resolver"
          grep -Fq 'DatabaseFactory' "$resolver"
          grep -Fq 'hash_equals' "$resolver"

          ! grep -Fq 'getDBConnection' "$helper"
          ! grep -Fq 'sportsmanagementHelperRoute' "$helper"
          ! grep -Fq '<script' "$list_layout"
          ! grep -Fq '<script' "$carousel"

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(|sportsmanagementHelperRoute|sportsmanagementHelper::getDBConnection' \
            "$provider" \
            "$dispatcher" \
            "$helper" \
            "$entry" \
            "$bridge" \
            "$module/tmpl"; then
            echo 'Club birthday module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          ! grep -REn 'Factory::getConfig\(|Factory::getDbo\(|JDatabaseDriver|JDatabase::' "$resolver"
