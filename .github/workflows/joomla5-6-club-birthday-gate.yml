name: Joomla 5/6 club birthday gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  club-birthday:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate club birthday module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_club_birthday
          manifest="$module/mod_sportsmanagement_club_birthday.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/ClubBirthdayHelper.php"
          test -f "$module/tmpl/default.php"
          test -f "$module/tmpl/default_carousel.php"
          test ! -d "$module/js"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/ClubBirthdayHelper.php"
          php -l "$module/mod_sportsmanagement_club_birthday.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"
          php -l "$module/tmpl/default_carousel.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementClubBirthday</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q "useScript('bootstrap.carousel')" "$module/src/Dispatcher/Dispatcher.php"
          grep -Fq 'getDBConnection(true, $selector)' "$module/src/Helper/ClubBirthdayHelper.php"
          grep -q "params->get('maxdays'" "$module/src/Helper/ClubBirthdayHelper.php"
          grep -q 'days_to_birthday' "$module/src/Helper/ClubBirthdayHelper.php"
          grep -q '<option value="L">LIST</option>' "$manifest"
          grep -q '<option value="BC">BOOTSTRAP Carousel</option>' "$manifest"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'Club birthday manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E '<folder>(js|css)</folder>|jssor|wowslider|qscroller|jquery\.simplyscroll|<option value="T">' "$manifest"; then
            echo 'Club birthday manifest regressed to an obsolete slider/ticker runtime.' >&2
            exit 1
          fi

          if grep -q '<script' "$module/tmpl/default.php"; then
            echo 'Club birthday list template regressed to inline JavaScript.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/ClubBirthdayHelper.php" \
            "$module/mod_sportsmanagement_club_birthday.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php" \
            "$module/tmpl/default_carousel.php"; then
            echo 'Club birthday module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
