name: Joomla 5/6 club birthday module

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_club_birthday/**'
      - '.github/workflows/joomla5-6-club-birthday.yml'
  pull_request:
    branches: [master]
    paths:
      - 'modules/mod_sportsmanagement_club_birthday/**'
      - '.github/workflows/joomla5-6-club-birthday.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_club_birthday
          files=(
            "$module/mod_sportsmanagement_club_birthday.php"
            "$module/helper.php"
            "$module/services/provider.php"
            "$module/src/Dispatcher/Dispatcher.php"
            "$module/src/Helper/ClubBirthdayHelper.php"
            "$module/tmpl/default.php"
            "$module/tmpl/default_carousel.php"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.xml"); if (!$xml) { exit(1); }'

      - name: Validate Joomla 5/6 module contracts
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_club_birthday

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementClubBirthday</namespace>' "$module/mod_sportsmanagement_club_birthday.xml"
          grep -Fq '<folder module="mod_sportsmanagement_club_birthday">services</folder>' "$module/mod_sportsmanagement_club_birthday.xml"
          grep -Fq "new ModuleDispatcherFactory('Diddipoeler\\Module\\SportsManagementClubBirthday')" "$module/services/provider.php"
          grep -Fq "new HelperFactory('Diddipoeler\\Module\\SportsManagementClubBirthday\\Site\\Helper')" "$module/services/provider.php"
          grep -Fq 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface' "$module/src/Dispatcher/Dispatcher.php"
          grep -Fq "getHelper('ClubBirthdayHelper')" "$module/src/Dispatcher/Dispatcher.php"
          grep -Fq 'DatabaseInterface::class' "$module/src/Dispatcher/Dispatcher.php"
          grep -Fq "useScript('bootstrap.carousel')" "$module/src/Dispatcher/Dispatcher.php"
          grep -Fq 'CMSApplicationInterface $app' "$module/src/Helper/ClubBirthdayHelper.php"
          grep -Fq 'DatabaseInterface $fallbackDatabase' "$module/src/Helper/ClubBirthdayHelper.php"
          grep -Fq 'Fall back to Joomla' "$module/src/Helper/ClubBirthdayHelper.php"
          grep -Fq 'new ClubBirthdayHelper()' "$module/helper.php"
          grep -Fq 'ClubBirthdayHelper::sortClubs' "$module/helper.php"
          grep -Fq 'new ClubBirthdayHelper()' "$module/mod_sportsmanagement_club_birthday.php"

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Joomla\\CMS\\Filesystem\\(File|Folder|Path)|Joomla\\CMS\\Http\\|Table::getInstance\('
          if grep -ER "$legacy_re" \
            "$module/mod_sportsmanagement_club_birthday.php" \
            "$module/helper.php" \
            "$module/services" \
            "$module/src" \
            "$module/tmpl"; then
            echo 'Club birthday module regressed to a legacy Joomla API' >&2
            exit 1
          fi
