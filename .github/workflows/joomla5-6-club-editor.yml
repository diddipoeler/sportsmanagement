name: Joomla 5/6 club editor gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  club-editor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native club editor
        shell: bash
        run: |
          set -euo pipefail

          php_files=(
            admin/src/Dispatcher/Dispatcher.php
            admin/src/View/Club/HtmlView.php
            admin/src/Controller/ClubController.php
            admin/src/Controller/SportsManagementFormController.php
            admin/src/Model/ClubModel.php
            admin/src/Table/ClubTable.php
            admin/src/Helper/LocationHelper.php
            admin/src/Helper/SportsManagementDatabaseResolver.php
            admin/src/Field/GeocompleteField.php
            admin/src/Field/DependsqlField.php
            admin/src/Field/Playgroundlist2Field.php
            admin/src/Field/TeamlistField.php
            admin/src/Field/ExtensionradiobuttonField.php
            admin/src/Field/KunenaCategoryListField.php
            admin/tmpl/club/edit.php
            admin/views/club/view.html.php
            admin/views/club/tmpl/edit.php
            admin/controllers/club.php
            admin/models/club.php
          )

          for file in "${php_files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq 'namespace Diddipoeler\Component\SportsManagement\Administrator\View\Club;' admin/src/View/Club/HtmlView.php
          grep -Fq 'class HtmlView extends BaseHtmlView' admin/src/View/Club/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewClub')" admin/views/club/view.html.php
          grep -Fq "class_alias(ClubController::class, 'sportsmanagementControllerclub')" admin/controllers/club.php
          grep -Fq "class_alias(ClubModel::class, 'sportsmanagementModelclub')" admin/models/club.php
          grep -Fq "'club', 'clubname'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "['club', 'league', 'playground', 'position', 'rosterposition', 'team']" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "require JPATH_ADMINISTRATOR . '/components/com_sportsmanagement/tmpl/club/edit.php';" admin/views/club/tmpl/edit.php

          grep -Fq 'SportsManagementDatabaseResolver' admin/src/View/Club/HtmlView.php
          if grep -Fq -- '->getDatabase()' admin/src/View/Club/HtmlView.php admin/src/Controller/ClubController.php; then
            echo 'Club editor regressed to protected model database access.' >&2
            exit 1
          fi

          if grep -Fq 'Form::getInstance(' admin/src/View/Club/HtmlView.php; then
            echo 'Club editor regressed to removed Form::getInstance().' >&2
            exit 1
          fi

          grep -Fq 'resolveDetailed(' admin/src/Controller/ClubController.php
          grep -Fq 'addressdetails=1' admin/src/Helper/LocationHelper.php
          grep -Fq 'mergeAddressDetails(' admin/src/Controller/ClubController.php
          grep -Fq "COM_SPORTSMANAGEMENT_OSM_ROAD" admin/src/Controller/ClubController.php
          grep -Fq "COM_SPORTSMANAGEMENT_OSM_CITY" admin/src/Controller/ClubController.php

          grep -Fq 'storeLogoHistory(' admin/src/Model/ClubModel.php
          grep -Fq 'updateSubmittedTeams(' admin/src/Model/ClubModel.php
          grep -Fq 'ExtraFieldsSaveHelper' admin/src/Model/ClubModel.php
          grep -Fq "case 'club':" admin/src/Controller/SportsManagementFormController.php
          grep -Fq 'if ($createTeam)' admin/src/Controller/SportsManagementFormController.php
          grep -Fq 'name="createTeam"' admin/tmpl/club/edit.php
          grep -Fq 'name="logo_middle" type="hidden"' admin/forms/club.xml
          grep -Fq 'name="logo_small" type="hidden"' admin/forms/club.xml

          xml_files=(
            admin/forms/club.xml
            admin/models/forms/club.xml
            admin/forms/clublogohistory.xml
            admin/assets/extended/club.xml
          )

          php -r '$files=array_slice($argv,1); foreach ($files as $file) { if (simplexml_load_file($file) === false) { fwrite(STDERR, "Invalid XML: $file\n"); exit(1); } }' "${xml_files[@]}"

          if grep -Fq 'addfieldpath=' admin/forms/club.xml admin/models/forms/club.xml; then
            echo 'Club form regressed to legacy field paths.' >&2
            exit 1
          fi

          if grep -Fq 'addrulepath=' admin/forms/club.xml admin/models/forms/club.xml; then
            echo 'Club form regressed to legacy rule paths.' >&2
            exit 1
          fi

          if grep -Fq 'JComponentHelper::filterText' admin/forms/club.xml admin/models/forms/club.xml; then
            echo 'Club form regressed to legacy editor filter callback.' >&2
            exit 1
          fi

          if grep -Fq 'showon="show_info' admin/forms/club.xml admin/models/forms/club.xml; then
            echo 'Club media fields regressed to missing legacy showon controls.' >&2
            exit 1
          fi

          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' admin/forms/club.xml
          grep -Fq 'type="KunenaCategoryList"' admin/forms/club.xml
          grep -Fq 'filter="safehtml"' admin/forms/club.xml
          cmp -s admin/forms/club.xml admin/models/forms/club.xml
