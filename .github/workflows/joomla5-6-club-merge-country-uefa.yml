name: Joomla 5/6 club merge roster country UEFA guards

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/EditclubController.php'
      - 'admin/src/Model/TeamplayerModel.php'
      - 'modules/mod_sportsmanagement_uefawertung/src/Helper/UefaWertungHelper.php'
      - '.github/tests/joomla56_club_merge_roster_country_uefa.php'
      - '.github/workflows/joomla5-6-club-merge-country-uefa.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/EditclubController.php'
      - 'admin/src/Model/TeamplayerModel.php'
      - 'modules/mod_sportsmanagement_uefawertung/src/Helper/UefaWertungHelper.php'
      - '.github/tests/joomla56_club_merge_roster_country_uefa.php'
      - '.github/workflows/joomla5-6-club-merge-country-uefa.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and required PHPDoc tags
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Controller/EditclubController.php
            admin/src/Model/TeamplayerModel.php
            modules/mod_sportsmanagement_uefawertung/src/Helper/UefaWertungHelper.php
            .github/tests/joomla56_club_merge_roster_country_uefa.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Club merging, roster country and UEFA DB errors
        shell: bash
        run: |
          set -euo pipefail
          php .github/tests/joomla56_club_merge_roster_country_uefa.php
          php .github/tests/joomla56_club_roster_firstleague_guard.php
          php .github/tests/joomla56_match_roster_birthday_scope.php
