name: Joomla 5/6 club roster league overview regressions

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/EditclubModel.php'
      - 'admin/src/Model/TeamplayerModel.php'
      - 'modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php'
      - '.github/tests/joomla56_club_save_contract.php'
      - '.github/tests/joomla56_club_roster_firstleague_guard.php'
      - '.github/workflows/joomla5-6-club-roster-firstleague-guard.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/EditclubModel.php'
      - 'admin/src/Model/TeamplayerModel.php'
      - 'modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php'
      - '.github/tests/joomla56_club_save_contract.php'
      - '.github/tests/joomla56_club_roster_firstleague_guard.php'
      - '.github/workflows/joomla5-6-club-roster-firstleague-guard.yml'

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP lint and metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Model/EditclubModel.php
            admin/src/Model/TeamplayerModel.php
            modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php
            .github/tests/joomla56_club_save_contract.php
            .github/tests/joomla56_club_roster_firstleague_guard.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Club editor, roster state and league module
        shell: bash
        run: |
          set -euo pipefail
          php .github/tests/joomla56_club_save_contract.php
          php .github/tests/joomla56_club_roster_firstleague_guard.php
          php .github/tests/joomla56_firstleagueoverview_tabs.php
          php .github/tests/joomla56_editmatch_teamplayer_playgroundticker.php
