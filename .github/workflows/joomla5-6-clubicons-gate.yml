name: Joomla 5/6 Club Icons Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  club-icons:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate club icons module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_clubicons
          manifest="$module/mod_sportsmanagement_clubicons.xml"
          provider="$module/services/provider.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/ClubiconsHelper.php"
          entry="$module/mod_sportsmanagement_clubicons.php"
          bridge="$module/helper.php"
          default="$module/tmpl/default.php"
          carousel="$module/tmpl/default_carousel.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php
          ranking_engine=site/src/Service/RankingEngine.php

          test -f "$provider"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$default"
          test -f "$carousel"
          test -f "$resolver"
          test -f "$ranking_engine"
          test ! -d "$module/js"
          test ! -d "$module/elements"

          php -l "$provider"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$entry"
          php -l "$bridge"
          php -l "$default"
          php -l "$carousel"
          php -l "$resolver"
          php -l "$ranking_engine"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_clubicons/mod_sportsmanagement_clubicons.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementClubicons</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_clubicons">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          grep -Fq 'default_carousel' "$manifest"
          ! grep -Fq 'addfieldpath' "$manifest"
          ! grep -Eq '<folder>(js|elements)</folder>' "$manifest"

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'HelperFactory' "$provider"
          grep -Fq "useScript('bootstrap.carousel')" "$dispatcher"
          grep -Fq 'registerAndUseStyle' "$dispatcher"
          grep -Fq 'addInlineStyle' "$dispatcher"
          grep -Fq 'data-bs-ride="carousel"' "$carousel"
          grep -Fq "params->get('iconpos'" "$default"
          grep -Fq "params->get('moduleclass_sfx'" "$default"

          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq 'new RankingEngine($db)' "$helper"
          grep -Fq 'PHP_QUERY_RFC3986' "$helper"
          grep -Fq 'SportsManagementDatabaseResolver' "$resolver"
          grep -Fq 'DatabaseFactory' "$resolver"
          grep -Fq 'hash_equals' "$resolver"

          ! grep -Fq 'getDBConnection' "$helper"
          ! grep -Fq 'sportsmanagementHelper' "$helper"
          ! grep -Fq 'bootRankingEngine' "$helper"
          ! grep -Fq "components/com_sportsmanagement/src/Service" "$helper"
          ! grep -Fq 'require_once' "$helper"

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(|sportsmanagementHelper::getDBConnection' \
            "$provider" \
            "$dispatcher" \
            "$helper" \
            "$entry" \
            "$bridge" \
            "$module/tmpl"; then
            echo 'Club icons module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          ! grep -REn 'Factory::getConfig\(|Factory::getDbo\(|JDatabaseDriver|JDatabase::' "$resolver"
