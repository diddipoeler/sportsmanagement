name: Joomla 5/6 club icons gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  club-icons:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate club icons module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_clubicons
          manifest="$module/mod_sportsmanagement_clubicons.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/ClubiconsHelper.php"
          test -f "$module/tmpl/default.php"
          test -f "$module/tmpl/default_carousel.php"
          test ! -d "$module/js"
          test ! -d "$module/elements"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/ClubiconsHelper.php"
          php -l "$module/mod_sportsmanagement_clubicons.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"
          php -l "$module/tmpl/default_carousel.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementClubicons</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'default_carousel' "$manifest"
          grep -Fq "useScript('bootstrap.carousel')" "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'data-bs-ride="carousel"' "$module/tmpl/default_carousel.php"
          grep -Fq "params->get('iconpos'" "$module/tmpl/default.php"
          grep -Fq "params->get('moduleclass_sfx'" "$module/tmpl/default.php"
          grep -Fq 'getDBConnection(true, (int) $params->get' "$module/src/Helper/ClubiconsHelper.php"

          if grep -q 'addfieldpath' "$manifest"; then
            echo 'Club icons manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -Eq '<folder>(js|elements)</folder>' "$manifest"; then
            echo 'Club icons manifest reintroduced obsolete compatibility folders.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/ClubiconsHelper.php" \
            "$module/mod_sportsmanagement_clubicons.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php" \
            "$module/tmpl/default_carousel.php"; then
            echo 'Club icons module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
