name: Joomla 5/6 Clubinfo guest and ID boundaries

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/ClubinfoModel.php'
      - '.github/tests/joomla56_clubinfo_guest_ids.php'
      - '.github/workflows/joomla5-6-clubinfo-guest-ids.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clubinfo:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint Clubinfo model and regression test
        run: |
          php -l site/src/Model/ClubinfoModel.php
          php -l .github/tests/joomla56_clubinfo_guest_ids.php
      - name: Check guest ACL and legacy selectors
        run: php .github/tests/joomla56_clubinfo_guest_ids.php
