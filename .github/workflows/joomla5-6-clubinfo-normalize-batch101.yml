name: Joomla 5/6 clubinfo normalizer batch 101

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Clubinfo/HtmlView.php'
      - 'site/src/Model/ClubinfoModel.php'
      - 'site/src/Model/ClubinfoViewDataModel.php'
      - 'site/models/clubinfo.php'
      - 'site/tmpl/clubinfo/**.php'
      - 'site/views/clubinfo/tmpl/**.php'
      - 'site/tmpl/globalviews/default_extrafields.php'
      - '.github/workflows/joomla5-6-clubinfo-normalize-batch101.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: joomla5-6
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Normalize Clubinfo PHP metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('site/src/View/Clubinfo/HtmlView.php'),
              Path('site/src/Model/ClubinfoModel.php'),
              Path('site/src/Model/ClubinfoViewDataModel.php'),
              Path('site/models/clubinfo.php'),
              *sorted(Path('site/tmpl/clubinfo').glob('*.php')),
              *sorted(Path('site/views/clubinfo/tmpl').glob('*.php')),
              Path('site/tmpl/globalviews/default_extrafields.php'),
          ]
          if len(files) != 21:
              raise SystemExit(f'Expected 21 scoped PHP files, got {len(files)}')

          header = '''/**
           * Joomla 5/6 Clubinfo migration.
           *
           * @version    5.6.0
           * @author     diddipoeler
           * @copyright  Copyright (C) diddipoeler
           * @license    GNU General Public License version 2 or later; see LICENSE.txt
           */'''

          for path in files:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('<?php'):
                  raise SystemExit(f'{path}: missing PHP opening tag')
              rest = text[5:]
              rest = re.sub(r'^\s*/\*\*.*?\*/\s*', '\n', rest, count=1, flags=re.S)
              path.write_text('<?php\n' + header + '\n' + rest.lstrip('\n'), encoding='utf-8')
          PY

      - name: Validate Clubinfo batch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(printf '%s\n' \
            site/src/View/Clubinfo/HtmlView.php \
            site/src/Model/ClubinfoModel.php \
            site/src/Model/ClubinfoViewDataModel.php \
            site/models/clubinfo.php; \
            find site/tmpl/clubinfo -maxdepth 1 -type f -name '*.php' -print | sort; \
            find site/views/clubinfo/tmpl -maxdepth 1 -type f -name '*.php' -print | sort; \
            printf '%s\n' site/tmpl/globalviews/default_extrafields.php)

          test "${#files[@]}" -eq 21
          for file in "${files[@]}"; do
            php -l "$file"
            grep -Fq '@version    5.6.0' "$file"
            grep -Fq '@author     diddipoeler' "$file"
            grep -Fq '@copyright  Copyright (C) diddipoeler' "$file"
            grep -Fq '@license    GNU General Public License version 2 or later; see LICENSE.txt' "$file"
            ! grep -Fq 'Fussball in Europa' "$file"
            ! grep -Fq '@version    1.0.05' "$file"
          done

          grep -Fq '$model->getSportsManagementDatabase()' site/tmpl/globalviews/default_extrafields.php
          ! grep -Fq '$model->getDatabase()' site/tmpl/globalviews/default_extrafields.php
          grep -Fq 'public function getSportsManagementDatabase(): DatabaseInterface' site/src/Model/SportsManagementModel.php
          grep -Fq '$database = $model->getSportsManagementDatabase();' site/src/View/Clubinfo/HtmlView.php
          grep -Fq 'final class ClubinfoViewDataModel extends SportsManagementProjectModel' site/src/Model/ClubinfoViewDataModel.php
          grep -Fq "class_alias(ClubinfoModel::class, 'sportsmanagementModelClubInfo')" site/models/clubinfo.php

      - name: Commit normalized Clubinfo source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/src/View/Clubinfo/HtmlView.php \
                  site/src/Model/ClubinfoModel.php \
                  site/src/Model/ClubinfoViewDataModel.php \
                  site/models/clubinfo.php \
                  site/tmpl/clubinfo \
                  site/views/clubinfo/tmpl \
                  site/tmpl/globalviews/default_extrafields.php
          git commit -m 'Normalize Joomla 5/6 Clubinfo metadata batch 101'
          git push origin HEAD:joomla5-6
