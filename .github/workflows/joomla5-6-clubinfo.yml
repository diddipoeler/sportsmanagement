name: Joomla 5/6 clubinfo migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  clubinfo:
    name: Native clubinfo model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate clubinfo migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/ClubinfoModel.php
          model_bridge=site/models/clubinfo.php
          view=site/src/View/Clubinfo/HtmlView.php
          view_bridge=site/views/clubinfo/view.html.php
          teamstree_view=site/src/View/Teamstree/HtmlView.php
          template_files=(
            site/views/clubinfo/tmpl/default.php
            site/views/clubinfo/tmpl/default_clubinfo.php
            site/views/clubinfo/tmpl/default_fusion.php
            site/views/clubinfo/tmpl/default_teams.php
            site/views/clubinfo/tmpl/default_rssfeed_4.php
            site/views/globalviews/tmpl/default_extrafields.php
          )

          for file in "$model" "$model_bridge" "$view" "$view_bridge" "${template_files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class ClubinfoModel extends SportsManagementProjectModel' "$model"
          grep -q "class_alias(ClubinfoModel::class, 'sportsmanagementModelClubInfo')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewClubInfo')" "$view_bridge"

          for method in getFirstClubId generateTree fbTreeRecurse getRssFeeds getLogoHistory getClubAssociation getFirstClub getPlaygrounds getStadiums getClub updateHits getTeamsByClubId getClubHistory getClubHistoryHTML getClubHistoryTree getSortClubHistoryTree sortCategoryList sortCategoryListRecurse getAddressString limitText hasEditPermission; do
            grep -q "function ${method}" "$model"
          done

          grep -q 'public static int $projectid' "$model"
          grep -q 'public static int $clubid' "$model"
          grep -q 'public static $club = null' "$model"
          grep -q 'public static int $first_club_id' "$model"
          grep -q 'public static int $cfg_which_database' "$model"
          grep -q 'public static $tree_fusion' "$model"
          grep -q 'public static $arrPCat' "$model"
          grep -q 'public static string $historyhtmltree' "$model"
          grep -q 'FeedFactory' "$model"
          grep -q 'getIdentity()' "$model"
          grep -q 'getDBConnection(true, self::$cfg_which_database)' "$model"

          grep -q 'ClubinfoModel::getClub(1)' "$view"
          grep -q 'getLogoHistory' "$view"
          grep -q "hasEditPermission('club.edit')" "$view"
          grep -q "getTemplateConfig('map')" "$view"
          grep -q 'public $jinput' "$view"
          grep -q 'public $document' "$view"
          grep -q 'public array $output = \[\]' "$view"

          grep -q '\$this->app->getIdentity()' site/views/clubinfo/tmpl/default_clubinfo.php
          grep -q "\$this->input->getInt('cfg_which_database', 0)" site/views/clubinfo/tmpl/default_clubinfo.php
          grep -q "\$this->input->getInt('cfg_which_database', 0)" site/views/clubinfo/tmpl/default_teams.php
          grep -q '\$this->databaseSelector' site/views/globalviews/tmpl/default_extrafields.php

          # Teamstree remains a native consumer of the namespaced Clubinfo model.
          test -f "$teamstree_view"
          grep -q 'use Diddipoeler\Component\SportsManagement\Site\Model\ClubinfoModel;' "$teamstree_view"
          grep -q 'ClubinfoModel::getClubHistoryHTML' "$teamstree_view"
          if grep -q 'sportsmanagementModelClubInfo' "$teamstree_view"; then
            echo 'Native teamstree view regressed to the legacy Clubinfo alias' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(|sportsmanagementModelProject::|extends BaseDatabaseModel|extends sportsmanagementView' "$model" "$model_bridge" "$view" "$view_bridge"; then
            echo 'Clubinfo native MVC regressed to a removed Joomla or legacy MVC API' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getApplication\(\)->input|\$app->input' "${template_files[@]}"; then
            echo 'Active clubinfo templates regressed to a removed Joomla input or identity API' >&2
            exit 1
          fi

          if grep -E -- 'sportsmanagementModelClubInfo::|sportsmanagementModelProject::|BaseDatabaseModel::getInstance' "$view"; then
            echo 'Native clubinfo view depends on a legacy model implementation' >&2
            exit 1
          fi
