name: Joomla 5/6 clubplan contract

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/clubplan/default.php'
      - 'site/tmpl/clubplan/default_datenav.php'
      - 'site/tmpl/clubplan/default_matches.php'
      - 'site/tmpl/clubplan/default_matches_sorted_by_date.php'
      - 'site/views/clubplan/tmpl/default.php'
      - 'site/views/clubplan/tmpl/default_datenav.php'
      - 'site/views/clubplan/tmpl/default_matches.php'
      - 'site/views/clubplan/tmpl/default_matches_sorted_by_date.php'
      - 'site/src/View/Clubplan/HtmlView.php'
      - '.github/workflows/joomla5-6-clubplan-contract.yml'
  pull_request:
    paths:
      - 'site/tmpl/clubplan/default.php'
      - 'site/tmpl/clubplan/default_datenav.php'
      - 'site/tmpl/clubplan/default_matches.php'
      - 'site/tmpl/clubplan/default_matches_sorted_by_date.php'
      - 'site/views/clubplan/tmpl/default.php'
      - 'site/views/clubplan/tmpl/default_datenav.php'
      - 'site/views/clubplan/tmpl/default_matches.php'
      - 'site/views/clubplan/tmpl/default_matches_sorted_by_date.php'
      - 'site/src/View/Clubplan/HtmlView.php'
      - '.github/workflows/joomla5-6-clubplan-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint clubplan PHP files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/tmpl/clubplan/default.php \
            site/tmpl/clubplan/default_datenav.php \
            site/tmpl/clubplan/default_matches.php \
            site/tmpl/clubplan/default_matches_sorted_by_date.php \
            site/views/clubplan/tmpl/default.php \
            site/views/clubplan/tmpl/default_datenav.php \
            site/views/clubplan/tmpl/default_matches.php \
            site/views/clubplan/tmpl/default_matches_sorted_by_date.php \
            site/src/View/Clubplan/HtmlView.php; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate clubplan migration contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          native_files = [
              Path('site/tmpl/clubplan/default.php'),
              Path('site/tmpl/clubplan/default_datenav.php'),
              Path('site/tmpl/clubplan/default_matches.php'),
              Path('site/tmpl/clubplan/default_matches_sorted_by_date.php'),
          ]
          bridge_files = [
              Path('site/views/clubplan/tmpl/default.php'),
              Path('site/views/clubplan/tmpl/default_datenav.php'),
              Path('site/views/clubplan/tmpl/default_matches.php'),
              Path('site/views/clubplan/tmpl/default_matches_sorted_by_date.php'),
          ]
          view = Path('site/src/View/Clubplan/HtmlView.php')

          for file in native_files + bridge_files:
              content = file.read_text(encoding='utf-8')
              for tag in ('@version', '@author', '@copyright', '@license'):
                  if tag not in content:
                      raise SystemExit(f'{file}: required metadata missing: {tag}')

          forbidden = (
              'sportsmanagementHelper::',
              'sportsmanagementHelperHtml::',
              'sportsmanagementHelperRoute::',
              'sportsmanagementModelClubPlan::',
              'Factory::getApplication()',
              "die('Restricted access')",
          )
          for file in native_files + bridge_files:
              content = file.read_text(encoding='utf-8')
              for legacy in forbidden:
                  if legacy in content:
                      raise SystemExit(f'{file}: legacy dependency remains: {legacy}')

          native_default = native_files[0].read_text(encoding='utf-8')
          for needle in (
              "$this->loadTemplate('datenav')",
              "$this->loadTemplate('matches')",
              "$this->loadTemplate('matches_sorted_by_date')",
              "$this->loadTemplate('jsminfo')",
              "\\defined('_JEXEC') or die;",
          ):
              if needle not in native_default:
                  raise SystemExit(f'Clubplan default contract missing: {needle}')

          datenav = native_files[1].read_text(encoding='utf-8')
          for needle in (
              'SportsManagementDateHelper::convertDate(',
              'ModalImageHelper::render(',
              "ComponentHelper::getParams('com_sportsmanagement')",
              "HTMLHelper::_('form.token')",
              'data-jsm-clubplan-filters',
          ):
              if needle not in datenav:
                  raise SystemExit(f'Clubplan date navigation contract missing: {needle}')

          matches = native_files[2].read_text(encoding='utf-8')
          for needle in (
              'MatchResultHelper::renderOutcomeIcon(',
              'MatchTimeHelper::format(',
              'ModalImageHelper::render(',
              'NamePresentationHelper::team(',
              "SiteRouteHelper::view('results'",
              "SiteRouteHelper::view('nextmatch'",
              "SiteRouteHelper::view('matchreport'",
              "SiteRouteHelper::view('teaminfo'",
              "SiteRouteHelper::view('teamstats'",
              "SiteRouteHelper::view('playground'",
          ):
              if needle not in matches:
                  raise SystemExit(f'Clubplan matches native contract missing: {needle}')

          sorted_matches = native_files[3].read_text(encoding='utf-8')
          for needle in (
              'ClubLogoHelper::render(',
              'MatchResultHelper::renderOutcomeIcon(',
              'MatchTimeHelper::format(',
              'NamePresentationHelper::team(',
              "SiteRouteHelper::view('matchreport'",
              "SiteRouteHelper::view('referee'",
          ):
              if needle not in sorted_matches:
                  raise SystemExit(f'Clubplan sorted matches native contract missing: {needle}')

          bridge_targets = {
              bridge_files[0]: "require JPATH_SITE . '/components/com_sportsmanagement/tmpl/clubplan/default.php';",
              bridge_files[1]: "require JPATH_SITE . '/components/com_sportsmanagement/tmpl/clubplan/default_datenav.php';",
              bridge_files[2]: "require JPATH_SITE . '/components/com_sportsmanagement/tmpl/clubplan/default_matches.php';",
              bridge_files[3]: "require JPATH_SITE . '/components/com_sportsmanagement/tmpl/clubplan/default_matches_sorted_by_date.php';",
          }
          for file, target in bridge_targets.items():
              if target not in file.read_text(encoding='utf-8'):
                  raise SystemExit(f'{file}: compatibility bridge target missing')

          view_content = view.read_text(encoding='utf-8')
          for needle in (
              'public array $favoriteSettings = [];',
              'public array $matchReferees = [];',
              'public int $databaseSelector = 0;',
              'public int $seasonId = 0;',
              'public int $clubId = 0;',
              '$this->preparePresentationData();',
          ):
              if needle not in view_content:
                  raise SystemExit(f'Clubplan view-data contract missing: {needle}')

          print('Joomla 5/6 clubplan contracts OK')
          PY
