name: Joomla 5/6 clubplan migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  clubplan:
    name: Native clubplan model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate clubplan migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/ClubplanModel.php
          model_bridge=site/models/clubplan.php
          view=site/src/View/Clubplan/HtmlView.php
          view_bridge=site/views/clubplan/view.html.php

          for file in "$model" "$model_bridge" "$view" "$view_bridge"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class ClubplanModel extends SportsManagementProjectModel' "$model"
          grep -q "class_alias(ClubplanModel::class, 'sportsmanagementModelClubPlan')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewClubPlan')" "$view_bridge"

          for method in setStartDate setEndDate getClubIconHtmlSimple getClub getTeamsArt getTeamsProjects getTeamsSeasons getAllMatches getTeams getStartDate getEndDate; do
            grep -q "function ${method}" "$model"
          done

          grep -q 'p.id.*self::$project_id' "$model"
          grep -q 'team1_result_decision' "$model"
          grep -q 'team2_result_decision' "$model"
          grep -q "getCountryFlag((string) \$country)" "$model"
          grep -q 'use_project_start_date' "$model"
          grep -q 'DOMContentLoaded' "$view"
          grep -q 'getClub()' "$view"
          grep -q 'ClubplanModel::$project_id' "$view"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(|sportsmanagementModelProject::|sportsmanagementModelClubInfo::|extends BaseDatabaseModel|extends sportsmanagementView' "$model" "$model_bridge" "$view" "$view_bridge"; then
            echo 'Clubplan native MVC regressed to a removed Joomla or legacy MVC API' >&2
            exit 1
          fi

          if grep -q 'confignfig' "$view"; then
            echo 'Clubplan view regressed to the legacy confignfig typo' >&2
            exit 1
          fi
