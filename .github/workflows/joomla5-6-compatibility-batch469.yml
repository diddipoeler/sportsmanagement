name: Joomla 5/6 compatibility batch 469

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/results.php'
      - 'admin/models/sportstype.php'
      - 'admin/models/treeto.php'
      - '.github/workflows/joomla5-6-compatibility-batch469.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/results.php'
      - 'admin/models/sportstype.php'
      - 'admin/models/treeto.php'
      - '.github/workflows/joomla5-6-compatibility-batch469.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/results.php
            admin/models/sportstype.php
            admin/models/treeto.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

          grep -Fq -- 'SportsManagementDatabaseResolver.php' site/models/results.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/results.php
          grep -Fq -- 'throw new \RuntimeException' site/models/results.php

          grep -Fq -- 'is_file($nativeModel)' admin/models/sportstype.php
          grep -Fq -- 'throw new \RuntimeException' admin/models/sportstype.php
          ! grep -Fq -- 'require_once JPATH_ADMINISTRATOR' admin/models/sportstype.php

          grep -Fq -- 'is_file($nativeModel)' admin/models/treeto.php
          grep -Fq -- 'throw new \RuntimeException' admin/models/treeto.php
          ! grep -Fq -- 'require_once JPATH_ADMINISTRATOR' admin/models/treeto.php
