name: Joomla 5/6 compatibility batch 472

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/allpersons.php'
      - 'site/models/allplaygrounds.php'
      - 'site/models/allprojects.php'
      - '.github/workflows/joomla5-6-compatibility-batch472.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/allpersons.php'
      - 'site/models/allplaygrounds.php'
      - 'site/models/allprojects.php'
      - '.github/workflows/joomla5-6-compatibility-batch472.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/allpersons.php
            site/models/allplaygrounds.php
            site/models/allprojects.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'SportsManagementDatabaseResolver.php' "$file"
            grep -Fq -- 'SportsManagementSiteApplicationResolver.php' "$file"
            grep -Fq -- 'SportsManagementListModel.php' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done
