name: Joomla 5/6 compatibility batch 473

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/allteams.php'
      - 'site/models/editclub.php'
      - 'site/models/editprojectteam.php'
      - '.github/workflows/joomla5-6-compatibility-batch473.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/allteams.php'
      - 'site/models/editclub.php'
      - 'site/models/editprojectteam.php'
      - '.github/workflows/joomla5-6-compatibility-batch473.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/allteams.php
            site/models/editclub.php
            site/models/editprojectteam.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done

          grep -Fq -- 'SportsManagementDatabaseResolver.php' site/models/allteams.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/allteams.php
          grep -Fq -- 'SportsManagementListModel.php' site/models/allteams.php

          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/editclub.php
          grep -Fq -- 'SportsManagementDatabaseResolver.php' site/models/editclub.php
          grep -Fq -- 'SportsManagementTable.php' site/models/editclub.php
          grep -Fq -- 'ClubTable.php' site/models/editclub.php
          grep -Fq -- 'is_file($nativeFile)' site/models/editclub.php

          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/editprojectteam.php
          grep -Fq -- 'SportsManagementDatabaseResolver.php' site/models/editprojectteam.php
          grep -Fq -- 'SportsManagementTable.php' site/models/editprojectteam.php
          grep -Fq -- 'ProjectteamTable.php' site/models/editprojectteam.php
          grep -Fq -- 'is_file($nativeFile)' site/models/editprojectteam.php
