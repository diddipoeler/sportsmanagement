name: Joomla 5/6 compatibility batch 477

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/imagehandler.php'
      - 'site/models/pagination.php'
      - 'site/models/tournamentbracket.php'
      - '.github/workflows/joomla5-6-compatibility-batch477.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/imagehandler.php'
      - 'site/models/pagination.php'
      - 'site/models/tournamentbracket.php'
      - '.github/workflows/joomla5-6-compatibility-batch477.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/imagehandler.php
            site/models/pagination.php
            site/models/tournamentbracket.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done

          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/imagehandler.php
          grep -Fq -- 'is_file($nativeFile)' site/models/imagehandler.php

          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/pagination.php
          grep -Fq -- 'is_file($nativeFile)' site/models/pagination.php

          grep -Fq -- 'SportsManagementDatabaseResolver.php' site/models/tournamentbracket.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/tournamentbracket.php
          grep -Fq -- 'SportsManagementProjectModel.php' site/models/tournamentbracket.php
          grep -Fq -- 'TournamentbracketResultNormalizer.php' site/models/tournamentbracket.php
