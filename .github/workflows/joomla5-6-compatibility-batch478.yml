name: Joomla 5/6 compatibility batch 478

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/updsportsmanagement.php'
      - 'site/models/sportsmanagement.php'
      - 'admin/models/jsmgcalendar.php'
      - '.github/workflows/joomla5-6-compatibility-batch478.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/updsportsmanagement.php'
      - 'site/models/sportsmanagement.php'
      - 'admin/models/jsmgcalendar.php'
      - '.github/workflows/joomla5-6-compatibility-batch478.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/updsportsmanagement.php
            site/models/sportsmanagement.php
            admin/models/jsmgcalendar.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done
          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/updsportsmanagement.php
          grep -Fq -- 'is_file($nativeFile)' site/models/updsportsmanagement.php
          grep -Fq -- 'is_file($nativeTable)' site/models/sportsmanagement.php
          grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' admin/models/jsmgcalendar.php
          grep -Fq -- 'SportsManagementDatabaseResolver.php' admin/models/jsmgcalendar.php
          grep -Fq -- 'JsmgcalendarTable.php' admin/models/jsmgcalendar.php
