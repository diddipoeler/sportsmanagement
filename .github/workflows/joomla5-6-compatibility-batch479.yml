name: Joomla 5/6 compatibility batch 479

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/ajax.php'
      - 'admin/models/round.php'
      - 'admin/models/season.php'
      - '.github/workflows/joomla5-6-compatibility-batch479.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/ajax.php'
      - 'admin/models/round.php'
      - 'admin/models/season.php'
      - '.github/workflows/joomla5-6-compatibility-batch479.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/ajax.php
            admin/models/round.php
            admin/models/season.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done

          grep -Fq -- 'SiteRouteHelper.php' site/models/ajax.php
          grep -Fq -- 'SportsManagementDatabaseResolver.php' site/models/ajax.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/models/ajax.php

          grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' admin/models/round.php
          grep -Fq -- 'SportsManagementDatabaseResolver.php' admin/models/round.php
          grep -Fq -- 'SportsManagementDateHelper.php' admin/models/round.php
          grep -Fq -- 'RoundTable.php' admin/models/round.php

          grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' admin/models/season.php
          grep -Fq -- 'SportsManagementDatabaseResolver.php' admin/models/season.php
          grep -Fq -- 'ActionLogHelper.php' admin/models/season.php
