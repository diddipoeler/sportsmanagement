name: Joomla 5/6 compatibility batch 481

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/projectteam.php'
      - 'admin/models/playground.php'
      - 'admin/models/league.php'
      - '.github/workflows/joomla5-6-compatibility-batch481.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/projectteam.php'
      - 'admin/models/playground.php'
      - 'admin/models/league.php'
      - '.github/workflows/joomla5-6-compatibility-batch481.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/projectteam.php
            admin/models/playground.php
            admin/models/league.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'SportsManagementDatabaseResolver.php' "$file"
            grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' "$file"
            grep -Fq -- 'ActionLogHelper.php' "$file"
          done

          grep -Fq -- 'ProjectteamTable.php' admin/models/projectteam.php
          grep -Fq -- 'SportsManagementTable.php' admin/models/projectteam.php

          grep -Fq -- 'ExtraFieldsSaveHelper.php' admin/models/playground.php
          grep -Fq -- 'SportsManagementDateHelper.php' admin/models/playground.php

          grep -Fq -- 'ExtraFieldsSaveHelper.php' admin/models/league.php
          grep -Fq -- 'SportsManagementDateHelper.php' admin/models/league.php
          grep -Fq -- 'LeagueTable.php' admin/models/league.php
