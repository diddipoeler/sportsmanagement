name: Joomla 5/6 compatibility batch 482

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/club.php'
      - 'admin/models/project.php'
      - 'admin/models/eventtype.php'
      - '.github/workflows/joomla5-6-compatibility-batch482.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/club.php'
      - 'admin/models/project.php'
      - 'admin/models/eventtype.php'
      - '.github/workflows/joomla5-6-compatibility-batch482.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/models/club.php
            admin/models/project.php
            admin/models/eventtype.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'SportsManagementDatabaseResolver.php' "$file"
            grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' "$file"
            grep -Fq -- 'ActionLogHelper.php' "$file"
          done

          grep -Fq -- 'ExtraFieldsSaveHelper.php' admin/models/club.php
          grep -Fq -- 'LocationHelper.php' admin/models/club.php
          grep -Fq -- 'RemoteImageDownloadHelper.php' admin/models/club.php
          grep -Fq -- 'SportsManagementDateHelper.php' admin/models/club.php

          grep -Fq -- 'SportsManagementTable.php' admin/models/project.php
          grep -Fq -- 'ProjectTable.php' admin/models/project.php
