name: Joomla 5/6 compatibility batch 489

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch489.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch489.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'use Joomla\Database\DatabaseInterface;' "$file"
          grep -Fq -- 'Factory::getContainer()->get(DatabaseInterface::class)' "$file"
          grep -Fq -- 'Factory::getApplication()->getIdentity()' "$file"

          if grep -Fq -- 'Factory::getDbo()' "$file"; then
            echo 'Deprecated Factory::getDbo() remains in match.php' >&2
            exit 1
          fi

          if grep -Fq -- 'Factory::getUser()' "$file"; then
            echo 'Deprecated Factory::getUser() remains in match.php' >&2
            exit 1
          fi
