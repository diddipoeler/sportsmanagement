name: Joomla 5/6 compatibility batch 491

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch491.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch491.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- "(string) \$row->getError()" "$file"
          grep -Fq -- "Text::_('JLIB_DATABASE_ERROR_FUNCTION_FAILED')" "$file"
          grep -Fq -- '\$e->getMessage()' "$file"

          if grep -Fq -- 'getErrorMsg()' "$file"; then
            echo 'Deprecated getErrorMsg() remains in match.php' >&2
            exit 1
          fi
