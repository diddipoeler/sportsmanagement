name: Joomla 5/6 compatibility batch 497

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch497.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch497.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- "mb_convert_encoding(\$csv_file->titles[\$a], 'UTF-8', 'ISO-8859-1')" "$file"
          grep -Fq -- 'count($csv_file->titles)' "$file"

          if grep -Fq -- 'utf8_encode(' "$file"; then
            echo 'Deprecated utf8_encode() remains in match.php' >&2
            exit 1
          fi

          if grep -Fq -- 'sizeof($csv_file->titles)' "$file"; then
            echo 'Legacy sizeof() remains in CSV title loop' >&2
            exit 1
          fi
