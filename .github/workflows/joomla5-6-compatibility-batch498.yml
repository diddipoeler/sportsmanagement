name: Joomla 5/6 compatibility batch 498

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch498.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch498.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'use Diddipoeler\Component\SportsManagement\Administrator\Table\MatchTable;' "$file"
          grep -Fq -- 'use Diddipoeler\Component\SportsManagement\Administrator\Table\MatchstatisticTable;' "$file"
          grep -Fq -- 'use Diddipoeler\Component\SportsManagement\Administrator\Table\MatchstaffstatisticTable;' "$file"
          grep -Fq -- 'new MatchstatisticTable($db)' "$file"
          grep -Fq -- 'new MatchstaffstatisticTable($db)' "$file"
          grep -Fq -- 'new MatchTable(Factory::getContainer()->get(DatabaseInterface::class))' "$file"

          if grep -Fq -- "Table::getInstance('Matchstatistic'" "$file"; then
            echo 'Legacy Matchstatistic table factory remains in match.php' >&2
            exit 1
          fi

          if grep -Fq -- "Table::getInstance('Matchstaffstatistic'" "$file"; then
            echo 'Legacy Matchstaffstatistic table factory remains in match.php' >&2
            exit 1
          fi

          if grep -Fq -- 'Table::getInstance("match", "sportsmanagementTable")' "$file"; then
            echo 'Direct legacy Match table factory remains in match.php' >&2
            exit 1
          fi
