name: Joomla 5/6 compatibility batch 500

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch500.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch500.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'return new MatchTable(sportsmanagementHelper::getDBConnection());' "$file"

          if grep -Fq -- 'Table::getInstance' "$file"; then
            echo 'Legacy Table::getInstance() remains in match.php' >&2
            exit 1
          fi

          if grep -Fq -- 'use Joomla\CMS\Table\Table;' "$file"; then
            echo 'Unused Joomla Table import remains in match.php' >&2
            exit 1
          fi
