name: Joomla 5/6 compatibility batch 503

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch503.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch503.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"

          if grep -Fq -- 'Factory::getApplication()->getInput()' "$file"; then
            echo 'Global application input lookup remains in match.php' >&2
            exit 1
          fi

          if perl -0777 -ne "exit(!(m/\$option\s*=\s*\$app->getInput\(\)->getCmd\('option'\);\s*\$app\s*=\s*Factory::getApplication\(\);/s))" "$file"; then
            echo 'Application variable is used before assignment in match.php' >&2
            exit 1
          fi
