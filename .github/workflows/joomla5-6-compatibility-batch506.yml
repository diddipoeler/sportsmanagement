name: Joomla 5/6 compatibility batch 506

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch506.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch506.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"
          test "$(grep -F -- '$app->getInput()' "$file" | wc -l)" -ge 1

          if grep -Fq -- '->input' "$file"; then
            echo 'Direct application input property remains in match.php' >&2
            exit 1
          fi

          if grep -Fq -- 'Factory::getConfig()' "$file"; then
            echo 'Deprecated Factory::getConfig() remains in match.php' >&2
            exit 1
          fi
