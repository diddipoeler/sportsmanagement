name: Joomla 5/6 compatibility batch 515

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch515.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch515.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"

          if grep -Fq -- 'Factory::getContainer()->get(DatabaseInterface::class)->getQuery' "$file"; then
            echo 'Repeated container getQuery lookup remains in match.php' >&2
            exit 1
          fi

          if grep -Fq -- 'Factory::getContainer()->get(DatabaseInterface::class)->setQuery' "$file"; then
            echo 'Repeated container setQuery lookup remains in match.php' >&2
            exit 1
          fi

          if grep -Fq -- 'Factory::getContainer()->get(DatabaseInterface::class)->loadObjectList' "$file"; then
            echo 'Repeated container loadObjectList lookup remains in match.php' >&2
            exit 1
          fi
