name: Joomla 5/6 compatibility batch 522

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch502.yml'
      - '.github/workflows/joomla5-6-compatibility-batch522.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch502.yml'
      - '.github/workflows/joomla5-6-compatibility-batch522.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"
          test -f .github/workflows/joomla5-6-compatibility-batch502.yml
          grep -Fq -- '$this->jsmdate' "$file"

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('admin/models/match.php').read_text()
          pattern = re.compile(r'(?:(?:public|protected|private)s+)?(?P<static>statics+)?functions+(?P<name>[A-Za-z0-9_]+)s*([^)]*)s*{')
          for match in pattern.finditer(text):
              start = match.start()
              i = text.find('{', start)
              depth = 0
              end = i
              for j in range(i, len(text)):
                  if text[j] == '{':
                      depth += 1
                  elif text[j] == '}':
                      depth -= 1
                      if depth == 0:
                          end = j + 1
                          break
              segment = text[start:end]
              if not match.group('static') and 'Factory::getDate()' in segment:
                  raise SystemExit(f"Factory::getDate() remains in instance method {match.group('name')}")
          PY
