name: Joomla 5/6 compatibility batch 526

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch526.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch526.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'runJoomlaQuery(__CLASS__, $this->jsmdb)' "$file"

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('admin/models/match.php').read_text()
          text = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
          text = re.sub(r'//.*', '', text)
          if '->setError(' in text:
              raise SystemExit('Active setError() remains in match.php')
          PY
