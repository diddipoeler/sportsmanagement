name: Joomla 5/6 compatibility batch 532

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/imagehandler.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch532.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/imagehandler.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch532.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/imagehandler.php
            modules/mod_sportsmanagement_eventsranking/helper.php
            modules/mod_sportsmanagement_birthday/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

          grep -Fq -- 'is_file($nativeModel)' admin/models/imagehandler.php
          grep -Fq -- '$params instanceof Registry ? $params : new Registry((array) $params)' modules/mod_sportsmanagement_eventsranking/helper.php
          grep -Fq -- '(new EventsRankingHelper())->getData($registry, $database)' modules/mod_sportsmanagement_eventsranking/helper.php
          grep -Fq -- '$params instanceof Registry ? $params : new Registry((array) $params)' modules/mod_sportsmanagement_birthday/helper.php
          grep -Fq -- 'public static function getData($params, ?DatabaseInterface $database = null): array' modules/mod_sportsmanagement_birthday/helper.php
