name: Joomla 5/6 compatibility batch 533

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/imagelist.php'
      - 'admin/models/ajax.php'
      - 'admin/models/installhelper.php'
      - 'modules/mod_sportsmanagement_club_birthday/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch533.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/imagelist.php'
      - 'admin/models/ajax.php'
      - 'admin/models/installhelper.php'
      - 'modules/mod_sportsmanagement_club_birthday/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch533.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/imagelist.php
            admin/models/ajax.php
            admin/models/installhelper.php
            modules/mod_sportsmanagement_club_birthday/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

          grep -Fq -- 'is_file($nativeModel)' admin/models/imagelist.php
          grep -Fq -- 'is_file($nativeModel)' admin/models/ajax.php
          grep -Fq -- 'SportsManagementAdminModel::class =>' admin/models/installhelper.php
          grep -Fq -- 'InstallhelperModel::class =>' admin/models/installhelper.php
          grep -Fq -- 'if (!class_exists($class, false) && is_file($file))' admin/models/installhelper.php
          grep -Fq -- '$params instanceof Registry ? $params : new Registry((array) $params)' modules/mod_sportsmanagement_club_birthday/helper.php
          grep -Fq -- '(new ClubBirthdayHelper())->getData($registry, $app, $database)' modules/mod_sportsmanagement_club_birthday/helper.php
