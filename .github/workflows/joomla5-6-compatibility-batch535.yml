name: Joomla 5/6 compatibility batch 535

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/extrafield.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - 'modules/mod_sportsmanagement_google_calendar/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch535.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/extrafield.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - 'modules/mod_sportsmanagement_google_calendar/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch535.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/extrafield.php
            modules/mod_sportsmanagement_gcalendar/helper.php
            modules/mod_sportsmanagement_google_calendar/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

          grep -Fq -- 'SportsManagementAdminModel::class =>' admin/models/extrafield.php
          grep -Fq -- 'ExtrafieldModel::class =>' admin/models/extrafield.php
          grep -Fq -- 'if (!class_exists($class, false) && is_file($file))' admin/models/extrafield.php
          grep -Fq -- 'new Registry((array) $params)' modules/mod_sportsmanagement_gcalendar/helper.php
          grep -Fq -- 'public function __construct($params = null)' modules/mod_sportsmanagement_google_calendar/helper.php
          grep -Fq -- 'new Registry((array) ($params ?? []))' modules/mod_sportsmanagement_google_calendar/helper.php
