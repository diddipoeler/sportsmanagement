name: Joomla 5/6 compatibility batch 539

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/seasonteamperson.php'
      - 'admin/models/matchstaff.php'
      - 'admin/models/matchreferee.php'
      - 'modules/mod_sportsmanagement_playground_ticker/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch539.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/seasonteamperson.php'
      - 'admin/models/matchstaff.php'
      - 'admin/models/matchreferee.php'
      - 'modules/mod_sportsmanagement_playground_ticker/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch539.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/seasonteamperson.php
            admin/models/matchstaff.php
            admin/models/matchreferee.php
            modules/mod_sportsmanagement_playground_ticker/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

          for file in admin/models/seasonteamperson.php admin/models/matchstaff.php admin/models/matchreferee.php; do
            grep -Fq -- 'SportsManagementAdminModel::class =>' "$file"
            grep -Fq -- 'if (!class_exists($class, false) && is_file($file))' "$file"
          done

          grep -Fq -- 'SeasonteampersonModel::class =>' admin/models/seasonteamperson.php
          grep -Fq -- 'MatchstaffModel::class =>' admin/models/matchstaff.php
          grep -Fq -- 'MatchrefereeModel::class =>' admin/models/matchreferee.php
          grep -Fq -- '$params instanceof Registry ? $params : new Registry((array) $params)' modules/mod_sportsmanagement_playground_ticker/helper.php
          grep -Fq -- '(new PlaygroundTickerHelper())->getData($registry, $app, $database)' modules/mod_sportsmanagement_playground_ticker/helper.php
