name: Joomla 5/6 compatibility batch 542

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/projectposition.php'
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - 'modules/mod_sportsmanagement_rquotes/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch542.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/projectposition.php'
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - 'modules/mod_sportsmanagement_rquotes/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch542.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/projectposition.php
            modules/mod_sportsmanagement_ranking/helper.php
            modules/mod_sportsmanagement_rquotes/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

          grep -Fq -- 'SportsManagementAdminModel::class =>' admin/models/projectposition.php
          grep -Fq -- 'ProjectpositionModel::class =>' admin/models/projectposition.php
          grep -Fq -- 'if (!class_exists($class, false) && is_file($file))' admin/models/projectposition.php

          grep -Fq -- '$registry = $params instanceof Registry ? $params : new Registry((array) $params);' modules/mod_sportsmanagement_ranking/helper.php
          grep -Fq -- 'switch (' modules/mod_sportsmanagement_ranking/helper.php
          grep -Fq -- 'teamlink' modules/mod_sportsmanagement_ranking/helper.php

          grep -Fq -- '$registry = $params instanceof Registry ? $params : new Registry((array) $params);' modules/mod_sportsmanagement_rquotes/helper.php
          grep -Fq -- 'self::legacyText($registry, (string) $filename, $module, false)' modules/mod_sportsmanagement_rquotes/helper.php
          grep -Fq -- 'self::legacyText($registry, (string) $filename, $module, true)' modules/mod_sportsmanagement_rquotes/helper.php
