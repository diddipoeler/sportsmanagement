name: Joomla 5/6 compatibility batch 545

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/statistic.php'
      - 'admin/models/clubnames.php'
      - 'admin/models/databasetools.php'
      - 'admin/models/extrafields.php'
      - '.github/workflows/joomla5-6-compatibility-batch545.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/statistic.php'
      - 'admin/models/clubnames.php'
      - 'admin/models/databasetools.php'
      - 'admin/models/extrafields.php'
      - '.github/workflows/joomla5-6-compatibility-batch545.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/statistic.php
            admin/models/clubnames.php
            admin/models/databasetools.php
            admin/models/extrafields.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'if (!class_exists($class, false) && is_file($file))' "$file"
          done

          grep -Fq -- 'SportsManagementAdminModel::class =>' admin/models/statistic.php
          grep -Fq -- 'StatisticModel::class =>' admin/models/statistic.php

          for file in admin/models/clubnames.php admin/models/databasetools.php admin/models/extrafields.php; do
            grep -Fq -- 'SportsManagementListModel::class =>' "$file"
          done

          grep -Fq -- 'ClubnamesModel::class =>' admin/models/clubnames.php
          grep -Fq -- 'DatabasetoolsModel::class =>' admin/models/databasetools.php
          grep -Fq -- 'ExtrafieldsModel::class =>' admin/models/extrafields.php
