name: Joomla 5/6 compatibility batch 548

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/player.php'
      - 'admin/models/position.php'
      - 'admin/models/project.php'
      - 'admin/models/round.php'
      - 'admin/models/team.php'
      - 'admin/models/template.php'
      - '.github/workflows/joomla5-6-compatibility-batch548.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/player.php'
      - 'admin/models/position.php'
      - 'admin/models/project.php'
      - 'admin/models/round.php'
      - 'admin/models/team.php'
      - 'admin/models/template.php'
      - '.github/workflows/joomla5-6-compatibility-batch548.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/player.php
            admin/models/position.php
            admin/models/project.php
            admin/models/round.php
            admin/models/team.php
            admin/models/template.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'SportsManagementAdminModel::class =>' "$file"
            grep -Fq -- 'if (!class_exists($class, false) && is_file($file))' "$file"
          done

          grep -Fq -- 'PlayerModel::class =>' admin/models/player.php
          grep -Fq -- 'PositionModel::class =>' admin/models/position.php
          grep -Fq -- 'ProjectModel::class =>' admin/models/project.php
          grep -Fq -- 'RoundModel::class =>' admin/models/round.php
          grep -Fq -- 'TeamModel::class =>' admin/models/team.php
          grep -Fq -- 'TemplateModel::class =>' admin/models/template.php
