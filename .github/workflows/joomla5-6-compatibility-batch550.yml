name: Joomla 5/6 compatibility batch 550

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/cpanel.php'
      - 'admin/models/projectreferees.php'
      - 'admin/models/treetos.php'
      - 'admin/models/databasetool.php'
      - '.github/workflows/joomla5-6-compatibility-batch550.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/cpanel.php'
      - 'admin/models/projectreferees.php'
      - 'admin/models/treetos.php'
      - 'admin/models/databasetool.php'
      - '.github/workflows/joomla5-6-compatibility-batch550.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/cpanel.php
            admin/models/projectreferees.php
            admin/models/treetos.php
            admin/models/databasetool.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'if (!class_exists($class, false) && is_file($file))' "$file"
          done

          for file in admin/models/cpanel.php admin/models/projectreferees.php admin/models/treetos.php; do
            grep -Fq -- 'SportsManagementListModel::class =>' "$file"
          done

          grep -Fq -- 'CpanelModel::class =>' admin/models/cpanel.php
          grep -Fq -- 'ProjectrefereesModel::class =>' admin/models/projectreferees.php
          grep -Fq -- 'TreetosModel::class =>' admin/models/treetos.php
          grep -Fq -- 'DatabasetoolModel::class =>' admin/models/databasetool.php
