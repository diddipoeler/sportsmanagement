name: Joomla 5/6 compatibility batch 552

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/teamstaffs.php'
      - 'admin/models/projectpositions.php'
      - 'admin/models/rosterpositions.php'
      - 'admin/models/smquotes.php'
      - 'admin/models/sportstypes.php'
      - 'admin/models/projects.php'
      - '.github/workflows/joomla5-6-compatibility-batch552.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/teamstaffs.php'
      - 'admin/models/projectpositions.php'
      - 'admin/models/rosterpositions.php'
      - 'admin/models/smquotes.php'
      - 'admin/models/sportstypes.php'
      - 'admin/models/projects.php'
      - '.github/workflows/joomla5-6-compatibility-batch552.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/teamstaffs.php
            admin/models/projectpositions.php
            admin/models/rosterpositions.php
            admin/models/smquotes.php
            admin/models/sportstypes.php
            admin/models/projects.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'SportsManagementListModel::class =>' "$file"
            grep -Fq -- 'if (!class_exists($class, false) && is_file($file))' "$file"
          done

          grep -Fq -- 'TeamstaffsModel::class =>' admin/models/teamstaffs.php
          grep -Fq -- 'ProjectpositionsModel::class =>' admin/models/projectpositions.php
          grep -Fq -- 'RosterpositionsModel::class =>' admin/models/rosterpositions.php
          grep -Fq -- 'SmquotesModel::class =>' admin/models/smquotes.php
          grep -Fq -- 'SportstypesModel::class =>' admin/models/sportstypes.php
          grep -Fq -- 'ProjectsModel::class =>' admin/models/projects.php
