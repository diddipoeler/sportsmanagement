name: Joomla 5/6 compatibility batch 559

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/joomleagueimport.php'
      - '.github/workflows/joomla5-6-compatibility-batch559.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/joomleagueimport.php'
      - '.github/workflows/joomla5-6-compatibility-batch559.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/models/joomleagueimport.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          if grep -Fq -- ".= \$my_text = '';" "$file"; then
            echo 'Accidental my_text reset remains.'
            exit 1
          fi

          grep -Fq -- '$my_text = '"'"''"'"';' "$file"
          grep -Fq -- '.= $my_text;' "$file"
