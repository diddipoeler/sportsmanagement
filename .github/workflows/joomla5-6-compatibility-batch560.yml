name: Joomla 5/6 compatibility batch 560

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch560.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch560.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/models/joomleagueimports.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          if grep -Eq '^[[:space:]]*ExceptionHandler::render\(' "$file"; then
            echo 'Legacy ExceptionHandler::render call remains.'
            exit 1
          fi

          grep -Fq -- "$result_insert = false;" "$file"
          grep -Fq -- "Log::add($e->getMessage(), Log::ERROR, 'jsmerror');" "$file"
          grep -Fq -- "$this->jsmapp->enqueueMessage($e->getMessage(), 'error');" "$file"

          if grep -Fq -- 'use Joomla\Data\DataObject;' "$file"; then
            echo 'Unused DataObject import remains.'
            exit 1
          fi

          if grep -Fq -- 'use Joomla\CMS\Filesystem\File;' "$file"; then
            echo 'Unused File import remains.'
            exit 1
          fi
