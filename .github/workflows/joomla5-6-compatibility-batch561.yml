name: Joomla 5/6 compatibility batch 561

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch560.yml'
      - '.github/workflows/joomla5-6-compatibility-batch561.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch560.yml'
      - '.github/workflows/joomla5-6-compatibility-batch561.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/models/joomleagueimports.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          test "$(grep -Fc -- '$result_insert = false;' "$file")" -eq 6
          test "$(grep -Fc -- 'insertObject(' "$file")" -ge 6

          if grep -Eq '^[[:space:]]*ExceptionHandler::render\(' "$file"; then
            echo 'Legacy ExceptionHandler::render call remains.'
            exit 1
          fi

          if grep -Fq -- 'grep -Fq -- "$result_insert' .github/workflows/joomla5-6-compatibility-batch560.yml; then
            echo 'Unsafe result_insert shell expansion remains in batch 560.'
            exit 1
          fi
