name: Joomla 5/6 compatibility batch 562

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch562.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch562.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/models/joomleagueimports.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          if grep -Fq -- 'BaseDatabaseModel::getInstance(' "$file"; then
            echo 'Legacy BaseDatabaseModel::getInstance call remains.'
            exit 1
          fi

          grep -Fq -- 'protected $jsmapp;' "$file"
          grep -Fq -- 'protected $jsmjinput;' "$file"
          grep -Fq -- 'new TeamplayersModel();' "$file"
          grep -Fq -- 'new DatabasetoolModel();' "$file"
          grep -Fq -- "models/teamplayers.php" "$file"
          grep -Fq -- "models/databasetool.php" "$file"
