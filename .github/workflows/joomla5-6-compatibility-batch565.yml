name: Joomla 5/6 compatibility batch 565

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch565.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch565.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/models/joomleagueimports.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          if grep -Fq -- 'Factory::getConfig()' "$file"; then
            echo 'Legacy Factory::getConfig call remains.'
            exit 1
          fi

          grep -Fq -- "$debug = (bool) $app->get('debug', false);" "$file"
          grep -Fq -- "$app->get('host')" "$file"
          grep -Fq -- "$app->get('user')" "$file"
          grep -Fq -- "$app->get('password')" "$file"
          grep -Fq -- "$app->get('db')" "$file"

          if grep -A5 -F 'function get_info_fields()' "$file" | grep -Fq -- 'ComponentHelper::getParams'; then
            echo 'Unused component params remain in get_info_fields.'
            exit 1
          fi
