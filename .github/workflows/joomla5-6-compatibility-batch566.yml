name: Joomla 5/6 compatibility batch 566

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch565.yml'
      - '.github/workflows/joomla5-6-compatibility-batch566.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch565.yml'
      - '.github/workflows/joomla5-6-compatibility-batch566.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          php -l admin/models/joomleagueimports.php

          if grep -Fq -- 'grep -Fq -- "$debug' .github/workflows/joomla5-6-compatibility-batch565.yml; then
            echo 'Unsafe debug shell expansion remains in batch 565.'
            exit 1
          fi

          if grep -Fq -- 'grep -Fq -- "$app' .github/workflows/joomla5-6-compatibility-batch565.yml; then
            echo 'Unsafe app shell expansion remains in batch 565.'
            exit 1
          fi
