name: Joomla 5/6 compatibility batch 567

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch567.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/joomleagueimports.php'
      - '.github/workflows/joomla5-6-compatibility-batch567.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/models/joomleagueimports.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          test "$(grep -Fc -- "ComponentHelper::getParams('com_sportsmanagement')" "$file")" -eq 2
          grep -Fq -- 'Log::add($e->getMessage(), Log::ERROR, '"'"'jsmerror'"'"');' "$file"

          if grep -A12 -F '$modified_by = $user->get(' "$file" | grep -Fq -- "ComponentHelper::getParams('com_sportsmanagement')"; then
            echo 'Duplicate component params reload remains in importjoomleaguenew.'
            exit 1
          fi
