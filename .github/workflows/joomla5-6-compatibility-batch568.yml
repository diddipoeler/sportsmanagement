name: Joomla 5/6 compatibility batch 568

on:
  push:
    branches: [joomla5-6]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch567.yml'
      - '.github/workflows/joomla5-6-compatibility-batch568.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch567.yml'
      - '.github/workflows/joomla5-6-compatibility-batch568.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow quoting
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq -- 'grep -Fq -- "Log::add($e' .github/workflows/joomla5-6-compatibility-batch567.yml; then
            echo 'Unsafe e shell expansion remains in batch 567.'
            exit 1
          fi
