name: Joomla 5/6 compatibility batch 576

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'plugins/jsm_search/script.php'
      - '.github/workflows/joomla5-6-compatibility-batch576.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'plugins/jsm_search/script.php'
      - '.github/workflows/joomla5-6-compatibility-batch576.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=plugins/jsm_search/script.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          grep -Fq -- 'private ?DatabaseInterface $database = null;' "$file"
          grep -Fq -- 'private function database(): DatabaseInterface' "$file"
          grep -Fq -- '$db = $this->database();' "$file"
          test "$(grep -Fc -- 'Factory::getContainer()->get(DatabaseInterface::class)' "$file")" -eq 1
