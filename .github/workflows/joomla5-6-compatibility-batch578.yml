name: Joomla 5/6 compatibility batch 578

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'plugins/jsm_search/search_sportsmanagement.php'
      - '.github/workflows/joomla5-6-compatibility-batch578.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'plugins/jsm_search/search_sportsmanagement.php'
      - '.github/workflows/joomla5-6-compatibility-batch578.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=plugins/jsm_search/search_sportsmanagement.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          grep -Fq -- '$nativePlugin = __DIR__' "$file"
          grep -Fq -- 'if (is_file($nativePlugin)) {' "$file"
          grep -Fq -- 'if (!class_exists(Sportsmanagement::class)) {' "$file"
          grep -Fq -- "throw new \\RuntimeException('SportsManagement Finder plugin class could not be loaded.', 500);" "$file"
          grep -Fq -- "class_alias(Sportsmanagement::class, 'PlgFinderJsm_search');" "$file"
