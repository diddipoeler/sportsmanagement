name: Joomla 5/6 compatibility batch 582

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/clubs/view.html.php'
      - 'admin/views/leagues/view.html.php'
      - 'admin/views/sportstypes/view.html.php'
      - 'admin/views/templates/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch582.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/clubs/view.html.php'
      - 'admin/views/leagues/view.html.php'
      - 'admin/views/sportstypes/view.html.php'
      - 'admin/views/templates/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch582.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/views/clubs/view.html.php
            admin/views/leagues/view.html.php
            admin/views/sportstypes/view.html.php
            admin/views/templates/view.html.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- '$nativeView =' "$file"
            grep -Fq -- 'if (is_file($nativeView)) {' "$file"
            grep -Fq -- 'throw new \RuntimeException(' "$file"
          done
