name: Joomla 5/6 compatibility batch 589

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch589.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch589.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          test "$(grep -Fc -- '$this->projectModel()' "$file")" -eq 2
          grep -Fq -- 'private function projectModel(): object' "$file"
          grep -Fq -- "createModel('Project', 'Administrator', ['ignore_request' => true])" "$file"

          if grep -Fq -- "jimport(" "$file"; then
            echo 'Legacy jimport remains.'
            exit 1
          fi

          if grep -Fq -- 'Browser::getInstance()' "$file"; then
            echo 'Unused Browser lookup remains.'
            exit 1
          fi

          test "$(grep -Fc -- 'BaseDatabaseModel::getInstance' "$file")" -eq 1
