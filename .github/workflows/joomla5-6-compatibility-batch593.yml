name: Joomla 5/6 compatibility batch 593

on:
  push:
    branches: [joomla5-6]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch592.yml'
      - '.github/workflows/joomla5-6-compatibility-batch593.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch592.yml'
      - '.github/workflows/joomla5-6-compatibility-batch593.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate batch 592 shell quoting
        shell: bash
        run: |
          set -euo pipefail

          file=.github/workflows/joomla5-6-compatibility-batch592.yml

          grep -Fq -- "grep -Fq -- '\$this->app->getInput()->getInt('" "$file"
          grep -Fq -- "grep -Fq -- '\$this->config = ComponentHelper::getParams('" "$file"

          if grep -Fq -- 'grep -Fq -- "$this->' "$file"; then
            echo 'Unsafe shell expansion remains in batch 592.'
            exit 1
          fi
