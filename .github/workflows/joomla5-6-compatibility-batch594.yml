name: Joomla 5/6 compatibility batch 594

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch594.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch594.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          grep -Fq -- '$this->useeventtime               = $jinput->getInt('"'"'useeventtime'"'"');' "$file"
          grep -Fq -- '$this->doubleevents               = $jinput->getInt('"'"'doubleevents'"'"');' "$file"

          if grep -Fq -- "->get('useeventtime')" "$file"; then
            echo 'Untyped useeventtime input remains.'
            exit 1
          fi

          if grep -Fq -- "->get('doubleevents')" "$file"; then
            echo 'Untyped doubleevents input remains.'
            exit 1
          fi

          if grep -Fq -- "$default_name_format = '';" "$file"; then
            echo 'Unused empty default_name_format remains.'
            exit 1
          fi

          if grep -Fq -- '$userId =' "$file"; then
            echo 'Unused userId remains.'
            exit 1
          fi

          if grep -Fq -- ';;' "$file"; then
            echo 'Double semicolon remains.'
            exit 1
          fi
