name: Joomla 5/6 compatibility batch 595

on:
  push:
    branches: [joomla5-6]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch594.yml'
      - '.github/workflows/joomla5-6-compatibility-batch595.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch594.yml'
      - '.github/workflows/joomla5-6-compatibility-batch595.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate batch 594 shell quoting
        shell: bash
        run: |
          set -euo pipefail

          file=.github/workflows/joomla5-6-compatibility-batch594.yml

          grep -Fq -- "grep -Fq -- '\$default_name_format =" "$file"

          if grep -Fq -- 'grep -Fq -- "$default_name_format' "$file"; then
            echo 'Unsafe default_name_format shell expansion remains in batch 594.'
            exit 1
          fi
