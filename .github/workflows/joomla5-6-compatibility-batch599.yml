name: Joomla 5/6 compatibility batch 599

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch599.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch599.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          grep -Fq -- 'parent::display();' "$file"

          if grep -Fq -- 'parent::display($tpl);' "$file"; then
            echo 'Undefined tpl display argument remains.'
            exit 1
          fi

          if grep -Fq -- '$eventlist   = array();' "$file"; then
            echo 'Legacy eventlist array initialiser remains.'
            exit 1
          fi

          if grep -Fq -- '$myoptions                 = array();' "$file"; then
            echo 'Legacy myoptions array initialiser remains.'
            exit 1
          fi
