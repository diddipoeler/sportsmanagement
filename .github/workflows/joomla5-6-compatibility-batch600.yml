name: Joomla 5/6 compatibility batch 600

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch600.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch600.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          grep -Fq -- '$this->lists = [];' "$file"
          grep -Fq -- '$this->positions = [];' "$file"
          grep -Fq -- '$inroster         = [];' "$file"
          grep -Fq -- '$projectreferees2 = [];' "$file"
          grep -Fq -- "$rosters = ['home' => $homeRoster, 'away' => $awayRoster];" "$file"

          if grep -Fq -- '$allreferees = array();' "$file"; then
            echo 'Redundant allreferees initialiser remains.'
            exit 1
          fi
