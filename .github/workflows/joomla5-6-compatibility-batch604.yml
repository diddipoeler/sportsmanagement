name: Joomla 5/6 compatibility batch 604

on:
  push:
    branches: [joomla5-6]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch603.yml'
      - '.github/workflows/joomla5-6-compatibility-batch604.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch603.yml'
      - '.github/workflows/joomla5-6-compatibility-batch604.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate batch 603 shell quoting
        shell: bash
        run: |
          set -euo pipefail

          file=.github/workflows/joomla5-6-compatibility-batch603.yml

          grep -Fq -- "grep -Fq -- '\$lists[" "$file"

          if grep -Fq -- 'grep -Fq -- "$lists[' "$file"; then
            echo 'Unsafe lists shell expansion remains in batch 603.'
            exit 1
          fi
