name: Joomla 5/6 compatibility batch 607

on:
  push:
    branches: [joomla5-6]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch606.yml'
      - '.github/workflows/joomla5-6-compatibility-batch607.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - '.github/workflows/joomla5-6-compatibility-batch606.yml'
      - '.github/workflows/joomla5-6-compatibility-batch607.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate batch 606 shell quoting
        shell: bash
        run: |
          set -euo pipefail

          file=.github/workflows/joomla5-6-compatibility-batch606.yml

          grep -Fq -- "grep -Fq -- 'assetExists(" "$file"

          if grep -Fq -- 'grep -Fq -- "assetExists(' "$file"; then
            echo 'Unsafe assetExists shell expansion remains in batch 606.'
            exit 1
          fi
