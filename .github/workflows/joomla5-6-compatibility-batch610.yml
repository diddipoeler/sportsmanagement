name: Joomla 5/6 compatibility batch 610

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch610.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch610.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          grep -Fq -- "'com_sportsmanagement.usericons'," "$file"
          grep -Fq -- "jlextusericons.css" "$file"

          if grep -Fq -- '->addCustomTag(' "$file"; then
            echo 'Legacy addCustomTag asset injection remains.'
            exit 1
          fi

          if grep -Fq -- '$stylelink =' "$file"; then
            echo 'Legacy manual stylesheet tag remains.'
            exit 1
          fi
