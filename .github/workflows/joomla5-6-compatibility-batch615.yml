name: Joomla 5/6 compatibility batch 615

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch615.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch615.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          grep -Fq -- '$this->match->team1_legs = $this->match->team1_legs ?? 0;' "$file"
          grep -Fq -- '$this->match->team2_legs = $this->match->team2_legs ?? 0;' "$file"
          grep -Fq -- '$new_match_id  = $this->item->new_match_id ?? 0;' "$file"
          grep -Fq -- '$old_match_id  = $this->item->old_match_id ?? 0;' "$file"

          if grep -Fq -- '? $this->item->new_match_id : 0' "$file"; then
            echo 'Legacy new_match_id ternary remains.'
            exit 1
          fi

          if grep -Fq -- '? $this->item->old_match_id : 0' "$file"; then
            echo 'Legacy old_match_id ternary remains.'
            exit 1
          fi
