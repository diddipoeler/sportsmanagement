name: Joomla 5/6 compatibility batch 618

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch618.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch618.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          if grep -Fq -- 'Parent::display($tpl)' "$file"; then
            echo 'Dead display comment remains.'
            exit 1
          fi

          if grep -Fq -- '$allplayers AS $player' "$file"; then
            echo 'Dead allplayers comment remains.'
            exit 1
          fi

          if grep -Fq -- 'print_r($this->projectws,true)' "$file"; then
            echo 'Dead debug block remains.'
            exit 1
          fi
