name: Joomla 5/6 compatibility batch 621

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch621.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch621.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          if grep -Fq -- 'isset($allreferees)' "$file"; then
            echo 'Redundant allreferees isset guard remains.'
            exit 1
          fi

          if grep -Fq -- 'isset($referees)' "$file"; then
            echo 'Redundant referees isset guard remains.'
            exit 1
          fi

          grep -Fq -- 'foreach ($allreferees as $referee)' "$file"
          grep -Fq -- 'foreach ($referees as $referee)' "$file"
