name: Joomla 5/6 compatibility batch 623

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch623.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/match/view.html.php'
      - '.github/workflows/joomla5-6-compatibility-batch623.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          file=admin/views/match/view.html.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"

          grep -Fq -- '$selectpositions = [HTMLHelper::_('"'"'select.option'"'"', '"'"'0'"'"', Text::_('"'"'COM_SPORTSMANAGEMENT_GLOBAL_SELECT_REF_FUNCTION'"'"'))];' "$file"

          if grep -Fq -- 'if ( !$selectpositions )' "$file"; then
            echo 'Dead selectpositions comment block remains.'
            exit 1
          fi
