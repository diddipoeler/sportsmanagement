name: Joomla 5/6 compatibility batch 626

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch626.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch626.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail
          file=admin/models/match.php
          php -l "$file"

          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done

          grep -Fq -- '@version    5.6.0' "$file"

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('admin/models/match.php').read_text()

          instance_names = (
              'getSeasonPersonAssignment',
              'getProjectReferee',
              'getEventType',
              'getProjectPosition',
          )

          for name in instance_names:
              match = re.search(rf'function\s+{name}\s*\([^)]*\)\s*\{{', text)
              if not match:
                  raise SystemExit(f'{name} not found')
              start = match.start()
              depth = 0
              body_start = text.find('{', start)
              end = body_start
              for i in range(body_start, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              segment = text[start:end]
              if '$this->jsmdb' not in segment:
                  raise SystemExit(f'{name} does not use $this->jsmdb')
              if 'Factory::getContainer()->get(DatabaseInterface::class)' in segment:
                  raise SystemExit(f'Global database remains in {name}')

          for name in ('getProjectReferees', 'getProjectPositionsOptions'):
              match = re.search(rf'public\s+static\s+function\s+{name}\s*\([^)]*\)\s*\{{', text)
              if not match:
                  raise SystemExit(f'static method {name} not found')
              start = match.start()
              depth = 0
              body_start = text.find('{', start)
              end = body_start
              for i in range(body_start, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              segment = text[start:end]
              if '$this->' in segment:
                  raise SystemExit(f'$this remains in static method {name}')
          PY
