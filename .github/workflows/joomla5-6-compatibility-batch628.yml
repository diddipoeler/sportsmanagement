name: Joomla 5/6 compatibility batch 628

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch628.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - '.github/workflows/joomla5-6-compatibility-batch628.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate static match helpers
        shell: bash
        run: |
          set -euo pipefail
          php -l admin/models/match.php
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('admin/models/match.php').read_text()
          for name in ('getProjectReferees', 'getProjectPositionsOptions'):
              match = re.search(rf'public\s+static\s+function\s+{name}\s*\([^)]*\)\s*\{{', text)
              if not match:
                  raise SystemExit(f'{name} not found')
              start = match.start()
              body_start = text.find('{', start)
              depth = 0
              end = body_start
              for i in range(body_start, len(text)):
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              segment = text[start:end]
              if '$this->' in segment:
                  raise SystemExit(f'$this remains in static method {name}')
          PY
