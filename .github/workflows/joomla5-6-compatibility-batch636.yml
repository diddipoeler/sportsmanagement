name: Joomla 5/6 compatibility batch 636

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/assets/updates/jsm_install_jcomments.php'
      - 'site/src/Controller/EditmatchController.php'
      - 'modules/mod_sportsmanagement_teamplayers/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch636.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/assets/updates/jsm_install_jcomments.php'
      - 'site/src/Controller/EditmatchController.php'
      - 'modules/mod_sportsmanagement_teamplayers/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch636.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/assets/updates/jsm_install_jcomments.php
            site/src/Controller/EditmatchController.php
            modules/mod_sportsmanagement_teamplayers/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          grep -Fq -- 'getWebAssetManager()->registerAndUseScript' admin/assets/updates/jsm_install_jcomments.php
          if grep -Fq -- '->addScript(' admin/assets/updates/jsm_install_jcomments.php; then
            echo 'Legacy addScript remains in JComments installer'
            exit 1
          fi
          if grep -Fq -- 'Uri::getInstance()' admin/assets/updates/jsm_install_jcomments.php; then
            echo 'Unused installer Uri bootstrap remains in JComments installer'
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          controller = Path('site/src/Controller/EditmatchController.php').read_text()
          if 'private function joomlaDatabase(): DatabaseInterface' not in controller:
              raise SystemExit('EditmatchController Joomla database helper is missing')
          if 'SportsManagementDatabaseResolver::resolve(' not in controller or '$this->joomlaDatabase()' not in controller:
              raise SystemExit('EditmatchController does not use centralized Joomla DB fallback')

          helper = Path('modules/mod_sportsmanagement_teamplayers/helper.php').read_text()
          if 'private static function joomlaDatabase(?DatabaseInterface $database = null): DatabaseInterface' not in helper:
              raise SystemExit('TeamPlayers legacy database helper is missing')
          if 'self::joomlaDatabase($database)' not in helper:
              raise SystemExit('TeamPlayers legacy helper does not use centralized DB fallback')
          if helper.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('TeamPlayers legacy helper should have exactly one Joomla DB container fallback')
          PY
