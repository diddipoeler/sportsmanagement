name: Joomla 5/6 compatibility batch 653

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - 'site/helpers/comments.php'
      - 'modules/mod_sportsmanagement_teamstats_ranking/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch653.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - 'site/helpers/comments.php'
      - 'modules/mod_sportsmanagement_teamstats_ranking/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch653.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/match.php
            site/helpers/comments.php
            modules/mod_sportsmanagement_teamstats_ranking/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          match = Path('admin/models/match.php').read_text()
          start = match.index('function insertgooglecalendar')
          end = match.index('return true;', start)
          segment = match[start:end]
          if 'DATE_FORMAT(' in segment:
              raise SystemExit('MySQL DATE_FORMAT remains in Match::insertgooglecalendar()')
          if "$row->time_present = substr($timePresent, 0, 5);" not in segment:
              raise SystemExit('Google Calendar match time is not normalized in PHP')

          comments = Path('site/helpers/comments.php').read_text()
          if 'private static function database(): DatabaseInterface' not in comments:
              raise SystemExit('Comments database resolver helper is missing')
          if 'private static function joomlaDatabase(): DatabaseInterface' not in comments:
              raise SystemExit('Comments Joomla DB helper is missing')
          if '$db = self::database();' not in comments:
              raise SystemExit('Comments forum subject lookup does not use centralized database access')
          if comments.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('Comments helper should have exactly one Joomla DB container access')

          teamstats = Path('modules/mod_sportsmanagement_teamstats_ranking/helper.php').read_text()
          if 'private static function joomlaDatabase(?DatabaseInterface $database = null): DatabaseInterface' not in teamstats:
              raise SystemExit('TeamStats Ranking Joomla DB helper is missing')
          if '$database = self::joomlaDatabase($database);' not in teamstats:
              raise SystemExit('TeamStats Ranking helper does not use centralized DB fallback')
          if teamstats.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('TeamStats Ranking helper should have exactly one Joomla DB container fallback')
          PY
