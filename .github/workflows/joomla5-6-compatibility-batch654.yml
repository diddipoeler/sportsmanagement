name: Joomla 5/6 compatibility batch 654

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - 'site/models/ranking.php'
      - 'modules/mod_sportsmanagement_matches/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-compatibility-batch654.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - 'site/models/ranking.php'
      - 'modules/mod_sportsmanagement_matches/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-compatibility-batch654.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/match.php
            site/models/ranking.php
            modules/mod_sportsmanagement_matches/src/Dispatcher/Dispatcher.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          match = Path('admin/models/match.php').read_text()
          start = match.index('function insertgooglecalendar')
          end = match.index('return true;', start)
          segment = match[start:end]
          if 'CONCAT_WS' in segment or 'CHAR_LENGTH(' in segment:
              raise SystemExit('Legacy MySQL match slug remains in insertgooglecalendar()')
          if ' AS slug ' in segment:
              raise SystemExit('Unused Google Calendar SQL slug alias remains')

          ranking = Path('site/models/ranking.php').read_text()
          if '$app->input' in ranking:
              raise SystemExit('Legacy direct SiteApplication input property access remains')
          if '$app->getInput()' not in ranking:
              raise SystemExit('Ranking model does not use Joomla application input accessor')

          dispatcher = Path('modules/mod_sportsmanagement_matches/src/Dispatcher/Dispatcher.php').read_text()
          if 'private function joomlaDatabase(): DatabaseInterface' not in dispatcher:
              raise SystemExit('Matches dispatcher Joomla DB helper is missing')
          if '$database = $this->joomlaDatabase();' not in dispatcher:
              raise SystemExit('Matches dispatcher does not use centralized DB access')
          if dispatcher.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('Matches dispatcher should have exactly one Joomla DB container access')
          PY
