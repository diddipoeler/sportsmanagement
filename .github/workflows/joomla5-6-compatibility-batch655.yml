name: Joomla 5/6 compatibility batch 655

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/models/match.php'
      - 'site/models/ranking.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-compatibility-batch655.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/models/match.php'
      - 'site/models/ranking.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-compatibility-batch655.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/match.php
            site/models/ranking.php
            modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          match = Path('admin/models/match.php').read_text()
          start = match.index('function saveshort()')
          end = match.index('/**', start + 20)
          segment = match[start:end]
          if 'CONCAT_WS' in segment or 'CHAR_LENGTH(' in segment or ' AS slug ' in segment:
              raise SystemExit('Unused MySQL slug remains in Match::saveshort()')

          ranking = Path('site/models/ranking.php').read_text()
          if '$app->input' in ranking:
              raise SystemExit('Legacy direct SiteApplication input property access remains in Ranking model')
          if ranking.count('$app->getInput()') < 3:
              raise SystemExit('Ranking model input accessors were not fully migrated')

          dispatcher = Path('modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php').read_text()
          if 'private function joomlaDatabase(): DatabaseInterface' not in dispatcher:
              raise SystemExit('Navigation Menu dispatcher Joomla DB helper is missing')
          if '$joomlaDatabase = $this->joomlaDatabase();' not in dispatcher:
              raise SystemExit('Navigation Menu dispatcher does not use centralized DB access')
          if dispatcher.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('Navigation Menu dispatcher should have exactly one Joomla DB container access')
          PY
