name: Joomla 5/6 compatibility batch 661

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/RoundsModel.php'
      - 'site/src/Model/ClubplanModel.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-compatibility-batch661.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Model/RoundsModel.php'
      - 'site/src/Model/ClubplanModel.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-compatibility-batch661.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/RoundsModel.php
            site/src/Model/ClubplanModel.php
            modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          rounds = Path('admin/src/Model/RoundsModel.php').read_text()
          nav_start = rounds.index('private static function getNavigationRounds')
          nav_end = rounds.index('private static function findRoundIndex', nav_start)
          nav = rounds[nav_start:nav_end]
          if "CONCAT_WS" in nav:
              raise SystemExit('MySQL CONCAT_WS remains in getNavigationRounds()')
          if "$row['id'] = (int) ($row['round_id'] ?? 0) . ':' . (string) ($row['alias'] ?? '');" not in nav:
              raise SystemExit('Round navigation slug contract is missing')

          today_start = rounds.index('public function getNextRoundByToday')
          today_end = rounds.index('/**', today_start + 20)
          today = rounds[today_start:today_end]
          if "$row['id']" in today:
              raise SystemExit('getNextRoundByToday() must keep raw database IDs')

          clubplan = Path('site/src/Model/ClubplanModel.php').read_text()
          cp_start = clubplan.index('public function getAllMatches')
          cp_end = clubplan.index('public function', cp_start + 20)
          cp = clubplan[cp_start:cp_end]
          if "$db->quoteName('m.time_present')" not in cp:
              raise SystemExit('Clubplan getAllMatches() does not select raw time_present')
          if "$match->time_present = substr($timePresent, 0, 5);" not in cp:
              raise SystemExit('Clubplan getAllMatches() time normalization is missing')

          dispatcher = Path('modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php').read_text()
          if 'private function joomlaDatabase(): DatabaseInterface' not in dispatcher:
              raise SystemExit('CountRekord dispatcher Joomla DB helper is missing')
          if '$database = $this->joomlaDatabase();' not in dispatcher:
              raise SystemExit('CountRekord dispatcher does not use centralized DB access')
          if dispatcher.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('CountRekord dispatcher should have exactly one Joomla DB container access')
          PY
