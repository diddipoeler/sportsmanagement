name: Joomla 5/6 compatibility batch 665

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/ProjectModel.php'
      - 'site/src/Model/SportsManagementProjectModel.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-compatibility-batch665.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Model/ProjectModel.php'
      - 'site/src/Model/SportsManagementProjectModel.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-compatibility-batch665.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/ProjectModel.php
            site/src/Model/SportsManagementProjectModel.php
            modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          project = Path('admin/src/Model/ProjectModel.php').read_text()
          if 'Factory::' in project:
              raise SystemExit('Direct Joomla Factory usage remains in administrator ProjectModel')
          if 'SportsManagementAdministratorApplicationResolver::resolve()' not in project:
              raise SystemExit('ProjectModel does not use the shared administrator application resolver')

          site_project = Path('site/src/Model/SportsManagementProjectModel.php').read_text()
          start = site_project.index('public function getProjectTeams')
          end = site_project.index('public function', start + 20)
          segment = site_project[start:end]
          if 'CONCAT_WS' in segment:
              raise SystemExit('MySQL CONCAT_WS remains in SportsManagementProjectModel::getProjectTeams()')
          for required in (
              '$row->project_slug =',
              '$row->team_slug =',
              '$row->projectteam_slug =',
              '$row->division_slug =',
              '$row->club_slug =',
          ):
              if required not in segment:
                  raise SystemExit(f'Missing PHP project-team slug builder: {required}')

          dispatcher = Path('modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php').read_text()
          if 'private function joomlaDatabase(): DatabaseInterface' not in dispatcher:
              raise SystemExit('SportsTypeStatistics dispatcher Joomla DB helper is missing')
          if '$database = $this->joomlaDatabase();' not in dispatcher:
              raise SystemExit('SportsTypeStatistics dispatcher does not use centralized DB access')
          if dispatcher.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('SportsTypeStatistics dispatcher should have exactly one Joomla DB container access')
          PY
