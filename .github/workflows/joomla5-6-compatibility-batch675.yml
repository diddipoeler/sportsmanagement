name: Joomla 5/6 compatibility batch 675

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/ProjectteamController.php'
      - 'site/src/Model/ClubinfoModel.php'
      - 'modules/mod_sportsmanagement_new_project/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch675.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/ProjectteamController.php'
      - 'site/src/Model/ClubinfoModel.php'
      - 'modules/mod_sportsmanagement_new_project/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch675.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Controller/ProjectteamController.php
            site/src/Model/ClubinfoModel.php
            modules/mod_sportsmanagement_new_project/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          projectteam = Path('admin/src/Controller/ProjectteamController.php').read_text()
          if 'private static function joomlaDatabase(): DatabaseInterface' not in projectteam:
              raise SystemExit('ProjectteamController Joomla DB helper is missing')
          if 'self::joomlaDatabase()' not in projectteam:
              raise SystemExit('ProjectteamController database resolver bypasses centralized Joomla DB access')
          if projectteam.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('ProjectteamController should have exactly one Joomla DB container access')
          if '\\Joomla\\CMS\\Factory::getContainer()->get(DatabaseInterface::class)' in projectteam:
              raise SystemExit('ProjectteamController still contains fully-qualified direct Joomla DB access')

          clubinfo = Path('site/src/Model/ClubinfoModel.php').read_text()
          if 'private static function joomlaDatabase(): DatabaseInterface' not in clubinfo:
              raise SystemExit('ClubinfoModel Joomla DB helper is missing')
          if 'self::joomlaDatabase(),' not in clubinfo:
              raise SystemExit('ClubinfoModel database resolver bypasses centralized Joomla DB access')
          if clubinfo.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('ClubinfoModel should have exactly one Joomla DB container access')

          new_project = Path('modules/mod_sportsmanagement_new_project/helper.php').read_text()
          if 'private static function siteApplication(): CMSApplicationInterface' not in new_project:
              raise SystemExit('NewProject legacy site application helper is missing')
          if '$app = self::siteApplication();' not in new_project:
              raise SystemExit('NewProject legacy helper bypasses centralized site application access')
          if new_project.count('SportsManagementSiteApplicationResolver::resolve()') != 1:
              raise SystemExit('NewProject legacy helper should resolve the site application only in its centralized helper')
          PY
