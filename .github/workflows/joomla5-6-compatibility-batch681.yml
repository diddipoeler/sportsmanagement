name: Joomla 5/6 compatibility batch 681

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/AjaxModel.php'
      - 'site/src/Model/ImagehandlerModel.php'
      - 'modules/mod_sportsmanagement_teamplayers/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch681.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Model/AjaxModel.php'
      - 'site/src/Model/ImagehandlerModel.php'
      - 'modules/mod_sportsmanagement_teamplayers/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch681.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/AjaxModel.php
            site/src/Model/ImagehandlerModel.php
            modules/mod_sportsmanagement_teamplayers/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          ajax = Path('admin/src/Model/AjaxModel.php').read_text()
          if 'self::joomlaDatabase()' not in ajax:
              raise SystemExit('AjaxModel bypasses centralized Joomla DB fallback')
          if ajax.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('AjaxModel should have exactly one Joomla DB container access')

          imagehandler = Path('site/src/Model/ImagehandlerModel.php').read_text()
          if 'private static function siteApplication(): CMSApplicationInterface' not in imagehandler:
              raise SystemExit('ImagehandlerModel site application helper is missing')
          if '$app = self::siteApplication();' not in imagehandler:
              raise SystemExit('ImagehandlerModel bypasses centralized site application access')
          if imagehandler.count('SportsManagementSiteApplicationResolver::resolve()') != 1:
              raise SystemExit('ImagehandlerModel should resolve the site application only in its centralized helper')

          teamplayers = Path('modules/mod_sportsmanagement_teamplayers/helper.php').read_text()
          if 'private static function siteApplication(): CMSApplicationInterface' not in teamplayers:
              raise SystemExit('TeamPlayers legacy site application helper is missing')
          if '$app = self::siteApplication();' not in teamplayers:
              raise SystemExit('TeamPlayers legacy helper bypasses centralized site application access')
          if teamplayers.count('SportsManagementSiteApplicationResolver::resolve()') != 1:
              raise SystemExit('TeamPlayers should resolve the site application only in its centralized helper')
          PY
