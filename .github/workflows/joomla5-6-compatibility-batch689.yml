name: Joomla 5/6 compatibility batch 689

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Helper/ActionLogHelper.php'
      - 'site/src/Controller/MatchesController.php'
      - 'modules/mod_sportsmanagement_playground_ticker/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch689.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Helper/ActionLogHelper.php'
      - 'site/src/Controller/MatchesController.php'
      - 'modules/mod_sportsmanagement_playground_ticker/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch689.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Helper/ActionLogHelper.php
            site/src/Controller/MatchesController.php
            modules/mod_sportsmanagement_playground_ticker/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          action_log = Path('admin/src/Helper/ActionLogHelper.php').read_text()
          if 'private static function administratorApplication(): CMSApplicationInterface' not in action_log:
              raise SystemExit('ActionLogHelper administrator application helper is missing')
          if '$app = self::administratorApplication();' not in action_log:
              raise SystemExit('ActionLogHelper bypasses centralized administrator application access')
          if action_log.count('SportsManagementAdministratorApplicationResolver::resolve()') != 1:
              raise SystemExit('ActionLogHelper should resolve the administrator application only in its helper')

          matches = Path('site/src/Controller/MatchesController.php').read_text()
          if 'private static function joomlaDatabase(): DatabaseInterface' not in matches:
              raise SystemExit('MatchesController Joomla DB helper is missing')
          if '$joomlaDatabase = self::joomlaDatabase();' not in matches:
              raise SystemExit('MatchesController bypasses centralized Joomla DB access')
          if matches.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('MatchesController should have exactly one Joomla DB container access')

          ticker = Path('modules/mod_sportsmanagement_playground_ticker/helper.php').read_text()
          if 'private static function siteApplication(): CMSApplicationInterface' not in ticker:
              raise SystemExit('PlaygroundTicker legacy site application helper is missing')
          if 'private static function joomlaDatabase(?DatabaseInterface $database = null): DatabaseInterface' not in ticker:
              raise SystemExit('PlaygroundTicker legacy Joomla DB helper is missing')
          if '$app = self::siteApplication();' not in ticker:
              raise SystemExit('PlaygroundTicker legacy helper bypasses centralized site application access')
          if '$database = self::joomlaDatabase($database);' not in ticker:
              raise SystemExit('PlaygroundTicker legacy helper bypasses centralized Joomla DB access')
          if ticker.count('SportsManagementSiteApplicationResolver::resolve()') != 1:
              raise SystemExit('PlaygroundTicker should resolve the site application only in its helper')
          if ticker.count('Factory::getContainer()->get(DatabaseInterface::class)') != 1:
              raise SystemExit('PlaygroundTicker should have exactly one Joomla DB container access')
          PY
