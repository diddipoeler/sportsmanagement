name: Joomla 5/6 compatibility batch 691

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Extension/SportsManagementComponent.php'
      - 'site/sportsmanagement.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch691.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Extension/SportsManagementComponent.php'
      - 'site/sportsmanagement.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - '.github/workflows/joomla5-6-compatibility-batch691.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Joomla 5/6 compatibility
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Extension/SportsManagementComponent.php
            site/sportsmanagement.php
            modules/mod_sportsmanagement_clubicons/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          python3 - <<'PY'
          from pathlib import Path

          component = Path('admin/src/Extension/SportsManagementComponent.php').read_text()
          if 'private static function joomlaApplication(): CMSApplicationInterface' not in component:
              raise SystemExit('SportsManagementComponent Joomla application helper is missing')
          if '$app = self::joomlaApplication();' not in component:
              raise SystemExit('SportsManagementComponent bypasses centralized Joomla application access')
          if component.count('Factory::getApplication()') != 1:
              raise SystemExit('SportsManagementComponent should call Factory::getApplication only in its helper')

          entry = Path('site/sportsmanagement.php').read_text()
          if '$siteApplication = static function (): CMSApplicationInterface' not in entry:
              raise SystemExit('Legacy site entry application resolver closure is missing')
          if '$app = $siteApplication();' not in entry:
              raise SystemExit('Legacy site entry bypasses centralized application resolution')
          if entry.count('SportsManagementSiteApplicationResolver::resolve()') != 1:
              raise SystemExit('Legacy site entry should resolve the site application only in its closure')

          clubicons = Path('modules/mod_sportsmanagement_clubicons/helper.php').read_text()
          if 'private static function siteApplication(): CMSApplicationInterface' not in clubicons:
              raise SystemExit('Clubicons legacy site application helper is missing')
          if '$app = self::siteApplication();' not in clubicons:
              raise SystemExit('Clubicons legacy helper bypasses centralized site application access')
          if clubicons.count('SportsManagementSiteApplicationResolver::resolve()') != 1:
              raise SystemExit('Clubicons should resolve the site application only in its helper')
          PY
