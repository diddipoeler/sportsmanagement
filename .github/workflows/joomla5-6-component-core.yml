name: Joomla 5/6 component core gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  component-core:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate active Joomla 5/6 component bridges
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/services/provider.php
            admin/sportsmanagement.php
            admin/src/Dispatcher/Dispatcher.php
            admin/src/Extension/SportsManagementComponent.php
            admin/src/Service/SportsManagementMVCFactory.php
            admin/src/Legacy/LegacyBootstrap.php
            admin/src/View/Project/HtmlView.php
            admin/src/View/Projects/HtmlView.php
            admin/src/View/Projectteams/HtmlView.php
            admin/src/View/Rounds/HtmlView.php
            admin/src/View/Matches/HtmlView.php
            admin/src/Controller/ProjectController.php
            admin/src/Controller/ProjectteamController.php
            admin/src/Controller/ProjectteamsController.php
            admin/src/Controller/RoundsController.php
            admin/src/Field/LeagueField.php
            admin/layouts/assignteams.php
            admin/layouts/changeteams.php
            admin/tmpl/project/edit.php
            admin/tmpl/project/panel.php
            admin/tmpl/projects/default.php
            admin/tmpl/projects/default_data.php
            admin/tmpl/projectteams/default.php
            admin/tmpl/projectteams/editlist.php
            admin/tmpl/projectteams/changeteams.php
            admin/tmpl/projectteams/copy.php
            admin/tmpl/rounds/default.php
            admin/tmpl/rounds/default_data.php
            admin/tmpl/rounds/populate.php
            admin/tmpl/rounds/massadd.php
            admin/tmpl/matches/default.php
            admin/tmpl/matches/default_teamselect.php
            admin/tmpl/matches/default_roundselect.php
            admin/tmpl/matches/default_massadd.php
            admin/tmpl/matches/default_matrix.php
            admin/views/project/view.html.php
            admin/views/project/tmpl/panel.php
            admin/views/project/tmpl/panel_3.php
            admin/views/project/tmpl/panel_4.php
            admin/views/projects/view.html.php
            admin/views/projectteams/view.html.php
            admin/views/projectteams/tmpl/default.php
            admin/views/projectteams/tmpl/editlist.php
            admin/views/projectteams/tmpl/changeteams.php
            admin/views/projectteams/tmpl/copy.php
            admin/views/rounds/view.html.php
            admin/views/matches/view.html.php
            admin/views/matches/tmpl/default.php
            admin/views/matches/tmpl/default_teamselect.php
            admin/views/matches/tmpl/default_roundselect.php
            admin/views/matches/tmpl/default_massadd.php
            admin/views/matches/tmpl/default_matrix.php
            site/sportsmanagement.php
            site/controller.php
            site/src/Controller/DisplayController.php
            site/src/Legacy/LegacyBootstrap.php
            site/src/Service/Router.php
            site/helpers/route.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          if grep -E 'Factory::get(User|Dbo)\(' "${files[@]}"; then
            echo 'Active component bridge uses a Joomla 6 removed Factory API.' >&2
            exit 1
          fi

          grep -Fq "Factory::getApplication()->isClient('api')" admin/services/provider.php
          grep -q 'RouterFactoryServiceProvider' admin/services/provider.php
          grep -q 'getMVCFactory' admin/sportsmanagement.php
          grep -q 'getIdentity' admin/sportsmanagement.php
          grep -q "method_exists(BaseDatabaseModel::class, 'addIncludePath')" admin/src/Legacy/LegacyBootstrap.php
          grep -q "method_exists(BaseDatabaseModel::class, 'addIncludePath')" site/src/Legacy/LegacyBootstrap.php

          # All normal administrator list/default views must retain a common
          # navigation button back to the SportsManagement control panel on
          # both the native dispatcher path and the legacy compatibility path.
          grep -Fq 'ToolbarHelper::back(' admin/src/Dispatcher/Dispatcher.php
          grep -Fq "index.php?option=com_sportsmanagement&view=cpanel" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "\$layout === 'default'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq 'ToolbarHelper::back(' admin/sportsmanagement.php
          grep -Fq "index.php?option=com_sportsmanagement&view=cpanel" admin/sportsmanagement.php
          grep -Fq "!in_array(\$layout, ['edit', 'edit_3', 'edit_4', 'panel'], true)" admin/sportsmanagement.php

          # Project edit and project control-panel workflows must resolve through
          # the native Joomla 5/6 view/controller. The panel must resolve the
          # SportsManagement database explicitly instead of using a protected
          # model getDatabase() call.
          grep -Fq 'namespace Diddipoeler\Component\SportsManagement\Administrator\View\Project;' admin/src/View/Project/HtmlView.php
          grep -Fq 'class HtmlView extends BaseHtmlView' admin/src/View/Project/HtmlView.php
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' admin/src/View/Project/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewProject')" admin/views/project/view.html.php
          grep -Fq "'project', 'round'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "\$view === 'project'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "['panel', 'panel_3', 'panel_4']" admin/src/Dispatcher/Dispatcher.php
          if grep -Fq -- '->getDatabase()' admin/src/View/Project/HtmlView.php; then
            echo 'Native project view regressed to protected model database access.' >&2
            exit 1
          fi

          # view=projects must resolve natively through MVCFactory/PSR-4. The
          # historical administrator view remains only as a compatibility alias.
          grep -Fq 'namespace Diddipoeler\Component\SportsManagement\Administrator\View\Projects;' admin/src/View/Projects/HtmlView.php
          grep -Fq 'class HtmlView extends BaseHtmlView' admin/src/View/Projects/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewProjects')" admin/views/projects/view.html.php
          test -f admin/forms/filter_projects.xml

          # Project teams, assignment, replacement and copy workflows must use
          # the native view/controller/template paths. Controllers must resolve
          # their database explicitly instead of calling protected model APIs.
          grep -Fq 'namespace Diddipoeler\Component\SportsManagement\Administrator\View\Projectteams;' admin/src/View/Projectteams/HtmlView.php
          grep -Fq 'class HtmlView extends BaseHtmlView' admin/src/View/Projectteams/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewprojectteams')" admin/views/projectteams/view.html.php
          grep -Fq "\$view === 'projectteams'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'projectteams.assign'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'projectteams.copy'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'projectteams.storecopy'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'projectteam.storechangeteams'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "['default', 'editlist', 'editlist_3', 'editlist_4', 'changeteams', 'changeteams_3', 'changeteams_4', 'copy']" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "\$field . (int) \$item->id" admin/tmpl/projectteams/default.php
          grep -Fq 'name="division_id<?php echo $id; ?>"' admin/tmpl/projectteams/default.php
          grep -Fq 'data-bs-toggle="modal"' admin/layouts/assignteams.php admin/layouts/changeteams.php
          if grep -Fq 'jQuery(' admin/layouts/assignteams.php admin/layouts/changeteams.php; then
            echo 'Projectteams modal trigger regressed to jQuery Bootstrap API.' >&2
            exit 1
          fi
          if grep -Fq -- '->getDatabase()' admin/src/Controller/ProjectteamsController.php admin/src/Controller/ProjectteamController.php; then
            echo 'Projectteams controller regressed to protected model database access.' >&2
            exit 1
          fi
          test -f admin/forms/filter_projectteams.xml

          # view=rounds and its populate/massadd workflows must run through the
          # native Joomla 5/6 dispatcher and PSR-4 view/template paths.
          grep -Fq 'namespace Diddipoeler\Component\SportsManagement\Administrator\View\Rounds;' admin/src/View/Rounds/HtmlView.php
          grep -Fq 'class HtmlView extends BaseHtmlView' admin/src/View/Rounds/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewRounds')" admin/views/rounds/view.html.php
          grep -Fq "['default', 'populate', 'massadd']" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'round.startpopulate'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'rounds.massadd'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'rounds.saveshort'" admin/src/Dispatcher/Dispatcher.php
          test -f admin/forms/filter_rounds.xml

          # view=matches now owns its native Joomla 5/6 view, layout shell,
          # selectors, matrix and mass-add form. Only the large match-row table
          # remains as an explicitly isolated transition template fallback.
          grep -Fq 'namespace Diddipoeler\Component\SportsManagement\Administrator\View\Matches;' admin/src/View/Matches/HtmlView.php
          grep -Fq 'class HtmlView extends BaseHtmlView' admin/src/View/Matches/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewMatches')" admin/views/matches/view.html.php
          grep -Fq "elseif (\$view === 'matches')" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'matches.saveshort'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'matches.count_result_yes'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'matches.count_result_no'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "views/matches/tmpl" admin/src/View/Matches/HtmlView.php
          test -f admin/forms/filter_matches.xml

          php -r '$files=array_slice($argv,1); foreach ($files as $file) { if (simplexml_load_file($file) === false) { fwrite(STDERR, "Invalid XML: $file\n"); exit(1); } }' \
            admin/forms/filter_projects.xml \
            admin/models/forms/filter_projects.xml \
            admin/forms/filter_projectteams.xml \
            admin/models/forms/filter_projectteams.xml \
            admin/forms/filter_rounds.xml \
            admin/models/forms/filter_rounds.xml \
            admin/forms/filter_matches.xml

          if grep -Fq 'addfieldpath=' admin/forms/filter_projects.xml admin/models/forms/filter_projects.xml admin/forms/filter_projectteams.xml admin/models/forms/filter_projectteams.xml admin/forms/filter_rounds.xml admin/models/forms/filter_rounds.xml admin/forms/filter_matches.xml; then
            echo 'Administrator filter form regressed to legacy field paths.' >&2
            exit 1
          fi

          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' admin/forms/filter_projects.xml
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' admin/forms/filter_projectteams.xml
