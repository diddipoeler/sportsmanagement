name: Joomla 5/6 controller loader regression

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/controllers/results.php'
      - 'site/controllers/treetonode.php'
      - 'site/controllers/uefawertung.php'
      - 'site/controllers/updsportsmanagement.php'
      - 'admin/controllers/cpanel.php'
      - 'admin/controllers/databasetool.php'
      - 'admin/controllers/databasetools.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - 'modules/mod_sportsmanagement_firstleagueoverview/helper.php'
      - 'site/src/Controller/UpdsportsmanagementController.php'
      - 'site/src/Model/UpdsportsmanagementModel.php'
      - 'admin/src/Controller/DatabasetoolsController.php'
      - 'modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php'
      - 'modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php'
      - 'modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php'
      - 'site/src/Controller/UpdsportsmanagementController.php'
      - 'admin/src/Controller/DatabasetoolController.php'
      - '.github/tests/joomla56_admin_maintenance_guard.php'
      - '.github/tests/joomla56_ranking_liveticker_service_contract.php'
      - '.github/tests/joomla56_native_mvc_security.php'
      - '.github/tests/joomla56_controller_bridge_loading.php'
      - '.github/workflows/joomla5-6-controller-loader-regression.yml'
  pull_request:
    paths:
      - 'site/controllers/results.php'
      - 'site/controllers/treetonode.php'
      - 'site/controllers/uefawertung.php'
      - 'site/controllers/updsportsmanagement.php'
      - 'admin/controllers/cpanel.php'
      - 'admin/controllers/databasetool.php'
      - 'admin/controllers/databasetools.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - 'modules/mod_sportsmanagement_firstleagueoverview/helper.php'
      - 'site/src/Controller/UpdsportsmanagementController.php'
      - 'site/src/Model/UpdsportsmanagementModel.php'
      - 'admin/src/Controller/DatabasetoolsController.php'
      - 'modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php'
      - 'modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php'
      - 'modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php'
      - 'site/src/Controller/UpdsportsmanagementController.php'
      - 'admin/src/Controller/DatabasetoolController.php'
      - '.github/tests/joomla56_admin_maintenance_guard.php'
      - '.github/tests/joomla56_ranking_liveticker_service_contract.php'
      - '.github/tests/joomla56_native_mvc_security.php'
      - '.github/tests/joomla56_controller_bridge_loading.php'
      - '.github/workflows/joomla5-6-controller-loader-regression.yml'

jobs:
  php-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Check controller and module syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/tests/joomla56_controller_bridge_loading.php
          for path in \
            site/controllers/results.php \
            site/controllers/treetonode.php \
            site/controllers/uefawertung.php \
            site/controllers/updsportsmanagement.php \
            admin/controllers/cpanel.php \
            admin/controllers/databasetool.php \
            admin/controllers/databasetools.php \
            modules/mod_sportsmanagement_eventsranking/helper.php \
            modules/mod_sportsmanagement_firstleagueoverview/helper.php; do
            php -l "$path"
          done
      - name: Check file-level PHPDoc tags
        run: php .github/tests/phpdoc_metadata.php site/controllers/results.php site/controllers/treetonode.php site/controllers/uefawertung.php site/controllers/updsportsmanagement.php admin/controllers/cpanel.php admin/controllers/databasetool.php admin/controllers/databasetools.php modules/mod_sportsmanagement_eventsranking/helper.php modules/mod_sportsmanagement_firstleagueoverview/helper.php
      - name: Check native bridge paths and module database guards
        run: php .github/tests/joomla56_controller_bridge_loading.php
      - name: Check Joomla 5/6 native security and ranking regressions
        shell: bash
        run: |
          set -euo pipefail
          php -l .github/tests/joomla56_native_mvc_security.php
          for path in \
            site/src/Controller/UpdsportsmanagementController.php \
            site/src/Model/UpdsportsmanagementModel.php \
            admin/src/Controller/DatabasetoolsController.php \
            modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php; do
            php -l "$path"
          done
          php .github/tests/phpdoc_metadata.php \
            site/src/Controller/UpdsportsmanagementController.php \
            site/src/Model/UpdsportsmanagementModel.php \
            admin/src/Controller/DatabasetoolsController.php \
            modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php
          php .github/tests/joomla56_native_mvc_security.php

      - name: Check ranking project selection and module database guards
        shell: bash
        run: |
          set -euo pipefail
          php -l modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php
          php -l modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php
          php -l .github/tests/joomla56_ranking_liveticker_service_contract.php
          php .github/tests/phpdoc_metadata.php \
            modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php \
            modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php
          php .github/tests/joomla56_ranking_liveticker_service_contract.php

      - name: Check native admin maintenance and frontend updater model loader
        shell: bash
        run: |
          set -euo pipefail
          php -l site/src/Controller/UpdsportsmanagementController.php
          php -l admin/src/Controller/DatabasetoolController.php
          php -l .github/tests/joomla56_admin_maintenance_guard.php
          php .github/tests/phpdoc_metadata.php \
            site/src/Controller/UpdsportsmanagementController.php \
            admin/src/Controller/DatabasetoolController.php
          php .github/tests/joomla56_admin_maintenance_guard.php
