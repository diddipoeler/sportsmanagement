name: Joomla 5/6 core migration slice

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/controller.php'
      - 'admin/src/Legacy/LegacyBootstrap.php'
      - 'admin/src/Model/SmimageimportModel.php'
      - 'admin/src/Service/SportsManagementMVCFactory.php'
      - 'admin/src/Table/PicturesTable.php'
      - 'admin/tables/pictures.php'
      - 'site/src/Legacy/LegacyBootstrap.php'
      - 'site/views/ical/**'
      - 'site/views/scoresheet/**'
      - 'modules/mod_sportsmanagement_calendar/**'
      - 'modules/mod_sportsmanagement_count_rekord/**'
      - 'modules/mod_sportsmanagement_google_calendar/**'
      - 'modules/mod_sportsmanagement_new_project/**'
      - 'plugins/jsm_bootstrap/**'
      - 'plugins/jsm_ishupdate/**'
      - 'plugins/jsm_jcomments/**'
      - 'plugins/jsm_registercomp/**'
      - 'plugins/jsm_search/**'
      - 'plugins/jsm_siscron/**'
      - 'plugins/jsm_userprofile/**'
      - 'script.joomla56.php'
      - 'sportsmanagement.xml'
      - '.github/workflows/joomla5-6-core-slice.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/controller.php'
      - 'admin/src/Legacy/LegacyBootstrap.php'
      - 'admin/src/Model/SmimageimportModel.php'
      - 'admin/src/Service/SportsManagementMVCFactory.php'
      - 'admin/src/Table/PicturesTable.php'
      - 'admin/tables/pictures.php'
      - 'site/src/Legacy/LegacyBootstrap.php'
      - 'site/views/ical/**'
      - 'site/views/scoresheet/**'
      - 'modules/mod_sportsmanagement_calendar/**'
      - 'modules/mod_sportsmanagement_count_rekord/**'
      - 'modules/mod_sportsmanagement_google_calendar/**'
      - 'modules/mod_sportsmanagement_new_project/**'
      - 'plugins/jsm_bootstrap/**'
      - 'plugins/jsm_ishupdate/**'
      - 'plugins/jsm_jcomments/**'
      - 'plugins/jsm_registercomp/**'
      - 'plugins/jsm_search/**'
      - 'plugins/jsm_siscron/**'
      - 'plugins/jsm_userprofile/**'
      - 'script.joomla56.php'
      - 'sportsmanagement.xml'
      - '.github/workflows/joomla5-6-core-slice.yml'

jobs:
  compatibility:
    name: Admin, site, modules, plugins and installer checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Lint migrated PHP and manifests
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/controller.php
            admin/src/Legacy/LegacyBootstrap.php
            admin/src/Model/SmimageimportModel.php
            admin/src/Service/SportsManagementMVCFactory.php
            admin/src/Table/PicturesTable.php
            admin/tables/pictures.php
            site/src/Legacy/LegacyBootstrap.php
            site/views/ical/view.raw.php
            site/views/scoresheet/view.raw.php
            modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.php
            modules/mod_sportsmanagement_calendar/helper.php
            modules/mod_sportsmanagement_calendar/services/provider.php
            modules/mod_sportsmanagement_calendar/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php
            modules/mod_sportsmanagement_calendar/calendarClass.php
            modules/mod_sportsmanagement_calendar/calendarFunctions.php
            modules/mod_sportsmanagement_calendar/connectors/calendarRuntime_j5.php
            modules/mod_sportsmanagement_calendar/connectors/sportsmanagement_j5.php
            modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php
            modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php
            modules/mod_sportsmanagement_calendar/tmpl/default.php
            modules/mod_sportsmanagement_calendar/tmpl/default_jsm.php
            modules/mod_sportsmanagement_calendar/tmpl/default_bootstrap.php
            modules/mod_sportsmanagement_calendar/tmpl/default_zabuto.php
            modules/mod_sportsmanagement_calendar/tmpl/default_arrobefr.php
            modules/mod_sportsmanagement_calendar/tmpl/default_tuicalendar.php
            modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_count_rekord/services/provider.php
            modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
            modules/mod_sportsmanagement_count_rekord/tmpl/default.php
            modules/mod_sportsmanagement_google_calendar/mod_sportsmanagement_google_calendar.php
            modules/mod_sportsmanagement_google_calendar/helper.php
            modules/mod_sportsmanagement_google_calendar/services/provider.php
            modules/mod_sportsmanagement_google_calendar/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_google_calendar/src/Helper/GoogleCalendarHelper.php
            modules/mod_sportsmanagement_google_calendar/tmpl/default.php
            modules/mod_sportsmanagement_new_project/mod_sportsmanagement_new_project.php
            modules/mod_sportsmanagement_new_project/helper.php
            modules/mod_sportsmanagement_new_project/services/provider.php
            modules/mod_sportsmanagement_new_project/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
            modules/mod_sportsmanagement_new_project/tmpl/native.php
            plugins/jsm_bootstrap/services/provider.php
            plugins/jsm_jcomments/services/provider.php
            plugins/jsm_ishupdate/services/provider.php
            plugins/jsm_registercomp/services/provider.php
            plugins/jsm_search/services/provider.php
            plugins/jsm_siscron/services/provider.php
            plugins/jsm_userprofile/services/provider.php
            plugins/jsm_jcomments/src/Extension/SportsmanagementComments.php
            plugins/jsm_ishupdate/src/Extension/SportsmanagementIshupdate.php
            plugins/jsm_registercomp/src/Extension/SportsmanagementRegistercomp.php
            plugins/jsm_siscron/src/Extension/SportsmanagementSiscron.php
            plugins/jsm_userprofile/src/Extension/SportsmanagementProfile.php
            script.joomla56.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("sportsmanagement.xml"); if (!$xml) { exit(1); }'
          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml"); if (!$xml) { exit(1); }'
          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.xml"); if (!$xml) { exit(1); }'
          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_google_calendar/mod_sportsmanagement_google_calendar.xml"); if (!$xml) { exit(1); }'
          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_new_project/mod_sportsmanagement_new_project.xml"); if (!$xml) { exit(1); }'

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'getInput()' admin/controller.php
          grep -Fq 'require_once $helperFile' admin/controller.php
          grep -Fq 'private static function import' admin/src/Legacy/LegacyBootstrap.php
          grep -Fq 'new PicturesTable($this->getDatabase())' admin/src/Model/SmimageimportModel.php
          grep -Fq 'use Joomla\Http\HttpFactory;' admin/src/Model/SmimageimportModel.php
          grep -Fq 'getStatusCode()' admin/src/Model/SmimageimportModel.php
          grep -Fq 'getBody()' admin/src/Model/SmimageimportModel.php
          grep -Fq "parent::__construct('#__sportsmanagement_pictures', 'id', \$db)" admin/src/Table/PicturesTable.php
          grep -Fq "class_alias(PicturesTable::class, 'sportsmanagementTablepictures')" admin/tables/pictures.php
          grep -Fq 'private static function import' site/src/Legacy/LegacyBootstrap.php
          grep -Fq 'require_once $helperFile' admin/src/Service/SportsManagementMVCFactory.php
          grep -Fq 'new EventModel()' site/views/ical/view.raw.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' site/views/ical/view.raw.php
          grep -Fq 'extends HtmlView' site/views/scoresheet/view.raw.php

          calendar_module=modules/mod_sportsmanagement_calendar
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementCalendar</namespace>' "$calendar_module/mod_sportsmanagement_calendar.xml"
          grep -Fq '<folder module="mod_sportsmanagement_calendar">services</folder>' "$calendar_module/mod_sportsmanagement_calendar.xml"
          grep -Fq 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface' "$calendar_module/src/Dispatcher/Dispatcher.php"
          grep -Fq "getHelper('CalendarHelper')" "$calendar_module/src/Dispatcher/Dispatcher.php"
          grep -Fq "'layout'," "$calendar_module/src/Dispatcher/Dispatcher.php"
          grep -Fq "get('which_layout'" "$calendar_module/src/Dispatcher/Dispatcher.php"
          grep -Fq 'public function getAjax(): string' "$calendar_module/src/Helper/CalendarHelper.php"
          grep -Fq 'buildTuiEvents' "$calendar_module/src/Helper/CalendarHelper.php"
          grep -Fq 'buildArrobeEvents' "$calendar_module/src/Helper/CalendarHelper.php"
          grep -Fq 'selected_team' "$calendar_module/src/Helper/CalendarHelper.php"
          grep -Fq 'connectors/calendarRuntime_j5.php' "$calendar_module/src/Helper/CalendarHelper.php"
          grep -Fq "require __DIR__ . '/default_jsm.php';" "$calendar_module/tmpl/default.php"
          grep -Fq "require __DIR__ . '/default_jsm.php';" "$calendar_module/tmpl/default_bootstrap.php"
          grep -Fq "require __DIR__ . '/default_jsm.php';" "$calendar_module/tmpl/default_zabuto.php"
          grep -Fq 'arrobe_events' "$calendar_module/tmpl/default_arrobefr.php"
          grep -Fq 'tui_events' "$calendar_module/tmpl/default_tuicalendar.php"
          grep -Fq 'fetch(window.location.href' "$calendar_module/assets/js/mod_sportsmanagement_calendar.js"
          grep -Fq 'window.bootstrap.Modal.getOrCreateInstance' "$calendar_module/assets/js/mod_sportsmanagement_calendar.js"

          browser_legacy_re='ActiveXObject|new Element\(|new Tips\(|\.modal\('
          if grep -E "$browser_legacy_re" "$calendar_module/assets/js/mod_sportsmanagement_calendar.js"; then
            echo 'Calendar browser runtime regressed to an obsolete MooTools/legacy modal API' >&2
            exit 1
          fi

          if grep -ER 'Factory::getApplication\(\)->input|Factory::getDocument\(\)|version_compare\(JVERSION' "$calendar_module/tmpl"; then
            echo 'Calendar layouts regressed to a legacy Joomla application/document API' >&2
            exit 1
          fi

          count_module=modules/mod_sportsmanagement_count_rekord
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementCountRekord</namespace>' "$count_module/mod_sportsmanagement_count_rekord.xml"
          grep -Fq '<folder module="mod_sportsmanagement_count_rekord">services</folder>' "$count_module/mod_sportsmanagement_count_rekord.xml"
          grep -Fq 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface' "$count_module/src/Dispatcher/Dispatcher.php"
          grep -Fq "getHelper('CountRekordHelper')" "$count_module/src/Dispatcher/Dispatcher.php"
          grep -Fq 'require_once $helperFile' "$count_module/src/Helper/CountRekordHelper.php"
          grep -Fq 'getInput()->getInt' "$count_module/src/Helper/CountRekordHelper.php"

          google_module=modules/mod_sportsmanagement_google_calendar
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementGoogleCalendar</namespace>' "$google_module/mod_sportsmanagement_google_calendar.xml"
          grep -Fq '<folder module="mod_sportsmanagement_google_calendar">services</folder>' "$google_module/mod_sportsmanagement_google_calendar.xml"
          grep -Fq 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface' "$google_module/src/Dispatcher/Dispatcher.php"
          grep -Fq "getHelper('GoogleCalendarHelper')" "$google_module/src/Dispatcher/Dispatcher.php"
          grep -Fq 'CacheControllerFactoryInterface' "$google_module/src/Helper/GoogleCalendarHelper.php"
          grep -Fq "createCacheController('callback'" "$google_module/src/Helper/GoogleCalendarHelper.php"
          grep -Fq 'use Joomla\Http\HttpFactory;' "$google_module/src/Helper/GoogleCalendarHelper.php"
          grep -Fq 'getStatusCode()' "$google_module/src/Helper/GoogleCalendarHelper.php"
          grep -Fq 'getBody()' "$google_module/src/Helper/GoogleCalendarHelper.php"

          new_project_module=modules/mod_sportsmanagement_new_project
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementNewProject</namespace>' "$new_project_module/mod_sportsmanagement_new_project.xml"
          grep -Fq '<folder module="mod_sportsmanagement_new_project">services</folder>' "$new_project_module/mod_sportsmanagement_new_project.xml"
          grep -Fq 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface' "$new_project_module/src/Dispatcher/Dispatcher.php"
          grep -Fq "getHelper('NewProjectHelper')" "$new_project_module/src/Dispatcher/Dispatcher.php"
          grep -Fq "getLayoutPath('mod_sportsmanagement_new_project', 'native')" "$new_project_module/mod_sportsmanagement_new_project.php"
          grep -Fq 'class modJSMNewProjectHelper' "$new_project_module/helper.php"
          grep -Fq 'public function createArticlesAjax(): array' "$new_project_module/src/Helper/NewProjectHelper.php"
          grep -Fq 'Session::checkToken' "$new_project_module/src/Helper/NewProjectHelper.php"

          grep -Fq 'use Joomla\Http\HttpFactory;' plugins/jsm_registercomp/src/Extension/SportsmanagementRegistercomp.php
          grep -Fq '(new HttpFactory())->getHttp()' plugins/jsm_registercomp/src/Extension/SportsmanagementRegistercomp.php
          grep -Fq 'use Joomla\Http\HttpFactory;' plugins/jsm_siscron/src/Extension/SportsmanagementSiscron.php
          grep -Fq 'getStatusCode()' plugins/jsm_siscron/src/Extension/SportsmanagementSiscron.php
          grep -Fq 'getBody()' plugins/jsm_siscron/src/Extension/SportsmanagementSiscron.php

          grep -Fq '<scriptfile>script.joomla56.php</scriptfile>' sportsmanagement.xml
          grep -Fq 'mod_sportsmanagement_google_calendar' sportsmanagement.xml
          grep -Fq 'plugin="jsm_jcomments" element="sportsmanagement_comments"' sportsmanagement.xml
          grep -Fq 'plugin="jsm_userprofile" element="jsmprofile"' sportsmanagement.xml
          if grep -Fq '<plugins3>' sportsmanagement.xml; then
            echo 'Obsolete Joomla 3 plugin block is back in the component manifest' >&2
            exit 1
          fi
          grep -Fq "\$item['element']" script.joomla56.php
          grep -Fq 'Joomla\Filesystem\File' script.joomla56.php
          grep -Fq 'Joomla\Filesystem\Folder' script.joomla56.php
          grep -Fq 'DatabaseInterface' script.joomla56.php
          grep -Fq 'setDatabase($this->getDatabase())' script.joomla56.php
          grep -Fq 'mergeBundledMedia' script.joomla56.php
          grep -Fq 'copyPlaceholderAssets' script.joomla56.php
          grep -Fq 'RecursiveDirectoryIterator' script.joomla56.php

          providers=(
            plugins/jsm_bootstrap/services/provider.php
            plugins/jsm_jcomments/services/provider.php
            plugins/jsm_ishupdate/services/provider.php
            plugins/jsm_registercomp/services/provider.php
            plugins/jsm_search/services/provider.php
            plugins/jsm_siscron/services/provider.php
            plugins/jsm_userprofile/services/provider.php
          )

          for provider in "${providers[@]}"; do
            grep -Fq 'use Joomla\Event\DispatcherInterface;' "$provider"
            grep -Fq '$container->get(DispatcherInterface::class)' "$provider"
          done

          for provider in \
            plugins/jsm_ishupdate/services/provider.php \
            plugins/jsm_search/services/provider.php \
            plugins/jsm_siscron/services/provider.php \
            plugins/jsm_userprofile/services/provider.php; do
            grep -Fq 'setDatabase($container->get(DatabaseInterface::class))' "$provider"
          done

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Joomla\\CMS\\Filesystem\\(File|Folder|Path)|Joomla\\CMS\\Http\\|Table::getInstance\('

          if grep -ER "$legacy_re" \
            admin/controller.php \
            admin/src/Legacy/LegacyBootstrap.php \
            admin/src/Model/SmimageimportModel.php \
            admin/src/Service/SportsManagementMVCFactory.php \
            admin/src/Table/PicturesTable.php \
            admin/tables/pictures.php \
            site/src/Legacy/LegacyBootstrap.php \
            site/views/ical \
            site/views/scoresheet \
            "$calendar_module/mod_sportsmanagement_calendar.php" \
            "$calendar_module/helper.php" \
            "$calendar_module/services" \
            "$calendar_module/src" \
            "$calendar_module/tmpl" \
            "$count_module" \
            "$google_module" \
            "$new_project_module/mod_sportsmanagement_new_project.php" \
            "$new_project_module/helper.php" \
            "$new_project_module/services" \
            "$new_project_module/src" \
            plugins/jsm_bootstrap/services \
            plugins/jsm_jcomments/services \
            plugins/jsm_ishupdate/services \
            plugins/jsm_registercomp/services \
            plugins/jsm_registercomp/src/Extension/SportsmanagementRegistercomp.php \
            plugins/jsm_search/services \
            plugins/jsm_siscron/services \
            plugins/jsm_siscron/src/Extension/SportsmanagementSiscron.php \
            plugins/jsm_userprofile/services \
            script.joomla56.php; then
            echo 'Core migration slice regressed to a removed/deprecated legacy API' >&2
            exit 1
          fi
