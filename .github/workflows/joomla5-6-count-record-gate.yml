name: Joomla 5/6 count record gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  count-record:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate count record module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_count_rekord
          manifest="$module/mod_sportsmanagement_count_rekord.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/CountRekordHelper.php"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/CountRekordHelper.php"
          php -l "$module/mod_sportsmanagement_count_rekord.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementCountRekord</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -Fq "(int) \$params->get('cfg_which_database', 0)" "$module/src/Helper/CountRekordHelper.php"
          grep -q 'table table-sm' "$manifest"
          grep -q "params->get('table_class'" "$module/tmpl/default.php"

          if grep -q 'addfieldpath' "$manifest"; then
            echo 'Count record manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|->getInput\(\)->getInt\(.cfg_which_database|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/CountRekordHelper.php" \
            "$module/mod_sportsmanagement_count_rekord.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php"; then
            echo 'Count record module regressed to a Joomla 6 legacy API or request-driven database selector.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
