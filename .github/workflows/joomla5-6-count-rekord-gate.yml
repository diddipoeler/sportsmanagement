name: Joomla 5/6 count record gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - joomla5-6

jobs:
  count-record:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate count record module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_count_rekord
          manifest="$module/mod_sportsmanagement_count_rekord.xml"
          helper="$module/src/Helper/CountRekordHelper.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          template="$module/tmpl/default.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php

          test -f "$module/services/provider.php"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$template"
          test -f "$resolver"

          php -l "$module/services/provider.php"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$module/mod_sportsmanagement_count_rekord.php"
          php -l "$module/helper.php"
          php -l "$template"
          php -l "$resolver"

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementCountRekord</namespace>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'name="jsm_stat_paarungen" type="number"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq "#__sportsmanagement_match" "$helper"
          grep -Fq "COUNT(*)" "$helper"

          if grep -Fq 'addfieldpath=' "$manifest"; then
            echo 'Count record manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -Fq 'table-condensed' "$manifest"; then
            echo 'Count record manifest regressed to Bootstrap 3 table-condensed.' >&2
            exit 1
          fi

          if grep -E 'sportsmanagementHelper::getDBConnection|components/com_sportsmanagement/helpers/sportsmanagement\.php|Factory::get(Document|Config|Language|User|Dbo)\(|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$dispatcher" \
            "$helper" \
            "$module/mod_sportsmanagement_count_rekord.php" \
            "$module/helper.php" \
            "$template"; then
            echo 'Count record module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
