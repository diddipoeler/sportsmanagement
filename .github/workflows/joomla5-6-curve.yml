name: Joomla 5/6 curve migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  curve:
    name: Native curve model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate curve migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/CurveModel.php
          model_bridge=site/models/curve.php
          view=site/src/View/Curve/HtmlView.php
          view_bridge=site/views/curve/view.html.php
          template=site/views/curve/tmpl/default_curvejs.php

          for file in "$model" "$model_bridge" "$view" "$view_bridge" "$template"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class CurveModel extends SportsManagementProjectModel' "$model"
          grep -q "class_alias(CurveModel::class, 'sportsmanagementModelCurve')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewCurve')" "$view_bridge"

          for method in determineTeam1And2 getDivLevel getTeam1 getDataByDivision getTeam2 getDivisionId getDivisions getTeamsForDivision getColors; do
            grep -q "function ${method}" "$model"
          done

          grep -q 'public static int $projectid' "$model"
          grep -q 'public static int $teamid1' "$model"
          grep -q 'public static int $teamid2' "$model"
          grep -q "\$this->getRounds('ASC')" "$model"
          grep -q 'JSMRanking::getInstance' "$model"
          grep -q 'function _setChartdata' "$view"
          grep -q 'CurveModel::$teamid1' "$template"
          grep -q 'CurveModel::$teamid2' "$template"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(' "$model" "$model_bridge" "$view" "$view_bridge" "$template"; then
            echo 'Curve MVC regressed to a removed Joomla compatibility API' >&2
            exit 1
          fi

          if grep -E -- 'ProjectRoundReader|sportsmanagementModelProject::|sportsmanagementModelRounds::|extends BaseDatabaseModel|extends sportsmanagementView' "$model" "$model_bridge" "$view"; then
            echo 'Native curve MVC depends on a duplicate or legacy model/view implementation' >&2
            exit 1
          fi

          if grep -q 'sportsmanagementModelCurve::' "$template"; then
            echo 'Curve chart template regressed to the legacy model alias' >&2
            exit 1
          fi
