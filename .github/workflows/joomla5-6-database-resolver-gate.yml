name: Joomla 5/6 Database Resolver Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  database-resolver:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SportsManagement database resolver
        shell: bash
        run: |
          set -euo pipefail
          resolver=site/src/Service/SportsManagementDatabaseResolver.php
          model=site/src/Model/SportsManagementModel.php
          playground_model=site/src/Model/PlaygroundModel.php
          legacy_model_base=site/libraries/sportsmanagement/model.php
          mvc_factory=admin/src/Service/SportsManagementMVCFactory.php

          test -f "$resolver"
          test -f "$model"
          test -f "$playground_model"
          test -f "$legacy_model_base"
          test -f "$mvc_factory"
          php -l "$resolver"
          php -l "$model"
          php -l "$playground_model"
          php -l "$legacy_model_base"
          php -l "$mvc_factory"

          grep -Fq "params->get('cfg_which_database', 0)" "$resolver"
          grep -Fq '$forceExternal = $selector === 1;' "$resolver"
          grep -Fq "if (!(bool) \$params->get('cfg_which_database', 0) && !\$forceExternal)" "$resolver"
          grep -Fq "if (!(bool) \$profileValue('jsmprofile.databaseaccess'))" "$resolver"
          grep -Fq 'hash_equals($expectedSerial, $actualSerial)' "$resolver"
          grep -Fq "'postgresql' => 'pgsql'" "$resolver"
          grep -Fq "'0000-00-00 00:00:00'" "$resolver"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$model"
          grep -Fq 'SportsManagementDatabaseResolver::resolve($joomlaDatabase, $selector)' "$playground_model"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$playground_model"
          ! grep -Fq 'getDBConnection(' "$playground_model"

          grep -Fq 'class JSMModelList extends ListModel' "$legacy_model_base"
          grep -Fq 'class JSMModelLegacy extends BaseDatabaseModel' "$legacy_model_base"
          grep -Fq 'SportsManagementDatabaseResolver::resolve($joomlaDatabase, $selector)' "$legacy_model_base"
          grep -Fq '$this->setDatabase($this->jsmdb);' "$legacy_model_base"
          ! grep -Fq 'getDBConnection(' "$legacy_model_base"
          ! grep -Fq 'setDbo(' "$legacy_model_base"

          grep -Fq 'use Diddipoeler\Component\SportsManagement\Site\Service\SportsManagementDatabaseResolver;' "$mvc_factory"
          grep -Fq 'SportsManagementDatabaseResolver::resolve($joomlaDatabase, 0)' "$mvc_factory"
          grep -Fq '$model->setDatabase(' "$mvc_factory"
          ! grep -Fq 'getDBConnection(' "$mvc_factory"

          if grep -REn 'Factory::getConfig\(|Factory::getDbo\(|JDatabaseDriver|JDatabase::|sportsmanagementHelper::getDBConnection|JLoader::|jimport\(' \
            "$resolver" "$model" "$playground_model" "$legacy_model_base"; then
            echo 'SportsManagement database resolver path regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

      - name: Validate migrated module resolver consumers
        shell: bash
        run: |
          set -euo pipefail
          resolver=site/src/Service/SportsManagementDatabaseResolver.php
          consumers=(
            modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php
            modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php
            modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php
            modules/mod_sportsmanagement_matches/connectors/native/QueryTrait.php
            modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
            modules/mod_sportsmanagement_playground_ticker/src/Helper/PlaygroundTickerHelper.php
            modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php
            modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php
            modules/mod_sportsmanagement_teamstats_ranking/src/Helper/TeamStatsRankingHelper.php
          )
          direct_consumers=(
            modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php
            modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php
            modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php
            modules/mod_sportsmanagement_matches/connectors/native/QueryTrait.php
            modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
            modules/mod_sportsmanagement_playground_ticker/src/Helper/PlaygroundTickerHelper.php
            modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php
            modules/mod_sportsmanagement_teamstats_ranking/src/Helper/TeamStatsRankingHelper.php
          )

          php -l "$resolver"

          for helper in "${consumers[@]}"; do
            test -f "$helper"
            php -l "$helper"
            grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          done

          for helper in "${direct_consumers[@]}"; do
            grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$helper"
          done

          grep -Fq 'SportsManagementDatabaseResolver::resolve($fallbackDatabase, $selector)' \
            modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php

          if grep -REn \
            'getDBConnection\(|sportsmanagementHelper|administrator/components/com_sportsmanagement/helpers/sportsmanagement\.php|Factory::getDbo\(|JDatabaseDriver|JDatabase::' \
            "${consumers[@]}"; then
            echo 'A migrated module regressed to the legacy SportsManagement database bootstrap.' >&2
            exit 1
          fi
