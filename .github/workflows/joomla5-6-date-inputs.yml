name: Joomla 5/6 site admin module date compatibility

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/SportsManagementDateHelper.php'
      - 'admin/helpers/sportsmanagement.php'
      - 'modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php'
      - '.github/tests/joomla56_date_input_normalisation.php'
      - '.github/workflows/joomla5-6-date-inputs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'site/src/Helper/SportsManagementDateHelper.php'
      - 'admin/helpers/sportsmanagement.php'
      - 'modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php'
      - '.github/tests/joomla56_date_input_normalisation.php'
      - '.github/workflows/joomla5-6-date-inputs.yml'

jobs:
  date-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint and check first-party PHPDoc metadata
        run: |
          set -euo pipefail
          for file in \
            site/src/Helper/SportsManagementDateHelper.php \
            admin/helpers/sportsmanagement.php \
            modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php \
            .github/tests/joomla56_date_input_normalisation.php; do
            php -l "$file"
          done
          php .github/tests/phpdoc_metadata.php \
            site/src/Helper/SportsManagementDateHelper.php \
            admin/helpers/sportsmanagement.php \
            modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php

      - name: Run cross-area date and birthday regressions
        run: |
          set -euo pipefail
          php .github/tests/joomla56_date_input_normalisation.php
          php .github/tests/joomla56_core_runtime_followup.php
          php .github/tests/joomla56_birthday_leapday.php
