name: Joomla 5/6 DFB controller prediction tips and new project limits

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/JlextdfbkeyimportController.php'
      - 'site/src/Model/PredictiontipModel.php'
      - 'modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php'
      - '.github/tests/joomla56_dfb_controller_prediction_newproject.php'
      - '.github/workflows/joomla5-6-dfb-controller-prediction-newproject.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/JlextdfbkeyimportController.php'
      - 'site/src/Model/PredictiontipModel.php'
      - 'modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php'
      - '.github/tests/joomla56_dfb_controller_prediction_newproject.php'
      - '.github/workflows/joomla5-6-dfb-controller-prediction-newproject.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP source and required PHPDoc
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Controller/JlextdfbkeyimportController.php
            site/src/Model/PredictiontipModel.php
            modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
            .github/tests/joomla56_dfb_controller_prediction_newproject.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Run DFB and prediction write guards and module bounds
        run: php .github/tests/joomla56_dfb_controller_prediction_newproject.php
