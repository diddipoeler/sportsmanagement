name: Joomla 5/6 dispatch input and navigation contract

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Dispatcher/Dispatcher.php'
      - 'admin/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php'
      - '.github/tests/joomla56_dispatch_input_navigation_contract.php'
      - '.github/workflows/joomla5-6-dispatch-navigation-validation.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Dispatcher/Dispatcher.php'
      - 'admin/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php'
      - '.github/tests/joomla56_dispatch_input_navigation_contract.php'
      - '.github/workflows/joomla5-6-dispatch-navigation-validation.yml'

permissions:
  contents: read

jobs:
  dispatch-navigation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax and required file-level headers
        shell: bash
        run: |
          set -euo pipefail
          php -l site/src/Dispatcher/Dispatcher.php
          php -l admin/src/Dispatcher/Dispatcher.php
          php -l modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php
          php -l .github/tests/joomla56_dispatch_input_navigation_contract.php
          php .github/tests/phpdoc_metadata.php site/src/Dispatcher/Dispatcher.php admin/src/Dispatcher/Dispatcher.php modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php .github/tests/joomla56_dispatch_input_navigation_contract.php
      - name: Exercise site, admin and navigation module input contracts
        run: php .github/tests/joomla56_dispatch_input_navigation_contract.php
