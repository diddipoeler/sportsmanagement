name: Joomla 5/6 editmatch AJAX scope

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/MatchesController.php'
      - 'site/src/View/Editmatch/EditmatchEventViewTrait.php'
      - 'site/assets/js/editmatch-editing.js'
      - 'site/assets/js/editmatch.js'
      - '.github/tests/joomla56_editmatch_ajax_project_scope.php'
      - '.github/workflows/joomla5-6-editmatch-ajax-scope.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/MatchesController.php'
      - 'site/src/View/Editmatch/EditmatchEventViewTrait.php'
      - 'site/assets/js/editmatch-editing.js'
      - 'site/assets/js/editmatch.js'
      - '.github/tests/joomla56_editmatch_ajax_project_scope.php'
      - '.github/workflows/joomla5-6-editmatch-ajax-scope.yml'

permissions:
  contents: read

jobs:
  editmatch-ajax-scope:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax and PHPDoc metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Controller/MatchesController.php
            site/src/View/Editmatch/EditmatchEventViewTrait.php
          )
          php .github/tests/phpdoc_metadata.php "${files[@]}"
          for file in "${files[@]}" .github/tests/joomla56_editmatch_ajax_project_scope.php; do
            php -l "$file"
          done
          node --check site/assets/js/editmatch.js
          node --check site/assets/js/editmatch-editing.js

      - name: Test AJAX match and project scoping
        run: php .github/tests/joomla56_editmatch_ajax_project_scope.php
