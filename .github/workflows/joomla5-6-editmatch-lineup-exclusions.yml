name: Joomla 5/6 frontend lineup exclusion integrity

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Service/EditmatchLineupViewDataService.php'
      - '.github/tests/joomla56_editmatch_lineup_exclusions.php'
      - '.github/workflows/joomla5-6-editmatch-lineup-exclusions.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Service/EditmatchLineupViewDataService.php'
      - '.github/tests/joomla56_editmatch_lineup_exclusions.php'
      - '.github/workflows/joomla5-6-editmatch-lineup-exclusions.yml'

permissions:
  contents: read

jobs:
  excluded-ids:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate syntax and PHPDocs
        shell: bash
        run: |
          set -euo pipefail
          php -l site/src/Service/EditmatchLineupViewDataService.php
          php -l .github/tests/joomla56_editmatch_lineup_exclusions.php
          php .github/scripts/check-php-headers.php site/src/Service/EditmatchLineupViewDataService.php
          php .github/scripts/check-php-function-docs.php site/src/Service/EditmatchLineupViewDataService.php
      - name: Validate parsed IDs and project-team scope
        run: php .github/tests/joomla56_editmatch_lineup_exclusions.php
