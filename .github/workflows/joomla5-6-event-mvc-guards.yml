name: Joomla 5/6 frontend event MVC guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/EventModel.php'
      - 'site/src/View/Event/HtmlView.php'
      - '.github/tests/joomla56_event_mvc_request_validation.php'
      - '.github/workflows/joomla5-6-event-mvc-guards.yml'
  pull_request:
    branches: [joomla5-6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-mvc:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint native PHP files
        run: |
          php -l site/src/Model/EventModel.php
          php -l site/src/View/Event/HtmlView.php
          php -l .github/tests/joomla56_event_mvc_request_validation.php
      - name: Assert strict event request and model dispatch
        run: php .github/tests/joomla56_event_mvc_request_validation.php
      - name: Check Joomla PHPDoc descriptions
        run: php .github/scripts/check-php-function-docs.php site/src/Model/EventModel.php site/src/View/Event/HtmlView.php
