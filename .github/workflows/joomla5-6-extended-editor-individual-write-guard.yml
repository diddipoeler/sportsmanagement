name: Joomla 5/6 extended editor and individual-match write guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/JlextindividualsportController.php'
      - 'admin/src/Controller/JlextindividualsportesController.php'
      - 'admin/src/Controller/SmextxmleditorController.php'
      - 'admin/src/Model/SmextxmleditorModel.php'
      - '.github/tests/joomla56_extended_editor_individual_write_guard.php'
      - '.github/workflows/joomla5-6-extended-editor-individual-write-guard.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/JlextindividualsportController.php'
      - 'admin/src/Controller/JlextindividualsportesController.php'
      - 'admin/src/Controller/SmextxmleditorController.php'
      - 'admin/src/Model/SmextxmleditorModel.php'
      - '.github/tests/joomla56_extended_editor_individual_write_guard.php'
      - '.github/workflows/joomla5-6-extended-editor-individual-write-guard.yml'

permissions:
  contents: read

jobs:
  guarded-writes:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax and required metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Controller/JlextindividualsportController.php
            admin/src/Controller/JlextindividualsportesController.php
            admin/src/Controller/SmextxmleditorController.php
            admin/src/Model/SmextxmleditorModel.php
            .github/tests/joomla56_extended_editor_individual_write_guard.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Test XML/PHP editor and individual-match write permissions
        run: php .github/tests/joomla56_extended_editor_individual_write_guard.php
