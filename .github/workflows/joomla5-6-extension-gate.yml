name: Joomla 5/6 extension compatibility gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  extension-compatibility:
    name: Installer, plugins, modules and entry points
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner PHP
        run: php -v

      - name: Lint installer and active component entry points
        shell: bash
        run: |
          set -euo pipefail
          php -l script.joomla56.php
          php -l site/sportsmanagement.php
          php -l site/src/Legacy/LegacyBootstrap.php
          php -l admin/sportsmanagement.php
          php -l admin/src/Service/SportsManagementMVCFactory.php

      - name: Validate Joomla 5/6 installer contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'implements InstallerScriptInterface' script.joomla56.php
          grep -q 'InstallerAdapter $adapter' script.joomla56.php
          grep -q "quoteName('client_id')" script.joomla56.php
          grep -q '<scriptfile>script.joomla56.php</scriptfile>' sportsmanagement.xml

      - name: Reject Joomla 6 removed APIs in active component entry points
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'Factory::get(Document|Config|Language|User)\(' site/sportsmanagement.php admin/sportsmanagement.php; then
            echo 'Active component entry point uses a Factory method removed for Joomla 6.' >&2
            exit 1
          fi
          if grep -E 'Factory::getApplication\(\)->input|\bJURI::|jimport\(' site/sportsmanagement.php admin/sportsmanagement.php; then
            echo 'Active component entry point regressed to a legacy Joomla API.' >&2
            exit 1
          fi
          if grep -E 'BaseController::getInstance\(|->addModelPath\(' admin/sportsmanagement.php; then
            echo 'Administrator entry point regressed to a controller/model API removed for Joomla 6.' >&2
            exit 1
          fi

          grep -q "case 'ical':" site/src/Legacy/LegacyBootstrap.php
          grep -q 'helpers.iCalcreator' site/src/Legacy/LegacyBootstrap.php
          grep -q 'getWebAssetManager()' site/sportsmanagement.php
          grep -q "bootComponent('com_sportsmanagement')" admin/sportsmanagement.php
          grep -q 'createController(' admin/sportsmanagement.php

      - name: Validate Joomla 5/6 MVC factory fallback
        shell: bash
        run: |
          set -euo pipefail
          factory=admin/src/Service/SportsManagementMVCFactory.php
          grep -q 'function createController' "$factory"
          grep -q 'parent::createController' "$factory"
          grep -q 'legacySearchPaths' "$factory"
          grep -q '/extensions/' "$factory"
          grep -q "str_starts_with(\$normalised, 'sportsmanagement')" "$factory"

          if grep -E 'BaseController::getInstance\(|->addModelPath\(' "$factory"; then
            echo 'MVC factory fallback uses an API removed for Joomla 6.' >&2
            exit 1
          fi

      - name: Lint migrated plugin and module services
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' php_files < <(
            find plugins modules admin/modules -type f -name '*.php' \
              \( -path '*/src/*' -o -path '*/services/*' \) -print0
          )
          if ((${#php_files[@]})); then
            printf '%s\0' "${php_files[@]}" | xargs -0 -n1 php -l
          fi

      - name: Gate migrated plugin and module Joomla APIs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' migrated_files < <(
            find plugins modules admin/modules -type f -name '*.php' \
              \( -path '*/src/*' -o -path '*/services/*' \) -print0
          )
          if ((${#migrated_files[@]})) && grep -E \
            'Factory::get(Document|Config|Language|User)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(' \
            "${migrated_files[@]}"; then
            echo 'Migrated plugin/module service regressed to an API removed for Joomla 6.' >&2
            exit 1
          fi

      - name: Validate native liveticker module
        shell: bash
        run: |
          set -euo pipefail
          liveticker=modules/mod_sportsmanagement_liveticker
          test -f "$liveticker/services/provider.php"
          test -f "$liveticker/src/Dispatcher/Dispatcher.php"
          test -f "$liveticker/src/Helper/LivetickerHelper.php"
          test ! -f "$liveticker/js/jquery-1.2.3.pack.js"

          php -l "$liveticker/mod_sportsmanagement_liveticker.php"
          php -l "$liveticker/helper.php"
          php -l "$liveticker/tmpl/default.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementLiveticker</namespace>' \
            "$liveticker/mod_sportsmanagement_liveticker.xml"
          grep -q 'ModuleDispatcherFactory' "$liveticker/services/provider.php"
          grep -q 'class Dispatcher extends AbstractModuleDispatcher' "$liveticker/src/Dispatcher/Dispatcher.php"
          grep -q 'fetch(' "$liveticker/js/turtushout.js"

          if grep -E 'Factory::get(Document|Config|Language|User)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::import\(' \
            "$liveticker/mod_sportsmanagement_liveticker.php" \
            "$liveticker/helper.php" \
            "$liveticker/src/Dispatcher/Dispatcher.php" \
            "$liveticker/src/Helper/LivetickerHelper.php"; then
            echo 'Liveticker regressed to a removed Joomla compatibility API.' >&2
            exit 1
          fi

          if grep -q 'jQuery' "$liveticker/js/turtushout.js"; then
            echo 'Liveticker JavaScript regressed to the removed bundled jQuery runtime.' >&2
            exit 1
          fi

      - name: Validate native playground ticker module
        shell: bash
        run: |
          set -euo pipefail
          ticker=modules/mod_sportsmanagement_playground_ticker
          test -f "$ticker/services/provider.php"
          test -f "$ticker/src/Dispatcher/Dispatcher.php"
          test -f "$ticker/src/Helper/PlaygroundTickerHelper.php"

          php -l "$ticker/mod_sportsmanagement_playground_ticker.php"
          php -l "$ticker/helper.php"
          php -l "$ticker/src/Dispatcher/Dispatcher.php"
          php -l "$ticker/src/Helper/PlaygroundTickerHelper.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementPlaygroundTicker</namespace>' \
            "$ticker/mod_sportsmanagement_playground_ticker.xml"
          grep -q 'ModuleDispatcherFactory' "$ticker/services/provider.php"
          grep -q 'class Dispatcher extends AbstractModuleDispatcher' "$ticker/src/Dispatcher/Dispatcher.php"
          grep -q 'getWebAssetManager()' "$ticker/src/Dispatcher/Dispatcher.php"
          grep -q 'getInput()' "$ticker/src/Helper/PlaygroundTickerHelper.php"

          if grep -E 'Factory::get(Document|Config|Language|User)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::import\(' \
            "$ticker/mod_sportsmanagement_playground_ticker.php" \
            "$ticker/helper.php" \
            "$ticker/src/Dispatcher/Dispatcher.php" \
            "$ticker/src/Helper/PlaygroundTickerHelper.php"; then
            echo 'Playground ticker regressed to a removed Joomla compatibility API.' >&2
            exit 1
          fi

          if grep -q 'if ($project = 0)' "$ticker/helper.php" "$ticker/src/Helper/PlaygroundTickerHelper.php"; then
            echo 'Playground ticker assignment bug returned.' >&2
            exit 1
          fi

      - name: Validate migrated extension manifests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' manifest; do
            php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { fwrite(STDERR, "Invalid XML: {$file}\n"); exit(1); }' "$manifest"
          done < <(find plugins modules admin/modules -maxdepth 2 -type f -name '*.xml' -print0)
