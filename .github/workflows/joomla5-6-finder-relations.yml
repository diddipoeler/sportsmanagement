name: Joomla 5/6 Finder relation refresh

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Service/FinderRelationNotifier.php'
      - 'admin/src/Controller/PlayersController.php'
      - 'admin/src/Controller/TeamplayersController.php'
      - 'admin/src/Controller/ProjectteamController.php'
      - 'admin/src/Controller/ProjectteamsController.php'
      - 'admin/src/Controller/ProjectrefereeController.php'
      - 'plugins/jsm_search/**'
      - '.github/workflows/joomla5-6-finder-relations.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Service/FinderRelationNotifier.php'
      - 'admin/src/Controller/PlayersController.php'
      - 'admin/src/Controller/TeamplayersController.php'
      - 'admin/src/Controller/ProjectteamController.php'
      - 'admin/src/Controller/ProjectteamsController.php'
      - 'admin/src/Controller/ProjectrefereeController.php'
      - 'plugins/jsm_search/**'
      - '.github/workflows/joomla5-6-finder-relations.yml'

jobs:
  finder-relations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint relation refresh PHP
        shell: bash
        run: |
          php -l admin/src/Service/FinderRelationNotifier.php
          php -l admin/src/Controller/PlayersController.php
          php -l admin/src/Controller/TeamplayersController.php
          php -l admin/src/Controller/ProjectteamsController.php
          php -l admin/src/Controller/ProjectrefereeController.php

      - name: Validate Joomla Finder event bridge
        shell: bash
        run: |
          notifier=admin/src/Service/FinderRelationNotifier.php
          players=admin/src/Controller/PlayersController.php
          roster=admin/src/Controller/TeamplayersController.php
          projectteams=admin/src/Controller/ProjectteamsController.php
          referees=admin/src/Controller/ProjectrefereeController.php

          grep -Fq 'PluginHelper::importPlugin(' "$notifier"
          grep -Fq "'finder', null, true, \$dispatcher" "$notifier"
          grep -Fq "new FinderEvent\\AfterSaveEvent('onFinderAfterSave'" "$notifier"
          grep -Fq "'com_sportsmanagement.club'" "$notifier"
          grep -Fq "'com_sportsmanagement.team'" "$notifier"
          grep -Fq "'com_sportsmanagement.person'" "$notifier"
          grep -Fq '#__sportsmanagement_project_team' "$notifier"
          grep -Fq '#__sportsmanagement_season_team_person_id' "$notifier"
          grep -Fq '#__sportsmanagement_project_referee' "$notifier"
          grep -Fq 'p.project_art_id' "$notifier"

          grep -Fq 'notifyPeople((array) ($post' "$players"
          grep -Fq 'notifyPeople($personIds)' "$players"
          grep -Fq 'peopleForTeamContext' "$roster"
          grep -Fq 'peopleForTeamRelations' "$roster"
          grep -Fq 'projectTeamEntitiesForProject' "$projectteams"
          grep -Fq 'projectTeamEntitiesForRows' "$projectteams"
          grep -Fq 'notify($before' "$projectteams"
          grep -Fq 'projectRefereePeopleForRows' "$referees"

          if grep -E 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance' \
              "$notifier" "$players" "$roster" "$projectteams" "$referees"; then
            echo 'Finder relation refresh reintroduced a legacy Joomla API' >&2
            exit 1
          fi
