name: Joomla 5/6 Finder and Top Tipper ID validation

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Service/FinderRelationNotifier.php'
      - 'modules/mod_sportsmanagement_top_tipper/src/Helper/TopTipperHelper.php'
      - '.github/tests/joomla56_finder_top_tipper_ids.php'
      - '.github/workflows/joomla5-6-finder-top-tipper-ids.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Service/FinderRelationNotifier.php'
      - 'modules/mod_sportsmanagement_top_tipper/src/Helper/TopTipperHelper.php'
      - '.github/tests/joomla56_finder_top_tipper_ids.php'
      - '.github/workflows/joomla5-6-finder-top-tipper-ids.yml'

permissions:
  contents: read

jobs:
  id-normalization:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP lint and required PHPDoc tags
        run: |
          set -euo pipefail
          php -l admin/src/Service/FinderRelationNotifier.php
          php -l modules/mod_sportsmanagement_top_tipper/src/Helper/TopTipperHelper.php
          php -l .github/tests/joomla56_finder_top_tipper_ids.php
          php .github/tests/phpdoc_metadata.php \
            admin/src/Service/FinderRelationNotifier.php \
            modules/mod_sportsmanagement_top_tipper/src/Helper/TopTipperHelper.php
      - name: Finder and Top Tipper ID normalization
        run: php .github/tests/joomla56_finder_top_tipper_ids.php
