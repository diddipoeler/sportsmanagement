name: Joomla 5/6 first league overview gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  first-league-overview:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate first league overview module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_firstleagueoverview
          manifest="$module/mod_sportsmanagement_firstleagueoverview.xml"
          helper="$module/src/Helper/FirstLeagueOverviewHelper.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"

          test -f "$module/services/provider.php"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$module/tmpl/default.php"

          php -l "$module/services/provider.php"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$module/mod_sportsmanagement_firstleagueoverview.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementFirstLeagueOverview</namespace>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq "useScript('bootstrap.tab')" "$dispatcher"
          grep -Fq "getDBConnection(" "$helper"
          grep -Fq "p.name') . ' DESC'" "$helper"
          grep -Fq '$seenLeagues' "$helper"

          if grep -q 'addfieldpath' "$manifest"; then
            echo 'First league overview manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -q 'table-condensed' "$manifest"; then
            echo 'First league overview manifest regressed to Bootstrap 3 table-condensed.' >&2
            exit 1
          fi

          if grep -q 'latestProjectForLeague' "$helper"; then
            echo 'First league overview regressed to one project query per league.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$dispatcher" \
            "$helper" \
            "$module/mod_sportsmanagement_firstleagueoverview.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php"; then
            echo 'First league overview module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
