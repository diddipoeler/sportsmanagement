name: Joomla 5/6 First League Overview Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  first-league-overview:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate first league overview module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_firstleagueoverview
          manifest="$module/mod_sportsmanagement_firstleagueoverview.xml"
          provider="$module/services/provider.php"
          helper="$module/src/Helper/FirstLeagueOverviewHelper.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          entry="$module/mod_sportsmanagement_firstleagueoverview.php"
          bridge="$module/helper.php"
          template="$module/tmpl/default.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php
          route_helper=site/src/Helper/SiteRouteHelper.php

          test -f "$provider"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$template"
          test -f "$resolver"
          test -f "$route_helper"

          php -l "$provider"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$entry"
          php -l "$bridge"
          php -l "$template"
          php -l "$resolver"
          php -l "$route_helper"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_firstleagueoverview/mod_sportsmanagement_firstleagueoverview.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementFirstLeagueOverview</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_firstleagueoverview">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          ! grep -Fq 'addfieldpath' "$manifest"
          ! grep -Fq 'table-condensed' "$manifest"

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'HelperFactory' "$provider"
          grep -Fq "useScript('bootstrap.tab')" "$dispatcher"
          grep -Fq 'DatabaseInterface::class' "$dispatcher"
          grep -Fq "getData(\$data['params'], \$database)" "$dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq "p.name') . ' DESC'" "$helper"
          grep -Fq '$seenLeagues' "$helper"
          grep -Fq 'SiteRouteHelper::view' "$helper"
          grep -Fq 'SportsManagementDatabaseResolver' "$resolver"

          ! grep -Fq 'getDBConnection' "$helper"
          ! grep -Fq 'sportsmanagementHelper' "$helper"
          ! grep -Fq 'require_once' "$helper"
          ! grep -Fq 'latestProjectForLeague' "$helper"
          ! grep -Fq 'http_build_query' "$helper"
          ! grep -Fq 'Joomla\CMS\Router\Route' "$helper"

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(|sportsmanagementHelper::getDBConnection' \
            "$provider" \
            "$dispatcher" \
            "$helper" \
            "$entry" \
            "$bridge" \
            "$module/tmpl"; then
            echo 'First league overview module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          ! grep -REn 'Factory::getConfig\(|Factory::getDbo\(|JDatabaseDriver|JDatabase::' "$resolver"
