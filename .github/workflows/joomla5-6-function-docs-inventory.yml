name: Joomla 5/6 full function PHPDoc inventory

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/**/*.php'
      - 'admin/**/*.php'
      - 'modules/**/*.php'
      - '.github/tests/joomla56_function_docs_inventory.php'
      - '.github/workflows/joomla5-6-function-docs-inventory.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint function documentation auditor
        run: php -l .github/tests/joomla56_function_docs_inventory.php
      - name: Inventory first-party function docs (report-only until fully migrated)
        run: php .github/tests/joomla56_function_docs_inventory.php --json=joomla56-function-docs-inventory.json
      - name: Upload documentation gap report
        uses: actions/upload-artifact@v4
        with:
          name: joomla56-function-docs-inventory
          path: joomla56-function-docs-inventory.json
          retention-days: 14
