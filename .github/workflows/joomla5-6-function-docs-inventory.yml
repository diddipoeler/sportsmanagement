name: Joomla 5/6 full function PHPDoc inventory

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/**/*.php'
      - 'admin/**/*.php'
      - 'modules/**/*.php'
      - '.github/tests/joomla56_function_docs_inventory.php'
      - '.github/tests/joomla56-admin-xml-parser-stream.php'
      - '.github/tests/joomla56-admin-sofee-xml-parser.php'
      - '.github/tests/joomla56-admin-transifex-locale.php'
      - '.github/tests/joomla56-site-legacy-json-compat.php'
      - '.github/tests/joomla56-site-person-image-url.php'
      - '.github/tests/joomla56-admin-parsecsv-constructor.php'
      - '.github/tests/joomla56-pdf-lzw-truncated-stream.php'
      - '.github/tests/joomla56-pdf-empty-stream-filters.php'
      - '.github/tests/joomla56-firstleague-text-media-inputs.php'
      - '.github/workflows/joomla5-6-function-docs-inventory.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: xml, zlib
      - name: Lint function documentation auditor
        run: php -l .github/tests/joomla56_function_docs_inventory.php
      - name: Enforce newly documented site, administrator and module functions
        run: |
          php .github/scripts/check-php-function-docs.php \
            site/src/Model/ResultsDataModel.php \
            site/src/Helper/ResultsPresentationHelper.php \
            site/src/Helper/ResultsLegacyHtmlCompatibility.php \
            site/legacy/resultsmatch.php \
            site/legacy/resultsround.php \
            site/helpers/JSON.php \
            site/helpers/scoresheet/fpdm.php \
            site/src/Model/SportsManagementPredictionModel.php \
            admin/src/Model/QuickaddModel.php \
            admin/src/Model/JlxmlimportModel.php \
            admin/src/Model/JoomleagueimportsModel.php \
            admin/src/Model/UpdatesModel.php \
            admin/helpers/transifex.php \
            admin/src/Service/IndividualMatchWriteService.php \
            admin/src/View/Statistics/HtmlView.php \
            modules/mod_sportsmanagement_google_calendar/media/fullcalendar/demos/php/utils.php

      - name: Verify generic error feedback and private SQL logging
        run: |
          php -l site/src/Model/ResultsDataModel.php
          php -l admin/src/Model/QuickaddModel.php
          php -l .github/tests/joomla56_results_quickadd_error_privacy.php
          php .github/tests/joomla56_results_quickadd_error_privacy.php

      - name: Verify PHP 8 migration fixes for site admin and modules
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/helpers/scoresheet/FilterLZW.php
            site/helpers/scoresheet/FilterFlate.php
            site/helpers/scoresheet/FilterStandard.php
            site/src/Helper/PersonImageHelper.php
            site/helpers/JSON.php
            site/helpers/scoresheet/fpdm.php
            admin/helpers/transifex.php
            admin/helpers/parsecsv.lib.php
            admin/helpers/XMLParser.class.php
            admin/helpers/parser_php5.php
            admin/helpers/SofeeXmlParser.php
            admin/src/Model/JlxmlimportModel.php
            admin/src/Model/JoomleagueimportsModel.php
            admin/src/Model/UpdatesModel.php
            site/src/Model/SportsManagementPredictionModel.php
            modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php
          )
          tests=(
            .github/tests/joomla56-pdf-lzw-truncated-stream.php
            .github/tests/joomla56-pdf-empty-stream-filters.php
            .github/tests/joomla56-admin-parsecsv-constructor.php
            .github/tests/joomla56-admin-xml-parser-stream.php
            .github/tests/joomla56-admin-sofee-xml-parser.php
            .github/tests/joomla56-admin-transifex-locale.php
            .github/tests/joomla56-site-legacy-json-compat.php
            .github/tests/joomla56-site-person-image-url.php
            .github/tests/joomla56-firstleague-text-media-inputs.php
          )
          for file in "${files[@]}" "${tests[@]}"; do
            php -l "$file"
          done
          for file in "${files[@]}"; do
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done
          for test in "${tests[@]}"; do
            php "$test"
          done

      - name: Inventory first-party function docs (report-only until fully migrated)
        run: php .github/tests/joomla56_function_docs_inventory.php --json=joomla56-function-docs-inventory.json
      - name: Upload documentation gap report
        uses: actions/upload-artifact@v4
        with:
          name: joomla56-function-docs-inventory
          path: joomla56-function-docs-inventory.json
          retention-days: 14
