name: Joomla 5/6 gcalendar gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - joomla5-6

jobs:
  gcalendar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gcalendar module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_gcalendar
          manifest="$module/mod_sportsmanagement_gcalendar.xml"
          helper="$module/src/Helper/GcalendarHelper.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          field=admin/src/Field/GcalendarField.php
          runtime="$module/js/gcalendar.js"
          template="$module/tmpl/default.php"

          test -f "$module/services/provider.php"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$field"
          test -f "$runtime"

          php -l "$module/services/provider.php"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$module/mod_sportsmanagement_gcalendar.php"
          php -l "$module/helper.php"
          php -l "$template"
          php -l "$field"
          node --check "$runtime"

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementGcalendar</namespace>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq '<folder>js</folder>' "$manifest"
          grep -Fq 'type="gcalendar"' "$manifest"
          grep -Fq "class GcalendarField" "$field"
          grep -Fq 'getIdentity()' "$helper"
          grep -Fq 'getWebAssetManager()' "$helper"
          grep -Fq "modules/mod_sportsmanagement_gcalendar/js/gcalendar.js" "$helper"
          grep -Fq 'data-jsm-gcalendar' "$template"
          grep -Fq 'data-calendar-config=' "$template"
          grep -Fq 'fetch(requestUrl' "$runtime"
          grep -Fq "requestUrl.searchParams.set('start'" "$runtime"
          grep -Fq "requestUrl.searchParams.set('end'" "$runtime"
          grep -Fq "credentials: 'same-origin'" "$runtime"

          if grep -q 'addfieldpath' "$manifest"; then
            echo 'Gcalendar manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -REn 'fullcalendar(/|\\)|fullCalendar\(|jquery-ui|jqueryui|jq\.fn|window\.jQuery|addInlineScript|components/com_sportsmanagement/libraries/fullcalendar|components/com_sportsmanagement/libraries/jquery' \
            "$helper" "$template" "$runtime" "$manifest"; then
            echo 'Gcalendar regressed to the legacy jQuery/FullCalendar runtime.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$dispatcher" \
            "$helper" \
            "$module/mod_sportsmanagement_gcalendar.php" \
            "$module/helper.php"; then
            echo 'Gcalendar module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
