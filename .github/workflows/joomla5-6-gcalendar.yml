name: Joomla 5/6 Google Calendar migration gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_gcalendar/**'
      - 'site/src/Model/SportsManagementModel.php'
      - 'site/src/Model/EventModel.php'
      - 'site/src/Model/JsonfeedModel.php'
      - 'site/src/Service/GoogleCalendarReadService.php'
      - 'site/src/View/Event/**'
      - 'site/views/event/**'
      - 'site/views/jsonfeed/**'
      - '.github/workflows/joomla5-6-gcalendar.yml'
  pull_request:
    branches: [master]
    paths:
      - 'modules/mod_sportsmanagement_gcalendar/**'
      - 'site/src/Model/SportsManagementModel.php'
      - 'site/src/Model/EventModel.php'
      - 'site/src/Model/JsonfeedModel.php'
      - 'site/src/Service/GoogleCalendarReadService.php'
      - 'site/src/View/Event/**'
      - 'site/views/event/**'
      - 'site/views/jsonfeed/**'
      - '.github/workflows/joomla5-6-gcalendar.yml'

jobs:
  gcalendar:
    name: Native module, feed and event checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Lint migrated PHP and manifest
        shell: bash
        run: |
          set -euo pipefail

          files=(
            modules/mod_sportsmanagement_gcalendar/mod_sportsmanagement_gcalendar.php
            modules/mod_sportsmanagement_gcalendar/helper.php
            modules/mod_sportsmanagement_gcalendar/services/provider.php
            modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
            modules/mod_sportsmanagement_gcalendar/tmpl/default.php
            site/src/Model/SportsManagementModel.php
            site/src/Service/GoogleCalendarReadService.php
            site/src/Model/JsonfeedModel.php
            site/src/Model/EventModel.php
            site/src/View/Event/HtmlView.php
            site/views/jsonfeed/view.raw.php
            site/views/jsonfeed/tmpl/default.php
            site/views/jsonfeed/tmpl/module.php
            site/views/event/view.html.php
            site/views/event/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_gcalendar/mod_sportsmanagement_gcalendar.xml"); if (!$xml) { exit(1); }'
          test ! -e site/views/event/tmpl/default.js

      - name: Validate native Google Calendar contracts
        shell: bash
        run: |
          set -euo pipefail

          manifest=modules/mod_sportsmanagement_gcalendar/mod_sportsmanagement_gcalendar.xml
          provider=modules/mod_sportsmanagement_gcalendar/services/provider.php
          dispatcher=modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php
          module_helper=modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
          site_base=site/src/Model/SportsManagementModel.php
          service=site/src/Service/GoogleCalendarReadService.php
          json_model=site/src/Model/JsonfeedModel.php
          event_model=site/src/Model/EventModel.php
          event_view=site/src/View/Event/HtmlView.php
          event_bridge=site/views/event/view.html.php
          event_template=site/views/event/tmpl/default.php
          json_default=site/views/jsonfeed/tmpl/default.php
          json_module=site/views/jsonfeed/tmpl/module.php

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementGcalendar</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_gcalendar">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          if grep -Fq 'version="2.5"' "$manifest"; then
            echo 'GCalendar manifest still declares Joomla 2.5' >&2
            exit 1
          fi

          grep -Fq "ModuleDispatcherFactory('\\\\Diddipoeler\\\\Module\\\\SportsManagementGcalendar')" "$provider"
          grep -Fq "HelperFactory('\\\\Diddipoeler\\\\Module\\\\SportsManagementGcalendar\\\\Site\\\\Helper')" "$provider"
          grep -Fq 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface' "$dispatcher"
          grep -Fq "getHelper('GcalendarHelper')" "$dispatcher"
          grep -Fq 'getWebAssetManager()' "$module_helper"
          grep -Fq "registerAndUseScript(" "$module_helper"
          grep -Fq "#__sportsmanagement_gcalendar" "$module_helper"

          grep -Fq 'require_once $helperFile' "$site_base"
          grep -Fq 'sportsmanagementHelper::getDBConnection' "$site_base"
          grep -Fq 'final class GoogleCalendarReadService' "$service"
          grep -Fq "Google_Client" "$service"
          grep -Fq "Google_Service_Calendar" "$service"
          grep -Fq "quoteName('access_content')" "$service"
          grep -Fq 'Never turn an empty client-side selection into "all calendars"' "$service"
          grep -Fq 'new GoogleCalendarReadService' "$json_model"
          grep -Fq 'new GoogleCalendarReadService' "$event_model"

          grep -Fq 'final class HtmlView extends SportsManagementHtmlView' "$event_view"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewEvent')" "$event_bridge"
          grep -Fq 'getWebAssetManager()' "$event_template"
          grep -Fq 'DateTimeImmutable' "$event_template"
          grep -Fq 'view=event&eventID=' "$json_default"
          grep -Fq 'view=gcalendar&gcids=' "$json_module"

          legacy_re='JLoader::|jimport\(|JDispatcher::|jsmGCalendar(Util|DBUtil|ZendHelper)|gcjQuery|utf8_encode\(|utf8_decode\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|version_compare\(.*JVERSION'

          if grep -ER "$legacy_re" \
            modules/mod_sportsmanagement_gcalendar \
            site/src/Model/SportsManagementModel.php \
            site/src/Service/GoogleCalendarReadService.php \
            site/src/Model/JsonfeedModel.php \
            site/src/Model/EventModel.php \
            site/src/View/Event \
            site/views/jsonfeed \
            site/views/event; then
            echo 'Google Calendar migration regressed to a removed/deprecated legacy API' >&2
            exit 1
          fi
