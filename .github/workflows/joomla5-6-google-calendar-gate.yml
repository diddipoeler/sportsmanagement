name: Joomla 5/6 Google Calendar gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - joomla5-6

jobs:
  google-calendar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Google Calendar module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_google_calendar
          manifest="$module/mod_sportsmanagement_google_calendar.xml"
          helper="$module/src/Helper/GoogleCalendarHelper.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          default_template="$module/tmpl/default.php"
          calendar_template="$module/tmpl/calendar.php"
          api_field=admin/src/Field/GoogleapikeyField.php
          calendar_field=admin/src/Field/GcalendarField.php

          test -f "$module/services/provider.php"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$default_template"
          test -f "$calendar_template"
          test -f "$api_field"
          test -f "$calendar_field"

          php -l "$module/services/provider.php"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$module/mod_sportsmanagement_google_calendar.php"
          php -l "$module/helper.php"
          php -l "$default_template"
          php -l "$calendar_template"
          php -l "$api_field"
          php -l "$calendar_field"

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementGoogleCalendar</namespace>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'type="GoogleApiKey"' "$manifest"
          grep -Fq 'type="gcalendar"' "$manifest"
          grep -Fq 'use Joomla\Http\HttpFactory;' "$helper"
          grep -Fq 'HttpFactory::getHttp()' "$helper"
          grep -Fq 'CacheControllerFactoryInterface' "$helper"
          grep -Fq 'rawurlencode($calendarId)' "$helper"
          grep -Fq '$response->getStatusCode()' "$helper"
          grep -Fq '$response->getBody()' "$helper"
          grep -Fq "require __DIR__ . '/default.php';" "$calendar_template"

          if grep -q 'addfieldpath' "$manifest"; then
            echo 'Google Calendar manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -Fq '<folder>media</folder>' "$manifest"; then
            echo 'Google Calendar manifest reintroduced the obsolete FullCalendar media runtime.' >&2
            exit 1
          fi

          if grep -Fq 'Joomla\CMS\Http\HttpFactory' "$helper" || grep -Fq 'new HttpFactory' "$helper"; then
            echo 'Google Calendar regressed to the deprecated/instantiated CMS HTTP factory path.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$dispatcher" \
            "$helper" \
            "$module/mod_sportsmanagement_google_calendar.php" \
            "$module/helper.php" \
            "$default_template" \
            "$calendar_template"; then
            echo 'Google Calendar module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -E 'addScript\(|addStyleSheet\(|jQuery|fullCalendar\(|<script' "$module"/tmpl/*.php; then
            echo 'Google Calendar layout regressed to the legacy inline FullCalendar runtime.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
