name: Joomla 5/6 helpers batch 244

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/CountryPresentationHelper.php'
      - 'site/src/Helper/ImageSelectHelper.php'
      - 'site/src/Helper/RoundPaginationHelper.php'
      - 'admin/src/Helper/ActionLogHelper.php'
      - 'admin/src/Helper/ExtraFieldsReadHelper.php'
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - '.github/workflows/joomla5-6-helpers-batch244.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Helper/CountryPresentationHelper.php'
      - 'site/src/Helper/ImageSelectHelper.php'
      - 'site/src/Helper/RoundPaginationHelper.php'
      - 'admin/src/Helper/ActionLogHelper.php'
      - 'admin/src/Helper/ExtraFieldsReadHelper.php'
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - '.github/workflows/joomla5-6-helpers-batch244.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Helper/CountryPresentationHelper.php
            site/src/Helper/ImageSelectHelper.php
            site/src/Helper/RoundPaginationHelper.php
            admin/src/Helper/ActionLogHelper.php
            admin/src/Helper/ExtraFieldsReadHelper.php
            admin/src/Helper/ExtraFieldsSaveHelper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            ! grep -Fq -- 'Factory::getApplication()' "$file"
          done

      - name: Validate Joomla 5/6 helper contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- 'SportsManagementSiteApplicationResolver::resolve()' site/src/Helper/CountryPresentationHelper.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver::resolve()' site/src/Helper/ImageSelectHelper.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver::resolve()' site/src/Helper/RoundPaginationHelper.php
          grep -Fq -- 'SportsManagementAdministratorApplicationResolver::resolve()' admin/src/Helper/ActionLogHelper.php
          grep -Fq -- 'SportsManagementAdministratorApplicationResolver::resolve()' admin/src/Helper/ExtraFieldsReadHelper.php
          grep -Fq -- 'SportsManagementAdministratorApplicationResolver::resolve()' admin/src/Helper/ExtraFieldsSaveHelper.php
          echo 'Joomla 5/6 batch 244 helper contracts OK.'
