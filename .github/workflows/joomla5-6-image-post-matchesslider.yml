name: Joomla 5/6 image POST and matches slider

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/ImagehandlerController.php'
      - 'site/src/Controller/ImagehandlerController.php'
      - 'site/views/imagehandler/tmpl/upload.php'
      - 'admin/tmpl/imagehandler/upload.php'
      - 'admin/tmpl/imagehandler/uploaddraganddrop.php'
      - 'modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php'
      - '.github/tests/joomla56_image_post_matchesslider_contract.php'
      - '.github/workflows/joomla5-6-image-post-matchesslider.yml'
  pull_request:
    paths:
      - 'admin/src/Controller/ImagehandlerController.php'
      - 'site/src/Controller/ImagehandlerController.php'
      - 'site/views/imagehandler/tmpl/upload.php'
      - 'admin/tmpl/imagehandler/upload.php'
      - 'admin/tmpl/imagehandler/uploaddraganddrop.php'
      - 'modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php'
      - '.github/tests/joomla56_image_post_matchesslider_contract.php'
      - '.github/workflows/joomla5-6-image-post-matchesslider.yml'

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax and file metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Controller/ImagehandlerController.php
            site/src/Controller/ImagehandlerController.php
            site/views/imagehandler/tmpl/upload.php
            admin/tmpl/imagehandler/upload.php
            admin/tmpl/imagehandler/uploaddraganddrop.php
            modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php -l .github/tests/joomla56_image_post_matchesslider_contract.php
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Image POST and matches slider regression
        run: php .github/tests/joomla56_image_post_matchesslider_contract.php
