name: Joomla 5/6 imagehandler security batch 17

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/controllers/imagehandler.php'
      - 'admin/src/Controller/ImagehandlerController.php'
      - '.github/workflows/joomla5-6-imagehandler-security-batch17.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/controllers/imagehandler.php'
      - 'admin/src/Controller/ImagehandlerController.php'
      - '.github/workflows/joomla5-6-imagehandler-security-batch17.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate imagehandler migration and SSRF contracts
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/controllers/imagehandler.php
            admin/src/Controller/ImagehandlerController.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done

            grep -Eq '@version[[:space:]]+5\.6\.0' "$file" || {
              echo "$file does not declare Joomla 5/6 migration version metadata" >&2
              exit 1
            }

            if grep -Eq 'JFactory::|JRequest::|Factory::getApplication\(\)|extends[[:space:]]+JController|extends[[:space:]]+JSMController' "$file"; then
              echo "$file contains a deprecated Joomla runtime API/controller base" >&2
              exit 1
            fi
          done

          grep -Fq "class_alias(ImagehandlerController::class, 'sportsmanagementControllerImagehandler')" admin/controllers/imagehandler.php
          grep -Fq 'final class ImagehandlerController extends SportsManagementAdminController' admin/src/Controller/ImagehandlerController.php

          controller=admin/src/Controller/ImagehandlerController.php
          grep -Fq "getHttp(['follow_location' => false], ['Curl', 'Stream'])" "$controller"
          grep -Fq 'private const MAX_REMOTE_REDIRECTS = 3' "$controller"
          grep -Fq 'private function validateRemoteImageUrl' "$controller"
          grep -Fq 'private function isPublicRemoteHost' "$controller"
          grep -Fq 'private function isPublicIpAddress' "$controller"
          grep -Fq 'private function resolveRemoteRedirect' "$controller"
          grep -Fq 'FILTER_FLAG_NO_PRIV_RANGE | FILTER_FLAG_NO_RES_RANGE' "$controller"
          grep -Fq 'gethostbynamel($host)' "$controller"
          grep -Fq 'dns_get_record($host, DNS_A | DNS_AAAA)' "$controller"
          grep -Fq "getHeaderLine('Location')" "$controller"
          grep -Fq "isset(\$parts['user'])" "$controller"
          grep -Fq "isset(\$parts['pass'])" "$controller"

          # Preserve the existing upload/delete safety contracts while hardening remote downloads.
          grep -Fq "Session::checkToken('post')" "$controller"
          grep -Fq "authorise(\$action, 'com_sportsmanagement')" "$controller"
          grep -Fq 'getimagesizefromstring($body)' "$controller"
          grep -Fq "InputFilter::clean(\$image, 'path')" "$controller"
          grep -Fq "['image/gif', 'image/jpeg', 'image/png', 'image/webp']" "$controller"

          if grep -Eq 'CURLOPT_FOLLOWLOCATION|CURLOPT_SSL_VERIFYPEER[[:space:]]*,[[:space:]]*false|getHttp\(\)->get\(\$url\)' "$controller"; then
            echo 'Imagehandler contains an unsafe automatic redirect/TLS/legacy remote-fetch path' >&2
            exit 1
          fi

          echo 'Joomla 5/6 imagehandler batch 17 contracts OK'
