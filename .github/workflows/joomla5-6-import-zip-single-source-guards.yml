name: Joomla 5/6 import ZIP isolation and single-source guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Service/LegacyImportZipService.php'
      - 'admin/src/Controller/JlextdbbimportController.php'
      - 'admin/src/Controller/JlextdfbnetplayerimportController.php'
      - 'admin/src/Controller/JlextlmoimportsController.php'
      - 'admin/src/Controller/JlextprofleagimportController.php'
      - 'admin/src/Controller/JlxmlimportController.php'
      - '.github/tests/joomla56_import_zip_single_source_guards.php'
      - '.github/workflows/joomla5-6-import-zip-single-source-guards.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Service/LegacyImportZipService.php'
      - 'admin/src/Controller/JlextdbbimportController.php'
      - 'admin/src/Controller/JlextdfbnetplayerimportController.php'
      - 'admin/src/Controller/JlextlmoimportsController.php'
      - 'admin/src/Controller/JlextprofleagimportController.php'
      - 'admin/src/Controller/JlxmlimportController.php'
      - '.github/tests/joomla56_import_zip_single_source_guards.php'
      - '.github/workflows/joomla5-6-import-zip-single-source-guards.yml'

permissions:
  contents: read

jobs:
  zip-import-regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
      - name: Validate PHP syntax and metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Service/LegacyImportZipService.php
            admin/src/Controller/JlextdbbimportController.php
            admin/src/Controller/JlextdfbnetplayerimportController.php
            admin/src/Controller/JlextlmoimportsController.php
            admin/src/Controller/JlextprofleagimportController.php
            admin/src/Controller/JlxmlimportController.php
            .github/tests/joomla56_import_zip_single_source_guards.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Check safe ZIP extraction and upload staging
        run: php .github/tests/joomla56_import_zip_single_source_guards.php
      - name: Recheck importer ACL and remote response size
        run: php .github/tests/joomla56_admin_importer_acl_remote_bounds.php
