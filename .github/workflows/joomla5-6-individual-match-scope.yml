name: Joomla 5/6 individual-match scoped writes
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Service/IndividualMatchWriteService.php'
      - 'site/src/Controller/EditmatchController.php'
      - '.github/tests/joomla56_individual_match_scope.php'
      - '.github/workflows/joomla5-6-individual-match-scope.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l admin/src/Service/IndividualMatchWriteService.php
          php -l site/src/Controller/EditmatchController.php
          php -l .github/tests/joomla56_individual_match_scope.php
      - name: Parent project and child record integrity
        run: php .github/tests/joomla56_individual_match_scope.php
