name: Joomla 5/6 model write ACL and match slider query limits

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/UpdsportsmanagementModel.php'
      - 'admin/src/Model/InstallhelperModel.php'
      - 'modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php'
      - '.github/tests/joomla56_source_editor_quote_frontend_guard.php'
      - '.github/tests/joomla56_install_slider_write_bounds.php'
      - '.github/workflows/joomla5-6-install-slider-model-write-bounds.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/UpdsportsmanagementModel.php'
      - 'admin/src/Model/InstallhelperModel.php'
      - 'modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php'
      - '.github/tests/joomla56_source_editor_quote_frontend_guard.php'
      - '.github/tests/joomla56_install_slider_write_bounds.php'
      - '.github/workflows/joomla5-6-install-slider-model-write-bounds.yml'

permissions:
  contents: read

jobs:
  model-and-slider-guards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all changed PHP and validate file metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Model/UpdsportsmanagementModel.php
            admin/src/Model/InstallhelperModel.php
            modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
            .github/tests/joomla56_source_editor_quote_frontend_guard.php
            .github/tests/joomla56_install_slider_write_bounds.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Exercise model permissions, module limits, and frontend sample writes
        run: |
          php .github/tests/joomla56_install_slider_write_bounds.php
          php .github/tests/joomla56_source_editor_quote_frontend_guard.php
