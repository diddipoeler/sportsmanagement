name: Joomla 5/6 installer gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  installer:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate component installer and bundled extensions
        shell: bash
        run: |
          set -euo pipefail

          script=script.joomla56.php
          manifest=sportsmanagement.xml

          test -f "$script"
          test -f "$manifest"

          php -l "$script"
          grep -q 'InstallerScriptInterface' "$script"
          grep -q 'InstallerAdapter' "$script"
          grep -q 'DatabaseInterface' "$script"
          grep -Fq 'use Joomla\Filesystem\File;' "$script"
          grep -Fq 'use Joomla\Filesystem\Folder;' "$script"
          grep -q '<scriptfile>script.joomla56.php</scriptfile>' "$manifest"

          if grep -E 'Factory::get(User|Dbo)\(|Joomla\\CMS\\Filesystem\\(File|Folder)|Joomla\\CMS\\Http\\HttpFactory|jimport\(' "$script"; then
            echo 'Installer regressed to a Joomla 6 removed/deprecated API.' >&2
            exit 1
          fi

          php <<'PHP'
          <?php
          $manifest = simplexml_load_file('sportsmanagement.xml');

          if ($manifest === false) {
              fwrite(STDERR, "sportsmanagement.xml is not valid XML.\n");
              exit(1);
          }

          foreach ($manifest->modules->module ?? [] as $module) {
              $name = (string) $module['module'];
              $client = (string) $module['client'];
              $path = $client === 'administrator'
                  ? 'admin/modules/' . $name
                  : 'modules/' . $name;

              if ($name === '' || !is_dir($path)) {
                  fwrite(STDERR, "Bundled module path missing: {$path}\n");
                  exit(1);
              }
          }

          foreach ($manifest->plugins->plugin ?? [] as $plugin) {
              $name = (string) $plugin['plugin'];
              $path = 'plugins/' . $name;

              if ($name === '' || !is_dir($path)) {
                  fwrite(STDERR, "Bundled plugin path missing: {$path}\n");
                  exit(1);
              }
          }
          PHP
