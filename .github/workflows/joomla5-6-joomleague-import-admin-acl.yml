name: Joomla 5/6 JoomLeague import admin ACL

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/JoomleagueimportsController.php'
      - '.github/tests/joomla56_joomleague_import_admin_acl.php'
      - '.github/workflows/joomla5-6-joomleague-import-admin-acl.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/JoomleagueimportsController.php'
      - '.github/tests/joomla56_joomleague_import_admin_acl.php'
      - '.github/workflows/joomla5-6-joomleague-import-admin-acl.yml'

permissions:
  contents: read

jobs:
  acl-regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify PHP syntax and metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Controller/JoomleagueimportsController.php
            .github/tests/joomla56_joomleague_import_admin_acl.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Verify JoomLeague multi-step importer authorization
        run: php .github/tests/joomla56_joomleague_import_admin_acl.php
