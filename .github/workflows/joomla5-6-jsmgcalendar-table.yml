name: Joomla 5/6 Google calendar table

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/JsmgcalendarModel.php'
      - 'admin/src/Table/JsmgcalendarTable.php'
      - 'admin/tables/jsmgcalendar.php'
      - '.github/workflows/joomla5-6-jsmgcalendar-table.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/JsmgcalendarModel.php'
      - 'admin/src/Table/JsmgcalendarTable.php'
      - 'admin/tables/jsmgcalendar.php'
      - '.github/workflows/joomla5-6-jsmgcalendar-table.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint Google calendar table slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/JsmgcalendarModel.php
            admin/src/Table/JsmgcalendarTable.php
            admin/tables/jsmgcalendar.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate Google calendar table contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'final class JsmgcalendarTable extends SportsManagementTable' admin/src/Table/JsmgcalendarTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_gcalendar', 'id', \$db)" admin/src/Table/JsmgcalendarTable.php
          grep -Fq '(new Crypt())->decrypt' admin/src/Table/JsmgcalendarTable.php
          grep -Fq '(new Crypt())->encrypt' admin/src/Table/JsmgcalendarTable.php
          grep -Fq 'new JsmgcalendarTable($this->getDatabase())' admin/src/Model/JsmgcalendarModel.php
          grep -Fq "class_alias(JsmgcalendarTable::class, 'sportsmanagementTablejsmGCalendar')" admin/tables/jsmgcalendar.php

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Table::getInstance\('
          if grep -ER "$legacy_re" \
            admin/src/Model/JsmgcalendarModel.php \
            admin/src/Table/JsmgcalendarTable.php \
            admin/tables/jsmgcalendar.php; then
            echo 'Google calendar table slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
