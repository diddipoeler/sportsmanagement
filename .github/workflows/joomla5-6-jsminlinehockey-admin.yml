name: Joomla 5/6 Inline Hockey admin bridge

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'sportsmanagement.xml'
      - 'site/extensions/jsminlinehockey/admin/controller.php'
      - 'site/extensions/jsminlinehockey/admin/controllers/jsminlinehockey.php'
      - 'site/extensions/jsminlinehockey/admin/models/jsminlinehockey.php'
      - 'site/extensions/jsminlinehockey/admin/views/jsminlinehockey/**'
      - 'site/src/Service/InlineHockeyApiClient.php'
      - 'site/src/Service/InlineHockeyProjectService.php'
      - 'site/src/Service/InlineHockeyClubTeamImportService.php'
      - 'site/src/Service/InlineHockeyMatchImportService.php'
      - 'site/src/Service/InlineHockeyClubLogoService.php'
      - '.github/workflows/joomla5-6-jsminlinehockey-admin.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'sportsmanagement.xml'
      - 'site/extensions/jsminlinehockey/admin/controller.php'
      - 'site/extensions/jsminlinehockey/admin/controllers/jsminlinehockey.php'
      - 'site/extensions/jsminlinehockey/admin/models/jsminlinehockey.php'
      - 'site/extensions/jsminlinehockey/admin/views/jsminlinehockey/**'
      - 'site/src/Service/InlineHockeyApiClient.php'
      - 'site/src/Service/InlineHockeyProjectService.php'
      - 'site/src/Service/InlineHockeyClubTeamImportService.php'
      - 'site/src/Service/InlineHockeyMatchImportService.php'
      - 'site/src/Service/InlineHockeyClubLogoService.php'
      - '.github/workflows/joomla5-6-jsminlinehockey-admin.yml'

jobs:
  inline-hockey-admin:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Inline Hockey admin bridge
        shell: bash
        run: |
          set -euo pipefail

          manifest=sportsmanagement.xml
          root_controller=site/extensions/jsminlinehockey/admin/controller.php
          controller=site/extensions/jsminlinehockey/admin/controllers/jsminlinehockey.php
          legacy_model=site/extensions/jsminlinehockey/admin/models/jsminlinehockey.php
          view=site/extensions/jsminlinehockey/admin/views/jsminlinehockey/view.html.php
          template=site/extensions/jsminlinehockey/admin/views/jsminlinehockey/tmpl/default.php
          api_client=site/src/Service/InlineHockeyApiClient.php
          project_service=site/src/Service/InlineHockeyProjectService.php
          club_team_service=site/src/Service/InlineHockeyClubTeamImportService.php
          match_service=site/src/Service/InlineHockeyMatchImportService.php
          logo_service=site/src/Service/InlineHockeyClubLogoService.php

          for file in "$root_controller" "$controller" "$legacy_model" "$view" "$template" "$api_client" "$project_service" "$club_team_service" "$match_service" "$logo_service"; do
            test -f "$file"
            php -l "$file"
          done

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('sportsmanagement.xml').getroot()
          site_files = root.find("./files[@folder='site']")
          if site_files is None:
              raise SystemExit('SportsManagement manifest has no site files section.')

          packaged = {(node.text or '').strip() for node in site_files.findall('folder')}
          missing = {'src', 'extensions'} - packaged
          if missing:
              raise SystemExit('SportsManagement site package misses: ' + ', '.join(sorted(missing)))
          PY

          grep -Fq 'use Joomla\Filesystem\File;' "$controller"
          grep -Fq 'use Joomla\Filesystem\Folder;' "$controller"
          grep -Fq 'use Joomla\Archive\Archive;' "$controller"
          grep -Fq '$this->app->getInput()' "$controller"
          grep -Fq 'File::upload(' "$controller"
          grep -Fq 'File::move(' "$controller"
          grep -Fq 'new Archive()' "$controller"
          grep -Fq 'InlineHockeyClubTeamImportService' "$controller"
          grep -Fq 'InlineHockeyMatchImportService' "$controller"
          grep -Fq 'InlineHockeyClubLogoService' "$controller"
          grep -Fq 'function getteams' "$controller"
          grep -Fq 'function getplayers' "$controller"
          grep -Fq -- '->importMatches(' "$controller"
          grep -Fq -- '->importClubs(' "$controller"
          grep -Fq -- '->importTeams(' "$controller"
          grep -Fq -- '->importPlayers(' "$controller"
          grep -Fq -- '->syncProjectLogos(' "$controller"

          grep -Fq 'class sportsmanagementModeljsminlinehockey extends BaseDatabaseModel' "$legacy_model"
          grep -Fq 'InlineHockeyMatchImportService' "$legacy_model"
          grep -Fq 'InlineHockeyClubTeamImportService' "$legacy_model"
          grep -Fq 'InlineHockeyClubLogoService' "$legacy_model"
          grep -Fq 'InlineHockeyProjectService' "$legacy_model"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$legacy_model"
          grep -Fq 'function getmatches' "$legacy_model"
          grep -Fq 'function getMatchLink' "$legacy_model"
          grep -Fq 'function checkProjectTeam' "$legacy_model"
          grep -Fq 'function getClubs' "$legacy_model"
          grep -Fq 'function getdata' "$legacy_model"

          if [ "$(wc -l < "$legacy_model")" -gt 180 ]; then
            echo 'Inline Hockey legacy model must remain a thin compatibility bridge.' >&2
            exit 1
          fi

          token_checks=$(grep -Fc '$this->checkToken();' "$controller")
          if [ "$token_checks" -lt 5 ]; then
            echo 'Inline Hockey mutating controller tasks must keep CSRF checks.' >&2
            exit 1
          fi

          grep -Fq "HTMLHelper::_('form.token')" "$template"
          grep -Fq 'htmlspecialchars' "$template"
          grep -Fq "getInt('pid', 0)" "$view"
          grep -Fq 'ToolbarHelper::save(' "$view"
          grep -Fq 'InlineHockeyProjectService' "$view"
          grep -Fq 'DatabaseInterface::class' "$view"

          grep -Fq 'final class InlineHockeyApiClient' "$api_client"
          grep -Fq 'use Joomla\Http\HttpFactory;' "$api_client"
          test "$(grep -Fc '$http = (new HttpFactory())->getHttp();' "$api_client")" -eq 2
          test "$(grep -Fc '$response = $http->get(' "$api_client")" -eq 2
          grep -Fq 'JSON_THROW_ON_ERROR' "$api_client"
          grep -Fq 'function pageUrl' "$api_client"
          grep -Fq 'function fetchIshdImage' "$api_client"
          grep -Fq 'MAX_IMAGE_BYTES = 5242880' "$api_client"
          grep -Fq "['ishd.de', 'www.ishd.de']" "$api_client"
          grep -Fq "\$scheme !== 'https'" "$api_client"

          grep -Fq 'final class InlineHockeyProjectService' "$project_service"
          grep -Fq 'function getMatchLink' "$project_service"
          grep -Fq 'function ensureProjectTeam' "$project_service"
          grep -Fq 'ParameterType::INTEGER' "$project_service"
          grep -Fq '#__sportsmanagement_season_team_id' "$project_service"
          grep -Fq '#__sportsmanagement_project_team' "$project_service"

          grep -Fq 'final class InlineHockeyClubTeamImportService' "$club_team_service"
          grep -Fq 'function importClubs' "$club_team_service"
          grep -Fq 'function importTeams' "$club_team_service"
          grep -Fq 'function importPlayers' "$club_team_service"
          grep -Fq "'club_id' => \$clubId" "$club_team_service"
          grep -Fq "insertObject('#__sportsmanagement_club'" "$club_team_service"
          grep -Fq "updateObject('#__sportsmanagement_team'" "$club_team_service"
          grep -Fq "insertObject('#__sportsmanagement_person'" "$club_team_service"
          grep -Fq "updateObject('#__sportsmanagement_person'" "$club_team_service"
          grep -Fq 'COM_SPORTSMANAGEMENT_ST_SKATER_HOCKEY' "$club_team_service"

          grep -Fq 'final class InlineHockeyMatchImportService' "$match_service"
          grep -Fq 'function importMatches' "$match_service"
          grep -Fq 'ensureProjectTeam(' "$match_service"
          grep -Fq "insertObject('#__sportsmanagement_match'" "$match_service"
          grep -Fq "updateObject('#__sportsmanagement_match'" "$match_service"
          grep -Fq "insertObject('#__sportsmanagement_playground'" "$match_service"
          grep -Fq "updateObject('#__sportsmanagement_club'" "$match_service"
          grep -Fq 'ParameterType::INTEGER' "$match_service"
          grep -Fq 'match_result_type' "$match_service"
          grep -Fq 'round_date_first' "$match_service"
          grep -Fq 'round_date_last' "$match_service"

          grep -Fq 'final class InlineHockeyClubLogoService' "$logo_service"
          grep -Fq 'use Joomla\Filesystem\File;' "$logo_service"
          grep -Fq 'use Joomla\Filesystem\Folder;' "$logo_service"
          grep -Fq 'function syncProjectLogos' "$logo_service"
          grep -Fq 'fetchIshdImage(' "$logo_service"
          grep -Fq 'File::write(' "$logo_service"
          grep -Fq 'Folder::create(' "$logo_service"
          grep -Fq "'logo_big' => \$relativePath" "$logo_service"
          grep -Fq "updateObject('#__sportsmanagement_club'" "$logo_service"
          grep -Fq '/placeholders/' "$logo_service"

          if grep -Fq '$this->model->getMatchLink' "$view"; then
            echo 'Inline Hockey view regressed to legacy model metadata lookup.' >&2
            exit 1
          fi

          if grep -E "getModel\(['\"]jsminlinehockey|sportsmanagementModeljsminlinehockey|models/jsminlinehockey\.php" "$controller"; then
            echo 'Inline Hockey controller regressed to the legacy importer model.' >&2
            exit 1
          fi

          if grep -E 'curl_|CURLOPT_SSL_VERIFYPEER|Joomla\\CMS\\Http\\HttpFactory|Joomla\\CMS\\Filesystem\\(File|Folder)|\bJArchive::|\brename\(|Factory::get(Document|Dbo|DBO|User)\(|Factory::getApplication\(\)->input|\$app->input|sportsmanagementHelper::|HttpFactory::getHttp\(|\bcopy\(' "$controller" "$view" "$template" "$api_client" "$project_service" "$club_team_service" "$match_service" "$logo_service" "$legacy_model"; then
            echo 'Inline Hockey admin bridge regressed to a Joomla 6 legacy or static framework factory API.' >&2
            exit 1
          fi
