name: Joomla 5/6 OpenLigaDB preview

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/extensions/jsmopenligadb/admin/**'
      - 'site/src/Service/OpenLigaDbPreviewService.php'
      - '.github/workflows/joomla5-6-jsmopenligadb.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/extensions/jsmopenligadb/admin/**'
      - 'site/src/Service/OpenLigaDbPreviewService.php'
      - '.github/workflows/joomla5-6-jsmopenligadb.yml'

jobs:
  openligadb-preview:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OpenLigaDB Joomla 5/6 preview path
        shell: bash
        run: |
          set -euo pipefail

          controller=site/extensions/jsmopenligadb/admin/controllers/jsmopenligadb.php
          model=site/extensions/jsmopenligadb/admin/models/jsmopenligadb.php
          view=site/extensions/jsmopenligadb/admin/views/jsmopenligadb/view.html.php
          template=site/extensions/jsmopenligadb/admin/views/jsmopenligadb/tmpl/default.php
          service=site/src/Service/OpenLigaDbPreviewService.php

          for file in "$controller" "$model" "$view" "$template" "$service"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq 'final class OpenLigaDbPreviewService' "$service"
          grep -Fq 'use Joomla\Http\HttpFactory;' "$service"
          grep -Fq '$http = (new HttpFactory())->getHttp();' "$service"
          grep -Fq '$response = $http->get(' "$service"
          grep -Fq 'JSON_THROW_ON_ERROR' "$service"
          grep -Fq 'ParameterType::INTEGER' "$service"
          grep -Fq 'function getProjectLink' "$service"
          grep -Fq 'function fetchMatches' "$service"
          grep -Fq 'function summarize' "$service"

          grep -Fq 'class sportsmanagementModeljsmopenligadb extends BaseDatabaseModel' "$model"
          grep -Fq 'OpenLigaDbPreviewService' "$model"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$model"
          grep -Fq 'OpenLigaDbPreviewService' "$view"
          grep -Fq 'previewSummary' "$view"
          grep -Fq 'ToolbarHelper::back(' "$view"
          grep -Fq 'OpenLigaDB Preview' "$template"

          if grep -E 'jsmopenligadb\.getmatches|\$this->model->|print_r\(|sportsmanagementHelper::|Joomla\\CMS\\Http\\HttpFactory|Joomla\\CMS\\Filesystem\\(File|Folder|Path)|Factory::get(Dbo|DBO|Document|User)\(|Factory::getApplication\(\)->input|\$app->input|HttpFactory::getHttp\(|curl_|jimport\(|JLoader::import|version_compare\(JVERSION' "$controller" "$model" "$view" "$template" "$service"; then
            echo 'OpenLigaDB preview regressed to a Joomla 6 legacy, static framework factory or debug path.' >&2
            exit 1
          fi

          if [ "$(wc -l < "$model")" -gt 80 ]; then
            echo 'OpenLigaDB legacy model must remain a thin compatibility bridge.' >&2
            exit 1
          fi
