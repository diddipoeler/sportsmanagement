name: Joomla 5/6 league champion overview migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  league-champion-overview:
    name: Native league champion overview checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate league champion overview migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/LeaguechampionoverviewModel.php
          model_bridge=site/models/leaguechampionoverview.php
          view=site/src/View/Leaguechampionoverview/HtmlView.php
          view_bridge=site/views/leaguechampionoverview/view.html.php
          template=site/views/leaguechampionoverview/tmpl/default.php

          for file in "$model" "$model_bridge" "$view" "$view_bridge" "$template"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class LeaguechampionoverviewModel extends SportsManagementProjectModel' "$model"
          grep -q "class_alias(LeaguechampionoverviewModel::class, 'sportsmanagementModelleaguechampionoverview')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewleaguechampionoverview')" "$view_bridge"

          for method in getLeagueId getAllProjectNames getAllProject getProjectWinner getProjectCountMatches getOverviewContextProject getOverviewData _getRankingCriteria _sortRanking array_msort; do
            grep -q "function ${method}" "$model"
          done

          grep -q "quoteName('pt.champion')" "$model"
          grep -q 'finaltablerank' "$model"
          grep -q 'cache_matches_finally' "$model"
          grep -q 'matches_finally' "$model"
          grep -q 'buildPlaceholderObject' "$model"
          grep -q 'getProjectCountMatches' "$model"

          grep -q '\$model->getOverviewData()' "$view"
          grep -q '\$model->getOverviewContextProject()' "$view"
          grep -q 'public array $leaguechampions' "$view"
          grep -q 'public array $leaguechampions_detail' "$view"
          grep -q 'public array $teamseason' "$view"
          grep -q 'public array $teamstotal' "$view"

          grep -q '\$this->databaseSelector' "$template"
          grep -q "\$this->input->getInt('s', 0)" "$template"
          grep -q '\$this->leaguechampions_detail' "$template"
          grep -q '\$this->leagueteamchampions' "$template"
          grep -q '\$this->teamstotal' "$template"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(|BaseDatabaseModel::getInstance|sportsmanagementModelProject::|sportsmanagementModelRanking|sportsmanagementModelRankingAllTime|sportsmanagementModelTeamInfo|sportsmanagementModelClubInfo|extends BaseDatabaseModel|extends sportsmanagementView' "$model" "$view" "$template"; then
            echo 'League champion overview regressed to a removed Joomla or legacy MVC API' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getApplication\(\)->input|\$app->input|Factory::getUser\(' "$template"; then
            echo 'League champion overview template regressed to a removed Joomla input or identity API' >&2
            exit 1
          fi
