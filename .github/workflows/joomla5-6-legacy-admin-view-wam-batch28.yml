name: Joomla 5/6 legacy admin view WebAssetManager batch 28

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/libraries/sportsmanagement/view.php'
      - '.github/workflows/joomla5-6-legacy-admin-view-wam-batch28.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/libraries/sportsmanagement/view.php'
      - '.github/workflows/joomla5-6-legacy-admin-view-wam-batch28.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 legacy administrator view WebAssetManager migration
        shell: bash
        run: |
          set -euo pipefail

          file=admin/libraries/sportsmanagement/view.php
          php -l "$file"

          grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
          grep -Eq '@author[[:space:]]+diddipoeler' "$file"
          grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
          grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"

          grep -Fq 'getWebAssetManager()' "$file"
          grep -Fq 'assetExists(' "$file"
          grep -Fq 'registerScript(' "$file"
          grep -Fq 'registerStyle(' "$file"
          grep -Fq 'useScript(' "$file"
          grep -Fq 'useStyle(' "$file"
          grep -Fq 'addInlineScript(' "$file"
          grep -Fq 'addInlineStyle(' "$file"

          grep -Fq 'com_sportsmanagement.legacy.joomla-functions' "$file"
          grep -Fq 'com_sportsmanagement.legacy.select2-cdn' "$file"
          grep -Fq 'com_sportsmanagement.legacy.form-control' "$file"
          grep -Fq 'com_sportsmanagement.legacy.jlextusericons4' "$file"
          grep -Fq 'com_sportsmanagement.legacy.flag-icon' "$file"
          grep -Fq 'https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js' "$file"
          grep -Fq '//cdn.jsdelivr.net/alertifyjs/1.10.0/css/alertify.min.css' "$file"

          if grep -En '\->(addScript|addStyleSheet|addScriptDeclaration|addStyleDeclaration|addCustomTag)\(' "$file"; then
            echo 'Direct legacy Document asset API remains in the administrator view.' >&2
            exit 1
          fi

          if grep -En 'version_compare\(|JVERSION' "$file"; then
            echo 'Legacy Joomla version branching returned to the administrator view.' >&2
            exit 1
          fi

          grep -Fq "HTMLHelper::_('select.options', \$this->unique_id, 'value', 'text'" "$file"
          grep -Fq "HTMLHelper::_('select.options', \$this->userfields, 'id', 'name'" "$file"
          grep -Fq "\$this->setLayout(\$this->getLayout() . '_4');" "$file"
          grep -Fq 'ToolbarHelper::saveGroup(' "$file"
