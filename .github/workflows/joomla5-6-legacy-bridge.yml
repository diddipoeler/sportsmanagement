name: Joomla 5/6 legacy bridge gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  legacy-bridge:
    name: Migrated legacy bridge checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migrated bridge surface
        shell: bash
        run: |
          set -euo pipefail

          list_model_pairs=(
            'AgegroupsModel|agegroups|sportsmanagementModelagegroups'
            'CurrentseasonsModel|currentseasons|sportsmanagementModelcurrentseasons'
            'ClubnamesModel|clubnames|sportsmanagementModelclubnames'
            'ClubsModel|clubs|sportsmanagementModelClubs'
            'DivisionsModel|divisions|sportsmanagementModelDivisions'
            'EventtypesModel|eventtypes|sportsmanagementModelEventtypes'
            'ExtrafieldsModel|extrafields|sportsmanagementModelextrafields'
            'LeaguesModel|leagues|sportsmanagementModelLeagues'
            'PlaygroundsModel|playgrounds|sportsmanagementModelPlaygrounds'
            'PositionsModel|positions|sportsmanagementModelPositions'
            'RosterpositionsModel|rosterpositions|sportsmanagementModelrosterpositions'
            'SeasonsModel|seasons|sportsmanagementModelSeasons'
            'TeamsModel|teams|sportsmanagementModelTeams'
          )

          form_model_pairs=(
            'AgegroupModel|agegroup|sportsmanagementModelagegroup|extends'
            'ClubModel|club|sportsmanagementModelclub|alias'
            'ClubnameModel|clubname|sportsmanagementModelclubname|alias'
            'DivisionModel|division|sportsmanagementModeldivision|alias'
            'EventtypeModel|eventtype|sportsmanagementModeleventtype|alias'
            'ExtrafieldModel|extrafield|sportsmanagementModelextrafield|alias'
            'LeagueModel|league|sportsmanagementModelleague|alias'
            'PositionModel|position|sportsmanagementModelposition|alias'
            'RosterpositionModel|rosterposition|sportsmanagementModelrosterposition|alias'
            'SeasonModel|season|sportsmanagementModelseason|alias'
            'SportstypeModel|sportstype|sportsmanagementModelsportstype|alias'
            'TeamModel|team|sportsmanagementModelteam|alias'
          )

          controller_bridge_pairs=(
            'ClubController|club|sportsmanagementControllerclub|SportsManagementFormController'
            'DivisionsController|divisions|sportsmanagementControllerdivisions|SportsManagementAdminController'
            'SeasonsController|seasons|sportsmanagementControllerseasons|SportsManagementAdminController'
            'SportstypeController|sportstype|sportsmanagementControllersportstype|SportsManagementFormController'
          )

          site_model_bridge_pairs=(
            'AboutModel|about|sportsmanagementModelAbout|SportsManagementModel'
          )

          compat_models=(
            admin/models/jsmgcalendar.php
            admin/models/jsmgcalendarimport.php
            admin/models/matchevent.php
            admin/models/matchplayer.php
            admin/models/matchreferee.php
            admin/models/matchstaff.php
            admin/models/positioneventtype.php
            admin/models/positionstatistic.php
            admin/models/predictiongroup.php
            admin/models/predictionproject.php
            admin/models/predictionround.php
            admin/models/predictiontemplate.php
            admin/models/projectposition.php
            admin/models/seasonperson.php
            admin/models/seasonteam.php
            admin/models/seasonteamperson.php
            admin/models/smimageimport.php
            admin/models/smquote.php
            admin/models/sportsmanagement.php
            admin/models/statistics.php
            admin/models/teamstaff.php
            admin/models/trainingdata.php
            admin/models/trainingsdata.php
          )

          custom_fields=(
            admin/models/fields/acteventtype.php
            admin/models/fields/actseason.php
            admin/models/fields/clublist.php
            admin/models/fields/coefficientyears.php
            admin/models/fields/color.php
            admin/models/fields/currentround.php
            admin/models/fields/eventtypelist.php
            admin/models/fields/extensionlist.php
            admin/models/fields/favteam.php
            admin/models/fields/finaltablerank.php
            admin/models/fields/gcalendar.php
            admin/models/fields/googleapikey.php
            admin/models/fields/jlmenuitems.php
            admin/models/fields/matchdaylist.php
            admin/models/fields/parentdivision.php
            admin/models/fields/personlist.php
            admin/models/fields/playgroundlist.php
            admin/models/fields/positionlist.php
            admin/models/fields/projectlist.php
            admin/models/fields/projectrounds.php
            admin/models/fields/projects.php
            admin/models/fields/sortorder.php
            admin/models/fields/statstypelist.php
            admin/models/fields/teamlist.php
            admin/models/fields/templatelist.php
            admin/models/fields/userlist.php
          )

          controller_files=(
            admin/libraries/sportsmanagement/controller.php
            site/libraries/sportsmanagement/controller.php
          )

          misc_bridge_files=(
            admin/controllers/imagehandler.php
            admin/models/imagehandler.php
            admin/models/imagelist.php
            site/controllers/imagehandler.php
            site/models/allclubs.php
            site/models/allplaygrounds.php
            site/models/imagehandler.php
          )

          native_list_models=()
          legacy_list_bridges=()

          for pair in "${list_model_pairs[@]}"; do
            IFS='|' read -r class legacy_file legacy_class <<< "$pair"
            native_file="admin/src/Model/${class}.php"
            bridge_file="admin/models/${legacy_file}.php"
            test -f "$native_file"
            test -f "$bridge_file"
            grep -q "class ${class} extends SportsManagementListModel" "$native_file"
            grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge_file"
            native_list_models+=("$native_file")
            legacy_list_bridges+=("$bridge_file")
          done

          native_form_models=()
          legacy_form_bridges=()

          for pair in "${form_model_pairs[@]}"; do
            IFS='|' read -r class legacy_file legacy_class mode <<< "$pair"
            native_file="admin/src/Model/${class}.php"
            bridge_file="admin/models/${legacy_file}.php"
            test -f "$native_file"
            test -f "$bridge_file"
            grep -q "class ${class} extends SportsManagementAdminModel" "$native_file"
            if [[ "$mode" == 'extends' ]]; then
              grep -q "class ${legacy_class} extends ${class}" "$bridge_file"
            else
              grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge_file"
            fi
            native_form_models+=("$native_file")
            legacy_form_bridges+=("$bridge_file")
          done

          native_controller_files=()
          legacy_controller_bridges=()

          for pair in "${controller_bridge_pairs[@]}"; do
            IFS='|' read -r class legacy_file legacy_class base_class <<< "$pair"
            native_file="admin/src/Controller/${class}.php"
            bridge_file="admin/controllers/${legacy_file}.php"
            test -f "$native_file"
            test -f "$bridge_file"
            grep -q "class ${class} extends ${base_class}" "$native_file"
            grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge_file"
            native_controller_files+=("$native_file")
            legacy_controller_bridges+=("$bridge_file")
          done

          native_site_models=()
          legacy_site_model_bridges=()

          for pair in "${site_model_bridge_pairs[@]}"; do
            IFS='|' read -r class legacy_file legacy_class base_class <<< "$pair"
            native_file="site/src/Model/${class}.php"
            bridge_file="site/models/${legacy_file}.php"
            test -f "$native_file"
            test -f "$bridge_file"
            grep -q "class ${class} extends ${base_class}" "$native_file"
            grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge_file"
            native_site_models+=("$native_file")
            legacy_site_model_bridges+=("$bridge_file")
          done

          lint_files=(
            "${native_list_models[@]}"
            "${legacy_list_bridges[@]}"
            "${native_form_models[@]}"
            "${legacy_form_bridges[@]}"
            "${native_controller_files[@]}"
            "${legacy_controller_bridges[@]}"
            "${native_site_models[@]}"
            "${legacy_site_model_bridges[@]}"
            "${compat_models[@]}"
            "${custom_fields[@]}"
            "${controller_files[@]}"
            "${misc_bridge_files[@]}"
            admin/src/Model/SportsManagementAdminModel.php
            admin/src/Model/SportsManagementListModel.php
            site/src/Model/SportsManagementModel.php
          )

          for file in "${lint_files[@]}"; do
            php -l "$file"
          done

          if grep -E 'JFormField(List|Text)|J?FormHelper::loadFieldClass' "${custom_fields[@]}"; then
            echo "Migrated custom field still uses a removed legacy form-field alias" >&2
            exit 1
          fi

          joomla6_surface=(
            "${native_list_models[@]}"
            "${legacy_list_bridges[@]}"
            "${native_form_models[@]}"
            "${legacy_form_bridges[@]}"
            "${legacy_controller_bridges[@]}"
            "${native_site_models[@]}"
            "${legacy_site_model_bridges[@]}"
            "${compat_models[@]}"
            "${controller_files[@]}"
            "${misc_bridge_files[@]}"
            admin/src/Model/SportsManagementAdminModel.php
            admin/src/Model/SportsManagementListModel.php
            site/src/Model/SportsManagementModel.php
            admin/models/fields/extensionlist.php
            admin/models/fields/statstypelist.php
          )

          if grep -E 'Joomla\\CMS\\Filesystem|->input|->getCfg\(|Factory::getApplication\([^)]' "${joomla6_surface[@]}"; then
            echo "Migrated bridge regressed to a Joomla 5/6 legacy API" >&2
            exit 1
          fi

          if grep -E 'Factory::getUser\(|JError::|jexit\(' "${controller_files[@]}" "${legacy_controller_bridges[@]}"; then
            echo "Migrated controller bridge regressed to a removed compatibility API" >&2
            exit 1
          fi

          model_compat_surface=(
            "${native_list_models[@]}"
            "${legacy_list_bridges[@]}"
            "${native_form_models[@]}"
            "${legacy_form_bridges[@]}"
            "${native_site_models[@]}"
            "${legacy_site_model_bridges[@]}"
            "${compat_models[@]}"
            admin/src/Model/SportsManagementAdminModel.php
            admin/src/Model/SportsManagementListModel.php
            site/src/Model/SportsManagementModel.php
            site/models/allclubs.php
            site/models/allplaygrounds.php
          )

          if grep -E 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|jimport\(|JLoader::import\(' "${model_compat_surface[@]}"; then
            echo "Migrated model bridge regressed to a removed compatibility API" >&2
            exit 1
          fi

          if grep -E 'components\.com_sportsmanagement\.models|extends \\sportsmanagementModel|extends JSMModelList' "${native_list_models[@]}"; then
            echo "Native administrator list model depends on a legacy model implementation" >&2
            exit 1
          fi

          if grep -E 'components\.com_sportsmanagement\.models|extends \\sportsmanagementModel|extends JSMModelAdmin' "${native_form_models[@]}"; then
            echo "Native administrator form model depends on a legacy model implementation" >&2
            exit 1
          fi

          if grep -E 'components\.com_sportsmanagement\.models|extends \\sportsmanagementModel' "${native_site_models[@]}"; then
            echo "Native site model depends on a legacy model implementation" >&2
            exit 1
          fi

          grep -q 'function getAssignTeamsQuery' admin/src/Model/SeasonsModel.php
          grep -q 'function getAssignPersonsQuery' admin/src/Model/SeasonsModel.php
          grep -q 'function getSeasonTeams' admin/src/Model/SeasonsModel.php
          grep -q 'function getSeasonName' admin/src/Model/SeasonsModel.php
          grep -q 'function getLeagues' admin/src/Model/LeaguesModel.php
          grep -q 'function getProjectPositions' admin/src/Model/PositionsModel.php
          grep -q 'function getPositions' admin/src/Model/PositionsModel.php
          grep -q 'function getPositionListSelect' admin/src/Model/PositionsModel.php
          grep -q 'function getRosterHome' admin/src/Model/RosterpositionsModel.php
          grep -q 'function getRosterAway' admin/src/Model/RosterpositionsModel.php
          grep -q "getState('layout') === 'assignteams'" admin/src/Model/TeamsModel.php
          grep -q 'season.id' admin/src/Model/TeamsModel.php
          grep -q 'function getTeamListSelect' admin/src/Model/TeamsModel.php
          grep -q 'function getClubListSelect' admin/src/Model/ClubsModel.php
          grep -q 'function prepareSportsManagementData' admin/src/Model/RosterpositionModel.php
          grep -q 'function afterSportsManagementSave' admin/src/Model/RosterpositionModel.php
          grep -q 'function getlogohistoryLeague' admin/src/Model/LeagueModel.php
          grep -q 'function saveshort' admin/src/Model/LeagueModel.php
          grep -q 'function saveshort' admin/src/Model/PositionModel.php
          grep -q 'function getTeamLogo' admin/src/Model/TeamModel.php
          grep -q 'function getTeam(' admin/src/Model/TeamModel.php
          grep -q 'function DeleteTrainigData' admin/src/Model/TeamModel.php
          grep -q 'function UpdateTrainigData' admin/src/Model/TeamModel.php
          grep -q 'function getTrainigData' admin/src/Model/TeamModel.php
          grep -q 'function addNewTrainigData' admin/src/Model/TeamModel.php
          grep -q 'function syncSeasons' admin/src/Model/TeamModel.php
          grep -q 'function saveshortpersons' admin/src/Model/SeasonModel.php
          grep -q 'function saveshortteams' admin/src/Model/SeasonModel.php
          grep -q 'function ensureSeasonPerson' admin/src/Model/SeasonModel.php
          grep -q 'function ensureProjectReferee' admin/src/Model/SeasonModel.php
          grep -q 'function applypersons' admin/src/Controller/SeasonsController.php
          grep -q 'function applyteams' admin/src/Controller/SeasonsController.php
          grep -q 'function divisiontoproject' admin/src/Model/DivisionModel.php
          grep -q 'function massadd' admin/src/Model/DivisionModel.php
          grep -q 'function count_teams_division' admin/src/Model/DivisionModel.php
          grep -q 'function prepareSportsManagementData' admin/src/Model/DivisionModel.php
          grep -q 'function divisiontoproject' admin/src/Controller/DivisionsController.php
          grep -q 'function massadd' admin/src/Controller/DivisionsController.php
          grep -q 'function getlogohistory' admin/src/Model/ClubModel.php
          grep -q 'function getuserextrafieldvalue' admin/src/Model/ClubModel.php
          grep -q 'function saveshort' admin/src/Model/ClubModel.php
          grep -q 'function teamsofclub' admin/src/Model/ClubModel.php
          grep -q 'function prepareSportsManagementData' admin/src/Model/ClubModel.php
          grep -q 'function afterSportsManagementSave' admin/src/Model/ClubModel.php
          grep -q 'function storeLogoHistory' admin/src/Model/ClubModel.php
          grep -q 'function getSportstype' admin/src/Model/SportstypeModel.php
          grep -q "setFieldAttribute('icon', 'type'" admin/src/Model/SportstypeModel.php
          grep -q 'function getAbout' site/src/Model/AboutModel.php
          grep -q 'sportsmanagementHelper::getVersion' site/src/Model/AboutModel.php

          test -f admin/forms/club.xml
          grep -q 'name="merge_teams"' admin/forms/club.xml
          grep -q 'name="logo_big"' admin/forms/club.xml
          grep -q 'name="clublogohistory"' admin/forms/club.xml

          test -f admin/forms/sportstype.xml
          grep -q 'name="sportsart"' admin/forms/sportstype.xml
          grep -q 'name="icon"' admin/forms/sportstype.xml

          test -f admin/forms/division.xml
          grep -q 'name="project_id"' admin/forms/division.xml
          grep -q 'name="parent_id"' admin/forms/division.xml

          test -f admin/forms/team.xml
          grep -q 'name="season_ids"' admin/forms/team.xml
          grep -q 'name="picture"' admin/forms/team.xml

          if grep -q 'models/forms' admin/src/Model/TeamModel.php admin/src/Model/ClubModel.php; then
            echo "Native form model regressed to the legacy form path" >&2
            exit 1
          fi

      - name: Validate explicit new-project content generation
        shell: bash
        run: |
          set -euo pipefail
          helper=modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
          test -f "$helper"
          grep -q 'function getData' "$helper"
          grep -q 'function createArticlesAjax' "$helper"
          grep -q "Session::checkToken('post')" "$helper"
          grep -q "bootComponent('com_content')" "$helper"
          if grep -A80 'function getData' "$helper" | grep -E 'insertObject|->save\('; then
            echo "New-project render data path performs content writes" >&2
            exit 1
          fi
