name: Joomla 5/6 legacy controller library batch 22

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/libraries/sportsmanagement/controller.php'
      - 'site/libraries/sportsmanagement/controller.php'
      - '.github/workflows/joomla5-6-legacy-controller-library-batch22.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/libraries/sportsmanagement/controller.php'
      - 'site/libraries/sportsmanagement/controller.php'
      - '.github/workflows/joomla5-6-legacy-controller-library-batch22.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate legacy controller compatibility shims
        shell: bash
        run: |
          set -euo pipefail

          php_files=(
            admin/libraries/sportsmanagement/controller.php
            site/libraries/sportsmanagement/controller.php
          )

          for file in "${php_files[@]}"; do
            test -f "$file"
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          if grep -En 'JFactory::|JRequest::|Factory::getApplication\(\)' "${php_files[@]}"; then
            echo 'Deprecated Joomla API found in legacy controller libraries.' >&2
            exit 1
          fi

          grep -Fq 'class JSMControllerAdmin extends SportsManagementAdminController' admin/libraries/sportsmanagement/controller.php
          grep -Fq 'class JSMControllerForm extends SportsManagementFormController' admin/libraries/sportsmanagement/controller.php
          grep -Fq "require_once JPATH_ADMINISTRATOR . '/components/com_sportsmanagement/src/Controller/SportsManagementAdminController.php';" admin/libraries/sportsmanagement/controller.php
          grep -Fq "require_once JPATH_ADMINISTRATOR . '/components/com_sportsmanagement/src/Controller/SportsManagementFormController.php';" admin/libraries/sportsmanagement/controller.php

          if grep -R -En 'extends[[:space:]]+JSMController(Admin|Form)' admin/controllers --include='*.php'; then
            echo 'Direct JSMController inheritance remains in admin/controllers.' >&2
            exit 1
          fi
