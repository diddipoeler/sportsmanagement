      - 'site/router.php'
      - 'site/helpers/imageselect.php'
      - 'site/helpers/pagination.php'
      - 'site/helpers/comments.php'
      - 'site/models/ajax.php'
      - 'site/models/about.php'
      - 'site/models/allleagues.php'
      - 'site/models/allpersons.php'
      - 'site/models/allplaygrounds.php'
      - 'site/models/allprojects.php'
      - 'site/models/allteams.php'
      - 'site/models/teams.php'
      - 'site/models/event.php'
      - 'site/models/person.php'
      - 'site/models/roster.php'
      - 'site/models/referee.php'
      - 'site/models/staff.php'
      - 'site/models/stats.php'
      - 'site/models/curve.php'
      - 'site/models/clubs.php'
      - 'site/models/matrix.php'
      - 'admin/sportsmanagement.php'
      - 'admin/helpers/Event.php'
      - 'admin/helpers/XMLParser.class.php'
      - 'admin/helpers/RRobin.class.php'
      - 'admin/models/ajax.php'
      - 'admin/models/agegroup.php'
      - 'admin/models/agegroups.php'
      - 'admin/models/cpanel.php'
      - 'admin/models/club.php'
      - 'admin/models/team.php'
      - 'admin/models/league.php'
      - 'admin/models/playground.php'
      - '.github/workflows/joomla5-6-legacy-entrypoints.yml'
  pull_request:
    branches: [master]
    paths:
      - 'site/sportsmanagement.php'
      - 'site/router.php'
      - 'site/helpers/imageselect.php'
      - 'site/helpers/pagination.php'
      - 'site/helpers/comments.php'
      - 'site/models/ajax.php'
      - 'site/models/about.php'
      - 'site/models/allleagues.php'
      - 'site/models/allpersons.php'
      - 'site/models/allplaygrounds.php'
      - 'site/models/allprojects.php'
      - 'site/models/allteams.php'
      - 'site/models/teams.php'
      - 'site/models/event.php'
      - 'site/models/person.php'
      - 'site/models/roster.php'
      - 'site/models/referee.php'
      - 'site/models/staff.php'
      - 'site/models/stats.php'
      - 'site/models/curve.php'
      - 'site/models/clubs.php'
      - 'site/models/matrix.php'
      - 'admin/sportsmanagement.php'
      - 'admin/helpers/Event.php'
      - 'admin/helpers/XMLParser.class.php'
      - 'admin/helpers/RRobin.class.php'
      - 'admin/models/ajax.php'
      - 'admin/models/agegroup.php'
      - 'admin/models/agegroups.php'
      - 'admin/models/cpanel.php'
      - 'admin/models/club.php'
      - 'admin/models/team.php'
      - 'admin/models/league.php'
      - 'admin/models/playground.php'
      - '.github/workflows/joomla5-6-legacy-entrypoints.yml'

jobs:
  legacy-entrypoints:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 entrypoints and legacy bridges
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/sportsmanagement.php
            site/router.php
            site/helpers/imageselect.php
            site/helpers/pagination.php
            site/helpers/comments.php
            site/models/ajax.php
            site/models/about.php
            site/models/allleagues.php
            site/models/allpersons.php
            site/models/allplaygrounds.php
            site/models/allprojects.php
            site/models/allteams.php
            site/models/teams.php
            site/models/event.php
            site/models/person.php
            site/models/roster.php
            site/models/referee.php
            site/models/staff.php
            site/models/stats.php
            site/models/curve.php
            site/models/clubs.php
            site/models/matrix.php
            admin/sportsmanagement.php
            admin/helpers/Event.php
            admin/helpers/XMLParser.class.php
            admin/helpers/RRobin.class.php
            admin/models/ajax.php
            admin/models/agegroup.php
            admin/models/agegroups.php
            admin/models/cpanel.php
            admin/models/club.php
            admin/models/team.php
            admin/models/league.php
            admin/models/playground.php
          )

          for file in "${files[@]}"; do
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/sportsmanagement.php
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/router.php
          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/sportsmanagement.php

          if grep -Fq 'Factory::getApplication()' site/sportsmanagement.php site/router.php admin/sportsmanagement.php; then
            echo 'Legacy component entrypoint/router regressed to Factory::getApplication()' >&2
            exit 1
          fi

          echo 'Joomla 5/6 legacy entrypoint and bridge contracts OK'
