name: Joomla 5/6 legacy entrypoints

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/sportsmanagement.php'
      - 'site/router.php'
      - 'site/helpers/**'
      - 'site/legacy/**'
      - 'site/controllers/**'
      - 'site/models/**'
      - 'admin/sportsmanagement.php'
      - 'admin/helpers/**'
      - 'admin/models/**'
      - '.github/workflows/joomla5-6-legacy-entrypoints.yml'
  pull_request:
    branches: [master]
    paths:
      - 'site/sportsmanagement.php'
      - 'site/router.php'
      - 'site/helpers/**'
      - 'site/legacy/**'
      - 'site/controllers/**'
      - 'site/models/**'
      - 'admin/sportsmanagement.php'
      - 'admin/helpers/**'
      - 'admin/models/**'
      - '.github/workflows/joomla5-6-legacy-entrypoints.yml'

jobs:
  legacy-entrypoints:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 entrypoints and legacy bridges
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/sportsmanagement.php
            site/router.php
            site/helpers/route.php
            site/helpers/imageselect.php
            site/helpers/pagination.php
            site/helpers/jsmpagination.php
            site/helpers/comments.php
            site/helpers/scoresheet.php
            site/helpers/predictionroute.php
            site/helpers/countries.php
            site/helpers/simpleGMapGeocoder.php
            site/legacy/matchreportplayer.php
            site/legacy/resultsmatch.php
            site/legacy/resultsround.php
            site/legacy/rosterplayer.php
            site/controllers/ajax.json.php
            site/controllers/allpersons.php
            site/controllers/editmatch.php
            site/controllers/editperson.php
            site/controllers/eventsranking.php
            site/controllers/imagehandler.php
            site/controllers/jlxmlexports.php
            site/controllers/predictiongame.php
            site/controllers/predictionranking.php
            site/controllers/predictionresults.php
            site/controllers/predictionuser.php
            site/controllers/results.php
            site/models/ajax.php
            site/models/about.php
            site/models/allclubs.php
            site/models/allleagues.php
            site/models/allpersons.php
            site/models/allplaygrounds.php
            site/models/allprojectrounds.php
            site/models/allprojects.php
            site/models/allteams.php
            site/models/clubinfo.php
            site/models/clubplan.php
            site/models/editclub.php
            site/models/editperson.php
            site/models/playground.php
            site/models/teams.php
            site/models/event.php
            site/models/person.php
            site/models/roster.php
            site/models/referee.php
            site/models/staff.php
            site/models/stats.php
            site/models/curve.php
            site/models/clubs.php
            site/models/matrix.php
            admin/sportsmanagement.php
            admin/helpers/Event.php
            admin/helpers/XMLParser.class.php
            admin/helpers/parser_php5.php
            admin/helpers/RRobin.class.php
            admin/helpers/TVarDumper.php
            admin/helpers/SofeeXmlParser.php
            admin/helpers/class.roundrobin.php
            admin/helpers/sepa_helper.php
            admin/helpers/SepaDirectDebit.php
            admin/helpers/transifex.php
            admin/helpers/ical.php
            admin/models/ajax.php
            admin/models/agegroup.php
            admin/models/agegroups.php
            admin/models/cpanel.php
            admin/models/club.php
            admin/models/clubname.php
            admin/models/clubnames.php
            admin/models/clubs.php
            admin/models/currentseasons.php
            admin/models/databasetool.php
            admin/models/databasetools.php
            admin/models/division.php
            admin/models/divisions.php
            admin/models/eventtype.php
            admin/models/eventtypes.php
            admin/models/extrafield.php
            admin/models/extrafields.php
            admin/models/github.php
            admin/models/githubinstall.php
            admin/models/imagehandler.php
            admin/models/imagelist.php
            admin/models/installhelper.php
            admin/models/matches.php
            admin/models/team.php
            admin/models/league.php
            admin/models/playground.php
            admin/models/project.php
            admin/models/round.php
            admin/models/season.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/sportsmanagement.php
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/router.php
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/helpers/route.php
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/helpers/jsmpagination.php
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/legacy/resultsmatch.php
          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/sportsmanagement.php
          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/helpers/transifex.php
          grep -Fq 'use Joomla\Filesystem\File;' admin/helpers/transifex.php
          grep -Fq 'use Joomla\Filesystem\Folder;' admin/helpers/transifex.php
          grep -Fq 'use Joomla\Filesystem\File;' site/helpers/simpleGMapGeocoder.php
          grep -Fq "require_once __DIR__ . '/scoresheet/fpdm.php';" site/helpers/scoresheet.php
          grep -Fq 'Uri::buildQuery($parts)' site/helpers/predictionroute.php
          grep -Fq 'public function __construct($xml = ' admin/helpers/parser_php5.php
          grep -Fq 'public function __construct($passed_teams = null)' admin/helpers/class.roundrobin.php
          grep -Fq 'public function roundrobin($passed_teams = null)' admin/helpers/class.roundrobin.php
          grep -Fq "preg_match('/([0-9]{4})" admin/helpers/ical.php
          grep -Fq "preg_split('/\\R/'" admin/helpers/ical.php
          grep -Fq 'public $cal = [];' admin/helpers/ical.php
          grep -Fq 'class_alias(AllprojectroundsModel::class' site/models/allprojectrounds.php
          grep -Fq 'class_alias(PlaygroundModel::class' site/models/playground.php
          grep -Fq 'class_alias(ProjectModel::class' admin/models/project.php
          grep -Fq 'class_alias(RoundModel::class' admin/models/round.php
          grep -Fq 'class_alias(SeasonModel::class' admin/models/season.php

          if grep -Fq 'Factory::getApplication()' \
            site/sportsmanagement.php \
            site/router.php \
            site/helpers/route.php \
            site/helpers/predictionroute.php \
            site/helpers/countries.php \
            site/legacy/resultsmatch.php \
            admin/sportsmanagement.php \
            admin/helpers/transifex.php; then
            echo 'Legacy component entrypoint/router/helper regressed to Factory::getApplication()' >&2
            exit 1
          fi

          if grep -Fq 'Factory::getApplication();' site/helpers/jsmpagination.php; then
            echo 'Pagination helper regressed to the static application accessor' >&2
            exit 1
          fi

          if grep -Fq 'jimport(' site/helpers/countries.php site/helpers/simpleGMapGeocoder.php; then
            echo 'Legacy site helper regressed to jimport()' >&2
            exit 1
          fi

          if grep -Fq 'use Joomla\\CMS\\Factory;' site/helpers/countries.php; then
            echo 'Country helper should not resolve an application when none is needed' >&2
            exit 1
          fi

          if grep -Fq 'Joomla\CMS\Filesystem\' admin/helpers/transifex.php site/helpers/simpleGMapGeocoder.php; then
            echo 'Legacy helper regressed to the removed CMS filesystem namespace' >&2
            exit 1
          fi

          if grep -Fq 'ereg(' admin/helpers/ical.php; then
            echo 'Legacy iCal parser regressed to PHP 8-incompatible ereg()' >&2
            exit 1
          fi

          if grep -Fq 'explode("[\n]"' admin/helpers/ical.php; then
            echo 'Legacy iCal parser regressed to the literal newline delimiter' >&2
            exit 1
          fi

          if grep -Fq 'require_once "scoresheet/' site/helpers/scoresheet.php; then
            echo 'Score sheet bridge regressed to working-directory relative includes' >&2
            exit 1
          fi

          echo 'Joomla 5/6 legacy entrypoint and bridge contracts OK'
