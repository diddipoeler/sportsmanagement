name: Joomla 5/6 migration lint

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint migrated PHP files
        shell: bash
        run: |
          find admin/src site/src admin/tmpl \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
