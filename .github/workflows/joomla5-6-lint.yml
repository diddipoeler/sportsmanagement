name: Joomla 5/6 migration lint

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  php-lint:
    name: PHP syntax and migration gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner PHP
        run: php -v

      - name: Lint migrated PHP files
        shell: bash
        run: |
          find admin/src admin/services site/src admin/tmpl \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate component manifest XML
        shell: bash
        run: |
          php -r '
            $xml = simplexml_load_file("sportsmanagement.xml");
            if ($xml === false) {
                fwrite(STDERR, "Invalid sportsmanagement.xml\n");
                exit(1);
            }
            if ((string) $xml->namespace !== "Diddipoeler\\Component\\SportsManagement") {
                fwrite(STDERR, "Unexpected component namespace\n");
                exit(1);
            }
            $adminFolders = array_map(
                static fn($folder) => (string) $folder,
                iterator_to_array($xml->administration->files->folder, false)
            );
            foreach (["src", "services", "tmpl", "forms"] as $required) {
                if (!in_array($required, $adminFolders, true)) {
                    fwrite(STDERR, "Missing administrator folder in manifest: {$required}\n");
                    exit(1);
                }
            }
          '

      - name: Validate native smoke routes
        shell: bash
        run: |
          for view in agegroups close clubs currentseasons divisions; do
            class="${view^}"
            test -f "admin/src/Model/${class}Model.php"
            test -f "admin/src/View/${class}/HtmlView.php"
            test -f "admin/tmpl/${view}/default.php"
          done

      - name: Validate fully native CRUD groups
        shell: bash
        run: |
          test -f admin/src/Model/SportsManagementAdminModel.php
          test -f admin/src/Model/SportsManagementListModel.php

          for entity in clubname eventtype extrafield season sportstype; do
            class="${entity^}"
            plural="${entity}s"
            plural_class="${plural^}"

            test -f "admin/src/Controller/${class}Controller.php"
            test -f "admin/src/Controller/${plural_class}Controller.php"
            test -f "admin/src/Model/${class}Model.php"
            test -f "admin/src/Model/${plural_class}Model.php"
            test -f "admin/src/Table/${class}Table.php"
            test -f "admin/src/View/${class}/HtmlView.php"
            test -f "admin/src/View/${plural_class}/HtmlView.php"
            test -f "admin/tmpl/${entity}/edit.php"
            test -f "admin/tmpl/${plural}/default.php"
            test -f "admin/forms/${entity}.xml"
            test -f "admin/forms/filter_${plural}.xml"
          done

          target_files=$(find admin/src/Controller admin/src/Model admin/src/View admin/src/Table \
            -type f \( \
              -name 'Clubname*.php' -o -name 'Clubnames*.php' \
              -o -name 'Eventtype*.php' -o -name 'Eventtypes*.php' \
              -o -name 'Extrafield*.php' -o -name 'Extrafields*.php' \
              -o -name 'Season*.php' -o -name 'Seasons*.php' \
              -o -name 'Sportstype*.php' -o -name 'Sportstypes*.php' \
            \))

          if grep -E "JSMModelAdmin|JSMModelList|LegacyBootstrap::boot|sportsmanagementView(Clubname|Clubnames|Eventtype|Eventtypes|Extrafield|Extrafields|Season|Seasons|Sportstype|Sportstypes)" $target_files; then
            echo "Fully native CRUD group contains a legacy MVC dependency" >&2
            exit 1
          fi

      - name: Validate native list and inline-update groups
        shell: bash
        run: |
          for entity in league playground position rosterposition team; do
            class="${entity^}"
            plural="${entity}s"
            plural_class="${plural^}"

            test -f "admin/src/Table/${class}Table.php"
            test -f "admin/src/Model/${class}Model.php"
            test -f "admin/src/Model/${plural_class}Model.php"
            test -f "admin/src/Controller/${plural_class}Controller.php"
            test -f "admin/src/View/${plural_class}/HtmlView.php"
            test -f "admin/tmpl/${plural}/default.php"
            test -f "admin/forms/filter_${plural}.xml"
          done

          partial_files=$(find admin/src/Controller admin/src/Model admin/src/View admin/src/Table \
            -type f \( \
              -name 'League*.php' -o -name 'Leagues*.php' \
              -o -name 'Playground*.php' -o -name 'Playgrounds*.php' \
              -o -name 'Position*.php' -o -name 'Positions*.php' \
              -o -name 'Rosterposition*.php' -o -name 'Rosterpositions*.php' \
              -o -name 'Team*.php' -o -name 'Teams*.php' \
            \))

          if grep -E "JSMModelAdmin|JSMModelList|LegacyBootstrap::boot|sportsmanagementView(Leagues|Playgrounds|Positions|Rosterpositions|Teams)" $partial_files; then
            echo "Native list/inline-update group contains a legacy MVC dependency" >&2
            exit 1
          fi

          for task in leagues.saveshort positions.saveshort rosterpositions.addhome rosterpositions.addaway teams.saveshort teams.copysave; do
            grep -q "'${task}'" admin/src/Dispatcher/Dispatcher.php
          done

          grep -q "LEGACY_DEFAULT_VIEWS" admin/src/Dispatcher/Dispatcher.php
          for view in league playground position rosterposition team; do
            grep -q "'${view}'" admin/src/Dispatcher/Dispatcher.php
          done

      - name: Validate native administrator fields and forms
        shell: bash
        run: |
          for field in SportsManagementList Country Sportstype Agegroup Association Federation Leaguelevel; do
            test -f "admin/src/Field/${field}Field.php" || test -f "admin/src/Field/${field}.php"
          done

          php -r '
            foreach ([
              "clubname", "eventtype", "extrafield", "season", "sportstype",
              "filter_clubnames", "filter_eventtypes", "filter_extrafields",
              "filter_leagues", "filter_playgrounds", "filter_positions",
              "filter_rosterpositions", "filter_seasons", "filter_sportstypes", "filter_teams"
            ] as $form) {
                if (simplexml_load_file("admin/forms/{$form}.xml") === false) {
                    fwrite(STDERR, "Invalid administrator form: {$form}.xml\n");
                    exit(1);
                }
            }
          '

          grep -q "components/com_sportsmanagement/forms" admin/src/Model/SportsManagementListModel.php

          if grep -E "'saveshortpersons'|'saveshortteams'|'import'|'export'" admin/src/Dispatcher/Dispatcher.php; then
            echo "Special legacy tasks leaked into the standard CRUD allowlist" >&2
            exit 1
          fi

      - name: Validate legacy view fallback inventory
        shell: bash
        run: |
          php <<'PHP'
          <?php
          $expected = [
              'admin' => ['html' => 111],
              'site' => ['html' => 69, 'raw' => 4, 'pdf' => 1],
          ];

          foreach ($expected as $area => $formats) {
              foreach ($formats as $format => $expectedCount) {
                  $files = glob($area . '/views/*/view.' . $format . '.php');
                  $count = count($files);

                  if ($count !== $expectedCount) {
                      fwrite(STDERR, "Unexpected {$area} {$format} view count: {$count}; expected {$expectedCount}\n");
                      exit(1);
                  }

                  foreach ($files as $file) {
                      $view = basename(dirname($file));
                      $source = file_get_contents($file);
                      $pattern = '/class\\s+sportsmanagementView' . preg_quote($view, '/') . '\\s+extends/i';

                      if (!preg_match($pattern, $source)) {
                          fwrite(STDERR, "Unexpected legacy view class: {$file}\n");
                          exit(1);
                      }
                  }
              }
          }

          foreach (["admin", "site"] as $area) {
              foreach (glob($area . "/views/*/view.html.php") as $file) {
                  $view = basename(dirname($file));
                  $model = $area . "/models/" . $view . ".php";
                  if (!is_file($model)) {
                      continue;
                  }
                  $modelSource = file_get_contents($model);
                  $modelPattern = '/class\\s+sportsmanagementModel' . preg_quote($view, '/') . '\\s+extends/i';
                  if (!preg_match($modelPattern, $modelSource)) {
                      fwrite(STDERR, "Unexpected legacy model class: {$model}\n");
                      exit(1);
                  }
              }
          }
          PHP

          test -f admin/src/Service/SportsManagementMVCFactory.php
          test -f admin/src/Legacy/LegacyBootstrap.php
          test -f site/src/Legacy/LegacyBootstrap.php

  package:
    name: Development install package
    runs-on: ubuntu-24.04
    needs: php-lint
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build component ZIP
        shell: bash
        run: |
          mkdir -p build/package
          rsync -a ./ build/package/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'docs/'
          cd build/package
          zip -qr ../sportsmanagement-joomla5-6-dev.zip .

      - name: Upload component ZIP
        uses: actions/upload-artifact@v4
        with:
          name: sportsmanagement-joomla5-6-dev
          path: build/sportsmanagement-joomla5-6-dev.zip
          if-no-files-found: error
          retention-days: 14
