name: Joomla 5/6 list bases public lists and module gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  migration-contracts:
    name: Admin bases, public lists and module checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 migration contracts
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/PlaygroundModel.php
            admin/src/Model/PositionModel.php
            admin/src/Model/SportsManagementAdminModel.php
            admin/src/Model/SportsManagementListModel.php
            admin/src/Model/SportstypeModel.php
            site/src/Model/AllleaguesModel.php
            site/src/Model/AllpersonsModel.php
            site/src/Model/AllplaygroundsModel.php
            site/src/Model/AllprojectsModel.php
            site/src/Model/AllteamsModel.php
            site/src/Model/ClubHistoryViewDataModel.php
            site/src/Model/ClubinfoViewDataModel.php
            modules/mod_sportsmanagement_matchesslider/helper.php
            modules/mod_sportsmanagement_matchesslider/mod_sportsmanagement_matchesslider.php
            modules/mod_sportsmanagement_matchesslider/connectors/sportsmanagement.php
            modules/mod_sportsmanagement_matchesslider/services/provider.php
            modules/mod_sportsmanagement_matchesslider/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
            modules/mod_sportsmanagement_matchesslider/tmpl/default.php
            modules/mod_sportsmanagement_playground_ticker/helper.php
            modules/mod_sportsmanagement_playground_ticker/mod_sportsmanagement_playground_ticker.php
            modules/mod_sportsmanagement_playground_ticker/services/provider.php
            modules/mod_sportsmanagement_playground_ticker/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_playground_ticker/src/Helper/PlaygroundTickerHelper.php
            modules/mod_sportsmanagement_playground_ticker/tmpl/default.php
            modules/mod_sportsmanagement_playgroundplan/helper.php
            modules/mod_sportsmanagement_playgroundplan/mod_sportsmanagement_playgroundplan.php
            modules/mod_sportsmanagement_playgroundplan/services/provider.php
            modules/mod_sportsmanagement_playgroundplan/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
            modules/mod_sportsmanagement_playgroundplan/tmpl/default.php
            modules/mod_sportsmanagement_randomplayer/helper.php
            modules/mod_sportsmanagement_randomplayer/mod_sportsmanagement_randomplayer.php
            modules/mod_sportsmanagement_randomplayer/services/provider.php
            modules/mod_sportsmanagement_randomplayer/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php
            modules/mod_sportsmanagement_randomplayer/tmpl/default.php
            modules/mod_sportsmanagement_randomplayer/tmpl/native.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          grep -Fq 'abstract class SportsManagementAdminModel extends AdminModel' admin/src/Model/SportsManagementAdminModel.php
          grep -Fq 'abstract class SportsManagementListModel extends ListModel' admin/src/Model/SportsManagementListModel.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' admin/src/Model/PlaygroundModel.php
          ! grep -Fq '$app->getContainer()' admin/src/Model/PlaygroundModel.php

          for model in site/src/Model/AllleaguesModel.php site/src/Model/AllpersonsModel.php site/src/Model/AllplaygroundsModel.php site/src/Model/AllprojectsModel.php site/src/Model/AllteamsModel.php; do
            grep -Fq 'extends SportsManagementListModel' "$model"
            grep -Fq '$this->siteApplication()->getInput()' "$model"
            grep -Fq '$this->getDatabase()' "$model"
          done

          slider_helper=modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
          playground_dispatcher=modules/mod_sportsmanagement_playground_ticker/src/Dispatcher/Dispatcher.php
          plan_helper=modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
          plan_legacy=modules/mod_sportsmanagement_playgroundplan/helper.php
          random_dispatcher=modules/mod_sportsmanagement_randomplayer/src/Dispatcher/Dispatcher.php
          random_legacy=modules/mod_sportsmanagement_randomplayer/helper.php

          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$slider_helper"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$playground_dispatcher"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$plan_helper"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$plan_legacy"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$random_dispatcher"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$random_legacy"

          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$slider_helper"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' modules/mod_sportsmanagement_playground_ticker/src/Helper/PlaygroundTickerHelper.php
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$plan_helper"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php
          grep -Fq 'SiteRouteHelper::view(' "$slider_helper"
          grep -Fq 'SiteRouteHelper::view(' "$plan_helper"
          grep -Fq 'SiteRouteHelper::view(' modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php

          if grep -E -- '\$app->getContainer\(|->getApplication\(\)->getContainer\(|->siteApplication\(\)->getContainer\(|->administratorApplication\(\)->getContainer\(' "${files[@]}"; then
            echo 'Module/list block calls protected CMSApplication::getContainer().' >&2
            exit 1
          fi

          if grep -E -- 'sportsmanagementHelperRoute::|Factory::getDbo\(|Factory::getDBO\(|JFactory::|JRequest::|JLoader::|jimport\(' "${files[@]}"; then
            echo 'Module/list block regressed to a legacy Joomla runtime API' >&2
            exit 1
          fi

          echo 'Joomla 5/6 list bases, public lists and module contracts OK'
