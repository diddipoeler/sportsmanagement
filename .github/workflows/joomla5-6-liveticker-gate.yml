name: Joomla 5/6 Liveticker Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate read-only native liveticker
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_liveticker
          manifest="$module/mod_sportsmanagement_liveticker.xml"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/LivetickerHelper.php"
          entry="$module/mod_sportsmanagement_liveticker.php"
          template="$module/tmpl/default.php"
          runtime="$module/js/turtushout.js"

          test -f "$module/services/provider.php"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$entry"
          test -f "$module/helper.php"
          test -f "$template"
          test -f "$runtime"

          php -l "$module/services/provider.php"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$entry"
          php -l "$module/helper.php"
          php -l "$template"
          node --check "$runtime"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_liveticker/mod_sportsmanagement_liveticker.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementLiveticker</namespace>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'name="playtime"' "$manifest"
          grep -Fq 'type="number"' "$manifest"
          grep -Fq 'name="display_num"' "$manifest"
          grep -Fq 'name="update_timeout"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"
          ! grep -Fq 'table-condensed' "$manifest"
          ! grep -E 'allow_unregistered|use_secret_salt|secret_salt|add_timeout|display_username|display_guests|display_welcome|name="(size|cols|rows)"' "$manifest"

          grep -Fq 'public function refreshAjax(): string' "$helper"
          grep -Fq 'ModuleHelper::getModuleById' "$helper"
          grep -Fq 'SportsManagementDatabaseResolver::resolve($joomlaDatabase, $selector)' "$helper"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$helper"
          grep -Fq "match_id') . ' IN ('" "$helper"
          grep -Fq "event_time') . ' DESC'" "$helper"
          ! grep -E 'getDBConnection\(|sportsmanagementHelper|ensureSportsManagementHelper|turtushout_(shout|del|token|shouts)|issueRequestToken|isValidRequestToken|function shout\(|function delete\(' "$helper"

          grep -Fq 'option=com_ajax&module=sportsmanagement_liveticker&method=refresh&format=raw' "$template"
          grep -Fq 'data-refresh-url=' "$template"
          grep -Fq 'data-module-id=' "$template"
          grep -Fq "['version' => 'auto']" "$template"
          ! grep -E '\$isAjax|\$ajaxReturn|app->close\(|turtushout-form|type="submit"' "$template"

          grep -Fq "url.searchParams.set('module_id'" "$runtime"
          grep -Fq 'fetch(url.toString()' "$runtime"
          grep -Fq 'new AbortController()' "$runtime"
          grep -Fq 'document.hidden' "$runtime"
          ! grep -E "searchParams\.set\('action'|turtushout_(shout|del|token|shouts)|X-Requested-With|FormData\(|window\.location\.href.*action" "$runtime"

          ! grep -E 'LivetickerHelper|ModuleHelper|getData\(|getWebAssetManager|registerAndUseScript' "$entry"

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$dispatcher" \
            "$helper" \
            "$entry" \
            "$module/helper.php"; then
            echo 'Liveticker regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi
