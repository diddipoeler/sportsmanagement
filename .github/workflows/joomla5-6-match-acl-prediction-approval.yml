name: Joomla 5/6 direct match ACL and scoped prediction approvals
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/EditmatchController.php'
      - 'admin/src/Model/PredictionmemberModel.php'
      - '.github/tests/joomla56_direct_match_acl.php'
      - '.github/tests/joomla56_prediction_approval_mail.php'
      - '.github/workflows/joomla5-6-match-acl-prediction-approval.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: |
          php -l site/src/Controller/EditmatchController.php
          php -l admin/src/Model/PredictionmemberModel.php
          php -l .github/tests/joomla56_direct_match_acl.php
          php -l .github/tests/joomla56_prediction_approval_mail.php
      - name: Deny unauthorized match writes
        run: php .github/tests/joomla56_direct_match_acl.php
      - name: Approve only editable prediction members
        run: php .github/tests/joomla56_prediction_approval_mail.php
