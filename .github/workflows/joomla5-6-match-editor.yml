name: Joomla 5/6 match base editor gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  match-editor:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native match base editor
        shell: bash
        run: |
          set -euo pipefail

          php_files=(
            admin/src/Dispatcher/Dispatcher.php
            admin/src/Controller/MatchController.php
            admin/src/Controller/SportsManagementFormController.php
            admin/src/Model/MatchModel.php
            admin/src/Table/MatchTable.php
            admin/src/View/Match/HtmlView.php
            admin/src/Helper/ExtendedFormHelper.php
            admin/tmpl/match/edit.php
            admin/views/match/tmpl/edit.php
          )

          for file in "${php_files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq 'namespace Diddipoeler\Component\SportsManagement\Administrator\View\Match;' admin/src/View/Match/HtmlView.php
          grep -Fq 'class HtmlView extends BaseHtmlView' admin/src/View/Match/HtmlView.php
          grep -Fq 'final class MatchModel extends SportsManagementAdminModel' admin/src/Model/MatchModel.php
          grep -Fq 'final class MatchController extends SportsManagementFormController' admin/src/Controller/MatchController.php
          grep -Fq 'new MatchTable($this->getDatabase())' admin/src/Model/MatchModel.php
          grep -Fq 'getMatchData(int $matchId)' admin/src/Model/MatchModel.php
          grep -Fq 'getMatchRelationsOptions(int $projectId' admin/src/Model/MatchModel.php
          grep -Fq 'getProjectRoundCodes(int $projectId)' admin/src/Model/MatchModel.php
          grep -Fq 'getRoundMatches(int $roundId)' admin/src/Model/MatchModel.php
          grep -Fq '#__sportsmanagement_match_commentary' admin/src/Model/MatchModel.php
          grep -Fq '#__sportsmanagement_match_single' admin/src/Model/MatchModel.php

          grep -Fq "'league', 'match', 'player'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'match.edit', 'match.apply', 'match.save', 'match.cancel', 'match.cancelmodal'" admin/src/Dispatcher/Dispatcher.php
          grep -Fq "'match.addmatch', 'match.copyfrom', 'match.remove', 'match.picture', 'match.insertgooglecalendar'" admin/src/Dispatcher/Dispatcher.php

          if grep -Fq "SAFE_STANDARD_CRUD_CONTROLLERS = ['club', 'clubname', 'clubnames', 'league', 'match'" admin/src/Dispatcher/Dispatcher.php; then
            echo 'Generic match.add must not be enabled before native new-match context fields exist.' >&2
            exit 1
          fi

          if grep -Fq "\$view === 'match'" admin/src/Dispatcher/Dispatcher.php; then
            echo 'Special match layouts must remain on the staged legacy display path for now.' >&2
            exit 1
          fi

          if grep -Eq 'sportsmanagementControllermatch|controllers/match\.php|Factory::getUser\(' admin/src/Controller/MatchController.php; then
            echo 'Native match controller regressed to the legacy controller or removed user API.' >&2
            exit 1
          fi

          if grep -Eq 'BaseDatabaseModel::getInstance|sportsmanagementHelper::|Factory::getUser\(' admin/src/View/Match/HtmlView.php admin/src/Model/MatchModel.php admin/tmpl/match/edit.php; then
            echo 'Native match base editor regressed to legacy model/helper APIs.' >&2
            exit 1
          fi

          grep -Fq 'data-bs-toggle="tab"' admin/tmpl/match/edit.php
          grep -Fq "Joomla.submitform('match.apply'" admin/tmpl/match/edit.php
          grep -Fq 'jform[old_match_id]' admin/tmpl/match/edit.php
          grep -Fq 'jform[new_match_id]' admin/tmpl/match/edit.php
          grep -Fq "require JPATH_ADMINISTRATOR . '/components/com_sportsmanagement/tmpl/match/edit.php';" admin/views/match/tmpl/edit.php

          if grep -Eqi 'jquery|formbehavior2\.select2|formbehavior\.chosen' admin/tmpl/match/edit.php admin/src/View/Match/HtmlView.php; then
            echo 'Native match base editor regressed to jQuery/legacy select widgets.' >&2
            exit 1
          fi

          xml_files=(
            admin/forms/match.xml
            admin/models/forms/match.xml
            admin/assets/extended/match.xml
          )

          php -r '$files=array_slice($argv,1); foreach ($files as $file) { if (simplexml_load_file($file) === false) { fwrite(STDERR, "Invalid XML: $file\n"); exit(1); } }' "${xml_files[@]}"

          if grep -Fq 'addfieldpath=' admin/forms/match.xml admin/models/forms/match.xml || grep -Fq 'addrulepath=' admin/forms/match.xml admin/models/forms/match.xml; then
            echo 'Match form regressed to legacy field/rule paths.' >&2
            exit 1
          fi

          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' admin/forms/match.xml
          grep -Fq 'filter="safehtml"' admin/forms/match.xml
          grep -Fq 'type="playgroundlist"' admin/forms/match.xml
          grep -Fq 'type="extensionradiobutton"' admin/forms/match.xml
          grep -Fq 'name="team1_legs"' admin/forms/match.xml
          grep -Fq 'name="match_result_detail"' admin/forms/match.xml
          cmp -s admin/forms/match.xml admin/models/forms/match.xml

          # Staged migration invariant: specialised layouts still use the legacy model/view
          # until they are ported individually.
          test -f admin/models/match.php
          test -f admin/views/match/view.html.php
          grep -Fq 'class sportsmanagementModelMatch extends JSMModelAdmin' admin/models/match.php
          grep -Fq 'class sportsmanagementViewMatch extends sportsmanagementView' admin/views/match/view.html.php
