name: Joomla 5/6 match view data and module gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  migration-contracts:
    name: Match models, view data and module checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 migration contracts
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/MatcheventModel.php
            admin/src/Model/MatchplayerModel.php
            admin/src/Model/MatchrefereeModel.php
            admin/src/Model/MatchstaffModel.php
            admin/src/Model/PlaygroundsModel.php
            admin/src/Model/PositionsModel.php
            site/src/Model/ClubplanViewDataModel.php
            site/src/Model/MatchreportMatchDataModel.php
            site/src/Model/PlayerMatchDataModel.php
            modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.php
            modules/mod_sportsmanagement_club_birthday/helper.php
            modules/mod_sportsmanagement_club_birthday/services/provider.php
            modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
            modules/mod_sportsmanagement_club_birthday/tmpl/default.php
            modules/mod_sportsmanagement_club_birthday/tmpl/default_carousel.php
            modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_count_rekord/services/provider.php
            modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
            modules/mod_sportsmanagement_count_rekord/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          for file in admin/src/Model/MatcheventModel.php admin/src/Model/MatchplayerModel.php admin/src/Model/MatchrefereeModel.php admin/src/Model/MatchstaffModel.php; do
            grep -Fq 'extends SportsManagementAdminModel' "$file"
            grep -Fq '$this->administratorApplication()->getIdentity()' "$file"
            grep -Fq '$this->getDatabase()' "$file"
          done

          for file in admin/src/Model/PlaygroundsModel.php admin/src/Model/PositionsModel.php; do
            grep -Fq 'extends SportsManagementListModel' "$file"
            grep -Fq '$this->getDatabase()' "$file"
          done

          for file in site/src/Model/ClubplanViewDataModel.php site/src/Model/MatchreportMatchDataModel.php site/src/Model/PlayerMatchDataModel.php; do
            grep -Fq 'extends SportsManagementProjectModel' "$file"
            grep -Fq '$this->getDatabase()' "$file"
          done

          club_bridge=modules/mod_sportsmanagement_club_birthday/helper.php
          club_dispatcher=modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php
          club_helper=modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$club_bridge"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$club_bridge"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$club_dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$club_helper"
          grep -Fq 'SiteRouteHelper::view(' "$club_helper"
          ! grep -Fq '$app->getContainer()' "$club_bridge"
          ! grep -Fq '$app->getContainer()' "$club_dispatcher"

          count_bridge=modules/mod_sportsmanagement_count_rekord/helper.php
          count_dispatcher=modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
          count_helper=modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$count_bridge"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$count_bridge"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$count_dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$count_helper"
          ! grep -Fq '$app->getContainer()' "$count_bridge"
          ! grep -Fq '->getApplication()->getContainer()' "$count_dispatcher"

          module_files=(
            modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.php
            modules/mod_sportsmanagement_club_birthday/helper.php
            modules/mod_sportsmanagement_club_birthday/services/provider.php
            modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
            modules/mod_sportsmanagement_club_birthday/tmpl/default.php
            modules/mod_sportsmanagement_club_birthday/tmpl/default_carousel.php
            modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_count_rekord/services/provider.php
            modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
            modules/mod_sportsmanagement_count_rekord/tmpl/default.php
          )

          if grep -E -- 'JFactory::|JRequest::|JLoader::|jimport\(|Factory::getApplication\(|Factory::getDbo\(|Factory::getDBO\(|\$app->getContainer\(|->getApplication\(\)->getContainer\(' "${module_files[@]}"; then
            echo 'Module runtime regressed to a legacy or protected Joomla API' >&2
            exit 1
          fi

          echo 'Joomla 5/6 match view data and module contracts OK'
