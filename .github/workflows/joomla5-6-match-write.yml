name: Joomla 5/6 match writes

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  match-write:
    name: Transactional match write services gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared match write services
        shell: bash
        run: |
          set -euo pipefail
          service=admin/src/Service/MatchWriteService.php
          timeline=admin/src/Service/MatchTimelineWriteService.php
          notifier=admin/src/Service/MatchRefereeNotificationService.php
          site_bridge=site/src/Service/MatchWriteService.php
          model=site/src/Model/EditmatchModel.php

          for file in "$service" "$timeline" "$notifier" "$site_bridge" "$model"; do
            php -l "$file"
          done

          grep -q 'final class MatchWriteService' "$service"
          grep -q 'saveStatistics' "$service"
          grep -q 'updateRoster' "$service"
          grep -q 'updateStaff' "$service"
          grep -q 'updateReferees' "$service"
          grep -q 'transactionStart' "$service"
          grep -q 'transactionRollback' "$service"
          grep -q 'st.season_id.*sp.season_id' "$service"

          grep -q 'final class MatchTimelineWriteService' "$timeline"
          grep -q 'saveSubstitution' "$timeline"
          grep -q 'removeSubstitution' "$timeline"
          grep -q 'deleteEvent' "$timeline"
          grep -q 'deleteCommentary' "$timeline"
          grep -q 'saveComment' "$timeline"
          grep -q 'saveEvent' "$timeline"
          grep -q '#__sportsmanagement_match_event' "$timeline"
          grep -q '#__sportsmanagement_match_commentary' "$timeline"
          grep -q '#__sportsmanagement_match_statistic' "$timeline"
          grep -q 'transactionStart' "$timeline"

          grep -q 'final class MatchRefereeNotificationService' "$notifier"
          grep -q 'MailerFactoryInterface' "$notifier"
          grep -q 'createMailer' "$notifier"

          grep -q 'class_alias(AdministratorMatchWriteService::class' "$site_bridge"
          grep -q 'new MatchWriteService' "$model"

          active=("$service" "$timeline" "$notifier" "$site_bridge")
          if grep -E -- 'Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|Factory::getMailer\(|Factory::getConfig\(|Table::getInstance\(|BaseDatabaseModel::getInstance|JLoader::import\(|jimport\(|ereg\(|->disconnect\(' "${active[@]}"; then
            echo 'Native match write service path contains a removed/deprecated Joomla or PHP API' >&2
            exit 1
          fi
