name: Joomla 5/6 Matches Gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_matches/**'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - 'site/src/Service/MatchReadService.php'
      - '.github/workflows/joomla5-6-matches-gate.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_matches/**'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - 'site/src/Service/MatchReadService.php'
      - '.github/workflows/joomla5-6-matches-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate native matches module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_matches
          manifest="$module/mod_sportsmanagement_matches.xml"
          provider="$module/services/provider.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/MatchesHelper.php"
          query_trait="$module/connectors/native/QueryTrait.php"
          format_trait="$module/connectors/native/FormatTrait.php"
          link_trait="$module/connectors/native/LinkTrait.php"
          entry="$module/mod_sportsmanagement_matches.php"
          bridge="$module/helper.php"
          default_layout="$module/tmpl/default.php"
          native_layout="$module/tmpl/native.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php
          match_service=site/src/Service/MatchReadService.php

          for file in "$provider" "$dispatcher" "$helper" "$query_trait" "$format_trait" "$link_trait" "$entry" "$bridge" "$default_layout" "$native_layout" "$resolver" "$match_service"; do
            test -f "$file"
            php -l "$file"
          done

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_matches/mod_sportsmanagement_matches.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementMatches</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_matches">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'type="matchestemplatelist"' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'HelperFactory' "$provider"
          grep -Fq "getHelper('MatchesHelper')" "$dispatcher"
          grep -Fq 'registerAndUseStyle' "$dispatcher"
          grep -Fq "require __DIR__ . '/native.php';" "$default_layout"

          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$query_trait"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$query_trait"
          ! grep -Fq 'getDBConnection(' "$query_trait"
          ! grep -Fq 'sportsmanagementHelper' "$query_trait"
          ! grep -Fq 'administrator/components/com_sportsmanagement/helpers/sportsmanagement.php' "$query_trait"

          grep -Fq 'MatchReadService' "$format_trait"
          grep -Fq 'neighborLinks' "$link_trait"
          grep -Fq 'class_alias(MatchesHelper::class' "$bridge"

          grep -Fq 'boots this module through services/provider.php' "$entry"
          ! grep -Fq 'MatchesHelper' "$entry"
          ! grep -Fq 'ModuleHelper' "$entry"
          ! grep -Fq 'getData(' "$entry"
          ! grep -Fq 'getWebAssetManager' "$entry"

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|sportsmanagementHelper::getDBConnection|getDBConnection\(|->disconnect\(' \
            "$provider" "$dispatcher" "$helper" "$query_trait" "$format_trait" "$link_trait" "$entry" "$bridge" "$default_layout" "$native_layout"; then
            echo 'Active matches module path regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi
