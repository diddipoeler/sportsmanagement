name: Joomla 5/6 Matches Slider Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate native matches slider module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_matchesslider
          manifest="$module/mod_sportsmanagement_matchesslider.xml"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/MatchesSliderHelper.php"
          entry="$module/mod_sportsmanagement_matchesslider.php"
          template="$module/tmpl/default.php"
          runtime="$module/assets/js/matchesslider.js"
          stylesheet="$module/assets/css/mod_sportsmanagement_matchesslider.css"

          test -f "$module/services/provider.php"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$entry"
          test -f "$template"
          test -f "$runtime"
          test -f "$stylesheet"
          test ! -f "$module/assets/js/jquery.simplyscroll.js"

          php -l "$module/services/provider.php"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$entry"
          php -l "$module/helper.php"
          php -l "$template"
          node --check "$runtime"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_matchesslider/mod_sportsmanagement_matchesslider.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementMatchesSlider</namespace>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'name="xsize" type="number" min="1" default="50"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"
          ! grep -Fq 'table-condensed' "$manifest"

          grep -Fq 'assets/js/matchesslider.js' "$dispatcher"
          grep -Fq "['version' => 'auto']" "$dispatcher"
          ! grep -Fq "useScript('jquery')" "$dispatcher"
          ! grep -Fqi 'simplyscroll' "$dispatcher"

          grep -Fq 'data-jsm-matchesslider' "$template"
          grep -Fq 'data-jsm-matchesslider-track' "$template"
          grep -Fq 'data-scroll-direction=' "$template"
          grep -Fq "params->get('moduleclass_sfx'" "$template"
          grep -Fq 'loading="lazy"' "$template"
          ! grep -E '<script|jQuery|\$\(|simplyScroll' "$template"

          grep -Fq "prefers-reduced-motion: reduce" "$runtime"
          grep -Fq 'window.requestAnimationFrame' "$runtime"
          grep -Fq 'cloneNode(true)' "$runtime"
          grep -Fq "clone.setAttribute('aria-hidden', 'true')" "$runtime"
          grep -Fq "clone.setAttribute('tabindex', '-1')" "$runtime" || grep -Fq "element.setAttribute('tabindex', '-1')" "$runtime"
          grep -Fq 'clones.forEach((clone) => clone.remove())' "$runtime"
          ! grep -E 'jQuery|\$\(|simplyScroll' "$runtime"

          ! grep -E 'simply-scroll|jquery' "$stylesheet"

          ! grep -E 'MatchesSliderHelper|ModuleHelper|getData\(|getWebAssetManager|registerAndUseScript|simplyScroll|jquery' "$entry"

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$dispatcher" \
            "$helper" \
            "$entry" \
            "$module/helper.php"; then
            echo 'Matches slider regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi
