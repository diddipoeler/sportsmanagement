name: Joomla 5/6 models batch 243

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/NextmatchViewDataModel.php'
      - 'admin/src/Model/DatabasetoolModel.php'
      - 'admin/src/Model/ImagehandlerModel.php'
      - 'admin/src/Model/RoundsModel.php'
      - 'admin/src/Model/TemplateModel.php'
      - 'admin/src/Model/TemplatesModel.php'
      - '.github/workflows/joomla5-6-models-batch243.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/NextmatchViewDataModel.php'
      - 'admin/src/Model/DatabasetoolModel.php'
      - 'admin/src/Model/ImagehandlerModel.php'
      - 'admin/src/Model/RoundsModel.php'
      - 'admin/src/Model/TemplateModel.php'
      - 'admin/src/Model/TemplatesModel.php'
      - '.github/workflows/joomla5-6-models-batch243.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Model/NextmatchViewDataModel.php
            admin/src/Model/DatabasetoolModel.php
            admin/src/Model/ImagehandlerModel.php
            admin/src/Model/RoundsModel.php
            admin/src/Model/TemplateModel.php
            admin/src/Model/TemplatesModel.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 model contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/DatabasetoolModel.php
            admin/src/Model/ImagehandlerModel.php
            admin/src/Model/RoundsModel.php
            admin/src/Model/TemplateModel.php
            admin/src/Model/TemplatesModel.php
          )
          for file in "${files[@]}"; do
            grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' "$file"
            ! grep -Fq -- 'Factory::getApplication()' "$file"
          done
          echo 'Joomla 5/6 batch 243 model contracts OK.'
