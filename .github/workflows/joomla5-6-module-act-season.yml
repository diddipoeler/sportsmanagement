name: Joomla 5/6 Active Season module

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'modules/mod_sportsmanagement_act_season/**'
      - '.github/workflows/joomla5-6-module-act-season.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'modules/mod_sportsmanagement_act_season/**'
      - '.github/workflows/joomla5-6-module-act-season.yml'

jobs:
  act-season-module:
    name: Native Active Season module checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native module stack
        shell: bash
        run: |
          set -euo pipefail

          files=(
            modules/mod_sportsmanagement_act_season/services/provider.php
            modules/mod_sportsmanagement_act_season/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php
            modules/mod_sportsmanagement_act_season/helper.php
            modules/mod_sportsmanagement_act_season/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate module manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('modules/mod_sportsmanagement_act_season/mod_sportsmanagement_act_season.xml')
          root = ET.parse(path).getroot()
          namespace = root.find('namespace')
          if namespace is None or (namespace.text or '').strip() != r'Diddipoeler\Module\SportsManagementActSeason':
              raise SystemExit('Active Season namespace is not native')

          folders = [(node.text or '').strip() for node in root.findall('./files/folder')]
          if 'services' not in folders or 'src' not in folders or 'tmpl' not in folders:
              raise SystemExit('Active Season native module folders are not installed')

          print('Active Season manifest contract OK')
          PY

      - name: Enforce native application and database access
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          dispatcher = Path('modules/mod_sportsmanagement_act_season/src/Dispatcher/Dispatcher.php').read_text(encoding='utf-8')
          helper = Path('modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php').read_text(encoding='utf-8')
          facade = Path('modules/mod_sportsmanagement_act_season/helper.php').read_text(encoding='utf-8')

          expected = {
              'dispatcher application': (dispatcher, '$app = $this->getApplication();'),
              'false-compatible signature': (dispatcher, 'getLayoutData(): array|false'),
              'false render guard': (dispatcher, 'if ($data === false)'),
              'dispatcher public database container': (dispatcher, 'Factory::getContainer()->get(DatabaseInterface::class)'),
              'database resolver': (helper, 'SportsManagementDatabaseResolver::resolve'),
              'facade application': (facade, '$app = Factory::getApplication();'),
              'facade public database container': (facade, 'Factory::getContainer()->get(DatabaseInterface::class)'),
          }
          for name, (text, needle) in expected.items():
              if needle not in text:
                  raise SystemExit(f'{name} contract missing: {needle}')

          forbidden = (
              'Factory::getDbo(',
              'Factory::getDBO(',
              '$app->getContainer(',
              '$app->input',
              'getVar(',
              'JFactory::',
              'BaseDatabaseModel::getInstance(',
              'JLoader::import(',
              'jimport(',
              'JError::',
              'jexit(',
              'use Joomla\\CMS\\Application\\SiteApplication;',
          )
          for name, text in {'dispatcher': dispatcher, 'helper': helper, 'facade': facade}.items():
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'Active Season {name} deprecated API regression: {needle}')

          print('Native Active Season runtime contracts OK')
          PY
