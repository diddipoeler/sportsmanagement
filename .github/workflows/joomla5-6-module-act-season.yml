name: Joomla 5/6 active season module migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  active-season-module:
    name: Native active season module checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate active season module
        shell: bash
        run: |
          set -euo pipefail

          entry=modules/mod_sportsmanagement_act_season/mod_sportsmanagement_act_season.php
          bridge=modules/mod_sportsmanagement_act_season/helper.php
          provider=modules/mod_sportsmanagement_act_season/services/provider.php
          dispatcher=modules/mod_sportsmanagement_act_season/src/Dispatcher/Dispatcher.php
          helper=modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php
          layout=modules/mod_sportsmanagement_act_season/tmpl/default.php
          manifest=modules/mod_sportsmanagement_act_season/mod_sportsmanagement_act_season.xml
          files=("$entry" "$bridge" "$provider" "$dispatcher" "$helper" "$layout")

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_act_season/mod_sportsmanagement_act_season.xml"); if (!$xml) { exit(1); }'

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementActSeason</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_act_season">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"

          grep -Fq "new ModuleDispatcherFactory('Diddipoeler" "$provider"
          grep -Fq "new HelperFactory('Diddipoeler" "$provider"
          grep -q 'class Dispatcher extends AbstractModuleDispatcher' "$dispatcher"
          grep -q "getHelper('ActSeasonHelper')" "$dispatcher"
          grep -q 'DatabaseInterface::class' "$dispatcher"

          grep -q 'final class ActSeasonHelper' "$helper"
          grep -q 'DatabaseInterface \$fallbackDatabase' "$helper"
          grep -q 'normaliseIds' "$helper"
          grep -q '#__sportsmanagement_project' "$helper"
          grep -q '#__sportsmanagement_federations' "$helper"
          grep -q 'sportsmanagementHelper::getDBConnection' "$helper"
          grep -q 'return \$fallbackDatabase' "$helper"
          grep -q "quoteName('pro.alias', 'project_alias')" "$helper"
          grep -q "quoteName('r.alias', 'round_alias')" "$helper"
          grep -q 'function slug' "$helper"
          grep -q 'database_selector' "$helper"

          grep -q 'new ActSeasonHelper' "$entry"
          grep -q 'DatabaseInterface::class' "$entry"
          grep -q 'ModuleHelper::getLayoutPath' "$entry"
          grep -q 'class modJSMActSeasonHelper' "$bridge"
          grep -q 'new ActSeasonHelper' "$bridge"
          grep -q 'DatabaseInterface::class' "$bridge"
          grep -q "'cfg_which_database' => (int) (\$row->database_selector ?? 0)" "$layout"
          grep -q 'bootstrap.startTabSet' "$layout"

          if grep -E -- 'Factory::|JLoader::|jimport\(|CONCAT_WS\(|Factory::getDbo\(|BaseDatabaseModel::getInstance\(' "$helper"; then
            echo 'Active season native helper regressed to global-container/legacy or DB-specific logic' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|JLoader::|jimport\(|->disconnect\(|CONCAT_WS\(|JSMModelLegacy|JSM_PATH|defined\(.DS|define\(.DS|JVERSION|version_compare\(|JFactory::' "${files[@]}"; then
            echo 'Active season module regressed to a removed/deprecated legacy API' >&2
            exit 1
          fi
