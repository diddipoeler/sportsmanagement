name: Joomla 5/6 birthday module migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'modules/mod_sportsmanagement_birthday/**'
      - '.github/workflows/joomla5-6-module-birthday.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'modules/mod_sportsmanagement_birthday/**'
      - '.github/workflows/joomla5-6-module-birthday.yml'

jobs:
  birthday-module:
    name: Native birthday module checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate birthday module runtime
        shell: bash
        run: |
          set -euo pipefail

          entry=modules/mod_sportsmanagement_birthday/mod_sportsmanagement_birthday.php
          bridge=modules/mod_sportsmanagement_birthday/helper.php
          helper=modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php
          dispatcher=modules/mod_sportsmanagement_birthday/src/Dispatcher/Dispatcher.php
          provider=modules/mod_sportsmanagement_birthday/services/provider.php
          manifest=modules/mod_sportsmanagement_birthday/mod_sportsmanagement_birthday.xml
          files=(
            "$entry"
            "$bridge"
            "$helper"
            "$dispatcher"
            "$provider"
            modules/mod_sportsmanagement_birthday/tmpl/default.php
            modules/mod_sportsmanagement_birthday/tmpl/default_player_card.php
            modules/mod_sportsmanagement_birthday/tmpl/default_player_sticker.php
            modules/mod_sportsmanagement_birthday/tmpl/jssor.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_birthday/mod_sportsmanagement_birthday.xml"); if (!$xml) { exit(1); }'

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementBirthday</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_birthday">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          if grep -Eq 'version="3\.0"|<compatibility' "$manifest"; then
            echo 'Birthday manifest still declares Joomla 3 compatibility' >&2
            exit 1
          fi

          grep -q 'final class BirthdayHelper' "$helper"
          grep -q 'DatabaseInterface \$fallbackDatabase' "$helper"
          grep -q 'DateTimeImmutable' "$helper"
          grep -q 'days_to_birthday' "$helper"
          grep -q 'normaliseIds' "$helper"
          grep -q 'loadSportsmanagementHelper' "$helper"
          grep -q 'sortPersons' "$helper"
          grep -q '#__sportsmanagement_season_team_person_id' "$helper"
          grep -q '#__sportsmanagement_person_project_position' "$helper"
          grep -q 'return \$fallbackDatabase' "$helper"
          grep -q 'sportsmanagementHelper::getDBConnection' "$helper"
          grep -q 'function slug' "$helper"

          if grep -Eq 'modSportsmanagementBirthdayDataHelper|/helper\.php|Factory::getContainer|Factory::getApplication|CONCAT_WS\(' "$helper"; then
            echo 'Native BirthdayHelper regressed to legacy wrapper/global-container or DB-specific slug logic' >&2
            exit 1
          fi

          grep -q 'class modSportsmanagementBirthdayDataHelper' "$bridge"
          grep -q 'class modSportsmanagementBirthdayHelper' "$bridge"
          grep -q 'BirthdayHelper::sortPersons' "$bridge"
          grep -q 'new BirthdayHelper' "$bridge"
          grep -q 'DatabaseInterface::class' "$bridge"
          if grep -q '#__sportsmanagement_' "$bridge"; then
            echo 'Birthday compatibility bridge contains domain queries again' >&2
            exit 1
          fi

          grep -q 'use Diddipoeler\\Module\\SportsManagementBirthday\\Site\\Helper\\BirthdayHelper;' "$entry"
          grep -q 'new BirthdayHelper' "$entry"
          grep -q 'DatabaseInterface::class' "$entry"
          grep -q 'ModuleHelper::getLayoutPath' "$entry"
          grep -q "useScript('bootstrap.carousel')" "$entry"
          if grep -q 'modSportsmanagementBirthdayDataHelper' "$entry"; then
            echo 'Birthday entry point regressed to the legacy data helper' >&2
            exit 1
          fi

          grep -q 'class Dispatcher extends AbstractModuleDispatcher' "$dispatcher"
          grep -q "getHelper('BirthdayHelper')" "$dispatcher"
          grep -q 'DatabaseInterface::class' "$dispatcher"
          grep -q "load('com_sportsmanagement'" "$dispatcher"
          grep -q "useScript('bootstrap.carousel')" "$dispatcher"

          grep -Fq "new ModuleDispatcherFactory('Diddipoeler\\\\Module\\\\SportsManagementBirthday')" "$provider"
          grep -Fq "new HelperFactory('Diddipoeler\\\\Module\\\\SportsManagementBirthday\\\\Site\\\\Helper')" "$provider"
          if grep -Fq "\\\\Diddipoeler" "$provider"; then
            echo 'Birthday provider still uses a leading namespace slash' >&2
            exit 1
          fi

          grep -q "mode === 'S'" modules/mod_sportsmanagement_birthday/tmpl/default.php
          grep -q "mode === 'J'" modules/mod_sportsmanagement_birthday/tmpl/default.php
          grep -q 'data-bs-ride="carousel"' modules/mod_sportsmanagement_birthday/tmpl/default.php
          grep -q 'card h-100' modules/mod_sportsmanagement_birthday/tmpl/default_player_card.php
          grep -q 'jsm-birthday-vertical' modules/mod_sportsmanagement_birthday/tmpl/default_player_sticker.php
          grep -q 'Bootstrap carousel' modules/mod_sportsmanagement_birthday/tmpl/jssor.php

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Table::getInstance\(|JLoader::|jimport\(|->disconnect\(|DATE_FORMAT\(|TO_DAYS\(|CURRENT_DATE\(|CURDATE\(|JSMModelLegacy|sportsmanagementHelperRoute|JSMCountries|curl_init\(|strftime\(|JVERSION|version_compare\(|jQuery\(|\$Jssor' "${files[@]}"; then
            echo 'Birthday module regressed to a removed/deprecated or DB-specific legacy API' >&2
            exit 1
          fi
