name: Joomla 5/6 club birthday module migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  club-birthday-module:
    name: Native club birthday runtime checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate club birthday module
        shell: bash
        run: |
          set -euo pipefail

          manifest=modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.xml
          provider=modules/mod_sportsmanagement_club_birthday/services/provider.php
          dispatcher=modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php
          native_helper=modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
          helper=modules/mod_sportsmanagement_club_birthday/helper.php
          entry=modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.php

          files=(
            "$entry"
            "$helper"
            "$provider"
            "$dispatcher"
            "$native_helper"
            modules/mod_sportsmanagement_club_birthday/tmpl/default.php
            modules/mod_sportsmanagement_club_birthday/tmpl/default_carousel.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.xml"); if (!$xml) { exit(1); }'

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementClubBirthday</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_club_birthday">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq "ModuleDispatcherFactory('\\\\Diddipoeler\\\\Module\\\\SportsManagementClubBirthday')" "$provider"
          grep -Fq "HelperFactory('\\\\Diddipoeler\\\\Module\\\\SportsManagementClubBirthday\\\\Site\\\\Helper')" "$provider"
          grep -Fq 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface' "$dispatcher"
          grep -Fq "getHelper('ClubBirthdayHelper')->getData" "$dispatcher"
          grep -Fq 'class ClubBirthdayHelper' "$native_helper"
          grep -Fq 'modSportsmanagementClubBirthdayHelper::getData' "$native_helper"

          grep -q 'class modSportsmanagementClubBirthdayHelper' "$helper"
          grep -q 'DateTimeImmutable' "$helper"
          grep -q 'DateTimeZone' "$helper"
          grep -q 'days_to_birthday' "$helper"
          grep -q 'normaliseIds' "$helper"
          grep -q '#__sportsmanagement_club' "$helper"
          grep -q '#__sportsmanagement_season_team_id' "$helper"
          grep -q '#__sportsmanagement_project' "$helper"
          grep -Fq "where('c.published = 1')" "$helper"
          grep -Fq "where('t.published = 1')" "$helper"
          grep -Fq "where('pt.published = 1')" "$helper"
          grep -Fq "where('pro.published = 1')" "$helper"
          grep -q 'DatabaseInterface' "$helper"
          grep -q 'Factory::getContainer()->get(DatabaseInterface::class)' "$helper"
          grep -q 'sportsmanagementHelper::getDBConnection' "$helper"
          grep -q 'sportsmanagementHelperRoute::getClubInfoRoute' "$helper"
          grep -q 'require_once $routeHelper' "$helper"
          grep -q 'require_once $componentHelper' "$helper"
          grep -q 'modSportsmanagementClubBirthdayHelper::getData' "$entry"
          grep -q 'ModuleHelper::getLayoutPath' "$entry"
          grep -q "mode === 'BC'" modules/mod_sportsmanagement_club_birthday/tmpl/default.php
          grep -q 'data-bs-ride="carousel"' modules/mod_sportsmanagement_club_birthday/tmpl/default_carousel.php

          if grep -Fq 'version="2.5"' "$manifest"; then
            echo 'Club birthday manifest still declares a Joomla 2.5 extension version' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|JLoader::|jimport\(|->disconnect\(|DATE_FORMAT\(|TO_DAYS\(|CURRENT_DATE\(|CURDATE\(|JSMModelLegacy|JSMCountries|version_compare\(|JVERSION|include .*ticker\.js|qscroller|wowslider|curl_init\(' "${files[@]}"; then
            echo 'Club birthday module regressed to a removed/deprecated or DB-specific legacy API' >&2
            exit 1
          fi
