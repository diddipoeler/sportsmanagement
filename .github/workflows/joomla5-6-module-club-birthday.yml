name: Joomla 5/6 club birthday module migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  club-birthday-module:
    name: Native club birthday runtime checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate club birthday module
        shell: bash
        run: |
          set -euo pipefail

          manifest=modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.xml
          provider=modules/mod_sportsmanagement_club_birthday/services/provider.php
          dispatcher=modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php
          native_helper=modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
          helper=modules/mod_sportsmanagement_club_birthday/helper.php
          entry=modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.php

          files=(
            "$entry"
            "$helper"
            "$provider"
            "$dispatcher"
            "$native_helper"
            modules/mod_sportsmanagement_club_birthday/tmpl/default.php
            modules/mod_sportsmanagement_club_birthday/tmpl/default_carousel.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_club_birthday/mod_sportsmanagement_club_birthday.xml"); if (!$xml) { exit(1); }'

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementClubBirthday</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_club_birthday">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq "ModuleDispatcherFactory('Diddipoeler\\\\Module\\\\SportsManagementClubBirthday')" "$provider"
          grep -Fq "HelperFactory('Diddipoeler\\\\Module\\\\SportsManagementClubBirthday\\\\Site\\\\Helper')" "$provider"
          grep -Fq 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface' "$dispatcher"
          grep -Fq 'getLayoutData(): array|false' "$dispatcher"
          grep -Fq 'if ($data === false)' "$dispatcher"
          grep -Fq "getHelper('ClubBirthdayHelper')" "$dispatcher"
          grep -Fq -- '->getData(' "$dispatcher"
          grep -Fq '\Joomla\CMS\Factory::getContainer()->get(DatabaseInterface::class)' "$dispatcher"

          grep -Fq 'final class ClubBirthdayHelper' "$native_helper"
          grep -q 'DateTimeImmutable' "$native_helper"
          grep -q 'DateTimeZone' "$native_helper"
          grep -q 'days_to_birthday' "$native_helper"
          grep -q 'normaliseIds' "$native_helper"
          grep -q '#__sportsmanagement_club' "$native_helper"
          grep -q '#__sportsmanagement_season_team_id' "$native_helper"
          grep -q '#__sportsmanagement_project' "$native_helper"
          grep -Fq "where('c.published = 1')" "$native_helper"
          grep -Fq "where('t.published = 1')" "$native_helper"
          grep -Fq "where('pt.published = 1')" "$native_helper"
          grep -Fq "where('pro.published = 1')" "$native_helper"
          grep -q 'DatabaseInterface' "$native_helper"
          grep -q 'SportsManagementDatabaseResolver::resolve' "$native_helper"
          grep -q 'Route::_(' "$native_helper"
          grep -Fq 'Joomla\Filesystem\File' "$native_helper"
          grep -q 'File::exists' "$native_helper"

          grep -q 'class modSportsmanagementClubBirthdayHelper' "$helper"
          grep -Fq 'Factory::getApplication()' "$helper"
          grep -Fq '\Joomla\CMS\Factory::getContainer()->get(DatabaseInterface::class)' "$helper"
          grep -Fq '(new ClubBirthdayHelper())->getData($params, $app, $database)' "$helper"
          grep -Fq 'ClubBirthdayHelper::sortClubs' "$helper"

          grep -Fq 'active implementation is booted by services/provider.php' "$entry"
          grep -q "mode === 'BC'" modules/mod_sportsmanagement_club_birthday/tmpl/default.php
          grep -q 'data-bs-ride="carousel"' modules/mod_sportsmanagement_club_birthday/tmpl/default_carousel.php

          if grep -Fq 'version="2.5"' "$manifest"; then
            echo 'Club birthday manifest still declares a Joomla 2.5 extension version' >&2
            exit 1
          fi

          if grep -F -- '->getContainer(' "${files[@]}"; then
            echo 'Club birthday module regressed to protected application container access' >&2
            exit 1
          fi

          if grep -E -- 'SiteApplication::class|Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|JLoader::|jimport\(|Joomla\\CMS\\Filesystem\\|->disconnect\(|DATE_FORMAT\(|TO_DAYS\(|CURRENT_DATE\(|CURDATE\(|JSMModelLegacy|JSMCountries|version_compare\(|JVERSION|include .*ticker\.js|qscroller|wowslider|curl_init\(' "${files[@]}"; then
            echo 'Club birthday module regressed to a removed/deprecated or DB-specific legacy API' >&2
            exit 1
          fi
