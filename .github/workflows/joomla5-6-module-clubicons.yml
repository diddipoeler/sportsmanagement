name: Joomla 5/6 club icons module

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  module-clubicons:
    name: Native club icons module gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native module structure
        shell: bash
        run: |
          set -euo pipefail

          manifest=modules/mod_sportsmanagement_clubicons/mod_sportsmanagement_clubicons.xml
          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementClubicons</namespace>' "$manifest"
          grep -q '<folder module="mod_sportsmanagement_clubicons">services</folder>' "$manifest"
          grep -q '<folder>src</folder>' "$manifest"

          native=(
            modules/mod_sportsmanagement_clubicons/services/provider.php
            modules/mod_sportsmanagement_clubicons/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php
            modules/mod_sportsmanagement_clubicons/tmpl/default.php
            modules/mod_sportsmanagement_clubicons/mod_sportsmanagement_clubicons.php
            modules/mod_sportsmanagement_clubicons/helper.php
          )

          for file in "${native[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_clubicons/mod_sportsmanagement_clubicons.xml')
          PY

          dispatcher=modules/mod_sportsmanagement_clubicons/src/Dispatcher/Dispatcher.php
          helper=modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php
          template=modules/mod_sportsmanagement_clubicons/tmpl/default.php

          grep -q 'AbstractModuleDispatcher' "$dispatcher"
          grep -q 'HelperFactoryAwareTrait' "$dispatcher"
          grep -q 'RankingEngine' "$helper"
          grep -q 'getInput()' "$helper"
          grep -q 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -q 'SiteRouteHelper::view' "$helper"
          grep -q 'logo_url' "$template"
          grep -q 'rel="noopener noreferrer"' "$template"

          if grep -E 'sportsmanagementModelProject|sportsmanagementModelRanking|JSMRanking|sportsmanagementHelperRoute|JLoader::import|jimport\(|Factory::getDbo\(|version_compare\(JVERSION|behavior\.mootools|behavior\.framework|->disconnect\(' \
            "$dispatcher" "$helper" "$template"; then
            echo 'Native club icons path regressed to a legacy Joomla/model bootstrap' >&2
            exit 1
          fi

          if grep -E 'ClubiconsHelper|modJSMClubiconsHelper|sportsmanagementModel' "$template"; then
            echo 'Club icons template must remain passive' >&2
            exit 1
          fi

          if grep -q 'jQuery' modules/mod_sportsmanagement_clubicons/js/default.js; then
            echo 'Club icons default JavaScript must remain dependency-free' >&2
            exit 1
          fi
