name: Joomla 5/6 Club Icons module

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_clubicons/**'
      - '.github/workflows/joomla5-6-module-clubicons.yml'
  pull_request:
    branches: [master]
    paths:
      - 'modules/mod_sportsmanagement_clubicons/**'
      - '.github/workflows/joomla5-6-module-clubicons.yml'

jobs:
  club-icons-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lint native module stack
        shell: bash
        run: |
          set -euo pipefail
          for file in modules/mod_sportsmanagement_clubicons/services/provider.php modules/mod_sportsmanagement_clubicons/src/Dispatcher/Dispatcher.php modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php modules/mod_sportsmanagement_clubicons/helper.php modules/mod_sportsmanagement_clubicons/tmpl/default.php modules/mod_sportsmanagement_clubicons/tmpl/default_carousel.php; do
            test -f "$file"
            php -l "$file"
          done
      - name: Validate manifest and native contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('modules/mod_sportsmanagement_clubicons/mod_sportsmanagement_clubicons.xml').getroot()
          namespace = root.find('namespace')
          if namespace is None or (namespace.text or '').strip() != r'Diddipoeler\Module\SportsManagementClubicons': raise SystemExit('Club Icons namespace is not native')
          folders = [(node.text or '').strip() for node in root.findall('./files/folder')]
          for folder in ('services', 'src', 'tmpl'):
              if folder not in folders: raise SystemExit(f'Club Icons manifest folder missing: {folder}')
          facade = Path('modules/mod_sportsmanagement_clubicons/helper.php').read_text(encoding='utf-8')
          helper = Path('modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php').read_text(encoding='utf-8')
          dispatcher = Path('modules/mod_sportsmanagement_clubicons/src/Dispatcher/Dispatcher.php').read_text(encoding='utf-8')
          provider = Path('modules/mod_sportsmanagement_clubicons/services/provider.php').read_text(encoding='utf-8')
          checks = {
              'facade application': (facade, '$app = Factory::getApplication();'),
              'helper application': (helper, 'CMSApplicationInterface $app'),
              'helper database': (helper, '$app->getContainer()->get(DatabaseInterface::class)'),
              'dispatcher application': (dispatcher, '$app = $this->getApplication();'),
              'provider dispatcher': (provider, "ModuleDispatcherFactory('\\\\Diddipoeler\\\\Module\\\\SportsManagementClubicons')"),
              'provider helper': (provider, "HelperFactory('\\\\Diddipoeler\\\\Module\\\\SportsManagementClubicons\\\\Site\\\\Helper')"),
          }
          for name, (text, needle) in checks.items():
              if needle not in text: raise SystemExit(f'{name} contract missing: {needle}')
          forbidden = ('Factory::getContainer()', 'Factory::getDbo()', 'Factory::getDBO()', 'JLoader::import(', 'jimport(', 'JError::', 'use Joomla\\CMS\\Application\\SiteApplication;')
          for name, text in {'facade': facade, 'helper': helper, 'dispatcher': dispatcher}.items():
              for needle in forbidden:
                  if needle in text: raise SystemExit(f'{name} deprecated API regression: {needle}')
          print('Native Club Icons contracts OK')
          PY
