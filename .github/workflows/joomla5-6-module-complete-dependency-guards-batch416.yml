name: Joomla 5/6 module complete dependency guards batch 416

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - 'modules/mod_sportsmanagement_club_birthday/helper.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - '.github/workflows/joomla5-6-module-complete-dependency-guards-batch416.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - 'modules/mod_sportsmanagement_club_birthday/helper.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - '.github/workflows/joomla5-6-module-complete-dependency-guards-batch416.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate complete module dependency guards
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_clubicons/helper.php
            modules/mod_sportsmanagement_club_birthday/helper.php
            modules/mod_sportsmanagement_eventsranking/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'SportsManagementDatabaseResolver::class' "$file"
            grep -Fq -- 'SportsManagementSiteApplicationResolver::class' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done
          grep -Fq -- 'ClubiconsHelper::class => __DIR__' modules/mod_sportsmanagement_clubicons/helper.php
          grep -Fq -- 'ClubBirthdayHelper::class => __DIR__' modules/mod_sportsmanagement_club_birthday/helper.php
          grep -Fq -- 'EventsRankingHelper::class => __DIR__' modules/mod_sportsmanagement_eventsranking/helper.php
