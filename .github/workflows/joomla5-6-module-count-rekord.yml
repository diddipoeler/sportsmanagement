name: Joomla 5/6 Count Record module

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'modules/mod_sportsmanagement_count_rekord/**'
      - '.github/workflows/joomla5-6-module-count-rekord.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'modules/mod_sportsmanagement_count_rekord/**'
      - '.github/workflows/joomla5-6-module-count-rekord.yml'

jobs:
  count-record-module:
    name: Native Count Record module checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native module stack
        shell: bash
        run: |
          set -euo pipefail

          files=(
            modules/mod_sportsmanagement_count_rekord/services/provider.php
            modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_count_rekord/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate module manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.xml')
          root = ET.parse(path).getroot()
          namespace = root.find('namespace')
          if namespace is None or (namespace.text or '').strip() != r'Diddipoeler\Module\SportsManagementCountRekord':
              raise SystemExit('Count Record namespace is not native')

          folders = [(node.text or '').strip() for node in root.findall('./files/folder')]
          if 'services' not in folders or 'src' not in folders or 'tmpl' not in folders:
              raise SystemExit('Count Record native module folders are not installed')

          print('Count Record manifest contract OK')
          PY

      - name: Enforce native application and database access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dispatcher = Path('modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php').read_text(encoding='utf-8')
          helper = Path('modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php').read_text(encoding='utf-8')
          facade = Path('modules/mod_sportsmanagement_count_rekord/helper.php').read_text(encoding='utf-8')
          provider = Path('modules/mod_sportsmanagement_count_rekord/services/provider.php').read_text(encoding='utf-8')

          expected = {
              'dispatcher application': (dispatcher, '$app = $this->getApplication();'),
              'dispatcher database': (dispatcher, '$app->getContainer()->get(DatabaseInterface::class)'),
              'dispatcher helper factory': (dispatcher, "$this->getHelperFactory()"),
              'database resolver': (helper, 'SportsManagementDatabaseResolver::resolve'),
              'facade application': (facade, '$app = Factory::getApplication();'),
              'facade database': (facade, '$app->getContainer()->get(DatabaseInterface::class)'),
              'module provider dispatcher': (provider, 'ModuleDispatcherFactory'),
              'module provider helper': (provider, 'HelperFactory'),
          }

          for name, (text, needle) in expected.items():
              if needle not in text:
                  raise SystemExit(f'{name} contract missing: {needle}')

          forbidden = (
              'Factory::getContainer(',
              'Factory::getDbo(',
              'Factory::getDBO(',
              'JFactory::',
              'BaseDatabaseModel::getInstance(',
              'JLoader::import(',
              'jimport(',
              'JError::',
              'jexit(',
          )

          for path, text in {
              'dispatcher': dispatcher,
              'helper': helper,
              'facade': facade,
          }.items():
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'{path} regressed to deprecated API: {needle}')

          print('Native Count Record module contracts OK')
          PY
