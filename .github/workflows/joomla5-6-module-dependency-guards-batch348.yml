name: Joomla 5/6 module dependency guards batch 348

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - 'modules/mod_sportsmanagement_new_project/helper.php'
      - '.github/workflows/joomla5-6-module-dependency-guards-batch348.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - 'modules/mod_sportsmanagement_new_project/helper.php'
      - '.github/workflows/joomla5-6-module-dependency-guards-batch348.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate module dependency guards
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_ranking/helper.php
            modules/mod_sportsmanagement_new_project/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          done
          grep -Fq -- 'SportsManagement Ranking dependencies could not be loaded:' modules/mod_sportsmanagement_ranking/helper.php
          grep -Fq -- 'SportsManagement New Project dependencies could not be loaded:' modules/mod_sportsmanagement_new_project/helper.php
