name: Joomla 5/6 module dependency guards batch 355

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - 'modules/mod_sportsmanagement_club_birthday/helper.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - '.github/workflows/joomla5-6-module-dependency-guards-batch355.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - 'modules/mod_sportsmanagement_club_birthday/helper.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - '.github/workflows/joomla5-6-module-dependency-guards-batch355.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate module dependency guards
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_birthday/helper.php
            modules/mod_sportsmanagement_club_birthday/helper.php
            modules/mod_sportsmanagement_playgroundplan/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          done
          grep -Fq -- 'SportsManagement Birthday dependencies could not be loaded:' modules/mod_sportsmanagement_birthday/helper.php
          grep -Fq -- 'SportsManagement Club Birthday dependencies could not be loaded:' modules/mod_sportsmanagement_club_birthday/helper.php
          grep -Fq -- 'SportsManagement database resolver could not be loaded.' modules/mod_sportsmanagement_playgroundplan/helper.php
