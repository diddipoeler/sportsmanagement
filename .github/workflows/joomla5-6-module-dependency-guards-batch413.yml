name: Joomla 5/6 module dependency guards batch 413

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_uefawertung/helper.php'
      - 'modules/mod_sportsmanagement_liveticker/helper.php'
      - 'modules/mod_sportsmanagement_navigation_menu/helper.php'
      - '.github/workflows/joomla5-6-module-dependency-guards-batch413.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_uefawertung/helper.php'
      - 'modules/mod_sportsmanagement_liveticker/helper.php'
      - 'modules/mod_sportsmanagement_navigation_menu/helper.php'
      - '.github/workflows/joomla5-6-module-dependency-guards-batch413.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate module dependency guards
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_uefawertung/helper.php
            modules/mod_sportsmanagement_liveticker/helper.php
            modules/mod_sportsmanagement_navigation_menu/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done
          grep -Fq -- 'SportsManagementDatabaseResolver::class' modules/mod_sportsmanagement_uefawertung/helper.php
          grep -Fq -- 'SportsManagementDatabaseResolver::class' modules/mod_sportsmanagement_liveticker/helper.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver::class' modules/mod_sportsmanagement_liveticker/helper.php
          grep -Fq -- 'SiteRouteHelper::class' modules/mod_sportsmanagement_navigation_menu/helper.php
          grep -Fq -- 'SportsManagementDatabaseResolver::class' modules/mod_sportsmanagement_navigation_menu/helper.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver::class' modules/mod_sportsmanagement_navigation_menu/helper.php
