name: Joomla 5/6 Events Ranking module migration gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_eventsranking/**'
      - '.github/workflows/joomla5-6-module-eventsranking.yml'
  pull_request:
    paths:
      - 'modules/mod_sportsmanagement_eventsranking/**'
      - '.github/workflows/joomla5-6-module-eventsranking.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint native module stack
        run: |
          php -l modules/mod_sportsmanagement_eventsranking/src/Dispatcher/Dispatcher.php
          php -l modules/mod_sportsmanagement_eventsranking/src/Helper/EventsRankingHelper.php
          php -l modules/mod_sportsmanagement_eventsranking/services/provider.php
          php -l modules/mod_sportsmanagement_eventsranking/helper.php
          php -l modules/mod_sportsmanagement_eventsranking/mod_sportsmanagement_eventsranking.php
          php -l modules/mod_sportsmanagement_eventsranking/tmpl/default.php
      - name: Validate Joomla 5/6 dispatcher contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          base = Path('modules/mod_sportsmanagement_eventsranking')
          dispatcher = (base / 'src/Dispatcher/Dispatcher.php').read_text(encoding='utf-8')
          helper = (base / 'src/Helper/EventsRankingHelper.php').read_text(encoding='utf-8')
          provider = (base / 'services/provider.php').read_text(encoding='utf-8')
          template = (base / 'tmpl/default.php').read_text(encoding='utf-8')
          entry = (base / 'mod_sportsmanagement_eventsranking.php').read_text(encoding='utf-8')
          manifest = (base / 'mod_sportsmanagement_eventsranking.xml').read_text(encoding='utf-8')

          expected = {
              'native dispatcher': (dispatcher, 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface'),
              'false-compatible signature': (dispatcher, 'getLayoutData(): array|false'),
              'false render guard': (dispatcher, 'if ($data === false)'),
              'dispatcher helper factory': (dispatcher, "getHelper('EventsRankingHelper')"),
              'native web assets': (dispatcher, 'getWebAssetManager()->registerAndUseStyle('),
              'versioned stylesheet': (dispatcher, "['version' => 'auto']"),
              'native helper application': (helper, 'CMSApplicationInterface $app'),
              'provider dispatcher': (provider, 'ModuleDispatcherFactory'),
              'provider helper': (provider, 'HelperFactory'),
              'passive template data': (template, "$rankingData['eventtypes']"),
              'compatibility entry helper': (entry, 'new EventsRankingHelper()'),
              'native namespace': (manifest, '<namespace path="src">Diddipoeler\\Module\\SportsManagementEventsRanking</namespace>'),
          }

          for name, (text, needle) in expected.items():
              if needle not in text:
                  raise SystemExit(f'{name} contract missing: {needle}')

          for name, text in {
              'dispatcher': dispatcher,
              'helper': helper,
              'template': template,
          }.items():
              for needle in (
                  'Factory::getDbo()',
                  'Factory::getDBO()',
                  '$app->getContainer(',
                  '$app->input',
                  'getVar(',
                  'JLoader::import(',
                  'jimport(',
                  'JError::',
              ):
                  if needle in text:
                      raise SystemExit(f'EventsRanking {name} deprecated API regression: {needle}')

          if "method_exists($document, 'getWebAssetManager')" in dispatcher:
              raise SystemExit('EventsRanking dispatcher regressed to legacy WebAsset feature detection')

          if '<script' in template or 'onclick=' in template or 'onchange=' in template:
              raise SystemExit('EventsRanking template regressed to inline JavaScript')

          print('Native EventsRanking module contracts OK')
          PY
