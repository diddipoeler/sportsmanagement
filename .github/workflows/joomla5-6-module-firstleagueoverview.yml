name: Joomla 5/6 module first league overview

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  module-firstleagueoverview:
    name: Native first league overview module gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native module structure
        shell: bash
        run: |
          set -euo pipefail

          base=modules/mod_sportsmanagement_firstleagueoverview
          manifest="$base/mod_sportsmanagement_firstleagueoverview.xml"
          native=(
            "$base/services/provider.php"
            "$base/src/Dispatcher/Dispatcher.php"
            "$base/src/Helper/FirstLeagueOverviewHelper.php"
            "$base/tmpl/default.php"
            "$base/tmpl/default_old.php"
            "$base/mod_sportsmanagement_firstleagueoverview.php"
            "$base/helper.php"
          )

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_firstleagueoverview/mod_sportsmanagement_firstleagueoverview.xml')
          PY

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementFirstLeagueOverview</namespace>' "$manifest"
          grep -q '<folder module="mod_sportsmanagement_firstleagueoverview">services</folder>' "$manifest"
          grep -q '<folder>src</folder>' "$manifest"

          for file in "${native[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          base=modules/mod_sportsmanagement_firstleagueoverview
          dispatcher="$base/src/Dispatcher/Dispatcher.php"
          helper="$base/src/Helper/FirstLeagueOverviewHelper.php"
          template="$base/tmpl/default.php"
          old_template="$base/tmpl/default_old.php"
          entry="$base/mod_sportsmanagement_firstleagueoverview.php"
          bridge="$base/helper.php"

          grep -q 'AbstractModuleDispatcher' "$dispatcher"
          grep -q 'HelperFactoryAwareTrait' "$dispatcher"
          grep -q 'getWebAssetManager()' "$dispatcher"
          grep -q 'registerAndUseStyle' "$dispatcher"
          grep -q "getHelper('FirstLeagueOverviewHelper')" "$dispatcher"

          grep -q '#__sportsmanagement_league' "$helper"
          grep -q '#__sportsmanagement_project' "$helper"
          grep -q '#__sportsmanagement_countries' "$helper"
          grep -q '#__sportsmanagement_federations' "$helper"
          grep -q 'Route::_' "$helper"
          grep -q 'flag_html' "$helper"
          grep -q 'getDBConnection' "$helper"

          grep -q 'bootstrap.startTabSet' "$template"
          grep -q 'ranking_link' "$template"
          grep -q 'flag_html' "$template"
          grep -q "require __DIR__ . '/default.php'" "$old_template"
          grep -q 'class_alias\|Legacy helper bridge' "$bridge"

          files=("$dispatcher" "$helper" "$template" "$old_template" "$entry" "$bridge")
          if grep -E 'JSMModelLegacy|JSMModelList|BaseDatabaseModel::getInstance|JLoader::import|sportsmanagementModel|sportsmanagementHelperRoute|JSMCountries|->disconnect\(|Factory::getApplication\(\)->input|\$app->input|version_compare\(JVERSION|addStyleSheet\(' "${files[@]}"; then
            echo 'First league overview module regressed to a Joomla 3 compatibility path' >&2
            exit 1
          fi

          if grep -E 'Factory::|sportsmanagementHelper|JSMCountries|->getQuery\(|->setQuery\(|Route::_' "$template"; then
            echo 'First league overview template must remain passive' >&2
            exit 1
          fi
