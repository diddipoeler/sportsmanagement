name: Joomla 5/6 First League Overview module

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_firstleagueoverview/**'
      - '.github/workflows/joomla5-6-module-firstleagueoverview.yml'
  pull_request:
    branches: [master]
    paths:
      - 'modules/mod_sportsmanagement_firstleagueoverview/**'
      - '.github/workflows/joomla5-6-module-firstleagueoverview.yml'

jobs:
  first-league-overview-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native module stack
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_firstleagueoverview/mod_sportsmanagement_firstleagueoverview.php
            modules/mod_sportsmanagement_firstleagueoverview/helper.php
            modules/mod_sportsmanagement_firstleagueoverview/services/provider.php
            modules/mod_sportsmanagement_firstleagueoverview/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php
            modules/mod_sportsmanagement_firstleagueoverview/tmpl/default.php
            modules/mod_sportsmanagement_firstleagueoverview/tmpl/default_old.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate required PHP metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_firstleagueoverview/mod_sportsmanagement_firstleagueoverview.php
            modules/mod_sportsmanagement_firstleagueoverview/helper.php
            modules/mod_sportsmanagement_firstleagueoverview/services/provider.php
            modules/mod_sportsmanagement_firstleagueoverview/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php
            modules/mod_sportsmanagement_firstleagueoverview/tmpl/default.php
            modules/mod_sportsmanagement_firstleagueoverview/tmpl/default_old.php
          )
          for file in "${files[@]}"; do
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag"
                exit 1
              }
            done
          done

      - name: Validate native module contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse('modules/mod_sportsmanagement_firstleagueoverview/mod_sportsmanagement_firstleagueoverview.xml').getroot()
          namespace = root.find('namespace')
          if namespace is None or (namespace.text or '').strip() != r'Diddipoeler\Module\SportsManagementFirstLeagueOverview':
              raise SystemExit('First League Overview namespace is not native')

          folders = [(node.text or '').strip() for node in root.findall('./files/folder')]
          for folder in ('services', 'src', 'tmpl'):
              if folder not in folders:
                  raise SystemExit(f'First League Overview manifest folder missing: {folder}')

          facade = Path('modules/mod_sportsmanagement_firstleagueoverview/helper.php').read_text(encoding='utf-8')
          dispatcher = Path('modules/mod_sportsmanagement_firstleagueoverview/src/Dispatcher/Dispatcher.php').read_text(encoding='utf-8')
          helper = Path('modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php').read_text(encoding='utf-8')
          provider = Path('modules/mod_sportsmanagement_firstleagueoverview/services/provider.php').read_text(encoding='utf-8')
          template = Path('modules/mod_sportsmanagement_firstleagueoverview/tmpl/default.php').read_text(encoding='utf-8')
          legacy_template = Path('modules/mod_sportsmanagement_firstleagueoverview/tmpl/default_old.php').read_text(encoding='utf-8')

          checks = {
              'facade public database container': (facade, 'Factory::getContainer()->get(DatabaseInterface::class)'),
              'dispatcher application': (dispatcher, '$app = $this->getApplication();'),
              'false-compatible signature': (dispatcher, 'getLayoutData(): array|false'),
              'false render guard': (dispatcher, 'if ($data === false)'),
              'dispatcher public database container': (dispatcher, 'Factory::getContainer()->get(DatabaseInterface::class)'),
              'dispatcher bootstrap tab': (dispatcher, "useScript('bootstrap.tab')"),
              'dispatcher web assets': (dispatcher, 'registerAndUseStyle('),
              'versioned stylesheet': (dispatcher, "['version' => 'auto']"),
              'database resolver': (helper, 'SportsManagementDatabaseResolver::resolve('),
              'native ranking route': (helper, "SiteRouteHelper::view('ranking'"),
              'provider dispatcher': (provider, 'ModuleDispatcherFactory'),
              'provider helper': (provider, 'HelperFactory'),
              'legacy template alias': (legacy_template, "require __DIR__ . '/default.php';"),
          }
          for name, (text, needle) in checks.items():
              if needle not in text:
                  raise SystemExit(f'{name} contract missing: {needle}')

          forbidden = (
              'Factory::getApplication()',
              'Factory::getDbo()',
              'Factory::getDBO()',
              '\\Joomla\\CMS\\Factory::',
              '$app->getContainer(',
              '$app->input',
              'getVar(',
              'JLoader::import(',
              'jimport(',
              'JError::',
              'use Joomla\\CMS\\Application\\SiteApplication;',
          )
          for name, text in {'facade': facade, 'dispatcher': dispatcher, 'helper': helper}.items():
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'{name} deprecated API regression: {needle}')

          if '<script' in template or 'onclick=' in template or 'onchange=' in template:
              raise SystemExit('First League Overview template regressed to inline JavaScript')

          print('Native First League Overview module contracts OK')
          PY
