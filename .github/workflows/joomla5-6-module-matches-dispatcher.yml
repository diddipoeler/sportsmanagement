name: Joomla 5/6 matches module dispatcher

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  matches-dispatcher:
    name: Matches dispatcher gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 module structure
        shell: bash
        run: |
          set -euo pipefail

          base=modules/mod_sportsmanagement_matches
          provider="$base/services/provider.php"
          dispatcher="$base/src/Dispatcher/Dispatcher.php"
          helper="$base/src/Helper/MatchesHelper.php"
          default_layout="$base/tmpl/default.php"
          native_layout="$base/tmpl/native.php"
          manifest="$base/mod_sportsmanagement_matches.xml"

          for file in "$provider" "$dispatcher" "$helper" "$default_layout" "$native_layout"; do
            php -l "$file"
          done

          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse('modules/mod_sportsmanagement_matches/mod_sportsmanagement_matches.xml').getroot()
          assert root.attrib.get('type') == 'module'
          assert root.attrib.get('client') == 'site'
          assert root.attrib.get('method') == 'upgrade'
          assert 'version' not in root.attrib

          namespace = root.find('./namespace')
          assert namespace is not None
          assert namespace.attrib.get('path') == 'src'
          assert (namespace.text or '').strip() == r'Diddipoeler\Module\SportsManagementMatches'

          folders = {(node.text or '').strip(): node.attrib for node in root.findall('./files/folder')}
          assert folders.get('services', {}).get('module') == 'mod_sportsmanagement_matches'
          for folder in ('src', 'connectors', 'fields', 'tmpl', 'assets'):
              assert folder in folders, folder
          PY

          grep -q 'ModuleDispatcherFactory' "$provider"
          grep -q 'HelperFactory' "$provider"
          grep -q 'SportsManagementMatches' "$provider"

          grep -q 'extends AbstractModuleDispatcher' "$dispatcher"
          grep -q 'HelperFactoryAwareTrait' "$dispatcher"
          grep -q "getHelper('MatchesHelper')" "$dispatcher"
          grep -q 'getWebAssetManager' "$dispatcher"

          grep -q 'final class MatchesHelper' "$helper"
          grep -q 'NativeQueryTrait' "$helper"
          grep -q 'NativeFormatTrait' "$helper"
          grep -q 'NativeLinkTrait' "$helper"

          grep -q "require __DIR__ . '/native.php'" "$default_layout"
          grep -q 'jsm-match-card' "$native_layout"

          active=("$provider" "$dispatcher" "$helper" "$default_layout" "$native_layout")
          if grep -E -i -- 'JLoader::import|BaseDatabaseModel::getInstance|Factory::getDbo\(|Factory::getDBO\(|sportsmanagementModel|sportsmanagementHelperRoute|->disconnect\(|version_compare\(JVERSION|mootools|jquery|ajaxMListMod' "${active[@]}"; then
            echo 'Matches dispatcher path contains legacy Joomla MVC/Ajax bootstrapping' >&2
            exit 1
          fi

          if grep -E 'MatchesHelper|MatchReadService|Factory::|BaseDatabaseModel' "$native_layout"; then
            echo 'Matches native layout must stay passive' >&2
            exit 1
          fi
