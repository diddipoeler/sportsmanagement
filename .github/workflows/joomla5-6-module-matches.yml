name: Joomla 5/6 matches module

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  module-matches:
    name: Matches native runtime gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native matches runtime
        shell: bash
        run: |
          set -euo pipefail

          base=modules/mod_sportsmanagement_matches
          entry="$base/mod_sportsmanagement_matches.php"
          helper="$base/connectors/native.php"
          query_trait="$base/connectors/native/QueryTrait.php"
          format_trait="$base/connectors/native/FormatTrait.php"
          link_trait="$base/connectors/native/LinkTrait.php"
          template="$base/tmpl/native.php"
          manifest="$base/mod_sportsmanagement_matches.xml"
          service=site/src/Service/MatchReadService.php

          for file in "$entry" "$helper" "$query_trait" "$format_trait" "$link_trait" "$template" "$service"; do
            php -l "$file"
          done

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('modules/mod_sportsmanagement_matches/mod_sportsmanagement_matches.xml').getroot()
          folders = {node.text for node in root.findall('./files/folder')}
          required = {'connectors', 'tmpl', 'assets'}
          missing = required - folders
          if missing:
              raise SystemExit('Manifest is missing packaged native runtime folders: ' + ', '.join(sorted(missing)))
          PY

          grep -q 'MatchReadService' "$entry"
          grep -q 'getWebAssetManager' "$entry"
          grep -q "connectors/native.php" "$entry"
          grep -q "getLayoutPath.*native" "$entry"

          grep -q 'final class MatchesHelper' "$helper"
          grep -q 'NativeQueryTrait' "$helper"
          grep -q 'NativeFormatTrait' "$helper"
          grep -q 'NativeLinkTrait' "$helper"
          grep -q '#__sportsmanagement_match' "$query_trait"
          grep -q '#__sportsmanagement_project_team' "$query_trait"
          grep -q 'MatchReadService' "$format_trait"
          grep -q 'neighborLinks' "$link_trait"
          grep -q 'cfg_which_database' "$link_trait"
          grep -q 'Route::_' "$link_trait"

          grep -q 'jsm-match-card' "$template"
          grep -q 'rel="noopener noreferrer"' "$template"
          grep -q 'legacyUpdateRequested' "$template"

          active=("$entry" "$helper" "$query_trait" "$format_trait" "$link_trait" "$template")
          if grep -E -i -- 'JSMModelLegacy|BaseDatabaseModel::getInstance|JLoader::import|sportsmanagementModel(Project|Clubplan|Match)|sportsmanagementHelperRoute|JSMCountries|->disconnect\(|Factory::getDbo\(|Factory::getDBO\(|version_compare\(JVERSION|mootools|jquery|ajaxMListMod|jlml_loadMatch' "${active[@]}"; then
            echo 'Matches native runtime still contains legacy Joomla MVC/Ajax bootstrapping' >&2
            exit 1
          fi

          if grep -E 'MatchesHelper|MatchReadService|Factory::|BaseDatabaseModel' "$template"; then
            echo 'Matches native template must stay passive' >&2
            exit 1
          fi
