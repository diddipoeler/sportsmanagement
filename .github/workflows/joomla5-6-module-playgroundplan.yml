name: Joomla 5/6 Playground Plan module migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'modules/mod_sportsmanagement_playgroundplan/**'
      - 'site/src/Helper/SiteRouteHelper.php'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-module-playgroundplan.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'modules/mod_sportsmanagement_playgroundplan/**'
      - 'site/src/Helper/SiteRouteHelper.php'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-module-playgroundplan.yml'

jobs:
  playground-plan-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Playground Plan migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            modules/mod_sportsmanagement_playgroundplan/mod_sportsmanagement_playgroundplan.php
            modules/mod_sportsmanagement_playgroundplan/helper.php
            modules/mod_sportsmanagement_playgroundplan/services/provider.php
            modules/mod_sportsmanagement_playgroundplan/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
            modules/mod_sportsmanagement_playgroundplan/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          php -l site/src/Helper/SiteRouteHelper.php
          php -l site/src/Service/SportsManagementDatabaseResolver.php
          node --check modules/mod_sportsmanagement_playgroundplan/js/ticker.js

          provider=modules/mod_sportsmanagement_playgroundplan/services/provider.php
          dispatcher=modules/mod_sportsmanagement_playgroundplan/src/Dispatcher/Dispatcher.php
          helper=modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
          bridge=modules/mod_sportsmanagement_playgroundplan/helper.php
          template=modules/mod_sportsmanagement_playgroundplan/tmpl/default.php

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'HelperFactory' "$provider"
          grep -Fq 'getLayoutData(): array|false' "$dispatcher"
          grep -Fq 'if ($data === false)' "$dispatcher"
          grep -Fq 'getWebAssetManager()' "$dispatcher"
          grep -Fq 'registerAndUseScript(' "$dispatcher"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$helper"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$helper"
          grep -Fq 'SiteRouteHelper::view(' "$helper"
          grep -Fq 'class_alias(' "$bridge"
          grep -Fq 'data-jsm-playgroundplan-ticker' "$template"

          if grep -E -- 'sportsmanagementHelperRoute::|http_build_query\(|use Joomla\\CMS\\Router\\Route;|Factory::getDbo\(|Factory::getDBO\(|\\Joomla\\CMS\\Factory::|\$app->getContainer\(|JLoader::|jimport\(' "$dispatcher" "$helper" "$bridge" "$template"; then
            echo 'Playground Plan regressed to a legacy Joomla/runtime API' >&2
            exit 1
          fi

          echo 'Playground Plan contracts OK'
