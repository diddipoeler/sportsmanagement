name: Joomla 5/6 module resolver guards batch 344

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_trainingsdata/helper.php'
      - 'modules/mod_sportsmanagement_uefawertung/helper.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - '.github/workflows/joomla5-6-module-resolver-guards-batch344.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_trainingsdata/helper.php'
      - 'modules/mod_sportsmanagement_uefawertung/helper.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - '.github/workflows/joomla5-6-module-resolver-guards-batch344.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate module resolver guards
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_trainingsdata/helper.php
            modules/mod_sportsmanagement_uefawertung/helper.php
            modules/mod_sportsmanagement_clubicons/helper.php
            modules/mod_sportsmanagement_eventsranking/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            grep -Fq -- 'SportsManagement site application resolver could not be loaded.' "$file"
          done
