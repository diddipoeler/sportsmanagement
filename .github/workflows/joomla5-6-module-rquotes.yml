name: Joomla 5/6 random quotes module migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'modules/mod_sportsmanagement_rquotes/**'
      - '.github/workflows/joomla5-6-module-rquotes.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'modules/mod_sportsmanagement_rquotes/**'
      - '.github/workflows/joomla5-6-module-rquotes.yml'

jobs:
  rquotes-module:
    name: Native random quotes module checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate random quotes migration
        shell: bash
        run: |
          set -euo pipefail

          entry=modules/mod_sportsmanagement_rquotes/mod_sportsmanagement_rquotes.php
          bridge=modules/mod_sportsmanagement_rquotes/helper.php
          helper=modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php
          dispatcher=modules/mod_sportsmanagement_rquotes/src/Dispatcher/Dispatcher.php
          provider=modules/mod_sportsmanagement_rquotes/services/provider.php
          manifest=modules/mod_sportsmanagement_rquotes/mod_sportsmanagement_rquotes.xml
          layouts=(
            modules/mod_sportsmanagement_rquotes/tmpl/_rquote.php
            modules/mod_sportsmanagement_rquotes/tmpl/default.php
            modules/mod_sportsmanagement_rquotes/tmpl/bold.php
            modules/mod_sportsmanagement_rquotes/tmpl/italic.php
            modules/mod_sportsmanagement_rquotes/tmpl/style.php
            modules/mod_sportsmanagement_rquotes/tmpl/sticker.php
            modules/mod_sportsmanagement_rquotes/tmpl/textfile.php
          )
          files=("$entry" "$bridge" "$helper" "$dispatcher" "$provider" "${layouts[@]}")

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("modules/mod_sportsmanagement_rquotes/mod_sportsmanagement_rquotes.xml"); if (!$xml) { exit(1); }'
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementRquotes</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_rquotes">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          if grep -Eq 'version="3\.0"|<compatibility' "$manifest"; then
            echo 'Random quotes manifest still declares legacy Joomla compatibility' >&2
            exit 1
          fi

          grep -q 'final class RquotesHelper' "$helper"
          grep -q 'DatabaseInterface \$fallbackDatabase' "$helper"
          grep -q 'function singleRandom' "$helper"
          grep -q 'function multipleRandom' "$helper"
          grep -q 'function sequential' "$helper"
          grep -q 'function periodic' "$helper"
          grep -q 'function todayQuote' "$helper"
          grep -q 'function quoteRows' "$helper"
          grep -q 'function textLine' "$helper"
          grep -q '#__sportsmanagement_rquote' "$helper"
          grep -q '#__rquote_meta' "$helper"
          grep -q 'sportsmanagementHelper::getDBConnection' "$helper"
          grep -q 'return \$fallbackDatabase' "$helper"
          if grep -E -- 'Factory::|JLoader::|jimport\(|BaseDatabaseModel::getInstance\(|->disconnect\(|Factory::getDbo\(|JPATH::|Joomla\\CMS\\Filesystem\\|addStyleSheet\(' "$helper"; then
            echo 'Native RquotesHelper regressed to a legacy Joomla API' >&2
            exit 1
          fi

          grep -q 'class modRquotesHelper' "$bridge"
          grep -q 'new RquotesHelper' "$bridge"
          grep -q 'getRandomRquote' "$bridge"
          grep -q 'getMultyRandomRquote' "$bridge"
          grep -q 'getSequentialRquote' "$bridge"
          grep -q 'getDailyRquote' "$bridge"
          grep -q 'getWeeklyRquote' "$bridge"
          grep -q 'getMonthlyRquote' "$bridge"
          grep -q 'getYearlyRquote' "$bridge"
          grep -q 'getTodayRquote' "$bridge"
          if grep -q '#__sportsmanagement_' "$bridge"; then
            echo 'Random quotes compatibility bridge contains domain queries again' >&2
            exit 1
          fi

          grep -q 'use Diddipoeler\\Module\\SportsManagementRquotes\\Site\\Helper\\RquotesHelper;' "$entry"
          grep -q 'new RquotesHelper' "$entry"
          grep -q 'DatabaseInterface::class' "$entry"
          grep -q 'registerAndUseStyle' "$entry"
          grep -q 'ModuleHelper::getLayoutPath' "$entry"
          if grep -E -- 'JLoader::|BaseDatabaseModel::getInstance\(|modRquotesHelper::' "$entry"; then
            echo 'Random quotes entry point regressed to the legacy runtime' >&2
            exit 1
          fi

          grep -q 'class Dispatcher extends AbstractModuleDispatcher' "$dispatcher"
          grep -q "getHelper('RquotesHelper')" "$dispatcher"
          grep -q 'DatabaseInterface::class' "$dispatcher"
          grep -q 'registerAndUseStyle' "$dispatcher"

          grep -Fq "new ModuleDispatcherFactory('Diddipoeler" "$provider"
          grep -Fq "new HelperFactory('Diddipoeler" "$provider"

          grep -q 'require __DIR__ . .*/_rquote.php' modules/mod_sportsmanagement_rquotes/tmpl/default.php || grep -q "require __DIR__ . '/_rquote.php'" modules/mod_sportsmanagement_rquotes/tmpl/default.php
          grep -q 'picture_url' modules/mod_sportsmanagement_rquotes/tmpl/_rquote.php
          grep -q 'picture_url' modules/mod_sportsmanagement_rquotes/tmpl/sticker.php
          grep -q 'textLine' modules/mod_sportsmanagement_rquotes/tmpl/textfile.php

          if grep -E -- 'modRquotesHelper::|Factory::|addStyleSheet\(|sportsmanagementHelper::|curl_init\(|JLoader::|jimport\(|JPATH::' "${layouts[@]}"; then
            echo 'Random quotes layout regressed to the legacy helper/document/filesystem path' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Table::getInstance\(|JLoader::|jimport\(|->disconnect\(|JPATH::clean\(|Joomla\\CMS\\Filesystem\\File|Joomla\\CMS\\Input\\Cookie' "$entry" "$helper" "$dispatcher" "$provider"; then
            echo 'Random quotes active runtime contains a removed/deprecated Joomla API' >&2
            exit 1
          fi
