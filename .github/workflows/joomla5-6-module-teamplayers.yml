name: Joomla 5/6 team players module

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  module-teamplayers:
    name: Team players native module gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native team players module
        shell: bash
        run: |
          set -euo pipefail

          base=modules/mod_sportsmanagement_teamplayers
          manifest="$base/mod_sportsmanagement_teamplayers.xml"
          provider="$base/services/provider.php"
          dispatcher="$base/src/Dispatcher/Dispatcher.php"
          helper="$base/src/Helper/TeamPlayersHelper.php"
          bridge="$base/helper.php"
          entry="$base/mod_sportsmanagement_teamplayers.php"
          template="$base/tmpl/native.php"
          default_template="$base/tmpl/default.php"
          script="$base/js/native.js"

          for file in "$provider" "$dispatcher" "$helper" "$bridge" "$entry" "$template" "$default_template"; do
            php -l "$file"
          done
          node --check "$script"

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_teamplayers/mod_sportsmanagement_teamplayers.xml')
          PY

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementTeamPlayers</namespace>' "$manifest"
          grep -q '<folder module="mod_sportsmanagement_teamplayers">services</folder>' "$manifest"
          grep -q '<folder>src</folder>' "$manifest"
          grep -q '<folder>js</folder>' "$manifest"

          grep -q 'AbstractModuleDispatcher' "$dispatcher"
          grep -q 'HelperFactoryAwareTrait' "$dispatcher"
          grep -q "set('layout', 'native')" "$dispatcher"
          grep -q 'getWebAssetManager' "$dispatcher"
          grep -q 'registerAndUseStyle' "$dispatcher"
          grep -q 'registerAndUseScript' "$dispatcher"

          grep -q '#__sportsmanagement_project_team' "$helper"
          grep -q '#__sportsmanagement_season_team_person_id' "$helper"
          grep -q '#__sportsmanagement_match_player' "$helper"
          grep -q 'minutesPlayed' "$helper"
          grep -q 'Route::_' "$helper"
          grep -q 'flagHtml' "$helper"

          grep -q 'data-jsm-teamplayers-carousel' "$template"
          grep -q 'data-jsm-teamplayers-next' "$template"
          grep -q 'scrollIntoView' "$script"
          grep -q "require __DIR__ . '/native.php'" "$default_template"

          active=("$provider" "$dispatcher" "$helper" "$bridge" "$entry" "$template" "$default_template" "$script")
          if grep -E -i -- 'JSMModelLegacy|BaseDatabaseModel::getInstance|JLoader::import|sportsmanagementModel(Project|Roster|Player)|sportsmanagementHelperRoute|JSMCountries|->disconnect\(|Factory::getDbo\(|Factory::getDBO\(|jquery|bxslider|cdnjs\.cloudflare\.com' "${active[@]}"; then
            echo 'Team players native path still contains legacy MVC, jQuery, or CDN bootstrapping' >&2
            exit 1
          fi

          if grep -E 'TeamPlayersHelper|modSportsmanagementTeamPlayersHelper|Factory::|BaseDatabaseModel' "$template"; then
            echo 'Team players native template must stay passive' >&2
            exit 1
          fi
