name: Joomla 5/6 Team Statistics Counter module migration gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'modules/mod_sportsmanagement_teamstatistics_counter/**'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-module-teamstatistics-counter.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'modules/mod_sportsmanagement_teamstatistics_counter/**'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-module-teamstatistics-counter.yml'

jobs:
  team-statistics-counter-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Team Statistics Counter migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            modules/mod_sportsmanagement_teamstatistics_counter/mod_sportsmanagement_teamstatistics_counter.php
            modules/mod_sportsmanagement_teamstatistics_counter/helper.php
            modules/mod_sportsmanagement_teamstatistics_counter/services/provider.php
            modules/mod_sportsmanagement_teamstatistics_counter/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_teamstatistics_counter/src/Helper/TeamStatisticsCounterHelper.php
            modules/mod_sportsmanagement_teamstatistics_counter/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          dispatcher=modules/mod_sportsmanagement_teamstatistics_counter/src/Dispatcher/Dispatcher.php
          helper=modules/mod_sportsmanagement_teamstatistics_counter/src/Helper/TeamStatisticsCounterHelper.php
          bridge=modules/mod_sportsmanagement_teamstatistics_counter/helper.php
          provider=modules/mod_sportsmanagement_teamstatistics_counter/services/provider.php

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'HelperFactory' "$provider"
          grep -Fq 'getLayoutData(): array|false' "$dispatcher"
          grep -Fq 'if ($data === false)' "$dispatcher"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$dispatcher"
          grep -Fq 'getWebAssetManager()' "$dispatcher"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$bridge"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$helper"

          if grep -E -- 'Factory::getApplication\(\)|Factory::getDbo\(|Factory::getDBO\(|\\Joomla\\CMS\\Factory::|\$app->getContainer\(|\$app->input|JLoader::|jimport\(|JError::' "$dispatcher" "$helper" "$bridge"; then
            echo 'Team Statistics Counter regressed to a legacy Joomla/runtime API' >&2
            exit 1
          fi

          echo 'Team Statistics Counter PHP contracts OK'

      - name: Validate Team Statistics Counter manifest and update metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = Path('modules/mod_sportsmanagement_teamstatistics_counter')
          manifest = ET.parse(base / 'mod_sportsmanagement_teamstatistics_counter.xml').getroot()
          update_root = ET.parse(base / 'update-server.xml').getroot()

          namespace = manifest.find('namespace')
          if namespace is None or (namespace.text or '').strip() != r'Diddipoeler\Module\SportsManagementTeamStatisticsCounter':
              raise SystemExit('Team Statistics Counter namespace is not native')

          folders = [(node.text or '').strip() for node in manifest.findall('./files/folder')]
          for required in ('services', 'src', 'tmpl'):
              if required not in folders:
                  raise SystemExit(f'Missing native module folder in manifest: {required}')

          version = (manifest.findtext('version') or '').strip()
          update_version = (update_root.findtext('./update/version') or '').strip()
          if not version or update_version != version:
              raise SystemExit(f'Manifest/update version mismatch: manifest={version}, update={update_version}')

          target = update_root.find('./update/targetplatform')
          if target is None or target.get('name') != 'joomla' or target.get('version') != '[56].*':
              raise SystemExit('Update server no longer targets Joomla 5/6')

          php_minimum = (update_root.findtext('./update/php_minimum') or '').strip()
          if php_minimum != '8.1.0':
              raise SystemExit(f'Unexpected Team Statistics Counter PHP minimum: {php_minimum}')

          print('Team Statistics Counter manifest/update contracts OK')
          PY
