name: Joomla 5/6 TrainingsData module

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_trainingsdata/**'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-module-trainingsdata.yml'
  pull_request:
    branches: [master]
    paths:
      - 'modules/mod_sportsmanagement_trainingsdata/**'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-module-trainingsdata.yml'

jobs:
  trainingsdata-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native TrainingsData stack and metadata
        shell: bash
        run: |
          set -euo pipefail

          files=(
            modules/mod_sportsmanagement_trainingsdata/mod_sportsmanagement_trainingsdata.php
            modules/mod_sportsmanagement_trainingsdata/helper.php
            modules/mod_sportsmanagement_trainingsdata/services/provider.php
            modules/mod_sportsmanagement_trainingsdata/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php
            modules/mod_sportsmanagement_trainingsdata/tmpl/default.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

      - name: Validate native TrainingsData contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          base = Path('modules/mod_sportsmanagement_trainingsdata')
          root = ET.parse(base / 'mod_sportsmanagement_trainingsdata.xml').getroot()

          namespace = root.find('namespace')
          if namespace is None or (namespace.text or '').strip() != r'Diddipoeler\Module\SportsManagementTrainingsData':
              raise SystemExit('TrainingsData namespace is not native')

          folders = [(node.text or '').strip() for node in root.findall('./files/folder')]
          for folder in ('services', 'src', 'tmpl', 'css'):
              if folder not in folders:
                  raise SystemExit(f'TrainingsData manifest folder missing: {folder}')

          provider = (base / 'services/provider.php').read_text(encoding='utf-8')
          dispatcher = (base / 'src/Dispatcher/Dispatcher.php').read_text(encoding='utf-8')
          helper = (base / 'src/Helper/TrainingsDataHelper.php').read_text(encoding='utf-8')
          facade = (base / 'helper.php').read_text(encoding='utf-8')
          template = (base / 'tmpl/default.php').read_text(encoding='utf-8')

          expected = {
              'dispatcher provider': (provider, 'ModuleDispatcherFactory'),
              'helper provider': (provider, 'HelperFactory'),
              'native dispatcher': (dispatcher, 'extends AbstractModuleDispatcher implements HelperFactoryAwareInterface'),
              'dispatcher application': (dispatcher, '$app = $this->getApplication();'),
              'public database container': (dispatcher, 'Factory::getContainer()->get(DatabaseInterface::class)'),
              'helper factory': (dispatcher, "getHelper('TrainingsDataHelper')"),
              'web asset manager': (dispatcher, 'getWebAssetManager()'),
              'database resolver': (helper, 'SportsManagementDatabaseResolver::resolve('),
              'database helper signature': (helper, 'DatabaseInterface $fallbackDatabase'),
              'facade public database container': (facade, 'Factory::getContainer()->get(DatabaseInterface::class)'),
              'facade native helper': (facade, '(new TrainingsDataHelper())->getData($registry, $database)'),
              'escaped layout': (template, 'htmlspecialchars('),
          }
          for name, (text, needle) in expected.items():
              if needle not in text:
                  raise SystemExit(f'{name} contract missing: {needle}')

          forbidden = (
              'Factory::getApplication()',
              'Factory::getDbo()',
              'Factory::getDBO()',
              '\\Joomla\\CMS\\Factory::',
              '$app->getContainer(',
              '$app->input',
              'getVar(',
              'JLoader::import(',
              'jimport(',
              'JError::',
          )
          for name, text in {
              'dispatcher': dispatcher,
              'native helper': helper,
              'compatibility facade': facade,
              'template': template,
          }.items():
              for needle in forbidden:
                  if needle in text:
                      raise SystemExit(f'TrainingsData {name} deprecated API regression: {needle}')

          if '<script' in template or 'onclick=' in template or 'onchange=' in template:
              raise SystemExit('TrainingsData template regressed to inline JavaScript')

          print('Native TrainingsData contracts OK')
          PY
