name: Joomla 5/6 modules and plugins gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - joomla5-6

jobs:
  modules-plugins:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate matches module fields
        shell: bash
        run: |
          set -euo pipefail
          manifest=modules/mod_sportsmanagement_matches/mod_sportsmanagement_matches.xml
          template_field=admin/src/Field/MatchesTemplatelistField.php
          flags_field=admin/src/Field/MatchesFlagsfolderField.php

          php -l "$template_field"
          php -l "$flags_field"
          test ! -d modules/mod_sportsmanagement_matches/fields

          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'type="matchestemplatelist"' "$manifest"
          grep -q 'type="matchesflagsfolder"' "$manifest"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'Matches manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'jimport\(|Factory::get(Language|Document)\(|getCfg\(|window\.addEvent|Fx\.Transitions' \
            "$template_field" "$flags_field"; then
            echo 'Matches module field regressed to a legacy Joomla/MooTools API.' >&2
            exit 1
          fi

      - name: Validate Finder SportsManagement plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin=plugins/jsm_search
          test -f "$plugin/services/provider.php"
          test -f "$plugin/src/Extension/Sportsmanagement.php"
          php -l "$plugin/services/provider.php"
          php -l "$plugin/src/Extension/Sportsmanagement.php"
          php -l "$plugin/search_sportsmanagement.php"
          php -l "$plugin/script.php"

          grep -q '<namespace path="src">Diddipoeler\\Plugin\\Finder\\Sportsmanagement</namespace>' "$plugin/search_sportsmanagement.xml"
          grep -q 'implements SubscriberInterface' "$plugin/src/Extension/Sportsmanagement.php"
          grep -q 'implements InstallerScriptInterface' "$plugin/script.php"
          grep -q 'setDatabase' "$plugin/services/provider.php"

          if grep -E 'Factory::get(Document|Config|Language|User)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(' \
            "$plugin/services/provider.php" "$plugin/src/Extension/Sportsmanagement.php" "$plugin/search_sportsmanagement.php" "$plugin/script.php"; then
            echo 'Finder SportsManagement plugin regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

      - name: Validate user profile plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin=plugins/jsm_userprofile
          test -f "$plugin/services/provider.php"
          test -f "$plugin/src/Extension/SportsmanagementProfile.php"
          php -l "$plugin/services/provider.php"
          php -l "$plugin/src/Extension/SportsmanagementProfile.php"
          php -l "$plugin/jsmprofile.php"

          grep -q '<namespace path="src">Diddipoeler\\Plugin\\User\\SportsmanagementProfile</namespace>' "$plugin/jsmprofile.xml"
          grep -q 'implements SubscriberInterface' "$plugin/src/Extension/SportsmanagementProfile.php"
          grep -q 'DatabaseAwareTrait' "$plugin/src/Extension/SportsmanagementProfile.php"
          grep -q 'setDatabase' "$plugin/services/provider.php"

          if grep -E 'Factory::get(Document|Config|Language|User)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(' \
            "$plugin/services/provider.php" "$plugin/src/Extension/SportsmanagementProfile.php" "$plugin/jsmprofile.php"; then
            echo 'SportsManagement user profile plugin regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

      - name: Validate native playground plan module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_playgroundplan
          helper="$module/src/Helper/PlaygroundPlanHelper.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php
          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$helper"
          test -f "$resolver"
          test ! -f "$module/js/qscroller.js"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$helper"
          php -l "$module/mod_sportsmanagement_playgroundplan.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"
          php -l "$resolver"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementPlaygroundPlan</namespace>' "$module/mod_sportsmanagement_playgroundplan.xml"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$module/mod_sportsmanagement_playgroundplan.xml"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q 'registerAndUseScript' "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'CURRENT_TIMESTAMP' "$helper"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$helper"
          grep -Fq "ph_logo_small" "$helper"
          grep -Fq "ph_logo_medium" "$helper"
          grep -Fq "ph_logo_big" "$helper"
          grep -q 'data-jsm-playgroundplan-ticker' "$module/tmpl/default.php"

          if grep -E 'getDBConnection\(|sportsmanagementHelper|administrator/components/com_sportsmanagement/helpers/sportsmanagement\.php|Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$helper" \
            "$module/mod_sportsmanagement_playgroundplan.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php"; then
            echo 'Playground plan module regressed to a Joomla 6 legacy API or legacy database bootstrap.' >&2
            exit 1
          fi

          if grep -E 'window\.addEvent|Fx\.Transitions|QScroller|MooTools' "$module/js/ticker.js"; then
            echo 'Playground plan ticker regressed to MooTools.' >&2
            exit 1
          fi

      - name: Validate native events ranking module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_eventsranking
          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/EventsRankingHelper.php"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/EventsRankingHelper.php"
          php -l "$module/mod_sportsmanagement_eventsranking.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementEventsRanking</namespace>' "$module/mod_sportsmanagement_eventsranking.xml"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$module/mod_sportsmanagement_eventsranking.xml"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q 'EventsRankingHelper' "$module/mod_sportsmanagement_eventsranking.php"

          if grep -q 'addfieldpath=' "$module/mod_sportsmanagement_eventsranking.xml"; then
            echo 'Events ranking manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/EventsRankingHelper.php" \
            "$module/mod_sportsmanagement_eventsranking.php" \
            "$module/helper.php"; then
            echo 'Events ranking module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

      - name: Validate native AJAX top navigation module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_ajax_top_navigation_menu
          manifest="$module/mod_sportsmanagement_ajax_top_navigation_menu.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/AjaxTopNavigationHelper.php"
          test -f "$module/tmpl/native.php"
          test -f "$module/js/native.js"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/AjaxTopNavigationHelper.php"
          php -l "$module/mod_sportsmanagement_ajax_top_navigation_menu.php"
          php -l "$module/tmpl/native.php"
          node --check "$module/js/native.js"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementAjaxTopNavigationMenu</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q 'getWebAssetManager' "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'getInput()' "$module/src/Helper/AjaxTopNavigationHelper.php"
          grep -q 'data-jsm-ajax-top-navigation' "$module/tmpl/native.php"
          grep -q 'Promise.all' "$module/js/native.js"
          grep -q 'fetch(' "$module/js/native.js"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'AJAX top navigation manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/AjaxTopNavigationHelper.php" \
            "$module/mod_sportsmanagement_ajax_top_navigation_menu.php"; then
            echo 'AJAX top navigation native bootstrap regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -E 'jQuery|\$\(|async:[[:space:]]*false|XMLHttpRequest|ActiveXObject' "$module/js/native.js"; then
            echo 'AJAX top navigation native runtime regressed to legacy jQuery/XHR code.' >&2
            exit 1
          fi

      - name: Validate touched manifests
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            modules/mod_sportsmanagement_matches/mod_sportsmanagement_matches.xml \
            modules/mod_sportsmanagement_eventsranking/mod_sportsmanagement_eventsranking.xml \
            modules/mod_sportsmanagement_playgroundplan/mod_sportsmanagement_playgroundplan.xml \
            modules/mod_sportsmanagement_ajax_top_navigation_menu/mod_sportsmanagement_ajax_top_navigation_menu.xml \
            plugins/jsm_search/search_sportsmanagement.xml \
            plugins/jsm_userprofile/jsmprofile.xml; do
            php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { fwrite(STDERR, "Invalid XML: {$file}\n"); exit(1); }' "$manifest"
          done
