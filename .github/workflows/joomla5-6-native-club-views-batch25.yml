name: Joomla 5/6 native club views batch 25

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/View/Club/HtmlView.php'
      - 'admin/src/View/Clubs/HtmlView.php'
      - 'admin/src/View/Clubname/HtmlView.php'
      - 'admin/src/View/Clubnames/HtmlView.php'
      - '.github/workflows/joomla5-6-native-club-views-batch25.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/View/Club/HtmlView.php'
      - 'admin/src/View/Clubs/HtmlView.php'
      - 'admin/src/View/Clubname/HtmlView.php'
      - 'admin/src/View/Clubnames/HtmlView.php'
      - '.github/workflows/joomla5-6-native-club-views-batch25.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate native club views
        shell: bash
        run: |
          set -euo pipefail

          php_files=(
            admin/src/View/Club/HtmlView.php
            admin/src/View/Clubs/HtmlView.php
            admin/src/View/Clubname/HtmlView.php
            admin/src/View/Clubnames/HtmlView.php
          )

          for file in "${php_files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
            grep -Fq 'final class HtmlView extends BaseHtmlView' "$file"
          done

          if grep -En 'Factory::getApplication\(\)|Factory::getDocument\(\)|Factory::getUser\(\)|Factory::getURI\(\)' "${php_files[@]}"; then
            echo 'Deprecated static Joomla access remains in native club views.' >&2
            exit 1
          fi

          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Club/HtmlView.php
          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Clubs/HtmlView.php
          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Clubname/HtmlView.php

          grep -Fq 'SportsManagementDatabaseResolver' admin/src/View/Club/HtmlView.php
          grep -Fq 'registerAndUseScript(' admin/src/View/Club/HtmlView.php
          grep -Fq "createModel('Club', 'Administrator')" admin/src/View/Clubs/HtmlView.php
          grep -Fq 'ClubnamesModel' admin/src/View/Clubnames/HtmlView.php
