name: Joomla 5/6 native division view

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/View/Division/HtmlView.php'
      - 'admin/src/Model/DivisionModel.php'
      - 'admin/src/Helper/ExtendedFormHelper.php'
      - '.github/workflows/joomla5-6-native-division-view.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/View/Division/HtmlView.php'
      - 'admin/src/Model/DivisionModel.php'
      - 'admin/src/Helper/ExtendedFormHelper.php'
      - '.github/workflows/joomla5-6-native-division-view.yml'

jobs:
  native-division-view:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate division view contracts
        shell: bash
        run: |
          set -euo pipefail

          php -l admin/src/View/Division/HtmlView.php
          php -l admin/src/Model/DivisionModel.php
          php -l admin/src/Helper/ExtendedFormHelper.php

          grep -Fq 'DatabaseInterface::class' admin/src/View/Division/HtmlView.php
          grep -Fq 'Factory::getContainer()' admin/src/View/Division/HtmlView.php
          grep -Fq 'ExtendedFormHelper' admin/src/View/Division/HtmlView.php

          if grep -Eq '\$model->getDatabase\(|sportsmanagementHelper|LegacyBootstrap|class_alias' admin/src/View/Division/HtmlView.php; then
            echo 'Division HtmlView contains an invalid database or legacy dependency' >&2
            exit 1
          fi
