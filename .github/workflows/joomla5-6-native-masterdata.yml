name: Joomla 5/6 native master-data views

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/Controller/SmquoteController.php'
      - 'admin/src/Controller/SmquotesController.php'
      - 'admin/src/Controller/JlextassociationController.php'
      - 'admin/src/Controller/JlextassociationsController.php'
      - 'admin/src/Controller/JlextcountryController.php'
      - 'admin/src/Controller/JlextcountriesController.php'
      - 'admin/src/Controller/JlextfederationController.php'
      - 'admin/src/Controller/JlextfederationsController.php'
      - 'admin/src/Model/SmquoteModel.php'
      - 'admin/src/Model/SmquotesModel.php'
      - 'admin/src/Model/JlextassociationModel.php'
      - 'admin/src/Model/JlextassociationsModel.php'
      - 'admin/src/Model/JlextcountryModel.php'
      - 'admin/src/Model/JlextcountriesModel.php'
      - 'admin/src/Model/JlextfederationModel.php'
      - 'admin/src/Model/JlextfederationsModel.php'
      - 'admin/src/View/Smquote/**'
      - 'admin/src/View/Smquotes/**'
      - 'admin/src/View/Jlextassociation/**'
      - 'admin/src/View/Jlextassociations/**'
      - 'admin/src/View/Jlextcountry/**'
      - 'admin/src/View/Jlextcountries/**'
      - 'admin/src/View/Jlextfederation/**'
      - 'admin/src/View/Jlextfederations/**'
      - 'admin/tmpl/smquote/**'
      - 'admin/tmpl/smquotes/**'
      - 'admin/tmpl/jlextassociation/**'
      - 'admin/tmpl/jlextassociations/**'
      - 'admin/tmpl/jlextcountry/**'
      - 'admin/tmpl/jlextcountries/**'
      - 'admin/tmpl/jlextfederation/**'
      - 'admin/tmpl/jlextfederations/**'
      - 'admin/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-native-masterdata.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/View/Smquote/**'
      - 'admin/src/View/Smquotes/**'
      - 'admin/src/View/Jlextassociation/**'
      - 'admin/src/View/Jlextassociations/**'
      - 'admin/src/View/Jlextcountry/**'
      - 'admin/src/View/Jlextcountries/**'
      - 'admin/src/View/Jlextfederation/**'
      - 'admin/src/View/Jlextfederations/**'
      - 'admin/tmpl/smquote/**'
      - 'admin/tmpl/smquotes/**'
      - 'admin/tmpl/jlextassociation/**'
      - 'admin/tmpl/jlextassociations/**'
      - 'admin/tmpl/jlextcountry/**'
      - 'admin/tmpl/jlextcountries/**'
      - 'admin/tmpl/jlextfederation/**'
      - 'admin/tmpl/jlextfederations/**'
      - 'admin/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-native-masterdata.yml'

jobs:
  contracts:
    name: Native quote and master-data contracts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax
        shell: bash
        run: |
          files=(
            admin/src/View/Smquote/HtmlView.php
            admin/src/View/Smquotes/HtmlView.php
            admin/src/View/Jlextassociation/HtmlView.php
            admin/src/View/Jlextassociations/HtmlView.php
            admin/src/View/Jlextcountry/HtmlView.php
            admin/src/View/Jlextcountries/HtmlView.php
            admin/src/View/Jlextfederation/HtmlView.php
            admin/src/View/Jlextfederations/HtmlView.php
            admin/tmpl/smquote/edit.php
            admin/tmpl/smquotes/default.php
            admin/tmpl/jlextassociation/edit.php
            admin/tmpl/jlextassociations/default.php
            admin/tmpl/jlextcountry/edit.php
            admin/tmpl/jlextcountries/default.php
            admin/tmpl/jlextfederation/edit.php
            admin/tmpl/jlextfederations/default.php
            admin/src/Dispatcher/Dispatcher.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Reject legacy view dependencies
        shell: bash
        run: |
          targets=(
            admin/src/View/Smquote admin/src/View/Smquotes
            admin/src/View/Jlextassociation admin/src/View/Jlextassociations
            admin/src/View/Jlextcountry admin/src/View/Jlextcountries
            admin/src/View/Jlextfederation admin/src/View/Jlextfederations
            admin/tmpl/smquote admin/tmpl/smquotes
            admin/tmpl/jlextassociation admin/tmpl/jlextassociations
            admin/tmpl/jlextcountry admin/tmpl/jlextcountries
            admin/tmpl/jlextfederation admin/tmpl/jlextfederations
          )
          if grep -R -E 'LegacyBootstrap|class_alias|sportsmanagementView|sportsmanagementHelper|JSMCountries' "${targets[@]}"; then
            echo 'Native master-data view layer still contains a legacy dependency' >&2
            exit 1
          fi

      - name: Validate native MVC files
        shell: bash
        run: |
          for pair in \
            'Smquote Smquotes smquote smquotes' \
            'Jlextassociation Jlextassociations jlextassociation jlextassociations' \
            'Jlextcountry Jlextcountries jlextcountry jlextcountries' \
            'Jlextfederation Jlextfederations jlextfederation jlextfederations'; do
            read -r singular plural singular_path plural_path <<< "$pair"
            test -f "admin/src/Controller/${singular}Controller.php"
            test -f "admin/src/Controller/${plural}Controller.php"
            test -f "admin/src/Model/${singular}Model.php"
            test -f "admin/src/Model/${plural}Model.php"
            test -f "admin/src/View/${singular}/HtmlView.php"
            test -f "admin/src/View/${plural}/HtmlView.php"
            test -f "admin/tmpl/${singular_path}/edit.php"
            test -f "admin/tmpl/${plural_path}/default.php"
            test -f "admin/forms/${singular_path}.xml"
          done

      - name: Validate edit tabs
        shell: bash
        run: |
          for file in \
            admin/tmpl/smquote/edit.php \
            admin/tmpl/jlextassociation/edit.php \
            admin/tmpl/jlextcountry/edit.php \
            admin/tmpl/jlextfederation/edit.php; do
            grep -q "uitab.startTabSet" "$file"
            grep -q "uitab.addTab" "$file"
            grep -q "uitab.endTabSet" "$file"
          done

      - name: Validate dispatcher routing
        shell: bash
        run: |
          for view in smquote jlextassociation jlextcountry jlextfederation; do
            grep -q "'${view}'" admin/src/Dispatcher/Dispatcher.php
          done
          for view in smquotes jlextassociations jlextcountries jlextfederations; do
            grep -q "'${view}'" admin/src/Dispatcher/Dispatcher.php
          done
          for task in \
            smquotes.edittxt \
            jlextassociations.import \
            jlextcountries.importplz; do
            grep -q "'${task}'" admin/src/Dispatcher/Dispatcher.php
          done
