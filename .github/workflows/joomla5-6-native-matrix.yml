name: Joomla 5/6 native result matrix

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/MatrixPresentationHelper.php'
      - 'site/src/Model/MatrixModel.php'
      - 'site/src/View/Matrix/HtmlView.php'
      - 'site/tmpl/matrix/default.php'
      - '.github/tests/joomla56_matrix_native_template.php'
      - '.github/tests/joomla56_matrix_project_scope.php'
      - '.github/tests/joomla56_selected_function_phpdoc.php'
      - '.github/workflows/joomla5-6-native-matrix.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint migrated Joomla PHP and require four metadata tags
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/Helper/MatrixPresentationHelper.php \
            site/src/Model/MatrixModel.php \
            site/src/View/Matrix/HtmlView.php \
            site/tmpl/matrix/default.php \
            .github/tests/joomla56_matrix_native_template.php \
            .github/tests/joomla56_matrix_project_scope.php; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "Missing $tag in $file" >&2
                exit 1
              }
            done
          done

      - name: Validate native matrix HTML escaping, scores and divisions
        run: php -d error_reporting=-1 .github/tests/joomla56_matrix_native_template.php

      - name: Validate bounded round, project and division SQL
        run: php -d error_reporting=-1 .github/tests/joomla56_matrix_project_scope.php

      - name: Validate migrated named-function PHPDocs
        run: php .github/tests/joomla56_selected_function_phpdoc.php
