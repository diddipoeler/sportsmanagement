name: Joomla 5/6 native project core data batch 330

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/project.php'
      - 'site/src/Model/ProjectModel.php'
      - '.github/workflows/joomla5-6-native-project-core-data-batch330.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/project.php'
      - 'site/src/Model/ProjectModel.php'
      - '.github/workflows/joomla5-6-native-project-core-data-batch330.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate native project core data migration
        shell: bash
        run: |
          set -euo pipefail
          files=(site/models/project.php site/src/Model/ProjectModel.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          done
          for method in getProjectMatchCount getAdjacentProject updateProjectHits getProjectDivisions getProjectDivisionIds getProjectDivisionTreeIds getRoundOptions getProjectTeamInfo getProjectTeamId getRefereeOptions; do
            grep -Fq -- "function $method" site/src/Model/ProjectModel.php
          done
          ! grep -Fq -- 'version_compare(JVERSION' site/models/project.php
          ! grep -Fq -- '$this->_divisions' site/models/project.php
