name: Joomla 5/6 native project data batch 325

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/project.php'
      - 'site/src/Model/ProjectModel.php'
      - '.github/workflows/joomla5-6-native-project-data-batch325.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/project.php'
      - 'site/src/Model/ProjectModel.php'
      - '.github/workflows/joomla5-6-native-project-data-batch325.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate native project data migration
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/project.php
            site/src/Model/ProjectModel.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          done
          grep -Fq -- 'public function getProjectEvents' site/src/Model/ProjectModel.php
          grep -Fq -- 'public function getProjectPositions' site/src/Model/ProjectModel.php
          grep -Fq -- 'public function getTeamIds' site/src/Model/ProjectModel.php
          grep -Fq -- 'public function getPlaygrounds' site/src/Model/ProjectModel.php
          grep -Fq -- 'public function getProjectGameRegularTime' site/src/Model/ProjectModel.php
          grep -Fq -- 'public function getProjectCountry' site/src/Model/ProjectModel.php
          ! grep -Fq -- 'sportsmanagementHelper::getDBConnection' <(sed -n '/function getProjectEvents/,/function getProjectStats/p' site/models/project.php)
