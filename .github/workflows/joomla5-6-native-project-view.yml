name: Joomla 5/6 native project view

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/src/View/Project/HtmlView.php'
      - 'admin/src/Helper/ExtendedFormHelper.php'
      - 'admin/src/Helper/ExtraFieldsReadHelper.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/src/Service/ProjectPanelService.php'
      - 'admin/tmpl/project/edit.php'
      - '.github/workflows/joomla5-6-native-project-view.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'admin/src/View/Project/HtmlView.php'
      - 'admin/src/Helper/ExtendedFormHelper.php'
      - 'admin/src/Helper/ExtraFieldsReadHelper.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - 'admin/src/Service/ProjectPanelService.php'
      - 'admin/tmpl/project/edit.php'
      - '.github/workflows/joomla5-6-native-project-view.yml'

jobs:
  native-project-view:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native project view
        shell: bash
        run: |
          set -euo pipefail

          php -l admin/src/View/Project/HtmlView.php
          php -l admin/src/Helper/ExtendedFormHelper.php
          php -l admin/src/Helper/ExtraFieldsReadHelper.php
          php -l admin/src/Helper/SportsManagementDatabaseResolver.php
          php -l admin/src/Service/ProjectPanelService.php
          php -l admin/tmpl/project/edit.php

          grep -Fq 'ExtendedFormHelper' admin/src/View/Project/HtmlView.php
          grep -Fq 'ExtraFieldsReadHelper' admin/src/View/Project/HtmlView.php
          grep -Fq 'SportsManagementDatabaseResolver' admin/src/View/Project/HtmlView.php
          grep -Fq 'ProjectPanelService' admin/src/View/Project/HtmlView.php

          if grep -Eq 'sportsmanagementHelper|LegacyBootstrap|class_alias' admin/src/View/Project/HtmlView.php; then
            echo 'Project HtmlView still contains a legacy view/helper dependency' >&2
            exit 1
          fi

          # AbstractView owns $option. Redeclaring it in the child can be fatal across Joomla/PHP versions.
          if grep -Eq '^[[:space:]]*(public|protected|private)[^$]*\$option([[:space:]=;]|$)' admin/src/View/Project/HtmlView.php; then
            echo 'Project HtmlView must use the inherited AbstractView $option property' >&2
            exit 1
          fi

          grep -Fq 'checkextrafields' admin/tmpl/project/edit.php
          grep -Fq "lists['ext_fields']" admin/tmpl/project/edit.php
          grep -Fq '$this->extended' admin/tmpl/project/edit.php
          grep -Fq '$this->extendeduser' admin/tmpl/project/edit.php
