name: Joomla 5/6 native combined results ranking

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/ResultsrankingModel.php'
      - 'site/src/View/Resultsranking/HtmlView.php'
      - 'site/src/Helper/CombinedRankingPresentationHelper.php'
      - 'site/tmpl/resultsranking/**'
      - '.github/tests/joomla56_resultsranking_model_contract.php'
      - '.github/tests/joomla56_resultsranking_native_view.php'
      - '.github/tests/joomla56_native_navigation_route_contract.php'
      - '.github/tests/joomla56_selected_function_phpdoc.php'
      - '.github/workflows/joomla5-6-native-resultsranking.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-resultsranking:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax and required migration metadata
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/Model/ResultsrankingModel.php \
            site/src/View/Resultsranking/HtmlView.php \
            site/src/Helper/CombinedRankingPresentationHelper.php \
            site/tmpl/resultsranking/default.php \
            site/tmpl/resultsranking/default_ranking.php \
            site/tmpl/resultsranking/default_results.php \
            .github/tests/joomla56_resultsranking_model_contract.php \
            .github/tests/joomla56_resultsranking_native_view.php; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "Missing $tag in $file" >&2
                exit 1
              }
            done
          done

      - name: Assert native ranking calculation and project isolation
        run: php -d error_reporting=-1 .github/tests/joomla56_resultsranking_model_contract.php

      - name: Render native combined view safely and retain menu order
        run: php -d error_reporting=-1 .github/tests/joomla56_resultsranking_native_view.php

      - name: Verify existing Joomla menu navigation compatibility
        run: php -d error_reporting=-1 .github/tests/joomla56_native_navigation_route_contract.php

      - name: Enforce detailed named-function PHPDocs
        run: php -d error_reporting=-1 .github/tests/joomla56_selected_function_phpdoc.php
