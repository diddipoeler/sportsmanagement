name: Joomla 5/6 native tables

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/MatcheventModel.php'
      - 'admin/src/Model/MatchplayerModel.php'
      - 'admin/src/Model/MatchrefereeModel.php'
      - 'admin/src/Model/MatchstaffModel.php'
      - 'admin/src/Model/TrainingdataModel.php'
      - 'admin/src/Model/TreetoModel.php'
      - 'admin/src/Model/TreetonodeModel.php'
      - 'admin/src/Table/MatcheventTable.php'
      - 'admin/src/Table/MatchplayerTable.php'
      - 'admin/src/Table/MatchrefereeTable.php'
      - 'admin/src/Table/MatchstaffTable.php'
      - 'admin/src/Table/SportsManagementTable.php'
      - 'admin/src/Table/TeamTrainingDataTable.php'
      - 'admin/src/Table/TreetoTable.php'
      - 'admin/src/Table/TreetonodeTable.php'
      - 'admin/tables/matchevent.php'
      - 'admin/tables/matchplayer.php'
      - 'admin/tables/matchreferee.php'
      - 'admin/tables/matchstaff.php'
      - 'admin/tables/teamtrainingdata.php'
      - 'admin/tables/treeto.php'
      - 'admin/tables/treetonode.php'
      - '.github/workflows/joomla5-6-native-tables.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/MatcheventModel.php'
      - 'admin/src/Model/MatchplayerModel.php'
      - 'admin/src/Model/MatchrefereeModel.php'
      - 'admin/src/Model/MatchstaffModel.php'
      - 'admin/src/Model/TrainingdataModel.php'
      - 'admin/src/Model/TreetoModel.php'
      - 'admin/src/Model/TreetonodeModel.php'
      - 'admin/src/Table/MatcheventTable.php'
      - 'admin/src/Table/MatchplayerTable.php'
      - 'admin/src/Table/MatchrefereeTable.php'
      - 'admin/src/Table/MatchstaffTable.php'
      - 'admin/src/Table/SportsManagementTable.php'
      - 'admin/src/Table/TeamTrainingDataTable.php'
      - 'admin/src/Table/TreetoTable.php'
      - 'admin/src/Table/TreetonodeTable.php'
      - 'admin/tables/matchevent.php'
      - 'admin/tables/matchplayer.php'
      - 'admin/tables/matchreferee.php'
      - 'admin/tables/matchstaff.php'
      - 'admin/tables/teamtrainingdata.php'
      - 'admin/tables/treeto.php'
      - 'admin/tables/treetonode.php'
      - '.github/workflows/joomla5-6-native-tables.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint native table slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/MatcheventModel.php
            admin/src/Model/MatchplayerModel.php
            admin/src/Model/MatchrefereeModel.php
            admin/src/Model/MatchstaffModel.php
            admin/src/Model/TrainingdataModel.php
            admin/src/Model/TreetoModel.php
            admin/src/Model/TreetonodeModel.php
            admin/src/Table/MatcheventTable.php
            admin/src/Table/MatchplayerTable.php
            admin/src/Table/MatchrefereeTable.php
            admin/src/Table/MatchstaffTable.php
            admin/src/Table/SportsManagementTable.php
            admin/src/Table/TeamTrainingDataTable.php
            admin/src/Table/TreetoTable.php
            admin/src/Table/TreetonodeTable.php
            admin/tables/matchevent.php
            admin/tables/matchplayer.php
            admin/tables/matchreferee.php
            admin/tables/matchstaff.php
            admin/tables/teamtrainingdata.php
            admin/tables/treeto.php
            admin/tables/treetonode.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate native table contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'require_once $helperFile' admin/src/Table/SportsManagementTable.php
          grep -Fq '$sportsManagementDb ?? $db' admin/src/Table/SportsManagementTable.php

          grep -Fq 'final class TeamTrainingDataTable extends SportsManagementTable' admin/src/Table/TeamTrainingDataTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_team_trainingdata', 'id', \$db)" admin/src/Table/TeamTrainingDataTable.php
          grep -Fq 'new TeamTrainingDataTable($this->getDatabase())' admin/src/Model/TrainingdataModel.php
          grep -Fq "class_alias(TeamTrainingDataTable::class, 'sportsmanagementTableTeamTrainingData')" admin/tables/teamtrainingdata.php

          grep -Fq 'final class MatcheventTable extends SportsManagementTable' admin/src/Table/MatcheventTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_match_event', 'id', \$db)" admin/src/Table/MatcheventTable.php
          grep -Fq 'new MatcheventTable($this->getDatabase())' admin/src/Model/MatcheventModel.php
          grep -Fq "class_alias(MatcheventTable::class, 'sportsmanagementTableMatchEvent')" admin/tables/matchevent.php

          grep -Fq 'final class MatchplayerTable extends SportsManagementTable' admin/src/Table/MatchplayerTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_match_player', 'id', \$db)" admin/src/Table/MatchplayerTable.php
          grep -Fq 'new MatchplayerTable($this->getDatabase())' admin/src/Model/MatchplayerModel.php
          grep -Fq '$this->match_id && $this->teamplayer_id' admin/src/Table/MatchplayerTable.php
          grep -Fq "class_alias(MatchplayerTable::class, 'sportsmanagementTableMatchplayer')" admin/tables/matchplayer.php

          grep -Fq 'final class MatchstaffTable extends SportsManagementTable' admin/src/Table/MatchstaffTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_match_staff', 'id', \$db)" admin/src/Table/MatchstaffTable.php
          grep -Fq 'new MatchstaffTable($this->getDatabase())' admin/src/Model/MatchstaffModel.php
          grep -Fq '$this->match_id && $this->team_staff_id' admin/src/Table/MatchstaffTable.php
          grep -Fq "class_alias(MatchstaffTable::class, 'sportsmanagementTableMatchStaff')" admin/tables/matchstaff.php

          grep -Fq 'final class MatchrefereeTable extends SportsManagementTable' admin/src/Table/MatchrefereeTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_match_referee', 'id', \$db)" admin/src/Table/MatchrefereeTable.php
          grep -Fq 'new MatchrefereeTable($this->getDatabase())' admin/src/Model/MatchrefereeModel.php
          grep -Fq '$this->match_id && $this->project_referee_id' admin/src/Table/MatchrefereeTable.php
          grep -Fq "class_alias(MatchrefereeTable::class, 'sportsmanagementTableMatchreferee')" admin/tables/matchreferee.php

          grep -Fq 'final class TreetoTable extends SportsManagementTable' admin/src/Table/TreetoTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_treeto', 'id', \$db)" admin/src/Table/TreetoTable.php
          grep -Fq 'new TreetoTable($this->getDatabase())' admin/src/Model/TreetoModel.php
          grep -Fq "class_alias(TreetoTable::class, 'sportsmanagementTableTreeto')" admin/tables/treeto.php

          grep -Fq 'final class TreetonodeTable extends SportsManagementTable' admin/src/Table/TreetonodeTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_treeto_node', 'id', \$db)" admin/src/Table/TreetonodeTable.php
          grep -Fq 'new TreetonodeTable($this->getDatabase())' admin/src/Model/TreetonodeModel.php
          grep -Fq "class_alias(TreetonodeTable::class, 'sportsmanagementTableTreetoNode')" admin/tables/treetonode.php

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Joomla\\CMS\\Filesystem\\(File|Folder|Path)|Joomla\\CMS\\Http\\|Table::getInstance\('
          if grep -ER "$legacy_re" \
            admin/src/Model/MatcheventModel.php \
            admin/src/Model/MatchplayerModel.php \
            admin/src/Model/MatchrefereeModel.php \
            admin/src/Model/MatchstaffModel.php \
            admin/src/Model/TrainingdataModel.php \
            admin/src/Model/TreetoModel.php \
            admin/src/Model/TreetonodeModel.php \
            admin/src/Table/MatcheventTable.php \
            admin/src/Table/MatchplayerTable.php \
            admin/src/Table/MatchrefereeTable.php \
            admin/src/Table/MatchstaffTable.php \
            admin/src/Table/SportsManagementTable.php \
            admin/src/Table/TeamTrainingDataTable.php \
            admin/src/Table/TreetoTable.php \
            admin/src/Table/TreetonodeTable.php \
            admin/tables/matchevent.php \
            admin/tables/matchplayer.php \
            admin/tables/matchreferee.php \
            admin/tables/matchstaff.php \
            admin/tables/teamtrainingdata.php \
            admin/tables/treeto.php \
            admin/tables/treetonode.php; then
            echo 'Native table slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
