name: Joomla 5/6 native tournament tree

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/JltournamenttreeModel.php'
      - 'site/src/View/Jltournamenttree/HtmlView.php'
      - 'site/src/Helper/TournamentTreePayload.php'
      - 'site/tmpl/jltournamenttree/default.php'
      - 'site/assets/js/sportsmanagement-tournament-tree.js'
      - 'site/assets/css/sportsmanagement-tournament-tree.css'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php'
      - 'admin/src/Field/JsmmenuitemsField.php'
      - '.github/tests/joomla56_tournament_tree_payload.php'
      - '.github/tests/joomla56_tournament_tree_native_view.php'
      - '.github/tests/joomla56_native_navigation_route_contract.php'
      - '.github/tests/joomla56_selected_function_phpdoc.php'
      - '.github/workflows/joomla5-6-native-tournament-tree.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax and file-header tags
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/Model/JltournamenttreeModel.php \
            site/src/Helper/TournamentTreePayload.php \
            site/src/View/Jltournamenttree/HtmlView.php \
            site/tmpl/jltournamenttree/default.php \
            modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php \
            admin/src/Field/JsmmenuitemsField.php \
            .github/tests/joomla56_tournament_tree_payload.php \
            .github/tests/joomla56_tournament_tree_native_view.php \
            .github/tests/joomla56_native_navigation_route_contract.php; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "Missing $tag in $file" >&2
                exit 1
              }
            done
          done

      - name: Validate standalone tournament data and legacy error privacy
        run: php -d error_reporting=-1 .github/tests/joomla56_tournament_tree_payload.php

      - name: Validate native MVC and safe tournament HTML
        run: php -d error_reporting=-1 .github/tests/joomla56_tournament_tree_native_view.php

      - name: Verify restored Joomla navigation option
        run: php -d error_reporting=-1 .github/tests/joomla56_native_navigation_route_contract.php

      - name: Verify renderer JavaScript syntax
        run: node --check site/assets/js/sportsmanagement-tournament-tree.js

      - name: Check migrated named function PHPDocs
        run: php .github/tests/joomla56_selected_function_phpdoc.php
