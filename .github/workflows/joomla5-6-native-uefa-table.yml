name: Joomla 5/6 native UEFA coefficient table

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Uefawertung/HtmlView.php'
      - 'site/src/Model/UefawertungModel.php'
      - 'site/tmpl/uefawertung/**'
      - '.github/tests/joomla56_uefa_native_view.php'
      - '.github/tests/joomla56_site_uefa_error_privacy.php'
      - '.github/tests/joomla56_selected_function_phpdoc.php'
      - '.github/workflows/joomla5-6-native-uefa-table.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uefa-table:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint Joomla UEFA PHP and verify required file headers
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/View/Uefawertung/HtmlView.php \
            site/src/Model/UefawertungModel.php \
            site/tmpl/uefawertung/default.php \
            .github/tests/joomla56_uefa_native_view.php \
            .github/tests/joomla56_site_uefa_error_privacy.php; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "Missing $tag in $file" >&2
                exit 1
              }
            done
          done

      - name: Render native coefficient table and protect year selection
        run: php -d error_reporting=-1 .github/tests/joomla56_uefa_native_view.php

      - name: Keep UEFA coefficient query errors private
        run: php -d error_reporting=-1 .github/tests/joomla56_site_uefa_error_privacy.php

      - name: Enforce named function PHPDocs
        run: php -d error_reporting=-1 .github/tests/joomla56_selected_function_phpdoc.php
