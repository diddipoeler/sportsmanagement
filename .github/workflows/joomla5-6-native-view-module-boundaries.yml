name: Joomla 5/6 native view and module boundaries

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  native-boundaries:
    name: Native views, XML workflows and module routing
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint migrated PHP paths
        shell: bash
        run: |
          files=(
            admin/src/View/Jlxmlexports/HtmlView.php
            admin/tmpl/jlxmlexports/default.php
            admin/src/View/Jlxmlimports/HtmlView.php
            admin/src/Model/JlxmlimportsModel.php
            admin/src/Model/JlxmlimportModel.php
            admin/src/Service/XmlEventImportService.php
            admin/src/Service/XmlPlaygroundImportService.php
            admin/src/Service/XmlPositionImportService.php
            admin/src/Service/XmlStatisticImportService.php
            admin/tmpl/jlxmlimports/default.php
            site/src/View/Treetonode/HtmlView.php
            site/tmpl/treetonode/default.php
            site/tmpl/treetonode/default_treetonode.php
            site/src/Model/JsonfeedModel.php
            site/src/Model/EditmatchModel.php
            site/src/Helper/ImageSelectHelper.php
            site/src/Helper/ModalImageHelper.php
            modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php
            modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
            modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php
            modules/mod_sportsmanagement_teamplayers/src/Helper/TeamPlayersHelper.php
            modules/mod_sportsmanagement_ranking/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_ranking/mod_sportsmanagement_ranking.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test -f site/tmpl/treetonode/default.xml

      - name: Guard native presentation boundaries
        shell: bash
        run: |
          export_files=(
            admin/src/View/Jlxmlexports/HtmlView.php
            admin/tmpl/jlxmlexports/default.php
          )
          if grep -E 'LegacyBootstrap|class_alias|sportsmanagementHelper|sportsmanagementView|JLoader' "${export_files[@]}"; then
            echo 'XML export regressed to legacy presentation code' >&2
            exit 1
          fi

          import_files=(
            admin/src/View/Jlxmlimports/HtmlView.php
            admin/src/Model/JlxmlimportsModel.php
            admin/tmpl/jlxmlimports/default.php
          )
          if grep -E 'LegacyBootstrap|class_alias|sportsmanagementHelper|sportsmanagementView|JSMCountries|JLoader' "${import_files[@]}"; then
            echo 'XML import landing path regressed to legacy presentation or database bootstrap' >&2
            exit 1
          fi

          import_model=admin/src/Model/JlxmlimportModel.php
          event_import_service=admin/src/Service/XmlEventImportService.php
          playground_import_service=admin/src/Service/XmlPlaygroundImportService.php
          position_import_service=admin/src/Service/XmlPositionImportService.php
          statistic_import_service=admin/src/Service/XmlStatisticImportService.php
          if grep -E 'Factory::getDbo|BaseDatabaseModel::getInstance|class_alias' "$import_model"; then
            echo 'XML import model facade regressed to removed Joomla database/model APIs' >&2
            exit 1
          fi
          if grep -E 'LegacyBootstrap|Factory::getDbo|BaseDatabaseModel::getInstance|sportsmanagementModeldatabasetool|require_once .*jlxmlimport' "$event_import_service"; then
            echo 'Standalone event import regressed to the legacy write engine' >&2
            exit 1
          fi
          if grep -E 'LegacyBootstrap|Factory::getDbo|BaseDatabaseModel::getInstance|sportsmanagementModeldatabasetool|sportsmanagementHelper|JSMCountries|require_once .*jlxmlimport' "$playground_import_service"; then
            echo 'Standalone playground import regressed to the legacy write engine' >&2
            exit 1
          fi
          if grep -E 'LegacyBootstrap|Factory::getDbo|BaseDatabaseModel::getInstance|sportsmanagementModeldatabasetool|require_once .*jlxmlimport' "$position_import_service"; then
            echo 'Standalone position import regressed to the legacy write engine' >&2
            exit 1
          fi
          if grep -E 'LegacyBootstrap|Factory::getDbo|BaseDatabaseModel::getInstance|sportsmanagementModeldatabasetool|require_once .*jlxmlimport' "$statistic_import_service"; then
            echo 'Standalone statistic import regressed to the legacy write engine' >&2
            exit 1
          fi

          site_files=(
            site/src/View/Treetonode/HtmlView.php
            site/tmpl/treetonode/default.php
            site/tmpl/treetonode/default_treetonode.php
          )
          if grep -E 'sportsmanagementHelper|sportsmanagementHelperRoute|sportsmanagementModelProject|Factory::getDate|JLoader' "${site_files[@]}"; then
            echo 'Treetonode regressed to legacy presentation code' >&2
            exit 1
          fi

          jsonfeed_model=site/src/Model/JsonfeedModel.php
          if grep -E 'class_exists\(GoogleCalendarReadService|require_once .*GoogleCalendarReadService' "$jsonfeed_model"; then
            echo 'JSON feed regressed to manual component service loading' >&2
            exit 1
          fi

          editmatch_model=site/src/Model/EditmatchModel.php
          if grep -E 'Factory::getDate' "$editmatch_model"; then
            echo 'Edit match model regressed to the removed Factory date API' >&2
            exit 1
          fi

          image_select_helper=site/src/Helper/ImageSelectHelper.php
          if grep -E 'sportsmanagementHelper|sportsmanagementHelperHtml|ensureLegacyModalHelpers|require_once|http_build_query' "$image_select_helper"; then
            echo 'Image selector regressed to legacy helpers or manual query building' >&2
            exit 1
          fi

          calendar_helper=modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php
          if grep -E 'JSMCountries|helpers/countries\.php' "$calendar_helper"; then
            echo 'Calendar helper regressed to the unused legacy country bootstrap' >&2
            exit 1
          fi

          module_file=modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
          if grep -E 'http_build_query|Joomla\\CMS\\Router\\Route|sportsmanagementHelperRoute|JRoute' "$module_file"; then
            echo 'Match slider regressed to manual or legacy routing' >&2
            exit 1
          fi

          randomplayer_module=modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php
          if grep -E 'http_build_query|Joomla\\CMS\\Router\\Route|sportsmanagementHelperRoute|JRoute' "$randomplayer_module"; then
            echo 'Random player regressed to manual or legacy routing' >&2
            exit 1
          fi

          teamplayers_module=modules/mod_sportsmanagement_teamplayers/src/Helper/TeamPlayersHelper.php
          if grep -E 'http_build_query|Joomla\\CMS\\Router\\Route|sportsmanagementHelperRoute|JRoute' "$teamplayers_module"; then
            echo 'Team players regressed to manual or legacy routing' >&2
            exit 1
          fi

          ranking_entry=modules/mod_sportsmanagement_ranking/mod_sportsmanagement_ranking.php
          ranking_dispatcher=modules/mod_sportsmanagement_ranking/src/Dispatcher/Dispatcher.php
          if grep -E 'RankingHelper|ModuleHelper|Factory::getApplication|require .*tmpl|require ModuleHelper' "$ranking_entry"; then
            echo 'Ranking module entry regressed to duplicate runtime execution' >&2
            exit 1
          fi

          grep -q 'CountryOptionsHelper::getOptions' admin/src/View/Jlxmlimports/HtmlView.php
          grep -q 'SportsManagementDatabaseResolver' admin/src/Model/JlxmlimportsModel.php
          grep -q 'getTemplateList' "$import_model"
          grep -q 'getNewClubListSelect' "$import_model"
          grep -q 'getClubAndTeamListSelect' "$import_model"
          grep -q 'RECORD_COLLECTIONS' "$import_model"
          grep -q 'LIBXML_NONET' "$import_model"
          grep -q 'XmlEventImportService' "$import_model"
          grep -q 'XmlPlaygroundImportService' "$import_model"
          grep -q 'XmlPositionImportService' "$import_model"
          grep -q 'XmlStatisticImportService' "$import_model"
          grep -q "'events' => new XmlEventImportService" "$import_model"
          grep -q "'playgrounds' => new XmlPlaygroundImportService" "$import_model"
          grep -q "'positions' => new XmlPositionImportService" "$import_model"
          grep -q "'statistics' => new XmlStatisticImportService" "$import_model"
          grep -q 'private function legacy' "$import_model"
          grep -q 'OutputFilter::stringURLSafe' "$event_import_service"
          grep -q '#__sportsmanagement_eventtype' "$event_import_service"
          grep -q 'PlaygroundGeocoder' "$playground_import_service"
          grep -q '#__sportsmanagement_playground' "$playground_import_service"
          grep -q 'club_id = 0' "$playground_import_service"
          grep -q 'dbPlaygroundID_' "$playground_import_service"
          grep -q 'OutputFilter::stringURLSafe' "$position_import_service"
          grep -q '#__sportsmanagement_position' "$position_import_service"
          grep -q 'parentPositionID_' "$position_import_service"
          grep -q 'dbParentPositionID_' "$position_import_service"
          grep -q 'OutputFilter::stringURLSafe' "$statistic_import_service"
          grep -q '#__sportsmanagement_statistic' "$statistic_import_service"
          grep -q 'findByNameAndClass' "$statistic_import_service"
          grep -q 'ProjectTitleHelper::format' site/src/View/Treetonode/HtmlView.php
          grep -q 'SiteRouteHelper::view' site/tmpl/treetonode/default_treetonode.php
          grep -q 'new GoogleCalendarReadService' "$jsonfeed_model"
          grep -q 'Joomla\\CMS\\Date\\Date' "$editmatch_model"
          grep -q 'new Date' "$editmatch_model"
          grep -q 'Uri::buildQuery' "$image_select_helper"
          grep -q 'ModalImageHelper::render' "$image_select_helper"
          grep -q 'ComponentHelper::getParams' "$image_select_helper"
          grep -q 'sportsmanagementHelperRoute' "$calendar_helper"
          grep -q 'SiteRouteHelper::view' "$module_file"
          grep -q 'SiteRouteHelper::view' "$randomplayer_module"
          grep -q 'SiteRouteHelper::view' "$teamplayers_module"
          grep -q 'registerAndUseStyle' "$ranking_dispatcher"
          grep -q 'getHelperFactory' "$ranking_dispatcher"
