name: Joomla 5/6 navigation menu gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  navigation-menu:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate navigation menu
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_navigation_menu
          manifest="$module/mod_sportsmanagement_navigation_menu.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/NavigationMenuHelper.php"
          test ! -d "$module/fields"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/NavigationMenuHelper.php"
          php -l "$module/mod_sportsmanagement_navigation_menu.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"
          node --check "$module/js/mod_sportsmanagement_navigation_menu.js"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementNavigationMenu</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q 'getWebAssetManager' "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'getInput()' "$module/src/Helper/NavigationMenuHelper.php"
          grep -q "d.parent_id > 0" "$module/src/Helper/NavigationMenuHelper.php"
          grep -q 'data-jsm-navigation-menu' "$module/tmpl/default.php"
          grep -q 'fetch(' "$module/js/mod_sportsmanagement_navigation_menu.js"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'Navigation menu manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|URI|Dbo)\(|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/NavigationMenuHelper.php" \
            "$module/mod_sportsmanagement_navigation_menu.php" \
            "$module/helper.php"; then
            echo 'Navigation menu PHP regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -E 'jQuery|\$\$|\.addEvent\(|new Request\(|eval\(' "$module/js/mod_sportsmanagement_navigation_menu.js"; then
            echo 'Navigation menu JavaScript regressed to MooTools/jQuery.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
