name: Joomla 5/6 navigation and projectteam portability
'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php'
      - 'admin/src/Model/ProjectteamModel.php'
      - 'site/src/Model/EditprojectteamModel.php'
      - '.github/tests/joomla56_navigation_projectteam_portability.php'
      - '.github/workflows/joomla5-6-navigation-projectteam-portability.yml'
  pull_request:
    branches: [joomla5-6, master]
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint, PHPDoc, navigation and project-team regressions
        shell: bash
        run: |
          set -euo pipefail
          php -l site/src/Model/EditprojectteamModel.php
          php -l admin/src/Model/ProjectteamModel.php
          php -l modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php
          php -l .github/tests/joomla56_navigation_projectteam_portability.php
          php .github/tests/phpdoc_metadata.php site/src/Model/EditprojectteamModel.php admin/src/Model/ProjectteamModel.php modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php
          php .github/tests/joomla56_navigation_projectteam_portability.php
          php .github/tests/joomla56_projectteam_trainingsdata_security.php
