name: Joomla 5/6 new project gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  new-project:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate new project module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_new_project
          manifest="$module/mod_sportsmanagement_new_project.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/NewProjectHelper.php"
          test -f "$module/tmpl/native.php"
          test -f "$module/js/native.js"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/NewProjectHelper.php"
          php -l "$module/mod_sportsmanagement_new_project.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/native.php"
          node --check "$module/js/native.js"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementNewProject</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q '<folder>js</folder>' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q 'registerAndUseStyle' "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'registerAndUseScript' "$module/src/Dispatcher/Dispatcher.php"
          grep -q "Session::checkToken('post')" "$module/src/Helper/NewProjectHelper.php"
          grep -q "getIdentity()" "$module/src/Helper/NewProjectHelper.php"
          grep -q "bootComponent('com_content')" "$module/src/Helper/NewProjectHelper.php"
          grep -q 'data-jsm-new-project' "$module/tmpl/native.php"
          grep -q 'fetch(' "$module/js/native.js"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'New project manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -q '<script' "$module/tmpl/native.php"; then
            echo 'New project native template regressed to inline JavaScript.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/NewProjectHelper.php" \
            "$module/mod_sportsmanagement_new_project.php" \
            "$module/helper.php" \
            "$module/tmpl/native.php"; then
            echo 'New project module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -E 'jQuery|\$\(|XMLHttpRequest|ActiveXObject|new Request\b|\.addEvent\(' "$module/js/native.js"; then
            echo 'New project AJAX runtime regressed to a legacy JavaScript API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
