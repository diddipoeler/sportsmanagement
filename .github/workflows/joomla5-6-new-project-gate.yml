name: Joomla 5/6 New Project Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  new-project:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate new project module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_new_project
          manifest="$module/mod_sportsmanagement_new_project.xml"
          provider="$module/services/provider.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/NewProjectHelper.php"
          entry="$module/mod_sportsmanagement_new_project.php"
          bridge="$module/helper.php"
          native="$module/tmpl/native.php"
          default="$module/tmpl/default.php"
          script="$module/js/native.js"

          test -f "$provider"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$native"
          test -f "$default"
          test -f "$script"
          test ! -e "$module/tmpl/default_old.php"

          php -l "$provider"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$entry"
          php -l "$bridge"
          php -l "$native"
          php -l "$default"
          node --check "$script"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_new_project/mod_sportsmanagement_new_project.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementNewProject</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_new_project">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq '<folder>js</folder>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'name="cache_time"' "$manifest"
          grep -Fq 'type="number"' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'HelperFactory' "$provider"
          grep -Fq 'registerAndUseStyle' "$dispatcher"
          grep -Fq 'registerAndUseScript' "$dispatcher"
          grep -Fq "data['params']->set('layout', 'native')" "$dispatcher"

          grep -Fq 'public function createArticlesAjax(): array' "$helper"
          grep -Fq "Session::checkToken('post')" "$helper"
          grep -Fq "post->getInt('module_id'" "$helper"
          grep -Fq 'mod_sportsmanagement_new_project' "$helper"
          grep -Fq "client_id') . ' = 0" "$helper"
          grep -Fq "published') . ' = 1" "$helper"
          grep -Fq "extension') . ' = ' . \$db->quote('com_content')" "$helper"
          grep -Fq "authorise('core.manage', 'com_sportsmanagement')" "$helper"
          grep -Fq "authorise('core.create', 'com_content.category.'" "$helper"
          grep -Fq "bootComponent('com_content')" "$helper"
          grep -Fq "createModel('Article', 'Administrator'" "$helper"
          grep -Fq "xreference' => 'sportsmanagement-project:'" "$helper"

          grep -Fq 'option=com_ajax&module=sportsmanagement_new_project&method=createArticles&format=json' "$native"
          grep -Fq "HTMLHelper::_('form.token')" "$native"
          grep -Fq "require __DIR__ . '/native.php';" "$default"
          ! grep -Fq '<script' "$native"

          grep -Fq 'fetch(' "$script"
          grep -Fq "method: 'POST'" "$script"
          grep -Fq 'new FormData(form)' "$script"
          grep -Fq "credentials: 'same-origin'" "$script"

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(|HTMLHelper::_\(.?sliders\.|JSMCountries|sportsmanagementHelperRoute' \
            "$provider" \
            "$dispatcher" \
            "$helper" \
            "$entry" \
            "$bridge" \
            "$module/tmpl"; then
            echo 'New project module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -E 'jQuery|\$\(|XMLHttpRequest|ActiveXObject|new Request\b|\.addEvent\(' "$script"; then
            echo 'New project AJAX runtime regressed to a legacy JavaScript API.' >&2
            exit 1
          fi
