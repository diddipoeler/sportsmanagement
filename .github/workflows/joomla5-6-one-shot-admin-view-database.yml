name: Joomla 5/6 one-shot administrator view database migration

on:
  push:
    branches:
      - joomla5-6

permissions:
  contents: write

jobs:
  migrate-admin-view-database:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expose model database and migrate views
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          view_root = Path('admin/src/View')
          views = sorted(view_root.rglob('*.php'))
          needle = '$model->getDatabase()'
          replacement = '$model->getSportsManagementDatabase()'
          hits = sum(path.read_text(encoding='utf-8').count(needle) for path in views)

          if hits not in (0, 4):
              raise SystemExit(f'Expected 4 or 0 administrator view database hits, found {hits}.')

          if hits == 4:
              for path in views:
                  text = path.read_text(encoding='utf-8')
                  if needle in text:
                      path.write_text(text.replace(needle, replacement), encoding='utf-8')

          common = Path('admin/src/Model/SportsManagementListModel.php')
          text = common.read_text(encoding='utf-8')
          signature = 'public function getSportsManagementDatabase(): DatabaseInterface'
          if signature not in text:
              marker = '    public function setDatabase(DatabaseInterface $db): void\n'
              method = "    /** Public database contract for administrator views and services. */\n    public function getSportsManagementDatabase(): DatabaseInterface\n    {\n        return $this->getDatabase();\n    }\n\n"
              if marker not in text:
                  raise SystemExit('Cannot place public database accessor in SportsManagementListModel.')
              text = text.replace(marker, method + marker, 1)
              common.write_text(text, encoding='utf-8')

          individual = Path('admin/src/Model/JlextindividualsportesModel.php')
          text = individual.read_text(encoding='utf-8')
          if signature not in text:
              marker = '    private function administratorApplication(): AdministratorApplication\n'
              method = "    /** Public database contract for the administrator view service. */\n    public function getSportsManagementDatabase(): DatabaseInterface\n    {\n        return $this->getDatabase();\n    }\n\n"
              if marker not in text:
                  raise SystemExit('Cannot place public database accessor in JlextindividualsportesModel.')
              text = text.replace(marker, method + marker, 1)
              individual.write_text(text, encoding='utf-8')
          PY

          hits="$(grep -R -n --include='*.php' -F -- '->getDatabase(' admin/src/View || true)"
          if [[ -n "$hits" ]]; then
            printf '%s\n' "$hits" >&2
            echo 'Administrator views still call protected getDatabase().' >&2
            exit 1
          fi

          grep -Fq 'public function getSportsManagementDatabase(): DatabaseInterface' admin/src/Model/SportsManagementListModel.php
          grep -Fq 'public function getSportsManagementDatabase(): DatabaseInterface' admin/src/Model/JlextindividualsportesModel.php

          files=(
            admin/src/Model/SportsManagementListModel.php
            admin/src/Model/JlextindividualsportesModel.php
            admin/src/View/Clubs/HtmlView.php
            admin/src/View/Divisions/HtmlView.php
            admin/src/View/Jlextindividualsportes/HtmlView.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
          done

          git diff --check

      - name: Commit migrated administrator database access
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- admin/src/Model admin/src/View; then
            echo 'No source changes to commit.'
            exit 0
          fi

          git config user.name 'diddipoeler'
          git config user.email 'diddipoeler@gmx.de'
          git add \
            admin/src/Model/SportsManagementListModel.php \
            admin/src/Model/JlextindividualsportesModel.php \
            admin/src/View/Clubs/HtmlView.php \
            admin/src/View/Divisions/HtmlView.php \
            admin/src/View/Jlextindividualsportes/HtmlView.php
          git commit -m 'Fix administrator view database access'
          git push origin HEAD:joomla5-6
