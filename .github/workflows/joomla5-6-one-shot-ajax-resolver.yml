name: Joomla 5/6 one-shot Ajax database resolver migration

on:
  push:
    branches:
      - joomla5-6

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate administrator Ajax database resolution
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from base64 import b64decode
          from pathlib import Path

          ajax = Path('admin/src/Model/AjaxModel.php')
          text = ajax.read_text(encoding='utf-8')

          old_import = "use Joomla\\CMS\\Factory;\n"
          new_import = "use Diddipoeler\\Component\\SportsManagement\\Administrator\\Helper\\SportsManagementDatabaseResolver;\nuse Joomla\\CMS\\Factory;\n"
          if 'Administrator\\Helper\\SportsManagementDatabaseResolver;' not in text:
              if old_import not in text:
                  raise SystemExit('AjaxModel Factory import anchor not found.')
              text = text.replace(old_import, new_import, 1)

          old_block = b64decode('').decode()
          new_block = b64decode('').decode()
          if old_block not in text:
              raise SystemExit('AjaxModel legacy database helper block not found.')
          ajax.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')

          gate = Path('.github/workflows/joomla5-6-public-container-runtime.yml')
          workflow = gate.read_text(encoding='utf-8')
          old_assert = "          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' \"$admin_ajax\"\n"
          new_assert = "          grep -Fq 'use Diddipoeler\\Component\\SportsManagement\\Administrator\\Helper\\SportsManagementDatabaseResolver;' \"$admin_ajax\"\n          grep -Fq '(new SportsManagementDatabaseResolver())->resolve($external ? 1 : 0)' \"$admin_ajax\"\n          grep -Fq 'return self::database(false);' \"$admin_ajax\"\n"
          if old_assert not in workflow:
              raise SystemExit('Public runtime Ajax assertion anchor not found.')
          workflow = workflow.replace(old_assert, new_assert, 1)

          exception = "          loader_hits=\"$(printf '%s\\n' \"$loader_hits\" | grep -v '^admin/src/Model/AjaxModel.php:' || true)\"\n"
          if exception not in workflow:
              raise SystemExit('AjaxModel loader exception not found.')
          workflow = workflow.replace(exception, '', 1)
          workflow = workflow.replace(
              "A native Joomla 5/6 runtime path still uses JLoader or jimport outside the explicit AjaxModel compatibility bridge.",
              "A native Joomla 5/6 runtime path still uses JLoader or jimport."
          )

          regression_anchor = "          if grep -E -- 'Factory::getDbo\\(|Factory::getDBO\\(|Factory::getUser\\(|Factory::getDocument\\(|Factory::getConfig\\(|->getCfg\\(' \"${files[@]}\"; then\n"
          regression = "          if grep -E 'sportsmanagementHelper|JLoader::|jimport\\(' \"$admin_ajax\"; then\n            echo 'Administrator AjaxModel regressed to the legacy database helper/loader.' >&2\n            exit 1\n          fi\n\n"
          if regression_anchor not in workflow:
              raise SystemExit('Public runtime final regression anchor not found.')
          workflow = workflow.replace(regression_anchor, regression + regression_anchor, 1)
          gate.write_text(workflow, encoding='utf-8')
          PY

          php -l admin/src/Model/AjaxModel.php
          php -l admin/src/Helper/SportsManagementDatabaseResolver.php
          git diff --check
          grep -Fq 'SportsManagementDatabaseResolver' admin/src/Model/AjaxModel.php
          ! grep -Eq 'sportsmanagementHelper|JLoader::|jimport\(' admin/src/Model/AjaxModel.php

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/src/Model/AjaxModel.php .github/workflows/joomla5-6-public-container-runtime.yml
          git commit -m 'Migrate administrator Ajax database resolver'
          git push origin HEAD:joomla5-6
