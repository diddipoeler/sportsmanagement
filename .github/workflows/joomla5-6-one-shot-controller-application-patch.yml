name: Joomla 5/6 one-shot controller application patch

on:
  push:
    branches:
      - joomla5-6

permissions:
  contents: write

jobs:
  patch-controller-application:
    if: github.event.head_commit.message == 'Apply native controller application migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: joomla5-6
          fetch-depth: 0

      - name: Replace unavailable controller accessors
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(grep -R -l --include='*.php' -F '$this->getApplication()' admin/src/Controller | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'Expected controller getApplication() hits but found none.' >&2
            exit 1
          fi

          printf 'Patching %d controllers:\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"

          python3 - <<'PY'
          from pathlib import Path

          root = Path('admin/src/Controller')
          files = sorted(p for p in root.rglob('*.php') if '$this->getApplication()' in p.read_text())
          if not files:
              raise SystemExit('No controller files contained getApplication().')

          total = 0
          for path in files:
              text = path.read_text()
              count = text.count('$this->getApplication()')
              text = text.replace('$this->getApplication()->getInput()', '$this->input')
              text = text.replace('$this->getApplication()', '$this->app')
              path.write_text(text)
              total += count

          if total != 44:
              raise SystemExit(f'Expected 44 controller getApplication() calls, found {total}.')
          print(f'Replaced {total} calls in {len(files)} files.')
          PY

          if grep -R -n --include='*.php' -F '$this->getApplication()' admin/src/Controller; then
            echo 'Controller getApplication() calls remain after patch.' >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/src/Controller
          git commit -m 'Use injected application in administrator controllers'
          git push origin HEAD:joomla5-6
