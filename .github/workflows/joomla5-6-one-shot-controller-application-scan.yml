name: Joomla 5/6 one-shot controller application scan

on:
  push:
    branches:
      - joomla5-6

jobs:
  scan-controller-application:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find unavailable controller application accessors
        shell: bash
        run: |
          set -euo pipefail
          hits="$(grep -R -n --include='*.php' -F '$this->getApplication()' admin/src/Controller || true)"
          if [[ -n "$hits" ]]; then
            printf '%s\n' "$hits" >&2
            echo 'Native administrator controllers still call unavailable getApplication().' >&2
            exit 1
          fi
          echo 'No native controller getApplication() calls found.'
