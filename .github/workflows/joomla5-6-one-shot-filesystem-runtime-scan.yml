name: Joomla 5/6 one-shot filesystem runtime scan

on:
  push:
    branches:
      - joomla5-6

jobs:
  scan-filesystem-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Joomla 6 filesystem and application removals
        shell: bash
        run: |
          set -euo pipefail

          roots=(admin/src site/src modules)
          filesystem_hits="$(grep -R -n --include='*.php' -F 'Joomla\CMS\Filesystem\' "${roots[@]}" || true)"
          platform_hits="$(grep -R -n --include='*.php' -F 'JPATH_PLATFORM' "${roots[@]}" || true)"
          application_class_hits="$(grep -R -n --include='*.php' -E 'Joomla\\CMS\\Application\\(BaseApplication|CliApplication)' "${roots[@]}" || true)"
          iscli_hits="$(grep -R -n --include='*.php' -F -- '->isCli(' "${roots[@]}" || true)"

          hits="${filesystem_hits}${platform_hits}${application_class_hits}${iscli_hits}"
          if [[ -n "$hits" ]]; then
            [[ -n "$filesystem_hits" ]] && printf '%s\n' "$filesystem_hits" >&2
            [[ -n "$platform_hits" ]] && printf '%s\n' "$platform_hits" >&2
            [[ -n "$application_class_hits" ]] && printf '%s\n' "$application_class_hits" >&2
            [[ -n "$iscli_hits" ]] && printf '%s\n' "$iscli_hits" >&2
            echo 'Joomla 6 filesystem/application compatibility dependencies remain in active paths.' >&2
            exit 1
          fi

          echo 'No scanned Joomla 6 filesystem/application removals found.'
