name: Joomla 5/6 one-shot loader runtime migration

on:
  push:
    branches:
      - joomla5-6

permissions:
  contents: write

jobs:
  migrate-loader-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy JLoader runtime access
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('site/src/Model/StatsModel.php'),
              Path('site/src/Model/TeaminfoModel.php'),
              Path('site/src/Model/ClubinfoModel.php'),
              Path('site/src/Legacy/CurveRankingAdapter.php'),
              Path('admin/src/Model/TemplatesModel.php'),
              Path('admin/src/Model/RoundsModel.php'),
              Path('admin/src/Model/DatabasetoolModel.php'),
              Path('admin/src/Model/TemplateModel.php'),
              Path('admin/src/Model/PredictiongamesModel.php'),
          ]

          total = sum(path.read_text(encoding='utf-8').count('JLoader::register') for path in files)
          if total not in (0, 11):
              raise SystemExit(f'Expected 11 or 0 JLoader::register hits, found {total}.')

          loader_pattern = re.compile(
              r"(?P<indent>^[ \t]*)\\JLoader::register\(\s*'[^']+'\s*,\s*(?P<path>[^;]+?)\s*\);",
              re.MULTILINE | re.DOTALL,
          )

          if total == 11:
              for path in files:
                  text = path.read_text(encoding='utf-8')

                  def replace_loader(match):
                      indent = match.group('indent')
                      source = match.group('path').strip()
                      return (
                          f"{indent}if (is_file({source})) {{\n"
                          f"{indent}    require_once {source};\n"
                          f"{indent}}}"
                      )

                  text = loader_pattern.sub(replace_loader, text)
                  path.write_text(text, encoding='utf-8')

          def add_import(path, import_line):
              text = path.read_text(encoding='utf-8')
              if import_line in text:
                  return
              marker = "\\defined('_JEXEC') or die;\n\n"
              if marker not in text:
                  raise SystemExit(f'Cannot place import in {path}.')
              path.write_text(text.replace(marker, marker + import_line + '\n', 1), encoding='utf-8')

          resolver_import = 'use Diddipoeler\\Component\\SportsManagement\\Administrator\\Helper\\SportsManagementDatabaseResolver;'
          for name in ('RoundsModel.php', 'DatabasetoolModel.php', 'PredictiongamesModel.php'):
              add_import(Path('admin/src/Model') / name, resolver_import)

          add_import(
              Path('site/src/Model/TeaminfoModel.php'),
              'use Diddipoeler\\Component\\SportsManagement\\Site\\Helper\\PersonAgeHelper;'
          )

          def replace_last_method(path, signature, body_lines):
              text = path.read_text(encoding='utf-8')
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f'Cannot find {signature.strip()} in {path}.')
              end = text.find('\n    }\n}', start)
              if end < 0:
                  raise SystemExit(f'Cannot find method end in {path}.')
              end += len('\n    }')
              method = signature + '\n    {\n' + '\n'.join(body_lines) + '\n    }'
              path.write_text(text[:start] + method + text[end:], encoding='utf-8')

          replace_last_method(
              Path('admin/src/Model/RoundsModel.php'),
              '    private static function getSportsManagementDatabase(int $databaseConfig = 0): DatabaseInterface',
              [
                  '        return (new SportsManagementDatabaseResolver())->resolve(',
                  '            $databaseConfig,',
                  '            Factory::getContainer()->get(DatabaseInterface::class)',
                  '        );',
              ],
          )

          replace_last_method(
              Path('admin/src/Model/DatabasetoolModel.php'),
              '    private static function sportsDatabase(): DatabaseInterface',
              [
                  '        return (new SportsManagementDatabaseResolver())->resolve(',
                  '            0,',
                  '            Factory::getContainer()->get(DatabaseInterface::class)',
                  '        );',
              ],
          )

          replace_last_method(
              Path('admin/src/Model/PredictiongamesModel.php'),
              '    private static function getSportsManagementDatabase(): DatabaseInterface',
              [
                  '        return (new SportsManagementDatabaseResolver())->resolve(',
                  '            0,',
                  '            Factory::getContainer()->get(DatabaseInterface::class)',
                  '        );',
              ],
          )

          team = Path('site/src/Model/TeaminfoModel.php')
          text = team.read_text(encoding='utf-8')
          text = re.sub(
              r"\n\s*if \(!class_exists\('sportsmanagementHelper'\)\) \{\s*if \(is_file\(JPATH_ADMINISTRATOR \. '/components/com_sportsmanagement/helpers/sportsmanagement.php'\)\) \{\s*require_once JPATH_ADMINISTRATOR \. '/components/com_sportsmanagement/helpers/sportsmanagement.php';\s*\}\s*\}\n",
              '\n',
              text,
              count=1,
          )
          old_age = '(float) \\sportsmanagementHelper::getAge($birthday, $referenceDay)'
          new_age = '(float) PersonAgeHelper::calculate($birthday, $referenceDay)'
          if old_age in text:
              text = text.replace(old_age, new_age, 1)
          elif new_age not in text:
              raise SystemExit('Cannot migrate Teaminfo age helper.')
          team.write_text(text, encoding='utf-8')
          PY

          loader_hits="$(grep -R -n --include='*.php' -E 'JLoader::|jimport\(' admin/src site/src || true)"
          if [[ -n "$loader_hits" ]]; then
            printf '%s\n' "$loader_hits" >&2
            echo 'Native administrator/site runtime still contains Joomla legacy loader calls.' >&2
            exit 1
          fi

          grep -Fq 'PersonAgeHelper::calculate($birthday, $referenceDay)' site/src/Model/TeaminfoModel.php
          grep -Fq '(new SportsManagementDatabaseResolver())->resolve(' admin/src/Model/RoundsModel.php
          grep -Fq '(new SportsManagementDatabaseResolver())->resolve(' admin/src/Model/DatabasetoolModel.php
          grep -Fq '(new SportsManagementDatabaseResolver())->resolve(' admin/src/Model/PredictiongamesModel.php

          files=(
            site/src/Model/StatsModel.php
            site/src/Model/TeaminfoModel.php
            site/src/Model/ClubinfoModel.php
            site/src/Legacy/CurveRankingAdapter.php
            admin/src/Model/TemplatesModel.php
            admin/src/Model/RoundsModel.php
            admin/src/Model/DatabasetoolModel.php
            admin/src/Model/TemplateModel.php
            admin/src/Model/PredictiongamesModel.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done

          git diff --check

      - name: Commit loader runtime migration
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- admin/src site/src; then
            echo 'No source changes to commit.'
            exit 0
          fi

          git config user.name 'diddipoeler'
          git config user.email 'diddipoeler@gmx.de'
          git add \
            site/src/Model/StatsModel.php \
            site/src/Model/TeaminfoModel.php \
            site/src/Model/ClubinfoModel.php \
            site/src/Legacy/CurveRankingAdapter.php \
            admin/src/Model/TemplatesModel.php \
            admin/src/Model/RoundsModel.php \
            admin/src/Model/DatabasetoolModel.php \
            admin/src/Model/TemplateModel.php \
            admin/src/Model/PredictiongamesModel.php
          git commit -m 'Remove remaining Joomla legacy loader calls'
          git push origin HEAD:joomla5-6
