name: Joomla 5/6 one-shot removed runtime scan

on:
  push:
    branches:
      - joomla5-6

jobs:
  scan-removed-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Joomla 6 removed runtime APIs
        shell: bash
        run: |
          set -euo pipefail

          roots=(admin/src site/src modules)

          factory_create_hits="$(grep -R -n --include='*.php' -E 'Factory::create(Config|Dbo|DBO|Mailer|Language|Document)\(' "${roots[@]}" || true)"
          behavior_hits="$(grep -R -n --include='*.php' -E "HTMLHelper::_\('(behavior\.(core|keepalive|multiselect|combobox)|jquery\.framework)'" "${roots[@]}" || true)"
          html_registry_hits="$(grep -R -n --include='*.php' -E 'HTMLHelper::(addIncludePath|register|unregister)\(' "${roots[@]}" || true)"
          toolbar_hits="$(grep -R -n --include='*.php' -F 'Toolbar::getInstance(' "${roots[@]}" || true)"

          hits="${factory_create_hits}${behavior_hits}${html_registry_hits}${toolbar_hits}"
          if [[ -n "$hits" ]]; then
            [[ -n "$factory_create_hits" ]] && printf '%s\n' "$factory_create_hits" >&2
            [[ -n "$behavior_hits" ]] && printf '%s\n' "$behavior_hits" >&2
            [[ -n "$html_registry_hits" ]] && printf '%s\n' "$html_registry_hits" >&2
            [[ -n "$toolbar_hits" ]] && printf '%s\n' "$toolbar_hits" >&2
            echo 'Joomla 6 removed/deprecated runtime APIs remain in active paths.' >&2
            exit 1
          fi

          echo 'No scanned Joomla 6 removed runtime APIs found.'
