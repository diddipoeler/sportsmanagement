name: Joomla 5/6 OpenLigaDB external preview safety

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Service/OpenLigaDbPreviewService.php'
      - 'site/extensions/jsmopenligadb/admin/views/jsmopenligadb/view.html.php'
      - 'site/extensions/jsmopenligadb/admin/models/jsmopenligadb.php'
      - '.github/tests/joomla56_openligadb_url_security.php'
      - '.github/workflows/joomla5-6-openligadb-preview-security.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Service/OpenLigaDbPreviewService.php'
      - 'site/extensions/jsmopenligadb/admin/views/jsmopenligadb/view.html.php'
      - 'site/extensions/jsmopenligadb/admin/models/jsmopenligadb.php'
      - '.github/tests/joomla56_openligadb_url_security.php'
      - '.github/workflows/joomla5-6-openligadb-preview-security.yml'

permissions:
  contents: read

jobs:
  openligadb-preview-safety:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax and required PHPDoc
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Service/OpenLigaDbPreviewService.php
            site/extensions/jsmopenligadb/admin/views/jsmopenligadb/view.html.php
            site/extensions/jsmopenligadb/admin/models/jsmopenligadb.php
          )
          php .github/tests/phpdoc_metadata.php "${files[@]}"
          for file in "${files[@]}" .github/tests/joomla56_openligadb_url_security.php; do
            php -l "$file"
          done

      - name: OpenLigaDB URL, JSON and adapter regression
        run: php .github/tests/joomla56_openligadb_url_security.php
