name: Joomla 5/6 person admin and randomplayer input safety

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/EditpersonModel.php'
      - 'admin/src/Model/PlayersModel.php'
      - 'modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php'
      - '.github/tests/joomla56_person_players_randomplayer_inputs.php'
      - '.github/workflows/joomla5-6-person-players-randomplayer-inputs.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/EditpersonModel.php'
      - 'admin/src/Model/PlayersModel.php'
      - 'modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php'
      - '.github/tests/joomla56_person_players_randomplayer_inputs.php'
      - '.github/workflows/joomla5-6-person-players-randomplayer-inputs.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax and metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Model/EditpersonModel.php
            admin/src/Model/PlayersModel.php
            modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php
            .github/tests/joomla56_person_players_randomplayer_inputs.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Validate native person forms and selected IDs
        shell: bash
        run: |
          set -euo pipefail
          php .github/tests/joomla56_person_players_randomplayer_inputs.php
          php .github/tests/joomla56_editor_admin_module_contract.php
