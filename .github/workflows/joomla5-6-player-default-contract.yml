name: Joomla 5/6 player rendering contract

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/player/default.php'
      - 'site/tmpl/player/default_description.php'
      - 'site/tmpl/player/default_info.php'
      - 'site/tmpl/player/default_playfield.php'
      - 'site/tmpl/player/default_status.php'
      - 'site/tmpl/player/default_playercareer.php'
      - 'site/tmpl/player/default_playerstaffcareer.php'
      - 'site/views/player/tmpl/default_description.php'
      - 'site/views/player/tmpl/default_info.php'
      - 'site/views/player/tmpl/default_playfield.php'
      - 'site/views/player/tmpl/default_status.php'
      - 'site/views/player/tmpl/default_playercareer.php'
      - 'site/views/player/tmpl/default_playerstaffcareer.php'
      - 'site/src/View/Player/HtmlView.php'
      - 'site/src/Helper/ExtraFieldsReadHelper.php'
      - 'site/tmpl/globalviews/default_extrafields.php'
      - '.github/workflows/joomla5-6-player-default-contract.yml'
  pull_request:
    paths:
      - 'site/tmpl/player/default.php'
      - 'site/tmpl/player/default_description.php'
      - 'site/tmpl/player/default_info.php'
      - 'site/tmpl/player/default_playfield.php'
      - 'site/tmpl/player/default_status.php'
      - 'site/tmpl/player/default_playercareer.php'
      - 'site/tmpl/player/default_playerstaffcareer.php'
      - 'site/views/player/tmpl/default_description.php'
      - 'site/views/player/tmpl/default_info.php'
      - 'site/views/player/tmpl/default_playfield.php'
      - 'site/views/player/tmpl/default_status.php'
      - 'site/views/player/tmpl/default_playercareer.php'
      - 'site/views/player/tmpl/default_playerstaffcareer.php'
      - 'site/src/View/Player/HtmlView.php'
      - 'site/src/Helper/ExtraFieldsReadHelper.php'
      - 'site/tmpl/globalviews/default_extrafields.php'
      - '.github/workflows/joomla5-6-player-default-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate player rendering path
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/tmpl/player/default.php \
            site/tmpl/player/default_description.php \
            site/tmpl/player/default_info.php \
            site/tmpl/player/default_playfield.php \
            site/tmpl/player/default_status.php \
            site/tmpl/player/default_playercareer.php \
            site/tmpl/player/default_playerstaffcareer.php \
            site/views/player/tmpl/default_description.php \
            site/views/player/tmpl/default_info.php \
            site/views/player/tmpl/default_playfield.php \
            site/views/player/tmpl/default_status.php \
            site/views/player/tmpl/default_playercareer.php \
            site/views/player/tmpl/default_playerstaffcareer.php \
            site/src/View/Player/HtmlView.php \
            site/src/Helper/ExtraFieldsReadHelper.php \
            site/tmpl/globalviews/default_extrafields.php; do
            php -l "$file"
          done

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('site/tmpl/player/default.php'),
              Path('site/tmpl/player/default_description.php'),
              Path('site/tmpl/player/default_info.php'),
              Path('site/tmpl/player/default_playfield.php'),
              Path('site/tmpl/player/default_status.php'),
              Path('site/tmpl/player/default_playercareer.php'),
              Path('site/tmpl/player/default_playerstaffcareer.php'),
              Path('site/views/player/tmpl/default_description.php'),
              Path('site/views/player/tmpl/default_info.php'),
              Path('site/views/player/tmpl/default_playfield.php'),
              Path('site/views/player/tmpl/default_status.php'),
              Path('site/views/player/tmpl/default_playercareer.php'),
              Path('site/views/player/tmpl/default_playerstaffcareer.php'),
              Path('site/src/View/Player/HtmlView.php'),
              Path('site/src/Helper/ExtraFieldsReadHelper.php'),
              Path('site/tmpl/globalviews/default_extrafields.php'),
          ]

          for file in files:
              content = file.read_text(encoding='utf-8')
              for tag in ('@version', '@author', '@copyright', '@license'):
                  if tag not in content:
                      raise SystemExit(f'{file}: required metadata missing: {tag}')

          native_layouts = [
              Path('site/tmpl/player/default.php'),
              Path('site/tmpl/player/default_description.php'),
              Path('site/tmpl/player/default_info.php'),
              Path('site/tmpl/player/default_playfield.php'),
              Path('site/tmpl/player/default_status.php'),
              Path('site/tmpl/player/default_playercareer.php'),
              Path('site/tmpl/player/default_playerstaffcareer.php'),
          ]
          for file in native_layouts:
              content = file.read_text(encoding='utf-8')
              for legacy in (
                  'sportsmanagementHelper::',
                  'sportsmanagementHelperHtml::',
                  'sportsmanagementHelperRoute::',
                  'JSMCountries::',
              ):
                  if legacy in content:
                      raise SystemExit(f'{file}: legacy dependency returned: {legacy}')

          layout = Path('site/tmpl/player/default.php').read_text(encoding='utf-8')
          for needle in (
              "echo $this->loadTemplate('projectheading');",
              "echo $this->loadTemplate('info');",
              "echo $this->loadTemplate($config['show_players_layout'] ?? 'no_tabs');",
              "echo $this->loadTemplate('jsminfo');",
          ):
              if needle not in layout:
                  raise SystemExit(f'Player default rendering contract missing: {needle}')

          info = Path('site/tmpl/player/default_info.php').read_text(encoding='utf-8')
          for needle in (
              'PersonImageHelper::resolve(',
              'ModalImageHelper::render(',
              'CountryPresentationHelper::flag(',
              'PersonAgeHelper::calculate(',
              'PersonProfileRouteHelper::',
              "$this->loadTemplate('playfield')",
          ):
              if needle not in info:
                  raise SystemExit(f'Player info native contract missing: {needle}')

          status = Path('site/tmpl/player/default_status.php').read_text(encoding='utf-8')
          for needle in (
              "'injured.gif'",
              "'suspension.gif'",
              "'away.gif'",
              'HTMLHelper::date(',
              "$this->escape($status['detail'])",
          ):
              if needle not in status:
                  raise SystemExit(f'Player status native contract missing: {needle}')

          career = Path('site/tmpl/player/default_playercareer.php').read_text(encoding='utf-8')
          for needle in (
              "SiteRouteHelper::view('player'",
              "SiteRouteHelper::view('teaminfo'",
              'ModalImageHelper::render(',
              "ComponentHelper::getParams('com_sportsmanagement')",
              "get('ph_logo_big'",
              "get('ph_team'",
          ):
              if needle not in career:
                  raise SystemExit(f'Player career native contract missing: {needle}')

          staff_career = Path('site/tmpl/player/default_playerstaffcareer.php').read_text(encoding='utf-8')
          for needle in (
              "SiteRouteHelper::view('player'",
              "SiteRouteHelper::view('roster'",
              'show_staffcareer_teamlink',
          ):
              if needle not in staff_career:
                  raise SystemExit(f'Player staff career native contract missing: {needle}')

          bridges = {
              Path('site/views/player/tmpl/default_description.php'): '/tmpl/player/default_description.php',
              Path('site/views/player/tmpl/default_info.php'): '/tmpl/player/default_info.php',
              Path('site/views/player/tmpl/default_playfield.php'): '/tmpl/player/default_playfield.php',
              Path('site/views/player/tmpl/default_status.php'): '/tmpl/player/default_status.php',
              Path('site/views/player/tmpl/default_playercareer.php'): '/tmpl/player/default_playercareer.php',
              Path('site/views/player/tmpl/default_playerstaffcareer.php'): '/tmpl/player/default_playerstaffcareer.php',
          }
          for file, target in bridges.items():
              content = file.read_text(encoding='utf-8')
              if target not in content or 'require JPATH_SITE' not in content:
                  raise SystemExit(f'{file}: compatibility bridge target missing: {target}')

          view = Path('site/src/View/Player/HtmlView.php').read_text(encoding='utf-8')
          if 'sportsmanagementHelper::' in view:
              raise SystemExit('Player HtmlView regressed to sportsmanagementHelper')
          for needle in (
              'ExtraFieldsReadHelper::hasFields(',
              'ExtraFieldsReadHelper::load(',
              "$playerModel->getSportsManagementDatabase()",
              "'player'",
              'views/player/tmpl',
          ):
              if needle not in view:
                  raise SystemExit(f'Player HtmlView native contract missing: {needle}')

          helper = Path('site/src/Helper/ExtraFieldsReadHelper.php').read_text(encoding='utf-8')
          for needle in (
              'DatabaseInterface $db',
              'template_frontend',
              '#__sportsmanagement_user_extra_fields_values',
              'loadObjectList()',
          ):
              if needle not in helper:
                  raise SystemExit(f'ExtraFieldsReadHelper contract missing: {needle}')

          extra_layout = Path('site/tmpl/globalviews/default_extrafields.php').read_text(encoding='utf-8')
          for needle in (
              "$viewName === 'player'",
              '$this->extrafields',
              '$this->playername',
              'ExtraFieldsReadHelper::load(',
          ):
              if needle not in extra_layout:
                  raise SystemExit(f'Frontend extra fields layout contract missing: {needle}')

          print('Joomla 5/6 player rendering contract OK')
          PY
