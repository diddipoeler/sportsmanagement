name: Joomla 5/6 Playground Ticker Gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_playground_ticker/**'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-playground-ticker-gate.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_playground_ticker/**'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-playground-ticker-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate playground ticker module
        shell: bash
        run: |
          set -euo pipefail

          module=modules/mod_sportsmanagement_playground_ticker
          manifest="$module/mod_sportsmanagement_playground_ticker.xml"
          provider="$module/services/provider.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/PlaygroundTickerHelper.php"
          bridge="$module/helper.php"
          entry="$module/mod_sportsmanagement_playground_ticker.php"
          template="$module/tmpl/default.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php

          for file in "$provider" "$dispatcher" "$helper" "$bridge" "$entry" "$template" "$resolver"; do
            test -f "$file"
            php -l "$file"
          done

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_playground_ticker/mod_sportsmanagement_playground_ticker.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementPlaygroundTicker</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_playground_ticker">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'name="limit" type="number" min="1" default="1"' "$manifest"
          grep -Fq 'name="picture_width" type="number" min="30" max="1200" default="150"' "$manifest"
          grep -Fq 'name="title_size" type="number" min="10" max="96" default="18"' "$manifest"
          grep -Fq 'name="text_size" type="number" min="8" max="72" default="14"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"
          ! grep -Fq 'table-condensed' "$manifest"

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'HelperFactory' "$provider"
          grep -Fq 'registerAndUseStyle' "$dispatcher"
          grep -Fq "useScript('bootstrap.carousel')" "$dispatcher"
          grep -Fq "load('com_sportsmanagement', JPATH_SITE" "$dispatcher"

          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$helper"
          grep -Fq "params->get('cfg_which_database'" "$helper"

          grep -Fq 'data-bs-ride="carousel"' "$template"
          grep -Fq 'data-bs-slide="prev"' "$template"
          grep -Fq 'carousel-item' "$template"
          grep -Fq 'htmlspecialchars' "$template"
          grep -Fq 'loading="lazy"' "$template"
          grep -Fq "params->get('field_type'" "$template"
          grep -Fq "max(30, min(1200, (int) \$params->get('picture_width', 150)))" "$template"
          grep -Fq "max(8, min(72, (int) \$params->get('text_size', 14)))" "$template"
          grep -Fq "max(10, min(96, (int) \$params->get('title_size', 18)))" "$template"

          grep -Fq 'active module is booted by services/provider.php' "$entry"
          ! grep -Fq 'PlaygroundTickerHelper' "$entry"
          ! grep -Fq 'ModuleHelper::getLayoutPath' "$entry"

          if grep -REn 'sportsmanagementHelper|sportsmanagementHelper::getDBConnection|getDBConnection\(|administrator/components/com_sportsmanagement/helpers/sportsmanagement\.php|Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$provider" "$dispatcher" "$helper" "$entry" "$template"; then
            echo 'Playground ticker regressed to a legacy Joomla or SportsManagement runtime.' >&2
            exit 1
          fi

          if grep -REn 'curl_init\(|data-slide=|data-ride=|class="item|hidden-xs|pull-right|img-responsive' "$template"; then
            echo 'Playground ticker layout regressed to legacy cURL or Bootstrap 3 markup.' >&2
            exit 1
          fi
