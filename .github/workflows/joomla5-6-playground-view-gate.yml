name: Joomla 5/6 Playground View Gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/playground/**'
      - 'site/views/nextmatch/view.html.php'
      - 'site/src/Model/PlaygroundModel.php'
      - 'site/src/Model/TeamsModel.php'
      - 'site/models/playground.php'
      - 'site/models/teams.php'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-playground-view-gate.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'site/views/playground/**'
      - 'site/views/nextmatch/view.html.php'
      - 'site/src/Model/PlaygroundModel.php'
      - 'site/src/Model/TeamsModel.php'
      - 'site/models/playground.php'
      - 'site/models/teams.php'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/workflows/joomla5-6-playground-view-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate playground view migration
        shell: bash
        run: |
          set -euo pipefail

          view=site/views/playground/view.html.php
          teams=site/src/Model/TeamsModel.php
          playground=site/src/Model/PlaygroundModel.php
          playground_bridge=site/models/playground.php
          teams_bridge=site/models/teams.php
          nextmatch=site/views/nextmatch/view.html.php
          resolver=site/src/Service/SportsManagementDatabaseResolver.php

          for file in "$view" "$teams" "$playground" "$playground_bridge" "$teams_bridge" "$nextmatch" "$resolver"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq "bootComponent('com_sportsmanagement')" "$view"
          grep -Fq "createModel('Teams', 'Site'" "$view"
          grep -Fq "createModel('Playground', 'Site'" "$view"
          grep -Fq 'getTeamsByPlayground' "$view"
          grep -Fq 'getPlaygroundNotic' "$view"
          grep -Fq 'getNextGames' "$view"
          grep -Fq 'getTeamsFromMatches' "$view"
          grep -Fq 'getWebAssetManager' "$view"
          ! grep -Fq 'BaseDatabaseModel::getInstance' "$view"
          ! grep -Fq 'BaseDatabaseModel' "$view"
          ! grep -Fq 'addStyleSheet(' "$view"

          grep -Fq 'public function getTeamsByPlayground' "$teams"
          grep -Fq 'public function getTeamsFromMatches' "$teams"
          grep -Fq "pt.standard_playground" "$teams"
          grep -Fq "#__sportsmanagement_team" "$teams"

          grep -Fq 'public static function getPlayground' "$playground"
          grep -Fq 'public static function updateHits' "$playground"
          grep -Fq 'public function getPlaygroundNotic' "$playground"
          grep -Fq 'public function getAddressString' "$playground"
          grep -Fq 'public function getNextGames' "$playground"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$playground"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$playground"

          grep -Fq "class_alias(PlaygroundModel::class, 'sportsmanagementModelPlayground')" "$playground_bridge"
          grep -Fq "class_alias(TeamsModel::class, 'sportsmanagementModelTeams')" "$teams_bridge"
          grep -Fq 'sportsmanagementModelPlayground::getPlayground' "$nextmatch"

          if grep -REn 'Factory::getDbo\(|Factory::getDBO\(|getDBConnection\(|sportsmanagementHelper::getDBConnection|JDatabaseDriver|JDatabase::|->disconnect\(|BaseDatabaseModel::getInstance\(' \
            "$playground" "$teams" "$view"; then
            echo 'Playground view/model path regressed to a legacy database or model bootstrap.' >&2
            exit 1
          fi
