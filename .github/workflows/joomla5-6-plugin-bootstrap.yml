name: Joomla 5/6 bootstrap plugin

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'plugins/jsm_bootstrap/**'
      - '.github/workflows/joomla5-6-plugin-bootstrap.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/jsm_bootstrap/**'
      - '.github/workflows/joomla5-6-plugin-bootstrap.yml'

jobs:
  bootstrap-plugin:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint plugin PHP
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find plugins/jsm_bootstrap -type f -name '*.php' -print0)

      - name: Validate Joomla 5/6 plugin structure
        shell: bash
        run: |
          manifest=plugins/jsm_bootstrap/jsm_bootstrap.xml
          provider=plugins/jsm_bootstrap/services/provider.php
          extension=plugins/jsm_bootstrap/src/Extension/SportsmanagementBootstrap.php
          legacy=plugins/jsm_bootstrap/jsm_bootstrap.php

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('plugins/jsm_bootstrap/jsm_bootstrap.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Plugin\System\SportsmanagementBootstrap</namespace>' "$manifest"
          grep -Fq '<folder plugin="jsm_bootstrap">services</folder>' "$manifest"
          grep -Fq 'joomla.form.field.radio.switcher' "$manifest"
          grep -Fq '<option value="5">Bootstrap 5</option>' "$manifest"
          grep -Fq 'PluginInterface::class' "$provider"
          grep -Fq "PluginHelper::getPlugin('system', 'jsm_bootstrap')" "$provider"
          grep -Fq 'implements SubscriberInterface' "$extension"
          grep -Fq "'onAfterDispatch' => 'onAfterDispatch'" "$extension"
          grep -Fq 'use Joomla\CMS\Document\HtmlDocument;' "$extension"
          grep -Fq 'instanceof HtmlDocument' "$extension"
          grep -Fq 'getWebAssetManager()' "$extension"
          grep -Fq "useStyle('bootstrap.css')" "$extension"
          grep -Fq "useScript('bootstrap.'" "$extension"
          grep -Fq 'registerAndUseScript' "$extension"
          grep -Fq 'dataTables.bootstrap5.min.js' "$extension" || grep -Fq "'5' => 'bootstrap5'" "$extension"
          grep -Fq "class_alias(SportsmanagementBootstrap::class, 'PlgSystemjsm_bootstrap')" "$legacy"

          if grep -E 'jimport\(|version_compare\(JVERSION|->_scripts|ajax\.googleapis\.com/ajax/libs/jquery/2\.2\.1|netdna\.bootstrapcdn\.com|maxcdn\.bootstrapcdn\.com' "$extension" "$legacy"; then
            echo 'Bootstrap plugin still contains a legacy Joomla/bootstrap injection path' >&2
            exit 1
          fi
