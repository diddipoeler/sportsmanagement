name: Joomla 5/6 ISH update plugin

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'plugins/jsm_ishupdate/**'
      - 'site/src/Service/InlineHockeyApiClient.php'
      - 'site/src/Service/InlineHockeyProjectService.php'
      - '.github/workflows/joomla5-6-plugin-ishupdate.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/jsm_ishupdate/**'
      - 'site/src/Service/InlineHockeyApiClient.php'
      - 'site/src/Service/InlineHockeyProjectService.php'
      - '.github/workflows/joomla5-6-plugin-ishupdate.yml'

jobs:
  ishupdate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint plugin PHP
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find plugins/jsm_ishupdate -type f -name '*.php' -print0)
          php -l site/src/Service/InlineHockeyApiClient.php
          php -l site/src/Service/InlineHockeyProjectService.php

      - name: Validate Joomla 5/6 plugin structure
        shell: bash
        run: |
          manifest=plugins/jsm_ishupdate/jsm_ishupdate.xml
          provider=plugins/jsm_ishupdate/services/provider.php
          extension=plugins/jsm_ishupdate/src/Extension/SportsmanagementIshupdate.php
          service=plugins/jsm_ishupdate/src/Service/InlineHockeyUpdateService.php
          api_client=site/src/Service/InlineHockeyApiClient.php
          project_service=site/src/Service/InlineHockeyProjectService.php
          legacy=plugins/jsm_ishupdate/jsm_ishupdate.php

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('plugins/jsm_ishupdate/jsm_ishupdate.xml')
          PY

          test -f "$service"
          test -f "$api_client"
          test -f "$project_service"
          grep -Fq '<namespace path="src">Diddipoeler\Plugin\System\SportsmanagementIshupdate</namespace>' "$manifest"
          grep -Fq '<folder plugin="jsm_ishupdate">services</folder>' "$manifest"
          grep -Fq 'joomla.form.field.radio.switcher' "$manifest"
          grep -Fq 'PluginInterface::class' "$provider"
          grep -Fq 'DatabaseInterface::class' "$provider"
          grep -Fq 'implements SubscriberInterface' "$extension"
          grep -Fq "'onAfterRoute' => 'onAfterRoute'" "$extension"
          grep -Fq "'onBeforeRender' => 'onBeforeRender'" "$extension"
          grep -Fq 'DatabaseAwareTrait' "$extension"
          grep -Fq 'ParameterType::INTEGER' "$extension"
          grep -Fq "isClient('site')" "$extension"
          grep -Fq "getCmd('option') !== 'com_sportsmanagement'" "$extension"
          grep -Fq 'InlineHockeyUpdateService' "$extension"
          grep -Fq 'new InlineHockeyUpdateService($this->getDatabase())' "$extension"

          grep -Fq 'final class InlineHockeyUpdateService' "$service"
          grep -Fq 'DatabaseInterface $db' "$service"
          grep -Fq 'InlineHockeyApiClient' "$service"
          grep -Fq 'InlineHockeyProjectService' "$service"
          grep -Fq '$this->projects->getMatchLink($projectId)' "$service"
          grep -Fq '$this->api->fetchJson(' "$service"
          grep -Fq '$this->api->pageUrl(' "$service"
          grep -Fq "updateObject('#__sportsmanagement_match'" "$service"
          grep -Fq "m.import_match_id') . ' = :externalId'" "$service"
          grep -Fq "r.project_id') . ' = :projectId'" "$service"

          grep -Fq 'final class InlineHockeyApiClient' "$api_client"
          grep -Fq 'use Joomla\Http\HttpFactory;' "$api_client"
          grep -Fq 'HttpFactory::getHttp()->get' "$api_client"
          grep -Fq 'JSON_THROW_ON_ERROR' "$api_client"
          grep -Fq 'function pageUrl' "$api_client"

          grep -Fq 'final class InlineHockeyProjectService' "$project_service"
          grep -Fq 'function getMatchLink' "$project_service"
          grep -Fq 'function ensureProjectTeam' "$project_service"
          grep -Fq "class_alias(SportsmanagementIshupdate::class, 'PlgSystemjsm_ishupdate')" "$legacy"

          if grep -Fq 'private function getMatchLink' "$service"; then
            echo 'ISH update service duplicated project metadata lookup.' >&2
            exit 1
          fi

          if grep -E 'sportsmanagementModeljsminlinehockey|extensions/jsminlinehockey/admin/models/jsminlinehockey\.php|sportsmanagementHelper::|curl_|CURLOPT_SSL_VERIFYPEER|Joomla\\CMS\\Http\\HttpFactory|jimport\(|BaseDatabaseModel::getInstance|Factory::getDBO|Factory::getDbo|->input|version_compare\(JVERSION' "$extension" "$service" "$api_client" "$project_service" "$legacy"; then
            echo 'ISH update plugin regressed to a legacy Joomla/Inline-Hockey update path' >&2
            exit 1
          fi
