name: Joomla 5/6 JComments plugin

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'plugins/jsm_jcomments/**'
      - '.github/workflows/joomla5-6-plugin-jcomments.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/jsm_jcomments/**'
      - '.github/workflows/joomla5-6-plugin-jcomments.yml'

jobs:
  jcomments:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint plugin PHP
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find plugins/jsm_jcomments -type f -name '*.php' -print0)

      - name: Validate Joomla 5/6 plugin structure
        shell: bash
        run: |
          manifest=plugins/jsm_jcomments/sportsmanagement_comments.xml
          provider=plugins/jsm_jcomments/services/provider.php
          extension=plugins/jsm_jcomments/src/Extension/SportsmanagementComments.php
          legacy=plugins/jsm_jcomments/sportsmanagement_comments.php

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('plugins/jsm_jcomments/sportsmanagement_comments.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Plugin\Content\SportsmanagementComments</namespace>' "$manifest"
          grep -Fq '<folder plugin="sportsmanagement_comments">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'joomla.form.field.radio.switcher' "$manifest"
          grep -Fq 'PluginInterface::class' "$provider"
          grep -Fq "PluginHelper::getPlugin('content', 'sportsmanagement_comments')" "$provider"
          grep -Fq 'final class SportsmanagementComments extends CMSPlugin' "$extension"
          grep -Fq 'onMatchReportComments' "$extension"
          grep -Fq 'onNextMatchComments' "$extension"
          grep -Fq 'onMatchComments' "$extension"
          grep -Fq "class_alias(SportsmanagementComments::class, 'plgContentSportsmanagement_Comments')" "$legacy"

          if grep -E 'jimport\(|JPlugin|Factory::getDocument\(|version_compare\(JVERSION' "$extension" "$legacy"; then
            echo 'JComments plugin still contains a legacy Joomla bootstrap API' >&2
            exit 1
          fi
