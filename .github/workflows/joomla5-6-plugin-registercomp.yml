name: Joomla 5/6 registercomp plugin

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'plugins/jsm_registercomp/**'
      - '.github/workflows/joomla5-6-plugin-registercomp.yml'
  pull_request:
    branches: [master]
    paths:
      - 'plugins/jsm_registercomp/**'
      - '.github/workflows/joomla5-6-plugin-registercomp.yml'

jobs:
  registercomp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: |
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find plugins/jsm_registercomp -type f -name '*.php' -print0)
      - name: Validate Joomla 5/6 plugin structure
        shell: bash
        run: |
          manifest=plugins/jsm_registercomp/jsm_registercomp.xml
          provider=plugins/jsm_registercomp/services/provider.php
          extension=plugins/jsm_registercomp/src/Extension/SportsmanagementRegistercomp.php
          legacy=plugins/jsm_registercomp/jsm_registercomp.php

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('plugins/jsm_registercomp/jsm_registercomp.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Plugin\System\SportsmanagementRegistercomp</namespace>' "$manifest"
          grep -Fq '<folder plugin="jsm_registercomp">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'joomla.form.field.radio.switcher' "$manifest"
          grep -Fq 'PluginInterface::class' "$provider"
          grep -Fq "PluginHelper::getPlugin('system', 'jsm_registercomp')" "$provider"
          grep -Fq 'implements SubscriberInterface' "$extension"
          grep -Fq "'onAfterRoute' => 'onAfterRoute'" "$extension"
          grep -Fq 'HttpFactory::getHttp()' "$extension"
          grep -Fq "class_alias(SportsmanagementRegistercomp::class, 'PlgSystemjsm_registercomp')" "$legacy"

          if grep -E 'jimport\(|JLoader::|getCfg\(|class Browser|BaseDatabaseModel::getInstance|version_compare\(JVERSION' "$extension" "$legacy"; then
            echo 'Registercomp plugin still contains a legacy Joomla bootstrap API' >&2
            exit 1
          fi
