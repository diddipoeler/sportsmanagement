name: Joomla 5/6 SIS cron plugin

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'plugins/jsm_siscron/**'
      - '.github/workflows/joomla5-6-plugin-siscron.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/jsm_siscron/**'
      - '.github/workflows/joomla5-6-plugin-siscron.yml'

jobs:
  siscron:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint plugin PHP
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find plugins/jsm_siscron -type f -name '*.php' -print0)

      - name: Validate Joomla 5/6 plugin structure
        shell: bash
        run: |
          manifest=plugins/jsm_siscron/jsm_siscron.xml
          provider=plugins/jsm_siscron/services/provider.php
          extension=plugins/jsm_siscron/src/Extension/SportsmanagementSiscron.php
          legacy=plugins/jsm_siscron/jsm_siscron.php

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('plugins/jsm_siscron/jsm_siscron.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Plugin\System\SportsmanagementSiscron</namespace>' "$manifest"
          grep -Fq '<folder plugin="jsm_siscron">services</folder>' "$manifest"
          grep -Fq 'PluginInterface::class' "$provider"
          grep -Fq 'DatabaseInterface::class' "$provider"
          grep -Fq 'implements SubscriberInterface' "$extension"
          grep -Fq "'onBeforeRender' => 'onBeforeRender'" "$extension"
          grep -Fq 'DatabaseAwareTrait' "$extension"
          grep -Fq "isClient('site')" "$extension"
          grep -Fq "getCmd('option') !== 'com_sportsmanagement'" "$extension"
          grep -Fq 'use Joomla\Http\HttpFactory;' "$extension"
          grep -Fq 'HttpFactory::getHttp()->get' "$extension"
          grep -Fq 'LIBXML_NONET' "$extension"
          grep -Fq 'ParameterType::INTEGER' "$extension"
          grep -Fq "class_alias(SportsmanagementSiscron::class, 'PlgSystemjsm_siscron')" "$legacy"

          if grep -E 'jimport\(|Factory::getDBO|Factory::getDbo|->input|new HttpFactory|Joomla\\CMS\\Http\\HttpFactory|CURLOPT_SSL_VERIFYHOST|CURLOPT_SSL_VERIFYPEER|file_get_contents\(\$linkresults' "$extension" "$legacy"; then
            echo 'SIS cron plugin still contains a legacy Joomla or insecure HTTP path' >&2
            exit 1
          fi
