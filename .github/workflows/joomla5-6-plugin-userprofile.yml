name: Joomla 5/6 user profile plugin

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'plugins/jsm_userprofile/**'
      - '.github/workflows/joomla5-6-plugin-userprofile.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'plugins/jsm_userprofile/**'
      - '.github/workflows/joomla5-6-plugin-userprofile.yml'

jobs:
  userprofile:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint plugin PHP
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find plugins/jsm_userprofile -type f -name '*.php' -print0)

      - name: Validate Joomla 5/6 plugin structure
        shell: bash
        run: |
          set -euo pipefail
          manifest=plugins/jsm_userprofile/jsmprofile.xml
          provider=plugins/jsm_userprofile/services/provider.php
          extension=plugins/jsm_userprofile/src/Extension/SportsmanagementProfile.php
          legacy=plugins/jsm_userprofile/jsmprofile.php

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('plugins/jsm_userprofile/jsmprofile.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Plugin\User\SportsmanagementProfile</namespace>' "$manifest"
          grep -Fq '<folder plugin="jsmprofile">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'PluginInterface::class' "$provider"
          grep -Fq "PluginHelper::getPlugin('user', 'jsmprofile')" "$provider"
          grep -Fq 'DatabaseInterface::class' "$provider"
          grep -Fq 'final class SportsmanagementProfile extends CMSPlugin implements SubscriberInterface' "$extension"
          grep -Fq 'PrepareDataEvent' "$extension"
          grep -Fq 'PrepareFormEvent' "$extension"
          grep -Fq 'AfterSaveEvent' "$extension"
          grep -Fq 'AfterDeleteEvent' "$extension"
          grep -Fq 'DatabaseAwareTrait' "$extension"
          grep -Fq "class_alias(SportsmanagementProfile::class, 'plgUserjsmprofile')" "$legacy"

          if grep -E 'Factory::getDbo\(|Factory::getDBO\(|JException|_subject->setError|jimport\(|version_compare\(JVERSION' "$extension" "$legacy"; then
            echo 'User profile plugin still contains a removed Joomla compatibility API' >&2
            exit 1
          fi
