name: Joomla 5/6 position mapping tables

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/PositioneventtypeModel.php'
      - 'admin/src/Model/PositionstatisticModel.php'
      - 'admin/src/Table/PositioneventtypeTable.php'
      - 'admin/src/Table/PositionstatisticTable.php'
      - 'admin/tables/positioneventtype.php'
      - 'admin/tables/positionstatistic.php'
      - '.github/workflows/joomla5-6-position-mapping-tables.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/PositioneventtypeModel.php'
      - 'admin/src/Model/PositionstatisticModel.php'
      - 'admin/src/Table/PositioneventtypeTable.php'
      - 'admin/src/Table/PositionstatisticTable.php'
      - 'admin/tables/positioneventtype.php'
      - 'admin/tables/positionstatistic.php'
      - '.github/workflows/joomla5-6-position-mapping-tables.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint position mapping slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/PositioneventtypeModel.php
            admin/src/Model/PositionstatisticModel.php
            admin/src/Table/PositioneventtypeTable.php
            admin/src/Table/PositionstatisticTable.php
            admin/tables/positioneventtype.php
            admin/tables/positionstatistic.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate position mapping contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'new PositioneventtypeTable($this->getDatabase())' admin/src/Model/PositioneventtypeModel.php
          grep -Fq "parent::__construct('#__sportsmanagement_position_eventtype', 'id', \$db)" admin/src/Table/PositioneventtypeTable.php
          grep -Fq "class_alias(PositioneventtypeTable::class, 'sportsmanagementTablePositioneventtype')" admin/tables/positioneventtype.php

          grep -Fq 'new PositionstatisticTable($this->getDatabase())' admin/src/Model/PositionstatisticModel.php
          grep -Fq "parent::__construct('#__sportsmanagement_position_statistic', 'id', \$db)" admin/src/Table/PositionstatisticTable.php
          grep -Fq '$this->position_id' admin/src/Table/PositionstatisticTable.php
          grep -Fq '$this->statistic_id' admin/src/Table/PositionstatisticTable.php
          if grep -Fq '$this->projectteam_id' admin/src/Table/PositionstatisticTable.php || grep -Fq '$this->match_id' admin/src/Table/PositionstatisticTable.php; then
            echo 'Stale position-statistic integrity fields returned' >&2
            exit 1
          fi
          grep -Fq "class_alias(PositionstatisticTable::class, 'sportsmanagementTablePositionStatistic')" admin/tables/positionstatistic.php

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Table::getInstance\('
          if grep -ER "$legacy_re" \
            admin/src/Model/PositioneventtypeModel.php \
            admin/src/Model/PositionstatisticModel.php \
            admin/src/Table/PositioneventtypeTable.php \
            admin/src/Table/PositionstatisticTable.php \
            admin/tables/positioneventtype.php \
            admin/tables/positionstatistic.php; then
            echo 'Position mapping slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
