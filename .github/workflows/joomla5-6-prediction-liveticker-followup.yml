name: Joomla 5/6 prediction and liveticker follow-up
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/PredictionrankingController.php'
      - 'admin/src/Controller/PredictionmembersController.php'
      - 'admin/src/Model/PredictionmemberModel.php'
      - 'modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php'
      - '.github/tests/joomla56_prediction_liveticker_followup.php'
      - '.github/workflows/joomla5-6-prediction-liveticker-followup.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint Joomla 5/6 PHP
        run: |
          php -l site/src/Controller/PredictionrankingController.php
          php -l admin/src/Controller/PredictionmembersController.php
          php -l admin/src/Model/PredictionmemberModel.php
          php -l modules/mod_sportsmanagement_liveticker/src/Helper/LivetickerHelper.php
          php -l .github/tests/joomla56_prediction_liveticker_followup.php
      - name: Check prediction ACL inputs and bounded liveticker runtime
        run: php .github/tests/joomla56_prediction_liveticker_followup.php
