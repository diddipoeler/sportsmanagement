name: Joomla 5/6 prediction model dependency bridges batch 401

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/predictionuser.php'
      - 'site/models/predictionusers.php'
      - 'site/models/predictionranking.php'
      - 'site/models/predictionresults.php'
      - 'site/models/predictionentry.php'
      - '.github/workflows/joomla5-6-prediction-model-dependency-bridges-batch401.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/predictionuser.php'
      - 'site/models/predictionusers.php'
      - 'site/models/predictionranking.php'
      - 'site/models/predictionresults.php'
      - 'site/models/predictionentry.php'
      - '.github/workflows/joomla5-6-prediction-model-dependency-bridges-batch401.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate prediction model dependency bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/predictionuser.php
            site/models/predictionusers.php
            site/models/predictionranking.php
            site/models/predictionresults.php
            site/models/predictionentry.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'SportsManagementSiteApplicationResolver.php' "$file"
            grep -Fq -- 'SportsManagementDatabaseResolver.php' "$file"
            grep -Fq -- 'SportsManagementPredictionReadModel.php' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
          done
