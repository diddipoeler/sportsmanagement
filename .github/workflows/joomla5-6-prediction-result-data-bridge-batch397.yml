name: Joomla 5/6 prediction result data bridge batch 397

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/prediction.php'
      - 'site/src/Model/SportsManagementPredictionModel.php'
      - '.github/workflows/joomla5-6-prediction-result-data-bridge-batch397.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/prediction.php'
      - 'site/src/Model/SportsManagementPredictionModel.php'
      - '.github/workflows/joomla5-6-prediction-result-data-bridge-batch397.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate prediction result data bridge
        shell: bash
        run: |
          set -euo pipefail
          files=(site/models/prediction.php site/src/Model/SportsManagementPredictionModel.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done
          for method in getPredictionMemberAvatarValue getPredictionRoundBettingRules getPredictionMemberResults updatePredictionResult; do
            grep -Fq -- "function $method" site/src/Model/SportsManagementPredictionModel.php
          done
          grep -Fq -- 'nativePredictionModel()->getPredictionMemberAvatarValue' site/models/prediction.php
          grep -Fq -- 'nativePredictionModel()->getPredictionRoundBettingRules' site/models/prediction.php
          grep -Fq -- 'nativePredictionModel()->getPredictionMemberResults' site/models/prediction.php
          grep -Fq -- 'nativePredictionModel()->updatePredictionResult' site/models/prediction.php
          test "$(grep -Fc -- 'sportsmanagementHelper::getDBConnection' site/models/prediction.php)" -eq 1
          test "$(grep -Fc -- '->disconnect()' site/models/prediction.php)" -eq 2
