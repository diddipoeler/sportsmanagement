name: Joomla 5/6 prediction entry guest and ID boundaries

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/PredictionentryModel.php'
      - '.github/tests/joomla56_predictionentry_guest_ids.php'
      - '.github/workflows/joomla5-6-predictionentry-guest-ids.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prediction-entry:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint prediction entry model and guest test
        run: |
          php -l site/src/Model/PredictionentryModel.php
          php -l .github/tests/joomla56_predictionentry_guest_ids.php
      - name: Check guest member denial and strict legacy selector IDs
        run: php .github/tests/joomla56_predictionentry_guest_ids.php
