name: Joomla 5/6 project DB helper removal batch 333

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/project.php'
      - 'site/src/Model/ProjectModel.php'
      - '.github/workflows/joomla5-6-project-db-helper-removal-batch333.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/project.php'
      - 'site/src/Model/ProjectModel.php'
      - '.github/workflows/joomla5-6-project-db-helper-removal-batch333.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate project DB helper removal
        shell: bash
        run: |
          set -euo pipefail
          files=(site/models/project.php site/src/Model/ProjectModel.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          done
          grep -Fq -- 'public function getCurrentRoundData' site/src/Model/ProjectModel.php
          grep -Fq -- 'public function getLegacyMatch' site/src/Model/ProjectModel.php
          ! grep -Fq -- 'sportsmanagementHelper::getDBConnection' site/models/project.php
          grep -Fq -- 'self::$_current_round = $round;' site/models/project.php
