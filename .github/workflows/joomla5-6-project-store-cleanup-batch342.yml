name: Joomla 5/6 project store cleanup batch 342

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/project.php'
      - '.github/workflows/joomla5-6-project-store-cleanup-batch342.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/project.php'
      - '.github/workflows/joomla5-6-project-store-cleanup-batch342.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 6 compatible legacy store
        shell: bash
        run: |
          set -euo pipefail
          file=site/models/project.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          grep -Fq -- "$this->getTable((string) $table, 'Administrator')" "$file"
          ! grep -Fq -- 'Table::getInstance' "$file"
          ! grep -Fq -- '$this->_db' "$file"
          ! grep -Fq -- 'setError(' "$file"
