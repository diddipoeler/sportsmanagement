name: Joomla 5/6 Project Map and Playground Plan

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php'
      - 'modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php'
      - '.github/tests/joomla56_projectmap_playgroundplan_contract.php'
      - '.github/workflows/joomla5-6-projectmap-playgroundplan.yml'
  pull_request:
    paths:
      - 'modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php'
      - 'modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php'
      - '.github/tests/joomla56_projectmap_playgroundplan_contract.php'
      - '.github/workflows/joomla5-6-projectmap-playgroundplan.yml'

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax and required PHPDoc headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php -l .github/tests/joomla56_projectmap_playgroundplan_contract.php
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Test map routing and playground filter safety
        run: php .github/tests/joomla56_projectmap_playgroundplan_contract.php
