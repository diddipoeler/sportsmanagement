name: Joomla 5/6 projectmap and admin quickicons

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php'
      - 'admin/modules/mod_sportsmanagement_quickicon/src/Helper/QuickIconHelper.php'
      - '.github/tests/joomla56_projectmap_quickicon_contract.php'
      - '.github/workflows/joomla5-6-projectmap-quickicon-contract.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php'
      - 'admin/modules/mod_sportsmanagement_quickicon/src/Helper/QuickIconHelper.php'
      - '.github/tests/joomla56_projectmap_quickicon_contract.php'
      - '.github/workflows/joomla5-6-projectmap-quickicon-contract.yml'

permissions:
  contents: read

jobs:
  projectmap-quickicons:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax and mandatory PHPDoc
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php
            admin/modules/mod_sportsmanagement_quickicon/src/Helper/QuickIconHelper.php
          )
          php .github/tests/phpdoc_metadata.php "${files[@]}"
          for file in "${files[@]}" .github/tests/joomla56_projectmap_quickicon_contract.php; do
            php -l "$file"
          done

      - name: Projectmap and quickicon regressions
        run: php .github/tests/joomla56_projectmap_quickicon_contract.php
