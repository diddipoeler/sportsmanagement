name: Joomla 5/6 projectteam admin teamplayers training security

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/EditprojectteamController.php'
      - 'site/src/Model/EditprojectteamModel.php'
      - 'admin/src/Model/TeamplayersModel.php'
      - 'modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php'
      - '.github/tests/joomla56_projectteam_trainingsdata_security.php'
      - '.github/workflows/joomla5-6-projectteam-trainingsdata-security.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/EditprojectteamController.php'
      - 'site/src/Model/EditprojectteamModel.php'
      - 'admin/src/Model/TeamplayersModel.php'
      - 'modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php'
      - '.github/tests/joomla56_projectteam_trainingsdata_security.php'
      - '.github/workflows/joomla5-6-projectteam-trainingsdata-security.yml'

jobs:
  security-regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate PHP syntax and project metadata
        shell: bash
        run: |
          set -euo pipefail
          php -l site/src/Controller/EditprojectteamController.php
          php -l site/src/Model/EditprojectteamModel.php
          php -l admin/src/Model/TeamplayersModel.php
          php -l modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php
          php -l .github/tests/joomla56_projectteam_trainingsdata_security.php
          php .github/tests/phpdoc_metadata.php site/src/Controller/EditprojectteamController.php site/src/Model/EditprojectteamModel.php admin/src/Model/TeamplayersModel.php modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php

      - name: Site editor, administrator and module safety regressions
        run: |
          php .github/tests/joomla56_projectteam_trainingsdata_security.php
          php .github/tests/joomla56_editor_prediction_calendar_contract.php
          php .github/tests/joomla56_teamplayers_selector_validation.php
          php .github/tests/joomla56_editor_admin_module_contract.php
