name: Joomla 5/6 public DI container runtime gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  public-container-runtime:
    name: Admin site and module public container checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public Joomla DI access
        shell: bash
        run: |
          set -euo pipefail

          admin_user=admin/src/Field/UserlistField.php
          admin_avatar=admin/src/Field/AvatarfromcomponentField.php
          admin_k2=admin/src/Field/Categorylistk2Field.php
          admin_ajax=admin/src/Model/AjaxModel.php
          admin_resolver=admin/src/Helper/SportsManagementDatabaseResolver.php
          site_base=site/src/Model/SportsManagementModel.php
          site_list=site/src/Model/SportsManagementListModel.php
          module_matches=modules/mod_sportsmanagement_matches/src/Helper/MatchesHelper.php
          module_projectmap=modules/mod_sportsmanagement_projectmap/helper.php
          module_act_season=modules/mod_sportsmanagement_act_season/helper.php
          module_eventsranking=modules/mod_sportsmanagement_eventsranking/helper.php

          files=(
            "$admin_user" "$admin_avatar" "$admin_k2" "$admin_ajax" "$admin_resolver"
            "$site_base" "$site_list" "$module_matches" "$module_projectmap"
            "$module_act_season" "$module_eventsranking"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          # Administrator paths validate the administrator application, but services
          # come from Joomla's public DI container. CMSApplication::getContainer() is protected.
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$admin_user"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$admin_user"
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$admin_avatar"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$admin_avatar"
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$admin_k2"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$admin_k2"
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$admin_resolver"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$admin_resolver"
          grep -Fq 'SportsManagementDatabaseResolver' "$admin_ajax"

          # Site base models validate the site application separately from public DI access.
          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$site_base"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$site_base"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$site_list"

          # Module compatibility paths use validated site applications plus public DI access.
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$module_matches"
          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$module_projectmap"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$module_projectmap"
          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$module_act_season"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$module_act_season"
          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$module_eventsranking"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$module_eventsranking"

          runtime_roots=(admin/src site/src modules)

          protected_container_hits="$(grep -R -n --include='*.php' -E '\$(app|[A-Za-z_][A-Za-z0-9_]*app[A-Za-z0-9_]*)->getContainer\(|->getApplication\(\)->getContainer\(|->siteApplication\(\)->getContainer\(|->administratorApplication\(\)->getContainer\(' "${runtime_roots[@]}" || true)"
          if [[ -n "$protected_container_hits" ]]; then
            printf '%s\n' "$protected_container_hits" >&2
            echo 'An active runtime path calls protected CMSApplication::getContainer(); use Factory::getContainer() for Joomla services.' >&2
            exit 1
          fi

          application_input_hits="$(grep -R -n --include='*.php' -E '\$(app|[A-Za-z_][A-Za-z0-9_]*app[A-Za-z0-9_]*)->input\b|Factory::getApplication\(\)->input\b' "${runtime_roots[@]}" || true)"
          if [[ -n "$application_input_hits" ]]; then
            printf '%s\n' "$application_input_hits" >&2
            echo 'An active runtime path still accesses application input as a property instead of getInput().' >&2
            exit 1
          fi

          legacy_input_method_hits="$(grep -R -n --include='*.php' -F -- '->getVar(' "${runtime_roots[@]}" || true)"
          if [[ -n "$legacy_input_method_hits" ]]; then
            printf '%s\n' "$legacy_input_method_hits" >&2
            echo 'An active runtime path still uses the legacy getVar() input method.' >&2
            exit 1
          fi

          view_database_hits="$(grep -R -n --include='*.php' -F -- '->getDatabase(' site/src/View || true)"
          if [[ -n "$view_database_hits" ]]; then
            printf '%s\n' "$view_database_hits" >&2
            echo 'A native site view still calls protected BaseDatabaseModel::getDatabase().' >&2
            exit 1
          fi

          view_application_hits="$(grep -R -n --include='*.php' -F -- '->getApplication(' site/src/View || true)"
          if [[ -n "$view_application_hits" ]]; then
            printf '%s\n' "$view_application_hits" >&2
            echo 'A native site view still calls an unavailable getApplication() method.' >&2
            exit 1
          fi

          removed_factory_hits="$(grep -R -n --include='*.php' -E 'Factory::get(Dbo|DBO|User|Document|Config|Session|Language|Cache|Mailer)\(|->getCfg\(' "${runtime_roots[@]}" || true)"
          if [[ -n "$removed_factory_hits" ]]; then
            printf '%s\n' "$removed_factory_hits" >&2
            echo 'An administrator, site or module runtime path still uses a removed Joomla Factory/application API.' >&2
            exit 1
          fi

          factory_create_hits="$(grep -R -n --include='*.php' -E 'Factory::create(Config|Dbo|DBO|Mailer|Language|Document)\(' "${runtime_roots[@]}" || true)"
          if [[ -n "$factory_create_hits" ]]; then
            printf '%s\n' "$factory_create_hits" >&2
            echo 'An administrator, site or module runtime path still uses a removed Joomla Factory create API.' >&2
            exit 1
          fi

          removed_behavior_hits="$(grep -R -n --include='*.php' -E "HTMLHelper::_\('(behavior\.(core|keepalive|multiselect|combobox)|jquery\.framework)'" "${runtime_roots[@]}" || true)"
          if [[ -n "$removed_behavior_hits" ]]; then
            printf '%s\n' "$removed_behavior_hits" >&2
            echo 'An active runtime path still uses a Joomla 6 removed behavior or jquery.framework helper.' >&2
            exit 1
          fi

          html_registry_hits="$(grep -R -n --include='*.php' -E 'HTMLHelper::(addIncludePath|register|unregister)\(' "${runtime_roots[@]}" || true)"
          if [[ -n "$html_registry_hits" ]]; then
            printf '%s\n' "$html_registry_hits" >&2
            echo 'An active runtime path still uses a Joomla 6 removed HTMLHelper registry API.' >&2
            exit 1
          fi

          toolbar_instance_hits="$(grep -R -n --include='*.php' -F 'Toolbar::getInstance(' "${runtime_roots[@]}" || true)"
          if [[ -n "$toolbar_instance_hits" ]]; then
            printf '%s\n' "$toolbar_instance_hits" >&2
            echo 'An active runtime path still uses legacy Toolbar::getInstance().' >&2
            exit 1
          fi

          cms_filesystem_hits="$(grep -R -n --include='*.php' -F 'Joomla\CMS\Filesystem\' "${runtime_roots[@]}" || true)"
          if [[ -n "$cms_filesystem_hits" ]]; then
            printf '%s\n' "$cms_filesystem_hits" >&2
            echo 'An active runtime path still depends on the Joomla 6 compatibility-plugin CMS filesystem package.' >&2
            exit 1
          fi

          platform_constant_hits="$(grep -R -n --include='*.php' -F 'JPATH_PLATFORM' "${runtime_roots[@]}" || true)"
          if [[ -n "$platform_constant_hits" ]]; then
            printf '%s\n' "$platform_constant_hits" >&2
            echo 'An active runtime path still uses removed JPATH_PLATFORM.' >&2
            exit 1
          fi

          removed_application_class_hits="$(grep -R -n --include='*.php' -E 'Joomla\\CMS\\Application\\(BaseApplication|CliApplication)' "${runtime_roots[@]}" || true)"
          if [[ -n "$removed_application_class_hits" ]]; then
            printf '%s\n' "$removed_application_class_hits" >&2
            echo 'An active runtime path still uses a Joomla 6 removed application class.' >&2
            exit 1
          fi

          iscli_hits="$(grep -R -n --include='*.php' -F -- '->isCli(' "${runtime_roots[@]}" || true)"
          if [[ -n "$iscli_hits" ]]; then
            printf '%s\n' "$iscli_hits" >&2
            echo 'An active runtime path still uses removed CMSApplication::isCli().' >&2
            exit 1
          fi

          legacy_file_read_hits="$(grep -R -n --include='*.php' -F 'File::read(' "${runtime_roots[@]}" || true)"
          if [[ -n "$legacy_file_read_hits" ]]; then
            printf '%s\n' "$legacy_file_read_hits" >&2
            echo 'An active runtime path still calls unsupported static File::read().' >&2
            exit 1
          fi

          module_src=()
          while IFS= read -r dir; do
            module_src+=("$dir")
          done < <(find modules -mindepth 2 -maxdepth 2 -type d -name src -print | sort)

          loader_hits="$(grep -R -n --include='*.php' -E 'JLoader::|jimport\(' site/src "${module_src[@]}" admin/src || true)"
          if [[ -n "$loader_hits" ]]; then
            printf '%s\n' "$loader_hits" >&2
            echo 'A native Joomla 5/6 runtime path still uses JLoader or jimport.' >&2
            exit 1
          fi

          echo 'Joomla 5/6 public container runtime contracts OK'
