name: Joomla 5/6 random player gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  randomplayer:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate random player module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_randomplayer
          manifest="$module/mod_sportsmanagement_randomplayer.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/RandomPlayerHelper.php"
          test -f "$module/tmpl/native.php"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/RandomPlayerHelper.php"
          php -l "$module/mod_sportsmanagement_randomplayer.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/native.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementRandomPlayer</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q 'registerAndUseStyle' "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'random_int' "$module/src/Helper/RandomPlayerHelper.php"
          grep -q 'getEligibleProjectTeams' "$module/src/Helper/RandomPlayerHelper.php"
          grep -q 'class modJSMRandomplayerHelper' "$module/helper.php"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'Random player manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/RandomPlayerHelper.php" \
            "$module/mod_sportsmanagement_randomplayer.php" \
            "$module/helper.php" \
            "$module/tmpl/native.php"; then
            echo 'Random player module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          if grep -Ei 'order\([^)]*rand\(|ORDER[[:space:]]+BY[[:space:]]+RAND\(' "$module/src/Helper/RandomPlayerHelper.php"; then
            echo 'Random player helper regressed to database RAND().' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
