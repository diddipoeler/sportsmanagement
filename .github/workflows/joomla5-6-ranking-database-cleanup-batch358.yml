name: Joomla 5/6 ranking database cleanup batch 358

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/helpers/ranking.php'
      - '.github/workflows/joomla5-6-ranking-database-cleanup-batch358.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/helpers/ranking.php'
      - '.github/workflows/joomla5-6-ranking-database-cleanup-batch358.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate ranking database migration
        shell: bash
        run: |
          set -euo pipefail
          file=site/helpers/ranking.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          grep -Fq -- 'private static function database(int $selector = 0): DatabaseInterface' "$file"
          grep -Fq -- 'SportsManagementDatabaseResolver::resolve' "$file"
          ! grep -Fq -- 'sportsmanagementHelper::getDBConnection' "$file"
          ! grep -Fq -- 'JVERSION' "$file"
          ! grep -Fq -- 'getQuery(true)' "$file"
