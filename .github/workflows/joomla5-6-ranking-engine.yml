name: Joomla 5/6 native ranking engine

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  ranking-engine:
    name: Native ranking engine gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint ranking stack
        shell: bash
        run: |
          files=(
            site/src/Service/RankingEngine.php
            site/src/Service/RankingDataLoader.php
            site/src/Service/RankingCalculator.php
            site/src/Service/RankingRow.php
            modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php
            modules/mod_sportsmanagement_ranking/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_ranking/tmpl/native.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Enforce read-only native engine boundary
        shell: bash
        run: |
          services=(
            site/src/Service/RankingEngine.php
            site/src/Service/RankingDataLoader.php
            site/src/Service/RankingCalculator.php
            site/src/Service/RankingRow.php
          )
          if grep -E 'JSMRanking|sportsmanagementModelProject|BaseDatabaseModel::getInstance|JLoader::import|->disconnect\(|updateObject|insertObject|deleteObject|Factory::getApplication\(\)->input' "${services[@]}"; then
            echo 'Native ranking services contain legacy MVC, request state or write paths' >&2
            exit 1
          fi

          helper=modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php
          grep -q 'use Diddipoeler\\Component\\SportsManagement\\Site\\Service\\RankingEngine' "$helper"
          grep -q 'new RankingEngine' "$helper"
          if grep -E 'JSMRanking|sportsmanagementModelProject|bootCompatibilityRankingEngine' "$helper"; then
            echo 'Ranking module still contains the legacy ranking compatibility engine' >&2
            exit 1
          fi

          grep -q 'new RankingDataLoader' site/src/Service/RankingEngine.php
          grep -q 'new RankingCalculator' site/src/Service/RankingEngine.php
          grep -q '#__sportsmanagement_project_team_division' site/src/Service/RankingDataLoader.php
          grep -q '#__sportsmanagement_template_config' site/src/Service/RankingDataLoader.php
          grep -q '#__sportsmanagement_match' site/src/Service/RankingDataLoader.php
          grep -q 'public function applyMatches' site/src/Service/RankingCalculator.php
          grep -q 'h2h' site/src/Service/RankingCalculator.php
          grep -q 'COM_SPORTSMANAGEMENT_ST_SOCCER' site/src/Service/RankingCalculator.php
          grep -q 'COM_SPORTSMANAGEMENT_ST_FAUSTBALL' site/src/Service/RankingCalculator.php
          grep -q 'COM_SPORTSMANAGEMENT_ST_SMALL_BORE_RIFLE_ASSOCIATION' site/src/Service/RankingCalculator.php

      - name: Enforce display and refresh split
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php').read_text()
          display = text.split('public function getData', 1)[1].split('public function refreshAjax', 1)[0]
          forbidden = ['getmatches(', 'insertObject', 'updateObject', 'deleteObject', 'curl_', 'file_get_contents(', 'JSMRanking', 'sportsmanagementModelProject']
          hits = [marker for marker in forbidden if marker in display]
          if hits:
              raise SystemExit('Ranking display contains writer/network/legacy markers: ' + ', '.join(hits))
          refresh = text.split('public function refreshAjax', 1)[1].split('private function countryFlags', 1)[0]
          required = ["Session::checkToken('post')", "authorise('core.manage', 'com_sportsmanagement')", 'module_id', 'ishd_update', 'cfg_which_database', 'getmatches($projectId)']
          missing = [marker for marker in required if marker not in refresh]
          if missing:
              raise SystemExit('Ranking refresh boundary missing: ' + ', '.join(missing))
          PY

      - name: Validate ranking semantics
        shell: bash
        run: |
          php <<'PHP'
          <?php
          define('_JEXEC', 1);
          require 'site/src/Service/RankingRow.php';
          require 'site/src/Service/RankingCalculator.php';

          use Diddipoeler\Component\SportsManagement\Site\Service\RankingCalculator;
          use Diddipoeler\Component\SportsManagement\Site\Service\RankingRow;

          $calc = new RankingCalculator();
          $team = static function (int $ptid, string $name): RankingRow {
              $row = new RankingRow($ptid);
              $row->teamid = $ptid;
              $row->name = $name;
              $row->team = (object) ['id' => $ptid, 'name' => $name];
              return $row;
          };
          $match = static function (int $home, int $away, float $hs, float $as, int $type = 0, float $hot = 0, float $aot = 0): object {
              return (object) ['projectteam1_id'=>$home,'projectteam2_id'=>$away,'decision'=>0,'home_score'=>$hs,'away_score'=>$as,'l1'=>0,'l2'=>0,'mp1'=>0,'mp2'=>0,'se1'=>0,'se2'=>0,'ga1'=>0,'ga2'=>0,'match_result_type'=>$type,'home_bonus'=>0,'away_bonus'=>0,'home_score_ot'=>$hot,'away_score_ot'=>$aot,'home_score_so'=>0,'away_score_so'=>0,'team_won'=>0,'ls1'=>'','ls2'=>''];
          };
          $project = (object) ['allow_add_time'=>0,'points_after_regular_time'=>'3,1,0','points_after_add_time'=>'2,1,0','points_after_penalty'=>'2,1,0','sport_type_name'=>'COM_SPORTSMANAGEMENT_ST_SOCCER'];
          $seed = [10=>$team(10,'Alpha'),20=>$team(20,'Beta')];
          $ranked = $calc->calculate($seed, [1=>$match(10,20,2,1),2=>$match(20,10,1,1)], $project, ['ranking_order'=>'POINTS, PLAYEDASC, DIFF, FOR','ranking_sort_order'=>'DESC, ASC, DESC, DESC']);
          if ($ranked[10]->rank !== 1 || $ranked[10]->cnt_won !== 1 || $ranked[10]->cnt_draw !== 1 || abs($ranked[10]->getPoints()-4.0) > 0.0001 || abs($ranked[10]->sum_team1_result-3.0) > 0.0001 || abs($ranked[10]->sum_team2_result-2.0) > 0.0001) {
              throw new RuntimeException('Default ranking semantics failed.');
          }

          $hockey = (object) ['allow_add_time'=>1,'points_after_regular_time'=>'3,1,0','points_after_add_time'=>'2,1,0','points_after_penalty'=>'2,1,0','sport_type_name'=>'COM_SPORTSMANAGEMENT_ST_INLINE_HOCKEY'];
          $ot = [30=>$team(30,'Gamma'),40=>$team(40,'Delta')];
          $calc->applyMatches($ot, [3=>$match(30,40,2,2,1,1,0)], $hockey, $hockey->sport_type_name);
          if ($ot[30]->cnt_wot !== 1 || $ot[40]->cnt_lot !== 1 || abs($ot[30]->getPoints()-1.0) > 0.0001 || abs($ot[40]->getPoints()-1.0) > 0.0001) {
              throw new RuntimeException('Overtime ranking semantics failed.');
          }

          $h2hSeed = [50=>$team(50,'X'),60=>$team(60,'Y'),70=>$team(70,'Z'),80=>$team(80,'W')];
          $h2hMatches = [4=>$match(50,60,1,0),5=>$match(70,50,1,0),6=>$match(60,70,1,0),7=>$match(70,80,1,0)];
          $h2h = $calc->calculate($h2hSeed, $h2hMatches, $project, ['ranking_order'=>'POINTS,H2H','ranking_sort_order'=>'DESC,DESC']);
          if ($h2h[70]->rank !== 1 || $h2h[50]->rank >= $h2h[60]->rank) {
              throw new RuntimeException('Head-to-head ranking semantics failed.');
          }
          echo "Native ranking engine semantics OK\n";
          PHP
