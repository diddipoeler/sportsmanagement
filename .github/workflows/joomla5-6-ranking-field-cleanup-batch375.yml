name: Joomla 5/6 ranking field cleanup batch 375

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/helpers/ranking.php'
      - 'admin/models/fields/teams.php'
      - 'admin/models/fields/favteam.php'
      - 'admin/models/fields/imageselect.php'
      - '.github/workflows/joomla5-6-ranking-field-cleanup-batch375.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/helpers/ranking.php'
      - 'admin/models/fields/teams.php'
      - 'admin/models/fields/favteam.php'
      - 'admin/models/fields/imageselect.php'
      - '.github/workflows/joomla5-6-ranking-field-cleanup-batch375.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate ranking helper and fields
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/helpers/ranking.php
            admin/models/fields/teams.php
            admin/models/fields/favteam.php
            admin/models/fields/imageselect.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
          done
          ! grep -Fq -- 'getVar("view")' site/helpers/ranking.php
          grep -Fq -- "getCmd('view')" site/helpers/ranking.php
          for file in admin/models/fields/teams.php admin/models/fields/favteam.php admin/models/fields/imageselect.php; do
            grep -Fq -- 'throw new \\RuntimeException' "$file"
          done
