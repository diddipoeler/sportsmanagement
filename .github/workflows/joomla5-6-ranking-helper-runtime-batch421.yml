name: Joomla 5/6 ranking helper runtime batch 421

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/helpers/ranking.php'
      - 'site/models/pagination.php'
      - '.github/workflows/joomla5-6-ranking-helper-runtime-batch421.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/helpers/ranking.php'
      - 'site/models/pagination.php'
      - '.github/workflows/joomla5-6-ranking-helper-runtime-batch421.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate ranking helper runtime
        shell: bash
        run: |
          set -euo pipefail
          files=(site/helpers/ranking.php site/models/pagination.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done
          grep -Fq -- 'SportsManagementSiteApplicationResolver::resolve()' site/helpers/ranking.php
          ! grep -Fq -- 'Factory::getApplication()' site/helpers/ranking.php
          ! grep -Fq -- '$app->input' site/helpers/ranking.php
          grep -Fq -- 'is_file($nativePagination)' site/models/pagination.php
          grep -Fq -- 'throw new \RuntimeException' site/models/pagination.php
          ! grep -Fq -- 'Restricted access' site/models/pagination.php
