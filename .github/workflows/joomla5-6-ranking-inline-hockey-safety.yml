name: Joomla 5/6 ranking and Inline Hockey safety

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php'
      - 'site/src/Service/InlineHockeyApiClient.php'
      - 'site/src/Service/InlineHockeyClubTeamImportService.php'
      - 'site/src/Service/InlineHockeyMatchImportService.php'
      - 'site/src/Service/InlineHockeyClubLogoService.php'
      - '.github/tests/inline_hockey_api_security.php'
      - '.github/tests/joomla56_inline_hockey_external_ids.php'
      - '.github/tests/joomla56_ranking_inline_hockey_safety.php'
      - '.github/workflows/joomla5-6-ranking-inline-hockey-safety.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php'
      - 'site/src/Service/InlineHockeyApiClient.php'
      - 'site/src/Service/InlineHockeyClubTeamImportService.php'
      - 'site/src/Service/InlineHockeyMatchImportService.php'
      - 'site/src/Service/InlineHockeyClubLogoService.php'
      - '.github/tests/inline_hockey_api_security.php'
      - '.github/tests/joomla56_inline_hockey_external_ids.php'
      - '.github/tests/joomla56_ranking_inline_hockey_safety.php'
      - '.github/workflows/joomla5-6-ranking-inline-hockey-safety.yml'

permissions:
  contents: read

jobs:
  ranking-inline-hockey:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax and metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php
            site/src/Service/InlineHockeyApiClient.php
            site/src/Service/InlineHockeyClubTeamImportService.php
            site/src/Service/InlineHockeyMatchImportService.php
            site/src/Service/InlineHockeyClubLogoService.php
            .github/tests/joomla56_inline_hockey_external_ids.php
          )
          php .github/tests/phpdoc_metadata.php "${files[@]}"
          for file in "${files[@]}" .github/tests/joomla56_ranking_inline_hockey_safety.php .github/tests/inline_hockey_api_security.php; do
            php -l "$file"
          done

      - name: Ranking window and trusted HTTP checks
        run: php .github/tests/joomla56_ranking_inline_hockey_safety.php

      - name: Existing Inline Hockey URL checks
        run: php .github/tests/inline_hockey_api_security.php

      - name: Prevent malformed ISHD club, team and match IDs from reaching writes
        run: php .github/tests/joomla56_inline_hockey_external_ids.php
