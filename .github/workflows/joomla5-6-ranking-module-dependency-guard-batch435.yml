name: Joomla 5/6 ranking module dependency guard batch 435

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - '.github/workflows/joomla5-6-ranking-module-dependency-guard-batch435.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - '.github/workflows/joomla5-6-ranking-module-dependency-guard-batch435.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate ranking module dependency guard
        shell: bash
        run: |
          set -euo pipefail
          file=modules/mod_sportsmanagement_ranking/helper.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'CountryPresentationHelper::class =>' "$file"
          grep -Fq -- 'NativeRankingHelper::class =>' "$file"
          grep -Fq -- 'NativeRankingHelper::class,' "$file"
          grep -Fq -- 'throw new \RuntimeException' "$file"
