name: Joomla 5/6 results installation and birthday hardening

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/ResultsController.php'
      - 'admin/src/Controller/InstallhelperController.php'
      - 'modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php'
      - '.github/tests/joomla56_results_installhelper_birthday_limits.php'
      - '.github/workflows/joomla5-6-results-installhelper-birthday-guards.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/ResultsController.php'
      - 'admin/src/Controller/InstallhelperController.php'
      - 'modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php'
      - '.github/tests/joomla56_results_installhelper_birthday_limits.php'
      - '.github/workflows/joomla5-6-results-installhelper-birthday-guards.yml'

permissions:
  contents: read

jobs:
  guard-contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Controller/ResultsController.php
            admin/src/Controller/InstallhelperController.php
            modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php
            .github/tests/joomla56_results_installhelper_birthday_limits.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Exercise results ACL and module bounds
        run: php .github/tests/joomla56_results_installhelper_birthday_limits.php
