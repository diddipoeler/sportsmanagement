name: Joomla 5/6 roster metadata normalizer batch 99

on:
  push:
    branches:
      - joomla5-6
    paths:
      - '.github/workflows/joomla5-6-roster-normalize-batch99.yml'

permissions:
  contents: write

jobs:
  normalize-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: joomla5-6

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Normalize roster PHP metadata
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          paths = [Path('site/src/Model/RosterModel.php')]
          paths += sorted(Path('site/tmpl/roster').glob('*.php'))
          paths += sorted(Path('site/views/roster/tmpl').glob('*.php'))

          if len(paths) != 27:
              raise SystemExit(f'Expected 27 roster PHP files, found {len(paths)}')

          for path in paths:
              text = path.read_text(encoding='utf-8')
              match = re.match(r'<\?php\s*/\*\*.*?\*/\s*', text, flags=re.S)
              if not match:
                  raise SystemExit(f'No leading PHP docblock found in {path}')

              if path.as_posix() == 'site/src/Model/RosterModel.php':
                  description = 'Native Joomla 5/6 frontend roster model.'
              elif path.as_posix().startswith('site/views/roster/tmpl/'):
                  description = 'Legacy compatibility bridge for the native Joomla 5/6 roster layout.'
              else:
                  description = 'Native Joomla 5/6 roster layout.'

              header = (
                  '<?php\n'
                  '/**\n'
                  f' * {description}\n'
                  ' *\n'
                  ' * @version    5.6.0\n'
                  ' * @author     diddipoeler\n'
                  ' * @copyright  Copyright (C) diddipoeler\n'
                  ' * @license    GNU General Public License version 2 or later; see LICENSE.txt\n'
                  ' */\n'
              )
              path.write_text(header + text[match.end():], encoding='utf-8')
          PY

      - name: Validate PHP syntax and metadata
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(printf '%s\n' site/src/Model/RosterModel.php; find site/tmpl/roster site/views/roster/tmpl -type f -name '*.php' | sort)
          test "${#files[@]}" -eq 27

          for file in "${files[@]}"; do
            php -l "$file" >/dev/null
            grep -Fq ' * @version    5.6.0' "$file"
            grep -Fq ' * @author     diddipoeler' "$file"
            grep -Fq ' * @copyright  Copyright (C) diddipoeler' "$file"
            grep -Fq ' * @license    GNU General Public License version 2 or later; see LICENSE.txt' "$file"
            ! grep -Fq 'Fussball in Europa' "$file"
            ! grep -Fq '@version    1.0.05' "$file"
          done

          grep -Fq 'namespace Diddipoeler\Component\SportsManagement\Site\Model;' site/src/Model/RosterModel.php
          grep -Fq 'final class RosterModel extends SportsManagementProjectModel' site/src/Model/RosterModel.php
          grep -Fq "require JPATH_SITE . '/components/com_sportsmanagement/tmpl/roster/default.php';" site/views/roster/tmpl/default.php

      - name: Commit normalized roster metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/src/Model/RosterModel.php site/tmpl/roster site/views/roster/tmpl; then
            echo 'Roster metadata already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/src/Model/RosterModel.php site/tmpl/roster site/views/roster/tmpl
          git commit -m 'Normalize Joomla 5/6 roster metadata batch 99'
          git push origin HEAD:joomla5-6
