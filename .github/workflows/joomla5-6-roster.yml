name: Joomla 5/6 roster migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  roster:
    name: Native roster model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate roster migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/RosterModel.php
          staff_model=site/src/Model/StaffModel.php
          model_bridge=site/models/roster.php
          view=site/src/View/Roster/HtmlView.php
          view_bridge=site/views/roster/view.html.php
          main_template=site/views/roster/tmpl/default.php

          for file in "$model" "$staff_model" "$model_bridge" "$view" "$view_bridge" "$main_template"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class RosterModel extends SportsManagementProjectModel' "$model"
          grep -q 'class StaffModel extends SportsManagementProjectModel' "$staff_model"
          grep -q "class_alias(RosterModel::class, 'sportsmanagementModelRoster')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewRoster')" "$view_bridge"

          for method in getProjectTeam getTeam getProjectPositions getPlayerEventStats getTeamPlayers getPositionEventTypes getTeamEventStat getRosterStats getLastSeasonDate getTeamPlayer; do
            grep -q "function ${method}" "$model"
          done

          grep -q "\$pictureAlias = strtolower" "$model"
          grep -q "in_array((int) \$persontype, \[1, 2\], true)" "$model"
          grep -q 'function loadProjectStats' "$model"
          grep -q 'SMStatistic::getInstance' "$model"
          grep -Fq "quoteName('pr.published')" "$model"
          grep -Fq "quoteName('pr.show_on_frontend')" "$model"
          grep -Fq "quoteName('tp.published')" "$model"
          grep -Fq "quoteName('pt.published')" "$model"
          grep -Fq "quoteName('t.published')" "$model"
          grep -Fq "quoteName('pro.published')" "$model"
          grep -Fq "quoteName('ma.published')" "$model"
          grep -Fq "require_once \$helperFile" "$model"

          grep -Fq "quoteName('ts.published')" "$staff_model"
          grep -Fq "quoteName('tt.published')" "$staff_model"
          grep -Fq "quoteName('pt.published')" "$staff_model"
          grep -Fq "quoteName('pro.published')" "$staff_model"
          grep -Fq "quoteName('t.published')" "$staff_model"
          grep -Fq "quoteName('pr.published')" "$staff_model"
          grep -Fq "quoteName('pr.show_on_frontend')" "$staff_model"
          grep -Fq "quoteName('r.project_id')" "$staff_model"
          grep -Fq "quoteName('tp.persontype') . ' = 2'" "$staff_model"
          grep -Fq "quoteName('m.published') . ' = 1'" "$staff_model"

          grep -q 'function prepareView' "$view"
          grep -q 'getProjectPositions()' "$view"
          grep -q 'getProjectStats()' "$view"
          grep -q 'getRosterStats()' "$view"
          grep -q '\$this->input->getCmd' "$view"
          grep -q 'Uri::root(true)' "$main_template"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::|disconnect\(' "$model" "$staff_model" "$model_bridge" "$view" "$view_bridge" "$main_template"; then
            echo 'Roster core regressed to a removed Joomla compatibility API' >&2
            exit 1
          fi

          if grep -E -- 'sportsmanagementModelProject::|extends JSMModelLegacy|extends sportsmanagementView' "$model" "$staff_model" "$view"; then
            echo 'Native roster core depends on a legacy model/view implementation' >&2
            exit 1
          fi
