name: Joomla 5/6 round notes and season picture gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/SportsManagementFormController.php'
      - 'admin/src/Model/RoundModel.php'
      - 'admin/src/View/Round/HtmlView.php'
      - 'admin/src/Helper/SportsManagementDateHelper.php'
      - 'admin/src/Table/RoundTable.php'
      - 'admin/src/Table/SeasonTable.php'
      - 'admin/forms/round.xml'
      - 'admin/forms/season.xml'
      - 'admin/models/forms/round.xml'
      - 'admin/models/forms/season.xml'
      - 'admin/tmpl/round/edit.php'
      - 'admin/tmpl/season/edit.php'
      - 'admin/sql/install.mysql.utf8.sql'
      - 'admin/sql/updates/mysql/4.24.03.sql'
      - 'sportsmanagement.xml'
      - '.github/tests/joomla56_admin_form_save_acl.php'
      - '.github/tests/joomla56_round_short_dates.php'
      - '.github/tests/joomla56_round_notes_season_picture.php'
      - '.github/workflows/joomla5-6-round-season-fields.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/SportsManagementFormController.php'
      - 'admin/src/Model/RoundModel.php'
      - 'admin/src/View/Round/HtmlView.php'
      - 'admin/src/Helper/SportsManagementDateHelper.php'
      - 'admin/src/Table/RoundTable.php'
      - 'admin/src/Table/SeasonTable.php'
      - 'admin/forms/round.xml'
      - 'admin/forms/season.xml'
      - 'admin/models/forms/round.xml'
      - 'admin/models/forms/season.xml'
      - 'admin/tmpl/round/edit.php'
      - 'admin/tmpl/season/edit.php'
      - 'admin/sql/install.mysql.utf8.sql'
      - 'admin/sql/updates/mysql/4.24.03.sql'
      - 'sportsmanagement.xml'
      - '.github/tests/joomla56_admin_form_save_acl.php'
      - '.github/tests/joomla56_round_short_dates.php'
      - '.github/tests/joomla56_round_notes_season_picture.php'
      - '.github/workflows/joomla5-6-round-season-fields.yml'

permissions:
  contents: read

jobs:
  schema-and-binding:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint editable table classes and layouts
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            admin/src/Controller/SportsManagementFormController.php \
            admin/src/Helper/SportsManagementDateHelper.php \
            admin/src/Model/RoundModel.php \
            admin/src/View/Round/HtmlView.php \
            admin/src/Table/RoundTable.php \
            admin/src/Table/SeasonTable.php \
            admin/tmpl/round/edit.php \
            admin/tmpl/season/edit.php \
            .github/tests/joomla56_admin_form_save_acl.php \
            .github/tests/joomla56_round_short_dates.php \
            .github/tests/joomla56_round_notes_season_picture.php; do
            php -l "$source"
          done
      - name: Test form controller ACL and round zero-date guard
        run: php .github/tests/joomla56_admin_form_save_acl.php
      - name: Test round quick-save nullable dates
        run: php .github/tests/joomla56_round_short_dates.php
      - name: Test table binding, form contracts and schema additions
        run: php .github/tests/joomla56_round_notes_season_picture.php
      - name: Parse Joomla XML forms and manifests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              'admin/forms/round.xml',
              'admin/forms/season.xml',
              'admin/models/forms/round.xml',
              'admin/models/forms/season.xml',
              'sportsmanagement.xml',
          ]:
              ET.parse(path)
          print('Round and season forms and Joomla manifest are well-formed')
          PY

  mariadb-schema:
    runs-on: ubuntu-24.04
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: integration-test
          MARIADB_DATABASE: sportsmanagement_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB SQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
      - name: Apply 4.24.03 migration to existing tables
        shell: bash
        env:
          MYSQL_PWD: integration-test
        run: |
          set -euo pipefail
          db() { mariadb --host=127.0.0.1 --port=3306 --user=root --database=sportsmanagement_test --batch --skip-column-names "$@"; }
          db -e "CREATE TABLE jsm_sportsmanagement_round (id INT PRIMARY KEY, name VARCHAR(75)); CREATE TABLE jsm_sportsmanagement_season (id INT PRIMARY KEY, name VARCHAR(75));"
          sed 's/#__/jsm_/g' admin/sql/updates/mysql/4.24.03.sql | db
          for entry in \
            "jsm_sportsmanagement_round notes text" \
            "jsm_sportsmanagement_season picture_blob mediumblob" \
            "jsm_sportsmanagement_season picture varchar(250)"; do
            read -r table field expected <<< "$entry"
            actual=$(db -e "SELECT CONCAT(COLUMN_TYPE, '|', IS_NULLABLE, '|', COALESCE(COLUMN_DEFAULT, 'NULL')) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='$table' AND COLUMN_NAME='$field'")
            [[ "$actual" == "$expected|YES|NULL" ]] || { echo "Incorrect $table.$field: $actual"; exit 1; }
          done
          db -e "INSERT INTO jsm_sportsmanagement_round (id, notes) VALUES (1, NULL), (2, 'Round note'); INSERT INTO jsm_sportsmanagement_season (id, picture_blob, picture) VALUES (1, NULL, NULL), (2, X'89504E47', 'images/season.png');"
          [[ "$(db -e "SELECT COUNT(*) FROM jsm_sportsmanagement_round WHERE notes='Round note'")" == 1 ]]
          [[ "$(db -e "SELECT COUNT(*) FROM jsm_sportsmanagement_season WHERE picture='images/season.png' AND HEX(picture_blob)='89504E47'")" == 1 ]]
      - name: Verify fresh-install round and season table definitions
        shell: bash
        env:
          MYSQL_PWD: integration-test
        run: |
          set -euo pipefail
          db() { mariadb --host=127.0.0.1 --port=3306 --user=root --database=sportsmanagement_test --batch --skip-column-names "$@"; }
          db -e "DROP TABLE jsm_sportsmanagement_round, jsm_sportsmanagement_season"
          python3 - <<'PY' | db
          import re
          from pathlib import Path
          source = Path("admin/sql/install.mysql.utf8.sql").read_text(encoding="utf-8", errors="replace")
          print("SET SESSION sql_mode = 'STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE';")
          for name in ("round", "season"):
              pattern = r"CREATE\s+TABLE\s+IF\s+NOT\s+EXISTS\s+\x60#__sportsmanagement_" + name + r"\x60"
              match = re.search(pattern, source, flags=re.IGNORECASE)
              if not match:
                  raise SystemExit(f"Missing {name} CREATE TABLE")
              end = source.find(";", match.start())
              if end < 0:
                  raise SystemExit(f"Unterminated {name} CREATE TABLE")
              print(source[match.start():end + 1].replace("#__", "jsm_"))
          PY
          [[ "$(db -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='jsm_sportsmanagement_round' AND COLUMN_NAME='notes' AND COLUMN_TYPE='text' AND IS_NULLABLE='YES'")" == 1 ]]
          [[ "$(db -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='jsm_sportsmanagement_round' AND COLUMN_NAME IN ('round_date_first', 'round_date_last') AND DATA_TYPE='date' AND IS_NULLABLE='YES' AND (COLUMN_DEFAULT IS NULL OR UPPER(COLUMN_DEFAULT)='NULL')")" == 2 ]]
          [[ "$(db -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('jsm_sportsmanagement_round', 'jsm_sportsmanagement_season') AND COLUMN_NAME='checked_out_time' AND DATA_TYPE='datetime' AND IS_NULLABLE='YES' AND (COLUMN_DEFAULT IS NULL OR UPPER(COLUMN_DEFAULT)='NULL')")" == 2 ]]
          db -e "SET SESSION sql_mode = 'STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE'; INSERT INTO jsm_sportsmanagement_round (id, name, notes) VALUES (1, 'Round', 'Note'); INSERT INTO jsm_sportsmanagement_season (id, name, picture) VALUES (1, 'Season', 'images/season.png');"
          [[ "$(db -e "SELECT COUNT(*) FROM jsm_sportsmanagement_round WHERE id=1 AND round_date_first IS NULL AND round_date_last IS NULL AND checked_out_time IS NULL")" == 1 ]]
          [[ "$(db -e "SELECT COUNT(*) FROM jsm_sportsmanagement_season WHERE id=1 AND picture='images/season.png' AND checked_out_time IS NULL")" == 1 ]]
          [[ "$(db -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='jsm_sportsmanagement_season' AND COLUMN_NAME='picture_blob' AND COLUMN_TYPE='mediumblob' AND IS_NULLABLE='YES'")" == 1 ]]
          [[ "$(db -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='jsm_sportsmanagement_season' AND COLUMN_NAME='picture' AND COLUMN_TYPE='varchar(250)' AND IS_NULLABLE='YES'")" == 1 ]]
