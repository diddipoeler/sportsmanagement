name: Joomla 5/6 router compatibility gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  router-compat:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 router bootstrap compatibility
        shell: bash
        run: |
          set -euo pipefail

          native_router=site/src/Service/Router.php
          route_schema=site/src/Service/SiteRouteSchema.php
          legacy_router=site/router.php
          provider=admin/services/provider.php
          component=admin/src/Extension/SportsManagementComponent.php
          smoke_test=.github/tests/router_joomla5_compat.php

          for file in "$native_router" "$route_schema" "$legacy_router" "$provider" "$component" "$smoke_test"; do
            test -f "$file"
            php -l "$file"
          done

          # Execute the Joomla 5 compatibility wrapper against a minimal Joomla
          # API surface. This verifies behaviour rather than only source text:
          # foreign-language Itemid replacement, active-menu inheritance and
          # complete component-segment consumption.
          php "$smoke_test"

          # The native schema is copied from the historical positional route
          # contract. Compare every legacy view and its exact key order so a
          # future router migration cannot silently change existing SEF URLs.
          php -r '
            define("_JEXEC", 1);
            require "site/helpers/route.php";
            require "site/src/Service/SiteRouteSchema.php";
            foreach (sportsmanagementHelperRoute::$views as $view => $defaults) {
                if (!Diddipoeler\Component\SportsManagement\Site\Service\SiteRouteSchema::has($view)) {
                    fwrite(STDERR, "Native route schema is missing view: {$view}\n");
                    exit(1);
                }
                if (Diddipoeler\Component\SportsManagement\Site\Service\SiteRouteSchema::defaults($view) !== $defaults) {
                    fwrite(STDERR, "Native route schema differs for view: {$view}\n");
                    exit(1);
                }
            }
          '

          # Joomla 6 remains on the normal RouterFactory implementation. The
          # native Router itself must not depend on historical helper loaders.
          grep -Fq 'SiteRouteSchema::defaults($view)' "$native_router"
          grep -Fq 'SiteRouteSchema::has($view)' "$native_router"
          if grep -Eq 'LegacyPresentationLoader|sportsmanagementHelperRoute' "$native_router"; then
            echo 'Native router regressed to legacy presentation/route helpers.' >&2
            exit 1
          fi

          # Joomla 5 may reach the compatibility bridge before the component
          # PSR-4 namespace/service container is fully available. Bootstrap only
          # the native route schema and router directly from the component.
          grep -Fq "__DIR__ . '/src/Service/SiteRouteSchema.php'" "$legacy_router"
          grep -Fq "__DIR__ . '/src/Service/Router.php'" "$legacy_router"
          grep -Fq 'require_once $routeSchema;' "$legacy_router"
          grep -Fq 'require_once $nativeRouter;' "$legacy_router"
          grep -Fq 'class_exists(SiteRouteSchema::class)' "$legacy_router"
          grep -Fq 'SportsManagement native site router could not be loaded.' "$legacy_router"
          if grep -Fq 'LegacyPresentationLoader' "$legacy_router"; then
            echo 'Joomla 5 router bootstrap regressed to the presentation loader.' >&2
            exit 1
          fi

          # Joomla 5 LegacyComponent::createRouter() uses reflection to decide
          # whether the historical global class is a class-based router. Declare
          # RouterInterface explicitly so RouterLegacy is never selected here.
          grep -Fq 'class SportsmanagementRouter extends SportsManagementRouterService implements RouterInterface' "$legacy_router"
          grep -Fq 'public function __construct(?CMSApplicationInterface $app = null, ?AbstractMenu $menu = null)' "$legacy_router"
          grep -Fq '$app ??= Factory::getApplication();' "$legacy_router"
          grep -Fq '$menu ??= $app->getMenu();' "$legacy_router"

          # Joomla 5 uses the compatibility wrapper explicitly; Joomla 6 must
          # continue through RouterFactory. This keeps version-specific parsing
          # behaviour out of the Joomla 6 native router.
          grep -Fq 'createRouter as private createFactoryRouter;' "$component"
          grep -Fq "version_compare(JVERSION, '6.0.0', 'lt')" "$component"
          grep -Fq "JPATH_SITE . '/components/com_sportsmanagement/router.php'" "$component"
          grep -Fq 'return new \SportsmanagementRouter($application, $menu);' "$component"
          grep -Fq 'return $this->createFactoryRouter($application, $menu);' "$component"

          # Joomla 5 language filtering must not retain an Itemid belonging to a
          # foreign-language SportsManagement menu item. Prefer the exact current
          # language and keep '*' only as a fallback.
          grep -Fq 'public function preprocess($query)' "$legacy_router"
          grep -Fq "method_exists(\$this->app, 'getLanguageFilter')" "$legacy_router"
          grep -Fq '$this->isLanguageCompatibleMenuItem($item, $view)' "$legacy_router"
          grep -Fq '$replacement = $this->findLanguageCompatibleMenuItem($query, $view);' "$legacy_router"
          grep -Fq '$score = $language === $currentLanguage ? 1000 : 500;' "$legacy_router"

          # Restore the historical Joomla 5 parse contract: recognised routes
          # inherit the active SportsManagement menu query and consume all
          # component segments, avoiding Joomla 5 RouteNotFoundException on
          # obsolete trailing positional segments.
          grep -Fq 'public function parse(&$segments)' "$legacy_router"
          grep -Fq '$vars = parent::parse($segments);' "$legacy_router"
          grep -Fq '$active = $this->menu->getActive();' "$legacy_router"
          grep -Fq '$vars = array_merge($menuQuery, $vars);' "$legacy_router"
          grep -Fq '$segments = [];' "$legacy_router"

          # Once router.php is executing, re-entering bootComponent() can recurse
          # through Joomla 5 LegacyComponent::createRouter(). The bridge must use
          # the already available native router class directly. Match executable
          # calls only so explanatory comments containing bootComponent() do not
          # trigger a false positive.
          grep -Fq '$router = new SportsmanagementRouter();' "$legacy_router"
          if grep -Eq -- '(->|::)bootComponent[[:space:]]*\(' "$legacy_router"; then
            echo 'Legacy router bridge must not re-enter bootComponent().' >&2
            exit 1
          fi
          if grep -Fq 'RouterServiceInterface' "$legacy_router"; then
            echo 'Legacy router bridge regressed to component-service re-entry.' >&2
            exit 1
          fi
          if grep -Fq 'DatabaseInterface::class' "$legacy_router"; then
            echo 'Legacy router fallback regressed to a DatabaseInterface container lookup.' >&2
            exit 1
          fi

          # RouterLegacy::parse() itself receives the segment list by reference.
          # The compatibility function must preserve that reference so the native
          # parser can consume segments and Joomla 5 does not append them again.
          grep -Fq 'function SportsmanagementParseRoute(&$segments)' "$legacy_router"
          grep -Fq 'return sportsmanagementGetRouter()->parse($segments);' "$legacy_router"

          # Legacy BuildRoute must run preprocess() itself because RouterLegacy's
          # preprocess() is a no-op, then delegate to the same router instance.
          grep -Fq '$router = sportsmanagementGetRouter();' "$legacy_router"
          grep -Fq '$query = $router->preprocess($query);' "$legacy_router"
          grep -Fq 'return $router->build($query);' "$legacy_router"

          grep -Fq 'class Router extends RouterBase' "$native_router"
          grep -Fq '?CategoryFactoryInterface $categoryFactory = null' "$native_router"
          grep -Fq '?DatabaseInterface $db = null' "$native_router"
          grep -Fq 'implements RouterServiceInterface' "$component"
          grep -Fq 'setRouterFactory($container->get(RouterFactoryInterface::class))' "$provider"
