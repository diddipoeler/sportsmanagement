name: Joomla 5/6 random quotes gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  random-quotes:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate random quotes module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_rquotes
          manifest="$module/mod_sportsmanagement_rquotes.xml"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/RquotesHelper.php"
          test -f "$module/tmpl/default.php"
          test -f "$module/tmpl/textfile.php"
          test ! -d "$module/elements"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/RquotesHelper.php"
          php -l "$module/mod_sportsmanagement_rquotes.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"
          php -l "$module/tmpl/textfile.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementRquotes</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'registerAndUseStyle' "$module/src/Dispatcher/Dispatcher.php"
          grep -q "require __DIR__ . '/textfile.php'" "$module/tmpl/default.php"
          grep -q "\['bold', 'italic', 'style', 'sticker'\]" "$module/tmpl/default.php"
          grep -q 'getDBConnection(true, $selector)' "$module/src/Helper/RquotesHelper.php"
          grep -q 'random_int' "$module/src/Helper/RquotesHelper.php"

          if grep -q 'addfieldpath' "$manifest"; then
            echo 'Random quotes manifest regressed to addfieldpath.' >&2
            exit 1
          fi

          if grep -q '<folder>elements</folder>' "$manifest"; then
            echo 'Random quotes manifest reintroduced obsolete elements folder.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/RquotesHelper.php" \
            "$module/mod_sportsmanagement_rquotes.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php" \
            "$module/tmpl/textfile.php"; then
            echo 'Random quotes module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
