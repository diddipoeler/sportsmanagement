name: Joomla 5/6 runtime metadata follow-up gate

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/src/Helper/PredictionRouteHelper.php'
      - 'site/src/Controller/PredictionusersController.php'
      - 'site/controllers/predictionusers.php'
      - 'site/src/Controller/PredictionentryController.php'
      - 'site/controllers/predictionentry.php'
      - 'site/views/json/view.html.php'
      - 'admin/src/Controller/UpdateController.php'
      - 'admin/controllers/update.php'
      - 'admin/models/fields/color.php'
      - 'admin/src/Field/DependsqlField.php'
      - 'admin/src/Field/ImageselectField.php'
      - 'admin/src/Field/MultidependsqlField.php'
      - 'admin/elements/dependsql.php'
      - 'admin/elements/imageselect.php'
      - 'admin/elements/multidependsql.php'
      - 'modules/mod_sportsmanagement_navigation_menu/**/*.php'
      - 'modules/mod_sportsmanagement_count_rekord/**/*.php'
      - 'modules/mod_sportsmanagement_new_project/**/*.php'
      - 'modules/mod_sportsmanagement_act_season/**/*.php'
      - 'modules/mod_sportsmanagement_google_calendar/**/*.php'
      - 'modules/mod_sportsmanagement_gcalendar/**/*.php'
      - 'modules/mod_sportsmanagement_projectmap/**/*.php'
      - '.github/workflows/joomla5-6-runtime-metadata-follow-up.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/src/Helper/PredictionRouteHelper.php'
      - 'site/src/Controller/PredictionusersController.php'
      - 'site/controllers/predictionusers.php'
      - 'site/src/Controller/PredictionentryController.php'
      - 'site/controllers/predictionentry.php'
      - 'site/views/json/view.html.php'
      - 'admin/src/Controller/UpdateController.php'
      - 'admin/controllers/update.php'
      - 'admin/models/fields/color.php'
      - 'admin/src/Field/DependsqlField.php'
      - 'admin/src/Field/ImageselectField.php'
      - 'admin/src/Field/MultidependsqlField.php'
      - 'admin/elements/dependsql.php'
      - 'admin/elements/imageselect.php'
      - 'admin/elements/multidependsql.php'
      - 'modules/mod_sportsmanagement_navigation_menu/**/*.php'
      - 'modules/mod_sportsmanagement_count_rekord/**/*.php'
      - 'modules/mod_sportsmanagement_new_project/**/*.php'
      - 'modules/mod_sportsmanagement_act_season/**/*.php'
      - 'modules/mod_sportsmanagement_google_calendar/**/*.php'
      - 'modules/mod_sportsmanagement_gcalendar/**/*.php'
      - 'modules/mod_sportsmanagement_projectmap/**/*.php'
      - '.github/workflows/joomla5-6-runtime-metadata-follow-up.yml'

jobs:
  runtime-metadata:
    name: Runtime migration and PHP metadata checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migrated PHP runtime files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/Helper/PredictionRouteHelper.php
            site/src/Controller/PredictionusersController.php
            site/controllers/predictionusers.php
            site/src/Controller/PredictionentryController.php
            site/controllers/predictionentry.php
            site/views/json/view.html.php
            admin/src/Controller/UpdateController.php
            admin/controllers/update.php
            admin/models/fields/color.php
            admin/src/Field/DependsqlField.php
            admin/src/Field/ImageselectField.php
            admin/src/Field/MultidependsqlField.php
            admin/elements/dependsql.php
            admin/elements/imageselect.php
            admin/elements/multidependsql.php
            modules/mod_sportsmanagement_navigation_menu/mod_sportsmanagement_navigation_menu.php
            modules/mod_sportsmanagement_navigation_menu/helper.php
            modules/mod_sportsmanagement_navigation_menu/services/provider.php
            modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
            modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_count_rekord/services/provider.php
            modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
            modules/mod_sportsmanagement_count_rekord/tmpl/default.php
            modules/mod_sportsmanagement_new_project/mod_sportsmanagement_new_project.php
            modules/mod_sportsmanagement_new_project/helper.php
            modules/mod_sportsmanagement_new_project/services/provider.php
            modules/mod_sportsmanagement_new_project/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
            modules/mod_sportsmanagement_new_project/tmpl/default.php
            modules/mod_sportsmanagement_new_project/tmpl/native.php
            modules/mod_sportsmanagement_act_season/mod_sportsmanagement_act_season.php
            modules/mod_sportsmanagement_act_season/helper.php
            modules/mod_sportsmanagement_act_season/services/provider.php
            modules/mod_sportsmanagement_act_season/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php
            modules/mod_sportsmanagement_act_season/tmpl/default.php
            modules/mod_sportsmanagement_google_calendar/mod_sportsmanagement_google_calendar.php
            modules/mod_sportsmanagement_google_calendar/helper.php
            modules/mod_sportsmanagement_google_calendar/services/provider.php
            modules/mod_sportsmanagement_google_calendar/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_google_calendar/src/Helper/GoogleCalendarHelper.php
            modules/mod_sportsmanagement_google_calendar/tmpl/calendar.php
            modules/mod_sportsmanagement_google_calendar/tmpl/default.php
            modules/mod_sportsmanagement_gcalendar/mod_sportsmanagement_gcalendar.php
            modules/mod_sportsmanagement_gcalendar/helper.php
            modules/mod_sportsmanagement_gcalendar/services/provider.php
            modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
            modules/mod_sportsmanagement_gcalendar/tmpl/default.php
            modules/mod_sportsmanagement_projectmap/mod_sportsmanagement_projectmap.php
            modules/mod_sportsmanagement_projectmap/helper.php
            modules/mod_sportsmanagement_projectmap/services/provider.php
            modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php
            modules/mod_sportsmanagement_projectmap/tmpl/default.php
            modules/mod_sportsmanagement_projectmap/tmpl/vectormap.php
          )

          required_tags=(
            '@version'
            '@author'
            '@copyright'
            '@license'
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"

            for tag in "${required_tags[@]}"; do
              if ! grep -Fq "$tag" "$file"; then
                echo "$file is missing required PHPDoc tag $tag" >&2
                exit 1
              fi
            done
          done

          grep -Fq 'use Diddipoeler\Component\SportsManagement\Site\Helper\PredictionRouteHelper;' site/src/Controller/PredictionusersController.php
          grep -Fq 'PredictionRouteHelper::member(' site/src/Controller/PredictionusersController.php
          if grep -Eq 'JSMPredictionHelperRoute|helpers/predictionroute\.php' site/src/Controller/PredictionusersController.php; then
            echo 'Prediction users controller regressed to the legacy prediction route helper' >&2
            exit 1
          fi

          grep -Fq 'return SiteRouteHelper::view($view, $parameters);' site/src/Helper/PredictionRouteHelper.php
          grep -Fq "return SiteRouteHelper::view('predictionentry', \$parameters);" site/src/Helper/PredictionRouteHelper.php
          grep -Fq 'PredictionRouteHelper::entry(' site/src/Controller/PredictionentryController.php
          if grep -Eq "Route::_|http_build_query" site/src/Controller/PredictionentryController.php; then
            echo 'Prediction entry controller regressed to manual route construction' >&2
            exit 1
          fi

          grep -Fq 'public function display($cachable = false, $urlparams = [])' admin/src/Controller/UpdateController.php
          grep -Fq 'getWebAssetManager()->addInlineScript' admin/src/Field/DependsqlField.php
          if grep -Fq 'addScriptDeclaration' admin/src/Field/DependsqlField.php; then
            echo 'Dependent SQL field regressed to legacy script declarations' >&2
            exit 1
          fi

          grep -Fq 'SiteRouteHelper::view(' modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
          if grep -Fq 'sportsmanagementHelperRoute::' modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php; then
            echo 'Navigation menu native helper regressed to the legacy component route helper' >&2
            exit 1
          fi

          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php

          grep -Fq 'new ModuleDispatcherFactory' modules/mod_sportsmanagement_new_project/services/provider.php
          grep -Fq 'getWebAssetManager()' modules/mod_sportsmanagement_new_project/src/Dispatcher/Dispatcher.php
          grep -Fq 'SiteRouteHelper::view(' modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
          if grep -Fq '\Joomla\CMS\Factory::' modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php; then
            echo 'New Project helper contains redundant legacy-style fully qualified Factory access' >&2
            exit 1
          fi

          grep -Fq 'new ModuleDispatcherFactory' modules/mod_sportsmanagement_act_season/services/provider.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' modules/mod_sportsmanagement_act_season/src/Dispatcher/Dispatcher.php
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php
          grep -Fq "SiteRouteHelper::view('ranking'" modules/mod_sportsmanagement_act_season/tmpl/default.php
          if grep -Fq '\Joomla\CMS\Factory::' modules/mod_sportsmanagement_act_season/src/Dispatcher/Dispatcher.php; then
            echo 'Act Season dispatcher contains redundant fully qualified Factory access' >&2
            exit 1
          fi

          grep -Fq 'new ModuleDispatcherFactory' modules/mod_sportsmanagement_google_calendar/services/provider.php
          grep -Fq -- "->getHelper('GoogleCalendarHelper')" modules/mod_sportsmanagement_google_calendar/src/Dispatcher/Dispatcher.php
          grep -Fq 'Factory::getContainer()->get(CacheControllerFactoryInterface::class)' modules/mod_sportsmanagement_google_calendar/src/Helper/GoogleCalendarHelper.php
          if grep -Fq '\Joomla\CMS\Factory::' modules/mod_sportsmanagement_google_calendar/src/Helper/GoogleCalendarHelper.php; then
            echo 'Google Calendar helper contains redundant fully qualified Factory access' >&2
            exit 1
          fi
          if grep -Eqi 'jQuery\(|fullCalendar\(|addScriptDeclaration|api_key.*(script|javascript)' modules/mod_sportsmanagement_google_calendar/tmpl/calendar.php; then
            echo 'Google Calendar compatibility layout regressed to legacy client-side calendar/API-key handling' >&2
            exit 1
          fi
          grep -Fq "require __DIR__ . '/default.php';" modules/mod_sportsmanagement_google_calendar/tmpl/calendar.php

          grep -Fq 'new ModuleDispatcherFactory' modules/mod_sportsmanagement_gcalendar/services/provider.php
          grep -Fq 'protected function getLayoutData(): array|false' modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php
          grep -Fq 'getWebAssetManager()' modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php
          grep -Fq 'addScriptOptions(' modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
          grep -Fq "Route::_(" modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
          grep -Fq '            false' modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
          if grep -Fq '\Joomla\CMS\Factory::' modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php; then
            echo 'GCalendar helper contains redundant fully qualified Factory access' >&2
            exit 1
          fi

          grep -Fq 'new ModuleDispatcherFactory' modules/mod_sportsmanagement_projectmap/services/provider.php
          grep -Fq 'protected function getLayoutData(): array|false' modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php
          grep -Fq 'getWebAssetManager()' modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php
          grep -Fq "SiteRouteHelper::view('ranking'" modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php
          if grep -Fq '\Joomla\CMS\Factory::' modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php; then
            echo 'Project Map dispatcher contains redundant fully qualified Factory access' >&2
            exit 1
          fi
          if grep -Eqi 'jQuery\(|vectorMap\(|<head|<body' modules/mod_sportsmanagement_projectmap/tmpl/vectormap.php; then
            echo 'Project Map compatibility layout regressed to an embedded legacy client-side document/runtime' >&2
            exit 1
          fi
          grep -Fq "require __DIR__ . '/default.php';" modules/mod_sportsmanagement_projectmap/tmpl/vectormap.php
