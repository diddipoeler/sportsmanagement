name: Joomla 5/6 season event statistics and modules gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  migration-contracts:
    name: Season, event and statistics module checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 migration contracts
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/Model/MatchstatisticModel.php
            admin/src/Model/MatchstaffstatisticModel.php
            admin/src/Model/SeasonpersonModel.php
            admin/src/Model/SeasonteamModel.php
            admin/src/Model/SeasonteampersonModel.php
            site/src/Model/EventModel.php
            site/src/Model/HitlistModel.php
            site/src/Model/JsonfeedModel.php
            modules/mod_sportsmanagement_sports_type_statistics/helper.php
            modules/mod_sportsmanagement_sports_type_statistics/mod_sportsmanagement_sports_type_statistics.php
            modules/mod_sportsmanagement_sports_type_statistics/services/provider.php
            modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php
            modules/mod_sportsmanagement_sports_type_statistics/tmpl/default.php
            modules/mod_sportsmanagement_randomplayer/helper.php
            modules/mod_sportsmanagement_randomplayer/mod_sportsmanagement_randomplayer.php
            modules/mod_sportsmanagement_randomplayer/services/provider.php
            modules/mod_sportsmanagement_randomplayer/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_randomplayer/src/Helper/RandomPlayerHelper.php
            modules/mod_sportsmanagement_randomplayer/tmpl/default.php
            modules/mod_sportsmanagement_randomplayer/tmpl/native.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          grep -Fq 'extends SportsManagementAdminModel' admin/src/Model/MatchstatisticModel.php
          grep -Fq 'new MatchstatisticTable($this->getDatabase())' admin/src/Model/MatchstatisticModel.php
          grep -Fq 'extends SportsManagementAdminModel' admin/src/Model/MatchstaffstatisticModel.php
          grep -Fq 'new MatchstaffstatisticTable($this->getDatabase())' admin/src/Model/MatchstaffstatisticModel.php

          for file in admin/src/Model/SeasonpersonModel.php admin/src/Model/SeasonteamModel.php admin/src/Model/SeasonteampersonModel.php; do
            grep -Fq 'extends SportsManagementAdminModel' "$file"
            grep -Fq '$this->administratorApplication()->getIdentity()->authorise(' "$file"
          done

          for file in site/src/Model/EventModel.php site/src/Model/HitlistModel.php site/src/Model/JsonfeedModel.php; do
            grep -Fq 'extends SportsManagementModel' "$file"
            grep -Fq '$this->getDatabase()' "$file"
          done
          grep -Fq '$this->siteApplication()->getInput()' site/src/Model/HitlistModel.php

          sts=modules/mod_sportsmanagement_sports_type_statistics
          grep -Fq 'ModuleDispatcherFactory' "$sts/services/provider.php"
          grep -Fq 'HelperFactory' "$sts/services/provider.php"
          grep -Fq 'extends AbstractModuleDispatcher' "$sts/src/Dispatcher/Dispatcher.php"
          grep -Fq 'getHelperFactory()' "$sts/src/Dispatcher/Dispatcher.php"
          grep -Fq 'getWebAssetManager' "$sts/src/Dispatcher/Dispatcher.php"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$sts/src/Dispatcher/Dispatcher.php"
          ! grep -Fq '$app->getContainer()' "$sts/src/Dispatcher/Dispatcher.php"
          ! grep -Fq -- '->getApplication()->getContainer()' "$sts/src/Dispatcher/Dispatcher.php"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$sts/src/Helper/SportsTypeStatisticsHelper.php"
          grep -Fq 'class modJSMSportsHelper' "$sts/helper.php"

          random=modules/mod_sportsmanagement_randomplayer
          grep -Fq 'ModuleDispatcherFactory' "$random/services/provider.php"
          grep -Fq 'HelperFactory' "$random/services/provider.php"
          grep -Fq 'extends AbstractModuleDispatcher' "$random/src/Dispatcher/Dispatcher.php"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$random/src/Dispatcher/Dispatcher.php"
          ! grep -Fq '$app->getContainer()' "$random/src/Dispatcher/Dispatcher.php"
          ! grep -Fq -- '->getApplication()->getContainer()' "$random/src/Dispatcher/Dispatcher.php"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$random/src/Helper/RandomPlayerHelper.php"
          grep -Fq 'SiteRouteHelper::view(' "$random/src/Helper/RandomPlayerHelper.php"
          grep -Fq "require __DIR__ . '/native.php';" "$random/tmpl/default.php"

          if grep -E -- 'sportsmanagementHelperRoute::|Factory::getDbo\(|Factory::getDBO\(|JFactory::|JRequest::|JLoader::|jimport\(|\$app->getContainer\(|->getApplication\(\)->getContainer\(' "$sts/mod_sportsmanagement_sports_type_statistics.php" "$sts/services/provider.php" "$sts/src/Dispatcher/Dispatcher.php" "$sts/src/Helper/SportsTypeStatisticsHelper.php" "$sts/tmpl/default.php" "$random/mod_sportsmanagement_randomplayer.php" "$random/services/provider.php" "$random/src/Dispatcher/Dispatcher.php" "$random/src/Helper/RandomPlayerHelper.php" "$random/tmpl/default.php" "$random/tmpl/native.php"; then
            echo 'Statistics/random-player runtime regressed to a legacy or protected Joomla API' >&2
            exit 1
          fi

          echo 'Joomla 5/6 season, event, statistics and module contracts OK'
