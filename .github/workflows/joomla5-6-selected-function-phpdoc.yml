name: Joomla 5/6 migrated function PHPDoc coverage

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/ResultsController.php'
      - 'site/src/Controller/PredictionentryController.php'
      - 'site/src/Controller/AjaxController.php'
      - 'site/src/Controller/MatchesController.php'
      - 'admin/src/Model/AgegroupsModel.php'
      - 'admin/src/Controller/AgegroupsController.php'
      - 'modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php'
      - 'modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - '.github/tests/joomla56_selected_function_phpdoc.php'
      - '.github/workflows/joomla5-6-selected-function-phpdoc.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  method-phpdoc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint function documentation audit
        run: php -l .github/tests/joomla56_selected_function_phpdoc.php
      - name: Verify every named method in this migration batch has PHPDoc
        run: php .github/tests/joomla56_selected_function_phpdoc.php
