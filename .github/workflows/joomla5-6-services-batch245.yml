name: Joomla 5/6 services batch 245

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Service/FinderRelationNotifier.php'
      - 'admin/src/Service/MatchTimelineWriteService.php'
      - 'admin/src/Service/MatchWriteService.php'
      - 'admin/src/Service/PlayerPersistenceService.php'
      - '.github/workflows/joomla5-6-services-batch245.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Service/FinderRelationNotifier.php'
      - 'admin/src/Service/MatchTimelineWriteService.php'
      - 'admin/src/Service/MatchWriteService.php'
      - 'admin/src/Service/PlayerPersistenceService.php'
      - '.github/workflows/joomla5-6-services-batch245.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Service/FinderRelationNotifier.php
            admin/src/Service/MatchTimelineWriteService.php
            admin/src/Service/MatchWriteService.php
            admin/src/Service/PlayerPersistenceService.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- 'SportsManagementAdministratorApplicationResolver::resolve()' "$file"
            ! grep -Fq -- 'Factory::getApplication()' "$file"
          done
          echo 'Joomla 5/6 batch 245 contracts OK.'
