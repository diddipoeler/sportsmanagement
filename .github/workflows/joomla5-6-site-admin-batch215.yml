name: Joomla 5/6 site admin batch 215

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Staff/HtmlView.php'
      - 'admin/src/View/Playground/HtmlView.php'
      - '.github/workflows/joomla5-6-site-admin-batch215.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/View/Staff/HtmlView.php'
      - 'admin/src/View/Playground/HtmlView.php'
      - '.github/workflows/joomla5-6-site-admin-batch215.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(site/src/View/Staff/HtmlView.php admin/src/View/Playground/HtmlView.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done
      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- 'if ($document instanceof HtmlDocument)' site/src/View/Staff/HtmlView.php

          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Playground/HtmlView.php
          grep -Fq -- 'if (!$document instanceof HtmlDocument)' admin/src/View/Playground/HtmlView.php
          ! grep -Fq -- 'Factory::getApplication()' admin/src/View/Playground/HtmlView.php
          ! grep -Fq -- '$this->getDocument()->getWebAssetManager()' admin/src/View/Playground/HtmlView.php
          echo 'Joomla 5/6 batch 215 contracts OK.'
