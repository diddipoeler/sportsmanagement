name: Joomla 5/6 site admin calendar batch 117

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/editmatch/default.php'
      - 'admin/tmpl/match/edit.php'
      - 'modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml'
      - 'modules/mod_sportsmanagement_calendar/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-calendar-batch117.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/editmatch/default.php'
      - 'admin/tmpl/match/edit.php'
      - 'modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml'
      - 'modules/mod_sportsmanagement_calendar/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-calendar-batch117.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Joomla 5/6 batch 117
        shell: bash
        run: |
          set -euo pipefail

          site_layout=site/tmpl/editmatch/default.php
          admin_layout=admin/tmpl/match/edit.php
          manifest=modules/mod_sportsmanagement_calendar/mod_sportsmanagement_calendar.xml
          update_xml=modules/mod_sportsmanagement_calendar/update-server.xml

          php -l "$site_layout"
          php -l "$admin_layout"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$manifest"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$update_xml"

          grep -Fq 'data-editmatch-form' "$site_layout"
          grep -Fq "registerAndUseScript(" "$site_layout"
          grep -Fq 'class="btn btn-success"' "$site_layout"
          grep -Fq 'class="form-select w-auto"' "$site_layout"
          grep -Fq 'class="options-form' "$site_layout"
          if grep -Fq 'onclick=' "$site_layout" || \
             grep -Fq 'class="fltrt"' "$site_layout" || \
             grep -Fq 'class="admintable"' "$site_layout"; then
            echo 'Frontend match editor regressed to legacy markup or inline handlers' >&2
            exit 1
          fi

          grep -Fq 'data-match-edit-form' "$admin_layout"
          grep -Fq 'data-match-submit-task="match.apply"' "$admin_layout"
          grep -Fq 'data-match-submit-task="match.save"' "$admin_layout"
          grep -Fq "button.addEventListener('click'" "$admin_layout"
          if grep -Fq 'onclick=' "$admin_layout"; then
            echo 'Administrator match editor regressed to inline event handlers' >&2
            exit 1
          fi

          grep -Fq '<version>5.6.0</version>' "$manifest"
          grep -Fq '<field type="extensionversion" version="5.6.0" />' "$manifest"
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementCalendar</namespace>' "$manifest"
          grep -Fq '<version>5.6.0</version>' "$update_xml"
          grep -Fq '<targetplatform name="joomla" version="[56].*" />' "$update_xml"
          grep -Fq '<php_minimum>8.1.0</php_minimum>' "$update_xml"

          echo 'Joomla 5/6 batch 117 contracts OK'
