name: Joomla 5/6 site admin CountRekord batch 141

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Stats/HtmlView.php'
      - 'site/src/View/Roster/HtmlView.php'
      - 'site/src/View/Matrix/HtmlView.php'
      - 'site/src/View/Staff/HtmlView.php'
      - 'admin/views/leagues/view.html.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-site-admin-countrekord-batch141.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/View/Stats/HtmlView.php'
      - 'site/src/View/Roster/HtmlView.php'
      - 'site/src/View/Matrix/HtmlView.php'
      - 'site/src/View/Staff/HtmlView.php'
      - 'admin/views/leagues/view.html.php'
      - 'modules/mod_sportsmanagement_count_rekord/**'
      - '.github/workflows/joomla5-6-site-admin-countrekord-batch141.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/View/Stats/HtmlView.php
            site/src/View/Roster/HtmlView.php
            site/src/View/Matrix/HtmlView.php
            site/src/View/Staff/HtmlView.php
            admin/views/leagues/view.html.php
            modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Stats view.' site/src/View/Stats/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Roster view.' site/src/View/Roster/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Matrix view.' site/src/View/Matrix/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Staff view.' site/src/View/Staff/HtmlView.php

          admin_bridge=admin/views/leagues/view.html.php
          dispatcher=modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php

          grep -Fq 'SportsManagement native administrator Leagues view could not be loaded.' "$admin_bridge"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewLeagues')" "$admin_bridge"

          grep -Fq 'use Joomla\CMS\Application\SiteApplication;' "$dispatcher"
          grep -Fq 'SportsManagement CountRekord requires the Joomla site application.' "$dispatcher"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$dispatcher"

          echo 'Joomla 5/6 batch 141 contracts OK.'
