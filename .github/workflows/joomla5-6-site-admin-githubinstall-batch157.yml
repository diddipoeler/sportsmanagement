name: Joomla 5/6 site admin GitHubinstall batch 157

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Editclub/HtmlView.php'
      - 'site/src/View/Editmatch/HtmlView.php'
      - 'site/src/View/Editperson/HtmlView.php'
      - 'site/src/View/Editprojectteam/HtmlView.php'
      - 'site/src/View/Editteam/HtmlView.php'
      - 'admin/views/githubinstall/view.html.php'
      - 'admin/src/View/Githubinstall/HtmlView.php'
      - 'admin/tmpl/githubinstall/default.php'
      - '.github/workflows/joomla5-6-site-admin-githubinstall-batch157.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/View/Editclub/HtmlView.php'
      - 'site/src/View/Editmatch/HtmlView.php'
      - 'site/src/View/Editperson/HtmlView.php'
      - 'site/src/View/Editprojectteam/HtmlView.php'
      - 'site/src/View/Editteam/HtmlView.php'
      - 'admin/views/githubinstall/view.html.php'
      - 'admin/src/View/Githubinstall/HtmlView.php'
      - 'admin/tmpl/githubinstall/default.php'
      - '.github/workflows/joomla5-6-site-admin-githubinstall-batch157.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/View/Editclub/HtmlView.php
            site/src/View/Editmatch/HtmlView.php
            site/src/View/Editperson/HtmlView.php
            site/src/View/Editprojectteam/HtmlView.php
            site/src/View/Editteam/HtmlView.php
            admin/views/githubinstall/view.html.php
            admin/src/View/Githubinstall/HtmlView.php
            admin/tmpl/githubinstall/default.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Editclub view.' site/src/View/Editclub/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Editmatch view.' site/src/View/Editmatch/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Editperson view.' site/src/View/Editperson/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Editprojectteam view.' site/src/View/Editprojectteam/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Editteam view.' site/src/View/Editteam/HtmlView.php

          bridge=admin/views/githubinstall/view.html.php
          native=admin/src/View/Githubinstall/HtmlView.php
          layout=admin/tmpl/githubinstall/default.php

          grep -Fq 'SportsManagement native administrator GitHubinstall view could not be loaded.' "$bridge"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewgithubinstall')" "$bridge"
          grep -Fq 'Native Joomla 5/6 administrator SportsManagement GitHubinstall view.' "$native"
          grep -Fq 'Native Joomla 5/6 administrator SportsManagement GitHubinstall layout.' "$layout"

          echo 'Joomla 5/6 batch 157 contracts OK.'
