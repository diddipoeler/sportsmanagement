name: Joomla 5/6 site admin metadata batch 254

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/views/players/tmpl/default_data.php'
      - 'admin/views/players/tmpl/assignconfirm.php'
      - 'admin/views/players/tmpl/players_upload.php'
      - 'admin/views/project/tmpl/panel_3.php'
      - 'site/views/teaminfo/tmpl/default.php'
      - 'site/views/teaminfo/tmpl/default_description.php'
      - 'site/views/teaminfo/tmpl/default_teamseasons.php'
      - 'site/views/teaminfo/tmpl/default_training.php'
      - '.github/workflows/joomla5-6-site-admin-metadata-batch254.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/views/players/tmpl/default_data.php'
      - 'admin/views/players/tmpl/assignconfirm.php'
      - 'admin/views/players/tmpl/players_upload.php'
      - 'admin/views/project/tmpl/panel_3.php'
      - 'site/views/teaminfo/tmpl/default.php'
      - 'site/views/teaminfo/tmpl/default_description.php'
      - 'site/views/teaminfo/tmpl/default_teamseasons.php'
      - 'site/views/teaminfo/tmpl/default_training.php'
      - '.github/workflows/joomla5-6-site-admin-metadata-batch254.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate bridges and metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/views/players/tmpl/default_data.php
            admin/views/players/tmpl/assignconfirm.php
            admin/views/players/tmpl/players_upload.php
            admin/views/project/tmpl/panel_3.php
            site/views/teaminfo/tmpl/default.php
            site/views/teaminfo/tmpl/default_description.php
            site/views/teaminfo/tmpl/default_teamseasons.php
            site/views/teaminfo/tmpl/default_training.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done
          echo 'Joomla 5/6 metadata batch 254 contracts OK.'
