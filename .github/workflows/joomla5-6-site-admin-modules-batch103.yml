name: Joomla 5/6 site admin modules batch 103

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/roster/default_players_johncage.php'
      - 'site/tmpl/roster/default_staff_johncage.php'
      - 'admin/tables/jsmgcalendarcomment.php'
      - 'modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch103.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/roster/default_players_johncage.php'
      - 'site/tmpl/roster/default_staff_johncage.php'
      - 'admin/tables/jsmgcalendarcomment.php'
      - 'modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch103.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Joomla 5/6 batch 103
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/tmpl/roster/default_players_johncage.php
            site/tmpl/roster/default_staff_johncage.php
            admin/tables/jsmgcalendarcomment.php
            modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Fq '@version    5.6.0' "$file"
            grep -Fq '@author     diddipoeler' "$file"
            grep -Fq '@copyright  Copyright (C) diddipoeler' "$file"
            grep -Fq '@license    GNU General Public License version 2 or later; see LICENSE.txt' "$file"
          done

          for roster in \
            site/tmpl/roster/default_players_johncage.php \
            site/tmpl/roster/default_staff_johncage.php; do
            if grep -Fq 'Joomla\CMS\Filesystem\' "$roster"; then
              echo "$roster still imports the Joomla 6 removed CMS filesystem package" >&2
              exit 1
            fi
          done

          table=admin/tables/jsmgcalendarcomment.php
          grep -Fq 'use Joomla\Database\DatabaseDriver;' "$table"
          grep -Fq 'public function __construct(DatabaseDriver $db)' "$table"
          if grep -E -- 'JLoader::|jimport\(' "$table"; then
            echo 'Calendar comment table regressed to the legacy class loader' >&2
            exit 1
          fi

          helper=modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
          grep -Fq '$app->getInput()' "$helper"
          grep -Fq "Session::checkToken('post')" "$helper"
          grep -Fq '$db->createQuery()' "$helper"
          if grep -Fq -- '->getError()' "$helper"; then
            echo 'New Project helper regressed to legacy model error handling' >&2
            exit 1
          fi

          echo 'Joomla 5/6 batch 103 contracts OK'
