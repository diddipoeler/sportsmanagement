name: Joomla 5/6 site admin modules batch 108

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/editperson/tmpl/assignperson.php'
      - 'site/assets/js/assignperson.js'
      - 'admin/views/match/tmpl/editstats.php'
      - 'admin/assets/js/matchstats.js'
      - 'modules/mod_sportsmanagement_matchesslider/mod_sportsmanagement_matchesslider.xml'
      - 'modules/mod_sportsmanagement_matchesslider/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch108.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'site/views/editperson/tmpl/assignperson.php'
      - 'site/assets/js/assignperson.js'
      - 'admin/views/match/tmpl/editstats.php'
      - 'admin/assets/js/matchstats.js'
      - 'modules/mod_sportsmanagement_matchesslider/mod_sportsmanagement_matchesslider.xml'
      - 'modules/mod_sportsmanagement_matchesslider/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch108.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Joomla 5/6 batch 108
        shell: bash
        run: |
          set -euo pipefail

          php_files=(
            site/views/editperson/tmpl/assignperson.php
            admin/views/match/tmpl/editstats.php
          )

          for file in "${php_files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

          node --check site/assets/js/assignperson.js
          node --check admin/assets/js/matchstats.js

          site_layout=site/views/editperson/tmpl/assignperson.php
          site_js=site/assets/js/assignperson.js
          grep -Fq "registerAndUseScript(" "$site_layout"
          grep -Fq "'com_sportsmanagement.site.assignperson'" "$site_layout"
          grep -Fq 'data-jsm-assign-person-form' "$site_layout"
          grep -Fq 'data-jsm-assign-person' "$site_layout"
          grep -Fq 'window.SportsManagementAssignPerson' "$site_js"
          grep -Fq "postMessage({messageType: 'joomla:cancel'}" "$site_js"
          grep -Fq "window.parent.bootstrap?.Modal" "$site_js"
          if grep -Eiq '<script[[:space:]>]|onclick[[:space:]]*=|onchange[[:space:]]*=|SqueezeBox|class="adminform"' "$site_layout"; then
            echo 'Assign person layout regressed to inline JavaScript or Joomla 3 markup' >&2
            exit 1
          fi

          admin_layout=admin/views/match/tmpl/editstats.php
          admin_js=admin/assets/js/matchstats.js
          grep -Fq "registerAndUseScript(" "$admin_layout"
          grep -Fq "'com_sportsmanagement.admin.matchstats'" "$admin_layout"
          grep -Fq '$this->app->getInput()' "$admin_layout"
          grep -Fq "HTMLHelper::_('uitab.startTabSet'" "$admin_layout"
          grep -Fq 'data-jsm-match-stats-form' "$admin_layout"
          grep -Fq 'window.SportsManagementMatchStats' "$admin_js"
          grep -Fq "postMessage({messageType: 'joomla:cancel'}" "$admin_js"
          grep -Fq "window.parent.bootstrap?.Modal" "$admin_js"
          if grep -Eiq '<script[[:space:]>]|onclick[[:space:]]*=|onchange[[:space:]]*=|Factory::getApplication\(|SqueezeBox|jquery\.framework|fltrt' "$admin_layout"; then
            echo 'Match stats layout regressed to legacy application, modal, markup or inline JavaScript handling' >&2
            exit 1
          fi

          manifest=modules/mod_sportsmanagement_matchesslider/mod_sportsmanagement_matchesslider.xml
          update_xml=modules/mod_sportsmanagement_matchesslider/update-server.xml

          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$manifest"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$update_xml"

          grep -Fq '<version>5.6.0</version>' "$manifest"
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementMatchesSlider</namespace>' "$manifest"
          grep -Fq 'type="extensionversion" version="5.6.0"' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_matchesslider">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"

          grep -Fq '<version>5.6.0</version>' "$update_xml"
          grep -Fq '<targetplatform name="joomla" version="[56].*" />' "$update_xml"
          grep -Fq '<php_minimum>8.1.0</php_minimum>' "$update_xml"

          echo 'Joomla 5/6 batch 108 contracts OK'
