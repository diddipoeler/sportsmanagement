name: Joomla 5/6 site admin modules batch 109

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/allprojects/default.php'
      - 'admin/views/match/tmpl/editlineup.php'
      - 'modules/mod_sportsmanagement_trainingsdata/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch109.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/allprojects/default.php'
      - 'admin/views/match/tmpl/editlineup.php'
      - 'modules/mod_sportsmanagement_trainingsdata/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch109.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Joomla 5/6 batch 109
        shell: bash
        run: |
          set -euo pipefail

          site_layout=site/tmpl/allprojects/default.php
          admin_layout=admin/views/match/tmpl/editlineup.php
          update_xml=modules/mod_sportsmanagement_trainingsdata/update-server.xml

          php -l "$site_layout"
          php -l "$admin_layout"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$update_xml"

          grep -Fq "useScript('keepalive')" "$site_layout"
          if grep -Fq "useScript('jquery')" "$site_layout" || \
             grep -Fq 'jquery.framework' "$site_layout"; then
            echo 'All-projects layout regressed to an unnecessary jQuery dependency' >&2
            exit 1
          fi

          grep -Fq "window.SportsManagementLineup.submit" "$admin_layout"
          grep -Fq "window.SportsManagementLineup.closeParentDialog" "$admin_layout"
          grep -Fq "postMessage({messageType: 'joomla:cancel'}" "$admin_layout"
          grep -Fq "useScript('jquery')" "$admin_layout"
          grep -Fq "bootstrap.startTabSet" "$admin_layout"
          if grep -Fq 'version_compare' "$admin_layout" || \
             grep -Fq 'jquery.framework' "$admin_layout" || \
             grep -Fq 'jQuery(' "$admin_layout" || \
             grep -Fq "\$('close')" "$admin_layout"; then
            echo 'Match lineup layout regressed to Joomla 3 / legacy jQuery handling' >&2
            exit 1
          fi

          grep -Fq '<version>5.6.0</version>' "$update_xml"
          grep -Fq '<targetplatform name="joomla" version="[56].*" />' "$update_xml"
          grep -Fq '<php_minimum>8.1.0</php_minimum>' "$update_xml"

          echo 'Joomla 5/6 batch 109 contracts OK'
