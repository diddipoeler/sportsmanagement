name: Joomla 5/6 site admin modules batch 114

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/allpersons/default.php'
      - 'admin/views/match/tmpl/edit_altdecision.php'
      - 'modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.xml'
      - 'modules/mod_sportsmanagement_count_rekord/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch114.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/allpersons/default.php'
      - 'admin/views/match/tmpl/edit_altdecision.php'
      - 'modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.xml'
      - 'modules/mod_sportsmanagement_count_rekord/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch114.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Joomla 5/6 batch 114
        shell: bash
        run: |
          set -euo pipefail

          site_layout=site/tmpl/allpersons/default.php
          admin_layout=admin/views/match/tmpl/edit_altdecision.php
          manifest=modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.xml
          update_xml=modules/mod_sportsmanagement_count_rekord/update-server.xml

          php -l "$site_layout"
          php -l "$admin_layout"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$manifest"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$update_xml"

          grep -Fq "useScript('keepalive')" "$site_layout"
          grep -Fq 'data-character-filter' "$site_layout"
          grep -Fq 'clear-person-search' "$site_layout"
          if grep -Fq "useScript('jquery')" "$site_layout" || \
             grep -Fq 'javascript:searchPerson' "$site_layout" || \
             grep -Fq 'onclick=' "$site_layout"; then
            echo 'All-persons layout regressed to jQuery/javascript URL/inline event handling' >&2
            exit 1
          fi

          grep -Fq "document.addEventListener('DOMContentLoaded'" "$admin_layout"
          grep -Fq "altDecision.addEventListener('change'" "$admin_layout"
          grep -Fq 'altDecisionFields.hidden' "$admin_layout"
          if grep -Fq 'jQuery(' "$admin_layout" || \
             grep -Fq ".addEvent('change'" "$admin_layout" || \
             grep -Fq "\$('alt_decision')" "$admin_layout"; then
            echo 'Altered-decision layout regressed to legacy jQuery/MooTools handling' >&2
            exit 1
          fi

          grep -Fq '<version>5.6.0</version>' "$manifest"
          grep -Fq '<field type="extensionversion" version="5.6.0" />' "$manifest"
          grep -Fq '<version>5.6.0</version>' "$update_xml"
          grep -Fq '<targetplatform name="joomla" version="[56].*" />' "$update_xml"
          grep -Fq '<php_minimum>8.1.0</php_minimum>' "$update_xml"

          echo 'Joomla 5/6 batch 114 contracts OK'
