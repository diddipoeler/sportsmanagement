name: Joomla 5/6 site admin modules batch 115

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/allplaygrounds/default.php'
      - 'admin/views/match/tmpl/edit_matchdetails.php'
      - 'modules/mod_sportsmanagement_birthday/mod_sportsmanagement_birthday.xml'
      - 'modules/mod_sportsmanagement_birthday/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch115.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/allplaygrounds/default.php'
      - 'admin/views/match/tmpl/edit_matchdetails.php'
      - 'modules/mod_sportsmanagement_birthday/mod_sportsmanagement_birthday.xml'
      - 'modules/mod_sportsmanagement_birthday/update-server.xml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch115.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Joomla 5/6 batch 115
        shell: bash
        run: |
          set -euo pipefail

          site_layout=site/tmpl/allplaygrounds/default.php
          admin_layout=admin/views/match/tmpl/edit_matchdetails.php
          manifest=modules/mod_sportsmanagement_birthday/mod_sportsmanagement_birthday.xml
          update_xml=modules/mod_sportsmanagement_birthday/update-server.xml

          php -l "$site_layout"
          php -l "$admin_layout"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$manifest"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$update_xml"

          grep -Fq "useScript('keepalive')" "$site_layout"
          grep -Fq 'data-character-filter' "$site_layout"
          grep -Fq 'clear-playground-search' "$site_layout"
          if grep -Fq "useScript('jquery')" "$site_layout" || \
             grep -Fq 'javascript:searchPerson' "$site_layout" || \
             grep -Fq 'onclick=' "$site_layout"; then
            echo 'All-playgrounds layout regressed to jQuery/javascript URL/inline event handling' >&2
            exit 1
          fi

          grep -Fq "document.addEventListener('DOMContentLoaded'" "$admin_layout"
          grep -Fq 'playground-picture-preview' "$admin_layout"
          grep -Fq 'class="form-select" size="6"' "$admin_layout"
          if grep -Fq 'version_compare' "$admin_layout" || \
             grep -Fq 'formbehavior.chosen' "$admin_layout" || \
             grep -Fq 'formbehavior2.select2' "$admin_layout" || \
             grep -Fq 'jQuery(' "$admin_layout" || \
             grep -Fq 'mootools-' "$admin_layout"; then
            echo 'Match-details layout regressed to Joomla 3 / Chosen / Select2 legacy handling' >&2
            exit 1
          fi

          grep -Fq '<version>5.6.0</version>' "$manifest"
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementBirthday</namespace>' "$manifest"
          grep -Fq '<version>5.6.0</version>' "$update_xml"
          grep -Fq '<targetplatform name="joomla" version="[56].*" />' "$update_xml"
          grep -Fq '<php_minimum>8.1.0</php_minimum>' "$update_xml"

          echo 'Joomla 5/6 batch 115 contracts OK'
