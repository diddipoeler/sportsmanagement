name: Joomla 5/6 site admin modules batch 160

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/TournamentbracketModel.php'
      - 'site/src/View/Tournamentbracket/HtmlView.php'
      - 'site/views/tournamentbracket/view.html.php'
      - 'site/views/tournamentbracket/tmpl/default.php'
      - 'admin/src/View/Smimageimports/HtmlView.php'
      - 'admin/views/smimageimports/view.html.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/sportsmanagement_j5.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch160.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/TournamentbracketModel.php'
      - 'site/src/View/Tournamentbracket/HtmlView.php'
      - 'site/views/tournamentbracket/view.html.php'
      - 'site/views/tournamentbracket/tmpl/default.php'
      - 'admin/src/View/Smimageimports/HtmlView.php'
      - 'admin/views/smimageimports/view.html.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/sportsmanagement_j5.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch160.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/Model/TournamentbracketModel.php
            site/src/View/Tournamentbracket/HtmlView.php
            site/views/tournamentbracket/view.html.php
            site/views/tournamentbracket/tmpl/default.php
            admin/src/View/Smimageimports/HtmlView.php
            admin/views/smimageimports/view.html.php
            modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php
            modules/mod_sportsmanagement_calendar/connectors/sportsmanagement_j5.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'extends SportsManagementProjectModel' site/src/Model/TournamentbracketModel.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Tournamentbracket view.' site/src/View/Tournamentbracket/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewtournamentbracket')" site/views/tournamentbracket/view.html.php
          ! grep -Fq 'row-fluid' site/views/tournamentbracket/tmpl/default.php

          grep -Fq 'Native Joomla 5/6 administrator SportsManagement image-package imports view.' admin/src/View/Smimageimports/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewsmimageimports')" admin/views/smimageimports/view.html.php

          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' modules/mod_sportsmanagement_calendar/connectors/sportsmanagement_j5.php
          ! grep -Fq 'Factory::getApplication()' modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php
          ! grep -Fq 'Factory::getApplication()' modules/mod_sportsmanagement_calendar/connectors/sportsmanagement_j5.php

          echo 'Joomla 5/6 batch 160 contracts OK.'
