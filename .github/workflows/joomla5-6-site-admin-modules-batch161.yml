name: Joomla 5/6 site admin modules batch 161

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/jltournamenttree/view.html.php'
      - 'admin/src/View/Smquote/HtmlView.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch161.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/jltournamenttree/view.html.php'
      - 'admin/src/View/Smquote/HtmlView.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch161.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/views/jltournamenttree/view.html.php
            admin/src/View/Smquote/HtmlView.php
            modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/views/jltournamenttree/view.html.php
          ! grep -Fq 'Factory::getApplication()' site/views/jltournamenttree/view.html.php
          grep -Fq "requires the Joomla site application" site/views/jltournamenttree/view.html.php

          grep -Fq 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Smquote/HtmlView.php
          ! grep -Fq 'Factory::getApplication()' admin/src/View/Smquote/HtmlView.php
          grep -Fq "requires the Joomla administrator application" admin/src/View/Smquote/HtmlView.php

          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php
          grep -Fq "JEvents connector requires the Joomla site application" modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php

          echo 'Joomla 5/6 batch 161 contracts OK.'
