name: Joomla 5/6 site admin modules batch 163

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/resultsmatrix/view.html.php'
      - 'admin/src/View/Imagelist/HtmlView.php'
      - 'modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch163.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/resultsmatrix/view.html.php'
      - 'admin/src/View/Imagelist/HtmlView.php'
      - 'modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch163.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/views/resultsmatrix/view.html.php
            admin/src/View/Imagelist/HtmlView.php
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- "getWebAssetManager()" site/views/resultsmatrix/view.html.php
          grep -Fq -- "registerAndUseScript(" site/views/resultsmatrix/view.html.php
          grep -Fq -- "registerAndUseStyle(" site/views/resultsmatrix/view.html.php
          ! grep -Fq -- "Factory::getApplication()" site/views/resultsmatrix/view.html.php
          ! grep -Fq -- "addCustomTag(" site/views/resultsmatrix/view.html.php
          ! grep -Fq -- "->addScript(" site/views/resultsmatrix/view.html.php

          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Imagelist/HtmlView.php
          ! grep -Fq -- 'Factory::getApplication()' admin/src/View/Imagelist/HtmlView.php
          grep -Fq -- 'SportsManagement Imagelist view requires the Joomla administrator application.' admin/src/View/Imagelist/HtmlView.php

          grep -Fq -- "instanceof SiteApplication || !\$app->isClient('site')" modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php

          echo 'Joomla 5/6 batch 163 contracts OK.'
