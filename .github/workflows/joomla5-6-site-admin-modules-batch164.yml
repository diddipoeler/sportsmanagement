name: Joomla 5/6 site admin modules batch 164

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/matrix/view.html.php'
      - 'admin/src/View/Github/HtmlView.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch164.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/matrix/view.html.php'
      - 'admin/src/View/Github/HtmlView.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch164.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/matrix/view.html.php
            admin/src/View/Github/HtmlView.php
            modules/mod_sportsmanagement_playgroundplan/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- "getWebAssetManager()" site/views/matrix/view.html.php
          grep -Fq -- "registerAndUseStyle(" site/views/matrix/view.html.php
          ! grep -Fq -- "addCustomTag(" site/views/matrix/view.html.php
          ! grep -Fq -- "Joomla\\CMS\\Uri\\Uri" site/views/matrix/view.html.php
          ! grep -Fq -- "Joomla\\CMS\\Factory" site/views/matrix/view.html.php

          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Github/HtmlView.php
          ! grep -Fq -- 'Factory::getApplication()' admin/src/View/Github/HtmlView.php
          grep -Fq -- 'SportsManagement Github view requires the Joomla administrator application.' admin/src/View/Github/HtmlView.php
          grep -Fq -- "administrator/components/com_sportsmanagement/assets/css/octicons.css" admin/src/View/Github/HtmlView.php

          grep -Fq -- 'private static function siteApplication(): SiteApplication' modules/mod_sportsmanagement_playgroundplan/helper.php
          grep -Fq -- "instanceof SiteApplication || !\$app->isClient('site')" modules/mod_sportsmanagement_playgroundplan/helper.php
          grep -Fq -- 'SportsManagement PlaygroundPlan legacy bridge requires the Joomla site application.' modules/mod_sportsmanagement_playgroundplan/helper.php

          echo 'Joomla 5/6 batch 164 contracts OK.'
