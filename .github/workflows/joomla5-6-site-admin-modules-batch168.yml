name: Joomla 5/6 site admin modules batch 168

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/rankingalltime/view.html.php'
      - 'admin/src/View/Transifex/HtmlView.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch168.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/rankingalltime/view.html.php'
      - 'admin/src/View/Transifex/HtmlView.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch168.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/rankingalltime/view.html.php
            admin/src/View/Transifex/HtmlView.php
            modules/mod_sportsmanagement_clubicons/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- 'Factory::getContainer()->get(SiteApplication::class)' site/views/rankingalltime/view.html.php
          grep -Fq -- 'SportsManagement RankingAllTime view requires the Joomla site application.' site/views/rankingalltime/view.html.php
          grep -Fq -- 'getWebAssetManager()->registerAndUseScript(' site/views/rankingalltime/view.html.php
          ! grep -Fq -- 'Factory::getApplication()' site/views/rankingalltime/view.html.php
          ! grep -Fq -- '->addScript(' site/views/rankingalltime/view.html.php

          grep -Fq -- 'Legacy compatibility bridge for the Joomla 5/6 administrator Transifex view.' admin/src/View/Transifex/HtmlView.php

          grep -Fq -- "instanceof SiteApplication || !\$app->isClient('site')" modules/mod_sportsmanagement_clubicons/helper.php
          grep -Fq -- 'SportsManagement Clubicons legacy helper requires the Joomla site application.' modules/mod_sportsmanagement_clubicons/helper.php

          echo 'Joomla 5/6 batch 168 contracts OK.'
