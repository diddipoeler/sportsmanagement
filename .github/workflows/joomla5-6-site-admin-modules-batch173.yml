name: Joomla 5/6 site admin modules batch 173

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/teamstats/view.html.php'
      - 'admin/src/View/Jsmgcalendarimport/HtmlView.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch173.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/teamstats/view.html.php'
      - 'admin/src/View/Jsmgcalendarimport/HtmlView.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch173.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/teamstats/view.html.php
            admin/src/View/Jsmgcalendarimport/HtmlView.php
            modules/mod_sportsmanagement_gcalendar/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- 'Legacy compatibility bridge for the native Joomla 5/6 frontend Teamstats view.' site/views/teamstats/view.html.php
          grep -Fq -- "class_alias(HtmlView::class, 'sportsmanagementViewTeamStats')" site/views/teamstats/view.html.php

          grep -Fq -- 'Native Joomla 5/6 administrator Google Calendar import login view.' admin/src/View/Jsmgcalendarimport/HtmlView.php

          grep -Fq -- "instanceof SiteApplication || !\$app->isClient('site')" modules/mod_sportsmanagement_gcalendar/helper.php
          grep -Fq -- 'SportsManagement GCalendar legacy helper requires the Joomla site application.' modules/mod_sportsmanagement_gcalendar/helper.php

          echo 'Joomla 5/6 batch 173 contracts OK.'
