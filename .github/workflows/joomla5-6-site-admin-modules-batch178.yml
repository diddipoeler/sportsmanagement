name: Joomla 5/6 site admin modules batch 178

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/uefawertung/view.html.php'
      - 'admin/src/View/Jlxmlexports/HtmlView.php'
      - 'modules/mod_sportsmanagement_new_project/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch178.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/uefawertung/view.html.php'
      - 'admin/src/View/Jlxmlexports/HtmlView.php'
      - 'modules/mod_sportsmanagement_new_project/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch178.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/uefawertung/view.html.php
            admin/src/View/Jlxmlexports/HtmlView.php
            modules/mod_sportsmanagement_new_project/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- '@version    5.6.0' site/views/uefawertung/view.html.php
          grep -Fq -- '@author     diddipoeler' site/views/uefawertung/view.html.php
          grep -Fq -- '@copyright  Copyright (C) diddipoeler' site/views/uefawertung/view.html.php
          grep -Fq -- "\\defined('_JEXEC') or die;" site/views/uefawertung/view.html.php

          grep -Fq -- 'Native Joomla 5/6 administrator XML export view.' admin/src/View/Jlxmlexports/HtmlView.php

          grep -Fq -- 'SportsManagement New Project legacy helper requires the Joomla site application.' modules/mod_sportsmanagement_new_project/helper.php
          grep -Fq -- "instanceof SiteApplication || !\$app->isClient('site')" modules/mod_sportsmanagement_new_project/helper.php

          echo 'Joomla 5/6 batch 178 contracts OK.'
