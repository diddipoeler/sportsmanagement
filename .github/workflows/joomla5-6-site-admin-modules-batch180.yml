name: Joomla 5/6 site admin modules batch 180

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/predictionuser/view.html.php'
      - 'admin/src/View/Predictiongame/HtmlView.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch180.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/predictionuser/view.html.php'
      - 'admin/src/View/Predictiongame/HtmlView.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch180.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/predictionuser/view.html.php
            admin/src/View/Predictiongame/HtmlView.php
            modules/mod_sportsmanagement_count_rekord/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- '@version    5.6.0' site/views/predictionuser/view.html.php
          grep -Fq -- 'Factory::getContainer()->get(SiteApplication::class)' site/views/predictionuser/view.html.php
          grep -Fq -- 'registerAndUseScript(' site/views/predictionuser/view.html.php
          grep -Fq -- '$app->getIdentity()' site/views/predictionuser/view.html.php
          ! grep -Fq -- 'Factory::getUser()' site/views/predictionuser/view.html.php
          ! grep -Fq -- '->addScript(' site/views/predictionuser/view.html.php
          ! grep -Fq -- 'Joomla\\CMS\\Uri\\Uri' site/views/predictionuser/view.html.php

          grep -Fq -- 'private static function administratorApplication(): AdministratorApplication' admin/src/View/Predictiongame/HtmlView.php
          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Predictiongame/HtmlView.php
          ! grep -Fq -- 'Factory::getApplication()' admin/src/View/Predictiongame/HtmlView.php

          grep -Fq -- 'SportsManagement CountRekord legacy helper requires the Joomla site application.' modules/mod_sportsmanagement_count_rekord/helper.php
          grep -Fq -- "instanceof SiteApplication || !\$app->isClient('site')" modules/mod_sportsmanagement_count_rekord/helper.php

          echo 'Joomla 5/6 batch 180 contracts OK.'
