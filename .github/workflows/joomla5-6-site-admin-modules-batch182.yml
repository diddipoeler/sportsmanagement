name: Joomla 5/6 site admin modules batch 182

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/matchreport/view.html.php'
      - 'admin/src/View/Predictiongames/HtmlView.php'
      - 'modules/mod_sportsmanagement_teamstats_ranking/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch182.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/matchreport/view.html.php'
      - 'admin/src/View/Predictiongames/HtmlView.php'
      - 'modules/mod_sportsmanagement_teamstats_ranking/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch182.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/matchreport/view.html.php
            admin/src/View/Predictiongames/HtmlView.php
            modules/mod_sportsmanagement_teamstats_ranking/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- "\\defined('_JEXEC') or die;" site/views/matchreport/view.html.php
          grep -Fq -- 'getWebAssetManager()->registerAndUseStyle(' site/views/matchreport/view.html.php
          ! grep -Fq -- 'addCustomTag(' site/views/matchreport/view.html.php

          grep -Fq -- 'private static function administratorApplication(): AdministratorApplication' admin/src/View/Predictiongames/HtmlView.php
          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Predictiongames/HtmlView.php
          ! grep -Fq -- 'Factory::getApplication()' admin/src/View/Predictiongames/HtmlView.php

          grep -Fq -- "JPATH_SITE . '/components/com_sportsmanagement/src/Helper/SiteRouteHelper.php'" modules/mod_sportsmanagement_teamstats_ranking/helper.php
          grep -Fq -- 'SportsManagement SiteRouteHelper could not be loaded for Team Stats Ranking.' modules/mod_sportsmanagement_teamstats_ranking/helper.php

          echo 'Joomla 5/6 batch 182 contracts OK.'
