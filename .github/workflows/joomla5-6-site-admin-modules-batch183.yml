name: Joomla 5/6 site admin modules batch 183

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/billardlivegames/view.html.php'
      - 'admin/src/View/Predictiongroups/HtmlView.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch183.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/billardlivegames/view.html.php'
      - 'admin/src/View/Predictiongroups/HtmlView.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch183.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/billardlivegames/view.html.php
            admin/src/View/Predictiongroups/HtmlView.php
            modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- '@version    5.6.0' site/views/billardlivegames/view.html.php
          grep -Fq -- "\\defined('_JEXEC') or die;" site/views/billardlivegames/view.html.php
          ! grep -Fq -- "die('Restricted access')" site/views/billardlivegames/view.html.php

          grep -Fq -- 'private static function administratorApplication(): AdministratorApplication' admin/src/View/Predictiongroups/HtmlView.php
          grep -Fq -- 'Factory::getContainer()->get(AdministratorApplication::class)' admin/src/View/Predictiongroups/HtmlView.php
          ! grep -Fq -- 'Factory::getApplication()' admin/src/View/Predictiongroups/HtmlView.php

          grep -Fq -- 'use Joomla\\CMS\\Document\\HtmlDocument;' modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php
          grep -Fq -- 'if ($document instanceof HtmlDocument)' modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php

          echo 'Joomla 5/6 batch 183 contracts OK.'
