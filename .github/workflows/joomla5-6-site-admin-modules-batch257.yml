name: Joomla 5/6 site admin modules batch 257

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/clubs/tmpl/default.php'
      - 'site/views/curve/tmpl/default.php'
      - 'site/views/staff/tmpl/default.php'
      - 'site/views/stats/tmpl/default.php'
      - 'site/views/rivals/tmpl/default.php'
      - 'admin/views/club/tmpl/edit.php'
      - 'admin/views/team/tmpl/edit.php'
      - 'admin/views/player/tmpl/edit.php'
      - 'admin/views/clubs/tmpl/default.php'
      - 'admin/views/matches/tmpl/default.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - 'modules/mod_sportsmanagement_firstleagueoverview/helper.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch257.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/clubs/tmpl/default.php'
      - 'site/views/curve/tmpl/default.php'
      - 'site/views/staff/tmpl/default.php'
      - 'site/views/stats/tmpl/default.php'
      - 'site/views/rivals/tmpl/default.php'
      - 'admin/views/club/tmpl/edit.php'
      - 'admin/views/team/tmpl/edit.php'
      - 'admin/views/player/tmpl/edit.php'
      - 'admin/views/clubs/tmpl/default.php'
      - 'admin/views/matches/tmpl/default.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - 'modules/mod_sportsmanagement_firstleagueoverview/helper.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch257.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/clubs/tmpl/default.php
            site/views/curve/tmpl/default.php
            site/views/staff/tmpl/default.php
            site/views/stats/tmpl/default.php
            site/views/rivals/tmpl/default.php
            admin/views/club/tmpl/edit.php
            admin/views/team/tmpl/edit.php
            admin/views/player/tmpl/edit.php
            admin/views/clubs/tmpl/default.php
            admin/views/matches/tmpl/default.php
            modules/mod_sportsmanagement_birthday/helper.php
            modules/mod_sportsmanagement_clubicons/helper.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_firstleagueoverview/helper.php
            modules/mod_sportsmanagement_gcalendar/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 module application contracts
        shell: bash
        run: |
          set -euo pipefail
          helpers=(
            modules/mod_sportsmanagement_birthday/helper.php
            modules/mod_sportsmanagement_clubicons/helper.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_firstleagueoverview/helper.php
            modules/mod_sportsmanagement_gcalendar/helper.php
          )
          for file in "${helpers[@]}"; do
            grep -Fq -- 'SportsManagementSiteApplicationResolver::resolve()' "$file"
            if grep -Fq -- 'use Joomla\CMS\Application\SiteApplication;' "$file"; then
              echo "$file regressed to concrete SiteApplication coupling" >&2
              exit 1
            fi
            if grep -Fq -- 'instanceof SiteApplication' "$file"; then
              echo "$file contains a concrete SiteApplication runtime check" >&2
              exit 1
            fi
          done
          echo 'Joomla 5/6 batch 257 contracts OK.'
