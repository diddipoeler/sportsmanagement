name: Joomla 5/6 site admin modules batch 270

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/views/teaminfo/tmpl/default_divisions_league.php'
      - 'site/views/teaminfo/tmpl/default_friendly_matches.php'
      - 'site/views/stats/tmpl/default_stats.php'
      - 'site/views/teamstats/tmpl/default_stats.php'
      - 'admin/views/statistics/tmpl/default.php'
      - 'admin/views/statistics/tmpl/default_data.php'
      - 'admin/views/template/tmpl/default.php'
      - 'admin/views/templates/tmpl/default.php'
      - 'modules/mod_sportsmanagement_act_season/helper.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - 'modules/mod_sportsmanagement_teamplayers/helper.php'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/helper.php'
      - 'modules/mod_sportsmanagement_trainingsdata/helper.php'
      - 'modules/mod_sportsmanagement_uefawertung/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch270.yml'
  pull_request:
    branches:
      - joomla5-6
      - master
    paths:
      - 'site/views/teaminfo/tmpl/default_divisions_league.php'
      - 'site/views/teaminfo/tmpl/default_friendly_matches.php'
      - 'site/views/stats/tmpl/default_stats.php'
      - 'site/views/teamstats/tmpl/default_stats.php'
      - 'admin/views/statistics/tmpl/default.php'
      - 'admin/views/statistics/tmpl/default_data.php'
      - 'admin/views/template/tmpl/default.php'
      - 'admin/views/templates/tmpl/default.php'
      - 'modules/mod_sportsmanagement_act_season/helper.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - 'modules/mod_sportsmanagement_teamplayers/helper.php'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/helper.php'
      - 'modules/mod_sportsmanagement_trainingsdata/helper.php'
      - 'modules/mod_sportsmanagement_uefawertung/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch270.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP syntax and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/teaminfo/tmpl/default_divisions_league.php
            site/views/teaminfo/tmpl/default_friendly_matches.php
            site/views/stats/tmpl/default_stats.php
            site/views/teamstats/tmpl/default_stats.php
            admin/views/statistics/tmpl/default.php
            admin/views/statistics/tmpl/default_data.php
            admin/views/template/tmpl/default.php
            admin/views/templates/tmpl/default.php
            modules/mod_sportsmanagement_act_season/helper.php
            modules/mod_sportsmanagement_birthday/helper.php
            modules/mod_sportsmanagement_teamplayers/helper.php
            modules/mod_sportsmanagement_teamstatistics_counter/helper.php
            modules/mod_sportsmanagement_trainingsdata/helper.php
            modules/mod_sportsmanagement_uefawertung/helper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate legacy template bridges
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '/components/com_sportsmanagement/tmpl/teaminfo/default_divisions_league.php' site/views/teaminfo/tmpl/default_divisions_league.php
          grep -Fq -- '/components/com_sportsmanagement/tmpl/teaminfo/default_friendly_matches.php' site/views/teaminfo/tmpl/default_friendly_matches.php
          grep -Fq -- '/components/com_sportsmanagement/tmpl/stats/default_stats.php' site/views/stats/tmpl/default_stats.php
          grep -Fq -- '/components/com_sportsmanagement/tmpl/teamstats/default_stats.php' site/views/teamstats/tmpl/default_stats.php
          grep -Fq -- '/components/com_sportsmanagement/tmpl/statistics/default.php' admin/views/statistics/tmpl/default.php
          grep -Fq -- '/components/com_sportsmanagement/tmpl/statistics/default_data.php' admin/views/statistics/tmpl/default_data.php
          grep -Fq -- '/components/com_sportsmanagement/tmpl/template/edit.php' admin/views/template/tmpl/default.php
          grep -Fq -- '/components/com_sportsmanagement/tmpl/templates/default.php' admin/views/templates/tmpl/default.php

      - name: Validate Joomla 5/6 module service contracts
        shell: bash
        run: |
          set -euo pipefail
          helpers=(
            modules/mod_sportsmanagement_act_season/helper.php
            modules/mod_sportsmanagement_birthday/helper.php
            modules/mod_sportsmanagement_teamplayers/helper.php
            modules/mod_sportsmanagement_teamstatistics_counter/helper.php
            modules/mod_sportsmanagement_trainingsdata/helper.php
            modules/mod_sportsmanagement_uefawertung/helper.php
          )
          for file in "${helpers[@]}"; do
            if grep -Fq -- 'Factory::getContainer()' "$file"; then
              echo "$file still uses Factory::getContainer()" >&2
              exit 1
            fi
            grep -Fq -- 'getContainer()->get(DatabaseInterface::class)' "$file"
          done
          grep -Fq -- '?DatabaseInterface $database = null' modules/mod_sportsmanagement_act_season/helper.php
          grep -Fq -- '?DatabaseInterface $database = null' modules/mod_sportsmanagement_birthday/helper.php
          grep -Fq -- '?DatabaseInterface $database = null' modules/mod_sportsmanagement_teamplayers/helper.php
          grep -Fq -- '?DatabaseInterface $database = null' modules/mod_sportsmanagement_teamstatistics_counter/helper.php
          grep -Fq -- '?DatabaseInterface $database = null' modules/mod_sportsmanagement_trainingsdata/helper.php
          grep -Fq -- '?DatabaseInterface $database = null' modules/mod_sportsmanagement_uefawertung/helper.php
          echo 'Joomla 5/6 batch 270 contracts OK.'
