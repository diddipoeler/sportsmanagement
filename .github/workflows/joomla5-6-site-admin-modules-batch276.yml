      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch276.yml'
  pull_request:
    branches:
      - joomla5-6
      - master
    paths:
      - 'site/views/stats/tmpl/default_attendance_stats.php'
      - 'site/views/stats/tmpl/default_flashchart.php'
      - 'site/views/stats/tmpl/default_goals_stats.php'
      - 'site/views/stats/tmpl/default_ranking.php'
      - 'site/views/teaminfo/tmpl/default_history_leagues.php'
