name: Joomla 5/6 site admin modules batch 281

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/extensions/jsminlinehockey/admin/models/jsminlinehockey.php'
      - 'site/extensions/jsmopenligadb/admin/models/jsmopenligadb.php'
      - 'site/helpers/scoresheet/fpdm.php'
      - 'site/helpers/scoresheet/FilterASCII85.php'
      - 'site/helpers/scoresheet/FilterASCIIHex.php'
      - 'site/helpers/scoresheet/FilterFlate.php'
      - 'site/helpers/scoresheet/FilterLZW.php'
      - 'site/helpers/scoresheet/FilterStandard.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch281.yml'
  pull_request:
    branches:
      - joomla5-6
      - master
    paths:
      - 'site/extensions/jsminlinehockey/admin/models/jsminlinehockey.php'
      - 'site/extensions/jsmopenligadb/admin/models/jsmopenligadb.php'
      - 'site/helpers/scoresheet/fpdm.php'
      - 'site/helpers/scoresheet/FilterASCII85.php'
      - 'site/helpers/scoresheet/FilterASCIIHex.php'
      - 'site/helpers/scoresheet/FilterFlate.php'
      - 'site/helpers/scoresheet/FilterLZW.php'
      - 'site/helpers/scoresheet/FilterStandard.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch281.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP syntax and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/extensions/jsminlinehockey/admin/models/jsminlinehockey.php
            site/extensions/jsmopenligadb/admin/models/jsmopenligadb.php
            site/helpers/scoresheet/fpdm.php
            site/helpers/scoresheet/FilterASCII85.php
            site/helpers/scoresheet/FilterASCIIHex.php
            site/helpers/scoresheet/FilterFlate.php
            site/helpers/scoresheet/FilterLZW.php
            site/helpers/scoresheet/FilterStandard.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate extension model service access
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/extensions/jsminlinehockey/admin/models/jsminlinehockey.php
            site/extensions/jsmopenligadb/admin/models/jsmopenligadb.php
          )
          for file in "${files[@]}"; do
            if grep -Fq -- 'Factory::getContainer()' "$file"; then
              echo "$file still uses Factory::getContainer()" >&2
              exit 1
            fi
            if grep -Fq -- 'Factory::getApplication()' "$file"; then
              echo "$file still uses Factory::getApplication()" >&2
              exit 1
            fi
            if grep -Fq -- 'use Joomla\CMS\Factory;' "$file"; then
              echo "$file still imports Factory" >&2
              exit 1
            fi
            grep -Fq -- 'SportsManagementSiteApplicationResolver::resolve()' "$file"
          done

      - name: Validate FPDM PHP 8 compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '@version 2.10' site/helpers/scoresheet/fpdm.php
          grep -Fq -- '@license FPDF License' site/helpers/scoresheet/fpdm.php
          if grep -Fq -- 'create_function(' site/helpers/scoresheet/fpdm.php; then
            echo 'PHP 8 incompatible create_function remains in FPDM' >&2
            exit 1
          fi
          if grep -Eq '\$[A-Za-z_][A-Za-z0-9_]*\{[^}]+\}' site/helpers/scoresheet/FilterASCIIHex.php; then
            echo 'PHP 8 incompatible curly string offset remains' >&2
            exit 1
          fi
          grep -Fq -- '@license    Apache License, Version 2.0' site/helpers/scoresheet/FilterASCII85.php
          grep -Fq -- '@license    Apache License, Version 2.0' site/helpers/scoresheet/FilterLZW.php
          echo 'Joomla 5/6 batch 281 contracts OK.'
