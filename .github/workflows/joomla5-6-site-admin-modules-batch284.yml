name: Joomla 5/6 site admin modules batch 284

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/tmpl/databasetool/default.php'
      - 'admin/tmpl/github/github_result.php'
      - 'admin/tmpl/installhelper/install_step_2.php'
      - 'admin/tmpl/jlextdfbkeyimport/default_getdivision.php'
      - 'admin/tmpl/jlxmlimport/default.php'
      - 'admin/tmpl/predictiongroup/edit.php'
      - 'admin/tmpl/predictionmember/edit.php'
      - 'admin/tmpl/treeto/gennode.php'
      - 'admin/tmpl/treeto/gennode_data.php'
      - 'admin/tmpl/treetomatchs/default.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch284.yml'
  pull_request:
    branches:
      - joomla5-6
      - master
    paths:
      - 'admin/tmpl/databasetool/default.php'
      - 'admin/tmpl/github/github_result.php'
      - 'admin/tmpl/installhelper/install_step_2.php'
      - 'admin/tmpl/jlextdfbkeyimport/default_getdivision.php'
      - 'admin/tmpl/jlxmlimport/default.php'
      - 'admin/tmpl/predictiongroup/edit.php'
      - 'admin/tmpl/predictionmember/edit.php'
      - 'admin/tmpl/treeto/gennode.php'
      - 'admin/tmpl/treeto/gennode_data.php'
      - 'admin/tmpl/treetomatchs/default.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch284.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP syntax and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/tmpl/databasetool/default.php
            admin/tmpl/github/github_result.php
            admin/tmpl/installhelper/install_step_2.php
            admin/tmpl/jlextdfbkeyimport/default_getdivision.php
            admin/tmpl/jlxmlimport/default.php
            admin/tmpl/predictiongroup/edit.php
            admin/tmpl/predictionmember/edit.php
            admin/tmpl/treeto/gennode.php
            admin/tmpl/treeto/gennode_data.php
            admin/tmpl/treetomatchs/default.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate native administrator layouts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- 'COM_SPORTSMANAGEMENT_ADMIN_DBTOOLS_TITLE' admin/tmpl/databasetool/default.php
          grep -Fq -- 'COM_SPORTSMANAGEMENT_ADMIN_GITHUB_TITLE' admin/tmpl/github/github_result.php
          grep -Fq -- 'COM_SPORTSMANAGEMENT_ADMIN_XML_IMPORT_TITLE_1_3' admin/tmpl/jlxmlimport/default.php
          grep -Fq -- 'predictiongroup-form' admin/tmpl/predictiongroup/edit.php
          grep -Fq -- 'treeto.generatenode' admin/tmpl/treeto/gennode.php
          echo 'Joomla 5/6 batch 284 contracts OK.'
