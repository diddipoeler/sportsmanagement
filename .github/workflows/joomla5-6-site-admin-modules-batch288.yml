name: Joomla 5/6 metadata migration batch 288

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'admin/layouts/joomla/searchtools/default_4.php'
      - 'admin/layouts/joomla/searchtools/default_test.php'
      - 'admin/layouts/joomla/searchtools/defaultjsm.php'
      - 'admin/helpers/iCalcreator.class.php'
      - 'admin/helpers/parsecsv.lib.php'
      - 'site/helpers/iCalcreator.php'
      - 'site/libraries/dompdf/autoload.inc.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch288.yml'
  pull_request:
    branches:
      - joomla5-6
      - master
    paths:
      - 'admin/layouts/joomla/searchtools/default_4.php'
      - 'admin/layouts/joomla/searchtools/default_test.php'
      - 'admin/layouts/joomla/searchtools/defaultjsm.php'
      - 'admin/helpers/iCalcreator.class.php'
      - 'admin/helpers/parsecsv.lib.php'
      - 'site/helpers/iCalcreator.php'
      - 'site/libraries/dompdf/autoload.inc.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch288.yml'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate metadata and syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/layouts/joomla/searchtools/default_4.php
            admin/layouts/joomla/searchtools/default_test.php
            admin/layouts/joomla/searchtools/defaultjsm.php
            admin/helpers/iCalcreator.class.php
            admin/helpers/parsecsv.lib.php
            site/helpers/iCalcreator.php
            site/libraries/dompdf/autoload.inc.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done
          ! grep -Fq -- "Factory::getApplication()" admin/layouts/joomla/searchtools/default_4.php
          ! grep -Fq -- "Factory::getApplication()" admin/layouts/joomla/searchtools/default_test.php
          ! grep -Fq -- "Factory::getApplication()" admin/layouts/joomla/searchtools/defaultjsm.php
          echo 'Joomla 5/6 metadata batch 288 OK.'
