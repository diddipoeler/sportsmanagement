name: Joomla 5/6 site admin modules batch 288

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php'
      - 'modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - 'modules/mod_sportsmanagement_randomplayer/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_randomplayer/helper.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - 'modules/mod_sportsmanagement_birthday/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-module-act-season.yml'
      - '.github/workflows/joomla5-6-club-allclubs-birthday.yml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch288.yml'
  pull_request:
    branches:
      - joomla5-6
      - master
    paths:
      - 'modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php'
      - 'modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - 'modules/mod_sportsmanagement_randomplayer/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_randomplayer/helper.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - 'modules/mod_sportsmanagement_birthday/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-module-act-season.yml'
      - '.github/workflows/joomla5-6-club-allclubs-birthday.yml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch288.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP syntax and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
            modules/mod_sportsmanagement_playgroundplan/helper.php
            modules/mod_sportsmanagement_randomplayer/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_randomplayer/helper.php
            modules/mod_sportsmanagement_birthday/helper.php
            modules/mod_sportsmanagement_birthday/src/Dispatcher/Dispatcher.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            ! grep -Fq -- '$app->getContainer()' "$file"
          done

      - name: Validate public module container access
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            modules/mod_sportsmanagement_matchesslider/src/Helper/MatchesSliderHelper.php \
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php \
            modules/mod_sportsmanagement_playgroundplan/helper.php \
            modules/mod_sportsmanagement_randomplayer/src/Dispatcher/Dispatcher.php \
            modules/mod_sportsmanagement_randomplayer/helper.php \
            modules/mod_sportsmanagement_birthday/helper.php \
            modules/mod_sportsmanagement_birthday/src/Dispatcher/Dispatcher.php; do
            grep -Fq -- 'Factory::getContainer()->get(' "$file"
          done
          echo 'Joomla 5/6 batch 288 contracts OK.'
