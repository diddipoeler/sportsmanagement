name: Joomla 5/6 site admin modules batch 292

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/tmpl/predictionrules/default.php'
      - 'site/tmpl/staff/default.php'
      - 'admin/tmpl/players/default.php'
      - '.github/workflows/joomla5-6-all-php-metadata.yml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch292.yml'
  pull_request:
    branches:
      - joomla5-6
      - master
    paths:
      - 'site/tmpl/predictionrules/default.php'
      - 'site/tmpl/staff/default.php'
      - 'admin/tmpl/players/default.php'
      - '.github/workflows/joomla5-6-all-php-metadata.yml'
      - '.github/workflows/joomla5-6-site-admin-modules-batch292.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate migrated templates
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/tmpl/predictionrules/default.php
            site/tmpl/staff/default.php
            admin/tmpl/players/default.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
          ! grep -Fq -- 'row-fluid' site/tmpl/predictionrules/default.php
          echo 'Joomla 5/6 batch 292 contracts OK.'
