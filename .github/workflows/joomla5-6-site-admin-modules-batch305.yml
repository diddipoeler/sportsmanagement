name: Joomla 5/6 admin matches presentation batch 305

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tmpl/matches/default_massadd.php'
      - 'admin/tmpl/matches/default_matrix.php'
      - 'admin/assets/js/matches.js'
      - '.github/workflows/joomla5-6-site-admin-modules-batch305.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/tmpl/matches/default_massadd.php'
      - 'admin/tmpl/matches/default_matrix.php'
      - 'admin/assets/js/matches.js'
      - '.github/workflows/joomla5-6-site-admin-modules-batch305.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate native matches presentation
        shell: bash
        run: |
          set -euo pipefail
          php -l admin/tmpl/matches/default_massadd.php
          php -l admin/tmpl/matches/default_matrix.php
          node --check admin/assets/js/matches.js
          for file in admin/tmpl/matches/default_massadd.php admin/tmpl/matches/default_matrix.php; do
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done
          ! grep -Fqi -- '<script' admin/tmpl/matches/default_massadd.php
          ! grep -Fqi -- 'onclick=' admin/tmpl/matches/default_matrix.php
          grep -Fq -- 'data-jsm-save-match' admin/tmpl/matches/default_matrix.php
          grep -Fq -- "document.querySelectorAll('[data-jsm-save-match]')" admin/assets/js/matches.js
          grep -Fq -- "createMatches.addEventListener('click'" admin/assets/js/matches.js
          grep -Fq -- "copyMatches.addEventListener('click'" admin/assets/js/matches.js
