name: Joomla 5/6 site admin modules batch 34

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/models/about.php'
      - 'site/controllers/allpersons.php'
      - 'admin/src/Service/IndividualMatchPairingService.php'
      - 'modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - 'modules/mod_sportsmanagement_count_rekord/services/provider.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch34.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/models/about.php'
      - 'site/controllers/allpersons.php'
      - 'admin/src/Service/IndividualMatchPairingService.php'
      - 'modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - 'modules/mod_sportsmanagement_count_rekord/services/provider.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch34.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 site, admin and count record module batch
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/models/about.php
            site/controllers/allpersons.php
            admin/src/Service/IndividualMatchPairingService.php
            modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_count_rekord/services/provider.php
            modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq "SportsManagement native About model could not be loaded." site/models/about.php
          grep -Fq "SportsManagement native Allpersons controller could not be loaded." site/controllers/allpersons.php
          grep -Fq "SportsManagement CountRekord helper could not be loaded." modules/mod_sportsmanagement_count_rekord/helper.php

          grep -Fq 'ModuleDispatcherFactory' modules/mod_sportsmanagement_count_rekord/services/provider.php
          grep -Fq 'HelperFactory' modules/mod_sportsmanagement_count_rekord/services/provider.php
          grep -Fq 'final class Dispatcher extends AbstractModuleDispatcher' modules/mod_sportsmanagement_count_rekord/src/Dispatcher/Dispatcher.php
          grep -Fq 'final class CountRekordHelper' modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php

          if grep -R -n '@version[[:space:]]*4\.24' \
            modules/mod_sportsmanagement_count_rekord/{mod_sportsmanagement_count_rekord.php,helper.php,services/provider.php,src/Dispatcher/Dispatcher.php,src/Helper/CountRekordHelper.php}; then
            echo 'Old 4.24 metadata remains in the migrated count record module PHP runtime.' >&2
            exit 1
          fi
