name: Joomla 5/6 site admin modules batch 38

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/controllers/editmatch.php'
      - 'admin/src/Service/FinderRelationNotifier.php'
      - 'modules/mod_sportsmanagement_navigation_menu/helper.php'
      - 'modules/mod_sportsmanagement_navigation_menu/mod_sportsmanagement_navigation_menu.php'
      - 'modules/mod_sportsmanagement_navigation_menu/services/provider.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php'
      - 'modules/mod_sportsmanagement_navigation_menu/tmpl/default.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch38.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/controllers/editmatch.php'
      - 'admin/src/Service/FinderRelationNotifier.php'
      - 'modules/mod_sportsmanagement_navigation_menu/helper.php'
      - 'modules/mod_sportsmanagement_navigation_menu/mod_sportsmanagement_navigation_menu.php'
      - 'modules/mod_sportsmanagement_navigation_menu/services/provider.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php'
      - 'modules/mod_sportsmanagement_navigation_menu/tmpl/default.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch38.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 editmatch, Finder and navigation menu batch
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/controllers/editmatch.php
            admin/src/Service/FinderRelationNotifier.php
            modules/mod_sportsmanagement_navigation_menu/helper.php
            modules/mod_sportsmanagement_navigation_menu/mod_sportsmanagement_navigation_menu.php
            modules/mod_sportsmanagement_navigation_menu/services/provider.php
            modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
            modules/mod_sportsmanagement_navigation_menu/tmpl/default.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq 'SportsManagement native Editmatch controller could not be loaded.' site/controllers/editmatch.php
          grep -Fq 'class_alias(EditmatchController::class' site/controllers/editmatch.php

          grep -Fq 'use Joomla\Database\ParameterType;' admin/src/Service/FinderRelationNotifier.php
          grep -Fq -- '->createQuery()' admin/src/Service/FinderRelationNotifier.php
          grep -Fq -- "->bind(':teamId', \$teamId, ParameterType::INTEGER)" admin/src/Service/FinderRelationNotifier.php
          grep -Fq -- "->bind(':seasonId', \$seasonId, ParameterType::INTEGER)" admin/src/Service/FinderRelationNotifier.php
          grep -Fq -- "->bind(':personType', \$personType, ParameterType::INTEGER)" admin/src/Service/FinderRelationNotifier.php
          grep -Fq -- "->bind(':projectId', \$projectId, ParameterType::INTEGER)" admin/src/Service/FinderRelationNotifier.php
          if grep -Fq -- '->getQuery(true)' admin/src/Service/FinderRelationNotifier.php; then
            echo 'Legacy getQuery(true) remains in FinderRelationNotifier.' >&2
            exit 1
          fi

          grep -Fq 'SportsManagement Navigation Menu helper could not be loaded.' modules/mod_sportsmanagement_navigation_menu/helper.php
          grep -Fq 'ModuleDispatcherFactory' modules/mod_sportsmanagement_navigation_menu/services/provider.php
          grep -Fq 'HelperFactory' modules/mod_sportsmanagement_navigation_menu/services/provider.php
          grep -Fq 'final class Dispatcher extends AbstractModuleDispatcher' modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php
          grep -Fq "Factory::getContainer()->get(SiteApplication::class)" modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
          if grep -Fq 'Factory::getApplication()' modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php; then
            echo 'Legacy Factory::getApplication() remains in NativeNavigationMenuHelper.' >&2
            exit 1
          fi

          if grep -n '@version[[:space:]]*4\.24' "${files[@]}"; then
            echo 'Old 4.24 metadata remains in Batch 38 PHP files.' >&2
            exit 1
          fi
