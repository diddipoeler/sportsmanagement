name: Joomla 5/6 site admin modules batch 4

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/controllers/results.php'
      - 'admin/controllers/project.php'
      - 'admin/controllers/projects.php'
      - 'admin/controllers/projectposition.php'
      - 'admin/controllers/projectpositions.php'
      - 'admin/controllers/projectreferee.php'
      - 'admin/controllers/projectreferees.php'
      - 'admin/controllers/projectteam.php'
      - 'admin/controllers/projectteams.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - 'modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch4.yml'
  pull_request:
    branches: [master]
    paths:
      - 'site/controllers/results.php'
      - 'admin/controllers/project.php'
      - 'admin/controllers/projects.php'
      - 'admin/controllers/projectposition.php'
      - 'admin/controllers/projectpositions.php'
      - 'admin/controllers/projectreferee.php'
      - 'admin/controllers/projectreferees.php'
      - 'admin/controllers/projectteam.php'
      - 'admin/controllers/projectteams.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - 'modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch4.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migrated PHP files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/controllers/results.php
            admin/controllers/project.php
            admin/controllers/projects.php
            admin/controllers/projectposition.php
            admin/controllers/projectpositions.php
            admin/controllers/projectreferee.php
            admin/controllers/projectreferees.php
            admin/controllers/projectteam.php
            admin/controllers/projectteams.php
            modules/mod_sportsmanagement_count_rekord/helper.php
            modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done

            grep -Eq '@version[[:space:]]+5\.6\.0' "$file" || {
              echo "$file does not declare Joomla 5/6 migration version metadata" >&2
              exit 1
            }

            if grep -Eq 'JFactory::|JRequest::|Factory::getApplication\(\)|extends[[:space:]]+JController' "$file"; then
              echo "$file contains a deprecated Joomla runtime API" >&2
              exit 1
            fi
          done

          grep -Fq 'class_alias(ResultsController::class' site/controllers/results.php
          grep -Fq 'class_alias(ProjectController::class' admin/controllers/project.php
          grep -Fq 'class_alias(ProjectsController::class' admin/controllers/projects.php
          grep -Fq 'class_alias(ProjectpositionController::class' admin/controllers/projectposition.php
          grep -Fq 'class_alias(ProjectpositionsController::class' admin/controllers/projectpositions.php
          grep -Fq 'class_alias(ProjectrefereeController::class' admin/controllers/projectreferee.php
          grep -Fq 'class_alias(ProjectrefereesController::class' admin/controllers/projectreferees.php
          grep -Fq 'class_alias(ProjectteamController::class' admin/controllers/projectteam.php
          grep -Fq 'class_alias(ProjectteamsController::class' admin/controllers/projectteams.php
          grep -Fq 'CountRekordHelper' modules/mod_sportsmanagement_count_rekord/helper.php
          grep -Fq 'services/provider.php' modules/mod_sportsmanagement_count_rekord/mod_sportsmanagement_count_rekord.php

          echo 'Joomla 5/6 site/admin/modules batch 4 contracts OK'
