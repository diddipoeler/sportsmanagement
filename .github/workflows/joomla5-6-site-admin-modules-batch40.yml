name: Joomla 5/6 site admin modules batch 40

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/controllers/predictionentry.php'
      - 'admin/models/fields/teamlist.php'
      - 'admin/src/Service/GoogleCalendarMatchSynchronizer.php'
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch40.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/controllers/predictionentry.php'
      - 'admin/models/fields/teamlist.php'
      - 'admin/src/Service/GoogleCalendarMatchSynchronizer.php'
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch40.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 prediction, Google Calendar and Ranking migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/controllers/predictionentry.php
            admin/models/fields/teamlist.php
            admin/src/Service/GoogleCalendarMatchSynchronizer.php
            modules/mod_sportsmanagement_ranking/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq 'SportsManagement native Predictionentry controller could not be loaded.' site/controllers/predictionentry.php
          grep -Fq 'class_alias(PredictionentryController::class' site/controllers/predictionentry.php
          grep -Fq 'SportsManagement native Teamlist field could not be loaded.' admin/models/fields/teamlist.php
          grep -Fq 'class_alias(TeamlistField::class' admin/models/fields/teamlist.php

          grep -Fq 'use Joomla\Database\ParameterType;' admin/src/Service/GoogleCalendarMatchSynchronizer.php
          grep -Fq '$this->db->createQuery()' admin/src/Service/GoogleCalendarMatchSynchronizer.php
          grep -Fq -- "->bind(':calendarId', \$calendarId, ParameterType::INTEGER)" admin/src/Service/GoogleCalendarMatchSynchronizer.php
          grep -Fq -- "->bind(':projectId', \$projectId, ParameterType::INTEGER)" admin/src/Service/GoogleCalendarMatchSynchronizer.php
          if grep -Fq -- '->getQuery(true)' admin/src/Service/GoogleCalendarMatchSynchronizer.php; then
            echo 'Legacy getQuery(true) remains in GoogleCalendarMatchSynchronizer.' >&2
            exit 1
          fi

          grep -Fq 'use Joomla\Database\ParameterType;' modules/mod_sportsmanagement_ranking/helper.php
          grep -Fq '$db->createQuery()' modules/mod_sportsmanagement_ranking/helper.php
          grep -Fq -- "->bind(':projectId', \$projectId, ParameterType::INTEGER)" modules/mod_sportsmanagement_ranking/helper.php
          grep -Fq -- "->bind(':matchTimestamp', \$matchTimestamp, ParameterType::INTEGER)" modules/mod_sportsmanagement_ranking/helper.php
          grep -Fq 'SportsManagement SiteRouteHelper could not be loaded.' modules/mod_sportsmanagement_ranking/helper.php
          if grep -Fq -- '->getQuery(true)' modules/mod_sportsmanagement_ranking/helper.php; then
            echo 'Legacy getQuery(true) remains in Ranking helper.' >&2
            exit 1
          fi

          if grep -n '@version[[:space:]]*4\.24' "${files[@]}"; then
            echo 'Old 4.24 metadata remains in Batch 40 PHP files.' >&2
            exit 1
          fi
