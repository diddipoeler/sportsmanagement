name: Joomla 5/6 site admin modules batch 41

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/src/Service/IndividualMatchReadService.php'
      - 'admin/models/fields/personlist.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch41.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/src/Service/IndividualMatchReadService.php'
      - 'admin/models/fields/personlist.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch41.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 individual match, person field and navigation migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/Service/IndividualMatchReadService.php
            admin/models/fields/personlist.php
            modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq 'use Joomla\Database\ParameterType;' site/src/Service/IndividualMatchReadService.php
          grep -Fq '$db->createQuery()' site/src/Service/IndividualMatchReadService.php
          grep -Fq -- "->bind(':projectId', \$projectId, ParameterType::INTEGER)" site/src/Service/IndividualMatchReadService.php
          grep -Fq -- "->bind(':projectTeamId', \$projectTeamId, ParameterType::INTEGER)" site/src/Service/IndividualMatchReadService.php
          grep -Fq -- "->bind(':seasonTeamPersonId', \$seasonTeamPersonId, ParameterType::INTEGER)" site/src/Service/IndividualMatchReadService.php
          grep -Fq -- "->bind(':matchType', \$matchType, ParameterType::STRING)" site/src/Service/IndividualMatchReadService.php

          grep -Fq 'SportsManagement native Personlist field could not be loaded.' admin/models/fields/personlist.php
          grep -Fq 'class_alias(PersonlistField::class' admin/models/fields/personlist.php

          nav='modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php'
          grep -Fq 'use Joomla\Database\ParameterType;' "$nav"
          grep -Fq '$this->db->createQuery()' "$nav"
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' "$nav"
          grep -Fq -- "->bind(':projectId', \$projectId, ParameterType::INTEGER)" "$nav"
          grep -Fq -- "->bind(':divisionId', \$divisionId, ParameterType::INTEGER)" "$nav"
          grep -Fq -- "->bind(':seasonId', \$seasonId, ParameterType::INTEGER)" "$nav"
          grep -Fq -- "->bind(':leagueId', \$leagueId, ParameterType::INTEGER)" "$nav"
          if grep -Fq -- '->getQuery(true)' "$nav"; then
            echo 'Legacy getQuery(true) remains in NavigationMenuHelper.' >&2
            exit 1
          fi
          if grep -Fq 'Factory::getApplication()' "$nav"; then
            echo 'Legacy Factory::getApplication() remains in NavigationMenuHelper.' >&2
            exit 1
          fi

          if grep -n '@version[[:space:]]*4\.24' "${files[@]}"; then
            echo 'Old 4.24 metadata remains in Batch 41 PHP files.' >&2
            exit 1
          fi
