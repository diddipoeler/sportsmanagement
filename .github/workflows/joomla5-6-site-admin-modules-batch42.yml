name: Joomla 5/6 site admin modules batch 42

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/controllers/predictiongame.php'
      - 'admin/models/fields/gcalendar.php'
      - 'modules/mod_sportsmanagement_teamplayers/src/Helper/TeamPlayersHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch42.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/controllers/predictiongame.php'
      - 'admin/models/fields/gcalendar.php'
      - 'modules/mod_sportsmanagement_teamplayers/src/Helper/TeamPlayersHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch42.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 prediction game, Google calendar field and TeamPlayers migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/controllers/predictiongame.php
            admin/models/fields/gcalendar.php
            modules/mod_sportsmanagement_teamplayers/src/Helper/TeamPlayersHelper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq 'SportsManagement native Predictiongame controller could not be loaded.' site/controllers/predictiongame.php
          grep -Fq 'class_alias(PredictiongameController::class' site/controllers/predictiongame.php

          grep -Fq 'SportsManagement native Gcalendar field could not be loaded.' admin/models/fields/gcalendar.php
          grep -Fq 'class_alias(GcalendarField::class' admin/models/fields/gcalendar.php

          helper='modules/mod_sportsmanagement_teamplayers/src/Helper/TeamPlayersHelper.php'
          grep -Fq 'use Joomla\Database\ParameterType;' "$helper"
          grep -Fq '$db->createQuery()' "$helper"
          grep -Fq -- "->bind(':projectId', \$projectId, ParameterType::INTEGER)" "$helper"
          grep -Fq -- "->bind(':teamId', \$teamId, ParameterType::INTEGER)" "$helper"
          grep -Fq -- "->bind(':seasonId', \$seasonId, ParameterType::INTEGER)" "$helper"
          grep -Fq -- "->bind(':positionProjectId', \$projectId, ParameterType::INTEGER)" "$helper"
          if grep -Fq -- '->getQuery(true)' "$helper"; then
            echo 'Legacy getQuery(true) remains in TeamPlayersHelper.' >&2
            exit 1
          fi

          if grep -n '@version[[:space:]]*4\.24' "${files[@]}"; then
            echo 'Old 4.24 metadata remains in Batch 42 PHP files.' >&2
            exit 1
          fi
