name: Joomla 5/6 site admin modules batch 43

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/controllers/predictionranking.php'
      - 'admin/models/fields/userlist.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch43.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/controllers/predictionranking.php'
      - 'admin/models/fields/userlist.php'
      - 'modules/mod_sportsmanagement_birthday/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch43.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 prediction ranking, user list and birthday bridges
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/controllers/predictionranking.php
            admin/models/fields/userlist.php
            modules/mod_sportsmanagement_birthday/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq 'SportsManagement native Predictionranking controller could not be loaded.' site/controllers/predictionranking.php
          grep -Fq 'class_alias(PredictionrankingController::class' site/controllers/predictionranking.php
          grep -Fq 'is_file($nativeController)' site/controllers/predictionranking.php

          grep -Fq 'SportsManagement native Userlist field could not be loaded.' admin/models/fields/userlist.php
          grep -Fq 'class_alias(UserlistField::class' admin/models/fields/userlist.php
          grep -Fq 'is_file($nativeField)' admin/models/fields/userlist.php

          birthday='modules/mod_sportsmanagement_birthday/helper.php'
          grep -Fq 'SportsManagement native Birthday module helper could not be loaded.' "$birthday"
          grep -Fq 'is_file($nativeHelper)' "$birthday"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$birthday"

          if grep -n '@version[[:space:]]*4\.24' "${files[@]}"; then
            echo 'Old 4.24 metadata remains in Batch 43 PHP files.' >&2
            exit 1
          fi
