name: Joomla 5/6 site admin modules batch 45

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/controllers/predictionusers.php'
      - 'admin/models/fields/agegrouplist.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch45.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/controllers/predictionusers.php'
      - 'admin/models/fields/agegrouplist.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch45.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 prediction users, age group and playground plan bridges
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/controllers/predictionusers.php
            admin/models/fields/agegrouplist.php
            modules/mod_sportsmanagement_playgroundplan/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq 'SportsManagement native Predictionusers controller could not be loaded.' site/controllers/predictionusers.php
          grep -Fq 'class_alias(PredictionusersController::class' site/controllers/predictionusers.php
          grep -Fq 'is_file($nativeController)' site/controllers/predictionusers.php

          grep -Fq 'SportsManagement native Agegrouplist field could not be loaded.' admin/models/fields/agegrouplist.php
          grep -Fq 'class_alias(AgegrouplistField::class' admin/models/fields/agegrouplist.php
          grep -Fq 'is_file($nativeField)' admin/models/fields/agegrouplist.php

          playground='modules/mod_sportsmanagement_playgroundplan/helper.php'
          grep -Fq 'SportsManagement native PlaygroundPlan module helper could not be loaded.' "$playground"
          grep -Fq 'class_alias(PlaygroundPlanHelper::class' "$playground"
          grep -Fq 'is_file($nativeHelper)' "$playground"

          if grep -n '@version[[:space:]]*4\.24' "${files[@]}"; then
            echo 'Old 4.24 metadata remains in Batch 45 PHP files.' >&2
            exit 1
          fi
