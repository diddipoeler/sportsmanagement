name: Joomla 5/6 site admin modules batch 461

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/legacy/resultsmatch.php'
      - 'admin/elements/playgrounds.php'
      - 'admin/elements/predictiongame.php'
      - 'admin/elements/rounds.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch461.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/legacy/resultsmatch.php'
      - 'admin/elements/playgrounds.php'
      - 'admin/elements/predictiongame.php'
      - 'admin/elements/rounds.php'
      - 'modules/mod_sportsmanagement_playgroundplan/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch461.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate migrated PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/legacy/resultsmatch.php
            admin/elements/playgrounds.php
            admin/elements/predictiongame.php
            admin/elements/rounds.php
            modules/mod_sportsmanagement_playgroundplan/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

      - name: Validate Joomla 5/6 compatibility contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- 'SportsManagementSiteApplicationResolver::resolve()' site/legacy/resultsmatch.php
          ! grep -Fq -- 'Factory::getContainer()->get(SiteApplication::class)' site/legacy/resultsmatch.php
          grep -Fq -- "requires the Joomla site application" site/legacy/resultsmatch.php

          for file in             admin/elements/playgrounds.php             admin/elements/predictiongame.php             admin/elements/rounds.php; do
            grep -Fq -- 'is_file($nativeField)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
          done

          count=$(grep -Fc "if ($teamId <= 0)" modules/mod_sportsmanagement_playgroundplan/helper.php)
          test "$count" -ge 2
