name: Joomla 5/6 site admin modules batch 462

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/project.php'
      - 'admin/elements/colorpicker.php'
      - 'admin/elements/imageselect.php'
      - 'admin/elements/multilist.php'
      - 'admin/elements/nameformat.php'
      - 'admin/elements/rankingcolumns.php'
      - 'admin/elements/teamnameformat.php'
      - 'modules/mod_sportsmanagement_projectmap/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch462.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/project.php'
      - 'admin/elements/colorpicker.php'
      - 'admin/elements/imageselect.php'
      - 'admin/elements/multilist.php'
      - 'admin/elements/nameformat.php'
      - 'admin/elements/rankingcolumns.php'
      - 'admin/elements/teamnameformat.php'
      - 'modules/mod_sportsmanagement_projectmap/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch462.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate migrated PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/project.php
            admin/elements/colorpicker.php
            admin/elements/imageselect.php
            admin/elements/multilist.php
            admin/elements/nameformat.php
            admin/elements/rankingcolumns.php
            admin/elements/teamnameformat.php
            modules/mod_sportsmanagement_projectmap/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

      - name: Validate Joomla 5/6 compatibility contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- 'CMSApplicationInterface' site/models/project.php
          grep -Fq -- "requires the Joomla site application" site/models/project.php
          ! grep -Fq -- 'use Joomla\CMS\Application\SiteApplication;' site/models/project.php

          for file in             admin/elements/colorpicker.php             admin/elements/imageselect.php             admin/elements/multilist.php             admin/elements/nameformat.php             admin/elements/rankingcolumns.php             admin/elements/teamnameformat.php; do
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
          done

          grep -Fq -- 'instanceof DatabaseInterface' modules/mod_sportsmanagement_projectmap/helper.php
          grep -Fq -- 'ProjectMap database service is unavailable.' modules/mod_sportsmanagement_projectmap/helper.php
