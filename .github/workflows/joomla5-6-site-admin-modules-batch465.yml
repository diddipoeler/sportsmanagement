name: Joomla 5/6 site admin modules batch 465

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/resultsmatrix/view.html.php'
      - 'site/views/rankingmatrix/view.html.php'
      - 'site/views/resultsranking/view.html.php'
      - 'admin/models/fields/seasoncheckbox.php'
      - 'admin/models/fields/playgroundlist2.php'
      - 'admin/models/fields/projectteamlist.php'
      - 'admin/models/fields/userfields.php'
      - 'modules/mod_sportsmanagement_new_project/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch465.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/resultsmatrix/view.html.php'
      - 'site/views/rankingmatrix/view.html.php'
      - 'site/views/resultsranking/view.html.php'
      - 'admin/models/fields/seasoncheckbox.php'
      - 'admin/models/fields/playgroundlist2.php'
      - 'admin/models/fields/projectteamlist.php'
      - 'admin/models/fields/userfields.php'
      - 'modules/mod_sportsmanagement_new_project/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch465.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate migrated PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/resultsmatrix/view.html.php
            site/views/rankingmatrix/view.html.php
            site/views/resultsranking/view.html.php
            admin/models/fields/seasoncheckbox.php
            admin/models/fields/playgroundlist2.php
            admin/models/fields/projectteamlist.php
            admin/models/fields/userfields.php
            modules/mod_sportsmanagement_new_project/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

      - name: Validate Joomla 5/6 compatibility contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq -- 'SportsManagementDatabaseTrait.php' admin/models/fields/seasoncheckbox.php

          for file in             admin/models/fields/playgroundlist2.php             admin/models/fields/projectteamlist.php             admin/models/fields/userfields.php; do
            grep -Fq -- 'SportsManagementDatabaseTrait.php' "$file"
            grep -Fq -- 'SportsManagementListField.php' "$file"
            grep -Fq -- 'is_file($nativeField)' "$file"
          done

          grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' admin/models/fields/projectteamlist.php
          grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' admin/models/fields/userfields.php

          grep -Fq -- "class_exists('sportsmanagementViewResults', false)" site/views/resultsmatrix/view.html.php
          grep -Fq -- "Results parent view could not be loaded." site/views/resultsmatrix/view.html.php
          grep -Fq -- "class_exists('sportsmanagementViewMatrix', false)" site/views/rankingmatrix/view.html.php
          grep -Fq -- 'ranking-matrix dependency could not be loaded:' site/views/rankingmatrix/view.html.php
          grep -Fq -- "class_exists('sportsmanagementViewResults', false)" site/views/resultsranking/view.html.php
          grep -Fq -- 'results-ranking dependency could not be loaded:' site/views/resultsranking/view.html.php

          grep -Fq -- "isClient('site')" modules/mod_sportsmanagement_new_project/helper.php
          grep -Fq -- 'New Project legacy helper requires the Joomla site application.' modules/mod_sportsmanagement_new_project/helper.php
