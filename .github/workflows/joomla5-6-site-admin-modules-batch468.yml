name: Joomla 5/6 site admin modules batch 468

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/matrix/view.html.php'
      - 'site/views/results/view.html.php'
      - 'site/views/ranking/view.html.php'
      - 'admin/models/fields/seasonlist.php'
      - 'admin/models/fields/sportstypelist.php'
      - 'modules/mod_sportsmanagement_matches/src/Helper/MatchesHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch468.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/matrix/view.html.php'
      - 'site/views/results/view.html.php'
      - 'site/views/ranking/view.html.php'
      - 'admin/models/fields/seasonlist.php'
      - 'admin/models/fields/sportstypelist.php'
      - 'modules/mod_sportsmanagement_matches/src/Helper/MatchesHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch468.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate migrated PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/matrix/view.html.php
            site/views/results/view.html.php
            site/views/ranking/view.html.php
            admin/models/fields/seasonlist.php
            admin/models/fields/sportstypelist.php
            modules/mod_sportsmanagement_matches/src/Helper/MatchesHelper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

      - name: Validate Joomla 5/6 compatibility contracts
        shell: bash
        run: |
          set -euo pipefail

          for file in             admin/models/fields/seasonlist.php             admin/models/fields/sportstypelist.php; do
            grep -Fq -- 'SportsManagementDatabaseTrait.php' "$file"
            grep -Fq -- 'SportsManagementListField.php' "$file"
            grep -Fq -- 'is_file($nativeField)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done

          for file in             site/views/matrix/view.html.php             site/views/results/view.html.php             site/views/ranking/view.html.php; do
            grep -Fq -- 'SportsManagementSiteApplicationResolver.php' "$file"
            grep -Fq -- 'is_file($nativeView)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done

          grep -Fq -- 'instanceof DatabaseInterface' modules/mod_sportsmanagement_matches/src/Helper/MatchesHelper.php
          grep -Fq -- 'Matches database service is unavailable.' modules/mod_sportsmanagement_matches/src/Helper/MatchesHelper.php
          grep -Fq -- "isClient('site')" modules/mod_sportsmanagement_matches/src/Helper/MatchesHelper.php
