name: Joomla 5/6 site admin modules batch 469

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/nextmatch/view.html.php'
      - 'site/views/teaminfo/view.html.php'
      - 'admin/models/fields/leaguelist.php'
      - 'admin/models/fields/clublist.php'
      - 'admin/models/fields/projectdivisionlist.php'
      - 'admin/models/fields/projectpositionlist.php'
      - 'modules/mod_sportsmanagement_act_season/helper.php'
      - 'modules/mod_sportsmanagement_randomplayer/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch469.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/nextmatch/view.html.php'
      - 'site/views/teaminfo/view.html.php'
      - 'admin/models/fields/leaguelist.php'
      - 'admin/models/fields/clublist.php'
      - 'admin/models/fields/projectdivisionlist.php'
      - 'admin/models/fields/projectpositionlist.php'
      - 'modules/mod_sportsmanagement_act_season/helper.php'
      - 'modules/mod_sportsmanagement_randomplayer/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch469.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate migrated PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/nextmatch/view.html.php
            site/views/teaminfo/view.html.php
            admin/models/fields/leaguelist.php
            admin/models/fields/clublist.php
            admin/models/fields/projectdivisionlist.php
            admin/models/fields/projectpositionlist.php
            modules/mod_sportsmanagement_act_season/helper.php
            modules/mod_sportsmanagement_randomplayer/helper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done

      - name: Validate Joomla 5/6 compatibility contracts
        shell: bash
        run: |
          set -euo pipefail

          for file in             admin/models/fields/leaguelist.php             admin/models/fields/clublist.php             admin/models/fields/projectdivisionlist.php             admin/models/fields/projectpositionlist.php; do
            grep -Fq -- 'SportsManagementDatabaseTrait.php' "$file"
            grep -Fq -- 'SportsManagementListField.php' "$file"
            grep -Fq -- 'is_file($nativeField)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done

          grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' admin/models/fields/projectdivisionlist.php
          grep -Fq -- 'SportsManagementAdministratorApplicationResolver.php' admin/models/fields/projectpositionlist.php

          for file in site/views/nextmatch/view.html.php site/views/teaminfo/view.html.php; do
            grep -Fq -- 'SportsManagementSiteApplicationResolver.php' "$file"
            grep -Fq -- 'is_file($nativeView)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done

          grep -Fq -- "isClient('site')" modules/mod_sportsmanagement_act_season/helper.php
          grep -Fq -- 'ActSeason database service is unavailable.' modules/mod_sportsmanagement_act_season/helper.php

          grep -Fq -- "isClient('site')" modules/mod_sportsmanagement_randomplayer/helper.php
          grep -Fq -- 'RandomPlayer database service is unavailable.' modules/mod_sportsmanagement_randomplayer/helper.php
