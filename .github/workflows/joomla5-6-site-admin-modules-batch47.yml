name: Joomla 5/6 site admin modules batch 47

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/controllers/ajax.json.php'
      - 'admin/models/fields/clublist.php'
      - 'admin/src/Field/ClublistField.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - 'modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch47.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/controllers/ajax.json.php'
      - 'admin/models/fields/clublist.php'
      - 'admin/src/Field/ClublistField.php'
      - 'modules/mod_sportsmanagement_clubicons/helper.php'
      - 'modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch47.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Joomla 5/6 Ajax, club list and clubicons migration
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/controllers/ajax.json.php
            admin/models/fields/clublist.php
            admin/src/Field/ClublistField.php
            modules/mod_sportsmanagement_clubicons/helper.php
            modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

          grep -Fq 'SportsManagement native Ajax controller could not be loaded.' site/controllers/ajax.json.php
          grep -Fq 'class_alias(AjaxController::class' site/controllers/ajax.json.php
          grep -Fq 'is_file($nativeController)' site/controllers/ajax.json.php

          grep -Fq 'SportsManagement native Clublist field could not be loaded.' admin/models/fields/clublist.php
          grep -Fq 'class_alias(ClublistField::class' admin/models/fields/clublist.php
          grep -Fq 'is_file($nativeField)' admin/models/fields/clublist.php

          clubicons='modules/mod_sportsmanagement_clubicons/helper.php'
          grep -Fq 'SportsManagement native Clubicons module helper could not be loaded.' "$clubicons"
          grep -Fq 'is_file($nativeHelper)' "$clubicons"
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' "$clubicons"

          native_clubicons='modules/mod_sportsmanagement_clubicons/src/Helper/ClubiconsHelper.php'
          grep -Fq 'use Joomla\CMS\Factory;' "$native_clubicons"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$native_clubicons"

          if grep -n '@version[[:space:]]*4\.24' "${files[@]}"; then
            echo 'Old 4.24 metadata remains in Batch 47 PHP files.' >&2
            exit 1
          fi
