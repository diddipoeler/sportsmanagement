name: Joomla 5/6 site admin modules batch 52

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/controllers/imagehandler.php'
      - 'admin/models/fields/clubs.php'
      - 'admin/src/Field/ClubsField.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch52.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/controllers/imagehandler.php'
      - 'admin/models/fields/clubs.php'
      - 'admin/src/Field/ClubsField.php'
      - 'modules/mod_sportsmanagement_eventsranking/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch52.yml'

jobs:
  php-compatibility:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Lint Batch 52 PHP files
        run: |
          php -l site/controllers/imagehandler.php
          php -l admin/models/fields/clubs.php
          php -l admin/src/Field/ClubsField.php
          php -l modules/mod_sportsmanagement_eventsranking/helper.php

      - name: Verify required PHP metadata
        run: |
          files=(
            site/controllers/imagehandler.php
            admin/models/fields/clubs.php
            admin/src/Field/ClubsField.php
            modules/mod_sportsmanagement_eventsranking/helper.php
          )

          for file in "${files[@]}"; do
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

      - name: Verify guarded Joomla 5/6 compatibility bridges
        run: |
          grep -Fq 'is_file($nativeController)' site/controllers/imagehandler.php
          grep -Fq 'SportsManagement native Imagehandler controller could not be loaded.' site/controllers/imagehandler.php
          grep -Fq "class_alias(ImagehandlerController::class, 'sportsmanagementControllerImagehandler')" site/controllers/imagehandler.php

          grep -Fq 'is_file($nativeField)' admin/models/fields/clubs.php
          grep -Fq 'SportsManagement native Clubs field could not be loaded.' admin/models/fields/clubs.php
          grep -Fq "class_alias(ClubsField::class, 'JFormFieldClubs')" admin/models/fields/clubs.php

          grep -Fq 'is_file($nativeHelper)' modules/mod_sportsmanagement_eventsranking/helper.php
          grep -Fq 'SportsManagement native EventsRanking module helper could not be loaded.' modules/mod_sportsmanagement_eventsranking/helper.php

      - name: Reject stale Batch 52 metadata
        run: |
          ! grep -R -n '@version[[:space:]]\+4\.24' \
            site/controllers/imagehandler.php \
            admin/models/fields/clubs.php \
            admin/src/Field/ClubsField.php \
            modules/mod_sportsmanagement_eventsranking/helper.php
