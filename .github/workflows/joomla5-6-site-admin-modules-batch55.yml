name: Joomla 5/6 site admin modules batch 55

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/src/Controller/PredictionrankingController.php'
      - 'admin/models/fields/currentround.php'
      - 'admin/src/Field/CurrentroundField.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - 'modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch55.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/src/Controller/PredictionrankingController.php'
      - 'admin/models/fields/currentround.php'
      - 'admin/src/Field/CurrentroundField.php'
      - 'modules/mod_sportsmanagement_gcalendar/helper.php'
      - 'modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch55.yml'

jobs:
  php-compatibility:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Lint Batch 55 PHP files
        run: |
          php -l site/src/Controller/PredictionrankingController.php
          php -l admin/models/fields/currentround.php
          php -l admin/src/Field/CurrentroundField.php
          php -l modules/mod_sportsmanagement_gcalendar/helper.php
          php -l modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php

      - name: Verify required PHP metadata
        run: |
          files=(
            site/src/Controller/PredictionrankingController.php
            admin/models/fields/currentround.php
            admin/src/Field/CurrentroundField.php
            modules/mod_sportsmanagement_gcalendar/helper.php
            modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
          )

          for file in "${files[@]}"; do
            grep -Eq '@version[[:space:]]+5\.6\.0' "$file"
            grep -Eq '@author[[:space:]]+diddipoeler' "$file"
            grep -Eq '@copyright[[:space:]]+Copyright \(C\) diddipoeler' "$file"
            grep -Eq '@license[[:space:]]+GNU General Public License version 2 or later; see LICENSE\.txt' "$file"
          done

      - name: Verify guarded Joomla 5/6 compatibility bridges
        run: |
          grep -Fq 'is_file($nativeField)' admin/models/fields/currentround.php
          grep -Fq 'SportsManagement native Currentround field could not be loaded.' admin/models/fields/currentround.php
          grep -Fq "class_alias(CurrentroundField::class, 'JFormFieldCurrentround')" admin/models/fields/currentround.php

          grep -Fq 'is_file($nativeHelper)' modules/mod_sportsmanagement_gcalendar/helper.php
          grep -Fq 'SportsManagement native GCalendar module helper could not be loaded.' modules/mod_sportsmanagement_gcalendar/helper.php
          grep -Fq "class_exists('sportsmanagementModGCalendarHelper', false)" modules/mod_sportsmanagement_gcalendar/helper.php

      - name: Reject stale Batch 55 metadata
        run: |
          ! grep -R -n '@version[[:space:]]\+4\.24' \
            site/src/Controller/PredictionrankingController.php \
            admin/models/fields/currentround.php \
            admin/src/Field/CurrentroundField.php \
            modules/mod_sportsmanagement_gcalendar/helper.php \
            modules/mod_sportsmanagement_gcalendar/src/Helper/GcalendarHelper.php
