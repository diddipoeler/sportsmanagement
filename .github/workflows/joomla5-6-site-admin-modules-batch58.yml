name: Joomla 5/6 site admin modules batch 58

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/src/Controller/UpdsportsmanagementController.php'
      - 'admin/models/fields/federationslist.php'
      - 'admin/src/Field/FederationslistField.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch58.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/src/Controller/UpdsportsmanagementController.php'
      - 'admin/models/fields/federationslist.php'
      - 'admin/src/Field/FederationslistField.php'
      - 'modules/mod_sportsmanagement_count_rekord/helper.php'
      - '.github/workflows/joomla5-6-site-admin-modules-batch58.yml'

jobs:
  php-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          php -l site/src/Controller/UpdsportsmanagementController.php
          php -l admin/models/fields/federationslist.php
          php -l admin/src/Field/FederationslistField.php
          php -l modules/mod_sportsmanagement_count_rekord/helper.php
      - name: Required migration metadata
        run: |
          files=(
            site/src/Controller/UpdsportsmanagementController.php
            admin/models/fields/federationslist.php
            admin/src/Field/FederationslistField.php
            modules/mod_sportsmanagement_count_rekord/helper.php
          )
          for file in "${files[@]}"; do
            grep -F '@version    5.6.0' "$file"
            grep -F '@author     diddipoeler' "$file"
            grep -F '@copyright  Copyright (C) diddipoeler' "$file"
            grep -F '@license    GNU General Public License version 2 or later; see LICENSE.txt' "$file"
          done
      - name: Compatibility bridge assertions
        run: |
          grep -F 'is_file($modelFile)' site/src/Controller/UpdsportsmanagementController.php
          grep -F 'SportsManagement native Updsportsmanagement model could not be loaded.' site/src/Controller/UpdsportsmanagementController.php
          grep -F 'is_file($nativeField)' admin/models/fields/federationslist.php
          grep -F 'SportsManagement native Federationslist field could not be loaded.' admin/models/fields/federationslist.php
          grep -F "class_alias(FederationslistField::class, 'JFormFieldFederationsList')" admin/models/fields/federationslist.php
          grep -F 'is_file($nativeHelper)' modules/mod_sportsmanagement_count_rekord/helper.php
          grep -F 'SportsManagement CountRekord helper could not be loaded.' modules/mod_sportsmanagement_count_rekord/helper.php
      - name: Reject stale metadata
        run: |
          ! grep -R '@version[[:space:]]\+4\.24' \
            site/src/Controller/UpdsportsmanagementController.php \
            admin/models/fields/federationslist.php \
            admin/src/Field/FederationslistField.php \
            modules/mod_sportsmanagement_count_rekord/helper.php
