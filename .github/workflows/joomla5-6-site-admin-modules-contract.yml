name: Joomla 5/6 site admin modules contract

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/PersonAgeHelper.php'
      - 'site/src/Helper/PersonImageHelper.php'
      - 'site/src/Helper/ModalImageHelper.php'
      - 'site/src/Helper/NamePresentationHelper.php'
      - 'site/src/Helper/PersonNameFormatter.php'
      - 'site/src/Helper/SportsManagementDateHelper.php'
      - 'site/tmpl/statsranking/default_stats.php'
      - 'site/tmpl/rosteralltime/default_players_tab.php'
      - 'site/tmpl/teaminfo/default_teaminfo.php'
      - 'admin/views/leagues/view.html.php'
      - 'admin/views/leagues/tmpl/default.php'
      - 'admin/tmpl/leagues/default.php'
      - 'admin/tmpl/seasons/default.php'
      - 'admin/tables/match.php'
      - 'admin/tables/season.php'
      - 'admin/tables/treeto.php'
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - 'modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php'
      - 'modules/mod_sportsmanagement_gcalendar/tmpl/default.php'
      - '.github/workflows/joomla5-6-site-admin-modules-contract.yml'
  pull_request:
    paths:
      - 'site/src/Helper/PersonAgeHelper.php'
      - 'site/src/Helper/PersonImageHelper.php'
      - 'site/src/Helper/ModalImageHelper.php'
      - 'site/src/Helper/NamePresentationHelper.php'
      - 'site/src/Helper/PersonNameFormatter.php'
      - 'site/src/Helper/SportsManagementDateHelper.php'
      - 'site/tmpl/statsranking/default_stats.php'
      - 'site/tmpl/rosteralltime/default_players_tab.php'
      - 'site/tmpl/teaminfo/default_teaminfo.php'
      - 'admin/views/leagues/view.html.php'
      - 'admin/views/leagues/tmpl/default.php'
      - 'admin/tmpl/leagues/default.php'
      - 'admin/tmpl/seasons/default.php'
      - 'admin/tables/match.php'
      - 'admin/tables/season.php'
      - 'admin/tables/treeto.php'
      - 'modules/mod_sportsmanagement_ranking/helper.php'
      - 'modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php'
      - 'modules/mod_sportsmanagement_gcalendar/tmpl/default.php'
      - '.github/workflows/joomla5-6-site-admin-modules-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint migrated PHP files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/Helper/PersonAgeHelper.php \
            site/src/Helper/PersonImageHelper.php \
            site/src/Helper/ModalImageHelper.php \
            site/src/Helper/NamePresentationHelper.php \
            site/src/Helper/PersonNameFormatter.php \
            site/src/Helper/SportsManagementDateHelper.php \
            site/tmpl/statsranking/default_stats.php \
            site/tmpl/rosteralltime/default_players_tab.php \
            site/tmpl/teaminfo/default_teaminfo.php \
            admin/views/leagues/view.html.php \
            admin/views/leagues/tmpl/default.php \
            admin/tmpl/leagues/default.php \
            admin/tmpl/seasons/default.php \
            admin/tables/match.php \
            admin/tables/season.php \
            admin/tables/treeto.php \
            modules/mod_sportsmanagement_ranking/helper.php \
            modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php \
            modules/mod_sportsmanagement_gcalendar/tmpl/default.php; do
            test -f "$file"
            php -l "$file"
          done

      - name: Validate Joomla 5/6 migration contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('site/src/Helper/PersonAgeHelper.php'),
              Path('site/src/Helper/PersonImageHelper.php'),
              Path('site/src/Helper/ModalImageHelper.php'),
              Path('site/src/Helper/NamePresentationHelper.php'),
              Path('site/src/Helper/PersonNameFormatter.php'),
              Path('site/src/Helper/SportsManagementDateHelper.php'),
              Path('site/tmpl/statsranking/default_stats.php'),
              Path('site/tmpl/rosteralltime/default_players_tab.php'),
              Path('site/tmpl/teaminfo/default_teaminfo.php'),
              Path('admin/views/leagues/view.html.php'),
              Path('admin/views/leagues/tmpl/default.php'),
              Path('admin/tmpl/leagues/default.php'),
              Path('admin/tmpl/seasons/default.php'),
              Path('admin/tables/match.php'),
              Path('admin/tables/season.php'),
              Path('admin/tables/treeto.php'),
              Path('modules/mod_sportsmanagement_ranking/helper.php'),
              Path('modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php'),
              Path('modules/mod_sportsmanagement_gcalendar/tmpl/default.php'),
          ]

          for file in files:
              content = file.read_text(encoding='utf-8')
              for tag in ('@version', '@author', '@copyright', '@license'):
                  if tag not in content:
                      raise SystemExit(f'{file}: required metadata missing: {tag}')

          ranking = Path('modules/mod_sportsmanagement_ranking/helper.php').read_text(encoding='utf-8')
          for legacy in (
              'JSMCountries::',
              'sportsmanagementModelProject',
              'sportsmanagementModelRanking',
              'JSMRanking::',
              '/models/project.php',
              '/models/ranking.php',
              '/helpers/ranking.php',
          ):
              if legacy in ranking:
                  raise SystemExit(f'Ranking module regressed to legacy dependency: {legacy}')
          for needle in (
              'CountryPresentationHelper::flag(',
              'NativeRankingHelper',
              'SportsManagementSiteApplicationResolver::resolve()',
          ):
              if needle not in ranking:
                  raise SystemExit(f'Ranking module native helper contract missing: {needle}')

          stats = Path('site/tmpl/statsranking/default_stats.php').read_text(encoding='utf-8')
          for needle in (
              'CountryPresentationHelper::flag(',
              'PersonNameFormatter::format(',
              'ModalImageHelper::render(',
              "SiteRouteHelper::view('player'",
          ):
              if needle not in stats:
                  raise SystemExit(f'Statsranking native presentation contract missing: {needle}')

          roster = Path('site/tmpl/rosteralltime/default_players_tab.php').read_text(encoding='utf-8')
          for legacy in (
              'sportsmanagementHelper::',
              'sportsmanagementHelperHtml::',
              'sportsmanagementHelperRoute::',
              'JSMCountries::',
          ):
              if legacy in roster:
                  raise SystemExit(f'Roster-all-time regressed to legacy dependency: {legacy}')
          for needle in (
              'NamePresentationHelper::person(',
              'PersonImageHelper::resolve(',
              'ModalImageHelper::render(',
              'CountryPresentationHelper::flag(',
              "SiteRouteHelper::view('player'",
              'PersonAgeHelper::calculate(',
          ):
              if needle not in roster:
                  raise SystemExit(f'Roster-all-time native presentation contract missing: {needle}')

          admin = Path('admin/tmpl/leagues/default.php').read_text(encoding='utf-8')
          for needle in ('joomla.searchtools.default', "HTMLHelper::_('searchtools.sort'", "HTMLHelper::_('form.token'"):
              if needle not in admin:
                  raise SystemExit(f'Leagues native administrator contract missing: {needle}')

          seasons = Path('admin/tmpl/seasons/default.php').read_text(encoding='utf-8')
          for needle in ('joomla.searchtools.default', "HTMLHelper::_('searchtools.sort'", "HTMLHelper::_('form.token'"):
              if needle not in seasons:
                  raise SystemExit(f'Seasons native administrator contract missing: {needle}')

          for table_bridge, native_class in (
              (Path('admin/tables/match.php'), 'MatchTable'),
              (Path('admin/tables/season.php'), 'SeasonTable'),
              (Path('admin/tables/treeto.php'), 'TreetoTable'),
          ):
              content = table_bridge.read_text(encoding='utf-8')
              if 'sportsmanagementHelper::' in content:
                  raise SystemExit(f'{table_bridge}: legacy helper dependency remains')
              if f'class_alias({native_class}::class' not in content:
                  raise SystemExit(f'{table_bridge}: native table bridge contract missing')

          print('Joomla 5/6 site/admin/modules contracts OK')
          PY
