name: Joomla 5/6 site admin modules follow-up gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  follow-up-migration:
    name: Site, admin and module compatibility checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 follow-up migration
        shell: bash
        run: |
          set -euo pipefail

          site_base=site/src/Model/SportsManagementModel.php
          site_list=site/src/Model/SportsManagementListModel.php
          site_ajax=site/src/Model/AjaxModel.php
          site_matches=site/src/Controller/MatchesController.php
          site_routes=site/src/Helper/PredictionRouteHelper.php

          admin_avatar=admin/src/Field/AvatarfromcomponentField.php
          admin_k2=admin/src/Field/Categorylistk2Field.php
          admin_resolver=admin/src/Helper/SportsManagementDatabaseResolver.php
          admin_agegroup=admin/src/Model/AgegroupModel.php
          admin_divisions=admin/src/Model/DivisionsModel.php

          actseason_dispatcher=modules/mod_sportsmanagement_act_season/src/Dispatcher/Dispatcher.php
          actseason_helper=modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php
          clubbirthday_bridge=modules/mod_sportsmanagement_club_birthday/helper.php
          clubbirthday_dispatcher=modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php
          clubbirthday_helper=modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
          projectmap_bridge=modules/mod_sportsmanagement_projectmap/helper.php
          projectmap_dispatcher=modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php
          projectmap_helper=modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php
          rquotes_helper=modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php

          files=(
            "$site_base" "$site_list" "$site_ajax" "$site_matches" "$site_routes"
            "$admin_avatar" "$admin_k2" "$admin_resolver" "$admin_agegroup" "$admin_divisions"
            "$actseason_dispatcher" "$actseason_helper"
            "$clubbirthday_bridge" "$clubbirthday_dispatcher" "$clubbirthday_helper"
            "$projectmap_bridge" "$projectmap_dispatcher" "$projectmap_helper"
            "$rquotes_helper"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          # Site base models: resolve the site app, then obtain Joomla services from its container.
          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$site_base"
          grep -Fq '$this->siteApplication()->getContainer()->get(DatabaseInterface::class)' "$site_base"
          grep -Fq '$this->siteApplication()->getContainer()->get(DatabaseInterface::class)' "$site_list"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$site_ajax"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$site_matches"
          grep -Fq "SiteRouteHelper::view('predictionresults'" "$site_routes"

          # Administrator runtime: validate the administrator application before container access.
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$admin_avatar"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$admin_avatar"
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$admin_k2"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$admin_k2"
          grep -Fq 'SportsManagementAdministratorApplicationResolver::resolve()' "$admin_resolver"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$admin_resolver"
          grep -Fq 'extends SportsManagementAdminModel' "$admin_agegroup"
          grep -Fq 'extends SportsManagementListModel' "$admin_divisions"

          # Native module dispatchers receive the site application and use its container.
          grep -Fq 'extends AbstractModuleDispatcher' "$actseason_dispatcher"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$actseason_dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$actseason_helper"

          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$clubbirthday_bridge"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$clubbirthday_bridge"
          grep -Fq 'extends AbstractModuleDispatcher' "$clubbirthday_dispatcher"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$clubbirthday_dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$clubbirthday_helper"
          grep -Fq 'SiteRouteHelper::view(' "$clubbirthday_helper"

          grep -Fq 'SportsManagementSiteApplicationResolver::resolve()' "$projectmap_bridge"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$projectmap_bridge"
          grep -Fq 'extends AbstractModuleDispatcher' "$projectmap_dispatcher"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$projectmap_dispatcher"
          grep -Fq 'SiteRouteHelper::view(' "$projectmap_helper"
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$rquotes_helper"

          # These migrated paths must not regress to static Joomla Factory container access.
          migrated_container_files=(
            "$site_base" "$site_list"
            "$admin_avatar" "$admin_k2" "$admin_resolver"
            "$actseason_dispatcher"
            "$clubbirthday_bridge" "$clubbirthday_dispatcher"
            "$projectmap_bridge" "$projectmap_dispatcher"
          )

          if grep -F -- 'Factory::getContainer()' "${migrated_container_files[@]}"; then
            echo 'A migrated runtime path regressed to Factory::getContainer().' >&2
            exit 1
          fi

          if grep -E -- 'JFactory::|JRequest::|Factory::getDbo\(|Factory::getDBO\(|JLoader::|jimport\(' "${files[@]}"; then
            echo 'A Joomla 5/6 follow-up path regressed to a removed or legacy runtime API.' >&2
            exit 1
          fi

          echo 'Joomla 5/6 site/admin/modules follow-up contracts OK'
