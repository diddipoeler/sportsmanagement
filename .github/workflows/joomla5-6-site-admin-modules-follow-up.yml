name: Joomla 5/6 site admin modules follow-up gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  follow-up-migration:
    name: Site, admin and module compatibility checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 follow-up migration
        shell: bash
        run: |
          set -euo pipefail

          site_file=site/libraries/gcalendar/view.php
          admin_field=admin/src/Field/GcalendarField.php
          admin_updates=admin/src/Model/UpdatesModel.php
          rquotes_file=modules/mod_sportsmanagement_rquotes/helper.php
          projectmap_file=modules/mod_sportsmanagement_projectmap/helper.php

          files=(
            "$site_file"
            "$admin_field"
            "$admin_updates"
            "$rquotes_file"
            "$projectmap_file"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq '$siteName = (string) $app->get(' "$site_file"
          grep -Fq '$pageTitleMode = (int) $app->get(' "$site_file"
          if grep -Fq -- '->getCfg(' "$site_file"; then
            echo 'GCalendar site view regressed to CMSApplication::getCfg()' >&2
            exit 1
          fi

          grep -Fq 'extends SportsManagementListField' "$admin_field"
          grep -Fq '$this->getSportsManagementDatabase()' "$admin_field"
          grep -Fq "'value' => (string) \$item->value" "$admin_field"
          if grep -Fq "HTMLHelper::_('select.option'" "$admin_field"; then
            echo 'GCalendar admin field regressed to the legacy HTMLHelper select option adapter' >&2
            exit 1
          fi

          grep -Fq 'SportsManagementDatabaseResolver' "$admin_updates"
          grep -Fq '(new SportsManagementDatabaseResolver())->resolve($selector, $this->getDatabase())' "$admin_updates"
          grep -Fq '$app = Factory::getApplication();' "$admin_updates"
          if grep -E -- 'JLoader::|sportsmanagementHelper::getDBConnection' "$admin_updates"; then
            echo 'Updates model regressed to the legacy loader/database helper' >&2
            exit 1
          fi

          grep -Fq '$app = Factory::getApplication();' "$rquotes_file"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$rquotes_file"
          if grep -Fq 'Factory::getContainer(' "$rquotes_file"; then
            echo 'Random quotes compatibility facade bypasses the application container' >&2
            exit 1
          fi

          grep -Fq '$app = Factory::getApplication();' "$projectmap_file"
          grep -Fq '$app->getContainer()->get(DatabaseInterface::class)' "$projectmap_file"
          if grep -Fq 'Factory::getContainer(' "$projectmap_file"; then
            echo 'Project map compatibility facade bypasses the application container' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|Factory::getDocument\(|Factory::getConfig\(|->getCfg\(' "${files[@]}"; then
            echo 'Follow-up migration regressed to a removed Joomla API' >&2
            exit 1
          fi
