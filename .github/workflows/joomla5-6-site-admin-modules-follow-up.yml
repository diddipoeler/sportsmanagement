name: Joomla 5/6 site admin modules follow-up gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  follow-up-migration:
    name: Site, admin and module compatibility checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 follow-up migration
        shell: bash
        run: |
          set -euo pipefail

          site_files=(
            site/libraries/gcalendar/view.php
            site/src/Model/AjaxModel.php
            site/src/Model/SportsManagementModel.php
            site/src/Model/SportsManagementListModel.php
            site/legacy/resultsmatch.php
          )

          admin_files=(
            admin/src/Field/GcalendarField.php
            admin/src/Field/AvatarfromcomponentField.php
            admin/src/Field/AgegrouplistField.php
            admin/src/Field/ClubsField.php
            admin/src/Field/AgegroupsField.php
            admin/src/Field/FederationslistField.php
            admin/src/Field/CountryassociationField.php
            admin/src/Field/Categorylistk2Field.php
            admin/src/Helper/SportsManagementDatabaseResolver.php
            admin/src/Model/UpdatesModel.php
            admin/src/Model/RoundModel.php
            admin/src/Model/TeamModel.php
          )

          module_files=(
            modules/mod_sportsmanagement_club_birthday/helper.php
            modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
            modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php
            modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
            modules/mod_sportsmanagement_ranking/helper.php
            modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php
            modules/mod_sportsmanagement_projectmap/helper.php
            modules/mod_sportsmanagement_rquotes/helper.php
          )

          files=("${site_files[@]}" "${admin_files[@]}" "${module_files[@]}")

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          metadata_files=(
            "${site_files[@]}"
            admin/src/Field/GcalendarField.php
            admin/src/Field/AvatarfromcomponentField.php
            admin/src/Field/AgegrouplistField.php
            admin/src/Field/ClubsField.php
            admin/src/Field/AgegroupsField.php
            admin/src/Field/FederationslistField.php
            admin/src/Field/CountryassociationField.php
            admin/src/Field/Categorylistk2Field.php
            modules/mod_sportsmanagement_club_birthday/helper.php
            modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
            modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php
            modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
            modules/mod_sportsmanagement_ranking/helper.php
          )

          for file in "${metadata_files[@]}"; do
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file" || {
                echo "$file is missing $tag" >&2
                exit 1
              }
            done
          done

          # Site: use Joomla 5/6 application and database APIs.
          grep -Fq '$siteName = (string) $app->get(' site/libraries/gcalendar/view.php
          grep -Fq '$pageTitleMode = (int) $app->get(' site/libraries/gcalendar/view.php
          ! grep -Fq -- '->getCfg(' site/libraries/gcalendar/view.php

          grep -Fq 'SportsManagementDatabaseResolver::resolve(' site/src/Model/AjaxModel.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' site/src/Model/SportsManagementModel.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' site/src/Model/SportsManagementListModel.php
          ! grep -Fq '$app->getContainer(' site/src/Model/SportsManagementModel.php
          ! grep -Fq '$app->getContainer(' site/src/Model/SportsManagementListModel.php

          # Admin: native list fields and container access only.
          for field in \
            admin/src/Field/GcalendarField.php \
            admin/src/Field/AgegrouplistField.php \
            admin/src/Field/ClubsField.php \
            admin/src/Field/AgegroupsField.php \
            admin/src/Field/FederationslistField.php \
            admin/src/Field/CountryassociationField.php; do
            grep -Fq 'extends SportsManagementListField' "$field"
            grep -Fq '$this->getSportsManagementDatabase()' "$field"
            ! grep -Fq 'HTMLHelper::' "$field"
          done

          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' admin/src/Field/AvatarfromcomponentField.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' admin/src/Field/Categorylistk2Field.php
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' admin/src/Helper/SportsManagementDatabaseResolver.php
          ! grep -Fq '$app->getContainer(' admin/src/Helper/SportsManagementDatabaseResolver.php

          # Modules: route through SiteRouteHelper and avoid removed runtime APIs.
          nav=modules/mod_sportsmanagement_navigation_menu/src/Helper/NavigationMenuHelper.php
          native_nav=modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$nav"
          grep -Fq 'SiteRouteHelper::view(' "$nav"
          grep -Fq 'SiteRouteHelper::view(' "$native_nav"
          if grep -E -- 'sportsmanagementHelperRoute::|loadRouteHelper\(|http_build_query\(|Factory::getDbo\(|Factory::getDBO\(|JLoader::|jimport\(' "$nav" "$native_nav"; then
            echo 'Navigation Menu helper regressed to a legacy Joomla runtime API' >&2
            exit 1
          fi

          birthday=modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
          grep -Fq 'SportsManagementDatabaseResolver::resolve(' "$birthday"
          grep -Fq 'SiteRouteHelper::view(' "$birthday"
          grep -Fq 'Route::_(' "$birthday"
          grep -Fq '\Joomla\CMS\Factory::getContainer()->get(DatabaseInterface::class)' modules/mod_sportsmanagement_club_birthday/helper.php
          grep -Fq '\Joomla\CMS\Factory::getContainer()->get(DatabaseInterface::class)' modules/mod_sportsmanagement_club_birthday/src/Dispatcher/Dispatcher.php

          ranking=modules/mod_sportsmanagement_ranking/src/Helper/RankingHelper.php
          grep -Fq '$app = Factory::getApplication();' "$ranking"
          grep -Fq '$container = Factory::getContainer();' "$ranking"
          ! grep -Fq '$app->getContainer(' "$ranking"

          echo 'Joomla 5/6 site/admin/modules follow-up contracts OK'
