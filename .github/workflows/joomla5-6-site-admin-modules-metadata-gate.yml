name: Joomla 5/6 site admin modules metadata gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  php-metadata:
    name: PHP metadata and syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final third-party metadata and PHP 8 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          browser = Path('admin/helpers/browser.php')
          browser_text = browser.read_text(encoding='utf-8')
          browser_needle = " * Author: Chris Schuld (http://chrisschuld.com/)\n * @version 2.0.0\n *\n * Copyright 2025 Chris Schuld"
          browser_replacement = " * Author: Chris Schuld (http://chrisschuld.com/)\n * @version 2.0.0\n * @author Chris Schuld\n * @copyright Copyright 2025 Chris Schuld\n * @license MIT License\n *\n * Copyright 2025 Chris Schuld"
          if browser_needle in browser_text:
              browser.write_text(browser_text.replace(browser_needle, browser_replacement, 1), encoding='utf-8')
          elif browser_replacement not in browser_text:
              raise SystemExit('browser.php metadata anchor not found; refusing unsafe rewrite')

          ical = Path('admin/helpers/iCalUtilityFunctions.class.php')
          ical_text = ical.read_text(encoding='utf-8')
          ical_header = " * iCalcreator class v2.10.5\n * copyright (c) 2007-2011 Kjell-Inge Gustafsson kigkonsult"
          ical_header_replacement = " * iCalcreator class v2.10.5\n * @version 2.10.5\n * @author Kjell-Inge Gustafsson, kigkonsult <ical@kigkonsult.se>\n * @copyright Copyright (c) 2007-2011 Kjell-Inge Gustafsson kigkonsult\n * @license GNU Lesser General Public License version 2.1 or later\n *\n * copyright (c) 2007-2011 Kjell-Inge Gustafsson kigkonsult"
          if ical_header in ical_text:
              ical_text = ical_text.replace(ical_header, ical_header_replacement, 1)
          elif ical_header_replacement not in ical_text:
              raise SystemExit('iCal metadata anchor not found; refusing unsafe rewrite')

          ternary = "$tzid = (isset($theDate['tz'])) ? $theDate['tz'] : (7 == count($theDate)) ? end($theDate) : null;"
          ternary_replacement = "$tzid = (isset($theDate['tz'])) ? $theDate['tz'] : ((7 == count($theDate)) ? end($theDate) : null);"
          if ternary in ical_text:
              ical_text = ical_text.replace(ternary, ternary_replacement, 1)
          elif ternary_replacement not in ical_text:
              raise SystemExit('iCal nested ternary anchor not found; refusing unsafe rewrite')
          ical.write_text(ical_text, encoding='utf-8')
          PY

      - name: Validate PHP files
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          syntax_errors=0

          while IFS= read -r -d '' file; do
            if ! php -l "$file" >/dev/null; then
              echo "$file has PHP syntax errors"
              syntax_errors=1
            fi

            for tag in '@version' '@author' '@copyright' '@license'; do
              if ! grep -Fq -- "$tag" "$file"; then
                echo "$file is missing $tag"
                missing=1
              fi
            done
          done < <(find site admin modules -type f -name '*.php' -print0 | sort -z)

          if (( syntax_errors != 0 )); then
            echo 'One or more PHP files have syntax errors.' >&2
          fi

          if (( missing != 0 )); then
            echo 'One or more PHP files are missing required metadata.' >&2
          fi

          if (( syntax_errors != 0 || missing != 0 )); then
            exit 1
          fi

      - name: Commit validated fixes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin/helpers/browser.php admin/helpers/iCalUtilityFunctions.class.php; then
            echo 'No metadata fixes remain to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin/helpers/browser.php admin/helpers/iCalUtilityFunctions.class.php
          git commit -m "Fix final PHP metadata and PHP 8 syntax blockers"
          git push origin HEAD:joomla5-6
