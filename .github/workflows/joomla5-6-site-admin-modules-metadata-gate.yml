name: Joomla 5/6 site admin modules metadata gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  php-metadata:
    name: PHP metadata and syntax
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP files
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null

            for tag in '@version' '@author' '@copyright' '@license'; do
              if ! grep -Fq -- "$tag" "$file"; then
                echo "$file is missing $tag"
                missing=1
              fi
            done
          done < <(find site admin modules -type f -name '*.php' -print0 | sort -z)

          if (( missing != 0 )); then
            echo 'One or more PHP files are missing required metadata.' >&2
            exit 1
          fi
