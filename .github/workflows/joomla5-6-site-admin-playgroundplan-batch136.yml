name: Joomla 5/6 site admin PlaygroundPlan batch 136

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/settings/default/predictionresults.xml'
      - 'site/settings/default/results.xml'
      - 'site/settings/default/teamplan.xml'
      - 'admin/views/teams/view.html.php'
      - 'modules/mod_sportsmanagement_playgroundplan/mod_sportsmanagement_playgroundplan.xml'
      - 'modules/mod_sportsmanagement_playgroundplan/update-server.xml'
      - 'modules/mod_sportsmanagement_playgroundplan/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-site-admin-playgroundplan-batch136.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/settings/default/predictionresults.xml'
      - 'site/settings/default/results.xml'
      - 'site/settings/default/teamplan.xml'
      - 'admin/views/teams/view.html.php'
      - 'modules/mod_sportsmanagement_playgroundplan/**'
      - '.github/workflows/joomla5-6-site-admin-playgroundplan-batch136.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/views/teams/view.html.php
            modules/mod_sportsmanagement_playgroundplan/src/Dispatcher/Dispatcher.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate XML
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/settings/default/predictionresults.xml
            site/settings/default/results.xml
            site/settings/default/teamplan.xml
            modules/mod_sportsmanagement_playgroundplan/mod_sportsmanagement_playgroundplan.xml
            modules/mod_sportsmanagement_playgroundplan/update-server.xml
          )

          for file in "${files[@]}"; do
            php -r 'if (simplexml_load_file($argv[1]) === false) { exit(1); }' "$file"
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          for file in site/settings/default/predictionresults.xml site/settings/default/results.xml site/settings/default/teamplan.xml; do
            grep -Fq 'value="table table-sm"' "$file"
            if grep -Fq 'table-condensed' "$file"; then
              echo "$file regressed to Bootstrap 3 table-condensed." >&2
              exit 1
            fi
          done

          admin_bridge=admin/views/teams/view.html.php
          manifest=modules/mod_sportsmanagement_playgroundplan/mod_sportsmanagement_playgroundplan.xml
          update=modules/mod_sportsmanagement_playgroundplan/update-server.xml
          dispatcher=modules/mod_sportsmanagement_playgroundplan/src/Dispatcher/Dispatcher.php

          grep -Fq 'SportsManagement native administrator Teams view could not be loaded.' "$admin_bridge"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewTeams')" "$admin_bridge"

          grep -Fq '<version>5.6.0</version>' "$manifest"
          grep -Fq 'type="extensionversion" version="5.6.0"' "$manifest"
          grep -Fq '<version>5.6.0</version>' "$update"
          grep -Fq '<targetplatform name="joomla" version="[56].*" />' "$update"

          grep -Fq 'use Joomla\CMS\Application\SiteApplication;' "$dispatcher"
          grep -Fq 'SportsManagement PlaygroundPlan requires the Joomla site application.' "$dispatcher"

          echo 'Joomla 5/6 batch 136 contracts OK.'
