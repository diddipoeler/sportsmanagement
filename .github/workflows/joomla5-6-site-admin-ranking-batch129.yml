name: Joomla 5/6 site admin ranking batch 129

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/settings/default/allplaygrounds.xml'
      - 'site/settings/default/referees.xml'
      - 'site/settings/default/ranking.xml'
      - 'admin/views/sportsmanagements/view.html.php'
      - 'admin/src/View/Sportsmanagements/HtmlView.php'
      - 'admin/models/sportsmanagements.php'
      - 'modules/mod_sportsmanagement_ranking/mod_sportsmanagement_ranking.xml'
      - 'modules/mod_sportsmanagement_ranking/update-server.xml'
      - 'modules/mod_sportsmanagement_ranking/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-site-admin-ranking-batch129.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/settings/default/allplaygrounds.xml'
      - 'site/settings/default/referees.xml'
      - 'site/settings/default/ranking.xml'
      - 'admin/views/sportsmanagements/view.html.php'
      - 'admin/src/View/Sportsmanagements/HtmlView.php'
      - 'admin/models/sportsmanagements.php'
      - 'modules/mod_sportsmanagement_ranking/**'
      - '.github/workflows/joomla5-6-site-admin-ranking-batch129.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/views/sportsmanagements/view.html.php
            admin/src/View/Sportsmanagements/HtmlView.php
            admin/models/sportsmanagements.php
            modules/mod_sportsmanagement_ranking/src/Dispatcher/Dispatcher.php
          )

          for file in "${files[@]}"; do
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate XML
        shell: bash
        run: |
          set -euo pipefail

          php -r 'foreach (array_slice($argv, 1) as $file) { if (simplexml_load_file($file) === false) { fwrite(STDERR, "Invalid XML: {$file}\n"); exit(1); } }'             site/settings/default/allplaygrounds.xml             site/settings/default/referees.xml             site/settings/default/ranking.xml             modules/mod_sportsmanagement_ranking/mod_sportsmanagement_ranking.xml             modules/mod_sportsmanagement_ranking/update-server.xml

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          for file in             site/settings/default/allplaygrounds.xml             site/settings/default/referees.xml             site/settings/default/ranking.xml
          do
            grep -Fq 'value="table table-sm"' "$file"

            if grep -Fq 'table-condensed' "$file"; then
              echo "$file regressed to Bootstrap 3 table-condensed." >&2
              exit 1
            fi
          done

          grep -Fq 'default="btn btn-secondary"' site/settings/default/ranking.xml

          admin_bridge=admin/views/sportsmanagements/view.html.php
          admin_native=admin/src/View/Sportsmanagements/HtmlView.php
          admin_model=admin/models/sportsmanagements.php

          grep -Fq 'use Diddipoeler\\Component\\SportsManagement\\Administrator\\View\\Sportsmanagements\\HtmlView;' "$admin_bridge"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewsportsmanagements')" "$admin_bridge"
          grep -Fq 'Native Joomla 5/6 administrator SportsManagement list view.' "$admin_native"
          grep -Fq "\\defined('_JEXEC') or die;" "$admin_model"
          grep -Fq 'SportsManagement native administrator list model could not be loaded.' "$admin_model"

          manifest=modules/mod_sportsmanagement_ranking/mod_sportsmanagement_ranking.xml
          update=modules/mod_sportsmanagement_ranking/update-server.xml
          dispatcher=modules/mod_sportsmanagement_ranking/src/Dispatcher/Dispatcher.php

          grep -Fq '<version>5.6.0</version>' "$manifest"
          grep -Fq 'type="extensionversion" version="5.6.0"' "$manifest"
          grep -Fq 'value="table table-sm"' "$manifest"
          grep -Fq '<version>5.6.0</version>' "$update"
          grep -Fq '<targetplatform name="joomla" version="[56].*" />' "$update"
          grep -Fq '<php_minimum>8.1.0</php_minimum>' "$update"
          grep -Fq 'use Joomla\\CMS\\Application\\SiteApplication;' "$dispatcher"
          grep -Fq "!\$app instanceof SiteApplication || !\$app->isClient('site')" "$dispatcher"

          echo 'Joomla 5/6 batch 129 contracts OK.'
