name: Joomla 5/6 site admin Rounds batch 143

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Rivals/HtmlView.php'
      - 'site/src/View/Playground/HtmlView.php'
      - 'admin/views/rounds/view.html.php'
      - '.github/workflows/joomla5-6-site-admin-rounds-batch143.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/View/Rivals/HtmlView.php'
      - 'site/src/View/Playground/HtmlView.php'
      - 'admin/views/rounds/view.html.php'
      - '.github/workflows/joomla5-6-site-admin-rounds-batch143.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/View/Rivals/HtmlView.php
            site/src/View/Playground/HtmlView.php
            admin/views/rounds/view.html.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Rivals view.' site/src/View/Rivals/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Playground view.' site/src/View/Playground/HtmlView.php

          admin_bridge=admin/views/rounds/view.html.php
          grep -Fq 'SportsManagement native administrator Rounds view could not be loaded.' "$admin_bridge"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewRounds')" "$admin_bridge"

          echo 'Joomla 5/6 batch 143 contracts OK.'
