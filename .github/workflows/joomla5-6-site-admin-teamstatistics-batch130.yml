name: Joomla 5/6 site admin teamstatistics batch 130

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/settings/default/clubs.xml'
      - 'site/settings/default/teams.xml'
      - 'site/settings/default/rivals.xml'
      - 'admin/models/treeto.php'
      - 'admin/models/treetos.php'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/helper.php'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/src/Dispatcher/Dispatcher.php'
      - '.github/workflows/joomla5-6-site-admin-teamstatistics-batch130.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/settings/default/clubs.xml'
      - 'site/settings/default/teams.xml'
      - 'site/settings/default/rivals.xml'
      - 'admin/models/treeto.php'
      - 'admin/models/treetos.php'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/**'
      - '.github/workflows/joomla5-6-site-admin-teamstatistics-batch130.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/models/treeto.php
            admin/models/treetos.php
            modules/mod_sportsmanagement_teamstatistics_counter/helper.php
            modules/mod_sportsmanagement_teamstatistics_counter/src/Dispatcher/Dispatcher.php
          )

          for file in "${files[@]}"; do
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate XML
        shell: bash
        run: |
          set -euo pipefail

          php -r 'foreach (array_slice($argv, 1) as $file) { if (simplexml_load_file($file) === false) { fwrite(STDERR, "Invalid XML: {$file}\n"); exit(1); } }'             site/settings/default/clubs.xml             site/settings/default/teams.xml             site/settings/default/rivals.xml

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          for file in             site/settings/default/clubs.xml             site/settings/default/teams.xml             site/settings/default/rivals.xml
          do
            grep -Fq 'value="table table-sm"' "$file"

            if grep -Fq 'table-condensed' "$file"; then
              echo "$file regressed to Bootstrap 3 table-condensed." >&2
              exit 1
            fi
          done

          grep -Fq "\\defined('_JEXEC') or die;" admin/models/treeto.php
          grep -Fq 'SportsManagement native Treeto model could not be loaded.' admin/models/treeto.php
          grep -Fq "\\defined('_JEXEC') or die;" admin/models/treetos.php
          grep -Fq 'SportsManagement native Treetos model could not be loaded.' admin/models/treetos.php

          helper=modules/mod_sportsmanagement_teamstatistics_counter/helper.php
          dispatcher=modules/mod_sportsmanagement_teamstatistics_counter/src/Dispatcher/Dispatcher.php

          grep -Fq 'use Joomla\CMS\Factory;' "$helper"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$helper"
          grep -Fq 'use Joomla\CMS\Factory;' "$dispatcher"
          grep -Fq 'Factory::getContainer()->get(DatabaseInterface::class)' "$dispatcher"

          echo 'Joomla 5/6 batch 130 contracts OK.'
