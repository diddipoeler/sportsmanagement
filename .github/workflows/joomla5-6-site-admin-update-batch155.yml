name: Joomla 5/6 site admin Update batch 155

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Billardlivegames/HtmlView.php'
      - 'site/src/View/Curve/HtmlView.php'
      - 'site/src/View/Event/HtmlView.php'
      - 'site/src/View/Close/HtmlView.php'
      - 'admin/views/update/view.html.php'
      - 'admin/src/View/Update/HtmlView.php'
      - 'admin/tmpl/update/default.php'
      - '.github/workflows/joomla5-6-site-admin-update-batch155.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/View/Billardlivegames/HtmlView.php'
      - 'site/src/View/Curve/HtmlView.php'
      - 'site/src/View/Event/HtmlView.php'
      - 'site/src/View/Close/HtmlView.php'
      - 'admin/views/update/view.html.php'
      - 'admin/src/View/Update/HtmlView.php'
      - 'admin/tmpl/update/default.php'
      - '.github/workflows/joomla5-6-site-admin-update-batch155.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/View/Billardlivegames/HtmlView.php
            site/src/View/Curve/HtmlView.php
            site/src/View/Event/HtmlView.php
            site/src/View/Close/HtmlView.php
            admin/views/update/view.html.php
            admin/src/View/Update/HtmlView.php
            admin/tmpl/update/default.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Billardlivegames view.' site/src/View/Billardlivegames/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Curve view.' site/src/View/Curve/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Event view.' site/src/View/Event/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Close view.' site/src/View/Close/HtmlView.php

          bridge=admin/views/update/view.html.php
          native=admin/src/View/Update/HtmlView.php
          layout=admin/tmpl/update/default.php

          grep -Fq 'SportsManagement native administrator Update view could not be loaded.' "$bridge"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewUpdate')" "$bridge"
          grep -Fq 'Native Joomla 5/6 administrator SportsManagement Update view.' "$native"
          grep -Fq 'Native Joomla 5/6 administrator SportsManagement Update layout.' "$layout"

          echo 'Joomla 5/6 batch 155 contracts OK.'
