name: Joomla 5/6 site admin Updates batch 154

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/About/HtmlView.php'
      - 'site/src/View/Predictionheading/HtmlView.php'
      - 'site/src/View/Predictionrules/HtmlView.php'
      - 'site/src/View/Uefawertung/HtmlView.php'
      - 'admin/views/updates/view.html.php'
      - 'admin/src/View/Updates/HtmlView.php'
      - 'admin/tmpl/updates/default.php'
      - '.github/workflows/joomla5-6-site-admin-updates-batch154.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/View/About/HtmlView.php'
      - 'site/src/View/Predictionheading/HtmlView.php'
      - 'site/src/View/Predictionrules/HtmlView.php'
      - 'site/src/View/Uefawertung/HtmlView.php'
      - 'admin/views/updates/view.html.php'
      - 'admin/src/View/Updates/HtmlView.php'
      - 'admin/tmpl/updates/default.php'
      - '.github/workflows/joomla5-6-site-admin-updates-batch154.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/View/About/HtmlView.php
            site/src/View/Predictionheading/HtmlView.php
            site/src/View/Predictionrules/HtmlView.php
            site/src/View/Uefawertung/HtmlView.php
            admin/views/updates/view.html.php
            admin/src/View/Updates/HtmlView.php
            admin/tmpl/updates/default.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Native Joomla 5/6 frontend SportsManagement About view.' site/src/View/About/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Predictionheading view.' site/src/View/Predictionheading/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Predictionrules view.' site/src/View/Predictionrules/HtmlView.php
          grep -Fq 'Native Joomla 5/6 frontend SportsManagement Uefawertung view.' site/src/View/Uefawertung/HtmlView.php

          bridge=admin/views/updates/view.html.php
          native=admin/src/View/Updates/HtmlView.php
          layout=admin/tmpl/updates/default.php

          grep -Fq 'SportsManagement native administrator Updates view could not be loaded.' "$bridge"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewUpdates')" "$bridge"
          grep -Fq 'Native Joomla 5/6 administrator SportsManagement Updates view.' "$native"
          grep -Fq 'Native Joomla 5/6 administrator SportsManagement Updates layout.' "$layout"

          echo 'Joomla 5/6 batch 154 contracts OK.'
