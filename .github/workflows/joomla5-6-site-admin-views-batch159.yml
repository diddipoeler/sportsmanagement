name: Joomla 5/6 site admin views batch 159

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/View/Fieldsets/HtmlView.php'
      - 'admin/views/fieldsets/view.html.php'
      - 'admin/src/View/Listheader/HtmlView.php'
      - 'admin/views/listheader/view.html.php'
      - 'site/src/View/Sishandball/HtmlView.php'
      - 'site/views/sishandball/view.html.php'
      - '.github/workflows/joomla5-6-site-admin-views-batch159.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/View/Fieldsets/HtmlView.php'
      - 'admin/views/fieldsets/view.html.php'
      - 'admin/src/View/Listheader/HtmlView.php'
      - 'admin/views/listheader/view.html.php'
      - 'site/src/View/Sishandball/HtmlView.php'
      - 'site/views/sishandball/view.html.php'
      - '.github/workflows/joomla5-6-site-admin-views-batch159.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail

          files=(
            admin/src/View/Fieldsets/HtmlView.php
            admin/views/fieldsets/view.html.php
            admin/src/View/Listheader/HtmlView.php
            admin/views/listheader/view.html.php
            site/src/View/Sishandball/HtmlView.php
            site/views/sishandball/view.html.php
          )

          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
          done

      - name: Validate Joomla 5/6 view bridges
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'Native Joomla 5/6 administrator SportsManagement Fieldsets view.' admin/src/View/Fieldsets/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewFieldsets')" admin/views/fieldsets/view.html.php

          grep -Fq 'Native Joomla 5/6 administrator SportsManagement Listheader view.' admin/src/View/Listheader/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewlistheader')" admin/views/listheader/view.html.php

          grep -Fq 'Native Joomla 5/6 frontend SportsManagement SIS handball view.' site/src/View/Sishandball/HtmlView.php
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewsishandball')" site/views/sishandball/view.html.php
          grep -Fq 'Factory::getContainer()->get(SiteApplication::class)' site/src/View/Sishandball/HtmlView.php
          ! grep -Fq 'Factory::getApplication()' site/src/View/Sishandball/HtmlView.php

          echo 'Joomla 5/6 batch 159 contracts OK.'
