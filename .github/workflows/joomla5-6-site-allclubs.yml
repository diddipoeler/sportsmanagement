name: Joomla 5/6 allclubs site view

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/AllclubsModel.php'
      - 'site/src/View/Allclubs/**'
      - 'site/views/allclubs/**'
      - '.github/workflows/joomla5-6-site-allclubs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'site/src/Model/AllclubsModel.php'
      - 'site/src/View/Allclubs/**'
      - 'site/views/allclubs/**'
      - '.github/workflows/joomla5-6-site-allclubs.yml'

jobs:
  allclubs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint migrated PHP
        run: |
          php -l site/src/Model/AllclubsModel.php
          php -l site/src/View/Allclubs/HtmlView.php
          php -l site/views/allclubs/view.html.php
          php -l site/views/allclubs/tmpl/default.php
          php -l site/views/allclubs/tmpl/default_items.php
      - name: Validate native view contract
        shell: bash
        run: |
          model=site/src/Model/AllclubsModel.php
          view=site/src/View/Allclubs/HtmlView.php
          legacy=site/views/allclubs/view.html.php
          template=site/views/allclubs/tmpl/default.php
          items=site/views/allclubs/tmpl/default_items.php

          grep -Fq 'final class HtmlView extends SportsManagementHtmlView' "$view"
          grep -Fq 'AllclubsModel' "$view"
          grep -Fq "getDocument()->setTitle" "$view"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewallclubs')" "$legacy"
          grep -Fq "document.getElementById('adminForm')" "$template"
          grep -Fq "Factory::getApplication()->getConfig()->get('list_limit', 20)" "$model"

          for field in v.name v.unique_id v.logo_big v.website v.address v.zipcode v.location v.country v.phone v.email; do
            grep -Fq "'${field}'" "$items"
          done

          if grep -E "'c\.(address|zipcode|location|country|phone|email)'|'v\.picture'" "$items"; then
            echo 'Allclubs template uses a sort field that is not exposed by the native model' >&2
            exit 1
          fi

          if grep -E 'Factory::getConfig\(|version_compare\(.*JVERSION|JLoader::|jimport\(|JHtmlSelect::|document\.id\(' "$model" "$view" "$legacy" "$template" "$items"; then
            echo 'Allclubs migration still contains a Joomla 3/4 compatibility path' >&2
            exit 1
          fi
