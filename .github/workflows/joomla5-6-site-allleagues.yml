name: Joomla 5/6 allleagues site view

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/AllleaguesModel.php'
      - 'site/src/View/Allleagues/**'
      - 'site/views/allleagues/**'
      - '.github/workflows/joomla5-6-site-allleagues.yml'
  pull_request:
    branches: [master]
    paths:
      - 'site/src/Model/AllleaguesModel.php'
      - 'site/src/View/Allleagues/**'
      - 'site/views/allleagues/**'
      - '.github/workflows/joomla5-6-site-allleagues.yml'

jobs:
  allleagues:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint migrated PHP
        run: |
          php -l site/src/Model/AllleaguesModel.php
          php -l site/src/View/Allleagues/HtmlView.php
          php -l site/views/allleagues/view.html.php
          php -l site/views/allleagues/tmpl/default.php
          php -l site/views/allleagues/tmpl/default_items.php
      - name: Validate native view contract
        shell: bash
        run: |
          view=site/src/View/Allleagues/HtmlView.php
          legacy=site/views/allleagues/view.html.php
          template=site/views/allleagues/tmpl/default.php

          grep -Fq 'final class HtmlView extends SportsManagementHtmlView' "$view"
          grep -Fq 'AllleaguesModel' "$view"
          grep -Fq "getDocument()->setTitle" "$view"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewallleagues')" "$legacy"
          grep -Fq "document.getElementById('adminForm')" "$template"

          if grep -E 'version_compare\(.*JVERSION|JLoader::|jimport\(|JHtmlSelect::|document\.id\(|->getVar\(' "$view" "$legacy" "$template"; then
            echo 'Allleagues migration still contains a Joomla 3/MooTools compatibility path' >&2
            exit 1
          fi
