name: Joomla 5/6 site all project rounds

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-allprojectrounds:
    name: Native allprojectrounds model/view gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native allprojectrounds path
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/AllprojectroundsModel.php
          model_bridge=site/models/allprojectrounds.php
          view=site/src/View/Allprojectrounds/HtmlView.php
          view_bridge=site/views/allprojectrounds/view.html.php

          for file in "$model" "$model_bridge" "$view" "$view_bridge"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class AllprojectroundsModel extends SportsManagementProjectModel' "$model"
          grep -q "class_alias(AllprojectroundsModel::class, 'sportsmanagementModelallprojectrounds')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewallprojectrounds')" "$view_bridge"

          grep -q 'function getProjectMatches' "$model"
          grep -q 'function getProjectTeamID' "$model"
          grep -q 'function getRoundsColumn' "$model"
          grep -q 'function getMatchPlayers' "$model"
          grep -q 'function getSubstitutes' "$model"
          grep -q 'function getPlayersEvents' "$model"
          grep -q 'getRounds(' "$view"
          grep -q 'getFavTeams()' "$view"

          if grep -E -- 'Factory::getDbo\(|->getDbo\(|jimport\(|JLoader::import\(|\$app->input|Factory::getApplication\(\)->input|sportsmanagementModelProject::|extends sportsmanagementView' \
            "$model" "$view"; then
            echo 'Native allprojectrounds path regressed to a removed/legacy API' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getDbo\(|jimport\(|sportsmanagementModelProject::' "$model_bridge" "$view_bridge"; then
            echo 'Allprojectrounds compatibility bridges must remain thin aliases' >&2
            exit 1
          fi
