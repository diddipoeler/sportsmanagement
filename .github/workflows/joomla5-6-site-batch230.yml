name: Joomla 5/6 site batch 230

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/views/jltournamenttree/view.html.php'
      - 'site/views/matchreport/view.html.php'
      - 'site/views/rankingplayerbillard/view.html.php'
      - '.github/workflows/joomla5-6-site-batch230.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/views/jltournamenttree/view.html.php'
      - 'site/views/matchreport/view.html.php'
      - 'site/views/rankingplayerbillard/view.html.php'
      - '.github/workflows/joomla5-6-site-batch230.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate PHP and required headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/views/jltournamenttree/view.html.php
            site/views/matchreport/view.html.php
            site/views/rankingplayerbillard/view.html.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- 'use Joomla\CMS\Document\HtmlDocument;' "$file"
            grep -Fq -- 'instanceof HtmlDocument' "$file"
          done
          echo 'Joomla 5/6 batch 230 contracts OK.'
