name: Joomla 5/6 site comments query binding batch 414

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/helpers/comments.php'
      - '.github/workflows/joomla5-6-site-comments-query-binding-batch414.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/helpers/comments.php'
      - '.github/workflows/joomla5-6-site-comments-query-binding-batch414.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site comments query binding
        shell: bash
        run: |
          set -euo pipefail
          file=site/helpers/comments.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- "bind(':commentsMatchId', \$matchId, ParameterType::INTEGER)" "$file"
          ! grep -Fq -- "quoteName('m.id') . ' = ' . \$matchId" "$file"
