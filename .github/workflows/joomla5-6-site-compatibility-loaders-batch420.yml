name: Joomla 5/6 site compatibility loaders batch 420

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/matchreport.php'
      - 'site/libraries/sportsmanagement/controller.php'
      - '.github/workflows/joomla5-6-site-compatibility-loaders-batch420.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/matchreport.php'
      - 'site/libraries/sportsmanagement/controller.php'
      - '.github/workflows/joomla5-6-site-compatibility-loaders-batch420.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site compatibility loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/matchreport.php
            site/libraries/sportsmanagement/controller.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
          done
          grep -Fq -- 'is_file($nativeModelFile)' site/models/matchreport.php
          ! grep -Fq -- 'Restricted access' site/libraries/sportsmanagement/controller.php
