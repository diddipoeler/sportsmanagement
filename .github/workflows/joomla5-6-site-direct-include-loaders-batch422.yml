name: Joomla 5/6 site direct include loaders batch 422

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/ical.php'
      - 'site/views/json/view.html.php'
      - '.github/workflows/joomla5-6-site-direct-include-loaders-batch422.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/ical.php'
      - 'site/views/json/view.html.php'
      - '.github/workflows/joomla5-6-site-direct-include-loaders-batch422.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site direct include loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(site/models/ical.php site/views/json/view.html.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'is_file($nativeFile)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done
          grep -Fq -- 'SportsManagementDatabaseResolver.php' site/models/ical.php
          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' site/views/json/view.html.php
