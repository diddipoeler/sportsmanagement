name: Joomla 5/6 native site edit controllers

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-edit-controllers:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native frontend edit controllers
        shell: bash
        run: |
          set -euo pipefail

          dispatcher=site/src/Dispatcher/Dispatcher.php
          edit_match_controller=site/src/Controller/EditmatchController.php
          edit_project_team_view=site/src/View/Editprojectteam/HtmlView.php

          files=(
            site/src/Controller/EditclubController.php
            "$edit_match_controller"
            site/src/Controller/EditpersonController.php
            site/src/Controller/EditprojectteamController.php
            site/src/Controller/EditteamController.php
            site/src/Model/EditclubModel.php
            site/src/Model/EditmatchModel.php
            site/src/Model/EditpersonModel.php
            site/src/Model/EditprojectteamModel.php
            site/src/Model/EditteamModel.php
            site/src/Service/SportsManagementDatabaseResolver.php
            "$edit_project_team_view"
            "$dispatcher"
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq 'final class EditclubController extends FormController' site/src/Controller/EditclubController.php
          grep -Fq 'final class EditmatchController extends FormController' "$edit_match_controller"
          grep -Fq 'final class EditpersonController extends FormController' site/src/Controller/EditpersonController.php
          grep -Fq 'final class EditprojectteamController extends FormController' site/src/Controller/EditprojectteamController.php
          grep -Fq 'final class EditteamController extends FormController' site/src/Controller/EditteamController.php

          grep -Fq 'SportsManagementDatabaseResolver::resolve($joomlaDatabase, $selector)' "$edit_match_controller"
          if grep -Eq 'sportsmanagementHelper|admin/helpers/sportsmanagement\.php|getDBConnection\(' "$edit_match_controller"; then
            echo 'EditmatchController regressed to legacy database helpers.' >&2
            exit 1
          fi

          grep -Fq 'final class EditprojectteamModel extends AdminModel' site/src/Model/EditprojectteamModel.php
          grep -Fq 'public function getTeamInfo(int $projectTeamId): ?object' site/src/Model/EditprojectteamModel.php
          grep -Fq 'final class HtmlView extends SportsManagementHtmlView' "$edit_project_team_view"
          grep -Fq "views/editprojectteam/tmpl'" "$edit_project_team_view"
          grep -Fq '$this->team_info = $model->getTeamInfo((int) $this->item->id);' "$edit_project_team_view"
          grep -Fq "assets/extended/projectteam.xml'" "$edit_project_team_view"

          grep -Fq '$this->checkToken();' site/src/Controller/EditprojectteamController.php
          grep -Fq '$this->editProjectTeamModel()->updItem($data);' site/src/Controller/EditprojectteamController.php

          for task in \
            editclub.apply editclub.save editclub.cancel editclub.load \
            editmatch.applyshortsinglematch editmatch.saveshortsinglematch editmatch.deletesinglematch \
            editmatch.savestats editmatch.cancel editmatch.savereferees editmatch.saverosterbillard \
            editmatch.saveroster editmatch.saveshort \
            editperson.apply editperson.submit editperson.save editperson.cancel \
            editprojectteam.apply editprojectteam.submit editprojectteam.save editprojectteam.cancel \
            editteam.apply editteam.submit editteam.save editteam.cancel; do
            grep -Fiq "'${task}'" "$dispatcher"
          done

          for legacy in \
            site/controllers/editclub.php \
            site/controllers/editmatch.php \
            site/controllers/editperson.php \
            site/controllers/editprojectteam.php \
            site/controllers/editteam.php \
            site/views/editprojectteam/view.html.php; do
            if test -e "$legacy"; then
              echo "Migrated legacy frontend MVC file returned: $legacy" >&2
              exit 1
            fi
          done

          if grep -Eq 'sportsmanagementViewEditprojectteam|sportsmanagementModelProject|sportsmanagementHelper::getExtended' "$edit_project_team_view" site/src/Model/EditprojectteamModel.php; then
            echo 'Editprojectteam native MVC regressed to legacy project/view helpers.' >&2
            exit 1
          fi
