name: Joomla 5/6 site edit club

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-editclub:
    name: Native frontend club edit model gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend club edit model
        shell: bash
        run: |
          set -euo pipefail

          bridge=site/models/editclub.php
          native=site/src/Model/EditclubModel.php

          php -l "$bridge"
          php -l "$native"

          grep -q 'Diddipoeler\\Component\\SportsManagement\\Site\\Model' "$native"
          grep -q 'final class EditclubModel extends AdminModel' "$native"
          grep -q 'getInput()' "$native"
          grep -q "JPATH_COMPONENT_ADMINISTRATOR . '/forms'" "$native"
          grep -q "\$app->getUserState" "$native"
          grep -Fq 'foreach ((array)' "$native"
          grep -Fq "\$data['request'] ?? []" "$native"
          grep -q 'new ClubTable' "$native"

          grep -q 'class_alias(EditclubModel::class' "$bridge"
          grep -q "src/Model/EditclubModel.php" "$bridge"

          if grep -E -- "Factory::getApplication\([^)]*'site'|Factory::getApplication\(\)->input|\$app->input|/models/forms|Factory::getDbo\(|Table::getInstance\(|jimport\(|JLoader::import\(" "$native" "$bridge"; then
            echo 'Frontend club edit path regressed to a Joomla API removed from the Joomla 5/6 path' >&2
            exit 1
          fi

          if grep -q 'class sportsmanagementModelEditClub' "$bridge"; then
            echo 'Legacy editclub bridge must remain an alias, not an active legacy model' >&2
            exit 1
          fi
