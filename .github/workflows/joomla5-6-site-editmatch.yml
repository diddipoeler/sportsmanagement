name: Joomla 5/6 site edit match

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-editmatch:
    name: Frontend match edit native model gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend match edit migration
        shell: bash
        run: |
          set -euo pipefail

          bridge=site/models/editmatch.php
          model=site/src/Model/EditmatchModel.php
          read_service=site/src/Service/MatchReadService.php
          write_bridge=site/src/Service/MatchWriteService.php
          write_service=admin/src/Service/MatchWriteService.php
          table=admin/src/Table/MatchTable.php

          for file in "$bridge" "$model" "$read_service" "$write_bridge" "$write_service" "$table"; do
            php -l "$file"
          done

          grep -q 'namespace Diddipoeler\\Component\\SportsManagement\\Site\\Model;' "$model"
          grep -q 'final class EditmatchModel extends AdminModel' "$model"
          grep -q 'MatchWriteService' "$model"
          grep -q 'MailerFactoryInterface' "$model"
          grep -q 'getInput()' "$model"
          grep -q 'new MatchTable' "$model"
          grep -q "JPATH_COMPONENT_ADMINISTRATOR . '/forms'" "$model"
          grep -q '#__sportsmanagement_match_single' "$model"
          grep -q '#__sportsmanagement_project_position' "$model"
          grep -q 'getProjectPositionOptions' "$model"
          grep -q 'notifyNewRefereeAssignments' "$model"

          grep -q 'class_alias(AdministratorMatchWriteService::class' "$write_bridge"
          grep -q 'final class MatchWriteService' "$write_service"
          grep -q 'transactionStart' "$write_service"
          grep -q 'transactionCommit' "$write_service"
          grep -q 'transactionRollback' "$write_service"
          grep -q '#__sportsmanagement_match_statistic' "$write_service"
          grep -q '#__sportsmanagement_match_staff_statistic' "$write_service"
          grep -q '#__sportsmanagement_match_player' "$write_service"
          grep -q '#__sportsmanagement_match_staff' "$write_service"
          grep -q '#__sportsmanagement_match_referee' "$write_service"
          grep -q 'preg_match' "$write_service"
          grep -q 'posid.*pposid' "$write_service"

          grep -q 'class_alias(EditmatchModel::class' "$bridge"
          grep -q 'final class MatchTable extends SportsManagementTable' "$table"

          active=("$bridge" "$model" "$read_service" "$write_bridge" "$write_service" "$table")
          if grep -E -- "Factory::getApplication\(\)->input|\$app->input|Factory::getApplication\([^)]*'site'|Factory::getUser\(|Factory::getDbo\(|Factory::getDBO\(|Factory::getMailer\(|Factory::getConfig\(|Table::getInstance\(|BaseDatabaseModel::getInstance|JLoader::import\(|jimport\(|sportsmanagementModelMatch|ereg\(" "${active[@]}"; then
            echo 'Frontend match edit native path regressed to a removed/deprecated Joomla or PHP API' >&2
            exit 1
          fi
