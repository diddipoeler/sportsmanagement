name: Joomla 5/6 site editor dependency loaders batch 442

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/editteam.php'
      - 'site/models/editperson.php'
      - '.github/workflows/joomla5-6-site-editor-dependency-loaders-batch442.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/editteam.php'
      - 'site/models/editperson.php'
      - '.github/workflows/joomla5-6-site-editor-dependency-loaders-batch442.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site editor dependency loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(site/models/editteam.php site/models/editperson.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'SportsManagementSiteApplicationResolver.php' "$file"
            grep -Fq -- 'SportsManagementDatabaseResolver.php' "$file"
            grep -Fq -- 'SportsManagementTable.php' "$file"
            grep -Fq -- 'is_file($nativeFile)' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
            grep -Fq -- 'class_alias(' "$file"
          done
