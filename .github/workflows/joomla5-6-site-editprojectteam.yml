name: Joomla 5/6 project team table and editor

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/ProjectteamModel.php'
      - 'admin/src/Table/ProjectteamTable.php'
      - 'admin/tables/projectteam.php'
      - 'admin/models/fields/imageselect.php'
      - 'site/src/Model/EditprojectteamModel.php'
      - 'site/models/editprojectteam.php'
      - 'site/models/forms/editprojectteam.xml'
      - '.github/workflows/joomla5-6-site-editprojectteam.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/ProjectteamModel.php'
      - 'admin/src/Table/ProjectteamTable.php'
      - 'admin/tables/projectteam.php'
      - 'admin/models/fields/imageselect.php'
      - 'site/src/Model/EditprojectteamModel.php'
      - 'site/models/editprojectteam.php'
      - 'site/models/forms/editprojectteam.xml'
      - '.github/workflows/joomla5-6-site-editprojectteam.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint project team slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Model/ProjectteamModel.php
            admin/src/Table/ProjectteamTable.php
            admin/tables/projectteam.php
            admin/models/fields/imageselect.php
            site/src/Model/EditprojectteamModel.php
            site/models/editprojectteam.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          php -r '$xml=simplexml_load_file("site/models/forms/editprojectteam.xml"); if (!$xml) { exit(1); }'

      - name: Validate Joomla 5/6 project team contracts
        shell: bash
        run: |
          set -euo pipefail

          grep -Fq 'final class ProjectteamTable extends SportsManagementTable' admin/src/Table/ProjectteamTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_project_team', 'id', \$db)" admin/src/Table/ProjectteamTable.php
          grep -Fq "class_alias(ProjectteamTable::class, 'sportsmanagementTableProjectteam')" admin/tables/projectteam.php
          grep -Fq 'new ProjectteamTable($this->getDatabase())' admin/src/Model/ProjectteamModel.php

          grep -Fq 'final class EditprojectteamModel extends AdminModel' site/src/Model/EditprojectteamModel.php
          grep -Fq 'new ProjectteamTable($this->getDatabase())' site/src/Model/EditprojectteamModel.php
          grep -Fq 'transactionStart()' site/src/Model/EditprojectteamModel.php
          grep -Fq 'transactionCommit()' site/src/Model/EditprojectteamModel.php
          grep -Fq 'getInput()->getInt' site/src/Model/EditprojectteamModel.php
          grep -Fq "class_alias(EditprojectteamModel::class, 'sportsmanagementModelEditprojectteam')" site/models/editprojectteam.php
          grep -Fq 'require_once $helperFile' admin/models/fields/imageselect.php

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Table::getInstance\(|->input->'
          if grep -ER "$legacy_re" \
            admin/src/Model/ProjectteamModel.php \
            admin/src/Table/ProjectteamTable.php \
            admin/tables/projectteam.php \
            admin/models/fields/imageselect.php \
            site/src/Model/EditprojectteamModel.php \
            site/models/editprojectteam.php; then
            echo 'Project-team slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
