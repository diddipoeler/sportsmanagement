name: Joomla 5/6 site edit team

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-editteam:
    name: Native frontend team edit MVC gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate frontend team edit migration
        shell: bash
        run: |
          set -euo pipefail

          controller_bridge=site/controllers/editteam.php
          controller=site/src/Controller/EditteamController.php
          model_bridge=site/models/editteam.php
          model=site/src/Model/EditteamModel.php
          table=admin/src/Table/TeamTable.php
          form=site/models/forms/editteam.xml
          view_bridge=site/views/editteam/view.html.php
          view=site/src/View/Editteam/HtmlView.php
          template=site/views/editteam/tmpl/default.php
          asset=site/assets/js/editteam.js
          extended_form=admin/assets/extended/team.xml

          for file in "$controller_bridge" "$controller" "$model_bridge" "$model" "$view_bridge" "$view" "$template" "$table"; do
            php -l "$file"
          done
          node --check "$asset"
          test -f "$form"
          test -f "$extended_form"

          grep -q 'namespace Diddipoeler\\Component\\SportsManagement\\Site\\Controller;' "$controller"
          grep -q 'final class EditteamController extends FormController' "$controller"
          grep -Fq '$this->checkToken();' "$controller"
          grep -q 'getInput()' "$controller"
          grep -Fq "\$this->getModel('Editteam')" "$controller"
          grep -q 'class_alias(EditteamController::class' "$controller_bridge"

          grep -q 'namespace Diddipoeler\\Component\\SportsManagement\\Site\\Model;' "$model"
          grep -q 'final class EditteamModel extends AdminModel' "$model"
          grep -q 'new TeamTable' "$model"
          grep -q "models/forms" "$model"
          grep -q "models/fields" "$model"
          grep -Fq 'foreach ((array) ($data['"'"'request'"'"'] ?? [])' "$model"
          grep -q 'class_alias(EditteamModel::class' "$model_bridge"

          grep -q 'namespace Diddipoeler\\Component\\SportsManagement\\Site\\View\\Editteam;' "$view"
          grep -q 'final class HtmlView extends SportsManagementHtmlView' "$view"
          grep -q "views/editteam/tmpl" "$view"
          grep -q 'new Registry' "$view"
          grep -q 'Form::getInstance' "$view"
          grep -q 'assets/extended/team.xml' "$view"
          grep -q "useScript('form.validate')" "$view"
          grep -q 'registerAndUseScript' "$view"
          grep -q 'assets/js/editteam.js' "$view"
          grep -q 'class_alias(HtmlView::class' "$view_bridge"

          grep -q 'data-jsm-editteam-form' "$template"
          grep -q 'class="form-validate"' "$template"
          grep -q 'data-jsm-task="editteam.apply"' "$template"
          grep -q 'data-jsm-task="editteam.save"' "$template"
          grep -q 'data-jsm-task="editteam.cancel"' "$template"
          grep -q '$this->projectId' "$template"
          grep -q '$this->teamId' "$template"
          grep -q '$this->projectTeamId' "$template"
          grep -q 'Joomla.submitform' "$asset"
          grep -q 'document.formvalidator' "$asset"

          active=("$controller_bridge" "$controller" "$model_bridge" "$model" "$view_bridge" "$view" "$template" "$asset")
          if grep -E -- 'Factory::getApplication\(\)->input|\$app->input|Factory::getApplication\([^)]*site|Table::getInstance\(|Session::checkToken|JLoader::import\(|jimport\(|BaseDatabaseModel::getInstance|sportsmanagementHelper|document\.id\(|jQuery\(' "${active[@]}"; then
            echo 'Frontend team edit path regressed to a legacy Joomla API' >&2
            exit 1
          fi

          if grep -E -- 'extends sportsmanagementView|sportsmanagementHelper::getExtended' "$view"; then
            echo 'Native editteam view regressed to the legacy view/helper runtime' >&2
            exit 1
          fi

          if grep -Ei -- 'on(click|change)=' "$template" || grep -E -- '<script[ >]' "$template"; then
            echo 'Frontend team edit template contains inline JavaScript again' >&2
            exit 1
          fi

          if grep -E -- 'class sportsmanagementControllereditteam|class sportsmanagementModelEditteam|class sportsmanagementViewEditteam' "$controller_bridge" "$model_bridge" "$view_bridge"; then
            echo 'Legacy editteam MVC bridges must remain passive aliases' >&2
            exit 1
          fi
