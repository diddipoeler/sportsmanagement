name: Joomla 5/6 site globalviews migration gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/globalviews/default_backbutton.php'
      - 'site/tmpl/globalviews/default_debug.php'
      - 'site/tmpl/globalviews/default_no_tabs.php'
      - 'site/tmpl/globalviews/default_projectheading.php'
      - 'site/tmpl/globalviews/default_sectionheader.php'
      - 'site/tmpl/globalviews/default_selectround.php'
      - 'site/assets/js/backbutton.js'
      - 'site/assets/js/selectround.js'
      - '.github/workflows/joomla5-6-site-globalviews.yml'
  pull_request:
    branches: [master]
    paths:
      - 'site/tmpl/globalviews/default_backbutton.php'
      - 'site/tmpl/globalviews/default_debug.php'
      - 'site/tmpl/globalviews/default_no_tabs.php'
      - 'site/tmpl/globalviews/default_projectheading.php'
      - 'site/tmpl/globalviews/default_sectionheader.php'
      - 'site/tmpl/globalviews/default_selectround.php'
      - 'site/assets/js/backbutton.js'
      - 'site/assets/js/selectround.js'
      - '.github/workflows/joomla5-6-site-globalviews.yml'

jobs:
  native-globalviews:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native shared site views
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            site/tmpl/globalviews/default_backbutton.php \
            site/tmpl/globalviews/default_debug.php \
            site/tmpl/globalviews/default_no_tabs.php \
            site/tmpl/globalviews/default_projectheading.php \
            site/tmpl/globalviews/default_sectionheader.php \
            site/tmpl/globalviews/default_selectround.php; do
            test -f "$file"
            php -l "$file"
          done

          for file in site/assets/js/backbutton.js site/assets/js/selectround.js; do
            test -f "$file"
            node --check "$file"
          done

          grep -Fq 'registerAndUseScript(' site/tmpl/globalviews/default_backbutton.php
          grep -Fq 'data-jsm-back-button' site/tmpl/globalviews/default_backbutton.php
          grep -Fq '<details' site/tmpl/globalviews/default_debug.php
          grep -Fq '<summary' site/tmpl/globalviews/default_debug.php
          grep -Fq 'text-start' site/tmpl/globalviews/default_projectheading.php
          grep -Fq 'text-end' site/tmpl/globalviews/default_projectheading.php
          grep -Fq '$input = $app->getInput();' site/tmpl/globalviews/default_sectionheader.php
          grep -Fq "$view = $input->getCmd('view');" site/tmpl/globalviews/default_sectionheader.php
          grep -Fq 'data-jsm-selectround' site/tmpl/globalviews/default_selectround.php
          grep -Fq 'registerAndUseScript(' site/tmpl/globalviews/default_selectround.php

          if grep -E -- 'javascript:|onclick=' site/tmpl/globalviews/default_backbutton.php; then
            echo 'Back button regressed to inline JavaScript' >&2
            exit 1
          fi

          if grep -E -- "bootstrap\.(framework|startAccordion|addSlide|endSlide|endAccordion)" site/tmpl/globalviews/default_debug.php; then
            echo 'Debug globalview regressed to Bootstrap JavaScript accordion helpers' >&2
            exit 1
          fi

          if grep -Fq 'col-xs-' site/tmpl/globalviews/default_no_tabs.php; then
            echo 'No-tabs globalview regressed to Bootstrap 3 col-xs classes' >&2
            exit 1
          fi

          if grep -E -- 'text-left|text-right|align="right"' site/tmpl/globalviews/default_projectheading.php; then
            echo 'Project heading regressed to Bootstrap 3 or obsolete alignment markup' >&2
            exit 1
          fi

          if grep -F -- '->input' site/tmpl/globalviews/default_sectionheader.php || \
             grep -Fq 'getVar(' site/tmpl/globalviews/default_sectionheader.php; then
            echo 'Section header regressed to legacy application input access' >&2
            exit 1
          fi

          if grep -E -- 'onchange=|style="float:right' site/tmpl/globalviews/default_selectround.php; then
            echo 'Round selector regressed to inline behavior or layout styles' >&2
            exit 1
          fi
