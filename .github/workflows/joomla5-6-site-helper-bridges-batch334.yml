name: Joomla 5/6 site helper bridges batch 334

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/helpers/html.php'
      - 'site/models/curve.php'
      - 'site/models/eventsranking.php'
      - '.github/workflows/joomla5-6-site-helper-bridges-batch334.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/helpers/html.php'
      - 'site/models/curve.php'
      - 'site/models/eventsranking.php'
      - '.github/workflows/joomla5-6-site-helper-bridges-batch334.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site helper and bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(site/helpers/html.php site/models/curve.php site/models/eventsranking.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
          grep -Fq -- 'throw new \\RuntimeException' site/models/curve.php
          grep -Fq -- 'throw new \\RuntimeException' site/models/eventsranking.php
