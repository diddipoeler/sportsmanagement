name: Joomla 5/6 native site image handler

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  imagehandler:
    name: Native site image selector boundary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint image handler slice
        shell: bash
        run: |
          files=(
            site/src/Helper/ImageSelectHelper.php
            site/src/Model/ImagehandlerModel.php
            site/src/View/Imagehandler/HtmlView.php
            site/src/Controller/ImagehandlerController.php
            site/src/Dispatcher/Dispatcher.php
            site/models/imagehandler.php
            site/controllers/imagehandler.php
            site/views/imagehandler/tmpl/default.php
            site/views/imagehandler/tmpl/default_image.php
            site/views/imagehandler/tmpl/upload.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test ! -f site/views/imagehandler/view.html.php

      - name: Enforce native read and write paths
        shell: bash
        run: |
          model=site/src/Model/ImagehandlerModel.php
          view=site/src/View/Imagehandler/HtmlView.php
          controller=site/src/Controller/ImagehandlerController.php
          dispatcher=site/src/Dispatcher/Dispatcher.php
          helper=site/src/Helper/ImageSelectHelper.php
          template=site/views/imagehandler/tmpl/default.php

          grep -q "final class ImagehandlerModel" "$model"
          grep -q "normaliseFolder" "$model"
          grep -q "str_starts_with" "$model"
          grep -q "getimagesize" "$model"
          grep -q "final class HtmlView" "$view"
          grep -q "ImageSelectHelper::getFolder" "$view"
          grep -q "Session::checkToken('post')" "$controller"
          grep -q "Session::checkToken('get')" "$controller"
          grep -q "imageBaseDirectory" "$controller"
          grep -q "normaliseImageName" "$controller"
          grep -q "ImageSelectHelper::check" "$controller"
          grep -q "imagehandler.upload" "$dispatcher"
          grep -q "imagehandler.delete" "$dispatcher"
          grep -q 'name="task" value="display"' "$template"

          if grep -E "Factory::getURI|Factory::getApplication\(\)->input|JResponse::|jimport\(|behavior\.framework|behavior\.mootools" "$model" "$view" "$controller" "$helper" "$template"; then
            echo "Native image handler slice contains a Joomla 3/4 compatibility path" >&2
            exit 1
          fi

          if grep -q 'imagehandler.select' "$template"; then
            echo "Image selector search form routes to the removed select task" >&2
            exit 1
          fi

      - name: Enforce legacy bridge boundary
        shell: bash
        run: |
          model_bridge=site/models/imagehandler.php
          controller_bridge=site/controllers/imagehandler.php

          grep -q "class_alias(ImagehandlerModel::class, 'sportsmanagementModelImagehandler')" "$model_bridge"
          grep -q "class_alias(ImagehandlerController::class, 'sportsmanagementControllerImagehandler')" "$controller_bridge"

          if grep -E "BaseDatabaseModel|Factory::getURI|Factory::getApplication\(\)->input|JResponse::|jimport\(|Folder::files|getimagesize" "$model_bridge"; then
            echo "Image handler compatibility files contain legacy implementation logic" >&2
            exit 1
          fi
