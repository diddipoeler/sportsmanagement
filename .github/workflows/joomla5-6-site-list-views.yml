name: Joomla 5/6 native site list views

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/src/View/Allpersons/**'
      - 'site/src/View/Allplaygrounds/**'
      - 'site/src/View/Allteams/**'
      - 'site/src/View/Allleagues/**'
      - 'site/src/Model/AllpersonsModel.php'
      - 'site/src/Model/AllplaygroundsModel.php'
      - 'site/src/Model/AllteamsModel.php'
      - 'site/src/Model/AllleaguesModel.php'
      - 'site/src/Helper/CountryPresentationHelper.php'
      - 'site/views/allpersons/**'
      - 'site/views/allplaygrounds/**'
      - 'site/views/allteams/**'
      - 'site/views/allleagues/**'
      - '.github/workflows/joomla5-6-site-list-views.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'site/src/View/Allpersons/**'
      - 'site/src/View/Allplaygrounds/**'
      - 'site/src/View/Allteams/**'
      - 'site/src/View/Allleagues/**'
      - 'site/src/Model/AllpersonsModel.php'
      - 'site/src/Model/AllplaygroundsModel.php'
      - 'site/src/Model/AllteamsModel.php'
      - 'site/src/Model/AllleaguesModel.php'
      - 'site/src/Helper/CountryPresentationHelper.php'
      - 'site/views/allpersons/**'
      - 'site/views/allplaygrounds/**'
      - 'site/views/allteams/**'
      - 'site/views/allleagues/**'
      - '.github/workflows/joomla5-6-site-list-views.yml'

jobs:
  native-site-list-views:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native site list stack
        shell: bash
        run: |
          set -euo pipefail

          files=(
            site/src/View/Allpersons/HtmlView.php
            site/src/Model/AllpersonsModel.php
            site/views/allpersons/tmpl/default.php
            site/src/View/Allplaygrounds/HtmlView.php
            site/src/Model/AllplaygroundsModel.php
            site/views/allplaygrounds/tmpl/default.php
            site/src/View/Allteams/HtmlView.php
            site/src/Model/AllteamsModel.php
            site/views/allteams/tmpl/default.php
            site/src/View/Allleagues/HtmlView.php
            site/src/Model/AllleaguesModel.php
            site/views/allleagues/tmpl/default.php
            site/src/Helper/CountryPresentationHelper.php
          )

          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

          test ! -e site/views/allpersons/view.html.php
          test ! -e site/views/allplaygrounds/view.html.php
          test ! -e site/views/allteams/view.html.php
          test ! -e site/views/allleagues/view.html.php

      - name: Validate native site list contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          contracts = {
              'allpersons': {
                  'class': 'Allpersons',
                  'model': 'AllpersonsModel',
                  'title': 'COM_SPORTSMANAGEMENT_ALLPERSONS_PAGE_TITLE',
              },
              'allplaygrounds': {
                  'class': 'Allplaygrounds',
                  'model': 'AllplaygroundsModel',
                  'title': 'COM_SPORTSMANAGEMENT_ALLPLAYGROUNDS_PAGE_TITLE',
              },
              'allteams': {
                  'class': 'Allteams',
                  'model': 'AllteamsModel',
                  'title': 'COM_SPORTSMANAGEMENT_ALLTEAMS_PAGE_TITLE',
              },
              'allleagues': {
                  'class': 'Allleagues',
                  'model': 'AllleaguesModel',
                  'title': 'COM_SPORTSMANAGEMENT_ALLLEAGUES_PAGE_TITLE',
              },
          }

          for view, contract in contracts.items():
              native = Path(f"site/src/View/{contract['class']}/HtmlView.php")
              text = native.read_text(encoding='utf-8')
              expected = [
                  f"namespace Diddipoeler\\Component\\SportsManagement\\Site\\View\\{contract['class']};",
                  'final class HtmlView extends SportsManagementHtmlView',
                  f"instanceof {contract['model']}",
                  'tmpl/globalviews',
                  contract['title'],
                  'getPagination()',
                  'buildFilterLists(',
                  'CountryPresentationHelper::options($model->getDatabase())',
                  "'select.genericlist'",
              ]

              for needle in expected:
                  if needle not in text:
                      raise SystemExit(f"{native}: missing native contract: {needle}")

              if 'class sportsmanagementView' in text or 'extends sportsmanagementView' in text:
                  raise SystemExit(f"{native}: regressed to a global legacy view class")
              if 'Factory::getContainer()' in text:
                  raise SystemExit(f"{native}: regressed to the static Factory container")

          allpersons = Path('site/src/View/Allpersons/HtmlView.php').read_text(encoding='utf-8')
          for needle in ('public array $columns = [];', '$this->columns = $model->columns;'):
              if needle not in allpersons:
                  raise SystemExit(f"Allpersons column contract missing: {needle}")

          helper = Path('site/src/Helper/CountryPresentationHelper.php').read_text(encoding='utf-8')
          if '$app->getContainer()->get(DatabaseInterface::class)' not in helper:
              raise SystemExit('Country presentation helper does not resolve the database from the application container')
          if 'Factory::getContainer()' in helper:
              raise SystemExit('Country presentation helper regressed to the static Factory container')

          print('Native site list contracts OK')
          PY
