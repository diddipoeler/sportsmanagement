name: Joomla 5/6 site match read service

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-match-read:
    name: Match read service gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native match read service
        shell: bash
        run: |
          set -euo pipefail

          service=site/src/Service/MatchReadService.php
          php -l "$service"

          grep -q 'namespace Diddipoeler\\Component\\SportsManagement\\Site\\Service;' "$service"
          grep -q 'final class MatchReadService' "$service"
          grep -q 'DatabaseInterface' "$service"
          grep -q 'getSingleMatches' "$service"
          grep -q 'getMatchRelations' "$service"
          grep -q 'getEvents' "$service"
          grep -q 'getReferees' "$service"

          if grep -E -- 'Factory::getDbo|Factory::getDBO|Factory::getApplication\(\)->input|\$app->input|JLoader::import|BaseDatabaseModel::getInstance|->disconnect\(' "$service"; then
            echo 'Match read service contains a legacy Joomla database or MVC API' >&2
            exit 1
          fi
