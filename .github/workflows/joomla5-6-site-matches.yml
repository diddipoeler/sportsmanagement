name: Joomla 5/6 native site match actions

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-matches:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native edit-match task dispatch and data service
        shell: bash
        run: |
          set -euo pipefail

          controller=site/src/Controller/MatchesController.php
          service=site/src/Service/MatchMutationService.php
          resolver=site/src/Service/SportsManagementDatabaseResolver.php
          dispatcher=site/src/Dispatcher/Dispatcher.php
          client=site/assets/js/editmatch.js

          for file in "$controller" "$service" "$resolver" "$dispatcher"; do
            test -f "$file"
            php -l "$file"
          done

          grep -Fq 'final class MatchesController extends BaseController' "$controller"
          grep -Fq 'final class MatchMutationService' "$service"
          grep -Fq 'SportsManagementDatabaseResolver::resolve($joomlaDatabase, 0)' "$controller"

          for method in saveevent savesubst removeSubst savecomment removeEvent removeCommentary; do
            grep -Fq "function ${method}(" "$controller"
          done

          for method in saveEvent saveSubstitution removeSubstitution saveComment deleteEvent deleteCommentary; do
            grep -Fq "function ${method}(" "$service"
          done

          for task in \
            matches.saveevent \
            matches.savesubst \
            matches.removesubst \
            matches.savecomment \
            matches.removeevent \
            matches.removecommentary; do
            grep -Fiq "'${task}'" "$dispatcher"
          done

          # The existing browser contract stays unchanged while dispatch and
          # mutations move to namespaced Joomla classes.
          grep -Fq 'task=matches.saveevent' "$client"
          grep -Fq 'task=matches.savesubst' "$client"
          grep -Fq 'task=matches.removeSubst' "$client"
          grep -Fq 'task=matches.savecomment' "$client"
          grep -Fq 'task=matches.removeCommentary' "$client"

          # Preserve the historical storage contracts. Substitutions use the
          # resolved SportsManagement database; event/comment data uses Joomla DB.
          grep -Fq '#__sportsmanagement_match_player' "$service"
          grep -Fq '#__sportsmanagement_match_event' "$service"
          grep -Fq '#__sportsmanagement_match_commentary' "$service"
          grep -Fq '#__sportsmanagement_match_statistic' "$service"
          grep -Fq 'private readonly DatabaseInterface $joomlaDatabase' "$service"
          grep -Fq 'private readonly DatabaseInterface $sportsDatabase' "$service"

          # No legacy controller, model, helper bootstrap or manual DB disconnect
          # may return to the native match-action path.
          if grep -Eq 'LegacyBootstrap|sportsmanagementModelMatch|sportsmanagementControllermatches|site/controllers/matches\.php|site/sportsmanagement\.php|admin/models/match\.php' "$controller" "$service"; then
            echo 'Native match actions regressed to legacy controller/model/bootstrap code.' >&2
            exit 1
          fi

          if grep -Eq 'sportsmanagementHelper|Factory::getDbo|->disconnect\(' "$service"; then
            echo 'Native match mutation service regressed to legacy database APIs.' >&2
            exit 1
          fi
