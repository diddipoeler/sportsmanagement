name: Joomla 5/6 site model migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-models:
    name: Native site model bridge checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native site model bridges
        shell: bash
        run: |
          set -euo pipefail

          site_model_pairs=(
            'AboutModel|about|sportsmanagementModelAbout|SportsManagementModel'
            'AllclubsModel|allclubs|sportsmanagementModelallclubs|SportsManagementListModel'
            'AllleaguesModel|allleagues|sportsmanagementModelallleagues|SportsManagementListModel'
            'AllpersonsModel|allpersons|sportsmanagementModelallpersons|SportsManagementListModel'
            'AllplaygroundsModel|allplaygrounds|sportsmanagementModelallplaygrounds|SportsManagementListModel'
            'AllteamsModel|allteams|sportsmanagementModelallteams|SportsManagementListModel'
            'ClubsModel|clubs|sportsmanagementModelClubs|SportsManagementProjectModel'
            'EventModel|event|sportsmanagementModelEvent|SportsManagementModel'
            'HitlistModel|hitlist|sportsmanagementModelhitlist|SportsManagementModel'
            'IcalModel|ical|sportsmanagementModelical|SportsManagementProjectModel'
            'JsonfeedModel|jsonfeed|sportsmanagementModelJSONFeed|SportsManagementModel'
            'PersonModel|person|sportsmanagementModelPerson|SportsManagementProjectModel'
            'PlaygroundModel|playground|sportsmanagementModelPlayground|SportsManagementProjectModel'
            'PredictionrulesModel|predictionrules|sportsmanagementModelPredictionRules|SportsManagementPredictionModel'
            'RefereeModel|referee|sportsmanagementModelReferee|SportsManagementProjectModel'
            'RefereesModel|referees|sportsmanagementModelReferees|SportsManagementProjectModel'
            'ResultsrankingModel|resultsranking|sportsmanagementModelResultsranking|SportsManagementProjectModel'
            'ScoresheetModel|scoresheet|sportsmanagementModelScoresheet|SportsManagementProjectModel'
            'TeamsModel|teams|sportsmanagementModelTeams|SportsManagementProjectModel'
          )

          site_view_pairs=(
            'Predictionheading|predictionheading|sportsmanagementViewPredictionHeading|SportsManagementPredictionHtmlView'
            'Predictionrules|predictionrules|sportsmanagementViewPredictionRules|SportsManagementPredictionHtmlView'
          )

          prediction_base_files=(
            site/src/Model/SportsManagementPredictionModel.php
            site/src/Model/SportsManagementPredictionReadModel.php
          )

          legacy_prediction_context_files=(
            site/models/predictionuser.php
          )

          native_models=()
          legacy_bridges=()

          for pair in "${site_model_pairs[@]}"; do
            IFS='|' read -r class legacy_file legacy_class base_class <<< "$pair"
            native_file="site/src/Model/${class}.php"
            bridge_file="site/models/${legacy_file}.php"

            test -f "$native_file"
            test -f "$bridge_file"
            grep -q "class ${class} extends ${base_class}" "$native_file"
            grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge_file"

            native_models+=("$native_file")
            legacy_bridges+=("$bridge_file")
          done

          native_views=()
          legacy_view_bridges=()

          for pair in "${site_view_pairs[@]}"; do
            IFS='|' read -r view legacy_dir legacy_class base_class <<< "$pair"
            native_file="site/src/View/${view}/HtmlView.php"
            bridge_file="site/views/${legacy_dir}/view.html.php"

            test -f "$native_file"
            test -f "$bridge_file"
            grep -q "class HtmlView extends ${base_class}" "$native_file"
            grep -q "class_alias(HtmlView::class, '${legacy_class}')" "$bridge_file"

            native_views+=("$native_file")
            legacy_view_bridges+=("$bridge_file")
          done

          model_lint_files=(
            "${native_models[@]}"
            "${legacy_bridges[@]}"
            "${prediction_base_files[@]}"
            "${legacy_prediction_context_files[@]}"
            site/src/Model/SportsManagementModel.php
            site/src/Model/SportsManagementProjectModel.php
            site/src/Model/SportsManagementListModel.php
          )

          view_lint_files=(
            "${native_views[@]}"
            "${legacy_view_bridges[@]}"
            site/src/View/SportsManagementHtmlView.php
            site/src/View/SportsManagementPredictionHtmlView.php
          )

          for file in "${model_lint_files[@]}" "${view_lint_files[@]}"; do
            php -l "$file"
          done

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|jimport\(|JLoader::import\(' "${model_lint_files[@]}"; then
            echo "Native site model bridge regressed to a removed Joomla compatibility API" >&2
            exit 1
          fi

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->getErrorMsg\(|jimport\(|JLoader::import\(|\$this->app->input|\$app->input' "${view_lint_files[@]}"; then
            echo "Native site view bridge regressed to a removed Joomla compatibility API" >&2
            exit 1
          fi

          dependency_files=("${native_models[@]}" "${prediction_base_files[@]}")
          if grep -E -- 'components\.com_sportsmanagement\.models|extends \\sportsmanagementModel' "${dependency_files[@]}"; then
            echo "Native site model depends on a legacy model implementation" >&2
            exit 1
          fi

          grep -q 'function getAbout' site/src/Model/AboutModel.php
          grep -q 'sportsmanagementHelper::getVersion' site/src/Model/AboutModel.php
          grep -q 'function getListQuery' site/src/Model/AllclubsModel.php
          grep -q 'sports_type' site/src/Model/AllclubsModel.php
          grep -q 'function getListQuery' site/src/Model/AllleaguesModel.php
          grep -q 'function getCurrentSeasonIds' site/src/Model/AllleaguesModel.php
          grep -q 'function getListQuery' site/src/Model/AllpersonsModel.php
          grep -q 'SELECTABLE_COLUMNS' site/src/Model/AllpersonsModel.php
          grep -q 'function normaliseSelectColumns' site/src/Model/AllpersonsModel.php
          grep -q 'function getListQuery' site/src/Model/AllplaygroundsModel.php
          grep -q 'use_current_season' site/src/Model/AllplaygroundsModel.php
          grep -q 'function getListQuery' site/src/Model/AllteamsModel.php
          grep -q 'use_current_season' site/src/Model/AllteamsModel.php
          grep -q 'public static int $projectid' site/src/Model/ClubsModel.php
          grep -q 'public static int $divisionid' site/src/Model/ClubsModel.php
          grep -q 'function getClubs($ordering = null)' site/src/Model/ClubsModel.php
          grep -q 'function normaliseOrdering' site/src/Model/ClubsModel.php
          grep -q 'function getGCalendar' site/src/Model/EventModel.php
          grep -q 'HIT_TABLES' site/src/Model/HitlistModel.php
          grep -q 'function getSportsmanagementHits' site/src/Model/HitlistModel.php
          grep -q 'function getResultsPlan' site/src/Model/IcalModel.php
          if grep -q 'disconnect(' site/src/Model/IcalModel.php; then
            echo "Native iCal model must not disconnect the shared database connection" >&2
            exit 1
          fi
          grep -q 'function getGoogleCalendarFeeds' site/src/Model/JsonfeedModel.php

          grep -q 'class PersonModel extends SportsManagementProjectModel' site/src/Model/PersonModel.php
          grep -q 'function getPerson' site/src/Model/PersonModel.php
          grep -q 'function getReferee' site/src/Model/PersonModel.php
          grep -q 'function _getProjectTeamIds4UserId' site/src/Model/PersonModel.php
          grep -q 'function getRefereeHistory' site/src/Model/PersonModel.php
          grep -q 'MailerFactoryInterface::class' site/src/Model/PersonModel.php
          grep -q '#__user_usergroup_map' site/src/Model/PersonModel.php
          grep -q '#__sportsmanagement_project_referee' site/src/Model/PersonModel.php
          if grep -E -- 'Factory::getUser\(|->input|->getCfg\(|disconnect\(|#__users[^[:space:]]*\.usertype' site/src/Model/PersonModel.php; then
            echo "Native person model regressed to a removed Joomla or legacy user API" >&2
            exit 1
          fi

          grep -q 'public static int $playgroundid' site/src/Model/PlaygroundModel.php
          grep -q 'public static int $projectid' site/src/Model/PlaygroundModel.php
          grep -q 'class PredictionrulesModel extends SportsManagementPredictionModel' site/src/Model/PredictionrulesModel.php
          grep -q 'class HtmlView extends SportsManagementPredictionHtmlView' site/src/View/Predictionheading/HtmlView.php
          grep -q 'class HtmlView extends SportsManagementPredictionHtmlView' site/src/View/Predictionrules/HtmlView.php
          grep -q 'function prepareView' site/src/View/Predictionrules/HtmlView.php
          if grep -q 'sportsmanagementModelPrediction::' site/views/predictionheading/view.html.php site/views/predictionrules/view.html.php; then
            echo "Legacy prediction views must delegate to native prediction views" >&2
            exit 1
          fi

          grep -q 'class RefereeModel extends SportsManagementProjectModel' site/src/Model/RefereeModel.php
          grep -q 'PersonModel::$projectid' site/src/Model/RefereeModel.php
          grep -q 'function getHistory' site/src/Model/RefereeModel.php
          grep -q 'function getPresenceStats' site/src/Model/RefereeModel.php
          grep -q 'function getGames' site/src/Model/RefereeModel.php
          if grep -E -- 'Factory::getUser\(|->input|Factory::getDbo\(|disconnect\(' site/src/Model/RefereeModel.php; then
            echo "Native referee model regressed to a removed Joomla compatibility API" >&2
            exit 1
          fi

          grep -q 'public static int $projectid' site/src/Model/RefereesModel.php
          grep -q 'function getReferees' site/src/Model/RefereesModel.php
          grep -q 'public static int $divisionid' site/src/Model/ResultsrankingModel.php
          grep -q 'public static int $roundid' site/src/Model/ResultsrankingModel.php
          grep -q 'public static int $projectid' site/src/Model/ResultsrankingModel.php
          grep -q 'public static int $cfg_which_database' site/src/Model/ResultsrankingModel.php
          grep -q 'public static int $show_ranking_reiter' site/src/Model/ResultsrankingModel.php
          grep -q 'public static int $matchid' site/src/Model/ScoresheetModel.php
          grep -q 'public static int $projectid' site/src/Model/ScoresheetModel.php
          grep -q 'function getMatch' site/src/Model/ScoresheetModel.php
          grep -q 'function getTeamPlayer' site/src/Model/ScoresheetModel.php
          if grep -q 'disconnect(' site/src/Model/ScoresheetModel.php; then
            echo "Native scoresheet model must not disconnect the shared database connection" >&2
            exit 1
          fi
          grep -q 'public static int $projectid' site/src/Model/TeamsModel.php
          grep -q 'public static int $divisionid' site/src/Model/TeamsModel.php
          grep -q 'function getTeams' site/src/Model/TeamsModel.php

          grep -q 'protected int $fromRoundId' site/src/Model/SportsManagementPredictionModel.php
          grep -q 'protected int $toRoundId' site/src/Model/SportsManagementPredictionModel.php
          grep -q 'protected int $groupRank' site/src/Model/SportsManagementPredictionModel.php
          grep -q 'protected int $databaseSelector' site/src/Model/SportsManagementPredictionModel.php
          grep -q 'function getFromRoundId' site/src/Model/SportsManagementPredictionModel.php
          grep -q 'function getToRoundId' site/src/Model/SportsManagementPredictionModel.php
          grep -q 'function getPredictionType' site/src/Model/SportsManagementPredictionModel.php
          grep -q 'Factory::getApplication()->getInput()' site/src/Model/SportsManagementPredictionModel.php

          grep -q 'class SportsManagementPredictionReadModel extends SportsManagementPredictionModel' site/src/Model/SportsManagementPredictionReadModel.php
          grep -q 'protected int $groupRanking' site/src/Model/SportsManagementPredictionReadModel.php
          grep -q 'protected int $rankingType' site/src/Model/SportsManagementPredictionReadModel.php
          if grep -q 'Factory::getApplication()' site/src/Model/SportsManagementPredictionReadModel.php; then
            echo "Prediction read model must inherit request state from its parent" >&2
            exit 1
          fi

          grep -q 'Factory::getApplication()->getInput()' site/models/predictionuser.php
          grep -q 'getIdentity()' site/models/predictionuser.php
          grep -q 'getDatabase()' site/models/predictionuser.php

          grep -q '$this->input = $this->app->getInput()' site/src/View/SportsManagementHtmlView.php
          grep -q 'Factory::getApplication()->getInput()' site/src/Model/SportsManagementProjectModel.php
          grep -q 'Factory::getApplication()->getInput()' site/src/Model/SportsManagementListModel.php
