name: Joomla 5/6 site model migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-models:
    name: Native site model and view bridge checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native site migrations
        shell: bash
        run: |
          set -euo pipefail

          site_model_pairs=(
            'AboutModel|about|sportsmanagementModelAbout|SportsManagementModel'
            'AllclubsModel|allclubs|sportsmanagementModelallclubs|SportsManagementListModel'
            'AllleaguesModel|allleagues|sportsmanagementModelallleagues|SportsManagementListModel'
            'AllpersonsModel|allpersons|sportsmanagementModelallpersons|SportsManagementListModel'
            'AllplaygroundsModel|allplaygrounds|sportsmanagementModelallplaygrounds|SportsManagementListModel'
            'AllteamsModel|allteams|sportsmanagementModelallteams|SportsManagementListModel'
            'ClubsModel|clubs|sportsmanagementModelClubs|SportsManagementProjectModel'
            'EventModel|event|sportsmanagementModelEvent|SportsManagementModel'
            'EventsrankingModel|eventsranking|sportsmanagementModelEventsRanking|SportsManagementProjectModel'
            'HitlistModel|hitlist|sportsmanagementModelhitlist|SportsManagementModel'
            'IcalModel|ical|sportsmanagementModelical|SportsManagementProjectModel'
            'JsonfeedModel|jsonfeed|sportsmanagementModelJSONFeed|SportsManagementModel'
            'PersonModel|person|sportsmanagementModelPerson|SportsManagementProjectModel'
            'PlaygroundModel|playground|sportsmanagementModelPlayground|SportsManagementProjectModel'
            'PredictionrulesModel|predictionrules|sportsmanagementModelPredictionRules|SportsManagementPredictionModel'
            'RefereeModel|referee|sportsmanagementModelReferee|SportsManagementProjectModel'
            'RefereesModel|referees|sportsmanagementModelReferees|SportsManagementProjectModel'
            'ResultsrankingModel|resultsranking|sportsmanagementModelResultsranking|SportsManagementProjectModel'
            'ScoresheetModel|scoresheet|sportsmanagementModelScoresheet|SportsManagementProjectModel'
            'StaffModel|staff|sportsmanagementModelStaff|SportsManagementProjectModel'
            'StatsrankingModel|statsranking|sportsmanagementModelStatsRanking|SportsManagementStatsRankingModel'
            'StatsrankingteamsModel|statsrankingteams|sportsmanagementModelStatsRankingTeams|SportsManagementStatsRankingModel'
            'TeamsModel|teams|sportsmanagementModelTeams|SportsManagementProjectModel'
          )

          site_view_pairs=(
            'Eventsranking|eventsranking|sportsmanagementViewEventsRanking|SportsManagementProjectHtmlView'
            'Predictionheading|predictionheading|sportsmanagementViewPredictionHeading|SportsManagementPredictionHtmlView'
            'Predictionrules|predictionrules|sportsmanagementViewPredictionRules|SportsManagementPredictionHtmlView'
            'Staff|staff|sportsmanagementViewStaff|SportsManagementProjectHtmlView'
            'Statsranking|statsranking|sportsmanagementViewStatsRanking|SportsManagementProjectHtmlView'
            'Statsrankingteams|statsrankingteams|sportsmanagementViewStatsRankingTeams|SportsManagementProjectHtmlView'
          )

          native_models=()
          legacy_model_bridges=()
          for pair in "${site_model_pairs[@]}"; do
            IFS='|' read -r class legacy_file legacy_class base_class <<< "$pair"
            native_file="site/src/Model/${class}.php"
            bridge_file="site/models/${legacy_file}.php"

            test -f "$native_file"
            test -f "$bridge_file"
            grep -q "class ${class} extends ${base_class}" "$native_file"
            grep -q "class_alias(${class}::class, '${legacy_class}')" "$bridge_file"

            native_models+=("$native_file")
            legacy_model_bridges+=("$bridge_file")
          done

          native_views=()
          legacy_view_bridges=()
          for pair in "${site_view_pairs[@]}"; do
            IFS='|' read -r view legacy_dir legacy_class base_class <<< "$pair"
            native_file="site/src/View/${view}/HtmlView.php"
            bridge_file="site/views/${legacy_dir}/view.html.php"

            test -f "$native_file"
            test -f "$bridge_file"
            grep -q "class HtmlView extends ${base_class}" "$native_file"
            grep -q "class_alias(HtmlView::class, '${legacy_class}')" "$bridge_file"

            native_views+=("$native_file")
            legacy_view_bridges+=("$bridge_file")
          done

          model_base_files=(
            site/src/Model/SportsManagementModel.php
            site/src/Model/SportsManagementProjectModel.php
            site/src/Model/SportsManagementListModel.php
            site/src/Model/SportsManagementPredictionModel.php
            site/src/Model/SportsManagementPredictionReadModel.php
            site/src/Model/SportsManagementStatsRankingModel.php
          )

          view_base_files=(
            site/src/View/SportsManagementHtmlView.php
            site/src/View/SportsManagementProjectHtmlView.php
            site/src/View/SportsManagementPredictionHtmlView.php
          )

          transition_files=(
            site/models/predictionuser.php
          )

          migrated_templates=(
            site/views/eventsranking/tmpl/default_eventsrank.php
            site/views/statsranking/tmpl/default_stats.php
            site/views/statsrankingteams/tmpl/default_stats.php
          )

          lint_files=(
            "${native_models[@]}"
            "${legacy_model_bridges[@]}"
            "${native_views[@]}"
            "${legacy_view_bridges[@]}"
            "${model_base_files[@]}"
            "${view_base_files[@]}"
            "${transition_files[@]}"
            "${migrated_templates[@]}"
          )
          for file in "${lint_files[@]}"; do
            php -l "$file"
          done

          model_api_files=("${native_models[@]}" "${model_base_files[@]}" "${transition_files[@]}")
          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getErrorMsg\(|jimport\(|JLoader::import\(' "${model_api_files[@]}"; then
            echo 'Native site model path regressed to a removed Joomla compatibility API' >&2
            exit 1
          fi

          view_api_files=("${native_views[@]}" "${legacy_view_bridges[@]}" "${view_base_files[@]}" "${migrated_templates[@]}")
          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->getErrorMsg\(|jimport\(|JLoader::import\(|\$this->app->input|\$app->input|Factory::getApplication\(\)->input' "${view_api_files[@]}"; then
            echo 'Native site view path regressed to a removed Joomla compatibility API' >&2
            exit 1
          fi

          dependency_files=("${native_models[@]}" "${model_base_files[@]}")
          if grep -E -- 'components\.com_sportsmanagement\.models|extends \\sportsmanagementModel' "${dependency_files[@]}"; then
            echo 'Native site model depends on a legacy model implementation' >&2
            exit 1
          fi

          # Shared project reads used by native ranking/staff views.
          grep -q 'function getProjectStats' site/src/Model/SportsManagementProjectModel.php
          grep -q 'function getProjectTeams' site/src/Model/SportsManagementProjectModel.php
          grep -q 'function getTeamsIndexedById' site/src/Model/SportsManagementProjectModel.php
          grep -q 'function getFavTeams' site/src/Model/SportsManagementProjectModel.php
          grep -q 'SMStatistic::getInstance' site/src/Model/SportsManagementProjectModel.php
          if grep -E -- 'sportsmanagementModelProject::getProjectStats|disconnect\(' site/src/Model/SportsManagementProjectModel.php; then
            echo 'Native project model regressed to a legacy/disconnect path' >&2
            exit 1
          fi

          # TeamsModel keeps its established public method while the shared reader has a distinct name.
          grep -q 'function getTeams(bool $includePlayground = false)' site/src/Model/TeamsModel.php
          if grep -q 'function getTeams(' site/src/Model/SportsManagementProjectModel.php; then
            echo 'Shared project model must not collide with TeamsModel::getTeams()' >&2
            exit 1
          fi

          # Person/referee/staff migrations retain the repaired APIs.
          grep -q 'function getRefereeHistory' site/src/Model/PersonModel.php
          grep -q 'MailerFactoryInterface::class' site/src/Model/PersonModel.php
          grep -q '#__user_usergroup_map' site/src/Model/PersonModel.php
          grep -q 'function getPresenceStats' site/src/Model/RefereeModel.php
          grep -q 'function getGames' site/src/Model/RefereeModel.php
          grep -q 'function getTeamStaff' site/src/Model/StaffModel.php
          grep -q 'function getStaffHistory' site/src/Model/StaffModel.php
          grep -q 'function getHistoryStaffStats' site/src/Model/StaffModel.php
          if grep -E -- 'disconnect\(|!isset\(\$stat\)|sportsmanagementModelProject::getProjectStats' site/src/Model/PersonModel.php site/src/Model/RefereeModel.php site/src/Model/StaffModel.php; then
            echo 'Person/referee/staff migration regressed to repaired legacy code' >&2
            exit 1
          fi

          # Statistics ranking models/views stay on the shared native project APIs.
          grep -q 'class SportsManagementStatsRankingModel extends SportsManagementProjectModel' site/src/Model/SportsManagementStatsRankingModel.php
          grep -q 'function getProjectUniqueStats' site/src/Model/SportsManagementStatsRankingModel.php
          grep -q 'function getTeamsTotal' site/src/Model/StatsrankingteamsModel.php
          grep -q 'getTeamsIndexedById' site/src/View/Statsranking/HtmlView.php
          grep -q 'getFavTeams' site/src/View/Statsranking/HtmlView.php
          grep -q 'getTeamsTotal' site/src/View/Statsrankingteams/HtmlView.php
          grep -q '\$input = \$this->input' site/views/statsranking/tmpl/default_stats.php
          grep -q '\$input = \$this->input' site/views/statsrankingteams/tmpl/default_stats.php
          if grep -E -- '\$value\[(team_id|total)\]' site/views/statsrankingteams/tmpl/default_stats.php; then
            echo 'Team stats ranking template uses PHP 8 invalid unquoted array keys' >&2
            exit 1
          fi

          # Eventsranking keeps module-facing static BC while running natively.
          grep -q 'public static $projectid' site/src/Model/EventsrankingModel.php
          grep -q 'public static $teamid' site/src/Model/EventsrankingModel.php
          grep -q 'public static $eventid' site/src/Model/EventsrankingModel.php
          grep -q 'public static function getEventTypes' site/src/Model/EventsrankingModel.php
          grep -q 'public static function _getEventsRanking' site/src/Model/EventsrankingModel.php
          grep -q 'function normaliseIds' site/src/Model/EventsrankingModel.php
          grep -q 'getTeamsIndexedById' site/src/View/Eventsranking/HtmlView.php
          grep -q 'getFavTeams' site/src/View/Eventsranking/HtmlView.php
          grep -q '\$input = \$this->input' site/views/eventsranking/tmpl/default_eventsrank.php
          grep -q 'sportsmanagementModelEventsRanking::getEventTypes' modules/mod_sportsmanagement_eventsranking/helper.php
          grep -q 'sportsmanagementModelEventsRanking::_getEventsRanking' modules/mod_sportsmanagement_eventsranking/helper.php
          if grep -E -- 'disconnect\(|jimport\(|Factory::getApplication\(\)->input' site/src/Model/EventsrankingModel.php site/src/View/Eventsranking/HtmlView.php site/views/eventsranking/tmpl/default_eventsrank.php; then
            echo 'Eventsranking native path regressed to a legacy Joomla API' >&2
            exit 1
          fi

          # Prediction transition state remains explicit until the remaining large models are split.
          grep -q 'Factory::getApplication()->getInput()' site/src/Model/SportsManagementPredictionModel.php
          grep -q 'class SportsManagementPredictionReadModel extends SportsManagementPredictionModel' site/src/Model/SportsManagementPredictionReadModel.php
          if grep -q 'Factory::getApplication()' site/src/Model/SportsManagementPredictionReadModel.php; then
            echo 'Prediction read model must inherit request state from its parent' >&2
            exit 1
          fi
          grep -q 'getIdentity()' site/models/predictionuser.php
          grep -q 'getDatabase()' site/models/predictionuser.php

          # View bases provide the only application input object used by migrated templates.
          grep -q '$this->input = $this->app->getInput()' site/src/View/SportsManagementHtmlView.php
          grep -q 'class SportsManagementProjectHtmlView extends SportsManagementHtmlView' site/src/View/SportsManagementProjectHtmlView.php
