name: Joomla 5/6 site modules batch 314

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/ical.php'
      - 'site/models/editteam.php'
      - 'site/models/playground.php'
      - 'modules/mod_sportsmanagement_playgroundplan/tmpl/default.php'
      - 'modules/mod_sportsmanagement_top_tipper/tmpl/default.php'
      - '.github/workflows/joomla5-6-site-modules-batch314.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/ical.php'
      - 'site/models/editteam.php'
      - 'site/models/playground.php'
      - 'modules/mod_sportsmanagement_playgroundplan/tmpl/default.php'
      - 'modules/mod_sportsmanagement_top_tipper/tmpl/default.php'
      - '.github/workflows/joomla5-6-site-modules-batch314.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 site and module bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/ical.php
            site/models/editteam.php
            site/models/playground.php
            modules/mod_sportsmanagement_playgroundplan/tmpl/default.php
            modules/mod_sportsmanagement_top_tipper/tmpl/default.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
          ! grep -Fq -- '@version    4.24.00' site/models/editteam.php
