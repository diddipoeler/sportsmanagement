name: Joomla 5/6 site modules guards batch 311

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/curve/default_colorlegend.php'
      - 'site/tmpl/teamplan/default_sectionheader.php'
      - 'site/tmpl/predictionusers/default_pointsflashchart.php'
      - 'site/tmpl/predictionusers/default_rankflashchart.php'
      - 'modules/mod_sportsmanagement_teamstats_ranking/tmpl/default.php'
      - '.github/workflows/joomla5-6-site-modules-guards-batch311.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/tmpl/curve/default_colorlegend.php'
      - 'site/tmpl/teamplan/default_sectionheader.php'
      - 'site/tmpl/predictionusers/default_pointsflashchart.php'
      - 'site/tmpl/predictionusers/default_rankflashchart.php'
      - 'modules/mod_sportsmanagement_teamstats_ranking/tmpl/default.php'
      - '.github/workflows/joomla5-6-site-modules-guards-batch311.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate modern Joomla guards
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/tmpl/curve/default_colorlegend.php
            site/tmpl/teamplan/default_sectionheader.php
            site/tmpl/predictionusers/default_pointsflashchart.php
            site/tmpl/predictionusers/default_rankflashchart.php
            modules/mod_sportsmanagement_teamstats_ranking/tmpl/default.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
