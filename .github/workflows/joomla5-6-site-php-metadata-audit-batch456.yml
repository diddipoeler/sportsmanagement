name: Joomla 5/6 site PHP metadata audit batch 456

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/**/*.php'
      - '.github/workflows/joomla5-6-site-php-metadata-audit-batch456.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/**/*.php'
      - '.github/workflows/joomla5-6-site-php-metadata-audit-batch456.yml'

permissions:
  contents: read

jobs:
  site-php-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate every site PHP file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find site -type f -name '*.php' -print0 | sort -z)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No site PHP files found." >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            php -l "$file"

            for tag in '@version' '@author' '@copyright' '@license'; do
              if ! grep -Fq -- "$tag" "$file"; then
                echo "Missing $tag in $file" >&2
                exit 1
              fi
            done

            if ! grep -Fq -- '@version    5.6.0' "$file"; then
              echo "Wrong or missing Joomla 5/6 version metadata in $file" >&2
              exit 1
            fi
          done

          echo "Validated ${#files[@]} site PHP files."
