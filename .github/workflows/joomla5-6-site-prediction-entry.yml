name: Joomla 5/6 native site prediction entry

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  prediction-entry:
    name: Native prediction entry read/write boundary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native prediction entry stack
        shell: bash
        run: |
          files=(
            site/src/Model/PredictionentryModel.php
            site/src/Model/PredictiontipModel.php
            site/src/Model/PredictionmembershipModel.php
            site/src/View/Predictionentry/HtmlView.php
            site/src/Controller/PredictionentryController.php
            site/src/View/Predictionentry/tmpl/default.php
            site/src/View/Predictionentry/tmpl/default_view_deny.php
            site/src/View/Predictionentry/tmpl/default_view_not_member.php
            site/src/View/Predictionentry/tmpl/default_view_welcome.php
            site/src/View/Predictionentry/tmpl/default_view_tippentry_do.php
            site/src/View/Predictionentry/tmpl/default_view_tippentry_done.php
            site/views/predictionheading/tmpl/default_predictionheading.php
            site/src/Dispatcher/Dispatcher.php
            site/models/predictionentry.php
            site/controllers/predictionentry.php
            site/views/predictionentry/view.html.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Enforce read-only display boundary
        shell: bash
        run: |
          read_files=(
            site/src/Model/PredictionentryModel.php
            site/src/View/Predictionentry/HtmlView.php
            site/src/View/Predictionentry/tmpl/default.php
            site/src/View/Predictionentry/tmpl/default_view_deny.php
            site/src/View/Predictionentry/tmpl/default_view_not_member.php
            site/src/View/Predictionentry/tmpl/default_view_welcome.php
            site/src/View/Predictionentry/tmpl/default_view_tippentry_do.php
            site/src/View/Predictionentry/tmpl/default_view_tippentry_done.php
          )

          if grep -E "LegacyBootstrap|sportsmanagementModelPrediction::|sportsmanagementModelPredictionEntry|sportsmanagementViewPredictionEntry|addTemplatePaths|savePredictions" "${read_files[@]}"; then
            echo "Native prediction entry display still contains legacy prediction MVC/static calls" >&2
            exit 1
          fi

          if grep -Ei "updateObject|insertObject|deleteObject|savePredictions|savememberdata|->delete\(|->update\(|->insert\(" "${read_files[@]}"; then
            echo "Prediction entry display/read model contains a database write path" >&2
            exit 1
          fi

          grep -q "extends SportsManagementPredictionReadModel" site/src/Model/PredictionentryModel.php
          grep -q "getEntryMatches" site/src/Model/PredictionentryModel.php
          grep -q "isMatchEditable" site/src/Model/PredictionentryModel.php
          grep -q "getRoundDeadlineRule" site/src/Model/PredictionentryModel.php
          grep -q "FIRSTMATCH_OF_TIPPGAME" site/src/Model/PredictionentryModel.php
          grep -q "FIRSTMATCH_OF_TIPPROUND" site/src/Model/PredictionentryModel.php
          grep -q "closing_time" site/src/Model/PredictionentryModel.php
          grep -q "isNotApprovedCurrentMember" site/src/Model/PredictionentryModel.php
          grep -q "canActAsEntryMember" site/src/Model/PredictionentryModel.php
          grep -q "src/View/Predictionentry/tmpl" site/src/View/Predictionentry/HtmlView.php

      - name: Enforce tip writer target and deadline validation
        shell: bash
        run: |
          writer=site/src/Model/PredictiontipModel.php

          grep -q "extends PredictionentryModel" "$writer"
          grep -q "getEntryMatches" "$writer"
          grep -q "empty(\$match->editable)" "$writer"
          grep -Fq 'postedMemberId !== $memberId' "$writer"
          grep -Fq 'postedPredictionId !== $this->predictionGameId' "$writer"
          grep -Fq 'postedProjectId !== $projectId' "$writer"
          grep -Fq 'postedRoundId !== $roundId' "$writer"
          grep -q "joker_limit" "$writer"
          grep -q "proposedJokerCount" "$writer"
          grep -q "array_key_exists" "$writer"
          grep -q "#__sportsmanagement_prediction_result" "$writer"
          grep -q "#__sportsmanagement_prediction_result_round" "$writer"
          grep -q "#__sportsmanagement_prediction_member" "$writer"
          grep -q "updateObject" "$writer"
          grep -q "insertObject" "$writer"
          grep -q "delete(" "$writer"
          grep -q "MailerFactoryInterface" "$writer"

          if grep -E "\$post\[['\"]user_id['\"]\]|cids|prids|pids|ptippmode|sportsmanagementModelPrediction::|sportsmanagementModelPredictionEntry" "$writer"; then
            echo "Prediction tip writer trusts legacy client-side target data" >&2
            exit 1
          fi

      - name: Enforce membership registration boundary
        shell: bash
        run: |
          writer=site/src/Model/PredictionmembershipModel.php
          grep -q "extends PredictionentryModel" "$writer"
          grep -q "getIdentity" "$writer"
          grep -q "auto_approve" "$writer"
          grep -q "#__sportsmanagement_prediction_member" "$writer"
          grep -q "insertObject" "$writer"
          grep -q "MailerFactoryInterface" "$writer"
          if grep -E "\$post|name=['\"]user_id['\"]|name=['\"]approved['\"]|sportsmanagementModelPrediction::" "$writer"; then
            echo "Prediction membership writer trusts registration target/approval from the client" >&2
            exit 1
          fi

      - name: Enforce POST controller and passive templates
        shell: bash
        run: |
          controller=site/src/Controller/PredictionentryController.php
          dispatcher=site/src/Dispatcher/Dispatcher.php
          form=site/src/View/Predictionentry/tmpl/default_view_tippentry_do.php
          register=site/src/View/Predictionentry/tmpl/default_view_not_member.php
          heading=site/views/predictionheading/tmpl/default_predictionheading.php

          grep -q "Session::checkToken('post')" "$controller"
          grep -q "getModel('Predictiontip')" "$controller"
          grep -q "getModel('Predictionmembership')" "$controller"
          grep -q "predictionentry.select" "$dispatcher"
          grep -q "predictionentry.selectprojectround" "$dispatcher"
          grep -q "predictionentry.register" "$dispatcher"
          grep -q "predictionentry.addtipp" "$dispatcher"
          grep -q "predictionentry.addtipp" "$form"
          grep -q "predictionentry.register" "$register"
          grep -q "form.token" "$form"
          grep -q "form.token" "$register"
          grep -q "predictionentry.select" "$heading"

          if grep -E "name=['\"]user_id['\"]|name=['\"]approved['\"]|cids|prids|pids|ptippmode|chkFormular|sportsmanagementModelPrediction::|sportsmanagementModelPredictionEntry::" "$form" "$register"; then
            echo "Native prediction entry forms still expose legacy trusted target fields or static calls" >&2
            exit 1
          fi

      - name: Enforce legacy prediction-entry bridges
        shell: bash
        run: |
          model=site/models/predictionentry.php
          controller=site/controllers/predictionentry.php
          view=site/views/predictionentry/view.html.php

          grep -Fq "class_alias(PredictionentryModel::class, 'sportsmanagementModelPredictionEntry')" "$model"
          grep -Fq "class_alias(PredictionentryController::class, 'sportsmanagementControllerPredictionEntry')" "$controller"
          grep -Fq "class_alias(HtmlView::class, 'sportsmanagementViewPredictionEntry')" "$view"

          legacy_re='Factory::getDBO\(|Factory::getDbo\(|Factory::getUser\(|BaseDatabaseModel::getInstance\(|Table::getInstance\(|jimport\(|JLoader::|jexit\('
          if grep -E "$legacy_re" "$model" "$controller" "$view"; then
            echo "Prediction-entry compatibility files regressed to legacy implementation code" >&2
            exit 1
          fi
