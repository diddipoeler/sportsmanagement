name: Joomla 5/6 native prediction ranking and results

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  prediction-ranking-results:
    name: Native prediction ranking/results boundary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native and compatibility stack
        shell: bash
        run: |
          files=(
            site/src/Model/PredictionrankingModel.php
            site/src/Controller/PredictionrankingController.php
            site/src/View/Predictionranking/HtmlView.php
            site/models/predictionranking.php
            site/controllers/predictionranking.php
            site/views/predictionranking/view.html.php
            site/src/Model/PredictionresultsModel.php
            site/src/Model/PredictionpointsModel.php
            site/src/Controller/PredictionresultsController.php
            site/src/View/Predictionresults/HtmlView.php
            site/models/predictionresults.php
            site/controllers/predictionresults.php
            site/views/predictionresults/view.html.php
            site/src/Dispatcher/Dispatcher.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Enforce legacy bridge boundary
        shell: bash
        run: |
          bridges=(
            site/models/predictionranking.php
            site/controllers/predictionranking.php
            site/views/predictionranking/view.html.php
            site/models/predictionresults.php
            site/controllers/predictionresults.php
            site/views/predictionresults/view.html.php
          )

          grep -q "class_alias(PredictionrankingModel::class, 'sportsmanagementModelPredictionRanking')" site/models/predictionranking.php
          grep -q "class_alias(PredictionrankingController::class, 'sportsmanagementControllerPredictionRanking')" site/controllers/predictionranking.php
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewpredictionranking')" site/views/predictionranking/view.html.php
          grep -q "class_alias(PredictionresultsModel::class, 'sportsmanagementModelPredictionResults')" site/models/predictionresults.php
          grep -q "class_alias(PredictionresultsController::class, 'sportsmanagementControllerPredictionResults')" site/controllers/predictionresults.php
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewPredictionResults')" site/views/predictionresults/view.html.php

          if grep -E "jimport\(|BaseDatabaseModel::getInstance|Table::getInstance|setDbo\(|Factory::getDBO|Factory::getUser|sportsmanagementModelPrediction::" "${bridges[@]}"; then
            echo "Prediction ranking/results compatibility bridges contain legacy implementation logic" >&2
            exit 1
          fi

      - name: Enforce native controller routing
        shell: bash
        run: |
          ranking=site/src/Controller/PredictionrankingController.php
          results=site/src/Controller/PredictionresultsController.php
          dispatcher=site/src/Dispatcher/Dispatcher.php

          grep -q "Session::checkToken" "$ranking"
          grep -q "Session::checkToken('post')" "$results"
          grep -q "getModel('Predictionranking')" "$ranking"
          grep -q "getModel('Predictionresults')" "$results"
          grep -q "getModel('Predictionpoints')" "$results"
          grep -q "isAllowedAdmin" "$results"
          grep -q "predictionranking.selectprojectround" "$dispatcher"
          grep -q "predictionresults.selectprojectround" "$dispatcher"
          grep -q "predictionresults.recalculatepoints" "$dispatcher"

          if grep -E "BaseDatabaseModel::getInstance|Table::getInstance|Factory::getDBO|Factory::getUser|JLoader::register" "$ranking" "$results"; then
            echo "Native prediction ranking/results controllers contain legacy factories/loaders" >&2
            exit 1
          fi

          if grep -F -- 'Factory::getApplication()->input' "$ranking" "$results"; then
            echo "Native prediction ranking/results controllers use deprecated application input property access" >&2
            exit 1
          fi

      - name: Enforce read-only display boundary
        shell: bash
        run: |
          read_files=(
            site/src/Model/PredictionrankingModel.php
            site/src/View/Predictionranking/HtmlView.php
            site/src/Model/PredictionresultsModel.php
            site/src/View/Predictionresults/HtmlView.php
          )

          if grep -E "BaseDatabaseModel::getInstance|Table::getInstance|sportsmanagementModelPrediction::|sportsmanagementViewPrediction" "${read_files[@]}"; then
            echo "Native prediction ranking/results display contains legacy MVC dependencies" >&2
            exit 1
          fi

          if grep -Ei "updateObject|insertObject|deleteObject|(^|[^A-Za-z])(UPDATE|INSERT|DELETE)[[:space:]]" "${read_files[@]}"; then
            echo "Prediction ranking/results display contains a database write path" >&2
            exit 1
          fi

          grep -q "extends SportsManagementPredictionReadModel" site/src/Model/PredictionrankingModel.php
          grep -q "extends SportsManagementPredictionReadModel" site/src/Model/PredictionresultsModel.php
