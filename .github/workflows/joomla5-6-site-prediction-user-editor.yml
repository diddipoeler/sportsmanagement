name: Joomla 5/6 native site prediction user editor

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  prediction-user-editor:
    name: Native prediction member editor
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native prediction user editor
        shell: bash
        run: |
          files=(
            site/src/Model/PredictionuserModel.php
            site/src/Model/PredictionmemberModel.php
            site/src/View/Predictionuser/HtmlView.php
            site/src/Controller/PredictionuserController.php
            site/src/View/Predictionuser/tmpl/edit.php
            site/src/Dispatcher/Dispatcher.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Enforce editor read and write boundary
        shell: bash
        run: |
          read_files=(
            site/src/Model/PredictionuserModel.php
            site/src/View/Predictionuser/HtmlView.php
            site/src/View/Predictionuser/tmpl/edit.php
          )
          writer=site/src/Model/PredictionmemberModel.php
          controller=site/src/Controller/PredictionuserController.php
          dispatcher=site/src/Dispatcher/Dispatcher.php
          template=site/src/View/Predictionuser/tmpl/edit.php

          if grep -E "LegacyBootstrap|sportsmanagementModelPrediction::|sportsmanagementModelProject::|sportsmanagementModelPredictionUsers::|sportsmanagementViewPredictionUser|addTemplatePaths|savePredictionPoints" "${read_files[@]}" "$writer" "$controller"; then
            echo "Native prediction user editor contains a legacy MVC/static dependency" >&2
            exit 1
          fi

          if grep -Ei "updateObject|insertObject|deleteObject|savePredictionPoints|savememberdata|(^|[^A-Za-z])(UPDATE|INSERT|DELETE)[[:space:]]" "${read_files[@]}"; then
            echo "Prediction user read/editor presentation contains a database write path" >&2
            exit 1
          fi

          grep -q "extends PredictionuserModel" "$writer"
          grep -q "updateObject" "$writer"
          grep -q "#__sportsmanagement_prediction_member" "$writer"
          if grep -Ei "insertObject|deleteObject|(^|[^A-Za-z])(INSERT|DELETE)[[:space:]]" "$writer"; then
            echo "Prediction member writer contains an unexpected insert/delete path" >&2
            exit 1
          fi

          grep -Fq 'postedMemberId !== $memberId' "$writer"
          grep -Fq 'postedPredictionId !== $this->predictionGameId' "$writer"
          grep -q "isValidProjectTeamId" "$writer"
          grep -q "isProjectOpenForCompetitiveEdits" "$writer"
          grep -q "isPredictionAdmin" "$writer"
          if grep -q '\$object->approved' "$writer"; then
            echo "Editor unexpectedly changes the legacy read-only approved flag" >&2
            exit 1
          fi

          grep -q "Session::checkToken('post')" "$controller"
          grep -q "getModel('Predictionmember')" "$controller"
          grep -q "canEditMember" "$controller"
          grep -q "predictionuser.save" "$dispatcher"
          grep -q "predictionuser.cancel" "$dispatcher"
          grep -q "NATIVE_EDIT_VIEWS" "$dispatcher"
          grep -q "'predictionuser'" "$dispatcher"
          grep -q "layout !== 'default'" "$dispatcher"
          grep -q "layout !== 'edit'" "$dispatcher"
          if grep -q "predictionusers.savememberdata" "$dispatcher"; then
            echo "Legacy predictionusers writer leaked into the native task allowlist" >&2
            exit 1
          fi

          grep -q "predictionuser.save" "$template"
          grep -q "predictionuser.cancel" "$template"
          grep -q "form.token" "$template"
          if grep -E "name=['\"]user_id['\"]|Joomla\.submitform|submitbutton|joomla\.javascript\.js|cdnjs\.cloudflare\.com|new[[:space:]]+Chart" "$template"; then
            echo "Native prediction user edit form still trusts user_id or depends on legacy/remote JavaScript" >&2
            exit 1
          fi

      - name: Validate editor contract
        shell: bash
        run: |
          model=site/src/Model/PredictionuserModel.php
          writer=site/src/Model/PredictionmemberModel.php
          view=site/src/View/Predictionuser/HtmlView.php
          template=site/src/View/Predictionuser/tmpl/edit.php

          grep -q "extends SportsManagementPredictionReadModel" "$model"
          grep -q "canEditMember" "$model"
          grep -q "getEditProjects" "$model"
          grep -q "canChangeGroup" "$model"
          grep -q "isProjectOpenForCompetitiveEdits" "$model"
          grep -q "getProjectTeamOptions" "$model"
          grep -q "SportsManagementPredictionHtmlView" "$view"
          grep -q "src/View/Predictionuser/tmpl" "$view"
          grep -q "canEditMember" "$view"
          grep -q "JERROR_ALERTNOAUTHOR" "$view"
          grep -q "registerDate" "$writer"
          grep -q "fav_team" "$writer"
          grep -q "champ_tipp" "$writer"
          grep -q "final4_tipp" "$writer"
          grep -q "show_profile" "$writer"
          grep -q "admintipp" "$writer"
          grep -q "formnovalidate" "$template"
