name: Joomla 5/6 native site prediction users

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  prediction-users:
    name: Native prediction users read/write boundary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native prediction users stack
        shell: bash
        run: |
          files=(
            site/src/Model/PredictionusersModel.php
            site/src/Model/PredictionuserModel.php
            site/src/Model/PredictionmemberModel.php
            site/src/View/Predictionusers/HtmlView.php
            site/src/View/Predictionuser/HtmlView.php
            site/src/Controller/PredictionusersController.php
            site/src/Controller/PredictionuserController.php
            site/src/View/Predictionusers/tmpl/default.php
            site/src/View/Predictionusers/tmpl/default_info.php
            site/src/View/Predictionusers/tmpl/default_pointsflashchart.php
            site/src/View/Predictionusers/tmpl/default_rankflashchart.php
            site/src/View/Predictionuser/tmpl/edit.php
            site/controllers/predictionusers.php
            site/controllers/predictionuser.php
            site/src/Dispatcher/Dispatcher.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done

      - name: Enforce read-only profile boundary
        shell: bash
        run: |
          model=site/src/Model/PredictionusersModel.php
          view=site/src/View/Predictionusers/HtmlView.php
          templates=(site/src/View/Predictionusers/tmpl/default*.php)

          if grep -E "LegacyBootstrap|sportsmanagementModelPrediction::|sportsmanagementModelProject::|sportsmanagementModelPredictionUsers::|sportsmanagementViewPredictionUsers|addTemplatePaths|savePredictionPoints" "$model" "$view" "${templates[@]}"; then
            echo "Native prediction users read stack contains a legacy MVC/static dependency" >&2
            exit 1
          fi

          if grep -Ei "updateObject|insertObject|deleteObject|savePredictionPoints|savememberdata|(^|[^A-Za-z])(UPDATE|INSERT|DELETE)[[:space:]]" "$model" "$view" "${templates[@]}"; then
            echo "Prediction users default profile contains a database write path" >&2
            exit 1
          fi

          if grep -Ei "cdnjs\.cloudflare\.com|Chart\.js|new[[:space:]]+Chart" "$view" "${templates[@]}"; then
            echo "Prediction users still depends on remote Chart.js" >&2
            exit 1
          fi

          grep -q "extends SportsManagementPredictionReadModel" "$model"
          grep -q "SportsManagementPredictionHtmlView" "$view"
          grep -q "src/View/Predictionusers/tmpl" "$view"
          grep -q "canViewMemberProfile" "$model"
          grep -q "show_profile" "$model"
          grep -q "getMemberStats" "$model"
          grep -q "getPointsChartData" "$model"
          grep -q "getRankingChartData" "$model"
          grep -q "getFavouriteTeams" "$model"
          grep -q "getChampionTips" "$model"
          grep -q "getFinal4Tips" "$model"
          grep -q "progress-bar" site/src/View/Predictionusers/tmpl/default_pointsflashchart.php
          grep -q "progress-bar" site/src/View/Predictionusers/tmpl/default_rankflashchart.php

      - name: Enforce native member writer boundary
        shell: bash
        run: |
          writer=site/src/Model/PredictionmemberModel.php
          controllers=(
            site/src/Controller/PredictionusersController.php
            site/src/Controller/PredictionuserController.php
          )
          dispatcher=site/src/Dispatcher/Dispatcher.php
          bridges=(
            site/controllers/predictionusers.php
            site/controllers/predictionuser.php
          )

          grep -q "getEditableMember" "$writer"
          grep -q "canEditMember" "$writer"
          grep -q "saveMember" "$writer"
          grep -q "getDatabase" "$writer"
          grep -q "updateObject" "$writer"

          grep -q "Session::checkToken('post')" "${controllers[0]}"
          grep -q "Session::checkToken('post')" "${controllers[1]}"
          grep -q "getModel('Predictionmember')" "${controllers[0]}"
          grep -q "getModel('Predictionmember')" "${controllers[1]}"
          grep -q "predictionusers.savememberdata" "$dispatcher"
          grep -q "predictionusers.cancel" "$dispatcher"
          grep -q "predictionuser.save" "$dispatcher"
          grep -q "predictionuser.cancel" "$dispatcher"
          grep -q "class_alias(PredictionusersController::class, 'sportsmanagementControllerPredictionUsers')" "${bridges[0]}"
          grep -q "class_alias(PredictionusersController::class, 'sportsmanagementControllerPredictionUsers')" "${bridges[1]}"

          if grep -E "BaseDatabaseModel::getInstance|Factory::getDBO|Factory::getUser|Factory::getURI|Table::getInstance|JLoader::register|jexit\(" "${controllers[@]}" "${bridges[@]}"; then
            echo "Prediction user controller compatibility path contains a removed legacy factory/loader dependency" >&2
            exit 1
          fi

          if grep -F -- '->input' "${controllers[@]}" "${bridges[@]}"; then
            echo "Prediction user controller compatibility path uses deprecated application input property access" >&2
            exit 1
          fi

      - name: Enforce native select routing
        shell: bash
        run: |
          controller=site/src/Controller/PredictionusersController.php
          dispatcher=site/src/Dispatcher/Dispatcher.php

          grep -q "predictionusers.select" "$dispatcher"
          grep -q "predictionusers.selectprojectround" "$dispatcher"
          grep -q "layout !== 'default'" "$dispatcher"
          grep -q "getInput()" "$controller"
