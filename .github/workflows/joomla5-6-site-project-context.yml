name: Joomla 5/6 native site project context

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-project-context:
    name: Native site project context
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint native site project stack
        shell: bash
        run: |
          for file in \
            site/src/Model/SportsManagementProjectModel.php \
            site/src/View/SportsManagementProjectHtmlView.php \
            site/src/Model/ClubsModel.php \
            site/src/View/Clubs/HtmlView.php \
            site/src/Model/TeamsModel.php \
            site/src/View/Teams/HtmlView.php \
            site/src/Model/RefereesModel.php \
            site/src/View/Referees/HtmlView.php; do
            test -f "$file"
            php -l "$file"
          done

      - name: Reject legacy MVC dependencies
        shell: bash
        run: |
          files="site/src/Model/SportsManagementProjectModel.php site/src/View/SportsManagementProjectHtmlView.php site/src/Model/ClubsModel.php site/src/View/Clubs/HtmlView.php site/src/Model/TeamsModel.php site/src/View/Teams/HtmlView.php site/src/Model/RefereesModel.php site/src/View/Referees/HtmlView.php"
          if grep -E "LegacyBootstrap|sportsmanagementModel(Project|Clubs|Teams|Referees)|sportsmanagementView(Clubs|Teams|Referees)" $files; then
            echo "Native site project stack contains a legacy MVC dependency" >&2
            exit 1
          fi

      - name: Validate project context contract
        shell: bash
        run: |
          grep -q "#__sportsmanagement_project" site/src/Model/SportsManagementProjectModel.php
          grep -q "#__sportsmanagement_template_config" site/src/Model/SportsManagementProjectModel.php
          grep -q "settings/default" site/src/Model/SportsManagementProjectModel.php
          grep -q "master_template" site/src/Model/SportsManagementProjectModel.php
          grep -q "views/globalviews/tmpl" site/src/View/SportsManagementProjectHtmlView.php
          grep -q "getWebAssetManager()->useScript('jquery')" site/src/View/SportsManagementProjectHtmlView.php

      - name: Validate native project views
        shell: bash
        run: |
          grep -q "extends SportsManagementProjectModel" site/src/Model/ClubsModel.php
          grep -q "extends SportsManagementProjectModel" site/src/Model/TeamsModel.php
          grep -q "extends SportsManagementProjectModel" site/src/Model/RefereesModel.php
          grep -q "extends SportsManagementProjectHtmlView" site/src/View/Clubs/HtmlView.php
          grep -q "extends SportsManagementProjectHtmlView" site/src/View/Teams/HtmlView.php
          grep -q "extends SportsManagementProjectHtmlView" site/src/View/Referees/HtmlView.php
