name: Joomla 5/6 site project model resolver loaders batch 448

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/clubplan.php'
      - 'site/models/teamplan.php'
      - 'site/models/nextmatch.php'
      - 'site/models/person.php'
      - 'site/models/clubinfo.php'
      - '.github/workflows/joomla5-6-site-project-model-resolvers-batch448.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/clubplan.php'
      - 'site/models/teamplan.php'
      - 'site/models/nextmatch.php'
      - 'site/models/person.php'
      - 'site/models/clubinfo.php'
      - '.github/workflows/joomla5-6-site-project-model-resolvers-batch448.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site project model resolver loaders
        shell: bash
        run: |
          set -euo pipefail
          files=(site/models/clubplan.php site/models/teamplan.php site/models/nextmatch.php site/models/person.php site/models/clubinfo.php)
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do grep -Fq -- "$tag" "$file"; done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- 'SportsManagementDatabaseResolver.php' "$file"
            grep -Fq -- 'SportsManagementSiteApplicationResolver.php' "$file"
            grep -Fq -- 'is_file(' "$file"
            grep -Fq -- 'throw new \RuntimeException' "$file"
          done
