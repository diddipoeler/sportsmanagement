name: Joomla 5/6 site ranking application resolver batch 407

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/ranking.php'
      - '.github/workflows/joomla5-6-site-ranking-app-resolver-batch407.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/ranking.php'
      - '.github/workflows/joomla5-6-site-ranking-app-resolver-batch407.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site ranking application resolver
        shell: bash
        run: |
          set -euo pipefail
          file=site/models/ranking.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'SportsManagementSiteApplicationResolver::resolve()' "$file"
          grep -Fq -- 'function siteApplication()' "$file"
          ! grep -Fq -- 'Factory::getApplication' "$file"
