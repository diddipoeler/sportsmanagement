name: Joomla 5/6 site ranking tournament bridges batch 378

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/rankingalltime.php'
      - 'site/models/tournamentbracket.php'
      - 'site/models/leaguechampionoverview.php'
      - '.github/workflows/joomla5-6-site-ranking-tournament-bridges-batch378.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/rankingalltime.php'
      - 'site/models/tournamentbracket.php'
      - 'site/models/leaguechampionoverview.php'
      - '.github/workflows/joomla5-6-site-ranking-tournament-bridges-batch378.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site ranking and tournament bridges
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/models/rankingalltime.php
            site/models/tournamentbracket.php
            site/models/leaguechampionoverview.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
            grep -Fq -- 'class_alias(' "$file"
            grep -Fq -- 'throw new \\RuntimeException' "$file"
          done
          ! grep -Fq -- '@version    4.24.00' site/models/rankingalltime.php
