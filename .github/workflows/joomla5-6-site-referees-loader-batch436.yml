name: Joomla 5/6 site referees loader batch 436

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/referees.php'
      - '.github/workflows/joomla5-6-site-referees-loader-batch436.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/models/referees.php'
      - '.github/workflows/joomla5-6-site-referees-loader-batch436.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate site referees loader
        shell: bash
        run: |
          set -euo pipefail
          file=site/models/referees.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'SportsManagementDatabaseResolver.php' "$file"
          grep -Fq -- 'SportsManagementSiteApplicationResolver.php' "$file"
          grep -Fq -- 'is_file($nativeFile)' "$file"
          ! grep -Fq -- 'require_once JPATH_SITE' "$file"
