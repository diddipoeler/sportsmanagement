name: Joomla 5/6 site referee visibility

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/PersonModel.php'
      - 'site/src/Model/RefereeModel.php'
      - 'site/src/Model/RefereesModel.php'
      - '.github/workflows/joomla5-6-site-referees.yml'
  pull_request:
    branches: [master]
    paths:
      - 'site/src/Model/PersonModel.php'
      - 'site/src/Model/RefereeModel.php'
      - 'site/src/Model/RefereesModel.php'
      - '.github/workflows/joomla5-6-site-referees.yml'

jobs:
  referees:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint native referee models
        run: |
          php -l site/src/Model/PersonModel.php
          php -l site/src/Model/RefereeModel.php
          php -l site/src/Model/RefereesModel.php

      - name: Validate public referee visibility
        shell: bash
        run: |
          person=site/src/Model/PersonModel.php
          detail=site/src/Model/RefereeModel.php
          list=site/src/Model/RefereesModel.php

          grep -Fq "quoteName('pr.published') . ' = 1'" "$person"
          grep -Fq "quoteName('pj.published') . ' = 1'" "$person"
          grep -Fq "quoteName('pj.season_id') . ' = ' . \$db->quoteName('o.season_id')" "$person"
          grep -Fq "quoteName('tp.published') . ' = 1'" "$person"

          grep -Fq "quoteName('pr.published') . ' = 1'" "$detail"
          grep -Fq "quoteName('p.published') . ' = 1'" "$detail"
          grep -Fq "quoteName('pr.published') . ' = 1'" "$list"
          grep -Fq "quoteName('pro.published') . ' = 1'" "$list"
          grep -Fq "quoteName('pro.season_id') . ' = ' . \$db->quoteName('o.season_id')" "$list"

          if grep -E 'JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance|version_compare\(JVERSION' "$person" "$detail" "$list"; then
            echo 'Native referee visibility reintroduced a legacy Joomla API' >&2
            exit 1
          fi
