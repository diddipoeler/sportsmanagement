name: Joomla 5/6 site table tennis roster

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-roster-tabletennis:
    name: Native table tennis roster individual reads gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate table tennis roster migration
        shell: bash
        run: |
          set -euo pipefail
          service=site/src/Service/IndividualMatchReadService.php
          template=site/views/roster/tmpl/default_players_tabletennis.php

          php -l "$service"
          php -l "$template"

          grep -q 'final class IndividualMatchReadService' "$service"
          grep -q 'DatabaseInterface' "$service"
          grep -q 'getPlayerMatches' "$service"
          grep -q '#__sportsmanagement_match_single' "$service"
          grep -q '#__sportsmanagement_round' "$service"
          grep -q 'IndividualMatchReadService' "$template"
          grep -q 'getInput()' "$template"
          grep -q 'getPlayerMatches' "$template"

          active=("$service" "$template")
          if grep -E -- 'sportsmanagementModeljlextindividualsport|Factory::getConfig\(|Factory::getApplication\(\)->input|\$app->input|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance|JLoader::import\(|jimport\(|->disconnect\(' "${active[@]}"; then
            echo 'Table tennis roster regressed to a legacy Joomla/SportsManagement read path' >&2
            exit 1
          fi
