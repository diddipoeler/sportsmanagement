name: Joomla 5/6 site routing gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-routing:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 component routing
        shell: bash
        run: |
          set -euo pipefail

          router=site/src/Service/Router.php
          legacy_router=site/router.php
          route_helper=site/helpers/route.php
          native_route_helper=site/src/Helper/SiteRouteHelper.php
          site_dispatcher=site/src/Dispatcher/Dispatcher.php
          native_ajax=site/src/Controller/AjaxController.php
          navigation_helper=modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
          navigation_dispatcher=modules/mod_sportsmanagement_navigation_menu/src/Dispatcher/Dispatcher.php
          navigation_entry=modules/mod_sportsmanagement_navigation_menu/mod_sportsmanagement_navigation_menu.php
          navigation_bridge=modules/mod_sportsmanagement_navigation_menu/helper.php
          navigation_layout=modules/mod_sportsmanagement_navigation_menu/tmpl/default.php
          provider=admin/services/provider.php
          component=admin/src/Extension/SportsManagementComponent.php
          manifest=sportsmanagement.xml
          migrated_route_templates=(
            site/views/allprojects/tmpl/default_items.php
            site/views/allclubs/tmpl/default_items.php
            site/views/allleagues/tmpl/default_items.php
            site/views/teaminfo/tmpl/default_teamseasons.php
            site/views/teaminfo/tmpl/default_teaminfo.php
            site/views/teaminfo/tmpl/default_history.php
            site/views/teaminfo/tmpl/default_tournament.php
            site/views/teaminfo/tmpl/default_divisions_league.php
            site/views/teaminfo/tmpl/default_friendly_matches.php
            site/views/teamplan/tmpl/default_plan.php
            site/views/teamplan/tmpl/default_plan_sorted_by_date.php
            site/views/results/tmpl/form_bootstrap_row.php
            site/views/results/tmpl/form_dfcday_row.php
            site/views/results/tmpl/form_row.php
            site/views/results/tmpl/default_results_style0.php
            site/views/results/tmpl/default_results_style_dfcday.php
            site/views/nextmatch/tmpl/default_details.php
            site/views/matchreport/tmpl/default_details.php
            site/views/clubplan/tmpl/default_matches.php
            site/views/clubplan/tmpl/default_matches_sorted_by_date.php
            site/views/matrix/tmpl/default_matrix.php
            site/views/matrix/tmpl/default_matrix_division.php
            site/views/matrix/tmpl/default_matrix_russia.php
            site/views/ranking/tmpl/default_rankingrows.php
          )

          test -f "$router"
          test -f "$legacy_router"
          test -f "$route_helper"
          test -f "$native_route_helper"
          test -f "$site_dispatcher"
          test -f "$native_ajax"
          test -f "$navigation_helper"
          test -f "$navigation_dispatcher"
          test -f "$navigation_entry"
          test -f "$navigation_bridge"
          test -f "$navigation_layout"
          test -f "$provider"
          test -f "$component"

          php -l "$router"
          php -l "$legacy_router"
          php -l "$route_helper"
          php -l "$native_route_helper"
          php -l "$site_dispatcher"
          php -l "$native_ajax"
          php -l "$navigation_helper"
          php -l "$navigation_dispatcher"
          php -l "$navigation_entry"
          php -l "$navigation_bridge"
          php -l "$navigation_layout"
          php -l "$provider"
          php -l "$component"

          for template in "${migrated_route_templates[@]}"; do
            test -f "$template"
            php -l "$template"

            if ! grep -Fq 'use Diddipoeler\Component\SportsManagement\Site\Helper\SiteRouteHelper;' "$template"; then
              echo "$template no longer imports the native site route helper." >&2
              exit 1
            fi

            if grep -Fq 'sportsmanagementHelperRoute::' "$template"; then
              echo "$template regressed to the legacy frontend route helper." >&2
              exit 1
            fi
          done

          grep -q 'class Router extends RouterBase' "$router"
          grep -q 'function preprocess' "$router"
          grep -q 'findBestMenuItem' "$router"
          grep -q 'isKnownSiteView' "$router"
          grep -q 'getRouteDefaultValue' "$router"
          grep -Fq 'array_shift($segments)' "$router"
          grep -Fq 'final class SiteRouteHelper' "$native_route_helper"

          # A stale component default_itemid can point at any Joomla menu item,
          # including an external URL. SportsManagement must reject such Itemids
          # before Joomla turns them into the canonical menu route.
          grep -Fq '$currentItem = $this->menu->getItem($currentItemId);' "$router"
          grep -Fq 'isSportsManagementMenuItem($currentItem)' "$router"
          grep -Fq "unset(\$query['Itemid'])" "$router"

          # Navigation-menu anchors and AJAX redirects must both use the native
          # component route helper and must not fall back to the legacy helper.
          grep -Fq 'SiteRouteHelper::view' "$navigation_helper"
          grep -Fq "getHelper('NativeNavigationMenuHelper')" "$navigation_dispatcher"
          grep -Fq 'new NativeNavigationMenuHelper()' "$navigation_entry"
          grep -Fq 'class_alias(NativeNavigationMenuHelper::class' "$navigation_bridge"
          grep -Fq 'SiteRouteHelper::view' "$native_ajax"
          grep -Fq "'ajax.getroute'" "$site_dispatcher"
          grep -Fq "format === 'json'" "$site_dispatcher"

          if grep -Fq 'sportsmanagementHelperRoute::' "$navigation_helper" "$native_ajax"; then
            echo 'Navigation routing regressed to the legacy frontend route helper.' >&2
            exit 1
          fi

          if grep -Fq 'name="Itemid"' "$navigation_layout"; then
            echo 'Navigation menu regressed to forcing a configured Itemid.' >&2
            exit 1
          fi

          grep -Fq 'SiteRouteHelper::view' site/views/allprojects/tmpl/default_items.php
          grep -Fq "SiteRouteHelper::view('clubinfo'" site/views/allclubs/tmpl/default_items.php
          grep -Fq "SiteRouteHelper::view('allprojects'" site/views/allleagues/tmpl/default_items.php
          grep -Fq "SiteRouteHelper::view('roster'" site/views/teaminfo/tmpl/default_teamseasons.php
          grep -Fq "SiteRouteHelper::view('results'" site/views/teaminfo/tmpl/default_teamseasons.php
          grep -Fq "SiteRouteHelper::view('ranking'" site/views/teaminfo/tmpl/default_teamseasons.php
          test "$(grep -Fc "SiteRouteHelper::view('clubinfo'" site/views/teaminfo/tmpl/default_teaminfo.php)" -eq 2
          grep -Fq "SiteRouteHelper::view('teaminfo'" site/views/teaminfo/tmpl/default_teaminfo.php
          grep -Fq "SiteRouteHelper::view('teamstats'" site/views/teaminfo/tmpl/default_teaminfo.php
          for template in \
            site/views/teaminfo/tmpl/default_history.php \
            site/views/teaminfo/tmpl/default_tournament.php \
            site/views/teaminfo/tmpl/default_divisions_league.php \
            site/views/teaminfo/tmpl/default_friendly_matches.php; do
            grep -Fq "SiteRouteHelper::view('ranking'" "$template"
            grep -Fq "SiteRouteHelper::view('results'" "$template"
            grep -Fq "SiteRouteHelper::view('teamplan'" "$template"
            grep -Fq "SiteRouteHelper::view('teamstats'" "$template"
            grep -Fq "SiteRouteHelper::view('roster'" "$template"
          done
          grep -Fq "SiteRouteHelper::view('results'" site/views/teamplan/tmpl/default_plan.php
          for template in \
            site/views/teamplan/tmpl/default_plan.php \
            site/views/teamplan/tmpl/default_plan_sorted_by_date.php; do
            test "$(grep -Fc "SiteRouteHelper::view('teamplan'" "$template")" -eq 2
            test "$(grep -Fc "SiteRouteHelper::view('matchreport'" "$template")" -eq 2
            test "$(grep -Fc "SiteRouteHelper::view('nextmatch'" "$template")" -eq 3
            grep -Fq "SiteRouteHelper::view('referee'" "$template"
          done
          grep -Fq "SiteRouteHelper::view('editmatch'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "\$editMatchRoute('editlineup'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "\$editMatchRoute('editevents'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "\$editMatchRoute('editstats'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "\$editMatchRoute('editreferees'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "SiteRouteHelper::view('editmatch'" site/views/results/tmpl/form_dfcday_row.php
          grep -Fq "\$editMatchRoute('edit'" site/views/results/tmpl/form_dfcday_row.php
          test "$(grep -Fc "\$editMatchRoute('editlineup'" site/views/results/tmpl/form_dfcday_row.php)" -eq 2
          grep -Fq "\$editMatchRoute('editevents'" site/views/results/tmpl/form_dfcday_row.php
          grep -Fq "\$editMatchRoute('editstats'" site/views/results/tmpl/form_dfcday_row.php
          grep -Fq "SiteRouteHelper::view('editmatch'" site/views/results/tmpl/form_row.php
          grep -Fq "\$editMatchRoute('edit'" site/views/results/tmpl/form_row.php
          test "$(grep -Fc "\$editMatchRoute('editlineup'" site/views/results/tmpl/form_row.php)" -eq 2
          grep -Fq "\$editMatchRoute('editevents', (int) \$team1->projectteamid, (int) \$this->doubleevents)" site/views/results/tmpl/form_row.php
          grep -Fq "\$editMatchRoute('editstats', (int) \$team1->projectteamid, (int) \$this->doubleevents)" site/views/results/tmpl/form_row.php
          grep -Fq "\$editMatchRoute('editreferees'" site/views/results/tmpl/form_row.php
          grep -Fq "'doubleevents' => \$doubleevents" site/views/results/tmpl/form_row.php
          grep -Fq "SiteRouteHelper::view('matchreport'" site/views/results/tmpl/default_results_style0.php
          test "$(grep -Fc "SiteRouteHelper::view('nextmatch'" site/views/results/tmpl/default_results_style0.php)" -eq 2
          grep -Fq "SiteRouteHelper::view('scoresheet'" site/views/results/tmpl/default_results_style0.php
          grep -Fq "SiteRouteHelper::view('matchreport'" site/views/results/tmpl/default_results_style_dfcday.php
          grep -Fq "SiteRouteHelper::view('nextmatch'" site/views/results/tmpl/default_results_style_dfcday.php
          grep -Fq "SiteRouteHelper::view('matchreport'" site/views/nextmatch/tmpl/default_details.php
          grep -Fq "SiteRouteHelper::view('nextmatch'" site/views/nextmatch/tmpl/default_details.php
          grep -Fq "SiteRouteHelper::view('playground'" site/views/nextmatch/tmpl/default_details.php
          grep -Fq "SiteRouteHelper::view('referee'" site/views/nextmatch/tmpl/default_details.php
          test "$(grep -Fc "SiteRouteHelper::view('nextmatch'" site/views/matchreport/tmpl/default_details.php)" -eq 2
          grep -Fq "SiteRouteHelper::view('playground'" site/views/matchreport/tmpl/default_details.php
          grep -Fq "SiteRouteHelper::view('referee'" site/views/matchreport/tmpl/default_details.php
          grep -Fq "SiteRouteHelper::view('results'" site/views/clubplan/tmpl/default_matches.php
          grep -Fq "SiteRouteHelper::view('nextmatch'" site/views/clubplan/tmpl/default_matches.php
          grep -Fq "SiteRouteHelper::view('matchreport'" site/views/clubplan/tmpl/default_matches.php
          test "$(grep -Fc "SiteRouteHelper::view('teaminfo'" site/views/clubplan/tmpl/default_matches.php)" -eq 2
          test "$(grep -Fc "SiteRouteHelper::view('teamstats'" site/views/clubplan/tmpl/default_matches.php)" -eq 2
          grep -Fq "SiteRouteHelper::view('playground'" site/views/clubplan/tmpl/default_matches.php
          grep -Fq "SiteRouteHelper::view('referee'" site/views/clubplan/tmpl/default_matches.php
          grep -Fq "SiteRouteHelper::view('results'" site/views/clubplan/tmpl/default_matches_sorted_by_date.php
          grep -Fq "SiteRouteHelper::view('nextmatch'" site/views/clubplan/tmpl/default_matches_sorted_by_date.php
          test "$(grep -Fc "SiteRouteHelper::view('teaminfo'" site/views/clubplan/tmpl/default_matches_sorted_by_date.php)" -eq 2
          test "$(grep -Fc "SiteRouteHelper::view('teamstats'" site/views/clubplan/tmpl/default_matches_sorted_by_date.php)" -eq 2
          grep -Fq "SiteRouteHelper::view('playground'" site/views/clubplan/tmpl/default_matches_sorted_by_date.php
          grep -Fq "SiteRouteHelper::view('referee'" site/views/clubplan/tmpl/default_matches_sorted_by_date.php
          grep -Fq "SiteRouteHelper::view('clubinfo'" site/views/matrix/tmpl/default_matrix.php
          grep -Fq "SiteRouteHelper::view('roster'" site/views/matrix/tmpl/default_matrix.php
          grep -Fq "SiteRouteHelper::view('matchreport'" site/views/matrix/tmpl/default_matrix.php
          test "$(grep -Fc "SiteRouteHelper::view('nextmatch'" site/views/matrix/tmpl/default_matrix.php)" -eq 2
          grep -Fq "SiteRouteHelper::view('results'" site/views/matrix/tmpl/default_matrix.php
          grep -Fq "SiteRouteHelper::view('clubinfo'" site/views/matrix/tmpl/default_matrix_division.php
          grep -Fq "SiteRouteHelper::view('nextmatch'" site/views/matrix/tmpl/default_matrix_division.php
          grep -Fq "SiteRouteHelper::view('results'" site/views/matrix/tmpl/default_matrix_division.php
          test "$(grep -Fc "SiteRouteHelper::view('roster'" site/views/matrix/tmpl/default_matrix_division.php)" -eq 2
          test "$(grep -Fc "SiteRouteHelper::view('matchreport'" site/views/matrix/tmpl/default_matrix_division.php)" -eq 2
          test "$(grep -Fc "\$clubInfoRoute(" site/views/matrix/tmpl/default_matrix_division.php)" -eq 2
          test "$(grep -Fc "\$nextMatchRoute(" site/views/matrix/tmpl/default_matrix_division.php)" -eq 4
          test "$(grep -Fc "\$resultsRoute(" site/views/matrix/tmpl/default_matrix_division.php)" -eq 2
          grep -Fq "SiteRouteHelper::view('clubinfo'" site/views/matrix/tmpl/default_matrix_russia.php
          grep -Fq "SiteRouteHelper::view('nextmatch'" site/views/matrix/tmpl/default_matrix_russia.php
          grep -Fq "SiteRouteHelper::view('results'" site/views/matrix/tmpl/default_matrix_russia.php
          grep -Fq "SiteRouteHelper::view('roster'" site/views/matrix/tmpl/default_matrix_russia.php
          test "$(grep -Fc "SiteRouteHelper::view('matchreport'" site/views/matrix/tmpl/default_matrix_russia.php)" -eq 2
          test "$(grep -Fc "\$clubInfoRoute(" site/views/matrix/tmpl/default_matrix_russia.php)" -eq 1
          test "$(grep -Fc "\$nextMatchRoute(" site/views/matrix/tmpl/default_matrix_russia.php)" -eq 4
          test "$(grep -Fc "\$resultsRoute(" site/views/matrix/tmpl/default_matrix_russia.php)" -eq 2
          test "$(grep -Fc "SiteRouteHelper::view('teamplan'" site/views/ranking/tmpl/default_rankingrows.php)" -eq 3
          grep -Fq "\$routeparameter['mode'] = 1" site/views/ranking/tmpl/default_rankingrows.php
          grep -Fq "\$routeparameter['mode'] = 2" site/views/ranking/tmpl/default_rankingrows.php
          grep -Fq "\$routeparameter['mode'] = 3" site/views/ranking/tmpl/default_rankingrows.php
          grep -Fq "SiteRouteHelper::view('matchreport'" site/views/ranking/tmpl/default_rankingrows.php
          grep -q 'RouterFactoryServiceProvider' "$provider"
          grep -q 'setRouterFactory' "$provider"
          grep -q 'RouterServiceTrait' "$component"
          grep -q '<folder>src</folder>' "$manifest"
          grep -q '<folder>services</folder>' "$manifest"

          # Frontend menu routes must never be forced back to the currently
          # active menu item. Explicit Itemid values and target menu matches are
          # handled by the helper/router pair instead.
          if grep -E 'getMenu\(\)->getActive\(\)->id|getActive\(\)->id' "$route_helper" "$router"; then
            echo 'Routing regressed to the active menu Itemid.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(User|Dbo)\(' "$route_helper" "$router" "$legacy_router"; then
            echo 'Routing regressed to a Joomla 6 removed Factory API.' >&2
            exit 1
          fi

          if ! grep -q "getItems('component', self::\$option)" "$route_helper"; then
            echo 'Legacy route helper no longer searches SportsManagement menu items.' >&2
            exit 1
          fi

          if ! grep -q "\$parts\['Itemid'\] = \$itemId" "$route_helper"; then
            echo 'Legacy route helper no longer preserves/resolves Itemid explicitly.' >&2
            exit 1
          fi

          # Native frontend views are not all present in the historical $views
          # positional route table. The component router must recognise those
          # views independently and consume their view segment.
          if ! grep -Fq 'isKnownSiteView($view)' "$router" \
            || ! grep -Fq 'array_shift($segments)' "$router"; then
            echo 'Native frontend views can no longer be parsed without a legacy route definition.' >&2
            exit 1
          fi

          # Legacy positional URLs must keep empty intermediate positions when
          # later values are present, otherwise parse() assigns them to the
          # wrong parameter names.
          if ! grep -Fq 'getRouteDefaultValue($defaults[$key])' "$router" \
            || ! grep -Fq 'array_key_exists($key, $menuQuery)' "$router"; then
            echo 'Legacy positional route padding is no longer protected.' >&2
            exit 1
          fi

          if ! grep -Fq 'SportsManagementRouter' "$legacy_router" \
            || ! grep -Fq 'sportsmanagementGetRouter()->build' "$legacy_router" \
            || ! grep -Fq 'sportsmanagementGetRouter()->parse' "$legacy_router"; then
            echo 'Legacy router bridge no longer delegates to the component router.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
