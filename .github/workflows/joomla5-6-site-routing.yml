name: Joomla 5/6 site routing gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  site-routing:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Joomla 5/6 component routing
        shell: bash
        run: |
          set -euo pipefail

          router=site/src/Service/Router.php
          legacy_router=site/router.php
          route_helper=site/helpers/route.php
          native_route_helper=site/src/Helper/SiteRouteHelper.php
          provider=admin/services/provider.php
          component=admin/src/Extension/SportsManagementComponent.php
          manifest=sportsmanagement.xml
          migrated_route_templates=(
            site/views/allprojects/tmpl/default_items.php
            site/views/allclubs/tmpl/default_items.php
            site/views/allleagues/tmpl/default_items.php
            site/views/teaminfo/tmpl/default_teamseasons.php
            site/views/results/tmpl/form_bootstrap_row.php
            site/views/ranking/tmpl/default_rankingrows.php
          )

          test -f "$router"
          test -f "$legacy_router"
          test -f "$route_helper"
          test -f "$native_route_helper"
          test -f "$provider"
          test -f "$component"

          php -l "$router"
          php -l "$legacy_router"
          php -l "$route_helper"
          php -l "$native_route_helper"
          php -l "$provider"
          php -l "$component"

          for template in "${migrated_route_templates[@]}"; do
            test -f "$template"
            php -l "$template"

            if ! grep -Fq 'use Diddipoeler\Component\SportsManagement\Site\Helper\SiteRouteHelper;' "$template"; then
              echo "$template no longer imports the native site route helper." >&2
              exit 1
            fi

            if grep -Fq 'sportsmanagementHelperRoute::' "$template"; then
              echo "$template regressed to the legacy frontend route helper." >&2
              exit 1
            fi
          done

          grep -q 'class Router extends RouterBase' "$router"
          grep -q 'function preprocess' "$router"
          grep -q 'findBestMenuItem' "$router"
          grep -q 'isKnownSiteView' "$router"
          grep -q 'getRouteDefaultValue' "$router"
          grep -Fq 'array_shift($segments)' "$router"
          grep -Fq 'final class SiteRouteHelper' "$native_route_helper"
          grep -Fq 'SiteRouteHelper::view' site/views/allprojects/tmpl/default_items.php
          grep -Fq "SiteRouteHelper::view('clubinfo'" site/views/allclubs/tmpl/default_items.php
          grep -Fq "SiteRouteHelper::view('allprojects'" site/views/allleagues/tmpl/default_items.php
          grep -Fq "SiteRouteHelper::view('roster'" site/views/teaminfo/tmpl/default_teamseasons.php
          grep -Fq "SiteRouteHelper::view('results'" site/views/teaminfo/tmpl/default_teamseasons.php
          grep -Fq "SiteRouteHelper::view('ranking'" site/views/teaminfo/tmpl/default_teamseasons.php
          grep -Fq "SiteRouteHelper::view('editmatch'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "\$editMatchRoute('editlineup'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "\$editMatchRoute('editevents'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "\$editMatchRoute('editstats'" site/views/results/tmpl/form_bootstrap_row.php
          grep -Fq "\$editMatchRoute('editreferees'" site/views/results/tmpl/form_bootstrap_row.php
          test "$(grep -Fc "SiteRouteHelper::view('teamplan'" site/views/ranking/tmpl/default_rankingrows.php)" -eq 3
          grep -Fq "\$routeparameter['mode'] = 1" site/views/ranking/tmpl/default_rankingrows.php
          grep -Fq "\$routeparameter['mode'] = 2" site/views/ranking/tmpl/default_rankingrows.php
          grep -Fq "\$routeparameter['mode'] = 3" site/views/ranking/tmpl/default_rankingrows.php
          grep -Fq "SiteRouteHelper::view('matchreport'" site/views/ranking/tmpl/default_rankingrows.php
          grep -q 'RouterFactoryServiceProvider' "$provider"
          grep -q 'setRouterFactory' "$provider"
          grep -q 'RouterServiceTrait' "$component"
          grep -q '<folder>src</folder>' "$manifest"
          grep -q '<folder>services</folder>' "$manifest"

          # Frontend menu routes must never be forced back to the currently
          # active menu item. Explicit Itemid values and target menu matches are
          # handled by the helper/router pair instead.
          if grep -E 'getMenu\(\)->getActive\(\)->id|getActive\(\)->id' "$route_helper" "$router"; then
            echo 'Routing regressed to the active menu Itemid.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(User|Dbo)\(' "$route_helper" "$router" "$legacy_router"; then
            echo 'Routing regressed to a Joomla 6 removed Factory API.' >&2
            exit 1
          fi

          if ! grep -q "getItems('component', self::\$option)" "$route_helper"; then
            echo 'Legacy route helper no longer searches SportsManagement menu items.' >&2
            exit 1
          fi

          if ! grep -q "\$parts\['Itemid'\] = \$itemId" "$route_helper"; then
            echo 'Legacy route helper no longer preserves/resolves Itemid explicitly.' >&2
            exit 1
          fi

          # Native frontend views are not all present in the historical $views
          # positional route table. The component router must recognise those
          # views independently and consume their view segment.
          if ! grep -Fq 'isKnownSiteView($view)' "$router" \
            || ! grep -Fq 'array_shift($segments)' "$router"; then
            echo 'Native frontend views can no longer be parsed without a legacy route definition.' >&2
            exit 1
          fi

          # Legacy positional URLs must keep empty intermediate positions when
          # later values are present, otherwise parse() assigns them to the
          # wrong parameter names.
          if ! grep -Fq 'getRouteDefaultValue($defaults[$key])' "$router" \
            || ! grep -Fq 'array_key_exists($key, $menuQuery)' "$router"; then
            echo 'Legacy positional route padding is no longer protected.' >&2
            exit 1
          fi

          if ! grep -Fq 'SportsManagementRouter' "$legacy_router" \
            || ! grep -Fq 'sportsmanagementGetRouter()->build' "$legacy_router" \
            || ! grep -Fq 'sportsmanagementGetRouter()->parse' "$legacy_router"; then
            echo 'Legacy router bridge no longer delegates to the component router.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
