name: Joomla 5/6 site stats legacy batch 312

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/stats/default_stats.php'
      - 'site/tmpl/stats/default_ranking.php'
      - 'site/tmpl/teamstats/default_homeaway_goals.php'
      - 'site/tmpl/teamstats/default_stats.php'
      - 'site/tmpl/statsranking/default_stats.php'
      - 'site/tmpl/statsrankingteams/default_stats.php'
      - '.github/workflows/joomla5-6-site-stats-legacy-batch312.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/tmpl/stats/default_stats.php'
      - 'site/tmpl/stats/default_ranking.php'
      - 'site/tmpl/teamstats/default_homeaway_goals.php'
      - 'site/tmpl/teamstats/default_stats.php'
      - 'site/tmpl/statsranking/default_stats.php'
      - 'site/tmpl/statsrankingteams/default_stats.php'
      - '.github/workflows/joomla5-6-site-stats-legacy-batch312.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate stats legacy cleanup
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/tmpl/stats/default_stats.php
            site/tmpl/stats/default_ranking.php
            site/tmpl/teamstats/default_homeaway_goals.php
            site/tmpl/teamstats/default_stats.php
            site/tmpl/statsranking/default_stats.php
            site/tmpl/statsrankingteams/default_stats.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- '@version    5.6.0' "$file"
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
            ! grep -Fq -- '@version    1.0.05' "$file"
          done
