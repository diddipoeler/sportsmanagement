name: Joomla 5/6 site stats results batch 310

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/assets/js/results-round.js'
      - 'site/tmpl/results/default_sectionheader.php'
      - 'site/tmpl/stats/default_attendance_stats.php'
      - 'site/tmpl/stats/default_goals_stats.php'
      - 'site/tmpl/teamstats/default_attendance_stats.php'
      - 'site/tmpl/ranking/default_map.php'
      - '.github/workflows/joomla5-6-site-stats-results-batch310.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/assets/js/results-round.js'
      - 'site/tmpl/results/default_sectionheader.php'
      - 'site/tmpl/stats/default_attendance_stats.php'
      - 'site/tmpl/stats/default_goals_stats.php'
      - 'site/tmpl/teamstats/default_attendance_stats.php'
      - 'site/tmpl/ranking/default_map.php'
      - '.github/workflows/joomla5-6-site-stats-results-batch310.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate Joomla 5/6 stats and results layouts
        shell: bash
        run: |
          set -euo pipefail
          php_files=(
            site/tmpl/results/default_sectionheader.php
            site/tmpl/stats/default_attendance_stats.php
            site/tmpl/stats/default_goals_stats.php
            site/tmpl/teamstats/default_attendance_stats.php
            site/tmpl/ranking/default_map.php
          )
          for file in "${php_files[@]}"; do
            php -l "$file"
            for tag in '@version' '@author' '@copyright' '@license'; do
              grep -Fq -- "$tag" "$file"
            done
            grep -Fq -- "\\defined('_JEXEC') or die;" "$file"
            ! grep -Fq -- 'Restricted access' "$file"
          done
          node --check site/assets/js/results-round.js
          ! grep -Fqi -- 'onchange=' site/tmpl/results/default_sectionheader.php
          grep -Fq -- 'data-jsm-results-round' site/tmpl/results/default_sectionheader.php
          grep -Fq -- '@version    5.6.0' site/tmpl/stats/default_attendance_stats.php
          grep -Fq -- '@version    5.6.0' site/tmpl/stats/default_goals_stats.php
          grep -Fq -- '@version    5.6.0' site/tmpl/teamstats/default_attendance_stats.php
