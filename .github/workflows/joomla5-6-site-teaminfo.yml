name: Joomla 5/6 Teaminfo site migration gate

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Teaminfo/**'
      - 'site/src/Model/TeaminfoModel.php'
      - 'site/src/Helper/LocationAddressHelper.php'
      - 'site/src/Helper/ModalImageHelper.php'
      - 'site/assets/js/teaminfo-mediawiki.js'
      - 'site/tmpl/teaminfo/**'
      - 'site/views/teaminfo/**'
      - '.github/workflows/joomla5-6-site-teaminfo.yml'
  pull_request:
    paths:
      - 'site/src/View/Teaminfo/**'
      - 'site/src/Model/TeaminfoModel.php'
      - 'site/src/Helper/LocationAddressHelper.php'
      - 'site/src/Helper/ModalImageHelper.php'
      - 'site/assets/js/teaminfo-mediawiki.js'
      - 'site/tmpl/teaminfo/**'
      - 'site/views/teaminfo/**'
      - '.github/workflows/joomla5-6-site-teaminfo.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Teaminfo PHP and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/View/Teaminfo/HtmlView.php \
            site/src/Model/TeaminfoModel.php \
            site/src/Helper/LocationAddressHelper.php \
            site/src/Helper/ModalImageHelper.php \
            site/tmpl/teaminfo/default.php \
            site/tmpl/teaminfo/default_teaminfo.php \
            site/tmpl/teaminfo/default_training.php \
            site/tmpl/teaminfo/default_simple_league.php \
            site/tmpl/teaminfo/default_teamseasons.php \
            site/views/teaminfo/tmpl/default.php; do
            test -f "$file"
            php -l "$file"
          done
          node --check site/assets/js/teaminfo-mediawiki.js

      - name: Validate native Teaminfo presentation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          view = Path('site/src/View/Teaminfo/HtmlView.php').read_text(encoding='utf-8')
          template = Path('site/tmpl/teaminfo/default_teaminfo.php').read_text(encoding='utf-8')
          training = Path('site/tmpl/teaminfo/default_training.php').read_text(encoding='utf-8')
          simple_league = Path('site/tmpl/teaminfo/default_simple_league.php').read_text(encoding='utf-8')
          team_seasons = Path('site/tmpl/teaminfo/default_teamseasons.php').read_text(encoding='utf-8')
          mediawiki = Path('site/assets/js/teaminfo-mediawiki.js').read_text(encoding='utf-8')
          bridge = Path('site/views/teaminfo/tmpl/default.php').read_text(encoding='utf-8')

          expected_view = (
              r'namespace Diddipoeler\Component\SportsManagement\Site\View\Teaminfo;',
              'instanceof TeaminfoModel',
              '$model->getSportsManagementDatabase()',
              'LocationAddressHelper::build(',
              'public string $clubAddress',
          )
          for needle in expected_view:
              if needle not in view:
                  raise SystemExit(f'Teaminfo native view contract missing: {needle}')

          for needle in (
              'SportsManagementDatabaseResolver::resolve(',
              'Factory::getApplication(',
              'Factory::getContainer(',
              '$app->getContainer(',
          ):
              if needle in view:
                  raise SystemExit(f'Teaminfo native view bypasses its model/application contract: {needle}')

          expected_template = (
              'ModalImageHelper::render(',
              "ComponentHelper::getParams('com_sportsmanagement')",
              'col-12 col-md-6',
              '$this->clubAddress',
              "SiteRouteHelper::view('clubinfo'",
              "SiteRouteHelper::view('teaminfo'",
              "SiteRouteHelper::view('teamstats'",
          )
          for needle in expected_template:
              if needle not in template:
                  raise SystemExit(f'Teaminfo native template contract missing: {needle}')

          for needle in (
              'sportsmanagementHelper::',
              'sportsmanagementHelperHtml::',
              'JSMCountries::',
              'col-xs-',
              '<script',
              'onclick=',
              'onchange=',
          ):
              if needle in template:
                  raise SystemExit(f'Teaminfo main presentation legacy regression: {needle}')

          for needle in ('nowrap=', 'align=', '<script', 'onclick=', 'onchange='):
              if needle in training:
                  raise SystemExit(f'Teaminfo training legacy regression: {needle}')

          expected_simple = (
              'ModalImageHelper::render(',
              "SiteRouteHelper::view('ranking'",
              "SiteRouteHelper::view('results'",
              "SiteRouteHelper::view('teamplan'",
              "SiteRouteHelper::view('teamstats'",
              "SiteRouteHelper::view('roster'",
              'data-jsm-mediawiki',
              'teaminfo-mediawiki.js',
              'text-end',
          )
          for needle in expected_simple:
              if needle not in simple_league:
                  raise SystemExit(f'Teaminfo simple-league native contract missing: {needle}')

          for needle in (
              'sportsmanagementHelperRoute::',
              'sportsmanagementHelperHtml::',
              'sportsmanagementHelper::',
              'addScriptDeclaration(',
              '<script',
              'onclick=',
              'onchange=',
              'nowrap=',
              'align=',
          ):
              if needle in simple_league:
                  raise SystemExit(f'Teaminfo simple-league legacy regression: {needle}')

          expected_team_seasons = (
              "$this->input->getInt('cfg_which_database', 0)",
              "$this->input->getInt('s', 0)",
              "SiteRouteHelper::view('roster'",
              "SiteRouteHelper::view('results'",
              "SiteRouteHelper::view('ranking'",
          )
          for needle in expected_team_seasons:
              if needle not in team_seasons:
                  raise SystemExit(f'Teaminfo team-seasons native contract missing: {needle}')

          for needle in (
              'Factory::getApplication(',
              'JFactory::',
              'JRequest::',
          ):
              if needle in team_seasons:
                  raise SystemExit(f'Teaminfo team-seasons legacy regression: {needle}')

          for tag in ('@version', '@author', '@copyright', '@license'):
              if tag not in team_seasons:
                  raise SystemExit(f'Teaminfo team-seasons metadata missing: {tag}')

          for needle in ('data-jsm-mediawiki', 'data-jsm-mediawiki-content', 'window.alert'):
              if needle not in mediawiki:
                  raise SystemExit(f'Teaminfo MediaWiki asset contract missing: {needle}')

          if 'tmpl/teaminfo/default.php' not in bridge:
              raise SystemExit('Teaminfo compatibility bridge no longer targets native template')
          if 'sportsmanagementHelper::addTemplatePaths' in bridge:
              raise SystemExit('Teaminfo compatibility bridge regressed to legacy template paths')

          print('Native Teaminfo presentation contracts OK')
          PY
