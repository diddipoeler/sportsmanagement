name: Joomla 5/6 native site controller rendering

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/EventsrankingController.php'
      - 'site/src/Controller/JlxmlexportsController.php'
      - 'site/controllers/eventsranking.php'
      - 'site/controllers/jlxmlexports.php'
      - '.github/tests/joomla56_site_controller_view_dispatch.php'
      - '.github/workflows/joomla5-6-site-view-dispatch.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/EventsrankingController.php'
      - 'site/src/Controller/JlxmlexportsController.php'
      - 'site/controllers/eventsranking.php'
      - 'site/controllers/jlxmlexports.php'
      - '.github/tests/joomla56_site_controller_view_dispatch.php'
      - '.github/workflows/joomla5-6-site-view-dispatch.yml'

permissions:
  contents: read

jobs:
  site-rendering:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax and file-level metadata
        run: |
          php .github/tests/phpdoc_metadata.php site/src/Controller/EventsrankingController.php site/src/Controller/JlxmlexportsController.php site/controllers/eventsranking.php site/controllers/jlxmlexports.php
          php -l site/src/Controller/EventsrankingController.php
          php -l site/src/Controller/JlxmlexportsController.php
          php -l site/controllers/eventsranking.php
          php -l site/controllers/jlxmlexports.php
          php -l .github/tests/joomla56_site_controller_view_dispatch.php
      - name: Exercise MVC view dispatch and historical task aliases
        run: php .github/tests/joomla56_site_controller_view_dispatch.php
