name: Joomla 5/6 source editor frontend and quote module guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/SmquotetxtController.php'
      - 'admin/src/Model/SmquotetxtModel.php'
      - 'site/src/Model/UpdsportsmanagementModel.php'
      - 'modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php'
      - '.github/tests/joomla56_source_editor_quote_frontend_guard.php'
      - '.github/workflows/joomla5-6-source-editor-quote-frontend-guard.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/SmquotetxtController.php'
      - 'admin/src/Model/SmquotetxtModel.php'
      - 'site/src/Model/UpdsportsmanagementModel.php'
      - 'modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php'
      - '.github/tests/joomla56_source_editor_quote_frontend_guard.php'
      - '.github/workflows/joomla5-6-source-editor-quote-frontend-guard.yml'

permissions:
  contents: read

jobs:
  quote-safety:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and file-level metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Controller/SmquotetxtController.php
            admin/src/Model/SmquotetxtModel.php
            site/src/Model/UpdsportsmanagementModel.php
            modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php
            .github/tests/joomla56_source_editor_quote_frontend_guard.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Exercise editor permissions and module/frontend input guards
        run: php .github/tests/joomla56_source_editor_quote_frontend_guard.php
