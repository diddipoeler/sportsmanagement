name: Joomla 5/6 sports type statistics gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  sports-type-statistics:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate sports type statistics module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_sports_type_statistics
          manifest="$module/mod_sportsmanagement_sports_type_statistics.xml"
          field=admin/src/Field/SportstypelistField.php

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$module/src/Helper/SportsTypeStatisticsHelper.php"
          test -f "$field"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$module/src/Helper/SportsTypeStatisticsHelper.php"
          php -l "$module/mod_sportsmanagement_sports_type_statistics.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"
          php -l "$field"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementSportsTypeStatistics</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'type="sportstypelist"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q 'SportsTypeStatisticsHelper' "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'getDBConnection' "$module/src/Helper/SportsTypeStatisticsHelper.php"
          grep -q 'class modJSMSportsHelper' "$module/helper.php"

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'Sports type statistics manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$module/src/Helper/SportsTypeStatisticsHelper.php" \
            "$module/mod_sportsmanagement_sports_type_statistics.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php"; then
            echo 'Sports type statistics module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
