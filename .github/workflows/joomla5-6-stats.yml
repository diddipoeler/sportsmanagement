name: Joomla 5/6 stats migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  stats:
    name: Native stats model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stats migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/StatsModel.php
          model_bridge=site/models/stats.php
          view=site/src/View/Stats/HtmlView.php
          view_bridge=site/views/stats/view.html.php
          round_reader=site/src/Model/ProjectRoundReader.php

          for file in "$model" "$model_bridge" "$view" "$view_bridge" "$round_reader"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class StatsModel extends SportsManagementProjectModel' "$model"
          grep -q "class_alias(StatsModel::class, 'sportsmanagementModelStats')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewStats')" "$view_bridge"

          for method in getHighest getSeasonTotals getChartData getTotalRounds getBestAvg getAttendanceRanking getBestAvgTeam getWorstAvg getWorstAvgTeam getChartURL teamNameCmp2 totalattendCmp avgattendCmp capacityCmp utilisationCmp; do
            grep -q "function ${method}" "$model"
          done

          grep -q 'public static int $projectid' "$model"
          grep -q 'public static int $divisionid' "$model"
          grep -q 'sub2.division_id' "$model"
          grep -q 'getStatsChartDataRoute(self::$projectid, self::$divisionid)' "$model"
          grep -q 'new ProjectRoundReader' "$view"
          grep -q 'roundcode' "$view"
          grep -q 'function _setChartdata' "$view"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(|sportsmanagementModelProject::|extends BaseDatabaseModel|extends sportsmanagementView' "$model" "$model_bridge" "$view" "$view_bridge"; then
            echo 'Stats native MVC regressed to a removed Joomla or legacy MVC API' >&2
            exit 1
          fi

          if grep -E -- '\$this->(projectid|divisionid)' "$model"; then
            echo 'Stats model regressed to instance access for static compatibility state' >&2
            exit 1
          fi
