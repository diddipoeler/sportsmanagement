name: Joomla 5/6 Task and season inputs

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/sportsmanagement.php'
      - 'admin/sportsmanagement.php'
      - 'modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php'
      - '.github/tests/joomla56_task_season_inputs.php'
      - '.github/workflows/joomla5-6-task-season-inputs.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/sportsmanagement.php'
      - 'admin/sportsmanagement.php'
      - 'modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php'
      - '.github/tests/joomla56_task_season_inputs.php'
      - '.github/workflows/joomla5-6-task-season-inputs.yml'

permissions:
  contents: read

jobs:
  task-season:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate PHP syntax and metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/sportsmanagement.php
            admin/sportsmanagement.php
            modules/mod_sportsmanagement_act_season/src/Helper/ActSeasonHelper.php
          )
          php .github/tests/phpdoc_metadata.php "${files[@]}"
          for file in "${files[@]}" .github/tests/joomla56_task_season_inputs.php; do
            php -l "$file"
          done

      - name: Validate task and current season inputs
        run: php .github/tests/joomla56_task_season_inputs.php
