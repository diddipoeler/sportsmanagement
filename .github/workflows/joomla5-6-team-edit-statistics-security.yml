name: Joomla 5/6 team editor admin IDs and stats module

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/EditteamModel.php'
      - 'admin/src/Model/ProjectteamsModel.php'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/src/Helper/TeamStatisticsCounterHelper.php'
      - '.github/tests/joomla56_team_edit_admin_statistics_security.php'
      - '.github/workflows/joomla5-6-team-edit-statistics-security.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/EditteamModel.php'
      - 'admin/src/Model/ProjectteamsModel.php'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/src/Helper/TeamStatisticsCounterHelper.php'
      - '.github/tests/joomla56_team_edit_admin_statistics_security.php'
      - '.github/workflows/joomla5-6-team-edit-statistics-security.yml'

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and required file metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Model/EditteamModel.php
            admin/src/Model/ProjectteamsModel.php
            modules/mod_sportsmanagement_teamstatistics_counter/src/Helper/TeamStatisticsCounterHelper.php
          )
          php .github/tests/phpdoc_metadata.php "${files[@]}"
          for file in "${files[@]}"; do php -l "$file"; done
          php -l .github/tests/joomla56_team_edit_admin_statistics_security.php
      - name: Test native team forms, administrator write IDs and statistics selector guards
        shell: bash
        run: |
          set -euo pipefail
          php .github/tests/joomla56_team_edit_admin_statistics_security.php
          php .github/tests/joomla56_editor_admin_module_contract.php
