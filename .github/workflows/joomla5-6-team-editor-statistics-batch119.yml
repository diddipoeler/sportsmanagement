name: Joomla 5/6 team editor statistics batch 119

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/editteam/default.php'
      - 'site/tmpl/editteam/default_details.php'
      - 'site/assets/js/editteam.js'
      - 'admin/tmpl/team/edit.php'
      - 'admin/src/View/Team/HtmlView.php'
      - 'admin/assets/js/team.js'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/mod_sportsmanagement_teamstatistics_counter.xml'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/update-server.xml'
      - '.github/workflows/joomla5-6-team-editor-statistics-batch119.yml'
  pull_request:
    branches: [joomla5-6]
    paths:
      - 'site/tmpl/editteam/default.php'
      - 'site/tmpl/editteam/default_details.php'
      - 'site/assets/js/editteam.js'
      - 'admin/tmpl/team/edit.php'
      - 'admin/src/View/Team/HtmlView.php'
      - 'admin/assets/js/team.js'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/mod_sportsmanagement_teamstatistics_counter.xml'
      - 'modules/mod_sportsmanagement_teamstatistics_counter/update-server.xml'
      - '.github/workflows/joomla5-6-team-editor-statistics-batch119.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Validate Joomla 5/6 batch 119
        shell: bash
        run: |
          set -euo pipefail

          site_layout=site/tmpl/editteam/default.php
          site_details=site/tmpl/editteam/default_details.php
          site_js=site/assets/js/editteam.js
          admin_layout=admin/tmpl/team/edit.php
          admin_view=admin/src/View/Team/HtmlView.php
          admin_js=admin/assets/js/team.js
          manifest=modules/mod_sportsmanagement_teamstatistics_counter/mod_sportsmanagement_teamstatistics_counter.xml
          update_xml=modules/mod_sportsmanagement_teamstatistics_counter/update-server.xml

          php -l "$site_layout"
          php -l "$site_details"
          php -l "$admin_layout"
          php -l "$admin_view"
          node --check "$site_js"
          node --check "$admin_js"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$manifest"
          php -r '$xml = simplexml_load_file($argv[1]); if ($xml === false) { exit(1); }' "$update_xml"

          grep -Fq 'data-jsm-editteam-form' "$site_layout"
          grep -Fq 'data-jsm-task="editteam.apply"' "$site_layout"
          grep -Fq 'data-jsm-task="editteam.save"' "$site_layout"
          grep -Fq 'class="form-label"' "$site_details"
          grep -Fq "document.querySelector('[data-jsm-editteam-form]')" "$site_js"
          if grep -Eq 'adminform|admintable|class="key"|onclick=|onchange=' "$site_layout" "$site_details"; then
            echo 'Frontend team editor regressed to legacy markup or inline handlers' >&2
            exit 1
          fi

          grep -Fq "HTMLHelper::_('uitab.startTabSet'" "$admin_layout"
          grep -Fq 'class="options-form' "$admin_layout"
          grep -Fq 'class="form-label"' "$admin_layout"
          grep -Fq 'data-jsm-auto-submit="team.apply"' "$admin_layout"
          grep -Fq "registerAndUseScript(" "$admin_view"
          grep -Fq "'com_sportsmanagement.admin.team'" "$admin_view"
          grep -Fq "document.getElementById('team-form')" "$admin_js"
          grep -Fq "trigger.dataset.jsmAutoSubmit" "$admin_js"
          if grep -Eq 'control-group|control-label|class="controls"|onclick=|onchange=' "$admin_layout"; then
            echo 'Administrator team editor regressed to Joomla 3 form markup or inline handlers' >&2
            exit 1
          fi
          if grep -Fq "\$('adminForm')" "$admin_js"; then
            echo 'Administrator team JavaScript regressed to a MooTools-style selector' >&2
            exit 1
          fi

          grep -Fq '<version>5.6.0</version>' "$manifest"
          grep -Fq '<field type="extensionversion" version="5.6.0" />' "$manifest"
          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementTeamStatisticsCounter</namespace>' "$manifest"
          grep -Fq '<option value="table table-sm">' "$manifest"
          grep -Fq 'name="title_size" type="number"' "$manifest"
          grep -Fq 'name="text_size" type="number"' "$manifest"
          grep -Fq '<version>5.6.0</version>' "$update_xml"
          grep -Fq '<targetplatform name="joomla" version="[56].*" />' "$update_xml"
          grep -Fq '<php_minimum>8.1.0</php_minimum>' "$update_xml"

          echo 'Joomla 5/6 batch 119 contracts OK'
