name: Joomla 5/6 teaminfo migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  teaminfo:
    name: Native teaminfo model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate teaminfo migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/TeaminfoModel.php
          model_bridge=site/models/teaminfo.php
          view=site/src/View/Teaminfo/HtmlView.php
          view_bridge=site/views/teaminfo/view.html.php
          legacy_consumer=site/views/leaguechampionoverview/view.html.php

          for file in "$model" "$model_bridge" "$view" "$view_bridge"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class TeaminfoModel extends SportsManagementProjectModel' "$model"
          grep -q "class_alias(TeaminfoModel::class, 'sportsmanagementModelTeamInfo')" "$model_bridge"
          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewTeamInfo')" "$view_bridge"

          for method in getTeam getTrainigData getTrainingData getClub getTeamByProject updateHits getSeasons getTeamRanking getLeague getPlayerCount getPlayerMeanAge getPlayerMarketValue getLeagueRankOverviewDetail getLeagueRankOverview getMergeClubs hasEditPermission; do
            grep -q "function ${method}" "$model"
          done

          grep -q 'public static int $projectid' "$model"
          grep -q 'public static int $projectteamid' "$model"
          grep -q 'public static int $teamid' "$model"
          grep -q 'public static $team = null' "$model"
          grep -q 'public static $club = null' "$model"
          grep -q 'public static int $cfg_which_database' "$model"
          grep -q 't.id AS teamid, t.id AS id' "$model"
          grep -q 'getIdentity()' "$model"
          grep -q 'getDBConnection(true, self::$cfg_which_database)' "$model"
          grep -q 'JSMRanking::getInstance' "$model"
          grep -q "updateObject('#__sportsmanagement_project'" "$model"

          grep -q 'TeaminfoModel::getTeamByProject(1)' "$view"
          grep -q "hasEditPermission('projectteam.edit')" "$view"
          grep -q 'TeaminfoModel::getSeasons' "$view"
          grep -q 'TeaminfoModel::getLeagueRankOverview' "$view"
          grep -q 'TeaminfoModel::getLeagueRankOverviewDetail' "$view"
          grep -q 'public array $output = \[\]' "$view"

          # Keep compatibility with leaguechampionoverview until that legacy view is migrated.
          grep -q '\$mdlTeaminfo::getTeam(0,\$this->champion->_teamid)' "$legacy_consumer"
          grep -q '\$mdlTeaminfo::$team = null' "$legacy_consumer"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(|sportsmanagementModelProject::|extends BaseDatabaseModel|extends sportsmanagementView' "$model" "$model_bridge" "$view" "$view_bridge"; then
            echo 'Teaminfo native MVC regressed to a removed Joomla or legacy MVC API' >&2
            exit 1
          fi

          if grep -E -- 'sportsmanagementModelTeamInfo::|sportsmanagementModelProject::' "$view"; then
            echo 'Native teaminfo view depends on a legacy model implementation' >&2
            exit 1
          fi
