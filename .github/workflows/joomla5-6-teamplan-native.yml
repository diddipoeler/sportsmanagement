name: Joomla 5/6 native teamplan gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  native-teamplan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native teamplan MVC slice
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/TeamplanModel.php
          event_trait=site/src/Model/TeamplanEventDataTrait.php
          view=site/src/View/Teamplan/HtmlView.php
          project_facade=site/src/Legacy/TeamplanProjectFacade.php
          comments_facade=site/src/Legacy/TeamplanCommentsFacade.php
          html_facade=site/src/Legacy/TeamplanHtmlFacade.php
          legacy_bootstrap=site/src/Legacy/LegacyBootstrap.php
          project_view_base=site/src/View/SportsManagementProjectHtmlView.php
          entry_template=site/views/teamplan/tmpl/default.php
          plan_template=site/views/teamplan/tmpl/default_plan.php
          sorted_template=site/views/teamplan/tmpl/default_plan_sorted_by_date.php
          mvc_factory=admin/src/Service/SportsManagementMVCFactory.php

          for file in \
            "$model" \
            "$event_trait" \
            "$view" \
            "$project_facade" \
            "$comments_facade" \
            "$html_facade" \
            "$legacy_bootstrap" \
            "$project_view_base" \
            "$entry_template" \
            "$plan_template" \
            "$sorted_template" \
            "$mvc_factory"; do
            test -f "$file"
          done

          php -l "$model"
          php -l "$event_trait"
          php -l "$view"
          php -l "$project_facade"
          php -l "$comments_facade"
          php -l "$html_facade"
          php -l "$legacy_bootstrap"
          php -l "$entry_template"
          php -l "$plan_template"
          php -l "$sorted_template"

          grep -Fq 'final class TeamplanModel extends SportsManagementProjectModel' "$model"
          grep -Fq 'use TeamplanEventDataTrait;' "$model"
          grep -Fq 'trait TeamplanEventDataTrait' "$event_trait"
          grep -Fq 'public function getMatchEvents(' "$event_trait"
          grep -Fq 'public function getMatchSubstitutions(' "$event_trait"
          grep -Fq '#__sportsmanagement_match_event' "$event_trait"
          grep -Fq '#__sportsmanagement_match_commentary' "$event_trait"
          grep -Fq '#__sportsmanagement_match_player' "$event_trait"

          grep -Fq 'final class TeamplanProjectFacade' "$project_facade"
          grep -Fq 'self::model()->getMatchEvents' "$project_facade"
          grep -Fq 'self::model()->getMatchSubstitutions' "$project_facade"
          grep -Fq 'public static function getClubIconHtml(' "$project_facade"
          grep -Fq 'TeamplanHtmlFacade::getBootstrapModalImage' "$project_facade"

          grep -Fq 'final class TeamplanCommentsFacade' "$comments_facade"
          grep -Fq 'DatabaseInterface::class' "$comments_facade"
          grep -Fq 'SiteRouteHelper::view' "$comments_facade"
          grep -Fq 'public static function CreateInstance(' "$comments_facade"
          grep -Fq 'public function showMatchCommentIcon(' "$comments_facade"
          grep -Fq "ComponentHelper::isEnabled('com_kunena')" "$comments_facade"
          grep -Fq "ComponentHelper::isEnabled('com_jcomments')" "$comments_facade"

          grep -Fq 'final class TeamplanHtmlFacade' "$html_facade"
          grep -Fq 'public static function showEventsContainerInResults(' "$html_facade"
          grep -Fq 'public static function getBootstrapModalImage(' "$html_facade"
          grep -Fq 'public static function showMatchTime(' "$html_facade"
          grep -Fq 'public static function showDivisonRemark(' "$html_facade"
          grep -Fq 'public static function showMatchPlayground(' "$html_facade"
          grep -Fq 'public static function getThumbUpDownImg(' "$html_facade"
          grep -Fq 'DatabaseInterface::class' "$html_facade"
          grep -Fq "SiteRouteHelper::view('ranking'" "$html_facade"
          grep -Fq "SiteRouteHelper::view('playground'" "$html_facade"

          grep -Fq 'final class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -Fq "JPATH_SITE . '/components/com_sportsmanagement/views/teamplan/tmpl'" "$view"
          grep -Fq 'Teamplan view requires TeamplanModel.' "$view"
          grep -Fq "class_alias(TeamplanProjectFacade::class, 'sportsmanagementModelProject')" "$view"
          grep -Fq "class_alias(TeamplanCommentsFacade::class, 'sportsmanagementModelComments')" "$view"
          grep -Fq "class_alias(TeamplanHtmlFacade::class, 'sportsmanagementHelperHtml')" "$view"
          grep -Fq 'TeamplanProjectFacade::setModel($model);' "$view"
          grep -Fq 'TeamplanHtmlFacade::$project = $this->project;' "$view"
          grep -Fq 'TeamplanHtmlFacade::$teams = $this->teams;' "$view"
          grep -Fq "views/globalviews/tmpl" "$project_view_base"

          # Teamplan no longer boots the legacy MVC/presentation stack. Its old
          # HTML and comments class names are satisfied by narrow native facades.
          if grep -Fq 'LegacyBootstrap' "$view"; then
            echo 'Native teamplan view regressed to LegacyBootstrap.' >&2
            exit 1
          fi

          if grep -Fq 'bootPresentationForView' "$legacy_bootstrap"; then
            echo 'Obsolete teamplan presentation bootstrap was restored.' >&2
            exit 1
          fi

          for legacy_include in 'helpers.comments' 'helpers.html' 'site/helpers/comments.php' 'site/helpers/html.php'; do
            if grep -Fq "$legacy_include" "$view"; then
              echo "Native teamplan view directly loads a historical presentation helper: $legacy_include" >&2
              exit 1
            fi
          done

          grep -Fq 'sportsmanagementModelComments::CreateInstance' "$plan_template"
          grep -Fq 'sportsmanagementHelperHtml::showEventsContainerInResults' "$plan_template"
          grep -Fq 'sportsmanagementHelperHtml::showEventsContainerInResults' "$sorted_template"

          # The generic sportsmanagementHelper is the final remaining lazy
          # presentation dependency. Keep its current team/name surface explicit.
          grep -Fq 'sportsmanagementHelper::getPictureThumb' "$html_facade"
          grep -Fq 'sportsmanagementHelper::formatName' "$html_facade"
          grep -Fq 'sportsmanagementHelper::getTeamMatchResult' "$html_facade"

          # Until the two large historical tmpl files are rewritten, their three
          # project-class calls stay behind the intentionally narrow facade.
          grep -Fq 'sportsmanagementModelProject::getMatchEvents' "$plan_template"
          grep -Fq 'sportsmanagementModelProject::getMatchSubstitutions' "$plan_template"
          grep -Fq 'sportsmanagementModelProject::getClubIconHtml' "$plan_template"
          grep -Fq 'sportsmanagementModelProject::getMatchEvents' "$sorted_template"
          grep -Fq 'sportsmanagementModelProject::getMatchSubstitutions' "$sorted_template"
          grep -Fq 'sportsmanagementModelProject::getClubIconHtml' "$sorted_template"

          # Joomla must resolve the native MVC classes before the compatibility
          # factory considers loading historical site model/view files.
          grep -Fq 'parent::createModel($name, $prefix, $config)' "$mvc_factory"
          grep -Fq 'parent::createView($name, $prefix, $type, $config)' "$mvc_factory"
          grep -Fq 'loadLegacyModel' "$mvc_factory"
          grep -Fq 'loadLegacyView' "$mvc_factory"

          if grep -Fq 'sportsmanagementViewTeamPlan' "$view"; then
            echo 'Native teamplan view regressed to the legacy global view class.' >&2
            exit 1
          fi

          if grep -Eq 'require(_once)?[^;]*views/teamplan/view\.html\.php' "$view"; then
            echo 'Native teamplan view directly reloads the legacy view file.' >&2
            exit 1
          fi

          if grep -Fq 'sportsmanagementHelper::addTemplatePaths' "$entry_template"; then
            echo 'Teamplan entry template regressed to legacy template path registration.' >&2
            exit 1
          fi

          # Project context and all teamplan data access are native Joomla model
          # responsibilities. Event/substitution queries live in the native trait.
          grep -Fq '$this->getDatabase()' "$model"
          grep -Fq '$this->getRounds($this->normaliseOrdering($ordering), true)' "$model"
          grep -Fq '$this->getProjectTeams(0)' "$model"
          grep -Fq 'return $this->getFavTeams();' "$model"
          grep -Fq "#__sportsmanagement_position_eventtype" "$model"
          grep -Fq "#__sportsmanagement_project_position" "$model"
          grep -Fq "loadObjectList('id')" "$model"
          grep -Fq -- "->from(\$db->quoteName('#__sportsmanagement_project_team', 'pt'))" "$model"
          grep -Fq 'return $this->getDivision();' "$model"
          grep -Fq 'private function loadPlanMatches(' "$model"
          grep -Fq 'private function loadRoundMatches(' "$model"
          grep -Fq 'private function loadRefereesByMatch(array $matches): void' "$model"
          grep -Fq "#__sportsmanagement_match_referee" "$model"
          grep -Fq "#__sportsmanagement_match" "$model"
          grep -Fq "#__sportsmanagement_round" "$model"
          grep -Fq "#__sportsmanagement_playground" "$model"

          for file in "$model" "$event_trait"; do
            for legacy in \
              'LegacyBootstrap' \
              'sportsmanagementModelProject' \
              'sportsmanagementModelTeamPlan' \
              '/components/com_sportsmanagement/models/teamplan.php' \
              '/components/com_sportsmanagement/models/project.php'; do
              if grep -Fq "$legacy" "$file"; then
                echo "Native teamplan data layer regressed to legacy dependency: $legacy ($file)" >&2
                exit 1
              fi
            done
          done
