name: Joomla 5/6 team players dependency guard batch 410

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_teamplayers/helper.php'
      - '.github/workflows/joomla5-6-teamplayers-dependency-guard-batch410.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_teamplayers/helper.php'
      - '.github/workflows/joomla5-6-teamplayers-dependency-guard-batch410.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate TeamPlayers dependency guard
        shell: bash
        run: |
          set -euo pipefail
          file=modules/mod_sportsmanagement_teamplayers/helper.php
          php -l "$file"
          for tag in '@version' '@author' '@copyright' '@license'; do
            grep -Fq -- "$tag" "$file"
          done
          grep -Fq -- '@version    5.6.0' "$file"
          grep -Fq -- 'SiteRouteHelper::class' "$file"
          grep -Fq -- 'SportsManagementDatabaseResolver::class' "$file"
          grep -Fq -- 'SportsManagementSiteApplicationResolver::class' "$file"
          grep -Fq -- 'TeamPlayersHelper::class => __DIR__' "$file"
          grep -Fq -- 'throw new \RuntimeException' "$file"
