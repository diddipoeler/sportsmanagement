name: Joomla 5/6 Team Players Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  teamplayers:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate team players module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_teamplayers
          provider="$module/services/provider.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/TeamPlayersHelper.php"
          entry="$module/mod_sportsmanagement_teamplayers.php"
          template="$module/tmpl/default.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php
          route_helper=site/src/Helper/SiteRouteHelper.php

          test -f "$provider"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$resolver"
          test -f "$route_helper"

          php -l "$provider"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$entry"
          php -l "$template"
          php -l "$resolver"
          php -l "$route_helper"

          grep -Fq 'minutesPlayedByPlayer' "$helper"
          grep -Fq 'array_fill_keys' "$helper"
          grep -Fq "group(\$db->quoteName('mp.teamplayer_id'))" "$helper"
          grep -Fq "group(\$db->quoteName('mp.in_for'))" "$helper"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq 'SiteRouteHelper::view' "$helper"
          grep -Fq 'SportsManagementDatabaseResolver' "$resolver"

          ! grep -Fq 'getDBConnection' "$helper"
          ! grep -Fq 'sportsmanagementHelper' "$helper"
          ! grep -Fq 'require_once' "$helper"
          ! grep -Fq 'private function minutesPlayed(' "$helper"
          ! grep -Fq 'http_build_query' "$helper"
          ! grep -Fq 'Joomla\CMS\Router\Route' "$helper"

          if awk '/foreach \(\$rosterRows as \$row\)/,/usort\(\$players/' "$helper" | grep -E 'setQuery\(|load(Result|Object|ObjectList)\('; then
            echo 'Team players roster loop contains a database query (N+1 regression).' >&2
            exit 1
          fi

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(|sportsmanagementHelper::getDBConnection' \
            "$provider" \
            "$dispatcher" \
            "$helper" \
            "$entry" \
            "$module/tmpl"; then
            echo 'Team players module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          ! grep -REn 'Factory::getConfig\(|Factory::getDbo\(|JDatabaseDriver|JDatabase::' "$resolver"
