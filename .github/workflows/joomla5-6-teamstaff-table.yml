name: Joomla 5/6 team staff table

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/TeamstaffModel.php'
      - 'admin/src/Table/TeamstaffTable.php'
      - 'admin/tables/teamstaff.php'
      - '.github/workflows/joomla5-6-teamstaff-table.yml'
  pull_request:
    branches: [master]
    paths:
      - 'admin/src/Model/TeamstaffModel.php'
      - 'admin/src/Table/TeamstaffTable.php'
      - 'admin/tables/teamstaff.php'
      - '.github/workflows/joomla5-6-teamstaff-table.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint team staff slice
        shell: bash
        run: |
          set -euo pipefail
          php -l admin/src/Model/TeamstaffModel.php
          php -l admin/src/Table/TeamstaffTable.php
          php -l admin/tables/teamstaff.php

      - name: Validate native table contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'final class TeamstaffTable extends SportsManagementTable' admin/src/Table/TeamstaffTable.php
          grep -Fq "parent::__construct('#__sportsmanagement_team_staff', 'id', \$db)" admin/src/Table/TeamstaffTable.php
          grep -Fq 'new TeamstaffTable($this->getDatabase())' admin/src/Model/TeamstaffModel.php
          grep -Fq "class_alias(TeamstaffTable::class, 'sportsmanagementTableTeamStaff')" admin/tables/teamstaff.php

          legacy_re='JLoader::|jimport\(|Factory::getDbo\(|Factory::getDBO\(|BaseDatabaseModel::getInstance\(|Table::getInstance\('
          if grep -ER "$legacy_re" \
            admin/src/Model/TeamstaffModel.php \
            admin/src/Table/TeamstaffTable.php \
            admin/tables/teamstaff.php; then
            echo 'Team staff slice regressed to a legacy Joomla API' >&2
            exit 1
          fi
