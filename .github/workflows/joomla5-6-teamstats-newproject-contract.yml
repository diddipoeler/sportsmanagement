name: Joomla 5/6 TeamStats and NewProject contracts

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_teamstats_ranking/src/Helper/TeamStatsRankingHelper.php'
      - 'modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php'
      - '.github/tests/joomla56_teamstats_newproject_contract.php'
      - '.github/workflows/joomla5-6-teamstats-newproject-contract.yml'
  pull_request:
    paths:
      - 'modules/mod_sportsmanagement_teamstats_ranking/src/Helper/TeamStatsRankingHelper.php'
      - 'modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php'
      - '.github/tests/joomla56_teamstats_newproject_contract.php'
      - '.github/workflows/joomla5-6-teamstats-newproject-contract.yml'

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Check PHP syntax and file headers
        shell: bash
        run: |
          set -euo pipefail
          files=(
            modules/mod_sportsmanagement_teamstats_ranking/src/Helper/TeamStatsRankingHelper.php
            modules/mod_sportsmanagement_new_project/src/Helper/NewProjectHelper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php -l .github/tests/joomla56_teamstats_newproject_contract.php
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Test portable slugs, selectors and database service
        run: php .github/tests/joomla56_teamstats_newproject_contract.php
