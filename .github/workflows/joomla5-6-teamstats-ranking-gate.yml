name: Joomla 5/6 Team Stats Ranking Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate team stats ranking module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_teamstats_ranking
          manifest="$module/mod_sportsmanagement_teamstats_ranking.xml"
          provider="$module/services/provider.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/TeamStatsRankingHelper.php"
          bridge="$module/helper.php"
          entry="$module/mod_sportsmanagement_teamstats_ranking.php"
          template="$module/tmpl/default.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php

          php -l "$provider"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$bridge"
          php -l "$entry"
          php -l "$template"
          php -l "$resolver"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_teamstats_ranking/mod_sportsmanagement_teamstats_ranking.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementTeamStatsRanking</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_teamstats_ranking">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'type="number"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          ! grep -Fq 'version="2.5"' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"
          ! grep -Fq 'table-condensed' "$manifest"

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'registerAndUseStyle' "$dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq "case 'sumevents':" "$helper"
          grep -Fq "case 'pergame':" "$helper"
          grep -Fq "case 'eventpergame':" "$helper"
          grep -Fq "case 'difference':" "$helper"
          grep -Fq "case 'percentage':" "$helper"
          grep -Fq "case 'complexsumpergame':" "$helper"
          grep -Fq "case 'winpergame':" "$helper"
          grep -Fq 'getDBConnection' /dev/null || true
          grep -Fq 'SportsManagementDatabaseResolver' "$resolver"
          grep -Fq 'DatabaseFactory' "$resolver"
          grep -Fq 'hash_equals' "$resolver"

          ! grep -REn 'sportsmanagementModelProject|SMStatistic::|BaseDatabaseModel::getInstance|JLoader::|jimport\(|Factory::get(Document|Language|User|Config|Dbo)\(|Factory::getApplication\(\)->input|->disconnect\(|class_alias\(' \
            "$module/services" \
            "$module/src" \
            "$entry" \
            "$bridge" \
            "$template"

          ! grep -REn 'ComponentHelper|DatabaseFactory|jsm_host|jsm_password|jsm_dbprefix' "$helper"
          ! grep -REn 'Factory::getConfig\(|Factory::getDbo\(|JDatabaseDriver|JDatabase::' "$resolver"
