name: Joomla 5/6 teamstats migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  teamstats:
    name: Native teamstats model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate teamstats migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/TeamstatsModel.php
          bridge=site/models/teamstats.php
          round_reader=site/src/Model/ProjectRoundReader.php
          view=site/src/View/Teamstats/HtmlView.php
          view_bridge=site/views/teamstats/view.html.php
          module=modules/mod_sportsmanagement_teamstatistics_counter/helper.php

          for file in "$model" "$bridge" "$round_reader" "$view" "$view_bridge" "$module"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class TeamstatsModel extends SportsManagementProjectModel' "$model"
          grep -q "class_alias(TeamstatsModel::class, 'sportsmanagementModelTeamStats')" "$bridge"
          grep -q 'final class ProjectRoundReader' "$round_reader"
          grep -q 'function getCurrentRoundId' "$round_reader"
          grep -q 'function getCurrentRound' "$round_reader"
          grep -q 'function getRounds' "$round_reader"
          grep -q "updateObject('#__sportsmanagement_project'" "$round_reader"

          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewTeamStats')" "$view_bridge"
          grep -q 'new ProjectRoundReader' "$view"
          grep -q 'getCurrentRoundId' "$view"
          grep -q 'function _setChartdata' "$view"
          grep -q "public string \$chart_version = '2.7.3'" "$view"

          for method in getTeam getHighest getNoGoalsAgainst getSeasonTotals getMatchDayTotals getTotalRounds getBestAttendance _getAttendance getWorstAttendance getTotalAttendance getAverageAttendance getChartURL getLogo getResults getChartData getStats; do
            grep -q "function ${method}" "$model"
          done

          grep -q 'public static int $projectid' "$model"
          grep -q 'public static int $teamid' "$model"
          grep -q 'public static int $projectteamid' "$model"
          grep -q 'getRosterTotalStats(self::$teamid, self::$projectid)' "$model"
          grep -q 'sportsmanagementModelTeamStats::$projectid' "$module"
          grep -q 'sportsmanagementModelTeamStats::$teamid' "$module"
          grep -q 'sportsmanagementModelTeamStats::getHighest' "$module"
          grep -q 'sportsmanagementModelTeamStats::getResults' "$module"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(|sportsmanagementModelProject::getProjectStats|version_compare\(JVERSION' "$model" "$bridge" "$round_reader" "$view" "$view_bridge"; then
            echo 'Teamstats native MVC regressed to a removed Joomla or legacy project API' >&2
            exit 1
          fi

          if grep -E -- 'Factory::getApplication\(.*\)->input|\$app->input|disconnect\(' "$module"; then
            echo 'Team statistics counter regressed to a removed Joomla compatibility API' >&2
            exit 1
          fi

          if grep -E -- '\$this->(teamid|projectid)' "$model"; then
            echo 'Teamstats model regressed to instance access for static compatibility state' >&2
            exit 1
          fi

          if grep -E -- 'sportsmanagementModelProject::|extends sportsmanagementView' "$view"; then
            echo 'Native teamstats view depends on a legacy project/view implementation' >&2
            exit 1
          fi
