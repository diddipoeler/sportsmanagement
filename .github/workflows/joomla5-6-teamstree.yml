name: Joomla 5/6 teamstree migration gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  teamstree:
    name: Native teamstree model and view checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate teamstree migration
        shell: bash
        run: |
          set -euo pipefail

          model=site/src/Model/TeamstreeModel.php
          model_bridge=site/models/teamstree.php
          view=site/src/View/Teamstree/HtmlView.php
          view_bridge=site/views/teamstree/view.html.php
          template=site/views/teamstree/tmpl/default.php
          clubinfo_model=site/src/Model/ClubinfoModel.php

          for file in "$model" "$model_bridge" "$view" "$view_bridge" "$template" "$clubinfo_model"; do
            test -f "$file"
            php -l "$file"
          done

          grep -q 'class TeamstreeModel extends SportsManagementProjectModel' "$model"
          grep -q 'function getTeamsForTree' "$model"
          grep -q 'getProjectTeams($this->getDivisionId())' "$model"
          grep -q "class_alias(TeamstreeModel::class, 'sportsmanagementModelTeamstree')" "$model_bridge"

          grep -q 'class HtmlView extends SportsManagementProjectHtmlView' "$view"
          grep -q 'use Diddipoeler\Component\SportsManagement\Site\Model\ClubinfoModel;' "$view"
          grep -q 'use Diddipoeler\Component\SportsManagement\Site\Model\TeamstreeModel;' "$view"
          grep -q 'ClubinfoModel::$cfg_which_database = $this->databaseSelector' "$view"
          grep -q 'ClubinfoModel::getFirstClubId' "$view"
          grep -q 'ClubinfoModel::getClubHistoryHTML' "$view"
          grep -q 'ClubinfoModel::fbTreeRecurse' "$view"
          grep -q 'ClubinfoModel::generateTree' "$view"
          grep -q 'ClubinfoModel::getFirstClub' "$view"
          grep -q 'processedClubs' "$view"
          grep -q "class_alias(HtmlView::class, 'sportsmanagementViewTeamsTree')" "$view_bridge"

          grep -q '\$this->familyteamstree' "$template"
          grep -q '\$this->familyclub' "$template"
          grep -q '\$this->findclub' "$template"

          if grep -E -- 'Factory::getUser\(|Factory::getDbo\(|->getDbo\(|->setDbo\(|->input|->getCfg\(|->getErrorMsg\(|jimport\(|JLoader::import\(|disconnect\(|BaseDatabaseModel::getInstance|sportsmanagementModelProject::|sportsmanagementModelClubInfo::|extends BaseDatabaseModel|extends sportsmanagementView' "$model" "$model_bridge" "$view" "$view_bridge" "$template"; then
            echo 'Teamstree native MVC regressed to a removed Joomla or legacy MVC API' >&2
            exit 1
          fi
