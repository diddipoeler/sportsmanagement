name: Joomla 5/6 Top Tipper Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate top tipper module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_top_tipper
          manifest="$module/mod_sportsmanagement_top_tipper.xml"
          helper="$module/src/Helper/TopTipperHelper.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          template="$module/tmpl/default.php"
          ranking_model=site/src/Model/PredictionrankingModel.php
          base_model=site/src/Model/SportsManagementModel.php
          field=admin/src/Field/PredictiongameField.php

          php -l "$module/services/provider.php"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$module/helper.php"
          php -l "$module/mod_sportsmanagement_top_tipper.php"
          php -l "$template"
          php -l "$ranking_model"
          php -l "$base_model"
          php -l "$field"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_top_tipper/mod_sportsmanagement_top_tipper.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementTopTipper</namespace>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'type="predictiongame"' "$manifest"
          grep -Fq 'type="number" min="1" default="5"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          ! grep -Fq 'version="2.5"' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"
          ! grep -Fq 'table-condensed' "$manifest"

          grep -Fq "createModel(" "$helper"
          grep -Fq "'Predictionranking'" "$helper"
          grep -Fq 'setDatabaseSelector' "$helper"
          grep -Fq 'getRankingData' "$helper"
          grep -Fq "\$rankingConfig['show_all_user'] = 1" "$helper"
          grep -Fq 'public function setDatabaseSelector' "$base_model"
          grep -Fq 'Ranking display is deliberately read-only' "$ranking_model"
          ! grep -Fq 'savePredictionPoints(' "$ranking_model"

          ! grep -REn 'sportsmanagementModelPrediction|BaseDatabaseModel::getInstance|JLoader::|jimport\(|Factory::get(Document|Language|User|Config|Dbo)\(|Factory::getApplication\(\)->input|version_compare\(|savePredictionPoints\(' \
            "$module/services" \
            "$module/src" \
            "$module/mod_sportsmanagement_top_tipper.php" \
            "$module/helper.php" \
            "$template"
