name: Joomla 5/6 trainings data gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - joomla5-6

jobs:
  trainingsdata:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate trainings data module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_trainingsdata
          manifest="$module/mod_sportsmanagement_trainingsdata.xml"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/TrainingsDataHelper.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php

          test -f "$module/services/provider.php"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$resolver"

          php -l "$module/services/provider.php"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$module/mod_sportsmanagement_trainingsdata.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"
          php -l "$resolver"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementTrainingsData</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -Fq 'use Joomla\CMS\Document\HtmlDocument;' "$dispatcher"
          grep -Fq 'instanceof HtmlDocument' "$dispatcher"
          grep -q 'registerAndUseStyle' "$dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -q 'intdiv' "$module/tmpl/default.php"
          grep -q 'htmlspecialchars' "$module/tmpl/default.php"

          if grep -q 'version="2.5"' "$manifest"; then
            echo 'Trainings data manifest regressed to Joomla 2.5 metadata.' >&2
            exit 1
          fi

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'Trainings data manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E 'sportsmanagementHelper::getDBConnection|components/com_sportsmanagement/helpers/sportsmanagement\.php|Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$dispatcher" \
            "$helper" \
            "$module/mod_sportsmanagement_trainingsdata.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php"; then
            echo 'Trainings data module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
