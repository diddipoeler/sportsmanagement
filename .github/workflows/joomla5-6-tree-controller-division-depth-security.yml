name: Joomla 5/6 tournament-tree write ACL division scope and depth

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/TreetoController.php'
      - 'admin/src/Controller/TreetonodeController.php'
      - 'admin/src/Controller/TreetosController.php'
      - 'admin/src/Model/TreetoModel.php'
      - 'admin/src/Model/TreetonodesModel.php'
      - 'admin/src/Model/TreetosModel.php'
      - '.github/tests/joomla56_tree_controller_division_depth_security.php'
      - '.github/workflows/joomla5-6-tree-controller-division-depth-security.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/TreetoController.php'
      - 'admin/src/Controller/TreetonodeController.php'
      - 'admin/src/Controller/TreetosController.php'
      - 'admin/src/Model/TreetoModel.php'
      - 'admin/src/Model/TreetonodesModel.php'
      - 'admin/src/Model/TreetosModel.php'
      - '.github/tests/joomla56_tree_controller_division_depth_security.php'
      - '.github/workflows/joomla5-6-tree-controller-division-depth-security.yml'

permissions:
  contents: read

jobs:
  tree-guards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint and audit PHP metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Controller/TreetoController.php
            admin/src/Controller/TreetonodeController.php
            admin/src/Controller/TreetosController.php
            admin/src/Model/TreetoModel.php
            admin/src/Model/TreetonodesModel.php
            admin/src/Model/TreetosModel.php
            .github/tests/joomla56_tree_controller_division_depth_security.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Run tournament-tree ACL and depth regression
        run: php .github/tests/joomla56_tree_controller_division_depth_security.php
