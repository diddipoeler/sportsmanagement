name: Joomla 5/6 tree assignments and administrator XML exports

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/TreetomatchController.php'
      - 'admin/src/Model/TreetomatchsModel.php'
      - 'admin/src/Controller/JlxmlexportsController.php'
      - 'admin/src/Model/JlxmlexportsModel.php'
      - '.github/tests/joomla56_treetomatch_assignment_write_scope.php'
      - '.github/tests/joomla56_admin_xml_export_access.php'
      - '.github/workflows/joomla5-6-treetomatch-xml-export-scope.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/TreetomatchController.php'
      - 'admin/src/Model/TreetomatchsModel.php'
      - 'admin/src/Controller/JlxmlexportsController.php'
      - 'admin/src/Model/JlxmlexportsModel.php'
      - '.github/tests/joomla56_treetomatch_assignment_write_scope.php'
      - '.github/tests/joomla56_admin_xml_export_access.php'
      - '.github/workflows/joomla5-6-treetomatch-xml-export-scope.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax and required copyright metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Controller/TreetomatchController.php
            admin/src/Model/TreetomatchsModel.php
            admin/src/Controller/JlxmlexportsController.php
            admin/src/Model/JlxmlexportsModel.php
            .github/tests/joomla56_treetomatch_assignment_write_scope.php
            .github/tests/joomla56_admin_xml_export_access.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/tests/phpdoc_metadata.php "${files[@]}"
      - name: Test tournament-tree match scope
        run: php .github/tests/joomla56_treetomatch_assignment_write_scope.php
      - name: Test administrator XML export access
        run: php .github/tests/joomla56_admin_xml_export_access.php
