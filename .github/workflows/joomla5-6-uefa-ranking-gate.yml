name: Joomla 5/6 UEFA ranking gate

on:
  push:
    branches:
      - joomla5-6
  pull_request:
    branches:
      - master

jobs:
  uefa-ranking:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate UEFA ranking module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_uefawertung
          manifest="$module/mod_sportsmanagement_uefawertung.xml"
          helper="$module/src/Helper/UefaWertungHelper.php"

          test -f "$module/services/provider.php"
          test -f "$module/src/Dispatcher/Dispatcher.php"
          test -f "$helper"

          php -l "$module/services/provider.php"
          php -l "$module/src/Dispatcher/Dispatcher.php"
          php -l "$helper"
          php -l "$module/mod_sportsmanagement_uefawertung.php"
          php -l "$module/helper.php"
          php -l "$module/tmpl/default.php"

          grep -q '<namespace path="src">Diddipoeler\\Module\\SportsManagementUefaWertung</namespace>' "$manifest"
          grep -q 'addfieldprefix="Diddipoeler\\Component\\SportsManagement\\Administrator\\Field"' "$manifest"
          grep -q 'ModuleDispatcherFactory' "$module/services/provider.php"
          grep -q 'registerAndUseStyle' "$module/src/Dispatcher/Dispatcher.php"
          grep -q 'rankingSeasons' "$helper"
          grep -q 'array_intersect_key' "$helper"
          grep -q 'getDBConnection' "$helper"
          grep -q '\$ranking\[' "$module/tmpl/default.php"

          if grep -q 'version="2.5"' "$manifest"; then
            echo 'UEFA ranking manifest regressed to Joomla 2.5 metadata.' >&2
            exit 1
          fi

          if grep -q 'addfieldpath=' "$manifest"; then
            echo 'UEFA ranking manifest regressed to a legacy addfieldpath.' >&2
            exit 1
          fi

          if grep -E '\$[A-Za-z_][A-Za-z0-9_]*->\$|\$object->\$' "$helper" "$module/tmpl/default.php"; then
            echo 'UEFA ranking module regressed to dynamic object properties.' >&2
            exit 1
          fi

          if grep -E 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|->input\b|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(' \
            "$module/services/provider.php" \
            "$module/src/Dispatcher/Dispatcher.php" \
            "$helper" \
            "$module/mod_sportsmanagement_uefawertung.php" \
            "$module/helper.php" \
            "$module/tmpl/default.php"; then
            echo 'UEFA ranking module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          php -r '$file=$argv[1]; if (simplexml_load_file($file) === false) { exit(1); }' "$manifest"
