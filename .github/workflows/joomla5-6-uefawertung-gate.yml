name: Joomla 5/6 UEFA Ranking Gate

on:
  push:
    branches: [joomla5-6]
  pull_request:
    branches: [joomla5-6]

jobs:
  uefa-ranking:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate UEFA ranking module
        shell: bash
        run: |
          set -euo pipefail
          module=modules/mod_sportsmanagement_uefawertung
          manifest="$module/mod_sportsmanagement_uefawertung.xml"
          provider="$module/services/provider.php"
          dispatcher="$module/src/Dispatcher/Dispatcher.php"
          helper="$module/src/Helper/UefaWertungHelper.php"
          entry="$module/mod_sportsmanagement_uefawertung.php"
          bridge="$module/helper.php"
          template="$module/tmpl/default.php"
          resolver=site/src/Service/SportsManagementDatabaseResolver.php

          test -f "$provider"
          test -f "$dispatcher"
          test -f "$helper"
          test -f "$template"
          test -f "$resolver"

          php -l "$provider"
          php -l "$dispatcher"
          php -l "$helper"
          php -l "$entry"
          php -l "$bridge"
          php -l "$template"
          php -l "$resolver"

          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('modules/mod_sportsmanagement_uefawertung/mod_sportsmanagement_uefawertung.xml')
          PY

          grep -Fq '<namespace path="src">Diddipoeler\Module\SportsManagementUefaWertung</namespace>' "$manifest"
          grep -Fq '<folder module="mod_sportsmanagement_uefawertung">services</folder>' "$manifest"
          grep -Fq '<folder>src</folder>' "$manifest"
          grep -Fq 'addfieldprefix="Diddipoeler\Component\SportsManagement\Administrator\Field"' "$manifest"
          grep -Fq 'table table-sm' "$manifest"
          grep -Fq 'name="cache_time"' "$manifest"
          grep -Fq 'type="number"' "$manifest"
          ! grep -Fq 'addfieldpath=' "$manifest"
          ! grep -Fq 'table-condensed' "$manifest"

          grep -Fq 'ModuleDispatcherFactory' "$provider"
          grep -Fq 'HelperFactory' "$provider"
          grep -Fq 'registerAndUseStyle' "$dispatcher"
          grep -Fq 'SportsManagementDatabaseResolver::resolve' "$helper"
          grep -Fq 'setQuery($query, 0, 5)' "$helper"
          grep -Fq 'count(array_intersect_key(array_flip($seasons), $points))' "$helper"
          grep -Fq 'SportsManagementDatabaseResolver' "$resolver"
          grep -Fq 'DatabaseFactory' "$resolver"
          grep -Fq 'hash_equals' "$resolver"

          ! grep -Fq 'getDBConnection' "$helper"
          ! grep -Fq 'sportsmanagementHelper' "$helper"
          ! grep -Fq 'require_once' "$helper"
          ! grep -Fq '<script' "$template"

          if grep -REn 'Factory::get(Document|Config|Language|User|Dbo)\(|Factory::getApplication\(\)->input|\bJURI::|jimport\(|JLoader::(import|register)\(|BaseDatabaseModel::getInstance\(|->disconnect\(|sportsmanagementHelper::getDBConnection' \
            "$provider" \
            "$dispatcher" \
            "$helper" \
            "$entry" \
            "$bridge" \
            "$module/tmpl"; then
            echo 'UEFA ranking module regressed to a Joomla 6 legacy API.' >&2
            exit 1
          fi

          ! grep -REn 'Factory::getConfig\(|Factory::getDbo\(|JDatabaseDriver|JDatabase::' "$resolver"
