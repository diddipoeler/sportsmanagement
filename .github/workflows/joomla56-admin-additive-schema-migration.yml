name: Joomla 5/6 additive administrator schema migration

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Helper/SchemaAdditiveMigrationHelper.php'
      - 'admin/src/Helper/InstallSchemaStatementParser.php'
      - 'admin/assets/updates/jsm_update_db_tables.php'
      - 'admin/sql/install.mysql.utf8.sql'
      - '.github/tests/joomla56_admin_additive_schema_migration.php'
      - '.github/workflows/joomla56-admin-additive-schema-migration.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Helper/SchemaAdditiveMigrationHelper.php'
      - 'admin/src/Helper/InstallSchemaStatementParser.php'
      - 'admin/assets/updates/jsm_update_db_tables.php'
      - 'admin/sql/install.mysql.utf8.sql'
      - '.github/tests/joomla56_admin_additive_schema_migration.php'
      - '.github/workflows/joomla56-admin-additive-schema-migration.yml'

permissions:
  contents: read

jobs:
  additive-schema:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint administrative schema helper and fixtures
        run: |
          php -l admin/src/Helper/SchemaAdditiveMigrationHelper.php
          php -l admin/assets/updates/jsm_update_db_tables.php
          php -l .github/tests/joomla56_admin_additive_schema_migration.php
      - name: Verify all 75 bundled schema statements are nondestructive
        run: php .github/tests/joomla56_admin_additive_schema_migration.php
      - name: Verify metadata and documented functions
        run: |
          php .github/scripts/check-php-headers.php admin/src/Helper/SchemaAdditiveMigrationHelper.php admin/assets/updates/jsm_update_db_tables.php
          php .github/scripts/check-php-function-docs.php admin/src/Helper/SchemaAdditiveMigrationHelper.php admin/assets/updates/jsm_update_db_tables.php .github/tests/joomla56_admin_additive_schema_migration.php
