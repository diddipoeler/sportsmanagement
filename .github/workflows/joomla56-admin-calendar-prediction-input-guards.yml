name: Joomla 5/6 admin calendar prediction input guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Field/LeagueField.php'
      - 'admin/src/Field/FederationslistField.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php'
      - 'site/src/Helper/PredictionRouteHelper.php'
      - '.github/tests/joomla56_admin_calendar_prediction_boundaries.php'
      - '.github/workflows/joomla56-admin-calendar-prediction-input-guards.yml'
  pull_request:
    paths:
      - 'admin/src/Field/LeagueField.php'
      - 'admin/src/Field/FederationslistField.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php'
      - 'site/src/Helper/PredictionRouteHelper.php'
      - '.github/tests/joomla56_admin_calendar_prediction_boundaries.php'
      - '.github/workflows/joomla56-admin-calendar-prediction-input-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: PHP file metadata, function docs and syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            admin/src/Field/LeagueField.php
            admin/src/Field/FederationslistField.php
            modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php
            site/src/Helper/PredictionRouteHelper.php
            .github/tests/joomla56_admin_calendar_prediction_boundaries.php
          )
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/scripts/check-php-headers.php "${files[@]}"
          php .github/scripts/check-php-function-docs.php "${files[@]}"
      - name: Exercise invalid selectors and valid native Joomla paths
        run: php .github/tests/joomla56_admin_calendar_prediction_boundaries.php
