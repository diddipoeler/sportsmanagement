name: Joomla 5/6 administrator countries round navigation and counter

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Helper/CountryOptionsHelper.php'
      - 'site/src/Helper/RoundPaginationHelper.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php'
      - '.github/tests/joomla56_admin_country_options_guards.php'
      - '.github/tests/joomla56_round_navigation_slugs.php'
      - '.github/tests/joomla56_count_rekord_config_guards.php'
      - '.github/workflows/joomla56-admin-countries-round-counter.yml'
  pull_request:
    paths:
      - 'admin/src/Helper/CountryOptionsHelper.php'
      - 'site/src/Helper/RoundPaginationHelper.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php'
      - '.github/tests/joomla56_admin_country_options_guards.php'
      - '.github/tests/joomla56_round_navigation_slugs.php'
      - '.github/tests/joomla56_count_rekord_config_guards.php'
  workflow_dispatch:

jobs:
  php-regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax
        run: |
          php -l admin/src/Helper/CountryOptionsHelper.php
          php -l site/src/Helper/RoundPaginationHelper.php
          php -l modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
          php -l .github/tests/joomla56_admin_country_options_guards.php
          php -l .github/tests/joomla56_round_navigation_slugs.php
          php -l .github/tests/joomla56_count_rekord_config_guards.php
      - name: Execute Joomla 5/6 regressions
        run: |
          php .github/tests/joomla56_admin_country_options_guards.php
          php .github/tests/joomla56_round_navigation_slugs.php
          php .github/tests/joomla56_count_rekord_config_guards.php
