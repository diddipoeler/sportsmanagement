name: Joomla 5/6 administrator image selection model hardening
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/ImagehandlerModel.php'
      - '.github/tests/joomla56_admin_imagehandler_model_guard.php'
      - '.github/workflows/joomla56-admin-imagehandler-model-guard.yml'
  pull_request:
    paths:
      - 'admin/src/Model/ImagehandlerModel.php'
      - '.github/tests/joomla56_admin_imagehandler_model_guard.php'
      - '.github/workflows/joomla56-admin-imagehandler-model-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: Verify PHPDoc file headers and syntax
        run: |
          php .github/scripts/check-php-function-docs.php admin/src/Model/ImagehandlerModel.php .github/tests/joomla56_admin_imagehandler_model_guard.php
          php .github/tests/phpdoc_metadata.php admin/src/Model/ImagehandlerModel.php
          php -l admin/src/Model/ImagehandlerModel.php
          php -l .github/tests/joomla56_admin_imagehandler_model_guard.php
      - name: Verify model ACL filename limits and private failures
        run: php .github/tests/joomla56_admin_imagehandler_model_guard.php
