name: Joomla 5/6 administrator match database choice guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/MatchController.php'
      - '.github/tests/joomla56_admin_match_database_choices.php'
      - '.github/workflows/joomla56-admin-match-database-choices.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Controller/MatchController.php'
      - '.github/tests/joomla56_admin_match_database_choices.php'
      - '.github/workflows/joomla56-admin-match-database-choices.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-choices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax and file metadata
        run: |
          for file in admin/src/Controller/MatchController.php .github/tests/joomla56_admin_match_database_choices.php; do
            php -l "$file"
            for tag in @version @author @copyright @license; do
              grep -Fq "$tag" "$file"
            done
          done
          php .github/scripts/check-php-function-docs.php admin/src/Controller/MatchController.php .github/tests/joomla56_admin_match_database_choices.php
      - name: Match copy and calendar database choices
        run: php .github/tests/joomla56_admin_match_database_choices.php
