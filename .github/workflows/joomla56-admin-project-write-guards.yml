name: Joomla 5/6 administrator project model write guards
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/ProjectModel.php'
      - '.github/tests/joomla56_admin_project_write_guards.php'
      - '.github/workflows/joomla56-admin-project-write-guards.yml'
  pull_request:
    paths:
      - 'admin/src/Model/ProjectModel.php'
      - '.github/tests/joomla56_admin_project_write_guards.php'
      - '.github/workflows/joomla56-admin-project-write-guards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: Verify source metadata and PHP syntax
        run: |
          php .github/tests/phpdoc_metadata.php admin/src/Model/ProjectModel.php
          php .github/scripts/check-php-function-docs.php admin/src/Model/ProjectModel.php
          php -l admin/src/Model/ProjectModel.php
          php -l .github/tests/joomla56_admin_project_write_guards.php
      - name: Run direct project write guards
        run: php .github/tests/joomla56_admin_project_write_guards.php
