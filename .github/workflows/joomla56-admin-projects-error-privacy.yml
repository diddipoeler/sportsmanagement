name: Joomla 5/6 administrator projects list error privacy
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/ProjectsModel.php'
      - '.github/tests/joomla56_admin_projects_error_privacy.php'
      - '.github/workflows/joomla56-admin-projects-error-privacy.yml'
  pull_request:
    paths:
      - 'admin/src/Model/ProjectsModel.php'
      - '.github/tests/joomla56_admin_projects_error_privacy.php'
      - '.github/workflows/joomla56-admin-projects-error-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: Check administrator PHPDoc and PHP syntax
        run: |
          php .github/tests/phpdoc_metadata.php admin/src/Model/ProjectsModel.php
          php .github/scripts/check-php-function-docs.php admin/src/Model/ProjectsModel.php .github/tests/joomla56_admin_projects_error_privacy.php
          php -l admin/src/Model/ProjectsModel.php
          php -l .github/tests/joomla56_admin_projects_error_privacy.php
      - name: Verify private backend project list error reporting
        run: php .github/tests/joomla56_admin_projects_error_privacy.php
