name: Joomla 5/6 safe manual association import

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/JlextassociationsModel.php'
      - 'admin/src/Controller/JlextassociationsController.php'
      - 'admin/src/Service/ConfiguredAssociationInstaller.php'
      - 'admin/language/de-DE/de-DE.com_sportsmanagement.ini'
      - 'admin/language/en-GB/en-GB.com_sportsmanagement.ini'
      - '.github/tests/joomla56_association_manual_import.php'
      - '.github/workflows/joomla56-association-manual-import.yml'
  pull_request:
    branches: [master, joomla5-6]
    paths:
      - 'admin/src/Model/JlextassociationsModel.php'
      - 'admin/src/Controller/JlextassociationsController.php'
      - 'admin/src/Service/ConfiguredAssociationInstaller.php'
      - '.github/tests/joomla56_association_manual_import.php'
      - '.github/workflows/joomla56-association-manual-import.yml'

jobs:
  manual-association-import:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: simplexml, mbstring
          coverage: none
      - name: Validate PHP syntax
        run: |
          php -l admin/src/Model/JlextassociationsModel.php
          php -l admin/src/Controller/JlextassociationsController.php
          php -l admin/src/Service/ConfiguredAssociationInstaller.php
          php -l .github/tests/joomla56_association_manual_import.php
      - name: Audit function documentation
        run: |
          php .github/scripts/check-php-function-docs.php \
            admin/src/Model/JlextassociationsModel.php \
            admin/src/Controller/JlextassociationsController.php \
            admin/src/Service/ConfiguredAssociationInstaller.php \
            .github/tests/joomla56_association_manual_import.php
      - name: Regression-test safe manual association import and ACL
        run: php .github/tests/joomla56_association_manual_import.php
