name: Joomla 5/6 bracket quote and Matches format guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/TournamentbracketResultNormalizer.php'
      - 'admin/src/Model/SmquoteModel.php'
      - 'modules/mod_sportsmanagement_matches/connectors/native/FormatTrait.php'
      - '.github/tests/joomla56_bracket_smquote_matches_formats.php'
      - '.github/workflows/joomla56-bracket-quote-matches-formats.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/TournamentbracketResultNormalizer.php'
      - 'admin/src/Model/SmquoteModel.php'
      - 'modules/mod_sportsmanagement_matches/connectors/native/FormatTrait.php'
      - '.github/tests/joomla56_bracket_smquote_matches_formats.php'
      - '.github/workflows/joomla56-bracket-quote-matches-formats.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax on Joomla site admin and module code
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/Model/TournamentbracketResultNormalizer.php \
            admin/src/Model/SmquoteModel.php \
            modules/mod_sportsmanagement_matches/connectors/native/FormatTrait.php \
            .github/tests/joomla56_bracket_smquote_matches_formats.php; do
            php -l "$file"
          done
      - name: Check PHP headers and method documentation
        shell: bash
        run: |
          php .github/scripts/check-php-file-headers.php
          php .github/scripts/check-php-function-docs.php \
            site/src/Model/TournamentbracketResultNormalizer.php \
            admin/src/Model/SmquoteModel.php \
            modules/mod_sportsmanagement_matches/connectors/native/FormatTrait.php \
            .github/tests/joomla56_bracket_smquote_matches_formats.php
      - name: Validate bracket quote and Matches runtime compatibility
        run: php .github/tests/joomla56_bracket_smquote_matches_formats.php
