name: Joomla 5/6 dependent field regressions
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Field/DependsqlField.php'
      - 'admin/src/Field/MultidependsqlField.php'
      - '.github/tests/joomla56-dependent-fields.cjs'
      - '.github/workflows/joomla56-dependent-fields.yml'
  pull_request:
    paths:
      - 'admin/src/Field/DependsqlField.php'
      - 'admin/src/Field/MultidependsqlField.php'
      - '.github/tests/joomla56-dependent-fields.cjs'
      - '.github/workflows/joomla56-dependent-fields.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax and documentation
        run: |
          php -l admin/src/Field/DependsqlField.php
          php -l admin/src/Field/MultidependsqlField.php
          php .github/scripts/check-php-headers.php admin/src/Field/DependsqlField.php admin/src/Field/MultidependsqlField.php
          php .github/scripts/check-php-function-docs.php admin/src/Field/DependsqlField.php admin/src/Field/MultidependsqlField.php
      - name: AJAX regressions
        run: node .github/tests/joomla56-dependent-fields.cjs
