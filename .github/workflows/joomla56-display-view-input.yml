name: Joomla 5/6 display view validation

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/DisplayController.php'
      - 'admin/src/Controller/DisplayController.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php'
      - 'site/src/Helper/RoundPaginationHelper.php'
      - 'admin/src/Controller/ProjectsController.php'
      - '.github/tests/joomla56_admin_projects_action_feedback.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php'
      - '.github/tests/joomla56_display_view_input_contract.php'
      - '.github/workflows/joomla56-display-view-input.yml'
  pull_request:
    paths:
      - 'site/src/Controller/DisplayController.php'
      - 'admin/src/Controller/DisplayController.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php'
      - 'site/src/Helper/RoundPaginationHelper.php'
      - 'admin/src/Controller/ProjectsController.php'
      - '.github/tests/joomla56_admin_projects_action_feedback.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php'
      - '.github/tests/joomla56_display_view_input_contract.php'
  workflow_dispatch:

jobs:
  view-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l site/src/Controller/DisplayController.php
          php -l admin/src/Controller/DisplayController.php
          php -l admin/src/Controller/ProjectsController.php
          php -l site/src/Helper/RoundPaginationHelper.php
          php -l modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php
          php -l .github/tests/joomla56_admin_projects_action_feedback.php
          php -l modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php
          php -l modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
          php -l .github/tests/joomla56_display_view_input_contract.php
      - name: Document changed Joomla 5/6 controller and module methods
        run: |
          php .github/scripts/check-php-function-docs.php \
            site/src/Controller/DisplayController.php \
            admin/src/Controller/DisplayController.php \
            modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php \
            modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php \
            site/src/Helper/RoundPaginationHelper.php \
            admin/src/Controller/ProjectsController.php
      - name: View input contracts
        run: php .github/tests/joomla56_display_view_input_contract.php
      - name: Verify protected administrator project actions
        run: php .github/tests/joomla56_admin_projects_action_feedback.php
