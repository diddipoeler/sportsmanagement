name: Joomla 5/6 display view validation

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/DisplayController.php'
      - 'admin/src/Controller/DisplayController.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/helper.php'
      - 'site/src/Helper/RoundPaginationHelper.php'
      - 'admin/src/Controller/ProjectsController.php'
      - 'admin/src/Controller/GithubController.php'
      - 'admin/src/Model/GithubModel.php'
      - 'admin/src/View/Github/HtmlView.php'
      - '.github/tests/joomla56_admin_github_transport_privacy.php'
      - '.github/tests/joomla56_admin_github_issue_response.php'
      - '.github/tests/joomla56_admin_github_issue_identity.php'
      - '.github/tests/joomla56_admin_projects_action_feedback.php'
      - '.github/tests/joomla56_round_navigation_slugs.php'
      - '.github/tests/joomla56_sports_type_statistics_scope.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php'
      - '.github/tests/joomla56_display_view_input_contract.php'
      - '.github/workflows/joomla56-display-view-input.yml'
  pull_request:
    paths:
      - 'site/src/Controller/DisplayController.php'
      - 'admin/src/Controller/DisplayController.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/helper.php'
      - 'site/src/Helper/RoundPaginationHelper.php'
      - 'admin/src/Controller/ProjectsController.php'
      - 'admin/src/Controller/GithubController.php'
      - 'admin/src/Model/GithubModel.php'
      - 'admin/src/View/Github/HtmlView.php'
      - '.github/tests/joomla56_admin_github_transport_privacy.php'
      - '.github/tests/joomla56_admin_github_issue_response.php'
      - '.github/tests/joomla56_admin_github_issue_identity.php'
      - '.github/tests/joomla56_admin_projects_action_feedback.php'
      - '.github/tests/joomla56_round_navigation_slugs.php'
      - '.github/tests/joomla56_sports_type_statistics_scope.php'
      - 'modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php'
      - '.github/tests/joomla56_display_view_input_contract.php'
  workflow_dispatch:

jobs:
  view-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l site/src/Controller/DisplayController.php
          php -l admin/src/Controller/DisplayController.php
          php -l admin/src/Controller/ProjectsController.php
          php -l admin/src/Controller/GithubController.php
          php -l admin/src/Model/GithubModel.php
          php -l admin/src/View/Github/HtmlView.php
          php -l .github/tests/joomla56_admin_github_transport_privacy.php
          php -l .github/tests/joomla56_admin_github_issue_response.php
          php -l .github/tests/joomla56_admin_github_issue_identity.php
          php -l site/src/Helper/RoundPaginationHelper.php
          php -l modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php
          php -l modules/mod_sportsmanagement_sports_type_statistics/helper.php
          php -l .github/tests/joomla56_admin_projects_action_feedback.php
          php -l .github/tests/joomla56_round_navigation_slugs.php
          php -l .github/tests/joomla56_sports_type_statistics_scope.php
          php -l modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php
          php -l modules/mod_sportsmanagement_navigation_menu/src/Helper/NativeNavigationMenuHelper.php
          php -l .github/tests/joomla56_display_view_input_contract.php
      - name: Document changed Joomla 5/6 controller and module methods
        run: |
          php .github/scripts/check-php-function-docs.php \
            site/src/Controller/DisplayController.php \
            admin/src/Controller/DisplayController.php \
            modules/mod_sportsmanagement_sports_type_statistics/src/Dispatcher/Dispatcher.php \
            modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php \
            modules/mod_sportsmanagement_sports_type_statistics/helper.php \
            site/src/Helper/RoundPaginationHelper.php \
            admin/src/Controller/ProjectsController.php \
            admin/src/Controller/GithubController.php \
            admin/src/Model/GithubModel.php \
            admin/src/View/Github/HtmlView.php
      - name: View input contracts
        run: php .github/tests/joomla56_display_view_input_contract.php
      - name: Verify protected administrator project actions
        run: php .github/tests/joomla56_admin_projects_action_feedback.php
      - name: Verify navigation database input boundaries
        run: php .github/tests/joomla56_round_navigation_slugs.php
      - name: Verify scoped sport statistics and empty module state
        run: php .github/tests/joomla56_sports_type_statistics_scope.php
      - name: Verify administrator GitHub issue identity checks
        run: php .github/tests/joomla56_admin_github_issue_identity.php
      - name: Verify redacted administrator GitHub transport errors
        run: php .github/tests/joomla56_admin_github_transport_privacy.php
      - name: Verify real GitHub issue response handling
        run: php .github/tests/joomla56_admin_github_issue_response.php
