name: Joomla 5/6 editor submission and calendar selector regressions

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/EditpersonController.php'
      - 'site/src/Controller/EditteamController.php'
      - 'site/src/Controller/EditprojectteamController.php'
      - 'admin/src/Controller/JsmgcalendarController.php'
      - 'admin/modules/mod_sportsmanagement_quickicon/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_admin_quickicon_identity.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php'
      - '.github/tests/joomla56_editor_submission_guards.php'
      - '.github/tests/joomla56_calendar_signed_selectors.php'
      - '.github/workflows/joomla56-editor-calendar-continuation.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/EditpersonController.php'
      - 'site/src/Controller/EditteamController.php'
      - 'site/src/Controller/EditprojectteamController.php'
      - 'admin/src/Controller/JsmgcalendarController.php'
      - 'admin/modules/mod_sportsmanagement_quickicon/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_admin_quickicon_identity.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php'
      - '.github/tests/joomla56_editor_submission_guards.php'
      - '.github/tests/joomla56_calendar_signed_selectors.php'
      - '.github/workflows/joomla56-editor-calendar-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint updated site, admin and module controllers
        run: |
          php -l site/src/Controller/EditpersonController.php
          php -l site/src/Controller/EditteamController.php
          php -l site/src/Controller/EditprojectteamController.php
          php -l admin/src/Controller/JsmgcalendarController.php
          php -l admin/modules/mod_sportsmanagement_quickicon/src/Dispatcher/Dispatcher.php
          php -l .github/tests/joomla56_admin_quickicon_identity.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php
          php -l .github/tests/joomla56_editor_submission_guards.php
          php -l .github/tests/joomla56_calendar_signed_selectors.php
      - name: Check mandatory PHP file metadata
        run: |
          php .github/tests/phpdoc_metadata.php \
            site/src/Controller/EditpersonController.php \
            site/src/Controller/EditteamController.php \
            site/src/Controller/EditprojectteamController.php \
            admin/src/Controller/JsmgcalendarController.php \
            admin/modules/mod_sportsmanagement_quickicon/src/Dispatcher/Dispatcher.php \
            modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php
      - name: Test editor identity and POST-token guards
        run: php .github/tests/joomla56_editor_submission_guards.php
      - name: Test signed calendar selectors
        run: php .github/tests/joomla56_calendar_signed_selectors.php
      - name: Test administrator quickicon identity guards
        run: php .github/tests/joomla56_admin_quickicon_identity.php
