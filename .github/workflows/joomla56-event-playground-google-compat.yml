name: Joomla 5/6 event playground and legacy Google Calendar regressions

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/View/Event/HtmlView.php'
      - 'site/tmpl/event/default.php'
      - 'admin/src/Service/PlaygroundGeocoder.php'
      - 'modules/mod_sportsmanagement_google_calendar/helper.php'
      - '.github/tests/joomla56_playground_geocoder_validation.php'
      - '.github/tests/joomla56-event-playground-google-compat-*.php'
      - '.github/workflows/joomla56-event-playground-google-compat.yml'
  pull_request:
    branches: [joomla5-6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax for runtime files and test fixtures
        run: |
          set -euo pipefail
          for file in \
            site/src/View/Event/HtmlView.php \
            site/tmpl/event/default.php \
            admin/src/Service/PlaygroundGeocoder.php \
            modules/mod_sportsmanagement_google_calendar/helper.php \
            .github/tests/joomla56_playground_geocoder_validation.php \
            .github/tests/joomla56-event-playground-google-compat-*.php; do
            php -l "$file"
          done
      - name: Require four metadata tags and functional PHPDocs
        run: |
          set -euo pipefail
          php .github/scripts/check-php-headers.php \
            site/src/View/Event/HtmlView.php \
            site/tmpl/event/default.php \
            admin/src/Service/PlaygroundGeocoder.php \
            modules/mod_sportsmanagement_google_calendar/helper.php
          php .github/scripts/check-php-function-docs.php \
            site/src/View/Event/HtmlView.php \
            admin/src/Service/PlaygroundGeocoder.php \
            modules/mod_sportsmanagement_google_calendar/helper.php
      - name: Exercise real source with Joomla and HTTP stubs
        run: |
          set -euo pipefail
          php .github/tests/joomla56-event-playground-google-compat-site.php
          php .github/tests/joomla56_playground_geocoder_validation.php
          php .github/tests/joomla56-event-playground-google-compat-module.php
