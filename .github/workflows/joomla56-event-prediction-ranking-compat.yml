name: Joomla 5/6 event, prediction and ranking compatibility

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/helpers/Event.php'
      - 'site/helpers/predictionroute.php'
      - 'modules/mod_sportsmanagement_eventsranking/tmpl/default.php'
      - '.github/tests/joomla56_event_prediction_ranking_compat.php'
      - '.github/workflows/joomla56-event-prediction-ranking-compat.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/helpers/Event.php'
      - 'site/helpers/predictionroute.php'
      - 'modules/mod_sportsmanagement_eventsranking/tmpl/default.php'
      - '.github/tests/joomla56_event_prediction_ranking_compat.php'
      - '.github/workflows/joomla56-event-prediction-ranking-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all changed PHP files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            admin/helpers/Event.php \
            site/helpers/predictionroute.php \
            modules/mod_sportsmanagement_eventsranking/tmpl/default.php \
            .github/tests/joomla56_event_prediction_ranking_compat.php; do
            php -l "$file"
          done
      - name: Verify required metadata and descriptive PHPDoc
        shell: bash
        run: |
          php .github/scripts/check-php-file-headers.php
          php .github/scripts/check-php-function-docs.php \
            admin/helpers/Event.php \
            site/helpers/predictionroute.php \
            modules/mod_sportsmanagement_eventsranking/tmpl/default.php \
            .github/tests/joomla56_event_prediction_ranking_compat.php
      - name: Exercise iCalendar, prediction routes and ranking HTML without Joomla
        run: php .github/tests/joomla56_event_prediction_ranking_compat.php
