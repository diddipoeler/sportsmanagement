name: Joomla 5/6 GitHub installer URL and UEFA ranking guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/GithubinstallModel.php'
      - 'admin/src/Controller/GithubinstallController.php'
      - 'modules/mod_sportsmanagement_uefawertung/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_admin_githubinstaller_guards.php'
      - '.github/tests/joomla56_uefa_ranking_optional_failure.php'
      - '.github/workflows/joomla56-github-installer-uefa-guards.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'admin/src/Model/GithubinstallModel.php'
      - 'admin/src/Controller/GithubinstallController.php'
      - 'modules/mod_sportsmanagement_uefawertung/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_admin_githubinstaller_guards.php'
      - '.github/tests/joomla56_uefa_ranking_optional_failure.php'
      - '.github/workflows/joomla56-github-installer-uefa-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax and file-level metadata
        run: |
          php -l admin/src/Model/GithubinstallModel.php
          php -l admin/src/Controller/GithubinstallController.php
          php -l modules/mod_sportsmanagement_uefawertung/src/Dispatcher/Dispatcher.php
          php -l .github/tests/joomla56_admin_githubinstaller_guards.php
          php -l .github/tests/joomla56_uefa_ranking_optional_failure.php
          php .github/tests/phpdoc_metadata.php \
            admin/src/Model/GithubinstallModel.php \
            admin/src/Controller/GithubinstallController.php \
            modules/mod_sportsmanagement_uefawertung/src/Dispatcher/Dispatcher.php
      - name: Check descriptive function PHPDoc
        run: |
          php .github/scripts/check-php-function-docs.php \
            admin/src/Model/GithubinstallModel.php \
            admin/src/Controller/GithubinstallController.php \
            modules/mod_sportsmanagement_uefawertung/src/Dispatcher/Dispatcher.php \
            .github/tests/joomla56_admin_githubinstaller_guards.php \
            .github/tests/joomla56_uefa_ranking_optional_failure.php
      - name: Verify official archive URL allowlist and installer privacy
        run: php .github/tests/joomla56_admin_githubinstaller_guards.php
      - name: Verify optional UEFA ranking failure isolation
        run: php .github/tests/joomla56_uefa_ranking_optional_failure.php
