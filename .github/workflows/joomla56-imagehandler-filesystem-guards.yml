name: Joomla 5/6 image selector filesystem guard
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/ImagehandlerModel.php'
      - '.github/tests/joomla56_imagehandler_filesystem_guards.php'
      - '.github/workflows/joomla56-imagehandler-filesystem-guards.yml'
  pull_request:
    paths:
      - 'site/src/Model/ImagehandlerModel.php'
      - '.github/tests/joomla56_imagehandler_filesystem_guards.php'
      - '.github/workflows/joomla56-imagehandler-filesystem-guards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: Validate image model and test PHPDocs and syntax
        run: |
          php .github/tests/phpdoc_metadata.php site/src/Model/ImagehandlerModel.php
          php .github/scripts/check-php-function-docs.php site/src/Model/ImagehandlerModel.php .github/tests/joomla56_imagehandler_filesystem_guards.php
          php -l site/src/Model/ImagehandlerModel.php
          php -l .github/tests/joomla56_imagehandler_filesystem_guards.php
      - name: Check image selector filesystem safety
        run: php .github/tests/joomla56_imagehandler_filesystem_guards.php
