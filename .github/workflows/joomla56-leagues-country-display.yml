name: Joomla 5/6 league country display
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/tmpl/leagues/default.php'
      - 'admin/src/View/Leagues/HtmlView.php'
      - 'admin/src/Model/LeaguesModel.php'
      - 'admin/src/Helper/CountryOptionsHelper.php'
      - '.github/tests/joomla56_admin_country_options_guards.php'
      - '.github/tests/joomla56_leagues_country_display.php'
      - '.github/workflows/joomla56-leagues-country-display.yml'
  pull_request:
    paths:
      - 'admin/tmpl/leagues/default.php'
      - 'admin/src/View/Leagues/HtmlView.php'
      - 'admin/src/Model/LeaguesModel.php'
      - 'admin/src/Helper/CountryOptionsHelper.php'
      - '.github/tests/joomla56_admin_country_options_guards.php'
      - '.github/tests/joomla56_leagues_country_display.php'
      - '.github/workflows/joomla56-leagues-country-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  country-display:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax checks
        run: |
          php -l admin/tmpl/leagues/default.php
          php -l admin/src/View/Leagues/HtmlView.php
          php -l admin/src/Model/LeaguesModel.php
          php -l .github/tests/joomla56_leagues_country_display.php
          php -l admin/src/Helper/CountryOptionsHelper.php
          php -l .github/tests/joomla56_admin_country_options_guards.php
      - name: Country selection regression
        run: |
          php -d error_reporting=E_ALL .github/tests/joomla56_leagues_country_display.php
          php -d error_reporting=E_ALL .github/tests/joomla56_admin_country_options_guards.php
