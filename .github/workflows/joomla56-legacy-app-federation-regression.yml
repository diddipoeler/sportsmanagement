name: Joomla 5/6 legacy application and federation regression

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/models/sportsmanagement.php'
      - 'admin/helpers/sportsmanagement.php'
      - 'modules/mod_sportsmanagement_act_season/helper.php'
      - '.github/tests/joomla56-legacy-app-federation-regression.php'
      - '.github/workflows/joomla56-legacy-app-federation-regression.yml'
  pull_request:
    branches: [joomla5-6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax and required PHP metadata
        run: |
          php -l site/models/sportsmanagement.php
          php -l admin/helpers/sportsmanagement.php
          php -l modules/mod_sportsmanagement_act_season/helper.php
          php -l .github/tests/joomla56-legacy-app-federation-regression.php
          php .github/scripts/check-php-headers.php site/models/sportsmanagement.php admin/helpers/sportsmanagement.php modules/mod_sportsmanagement_act_season/helper.php
      - name: Confirm full function descriptions in migrated frontend and module
        run: php .github/scripts/check-php-function-docs.php site/models/sportsmanagement.php modules/mod_sportsmanagement_act_season/helper.php
      - name: Verify legacy resolvers and bounded federation IDs
        run: php .github/tests/joomla56-legacy-app-federation-regression.php
