name: Joomla 5/6 legacy results prediction and quotes regressions

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/ResultsLegacyProjectCompatibility.php'
      - 'admin/src/Field/PredictionroundidField.php'
      - 'admin/src/Field/PredictionproteamidField.php'
      - 'admin/src/Field/PredictiongamesField.php'
      - 'admin/src/Field/PredictiongameField.php'
      - 'admin/src/Field/RoundsField.php'
      - 'modules/mod_sportsmanagement_rquotes/src/Helper/QuoteText.php'
      - '.github/tests/joomla56_legacy_results_quote_text_boundaries.php'
      - '.github/tests/joomla56_admin_prediction_round_selector_guards.php'
      - '.github/workflows/joomla56-legacy-results-prediction-rquotes-regression.yml'
  pull_request:
    paths:
      - 'site/src/Helper/ResultsLegacyProjectCompatibility.php'
      - 'admin/src/Field/PredictionroundidField.php'
      - 'admin/src/Field/PredictionproteamidField.php'
      - 'admin/src/Field/PredictiongamesField.php'
      - 'admin/src/Field/PredictiongameField.php'
      - 'admin/src/Field/RoundsField.php'
      - 'modules/mod_sportsmanagement_rquotes/src/Helper/QuoteText.php'
      - '.github/tests/joomla56_legacy_results_quote_text_boundaries.php'
      - '.github/tests/joomla56_admin_prediction_round_selector_guards.php'
      - '.github/workflows/joomla56-legacy-results-prediction-rquotes-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Verify mandatory metadata, detailed PHPDocs and PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Helper/ResultsLegacyProjectCompatibility.php
            admin/src/Field/PredictionroundidField.php
            admin/src/Field/PredictionproteamidField.php
            admin/src/Field/PredictiongamesField.php
            admin/src/Field/PredictiongameField.php
            admin/src/Field/RoundsField.php
            modules/mod_sportsmanagement_rquotes/src/Helper/QuoteText.php
          )
          for file in "${files[@]}" \
            .github/tests/joomla56_legacy_results_quote_text_boundaries.php \
            .github/tests/joomla56_admin_prediction_round_selector_guards.php; do
            php -l "$file"
          done
          php .github/scripts/check-php-headers.php "${files[@]}"
          php .github/scripts/check-php-function-docs.php "${files[@]}" \
            .github/tests/joomla56_legacy_results_quote_text_boundaries.php \
            .github/tests/joomla56_admin_prediction_round_selector_guards.php
      - name: Exercise standalone Joomla compatibility and safety regressions
        shell: bash
        run: |
          set -euo pipefail
          php .github/tests/joomla56_legacy_results_quote_text_boundaries.php
          php .github/tests/joomla56_admin_prediction_round_selector_guards.php
          php .github/tests/joomla56_rquotes_output_encoding.php
