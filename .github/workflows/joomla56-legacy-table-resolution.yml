name: Joomla 5/6 legacy table resolution
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/libraries/sportsmanagement/model.php'
      - 'admin/src/Table/**'
      - 'admin/src/Service/SportsManagementMVCFactory.php'
      - 'admin/src/Helper/LegacyModelDatabaseHelper.php'
      - 'admin/src/Model/SportsManagement*Model.php'
      - 'site/src/Model/SportsManagement*Model.php'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/tests/joomla56_mvc_factory_database.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - '.github/tests/joomla56_legacy_table_resolution.php'
      - '.github/workflows/joomla56-legacy-table-resolution.yml'
  pull_request:
    paths:
      - 'admin/libraries/sportsmanagement/model.php'
      - 'admin/src/Table/**'
      - 'admin/src/Service/SportsManagementMVCFactory.php'
      - 'admin/src/Helper/LegacyModelDatabaseHelper.php'
      - 'admin/src/Model/SportsManagement*Model.php'
      - 'site/src/Model/SportsManagement*Model.php'
      - 'site/src/Service/SportsManagementDatabaseResolver.php'
      - '.github/tests/joomla56_mvc_factory_database.php'
      - 'admin/src/Helper/SportsManagementDatabaseResolver.php'
      - '.github/tests/joomla56_legacy_table_resolution.php'
      - '.github/workflows/joomla56-legacy-table-resolution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          php -l admin/libraries/sportsmanagement/model.php
          php -l .github/tests/joomla56_legacy_table_resolution.php
          php -l admin/src/Service/SportsManagementMVCFactory.php
          php -l .github/tests/joomla56_mvc_factory_database.php
          for table in Person Jsmgcalendar MatchSingle TeamTrainingData SportsManagement; do
            php -l "admin/src/Table/${table}Table.php"
          done
      - name: Regression tests
        run: php .github/tests/joomla56_legacy_table_resolution.php
      - name: MVC factory database regression
        run: php .github/tests/joomla56_mvc_factory_database.php
      - name: Documentation checks
        run: |
          php .github/scripts/check-php-headers.php admin/src/Table/PersonTable.php .github/tests/joomla56_legacy_table_resolution.php admin/src/Service/SportsManagementMVCFactory.php .github/tests/joomla56_mvc_factory_database.php
          php .github/scripts/check-php-function-docs.php admin/src/Table/PersonTable.php .github/tests/joomla56_legacy_table_resolution.php admin/src/Service/SportsManagementMVCFactory.php .github/tests/joomla56_mvc_factory_database.php
