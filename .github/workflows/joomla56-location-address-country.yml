name: Joomla 5/6 location address and country regressions

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/LocationAddressHelper.php'
      - '.github/tests/joomla56-location-address-country.php'
      - '.github/workflows/joomla56-location-address-country.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Helper/LocationAddressHelper.php'
      - '.github/tests/joomla56-location-address-country.php'
      - '.github/workflows/joomla56-location-address-country.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  address:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint native address helper and fixture
        run: |
          php -l site/src/Helper/LocationAddressHelper.php
          php -l .github/tests/joomla56-location-address-country.php
      - name: Validate helper PHPDoc contract
        run: |
          php .github/scripts/check-php-function-docs.php site/src/Helper/LocationAddressHelper.php
      - name: Test location and country fallback with and without PHP extensions
        run: |
          php .github/tests/joomla56-location-address-country.php
          php -n .github/tests/joomla56-location-address-country.php
