name: Joomla 5/6 modal, extra-field and calendar regressions

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/ModalImageHelper.php'
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php'
      - '.github/tests/joomla56-modal-extra-fields-calendar-bounds.php'
      - '.github/workflows/joomla56-modal-extra-calendar-regressions.yml'
  pull_request:
    paths:
      - 'site/src/Helper/ModalImageHelper.php'
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php'
      - '.github/tests/joomla56-modal-extra-fields-calendar-bounds.php'
      - '.github/workflows/joomla56-modal-extra-calendar-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Check out SportsManagement
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint files and verify PHP documentation
        shell: bash
        run: |
          set -euo pipefail
          php_files=(
            site/src/Helper/ModalImageHelper.php
            admin/src/Helper/ExtraFieldsSaveHelper.php
            modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php
            .github/tests/joomla56-modal-extra-fields-calendar-bounds.php
          )
          for file in "${php_files[@]}"; do
            php -l "$file"
          done
          php .github/scripts/check-php-function-docs.php "${php_files[@]}"
          php .github/scripts/check-php-file-headers.php
      - name: Run standalone regression assertions
        run: php .github/tests/joomla56-modal-extra-fields-calendar-bounds.php
