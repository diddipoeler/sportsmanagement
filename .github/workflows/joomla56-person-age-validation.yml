name: Joomla 5/6 person age validation

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Helper/PersonAgeHelper.php'
      - 'admin/src/Helper/ExtraSelectOptionsHelper.php'
      - 'site/src/Service/IndividualMatchReadService.php'
      - 'modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php'
      - '.github/tests/joomla56-person-age-validation.php'
      - '.github/workflows/joomla56-person-age-validation.yml'
  pull_request:
    paths:
      - 'admin/src/Helper/PersonAgeHelper.php'
      - 'admin/src/Helper/ExtraSelectOptionsHelper.php'
      - 'site/src/Service/IndividualMatchReadService.php'
      - 'modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php'
      - '.github/tests/joomla56-person-age-validation.php'
      - '.github/workflows/joomla56-person-age-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l admin/src/Helper/PersonAgeHelper.php
          php -l admin/src/Helper/ExtraSelectOptionsHelper.php
          php -l .github/tests/joomla56-person-age-validation.php
          php -l site/src/Service/IndividualMatchReadService.php
          php -l modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php
          php -l modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php
      - name: Verify age conversion
        run: php .github/tests/joomla56-person-age-validation.php
