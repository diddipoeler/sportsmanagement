permissions:
  contents: read

jobs:
  php-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l admin/src/Helper/PersonAgeHelper.php
          php -l admin/src/Helper/ExtraSelectOptionsHelper.php
          php -l admin/src/Helper/LocationHelper.php
          php -l admin/src/Helper/ExtendedFormHelper.php
          php -l admin/src/Helper/ActionLogHelper.php
          php -l admin/src/Helper/ExtraFieldsReadHelper.php
          php -l admin/src/Helper/CountryOptionsHelper.php
          php -l admin/src/Field/ExtensionversionField.php
          php -l admin/src/Field/ExtensionauthorField.php
          php -l admin/src/Field/CountryField.php
          php -l admin/src/Field/ExtensionlistField.php
          php -l .github/tests/joomla56-extension-list-validation.php
          php -l admin/src/Field/ExtensionsubtitleField.php
          php -l admin/src/Field/ExtensionlinkField.php
          php -l admin/src/Field/ExtensionmessageField.php
          php -l admin/src/Field/JsmmessageField.php
          php -l admin/src/Field/JsmlinkField.php
          php -l admin/src/Field/CustomcalendarField.php
          php -l admin/src/Field/GoogletimezonesField.php
          php -l admin/src/Field/NameformatField.php
          php -l admin/src/Field/PagetitleformatField.php
          php -l admin/src/Field/GooglecolorchooserField.php
          php -l .github/tests/joomla56-timezone-options.php
          php -l .github/tests/joomla56-custom-calendar-field.php
          php -l admin/src/Field/JsmsubtitleField.php
          php -l admin/src/Field/JsmtitleField.php
          php -l .github/tests/joomla56-admin-message-escaping.php
          php -l .github/tests/joomla56-country-field.php
          php -l admin/src/Field/ExtensiontranslatorsField.php
          php -l admin/src/Field/LanguagecharacterField.php
          php -l admin/src/Field/GeocompleteField.php
          php -l admin/src/Controller/DatabasetoolsController.php
          php -l admin/src/Controller/ClubnamesController.php
          php -l site/src/Service/EditmatchStatisticDefinition.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarDate.php
          php -l .github/tests/joomla56-editmatch-statistic-definition.php
          php -l site/src/Service/LegacyPresentationLoader.php
          php -l .github/tests/joomla56-countries-legacy-loader.php
          php -l admin/src/Helper/RemoteImageDownloadHelper.php
          php -l admin/src/Helper/SqlImportHelper.php
          php -l site/src/Service/MatchReadService.php
          php -l .github/tests/joomla56-sql-import-validation.php
          php -l admin/src/Helper/ExtraFieldsSaveHelper.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRenderer.php
          php -l .github/tests/joomla56-extra-fields-calendar-settings.php
          php -l admin/src/Helper/ExtensionLanguageHelper.php
          php -l .github/tests/joomla56-admin-helper-guards.php
          php -l site/src/Service/PersonExtraFieldReadService.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php
          php -l .github/tests/joomla56-extra-fields-calendar-year.php
          php -l site/src/Helper/SiteRouteHelper.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarDate.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php
          php -l .github/tests/joomla56-site-route-calendar-date.php
          php -l .github/tests/joomla56-person-age-validation.php
          php -l .github/tests/joomla56-livescore-date-boundaries.php
          php -l site/src/Service/IndividualMatchReadService.php
          php -l modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php
          php -l modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php
          php -l .github/tests/joomla56-jevents-date-validation.php
          php -l modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php
      - name: Verify age conversion
        run: php .github/tests/joomla56-person-age-validation.php
      - name: Verify LiveScore date boundaries
        run: php .github/tests/joomla56-livescore-date-boundaries.php
      - name: Verify JEvents invalid date boundaries
        run: php .github/tests/joomla56-jevents-date-validation.php
      - name: Verify routing and calendar date inputs
        run: php .github/tests/joomla56-site-route-calendar-date.php
      - name: Verify extra-field queries and calendar year options
        run: php .github/tests/joomla56-extra-fields-calendar-year.php
      - name: Verify administrator helper guards
        run: php .github/tests/joomla56-admin-helper-guards.php
      - name: Verify extra-field and calendar module settings
        run: php .github/tests/joomla56-extra-fields-calendar-settings.php
      - name: Verify SQL import statement parsing
        run: php .github/tests/joomla56-sql-import-validation.php
      - name: Verify country selector and compatibility autoloader
        run: php .github/tests/joomla56-countries-legacy-loader.php
      - name: Verify editmatch statistic rendering
        run: php .github/tests/joomla56-editmatch-statistic-definition.php
      - name: Verify country field database validation
        run: php .github/tests/joomla56-country-field.php
      - name: Verify administrator message escaping and title links
        run: php .github/tests/joomla56-admin-message-escaping.php
      - name: Verify custom calendar date validation
        run: php .github/tests/joomla56-custom-calendar-field.php
      - name: Verify timezone field selection and UTC offsets
        run: php .github/tests/joomla56-timezone-options.php
      - name: Verify extension folder filter validation
        run: php .github/tests/joomla56-extension-list-validation.php
      - name: Verify documentation in changed runtime classes
        run: |
          php .github/scripts/check-php-function-docs.php site/src/Service/IndividualMatchReadService.php admin/src/Helper/ExtraSelectOptionsHelper.php admin/src/Helper/LocationHelper.php admin/src/Helper/RemoteImageDownloadHelper.php admin/src/Helper/CountryOptionsHelper.php admin/src/Helper/SqlImportHelper.php site/src/Service/MatchReadService.php modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php admin/src/Field/ExtensionversionField.php admin/src/Field/ExtensionauthorField.php admin/src/Field/ExtensiontranslatorsField.php admin/src/Field/LanguagecharacterField.php admin/src/Field/GeocompleteField.php admin/src/Controller/DatabasetoolsController.php admin/src/Controller/ClubnamesController.php site/src/Service/EditmatchStatisticDefinition.php modules/mod_sportsmanagement_calendar/src/Runtime/CalendarDate.php admin/src/Field/CountryField.php admin/src/Field/ExtensionlistField.php admin/src/Field/ExtensionsubtitleField.php admin/src/Field/ExtensionlinkField.php admin/src/Field/ExtensionmessageField.php admin/src/Field/JsmmessageField.php admin/src/Field/JsmtitleField.php admin/src/Field/JsmlinkField.php admin/src/Field/JsmsubtitleField.php admin/src/Field/CustomcalendarField.php admin/src/Field/GoogletimezonesField.php admin/src/Field/NameformatField.php admin/src/Field/PagetitleformatField.php admin/src/Field/GooglecolorchooserField.php
          php .github/scripts/check-php-file-headers.php
