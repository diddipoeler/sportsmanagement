name: Joomla 5/6 person age validation

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Helper/PersonAgeHelper.php'
      - 'admin/src/Helper/ExtraSelectOptionsHelper.php'
      - 'admin/src/Helper/LocationHelper.php'
      - 'admin/src/Helper/ExtendedFormHelper.php'
      - 'admin/src/Helper/ActionLogHelper.php'
      - 'admin/src/Helper/ExtraFieldsReadHelper.php'
      - 'admin/src/Helper/CountryOptionsHelper.php'
      - 'admin/src/Helper/SqlImportHelper.php'
      - 'site/src/Service/MatchReadService.php'
      - '.github/tests/joomla56-sql-import-validation.php'
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRenderer.php'
      - '.github/tests/joomla56-extra-fields-calendar-settings.php'
      - 'admin/src/Helper/ExtensionLanguageHelper.php'
      - '.github/tests/joomla56-admin-helper-guards.php'
      - 'site/src/Service/PersonExtraFieldReadService.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php'
      - '.github/tests/joomla56-extra-fields-calendar-year.php'
      - 'site/src/Helper/SiteRouteHelper.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarDate.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php'
      - '.github/tests/joomla56-site-route-calendar-date.php'
      - 'site/src/Service/IndividualMatchReadService.php'
      - 'modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php'
      - '.github/tests/joomla56-jevents-date-validation.php'
      - '.github/tests/joomla56-livescore-date-boundaries.php'
      - '.github/tests/joomla56-person-age-validation.php'
      - '.github/workflows/joomla56-person-age-validation.yml'
  pull_request:
    paths:
      - 'admin/src/Helper/PersonAgeHelper.php'
      - 'admin/src/Helper/ExtraSelectOptionsHelper.php'
      - 'admin/src/Helper/LocationHelper.php'
      - 'admin/src/Helper/ExtendedFormHelper.php'
      - 'admin/src/Helper/ActionLogHelper.php'
      - 'admin/src/Helper/ExtraFieldsReadHelper.php'
      - 'admin/src/Helper/CountryOptionsHelper.php'
      - 'admin/src/Helper/SqlImportHelper.php'
      - 'site/src/Service/MatchReadService.php'
      - '.github/tests/joomla56-sql-import-validation.php'
      - 'admin/src/Helper/ExtraFieldsSaveHelper.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRenderer.php'
      - '.github/tests/joomla56-extra-fields-calendar-settings.php'
      - 'admin/src/Helper/ExtensionLanguageHelper.php'
      - '.github/tests/joomla56-admin-helper-guards.php'
      - 'site/src/Service/PersonExtraFieldReadService.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php'
      - '.github/tests/joomla56-extra-fields-calendar-year.php'
      - 'site/src/Helper/SiteRouteHelper.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarDate.php'
      - 'modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php'
      - '.github/tests/joomla56-site-route-calendar-date.php'
      - 'site/src/Service/IndividualMatchReadService.php'
      - 'modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php'
      - 'modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php'
      - '.github/tests/joomla56-jevents-date-validation.php'
      - '.github/tests/joomla56-livescore-date-boundaries.php'
      - '.github/tests/joomla56-person-age-validation.php'
      - '.github/workflows/joomla56-person-age-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l admin/src/Helper/PersonAgeHelper.php
          php -l admin/src/Helper/ExtraSelectOptionsHelper.php
          php -l admin/src/Helper/LocationHelper.php
          php -l admin/src/Helper/ExtendedFormHelper.php
          php -l admin/src/Helper/ActionLogHelper.php
          php -l admin/src/Helper/ExtraFieldsReadHelper.php
          php -l admin/src/Helper/CountryOptionsHelper.php
          php -l admin/src/Helper/SqlImportHelper.php
          php -l site/src/Service/MatchReadService.php
          php -l .github/tests/joomla56-sql-import-validation.php
          php -l admin/src/Helper/ExtraFieldsSaveHelper.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRenderer.php
          php -l .github/tests/joomla56-extra-fields-calendar-settings.php
          php -l admin/src/Helper/ExtensionLanguageHelper.php
          php -l .github/tests/joomla56-admin-helper-guards.php
          php -l site/src/Service/PersonExtraFieldReadService.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php
          php -l .github/tests/joomla56-extra-fields-calendar-year.php
          php -l site/src/Helper/SiteRouteHelper.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarDate.php
          php -l modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRuntime.php
          php -l .github/tests/joomla56-site-route-calendar-date.php
          php -l .github/tests/joomla56-person-age-validation.php
          php -l .github/tests/joomla56-livescore-date-boundaries.php
          php -l site/src/Service/IndividualMatchReadService.php
          php -l modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php
          php -l modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php
          php -l .github/tests/joomla56-jevents-date-validation.php
          php -l modules/mod_sportsmanagement_calendar/src/Helper/CalendarHelper.php
      - name: Verify age conversion
        run: php .github/tests/joomla56-person-age-validation.php
      - name: Verify LiveScore date boundaries
        run: php .github/tests/joomla56-livescore-date-boundaries.php
      - name: Verify JEvents invalid date boundaries
        run: php .github/tests/joomla56-jevents-date-validation.php
      - name: Verify routing and calendar date inputs
        run: php .github/tests/joomla56-site-route-calendar-date.php
      - name: Verify extra-field queries and calendar year options
        run: php .github/tests/joomla56-extra-fields-calendar-year.php
      - name: Verify administrator helper guards
        run: php .github/tests/joomla56-admin-helper-guards.php
      - name: Verify extra-field and calendar module settings
        run: php .github/tests/joomla56-extra-fields-calendar-settings.php
      - name: Verify SQL import statement parsing
        run: php .github/tests/joomla56-sql-import-validation.php
      - name: Verify documentation in changed runtime classes
        run: |
          php .github/scripts/check-php-function-docs.php site/src/Service/IndividualMatchReadService.php admin/src/Helper/ExtraSelectOptionsHelper.php admin/src/Helper/LocationHelper.php modules/mod_sportsmanagement_calendar/connectors/livescore_j5.php modules/mod_sportsmanagement_calendar/connectors/jevents_j5.php
          php .github/scripts/check-php-file-headers.php
