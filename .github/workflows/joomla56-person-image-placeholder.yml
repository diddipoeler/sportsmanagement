name: Joomla 5/6 player image placeholder checks

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/PersonImageHelper.php'
      - '.github/tests/joomla56-person-image-placeholder.php'
      - '.github/workflows/joomla56-person-image-placeholder.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Helper/PersonImageHelper.php'
      - '.github/tests/joomla56-person-image-placeholder.php'
      - '.github/workflows/joomla56-person-image-placeholder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-picture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint source and regression
        run: |
          php -l site/src/Helper/PersonImageHelper.php
          php -l .github/tests/joomla56-person-image-placeholder.php
      - name: Test malformed settings and safe image URLs
        run: |
          php .github/tests/joomla56-person-image-placeholder.php
          php -n .github/tests/joomla56-person-image-placeholder.php
