name: Joomla 5/6 PHP checks (site, admin, modules)

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/**/*.php'
      - 'admin/**/*.php'
      - 'modules/**/*.php'
      - '.github/scripts/check-php-headers.php'
      - '.github/workflows/joomla56-php-quality.yml'
  pull_request:
    paths:
      - 'site/**/*.php'
      - 'admin/**/*.php'
      - 'modules/**/*.php'
      - '.github/scripts/check-php-headers.php'
      - '.github/workflows/joomla56-php-quality.yml'
  workflow_dispatch:

jobs:
  php-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Lint PHP and verify mandatory file headers
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- site admin modules | grep -zE '\.php$' || true)
          else
            mapfile -d '' files < <(git ls-files -z site admin modules | grep -zE '\.php$' || true)
          fi
          # Recheck the full tree when the validator or this workflow changes.
          # Otherwise a metadata-policy change could pass without checking any PHP file.
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && \
             git diff --name-only "$BASE_SHA" HEAD -- .github/scripts/check-php-headers.php .github/workflows/joomla56-php-quality.yml | grep -q .; then
            mapfile -d '' files < <(git ls-files -z site admin modules | grep -zE '\.php
            echo "No changed PHP files in site, admin or modules."
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php .github/scripts/check-php-headers.php "${files[@]}"
 || true)
          fi
          if (( ${#files[@]} == 0 )); then
            echo "No changed PHP files in site, admin or modules."
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php .github/scripts/check-php-headers.php "${files[@]}"
