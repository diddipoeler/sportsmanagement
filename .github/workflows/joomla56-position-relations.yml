name: Joomla 5/6 position relation validation
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Model/Position*Model.php'
      - '.github/tests/joomla56_position_relation_validation.php'
      - '.github/workflows/joomla56-position-relations.yml'
  pull_request:
    paths:
      - 'admin/src/Model/Position*Model.php'
      - '.github/tests/joomla56_position_relation_validation.php'
      - '.github/workflows/joomla56-position-relations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax and documentation
        run: |
          files=(admin/src/Model/PositionModel.php admin/src/Model/PositioneventtypeModel.php admin/src/Model/PositionstatisticModel.php .github/tests/joomla56_position_relation_validation.php)
          for file in "${files[@]}"; do php -l "$file"; done
          php .github/scripts/check-php-headers.php "${files[@]}"
          php .github/scripts/check-php-function-docs.php "${files[@]}"
      - name: Regression tests
        run: php .github/tests/joomla56_position_relation_validation.php
