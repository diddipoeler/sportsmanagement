name: Joomla 5/6 prediction installer and GCalendar guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/PredictionusersController.php'
      - 'admin/src/Controller/InstallhelperController.php'
      - 'modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_prediction_member_id_guard.php'
      - '.github/tests/joomla56_installhelper_model_guard.php'
      - '.github/tests/joomla56_gcalendar_failure_isolation.php'
      - '.github/workflows/joomla56-prediction-installer-gcalendar-regressions.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/PredictionusersController.php'
      - 'admin/src/Controller/InstallhelperController.php'
      - 'modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_prediction_member_id_guard.php'
      - '.github/tests/joomla56_installhelper_model_guard.php'
      - '.github/tests/joomla56_gcalendar_failure_isolation.php'
      - '.github/workflows/joomla56-prediction-installer-gcalendar-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: |
          php -l site/src/Controller/PredictionusersController.php
          php -l admin/src/Controller/InstallhelperController.php
          php -l modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php
          php -l .github/tests/joomla56_prediction_member_id_guard.php
          php -l .github/tests/joomla56_installhelper_model_guard.php
          php -l .github/tests/joomla56_gcalendar_failure_isolation.php
      - name: Check PHPDoc file attribution
        run: |
          php .github/tests/phpdoc_metadata.php \
            site/src/Controller/PredictionusersController.php \
            admin/src/Controller/InstallhelperController.php \
            modules/mod_sportsmanagement_gcalendar/src/Dispatcher/Dispatcher.php \
            .github/tests/joomla56_prediction_member_id_guard.php \
            .github/tests/joomla56_installhelper_model_guard.php \
            .github/tests/joomla56_gcalendar_failure_isolation.php
      - name: Validate prediction-member POST selectors
        run: php .github/tests/joomla56_prediction_member_id_guard.php
      - name: Validate missing installer model handling
        run: php .github/tests/joomla56_installhelper_model_guard.php
      - name: Validate calendar failure handling and safe logging
        run: php .github/tests/joomla56_gcalendar_failure_isolation.php
