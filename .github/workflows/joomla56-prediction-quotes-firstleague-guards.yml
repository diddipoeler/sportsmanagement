name: Joomla 5/6 prediction quotes and first-league guards

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Model/PredictionpointsModel.php'
      - 'admin/src/Model/SmquotesModel.php'
      - 'modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php'
      - '.github/tests/joomla56_prediction_quotes_firstleague_guards.php'
      - '.github/workflows/joomla56-prediction-quotes-firstleague-guards.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Model/PredictionpointsModel.php'
      - 'admin/src/Model/SmquotesModel.php'
      - 'modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php'
      - '.github/tests/joomla56_prediction_quotes_firstleague_guards.php'
      - '.github/workflows/joomla56-prediction-quotes-firstleague-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Verify Joomla 5/6 PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/Model/PredictionpointsModel.php \
            admin/src/Model/SmquotesModel.php \
            modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php \
            .github/tests/joomla56_prediction_quotes_firstleague_guards.php; do
            php -l "$file"
          done
      - name: Audit required PHP metadata and function docblocks
        shell: bash
        run: |
          php .github/scripts/check-php-file-headers.php
          php .github/scripts/check-php-function-docs.php \
            site/src/Model/PredictionpointsModel.php \
            admin/src/Model/SmquotesModel.php \
            modules/mod_sportsmanagement_firstleagueoverview/src/Helper/FirstLeagueOverviewHelper.php \
            .github/tests/joomla56_prediction_quotes_firstleague_guards.php
      - name: Test prediction scoring, quote filters and league resilience
        run: php .github/tests/joomla56_prediction_quotes_firstleague_guards.php
