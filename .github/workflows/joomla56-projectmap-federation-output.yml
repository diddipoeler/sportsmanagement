name: Joomla 5/6 project-map federation output encoding
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php'
      - '.github/tests/joomla56_projectmap_federation_output.php'
      - '.github/workflows/joomla56-projectmap-federation-output.yml'
  pull_request:
    paths:
      - 'modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php'
      - '.github/tests/joomla56_projectmap_federation_output.php'
      - '.github/workflows/joomla56-projectmap-federation-output.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: Validate module PHPDoc and syntax
        run: |
          php .github/tests/phpdoc_metadata.php modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php
          php .github/scripts/check-php-function-docs.php modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php
          php -l modules/mod_sportsmanagement_projectmap/src/Helper/ProjectMapHelper.php
          php -l .github/tests/joomla56_projectmap_federation_output.php
      - name: Check project-map output escaping
        run: php .github/tests/joomla56_projectmap_federation_output.php
