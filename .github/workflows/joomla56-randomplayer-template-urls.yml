name: Joomla 5/6 RandomPlayer template URL safety

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_randomplayer/tmpl/native.php'
      - '.github/tests/joomla56_randomplayer_template_urls.php'
      - '.github/workflows/joomla56-randomplayer-template-urls.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'modules/mod_sportsmanagement_randomplayer/tmpl/native.php'
      - '.github/tests/joomla56_randomplayer_template_urls.php'
      - '.github/workflows/joomla56-randomplayer-template-urls.yml'

permissions:
  contents: read

jobs:
  randomplayer-urls:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint RandomPlayer layout and regression fixtures
        run: |
          php -l modules/mod_sportsmanagement_randomplayer/tmpl/native.php
          php -l .github/tests/joomla56_randomplayer_template_urls.php
      - name: Render safe and malicious player record fixtures
        run: php .github/tests/joomla56_randomplayer_template_urls.php
      - name: Require PHP metadata and detailed closure documentation
        run: |
          php .github/scripts/check-php-headers.php modules/mod_sportsmanagement_randomplayer/tmpl/native.php
          php .github/scripts/check-php-function-docs.php modules/mod_sportsmanagement_randomplayer/tmpl/native.php .github/tests/joomla56_randomplayer_template_urls.php
