name: Joomla 5/6 recent site admin module regression suite

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/ExtendedFormHelper.php'
      - 'site/src/Helper/ExtendedDataHelper.php'
      - 'site/src/Helper/ProjectTitleHelper.php'
      - 'site/src/Helper/ClubLogoHelper.php'
      - 'site/src/Helper/PlaygroundKmlHelper.php'
      - 'site/src/Helper/ClubKmlHelper.php'
      - 'site/src/Helper/MatchResultHelper.php'
      - 'site/src/Helper/ResultsLegacyProjectCompatibility.php'
      - 'site/src/Helper/MatchTimeHelper.php'
      - 'admin/src/Helper/ActionLogHelper.php'
      - 'admin/src/Helper/SqlImportHelper.php'
      - 'admin/src/Helper/ExtensionLanguageHelper.php'
      - 'admin/src/Helper/PersonAgeHelper.php'
      - 'admin/src/Helper/ExtendedFormHelper.php'
      - 'admin/src/Helper/ExtraFieldsReadHelper.php'
      - 'admin/src/Helper/ExtraSelectOptionsHelper.php'
      - 'admin/src/Helper/LocationHelper.php'
      - 'modules/mod_sportsmanagement_clubicons/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php'
      - 'modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php'
      - 'modules/mod_sportsmanagement_liveticker/src/Dispatcher/Dispatcher.php'
      - 'modules/mod_sportsmanagement_randomplayer/tmpl/native.php'
      - 'modules/mod_sportsmanagement_birthday/tmpl/default.php'
      - 'modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php'
      - 'modules/mod_sportsmanagement_top_tipper/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_extended_form_extra_select_ranking_guards.php'
      - '.github/tests/joomla56_match_outcome_actionlog_toptipper.php'
      - '.github/tests/joomla56_project_navigation_extended_forms_playground_db.php'
      - '.github/tests/joomla56_matchtime_extra_fields_clubicons.php'
      - '.github/tests/joomla56_matchtime_geocoder_liveticker_guards.php'
      - '.github/tests/joomla56_results_actionlog_randomplayer_safety.php'
      - '.github/tests/joomla56_extended_data_sql_import_randomplayer.php'
      - '.github/tests/joomla56_project_titles_sql_preflight_count_rekord.php'
      - '.github/tests/joomla56_club_logo_extra_select_rquotes.php'
      - '.github/tests/joomla56_playground_kml_extension_birthday_layout.php'
      - '.github/tests/joomla56_club_kml_admin_age_birthday_privacy.php'
      - '.github/scripts/check-php-function-docs.php'
      - '.github/workflows/joomla56-recent-helper-module-regressions.yml'
  pull_request:
    paths:
      - 'site/src/Helper/**'
      - 'admin/src/Helper/**'
      - 'modules/mod_sportsmanagement_clubicons/src/Dispatcher/**'
      - 'modules/mod_sportsmanagement_liveticker/src/Dispatcher/**'
      - 'modules/mod_sportsmanagement_top_tipper/src/Dispatcher/**'
      - 'modules/mod_sportsmanagement_randomplayer/tmpl/**'
      - 'modules/mod_sportsmanagement_birthday/tmpl/**'
      - 'modules/mod_sportsmanagement_birthday/src/Helper/**'
      - 'modules/mod_sportsmanagement_count_rekord/src/Helper/**'
      - 'modules/mod_sportsmanagement_rquotes/src/Helper/**'
      - '.github/tests/joomla56_*'
      - '.github/scripts/check-php-function-docs.php'
      - '.github/workflows/joomla56-recent-helper-module-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint changed helpers, dispatchers and standalone regressions
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Helper/ExtendedFormHelper.php
            site/src/Helper/ExtendedDataHelper.php
            site/src/Helper/ProjectTitleHelper.php
            site/src/Helper/ClubLogoHelper.php
            site/src/Helper/PlaygroundKmlHelper.php
            site/src/Helper/ClubKmlHelper.php
            site/src/Helper/MatchResultHelper.php
            site/src/Helper/ResultsLegacyProjectCompatibility.php
            site/src/Helper/MatchTimeHelper.php
            site/src/Helper/ProjectNavigationHelper.php
            admin/src/Helper/ActionLogHelper.php
            admin/src/Helper/SqlImportHelper.php
            admin/src/Helper/ExtensionLanguageHelper.php
            admin/src/Helper/PersonAgeHelper.php
            admin/src/Helper/ExtendedFormHelper.php
            admin/src/Helper/ExtraFieldsReadHelper.php
            admin/src/Helper/ExtraSelectOptionsHelper.php
            admin/src/Helper/LocationHelper.php
            modules/mod_sportsmanagement_clubicons/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_count_rekord/src/Helper/CountRekordHelper.php
            modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php
            modules/mod_sportsmanagement_liveticker/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_randomplayer/tmpl/native.php
            modules/mod_sportsmanagement_birthday/tmpl/default.php
            modules/mod_sportsmanagement_birthday/src/Helper/BirthdayHelper.php
            modules/mod_sportsmanagement_top_tipper/src/Dispatcher/Dispatcher.php
            modules/mod_sportsmanagement_playgroundplan/src/Helper/PlaygroundPlanHelper.php
            .github/tests/joomla56_extended_form_extra_select_ranking_guards.php
            .github/tests/joomla56_match_outcome_actionlog_toptipper.php
            .github/tests/joomla56_project_navigation_extended_forms_playground_db.php
            .github/tests/joomla56_matchtime_extra_fields_clubicons.php
            .github/tests/joomla56_matchtime_geocoder_liveticker_guards.php
            .github/tests/joomla56_results_actionlog_randomplayer_safety.php
            .github/tests/joomla56_extended_data_sql_import_randomplayer.php
            .github/tests/joomla56_project_titles_sql_preflight_count_rekord.php
            .github/tests/joomla56_club_logo_extra_select_rquotes.php
            .github/tests/joomla56_playground_kml_extension_birthday_layout.php
            .github/tests/joomla56_club_kml_admin_age_birthday_privacy.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php .github/scripts/check-php-function-docs.php "${files[@]}"
      - name: Run isolated recent site/admin/module regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            .github/tests/joomla56_extended_form_extra_select_ranking_guards.php \
            .github/tests/joomla56_match_outcome_actionlog_toptipper.php \
            .github/tests/joomla56_project_navigation_extended_forms_playground_db.php \
            .github/tests/joomla56_matchtime_extra_fields_clubicons.php \
            .github/tests/joomla56_matchtime_geocoder_liveticker_guards.php \
            .github/tests/joomla56_results_actionlog_randomplayer_safety.php \
            .github/tests/joomla56_extended_data_sql_import_randomplayer.php \
            .github/tests/joomla56_project_titles_sql_preflight_count_rekord.php \
            .github/tests/joomla56_club_logo_extra_select_rquotes.php \
            .github/tests/joomla56_playground_kml_extension_birthday_layout.php \
            .github/tests/joomla56_club_kml_admin_age_birthday_privacy.php; do
            php "$test"
          done
