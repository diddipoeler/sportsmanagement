name: Joomla 5/6 recent migration smoke suite

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/**'
      - 'site/controllers/ajax.php'
      - 'admin/src/Helper/**'
      - 'admin/src/Model/JlextfederationsModel.php'
      - 'admin/src/View/Jlextfederations/HtmlView.php'
      - 'admin/tmpl/jlextfederations/default.php'
      - 'admin/forms/jlextfederation.xml'
      - 'admin/src/Field/CountryField.php'
      - 'admin/controllers/ajax.php'
      - 'modules/mod_sportsmanagement_calendar/src/**'
      - 'modules/mod_sportsmanagement_matches/src/**'
      - 'modules/mod_sportsmanagement_clubicons/src/**'
      - 'modules/mod_sportsmanagement_count_rekord/src/**'
      - 'modules/mod_sportsmanagement_liveticker/src/**'
      - 'modules/mod_sportsmanagement_rquotes/src/**'
      - '.github/tests/joomla56-ajax-calendar-bridges.php'
      - '.github/tests/joomla56-project-title-module-db-guards.php'
      - '.github/tests/joomla56-date-kml-calendar-inputs.php'
      - '.github/tests/joomla56-location-utf8-calendar-padded-timestamps.php'
      - '.github/tests/joomla56-project-navigation-name-matches.php'
      - '.github/tests/joomla56-name-extrafields-clubicons.php'
      - '.github/tests/joomla56-team-logos-options-matches.php'
      - '.github/tests/joomla56-match-time-admin-calendar-date-guards.php'
      - '.github/tests/joomla56-calendar-nul-geocoder-image-base.php'
      - '.github/tests/joomla56-logo-fallback-raw-option-controls.php'
      - '.github/tests/joomla56-raw-picture-url-controls.php'
      - '.github/tests/joomla56-image-selection-admin-calendar-controls.php'
      - '.github/tests/joomla56-admin-raw-date-picture-server.php'
      - '.github/tests/joomla56-names-image-redirect-calendar-labels.php'
      - '.github/tests/joomla56-match-geocoder-calendar-controls.php'
      - '.github/tests/joomla56-federation-country-dropdown.php'
      - '.github/tests/joomla56-federation-edit-country-fallback.php'
      - '.github/workflows/joomla56-recent-migration-smoke-suite.yml'
  pull_request:
    paths:
      - 'site/src/Helper/**'
      - 'admin/src/Helper/**'
      - 'modules/**/src/**'
      - '.github/tests/joomla56-*.php'
      - '.github/workflows/joomla56-recent-migration-smoke-suite.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Check native helper and module source syntax and PHPDoc
        run: |
          set -e
          files=(
            site/src/Helper/PersonImageHelper.php
            site/src/Helper/TeamLogoHelper.php
            site/src/Helper/ClubLogoHelper.php
            site/src/Helper/PersonNameFormatter.php
            site/src/Helper/ProjectNavigationHelper.php
            site/src/Helper/MatchResultHelper.php
            admin/src/Helper/RemoteImageDownloadHelper.php
            admin/src/Helper/LocationHelper.php
            admin/src/Helper/ExtraSelectOptionsHelper.php
            admin/src/Helper/SportsManagementDateHelper.php
            admin/src/Helper/ExtraFieldsSaveHelper.php
            admin/src/Field/CountryField.php
            admin/src/Model/JlextfederationsModel.php
            admin/src/View/Jlextfederations/HtmlView.php
            admin/tmpl/jlextfederations/default.php
            modules/mod_sportsmanagement_calendar/src/Runtime/CalendarDate.php
            modules/mod_sportsmanagement_calendar/src/Runtime/CalendarFunctions.php
            modules/mod_sportsmanagement_calendar/src/Runtime/CalendarRenderer.php
            modules/mod_sportsmanagement_rquotes/src/Helper/RquotesHelper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php .github/scripts/check-php-function-docs.php "${files[@]}"
      - name: Lint standalone migration test cases
        run: |
          php -l .github/tests/joomla56-ajax-calendar-bridges.php
          php -l .github/tests/joomla56-project-title-module-db-guards.php
          php -l .github/tests/joomla56-date-kml-calendar-inputs.php
          php -l .github/tests/joomla56-location-utf8-calendar-padded-timestamps.php
          php -l .github/tests/joomla56-project-navigation-name-matches.php
          php -l .github/tests/joomla56-name-extrafields-clubicons.php
          php -l .github/tests/joomla56-team-logos-options-matches.php
          php -l .github/tests/joomla56-match-time-admin-calendar-date-guards.php
          php -l .github/tests/joomla56-calendar-nul-geocoder-image-base.php
          php -l .github/tests/joomla56-logo-fallback-raw-option-controls.php
          php -l .github/tests/joomla56-raw-picture-url-controls.php
          php -l .github/tests/joomla56-image-selection-admin-calendar-controls.php
          php -l .github/tests/joomla56-admin-raw-date-picture-server.php
          php -l .github/tests/joomla56-names-image-redirect-calendar-labels.php
          php -l .github/tests/joomla56-match-geocoder-calendar-controls.php
          php -l .github/tests/joomla56-federation-country-dropdown.php
          php -l .github/tests/joomla56-federation-edit-country-fallback.php
      - name: Run standalone cases with isolated PHP processes
        run: |
          set -e
          php .github/tests/joomla56-ajax-calendar-bridges.php
          php .github/tests/joomla56-project-title-module-db-guards.php
          php .github/tests/joomla56-date-kml-calendar-inputs.php
          php .github/tests/joomla56-location-utf8-calendar-padded-timestamps.php
          php .github/tests/joomla56-project-navigation-name-matches.php
          php .github/tests/joomla56-name-extrafields-clubicons.php
          php .github/tests/joomla56-team-logos-options-matches.php
          php .github/tests/joomla56-match-time-admin-calendar-date-guards.php
          php .github/tests/joomla56-calendar-nul-geocoder-image-base.php
          php .github/tests/joomla56-logo-fallback-raw-option-controls.php
          php .github/tests/joomla56-raw-picture-url-controls.php
          php .github/tests/joomla56-image-selection-admin-calendar-controls.php
          php .github/tests/joomla56-admin-raw-date-picture-server.php
          php .github/tests/joomla56-names-image-redirect-calendar-labels.php
          php .github/tests/joomla56-match-geocoder-calendar-controls.php
          php .github/tests/joomla56-federation-country-dropdown.php
          php .github/tests/joomla56-federation-edit-country-fallback.php
