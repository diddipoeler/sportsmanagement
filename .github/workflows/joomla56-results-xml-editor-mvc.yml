name: Joomla 5/6 results and XML editor MVC compatibility

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/ResultsController.php'
      - 'admin/src/Controller/SmextxmleditorsController.php'
      - '.github/tests/joomla56_results_mvc_models.php'
      - '.github/tests/joomla56_admin_xml_editor_model_options.php'
      - '.github/workflows/joomla56-results-xml-editor-mvc.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/ResultsController.php'
      - 'admin/src/Controller/SmextxmleditorsController.php'
      - '.github/tests/joomla56_results_mvc_models.php'
      - '.github/tests/joomla56_admin_xml_editor_model_options.php'
      - '.github/workflows/joomla56-results-xml-editor-mvc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mvc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint controllers and regression tests
        run: |
          php -l site/src/Controller/ResultsController.php
          php -l admin/src/Controller/SmextxmleditorsController.php
          php -l .github/tests/joomla56_results_mvc_models.php
          php -l .github/tests/joomla56_admin_xml_editor_model_options.php
      - name: Check mandatory source metadata
        run: |
          php .github/tests/phpdoc_metadata.php \
            site/src/Controller/ResultsController.php \
            admin/src/Controller/SmextxmleditorsController.php \
            .github/tests/joomla56_results_mvc_models.php \
            .github/tests/joomla56_admin_xml_editor_model_options.php
      - name: Check descriptive PHPDoc for named functions
        run: |
          php .github/scripts/check-php-function-docs.php \
            site/src/Controller/ResultsController.php \
            admin/src/Controller/SmextxmleditorsController.php \
            .github/tests/joomla56_results_mvc_models.php \
            .github/tests/joomla56_admin_xml_editor_model_options.php
      - name: Validate results model injection
        run: php .github/tests/joomla56_results_mvc_models.php
      - name: Validate administrator XML editor factory options
        run: php .github/tests/joomla56_admin_xml_editor_model_options.php
