name: Joomla 5/6 site admin module input regressions

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/ClubKmlHelper.php'
      - 'site/src/Helper/ProjectTitleHelper.php'
      - 'admin/src/Field/**'
      - 'modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php'
      - '.github/tests/joomla56_club_birthday_paths.php'
      - '.github/tests/joomla56_club_kml_coordinates_images.php'
      - '.github/tests/joomla56_project_titles_sql_preflight_count_rekord.php'
      - '.github/workflows/joomla56-site-admin-module-input-regressions.yml'
  pull_request:
    paths:
      - 'site/src/Helper/ClubKmlHelper.php'
      - 'site/src/Helper/ProjectTitleHelper.php'
      - 'admin/src/Field/**'
      - 'modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php'
      - '.github/tests/joomla56_club_birthday_paths.php'
      - '.github/tests/joomla56_club_kml_coordinates_images.php'
      - '.github/tests/joomla56_project_titles_sql_preflight_count_rekord.php'
      - '.github/workflows/joomla56-site-admin-module-input-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Verify PHP metadata and descriptive function PHPDoc
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/src/Helper/ClubKmlHelper.php
            site/src/Helper/ProjectTitleHelper.php
            admin/src/Field/ActeventtypeField.php
            admin/src/Field/EventField.php
            admin/src/Field/EventsField.php
            admin/src/Field/EventtypelistField.php
            admin/src/Field/AgegroupField.php
            admin/src/Field/AgegrouplistField.php
            admin/src/Field/AgegroupsField.php
            admin/src/Field/ActseasonField.php
            admin/src/Field/CurrentroundField.php
            admin/src/Field/ClubsField.php
            admin/src/Field/ClublistField.php
            modules/mod_sportsmanagement_club_birthday/src/Helper/ClubBirthdayHelper.php
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php .github/scripts/check-php-headers.php "${files[@]}"
          php .github/scripts/check-php-function-docs.php "${files[@]}"
      - name: Validate and run isolated input regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            .github/tests/joomla56_club_birthday_paths.php
            .github/tests/joomla56_club_kml_coordinates_images.php
            .github/tests/joomla56_project_titles_sql_preflight_count_rekord.php
          )
          for test in "${tests[@]}"; do
            php -l "$test"
            php "$test"
          done
