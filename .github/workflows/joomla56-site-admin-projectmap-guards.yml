name: Joomla 5/6 site updater admin tools and project map regressions

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Controller/UpdsportsmanagementController.php'
      - 'admin/src/Controller/DatabasetoolController.php'
      - 'admin/src/Model/DatabasetoolModel.php'
      - '.github/tests/joomla56_database_maintenance_input_types.php'
      - '.github/tests/joomla56_database_table_batch_guards.php'
      - '.github/tests/joomla56_database_exception_privacy.php'
      - '.github/tests/joomla56_database_diagnostic_inputs.php'
      - '.github/tests/joomla56_database_quote_import_inputs.php'
      - '.github/tests/joomla56_database_legacy_logger_privacy.php'
      - 'modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_site_updater_mvc_factory.php'
      - 'site/src/Model/UpdsportsmanagementModel.php'
      - '.github/tests/joomla56_updater_safe_errors.php'
      - '.github/tests/joomla56_admin_database_action_contract.php'
      - '.github/tests/joomla56_projectmap_optional_failure.php'
      - '.github/workflows/joomla56-site-admin-projectmap-guards.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Controller/UpdsportsmanagementController.php'
      - 'admin/src/Controller/DatabasetoolController.php'
      - 'admin/src/Model/DatabasetoolModel.php'
      - '.github/tests/joomla56_database_maintenance_input_types.php'
      - '.github/tests/joomla56_database_table_batch_guards.php'
      - '.github/tests/joomla56_database_exception_privacy.php'
      - '.github/tests/joomla56_database_diagnostic_inputs.php'
      - '.github/tests/joomla56_database_quote_import_inputs.php'
      - '.github/tests/joomla56_database_legacy_logger_privacy.php'
      - 'modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php'
      - '.github/tests/joomla56_site_updater_mvc_factory.php'
      - 'site/src/Model/UpdsportsmanagementModel.php'
      - '.github/tests/joomla56_updater_safe_errors.php'
      - '.github/tests/joomla56_admin_database_action_contract.php'
      - '.github/tests/joomla56_projectmap_optional_failure.php'
      - '.github/workflows/joomla56-site-admin-projectmap-guards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint modified PHP and regression tests
        run: |
          php -l site/src/Controller/UpdsportsmanagementController.php
          php -l site/src/Model/UpdsportsmanagementModel.php
          php -l .github/tests/joomla56_updater_safe_errors.php
          php -l admin/src/Controller/DatabasetoolController.php
          php -l admin/src/Model/DatabasetoolModel.php
          php -l .github/tests/joomla56_database_maintenance_input_types.php
          php -l .github/tests/joomla56_database_table_batch_guards.php
          php -l .github/tests/joomla56_database_exception_privacy.php
          php -l .github/tests/joomla56_database_diagnostic_inputs.php
          php -l .github/tests/joomla56_database_quote_import_inputs.php
          php -l .github/tests/joomla56_database_legacy_logger_privacy.php
          php -l modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php
          php -l .github/tests/joomla56_site_updater_mvc_factory.php
          php -l .github/tests/joomla56_admin_database_action_contract.php
          php -l .github/tests/joomla56_projectmap_optional_failure.php
      - name: Verify required PHP file attribution
        run: |
          php .github/tests/phpdoc_metadata.php \
            site/src/Controller/UpdsportsmanagementController.php \
            site/src/Model/UpdsportsmanagementModel.php \
            .github/tests/joomla56_updater_safe_errors.php \
            admin/src/Controller/DatabasetoolController.php \
            admin/src/Model/DatabasetoolModel.php \
            .github/tests/joomla56_database_maintenance_input_types.php \
            .github/tests/joomla56_database_table_batch_guards.php \
            .github/tests/joomla56_database_exception_privacy.php \
            .github/tests/joomla56_database_diagnostic_inputs.php \
            .github/tests/joomla56_database_quote_import_inputs.php \
            .github/tests/joomla56_database_legacy_logger_privacy.php \
            modules/mod_sportsmanagement_projectmap/src/Dispatcher/Dispatcher.php \
            .github/tests/joomla56_site_updater_mvc_factory.php \
            .github/tests/joomla56_admin_database_action_contract.php \
            .github/tests/joomla56_projectmap_optional_failure.php
      - name: Test site updater MVC factory and authorization
        run: php .github/tests/joomla56_site_updater_mvc_factory.php
      - name: Test safe form and database failure messages
        run: php .github/tests/joomla56_updater_safe_errors.php
      - name: Test administrator database tool model contracts
        run: php .github/tests/joomla56_admin_database_action_contract.php
      - name: Reject malformed database maintenance input
        run: php .github/tests/joomla56_database_maintenance_input_types.php
      - name: Test project map fallback without public errors
        run: php .github/tests/joomla56_projectmap_optional_failure.php
      - name: Reject malformed table maintenance batches before any query
        run: php .github/tests/joomla56_database_table_batch_guards.php
      - name: Protect administrator SQL exception privacy
        run: php .github/tests/joomla56_database_exception_privacy.php
      - name: Guard malformed database diagnostics
        run: php .github/tests/joomla56_database_diagnostic_inputs.php
      - name: Reject malformed legacy quote import definitions
        run: php .github/tests/joomla56_database_quote_import_inputs.php
      - name: Reject confidential SQL details in legacy maintenance logger
        run: php .github/tests/joomla56_database_legacy_logger_privacy.php
