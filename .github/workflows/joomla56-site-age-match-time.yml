name: Joomla 5/6 site age and live match regressions

on:
  push:
    branches:
      - joomla5-6
    paths:
      - 'site/src/Helper/PersonAgeHelper.php'
      - 'site/src/Helper/MatchTimeHelper.php'
      - '.github/tests/joomla56-site-age-match-time.php'
      - '.github/workflows/joomla56-site-age-match-time.yml'
  pull_request:
    paths:
      - 'site/src/Helper/PersonAgeHelper.php'
      - 'site/src/Helper/MatchTimeHelper.php'
      - '.github/tests/joomla56-site-age-match-time.php'
      - '.github/workflows/joomla56-site-age-match-time.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check syntax
        run: |
          php -l site/src/Helper/PersonAgeHelper.php
          php -l site/src/Helper/MatchTimeHelper.php
          php -l .github/tests/joomla56-site-age-match-time.php
      - name: Run isolated regression checks
        run: |
          php .github/tests/joomla56-site-age-match-time.php
          php -n .github/tests/joomla56-site-age-match-time.php
