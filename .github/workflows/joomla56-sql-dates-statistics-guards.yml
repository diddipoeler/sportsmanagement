name: Joomla 5/6 SQL match date and sport statistics regression

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/MatchTimeHelper.php'
      - 'admin/src/Service/XmlProjectPositionStatisticImportService.php'
      - 'modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php'
      - '.github/tests/joomla56-sql-dates-statistics-guards.php'
      - '.github/workflows/joomla56-sql-dates-statistics-guards.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check syntax and PHP file attribution
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/src/Helper/MatchTimeHelper.php \
            admin/src/Service/XmlProjectPositionStatisticImportService.php \
            modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php \
            .github/tests/joomla56-sql-dates-statistics-guards.php; do
            php -l "$file"
          done
          php .github/scripts/check-php-headers.php \
            site/src/Helper/MatchTimeHelper.php \
            admin/src/Service/XmlProjectPositionStatisticImportService.php \
            modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php \
            .github/tests/joomla56-sql-dates-statistics-guards.php
      - name: Require descriptive PHPDocs
        run: |
          php .github/scripts/check-php-function-docs.php \
            site/src/Helper/MatchTimeHelper.php \
            admin/src/Service/XmlProjectPositionStatisticImportService.php \
            modules/mod_sportsmanagement_sports_type_statistics/src/Helper/SportsTypeStatisticsHelper.php \
            .github/tests/joomla56-sql-dates-statistics-guards.php
      - name: Run real implementation regression tests
        run: |
          set -euo pipefail
          php .github/tests/joomla56-sql-dates-statistics-guards.php
          php .github/tests/joomla56-site-age-match-time.php
          php .github/tests/joomla56_matchtime_geocoder_liveticker_guards.php
          php .github/tests/joomla56_sports_type_statistics_scope.php
          php .github/tests/joomla56_sports_type_statistics_relations.php
          php .github/tests/joomla56_sports_type_statistics_playgrounds.php
