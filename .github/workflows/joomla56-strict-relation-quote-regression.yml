name: Joomla 5/6 strict match XML relation IDs and bounded quotes

'on':
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/MatchResultHelper.php'
      - 'admin/src/Service/XmlPositionEventTypeImportService.php'
      - 'modules/mod_sportsmanagement_rquotes/src/Helper/QuoteText.php'
      - '.github/tests/joomla56-strict-relation-quote-regression.php'
      - '.github/workflows/joomla56-strict-relation-quote-regression.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-relation-ids:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint runtime sources and test fixture
        run: |
          set -euo pipefail
          php -l site/src/Helper/MatchResultHelper.php
          php -l admin/src/Service/XmlPositionEventTypeImportService.php
          php -l modules/mod_sportsmanagement_rquotes/src/Helper/QuoteText.php
          php -l .github/tests/joomla56-strict-relation-quote-regression.php
      - name: Verify file attribution and meaningful method documentation
        run: |
          set -euo pipefail
          php .github/scripts/check-php-headers.php \
            site/src/Helper/MatchResultHelper.php \
            admin/src/Service/XmlPositionEventTypeImportService.php \
            modules/mod_sportsmanagement_rquotes/src/Helper/QuoteText.php \
            .github/tests/joomla56-strict-relation-quote-regression.php
          php .github/scripts/check-php-function-docs.php \
            site/src/Helper/MatchResultHelper.php \
            admin/src/Service/XmlPositionEventTypeImportService.php \
            modules/mod_sportsmanagement_rquotes/src/Helper/QuoteText.php
      - name: Test strict IDs and quote rendering without Joomla bootstrap
        run: |
          set -euo pipefail
          php .github/tests/joomla56-strict-relation-quote-regression.php
          php .github/tests/joomla56_match_outcome_actionlog_toptipper.php
          php .github/tests/joomla56_rquotes_output_encoding.php
