name: Joomla 5/6 team and person presentation regression

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'site/src/Helper/TeamPresentationHelper.php'
      - 'site/src/Helper/NamePresentationHelper.php'
      - '.github/tests/joomla56-team-presentation-fields.php'
      - '.github/tests/joomla56-team-action-slug-guards.php'
      - '.github/workflows/joomla56-team-person-presentation.yml'
  pull_request:
    branches: [joomla5-6, master]
    paths:
      - 'site/src/Helper/TeamPresentationHelper.php'
      - 'site/src/Helper/NamePresentationHelper.php'
      - '.github/tests/joomla56-team-presentation-fields.php'
      - '.github/tests/joomla56-team-action-slug-guards.php'
      - '.github/workflows/joomla56-team-person-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint Joomla 5/6 presentation helpers and regression
        run: |
          php -l site/src/Helper/TeamPresentationHelper.php
          php -l site/src/Helper/NamePresentationHelper.php
          php -l .github/tests/joomla56-team-presentation-fields.php
          php -l .github/tests/joomla56-team-action-slug-guards.php
      - name: Enforce PHPDoc in team, person and regression fixtures
        run: |
          php .github/scripts/check-php-function-docs.php site/src/Helper/TeamPresentationHelper.php site/src/Helper/NamePresentationHelper.php .github/tests/joomla56-team-presentation-fields.php .github/tests/joomla56-team-action-slug-guards.php
      - name: Run presentation regressions with and without PHP extensions
        run: |
          php .github/tests/joomla56-team-presentation-fields.php
          php -n .github/tests/joomla56-team-presentation-fields.php
          php .github/tests/joomla56-team-action-slug-guards.php
          php -n .github/tests/joomla56-team-action-slug-guards.php
