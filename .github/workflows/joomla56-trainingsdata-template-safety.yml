name: Joomla 5/6 TrainingsData template safety

on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_trainingsdata/tmpl/default.php'
      - '.github/tests/joomla56_trainingsdata_template_guards.php'
      - '.github/workflows/joomla56-trainingsdata-template-safety.yml'
  pull_request:
    branches: [master, joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_trainingsdata/tmpl/default.php'
      - '.github/tests/joomla56_trainingsdata_template_guards.php'
      - '.github/workflows/joomla56-trainingsdata-template-safety.yml'

permissions:
  contents: read

jobs:
  template-safety:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint module layout and fixture
        run: |
          php -l modules/mod_sportsmanagement_trainingsdata/tmpl/default.php
          php -l .github/tests/joomla56_trainingsdata_template_guards.php
      - name: Render malformed legacy training data
        run: php .github/tests/joomla56_trainingsdata_template_guards.php
      - name: Enforce file attribution and documented functions
        run: |
          php .github/scripts/check-php-headers.php modules/mod_sportsmanagement_trainingsdata/tmpl/default.php
          php .github/scripts/check-php-function-docs.php modules/mod_sportsmanagement_trainingsdata/tmpl/default.php .github/tests/joomla56_trainingsdata_template_guards.php
