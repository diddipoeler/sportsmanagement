name: Joomla 5/6 UEFA and training module error privacy
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'modules/mod_sportsmanagement_uefawertung/src/Helper/UefaWertungHelper.php'
      - 'modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php'
      - '.github/tests/joomla56_club_merge_roster_country_uefa.php'
      - '.github/tests/joomla56_projectteam_trainingsdata_security.php'
      - '.github/workflows/joomla56-uefa-training-error-privacy.yml'
  pull_request:
    paths:
      - 'modules/mod_sportsmanagement_uefawertung/src/Helper/UefaWertungHelper.php'
      - 'modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php'
      - '.github/tests/joomla56_club_merge_roster_country_uefa.php'
      - '.github/tests/joomla56_projectteam_trainingsdata_security.php'
      - '.github/workflows/joomla56-uefa-training-error-privacy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
      - name: Validate module metadata and PHP syntax
        run: |
          php .github/scripts/check-php-function-docs.php modules/mod_sportsmanagement_uefawertung/src/Helper/UefaWertungHelper.php modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php
          php .github/tests/phpdoc_metadata.php modules/mod_sportsmanagement_uefawertung/src/Helper/UefaWertungHelper.php modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php
          php -l modules/mod_sportsmanagement_uefawertung/src/Helper/UefaWertungHelper.php
          php -l modules/mod_sportsmanagement_trainingsdata/src/Helper/TrainingsDataHelper.php
          php -l .github/tests/joomla56_club_merge_roster_country_uefa.php
          php -l .github/tests/joomla56_projectteam_trainingsdata_security.php
      - name: Verify module selector and database error privacy
        run: |
          php .github/tests/joomla56_club_merge_roster_country_uefa.php
          php .github/tests/joomla56_projectteam_trainingsdata_security.php
