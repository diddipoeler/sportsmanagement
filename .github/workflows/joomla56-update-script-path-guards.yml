name: Joomla 5/6 update script path guards
on:
  push:
    branches: [joomla5-6]
    paths:
      - 'admin/src/Controller/UpdateController.php'
      - 'admin/src/Model/UpdatesModel.php'
      - '.github/tests/joomla56_update_script_paths.php'
      - '.github/workflows/joomla56-update-script-path-guards.yml'
  pull_request:
    branches: [joomla5-6, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate PHP syntax and metadata
        run: |
          php -l admin/src/Controller/UpdateController.php
          php -l admin/src/Model/UpdatesModel.php
          php -l .github/tests/joomla56_update_script_paths.php
          php .github/tests/phpdoc_metadata.php admin/src/Controller/UpdateController.php admin/src/Model/UpdatesModel.php .github/tests/joomla56_update_script_paths.php
      - name: Run update path regression
        run: php .github/tests/joomla56_update_script_paths.php
