name: Migrate admin match write bridge

on:
  push:
    branches:
      - joomla5-6
    paths:
      - .github/workflows/migrate-admin-match-write-bridge.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: joomla5-6
          fetch-depth: 0

      - name: Replace legacy match write methods with native service bridges
        shell: bash
        run: |
          set -euo pipefail
          model=admin/models/match.php
          expected=737d64d9d3aae722715633c10870c47949f55119
          actual=$(git hash-object "$model")
          test "$actual" = "$expected" || { echo "Unexpected admin match model blob: $actual" >&2; exit 1; }

          php -l admin/src/Service/MatchWriteService.php
          php -l admin/src/Service/MatchTimelineWriteService.php
          php -l admin/src/Service/MatchRefereeNotificationService.php

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('admin/models/match.php')
          text = path.read_text()

          def find_matching_brace(source: str, opening: int) -> int:
              depth = 0
              i = opening
              state = 'code'
              quote = ''
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if c in ('\"', "'"):
                          state = 'string'; quote = c
                      elif c == '/' and n == '/':
                          state = 'line'; i += 1
                      elif c == '#':
                          state = 'line'
                      elif c == '/' and n == '*':
                          state = 'block'; i += 1
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  elif state == 'string':
                      if c == '\\':
                          i += 1
                      elif c == quote:
                          state = 'code'
                  elif state == 'line':
                      if c == '\n':
                          state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/':
                          state = 'code'; i += 1
                  i += 1
              raise RuntimeError('Unbalanced function body')

          def replace_function(name: str, replacement: str) -> None:
              global text
              pattern = re.compile(r'(?m)^[ \t]*(?:public\s+static\s+|public\s+|protected\s+|private\s+|static\s+)?function\s+' + re.escape(name) + r'\s*\([^)]*\)\s*')
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise RuntimeError(f'{name}: expected exactly one function, got {len(matches)}')
              start = matches[0].start()
              opening = text.find('{', matches[0].end())
              if opening < 0:
                  raise RuntimeError(f'{name}: opening brace not found')
              end = find_matching_brace(text, opening)
              text = text[:start] + replacement.rstrip() + text[end + 1:]

          replacements = {
              'savestats': '''\tfunction savestats($data)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn $this->matchWriteService()->saveStatistics((array) $data);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\treturn $this->reportNativeWriteFailure($e);\n\t\t}\n\t}''',
              'updateRoster': '''\tfunction updateRoster($post)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn $this->matchWriteService()->updateRoster((array) $post);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\treturn $this->reportNativeWriteFailure($e);\n\t\t}\n\t}''',
              'updateStaff': '''\tfunction updateStaff($post)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn $this->matchWriteService()->updateStaff((array) $post);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\treturn $this->reportNativeWriteFailure($e);\n\t\t}\n\t}''',
              'updateReferees': '''\tfunction updateReferees($post)\n\t{\n\t\t$post = (array) $post;\n\t\ttry\n\t\t{\n\t\t\t$result = $this->matchWriteService()->updateReferees($post);\n\t\t\tif (!$result['success'])\n\t\t\t{\n\t\t\t\treturn false;\n\t\t\t}\n\n\t\t\t$this->matchRefereeNotificationService()->notifyNewAssignments((int) ($post['id'] ?? 0), $result['added']);\n\t\t\treturn true;\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\treturn $this->reportNativeWriteFailure($e);\n\t\t}\n\t}''',
              'savesubstitution': '''\tpublic static function savesubstitution($data)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn self::matchTimelineWriteService()->saveSubstitution((array) $data);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\tself::reportNativeStaticWriteFailure($e);\n\t\t\treturn false;\n\t\t}\n\t}''',
              'removeSubstitution': '''\tpublic static function removeSubstitution($substitution_id)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn self::matchTimelineWriteService()->removeSubstitution((int) $substitution_id);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\tself::reportNativeStaticWriteFailure($e);\n\t\t\treturn false;\n\t\t}\n\t}''',
              'deleteevent': '''\tpublic static function deleteevent($event_id)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn self::matchTimelineWriteService()->deleteEvent((int) $event_id);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\tself::reportNativeStaticWriteFailure($e);\n\t\t\treturn false;\n\t\t}\n\t}''',
              'deletecommentary': '''\tpublic static function deletecommentary($event_id)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn self::matchTimelineWriteService()->deleteCommentary((int) $event_id);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\tself::reportNativeStaticWriteFailure($e);\n\t\t\treturn false;\n\t\t}\n\t}''',
              'savecomment': '''\tpublic static function savecomment($data)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn self::matchTimelineWriteService()->saveComment((array) $data);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\tself::reportNativeStaticWriteFailure($e);\n\t\t\treturn false;\n\t\t}\n\t}''',
              'saveevent': '''\tpublic static function saveevent($data)\n\t{\n\t\ttry\n\t\t{\n\t\t\treturn self::matchTimelineWriteService()->saveEvent((array) $data);\n\t\t}\n\t\tcatch (\\Throwable $e)\n\t\t{\n\t\t\tself::reportNativeStaticWriteFailure($e);\n\t\t\treturn false;\n\t\t}\n\t}''',
          }

          for name, replacement in replacements.items():
              replace_function(name, replacement)

          helpers = r'''

	private static function nativeMatchWriteDatabase(): \Joomla\Database\DatabaseInterface
	{
		$app = Factory::getApplication();
		$input = $app->getInput();
		$selector = $input->getInt(
			'cfg_which_database',
			(int) $app->getUserState('com_sportsmanagement.cfg_which_database', 0)
		);

		try
		{
			$db = sportsmanagementHelper::getDBConnection(true, $selector);
			if ($db instanceof \Joomla\Database\DatabaseInterface)
			{
				return $db;
			}
		}
		catch (\Throwable)
		{
		}

		return Factory::getContainer()->get(\Joomla\Database\DatabaseInterface::class);
	}

	private function matchWriteService(): \Diddipoeler\Component\SportsManagement\Administrator\Service\MatchWriteService
	{
		return new \Diddipoeler\Component\SportsManagement\Administrator\Service\MatchWriteService(self::nativeMatchWriteDatabase());
	}

	private static function matchTimelineWriteService(): \Diddipoeler\Component\SportsManagement\Administrator\Service\MatchTimelineWriteService
	{
		return new \Diddipoeler\Component\SportsManagement\Administrator\Service\MatchTimelineWriteService(self::nativeMatchWriteDatabase());
	}

	private function matchRefereeNotificationService(): \Diddipoeler\Component\SportsManagement\Administrator\Service\MatchRefereeNotificationService
	{
		return new \Diddipoeler\Component\SportsManagement\Administrator\Service\MatchRefereeNotificationService(
			self::nativeMatchWriteDatabase(),
			Factory::getContainer()->get(\Joomla\CMS\Mail\MailerFactoryInterface::class),
			Factory::getApplication()
		);
	}

	private function reportNativeWriteFailure(\Throwable $e): bool
	{
		Log::add($e->getMessage(), Log::ERROR, 'jsmerror');
		Factory::getApplication()->enqueueMessage(
			Text::sprintf('COM_SPORTSMANAGEMENT_DATABASE_ERROR_FUNCTION_FAILED', $e->getCode(), $e->getMessage()),
			'notice'
		);
		return false;
	}

	private static function reportNativeStaticWriteFailure(\Throwable $e): void
	{
		Log::add($e->getMessage(), Log::ERROR, 'jsmerror');
		Factory::getApplication()->enqueueMessage(
			Text::sprintf('COM_SPORTSMANAGEMENT_DATABASE_ERROR_FUNCTION_FAILED', $e->getCode(), $e->getMessage()),
			'notice'
		);
	}
'''

          if 'private static function nativeMatchWriteDatabase' in text:
              raise RuntimeError('Native write helpers already exist unexpectedly')
          final = text.rfind('}')
          if final < 0:
              raise RuntimeError('Class closing brace not found')
          text = text[:final] + helpers + '\n' + text[final:]
          path.write_text(text)
          PY

          php -l "$model"

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('admin/models/match.php').read_text()
          names = ['savestats','updateRoster','updateStaff','updateReferees','savesubstitution','removeSubstitution','deleteevent','deletecommentary','savecomment','saveevent']
          forbidden = re.compile(r'Factory::getDbo\(|Factory::getDBO\(|Factory::getUser\(|Factory::getMailer\(|Factory::getConfig\(|Table::getInstance\(|ereg\(|->disconnect\(|insertObject\(|updateObject\(|->delete\(')

          def body(name):
              m = re.search(r'(?m)^[ \t]*(?:public\s+static\s+|public\s+|protected\s+|private\s+|static\s+)?function\s+' + re.escape(name) + r'\s*\([^)]*\)\s*\{', text)
              if not m:
                  raise SystemExit(f'missing {name}')
              start = m.end() - 1
              depth = 0
              i = start
              state = 'code'; quote = ''
              while i < len(text):
                  c = text[i]; n = text[i+1] if i+1 < len(text) else ''
                  if state == 'code':
                      if c in ('\"', "'"): state='string'; quote=c
                      elif c == '/' and n == '/': state='line'; i += 1
                      elif c == '#': state='line'
                      elif c == '/' and n == '*': state='block'; i += 1
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return text[start:i+1]
                  elif state == 'string':
                      if c == '\\': i += 1
                      elif c == quote: state='code'
                  elif state == 'line':
                      if c == '\n': state='code'
                  elif state == 'block':
                      if c == '*' and n == '/': state='code'; i += 1
                  i += 1
              raise SystemExit(f'unbalanced {name}')

          for name in names:
              b = body(name)
              hit = forbidden.search(b)
              if hit:
                  raise SystemExit(f'{name} still contains forbidden legacy write API: {hit.group(0)}')

          required = {
              'savestats': 'matchWriteService()->saveStatistics',
              'updateRoster': 'matchWriteService()->updateRoster',
              'updateStaff': 'matchWriteService()->updateStaff',
              'updateReferees': 'matchWriteService()->updateReferees',
              'savesubstitution': 'matchTimelineWriteService()->saveSubstitution',
              'removeSubstitution': 'matchTimelineWriteService()->removeSubstitution',
              'deleteevent': 'matchTimelineWriteService()->deleteEvent',
              'deletecommentary': 'matchTimelineWriteService()->deleteCommentary',
              'savecomment': 'matchTimelineWriteService()->saveComment',
              'saveevent': 'matchTimelineWriteService()->saveEvent',
          }
          for name, needle in required.items():
              if needle not in body(name):
                  raise SystemExit(f'{name} does not delegate to {needle}')
          PY

      - name: Commit only if branch did not move
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin joomla5-6
          test "$(git rev-parse origin/joomla5-6)" = "$GITHUB_SHA" || { echo 'Remote branch moved during migration' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/migrate-admin-match-write-bridge.yml
          git add admin/models/match.php
          git commit -m 'Delegate legacy admin match writes to Joomla 5/6 services'
          git push origin HEAD:joomla5-6
